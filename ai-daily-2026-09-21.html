      Max-Age=31536000; Path=/; SameSite=none; Secure\n`\n`SameSite=none` 与 `Secure` 是 cookie 在跨站请求中被发送所需的配置。`Max-Age` 为一年。JWT 中的 `obi` 值与 cookie 中的值完全相同。\n\n第 3 步。广告主网站将其回传。\n\n有三类请求会从广告主的页面发往 OpenAI 的主机。在一台 jar 中含有 `__obi` 的手机上，这三类请求都携带了它：\n    请求 携带了 `__obi` 备注     `GET bzrcdn.openai.com/sdk/oaiq.min.js` 是 脚本本身的加载   `POST bzr.openai.com/v1/sdk/events` 与 `obref` 是 转化事件   `POST bzr.openai.com/v1/sdk/events`，裸请求体 是 该 SDK 的“无凭据”路径   `GET bzrcdn.openai.com/pixel-config/…` 完全没有 cookie 头 对照组\n第一行尤其值得关注。像素 SDK 有一条省略凭据的代码路径，但这无济于事：在 OpenAI 的任何代码运行之前，浏览器就已经把 cookie 附加到了加载该 SDK 的 `\u003cscript src\u003e` 请求上。仅仅因为加载了这个标签，标识符就被泄露了。\n\n随之传输的内容\n\n同一个 SDK 还会从广告主的页面上收集身份信息。其载荷将四个来源分开，并由 OpenAI 自己标注：`in` 对应广告主有意传入的值，而 `fm`、`ht`、`js` 则对应 SDK 从表单字段、渲染后的页面文本以及标签管理器总线中抓取的值。在观测到的流量中，抓取到的身份信息数量超过了广告主提供的身份信息，分别为 685 个事件对 255 个。\n\n标签管理器总线是电子邮件最大的来源。该 SDK 替换了`window.dataLayer.push`用自己的函数，还读取`adobeDataLayer`，并通过解析`l=`参数（来自`gtm.js`script 标签）来定位被重命名的 GTM 层。当前版本从中获取电子邮件和电话。0.1.31 版本在 8 月 27 日缩小范围之前，还获取了姓名和地理位置。\n\n电子邮件、电话、名字和姓氏在传输前均经过 SHA-256 哈希处理。国家、地区、城市和邮政编码则以明文发送。邮政编码是被收集最多的表单字段，在 28 个网站上共发生 100 次事件。\n\nURL 在发送前会被缩减为源站加路径；在观测到的 23,929 个 URL 中，没有一个携带查询字符串。路径得以保留，而到达收集器的路径中包括一种医疗状况、一个债务解决方案漏斗以及一份诉讼受理表单。\n\n在 881 个已知设置的像素中，有 638 个启用了自动匹配，包括所有观察到的信贷和借贷广告主。它由 OpenAI 的 Ads Manager 控制。一份拒绝名单排除了密码、一次性验证码、卡号、SSN、出生日期、病史、诊断和法院相关字段。\n\n该 cookie 被设计为可跨站点使用\n\n在相同的广告主页面请求中，浏览器屏蔽了所有其他 OpenAI cookie：\n    Cookie 结果     `oai-did`、`oaicom-stable-id` 已拦截，`SameSite=Lax`   `oai-client-auth-info`，会话 cookie 已拦截，域名不匹配   `__obi` 已发送\n`__obi` 是唯一配置了 `SameSite=None` 的 OpenAI 标识符。\n\n观测到的触达范围\n\n在我的设备上，一个 `__obi` 值从 12 个商业网站通过 13 个不同的像素 ID 被发送至 OpenAI，其中包括 Chewy、Wayfair、ThriftBooks、Eventbrite、HelloFresh、Coursera 和 SeatGeek。每个请求都以 `202` 被接受。\n\n在更广泛的流量中，30 个不同的 `__obi` 值中有 12 个出现在不止一个广告主名下，其中一个出现在十个广告主名下。\n\n在你登出状态下它依然有效\n\n在 932 个已解码的同步 token 中，736 个携带 `subject_type: account_user`，196 个携带 `anonymous`。匿名主体与账户主体一样稳定：每台设备一个，至少持续 27 天。\n\nOpenAI 的 cookie 政策怎么说\n\nOpenAI 将 `__obi` 列在分析类 Cookie 下，有效期一年，出现在 `chatgpt.com` 和 `openai.com` 上。它是该栏目中唯一的条目。该政策将分析类 Cookie 描述为帮助 OpenAI 了解其服务的表现及使用情况。\n\nOpenAI 将分析类和营销类作为两个独立的同意选项来运行，即 `oai_consent_analytics` 和 `oai_consent_marketing`，而我解码的每一个同步 token 都带有 `consent_decision: analytics_allowed`。允许分析类但拒绝营销类的人就会得到这个。\n\nOpenAI 的回应\n\n我于 9 月 14 日将相关机制和两个问题发送至 press@openai.com 和 privacy@openai.com：为什么 `__obi` 被归类为分析类 cookie，以及一个授予分析同意但拒绝营销同意的用户是否仍会收到它。回复来自 OpenAI Support。它确认收到了询问，表示相关观察结果将在内部共享以供审查，但没有回答这两个问题中的任何一个。上述脚本加载观察是在询问发出之后做出的。如果 OpenAI 作出回应，我将更新本文。\n\n局限\n\n浏览器。 在 Android 版 Chrome 上观察到。\n\nHow it works\n\nStep 1. ChatGPT creates an identifier and signs it.\n\nOn `chatgpt.com`, the client generates 16 random bytes and calls `POST /backend-api/bazaar/obi/sync-token` (or `/backend-anon/` when signed out). The backend returns an RS256 JWT:\n\n`{\n\n}\n`\n`sub` is the account. `obi` is the identifier. The token binds them, is scoped to the collector, and expires in 60 seconds. `bzr` stands for `bazaar`, OpenAI's internal name for the ads platform; `wadi` is the issuing service.\n\nStep 2. The identifier becomes a cookie on OpenAI's domain.\n\nThe client POSTs `{\n}` cross-site to `bzr.openai.com/v1/obi/sync`. The response:\n\n`Set-Cookie: __obi=«redacted»; Domain=.openai.com; HttpOnly;\n            Max-Age=31536000; Path=/; SameSite=none; Secure\n`\n`SameSite=none` with `Secure` is the configuration a cookie needs to be sent on cross-site requests. `Max-Age` is one year. The `obi` value in the JWT and the value in the cookie are identical.\n\nStep 3. Advertiser sites send it back.\n\nThree request classes go from an advertiser's page to OpenAI's hosts. On a phone with `__obi` in the jar, all three carried it:\n    Request Carried `__obi` Notes     `GET bzrcdn.openai.com/sdk/oaiq.min.js` yes the script load itself   `POST bzr.openai.com/v1/sdk/events` with `obref` yes conversion events   `POST bzr.openai.com/v1/sdk/events`, bare body yes the SDK's\n path   `GET bzrcdn.openai.com/pixel-config/…` no cookie header at all control\nThe first row is particularly interesting. The pixel SDK has a code path that omits credentials, and it does not help: the browser attaches cookies to the `\u003cscript src\u003e` request that loads the SDK before any of OpenAI's code runs. By the virtue of loading the tag the identifier is disclosed.\n\nWhat travels with it\n\nThe same SDK also collects identity from the advertiser's page. The payload separates four sources, labelled by OpenAI itself: `in` for values the advertiser passes deliberately, and `fm`, `ht`, `js` for values the SDK scrapes from form fields, rendered page text, and the tag-manager bus. In observed traffic, scraped identity outnumbered advertiser-supplied identity 685 events to 255.\n\nThe tag-manager bus is the largest source of email. The SDK replaces `window.dataLayer.push` with its own function, also reads `adobeDataLayer`, and locates renamed GTM layers by parsing the `l=` parameter off the `gtm.js` script tag. Current versions take email and phone from it. Version 0.1.31 also took names and geography before the scope was narrowed on 27 August.\n\nEmail, phone, first and last name are SHA-256 hashed before transmission. Country, region, city and postal code are sent in the clear. Postal code was the most-harvested form field, 100 events across 28 sites.\n\nURLs are reduced to origin plus path before sending; none of 23,929 observed carried a query string. Paths survive, and paths reaching the collector included a medical condition, a debt-solutions funnel and a litigation intake form.\n\nAutomatic matching was enabled for 638 of 881 pixels with a known setting, including every credit and lending advertiser observed. It is controlled from OpenAI's Ads Manager. A denylist excludes passwords, one-time codes, card numbers, SSN, date of birth, medical history, diagnosis and court fields.\n\nThe cookie is built to cross sites\n\nOn the same advertiser-page requests, every other OpenAI cookie was blocked by the browser:\n    Cookie Outcome     `oai-did`, `oaicom-stable-id` blocked, `SameSite=Lax`   `oai-client-auth-info`, session cookies blocked, domain mismatch   `__obi` sent\n`__obi` is the only OpenAI identifier configured with `SameSite=None`.\n\nObserved reach\n\nOn my device, one `__obi` value was sent to OpenAI from 12 commercial websites under 13 distinct pixel IDs, including Chewy, Wayfair, ThriftBooks, Eventbrite, HelloFresh, Coursera and SeatGeek. Every request was accepted with `202`.\n\nIn the broader traffic, 12 of 30 distinct `__obi` values appeared under more than one advertiser, one under ten.\n\nIt works when you are logged out\n\nAcross 932 decoded sync tokens, 736 carried `subject_type: account_user` and 196 carried `anonymous`. The anonymous subject is as stable as the account subject: one per device, persisting at least 27 days.\n\nWhat OpenAI's cookie policy says\n\nOpenAI's lists `__obi` under Analytics cookies, one year, on `chatgpt.com` and `openai.com`. It is the only entry in that section. The policy describes analytics cookies as helping OpenAI understand how its services perform and are used.\n\nOpenAI runs analytics and marketing as two separate consent choices, `oai_consent_analytics` and `oai_consent_marketing`, and every sync token I decoded carried `consent_decision: analytics_allowed`. Someone who allows analytics and refuses marketing gets this.\n\nOpenAI's response\n\nI sent the mechanism and two questions to press@openai.com and privacy@openai.com on 14 September: why `__obi` is classified as an analytics cookie, and whether a user who grants analytics consent and refuses marketing consent still receives it. The reply came from OpenAI Support. It acknowledged the inquiry, said the observations would be shared internally for review, and did not answer either question. The script-load observation above was made after the inquiry was sent. I will update this post if OpenAI responds.\n\nLimits\n\nBrowsers. Observed on Chrome for Android. \u003ca href="}]}]};
function pad(n){return n<10?"0"+n:""+n;}
function toBeijingHuman(iso, ref, exact){
  const d=new Date(iso); const bj=new Date(d.getTime()+8*3600*1000);
  const Y=bj.getUTCFullYear(),M=bj.getUTCMonth()+1,D=bj.getUTCDate();
  const h=bj.getUTCHours(),m=bj.getUTCMinutes(); const hh=pad(h),mm=pad(m);
  if(!exact) return M+"月"+D+"日";
  const [rY,rM,rD]=ref.split("-").map(Number);
  if(Y===rY&&M===rM&&D===rD) return "今天 "+hh+":"+mm;
  const yest=new Date(rY,rM-1,rD); yest.setDate(yest.getDate()-1);
  if(Y===yest.getFullYear()&&M===yest.getMonth()+1&&D===yest.getDate()) return "昨天 "+hh+":"+mm;
  return M+"月"+D+"日 "+hh+":"+mm;
}

function escapeHtml(s){return (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

// 渲染正文（纯文本归档）：图片不加载远程资源，仅以文字占位符呈现；其余文本按段落转义（防 XSS）
function linkify(escaped){
  if(!escaped) return escaped;
  var re=/(\[[^\]]+\]\((https?:\/\/[^)\s]+)\))|(https?:\/\/[^\s<>"'）】」』，。、；：！？]+)/g;
  return escaped.replace(re, function(m, g1, g2, g3){
    if(g2!==undefined){
      var label=m.substring(m.indexOf('[')+1, m.indexOf(']'));
      return '<a class="r-link" href="'+g2+'" target="_blank" rel="noopener noreferrer">'+label+'</a>';
    }
    if(g3!==undefined){
      return '<a class="r-link" href="'+g3+'" target="_blank" rel="noopener noreferrer">'+g3+'</a>';
    }
    return m;
  });
}
var _IMG_RE=/!\[([^\]]*)\]\(([^)\s]+)\)/g;
function renderRich(text){
  return (text||"").split(/\n{1,}/).map(function(p){
    p=p.trim(); if(!p) return '';
    var out=''; var last=0; var m; _IMG_RE.lastIndex=0;
    while((m=_IMG_RE.exec(p))!==null){
      out+=linkify(escapeHtml(p.slice(last,m.index)));
      var cap=(m[1]||'').trim()||'图片';
      out+='<span class="r-img-cap">🖼 '+escapeHtml(cap)+'</span>';
      last=_IMG_RE.lastIndex;
    }
    out+=linkify(escapeHtml(p.slice(last)));
    return '<p>'+out+'</p>';
  }).join("");
}

    if(sum){
      // 来源站点多为付费墙 / 登录墙 / 反爬限制，无法镜像全文；展示已本地存档的中文摘要兜底
      body.innerHTML='<div class="r-fallback">⚠️ 该条新闻的<b>全文镜像暂不可用</b>（来源站点可能为付费墙 / 登录墙 / 反爬限制，或原文已失效）。下方为已<b>本地存档的中文摘要</b>，可正常查看；完整原文请点击右下角「查看原文 ↗」。</div>'+
        '<p class="r-summary">'+linkify(escapeHtml(sum))+'</p>';
    }else{
      body.innerHTML='<p class="r-empty">暂未获取到该条新闻的全文镜像与摘要。'+(it.url?'可点击右下角「查看原文 ↗」前往原始报道。':'')+'</p>';
    }
  }
  document.getElementById("readerTitle").textContent=it.title;
  document.getElementById("readerSource").textContent=it.source;
  const link=document.getElementById("readerLink");
  if(it.url){link.href=it.url;link.style.display="";}else{link.style.display="none";}
  r.hidden=false;document.body.style.overflow="hidden";
}
function closeReader(){const r=document.getElementById("reader");r.hidden=true;document.body.style.overflow="";}
document.getElementById("reader").addEventListener("click",function(e){if(e.target===this)closeReader();});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeReader();});
</script>
</body></html>
