主到场分享。这是一场真正意义上的国家级、国际顶级AI盛会。\n\n方汉：2026是“世界模型元年”，三大产业预判锚定未来方向 在论坛主旨演讲环节，昆仑万维董事长兼CEO方汉正式宣布2026年为“世界模型元年” 。他指出，过去两年AI行业的核心命题是“生成”——生成文字、图像、视频、音乐。而从2026年开始，AI的核心命题将转向“理解”与“交互”——让AI真正理解物理世界的运行规律，并能与真实环境进行闭环互动。世界模型正是实现这一跨越的关键技术底座。昆仑万维董事长兼CEO方汉 方汉在演讲中系统阐述了三大产业预判： 第一，世界模型将走出屏幕，进入物理世界。\n\n我们洞察到，具身智能正从实验室走向真实环境，这一趋势要求机器人在行动前先进行环境推演——预判动作后果、评估环境变化、及时调整应对策略。这种能力的突破，将使竞争焦点从单一任务转向陌生环境下的通用模型能力；谁能训练出在复杂场景中依然“看得懂、做得对”的模型，谁就拿到物理智能时代的入场券，这也是中国智能制造和机器人产业真正亟需的底层能力。第二，游戏行业将率先被世界模型改变。开放世界游戏不再依赖数百人团队数年的手工搭建，Matrix-Game 3.5 让虚拟世界随玩家行动实时生长、持续演化。未来三到五年，世界模型将成为游戏行业的基础设施，彻底刷新内容生产方式，而国产模型已在这一赛道领跑全球。\n\n第三，AI音乐、AI视频等工具将从技术试验变成大众创作工具，促进 AIGC 的深层发展。Mureka 作为中国最强、全球前两名的音乐生成模型，率先去除“AI味”，让普通人也能把模糊灵感转化为有情绪、有温度的作品。这并非替代音乐人，而是大幅降低创作门槛，让更多人的表达得以释放，从而根本性改变音乐乃至整个 AIGC 产业的创作生态。三个产业预判，背后是同一个方向：让AI从“会生成”走向\"懂世界\"、\"能行动\"。方汉表示，这不只是昆仑万维一家公司的回答，更是中国AI从研发走向产业应用的一个缩影。\n\nAI模型全球升级，掀起全模态内容生成革命 本次论坛上，昆仑万维集中完成了核心模型的全球重磅升级。作为昆仑万维世界模型系列的最新迭代，Matrix-Game 3.5在本次论坛上带来了革命性的技术升级。Skywork首席科学家成宇在论坛上正式发布了Matrix-Game 3.5世界模型。Matrix-Game 3.5聚焦可交互世界模型技术，实现了Patch级别的记忆注入与系统级性能优化，5B模型在720p分辨率下可实现单卡20FPS实时生成，具备1分钟记忆能力。\n\nSkywork首席科学家成宇 成宇指出，世界模型是具身智能的“无限数据引擎”。传统数据采集面临人工成本高昂、实机采集耗时耗力、效率极低的痛点，无法满足大模型规模化需求。Matrix-Game 3.5构建了支撑下一代世界模型的无限数据生产体系，突破传统瓶颈，打造三条自动化数据生产管线，输出Video+Pose+Action+Language的高质量训练数据，目前已积累超500万高质量视频切片、超1万有效训练小时数、覆盖1200余个游戏场景。\n\n在技术架构上，Matrix-Game 3.5创新性地将历史帧切分为带有3D坐标的Patch Memory（通过Depth+Pose Lift到世界坐标系），推理时根据当前相机视锥检索可见Patch并重新投影到当前视角形成Mosaic，再作为Memory Token注入DiT，实现长期一致性的Patch级空间记忆。这一设计将Frame-level FOV Memory升级为Patch-level FOV Memory，带来四大核心优势：更准确的空间记忆检索与跨帧一致性、更稳定的相机运动生成、最大程度保留基座模型动态生成能力的In-context Learning、以及用户可自由编辑记忆块的可控记忆能力。\n\n此外，Matrix-Game 3.5在推理加速层面实现了DiT推理与VAE解码的全链路优化，通过“减少模型吞吐+DiT模型优化+VAE剪枝”三重手段，达成单卡20FPS 720p实时推理的业界领先性能，让高质量世界模型真正具备实时交互能力。Matrix-Game从1.0到3.5始终坚持开源路线。3.5版本宣布核心架构开源，吸引全球开发者共建生态。Matrix-Game 2.0是实时交互式世界模型技术范式中首个开源的实现方案，Matrix-Game 3.0则首次系统性地将记忆问题纳入开源解决方案。\n\n此前，DiT作者、纽约大学助理教授谢赛宁团队基于Matrix-Game 2.0的开源底座，发布了全球首个多人视频世界模型Solaris，也从学术圈的实际使用上印证了这套开源方案的基础模型价值。NVIDIA和浙大联合发布的工作Light Interaction基于Matrix-Game 3.0模型进行研发。另外，NVIDIA的SANA-WM和Adobe的RELIC等国际头部大厂世界模型均将Matrix-Game相关模型作为对比基准。Matrix-Game 3.5 开源地址 https://github.com/Riemann-Dynamics/Matrix-Game-3.5 Mureka v9.5&O3 音乐大模型的发布，成为本次论坛最具情感冲击力的时刻之一。\n\n从SkyMusic 1.0内测到Mureka v9.5&O3，昆仑万维的音乐模型走过了一条从“作品成立”到“创作可控”再到“多模态创作”的演进路径。而v9.5版本首次喊出 “最没有AI味的AI音乐模型” 这一口号——它不再依赖声部堆砌和复杂编配制造“厉害”的第一印象，而是在真实的音乐框架中，以更为克制的方式处理编配、人声、情绪与Prompt意图，让音乐表达更自然、更真诚。O3 建立在新版 V9.5 之上，并通过 test-time scaling 扩展 MusiCoT 的推理过程。它不是简单地“生成得更多”或“想得更久”，而是让模型在生成过程中持续审视当前表达：局部旋律是否仍服务全曲目标，编配是否遮蔽人声，情绪是否提前透支，结构是否正在偏离最初意图。额外推理空间被用于回看偏差与自我修正，使音乐 CoT 能够逐步收敛，而不是一次决定后一路向前。\n\n歌曲的主观评分 从评测结果看，V9.5 沿着 MusiCoT 路线完成了更扎实的底座升级：旋律、人声、音质和编曲全面提升，指令精准度从 6.92 提升至 7.62。它不再把“更满、更复杂”当作唯一标准，而是在真实音乐框架中更克制地处理编配、人声、情绪和 Prompt 意图，让歌曲更自然、更真诚。O3 则建立在 V9.5 之上，通过持续推演、回看偏差和修正后续决策，进一步强化旋律发展、编曲结构与指令理解，使歌曲结构更完整、情绪更连贯、段落关系更合理。简单来说，V9.5 负责把歌做得更自然，O3 负责让模型在交付前多看、多想、多修一遍。\n\n提示词：以柔和钢琴、中文流行，氛围合成器和渐进式弦乐构建电影感情绪，男声贴近演唱，细腻、克制，从低声诉说逐渐走向情感释放。整体像雨夜里的未说出口的告别，忧伤但温柔，不煽情却充满力量 Featuring soft piano, Chinese pop influences, atmospheric synth layers, and gradual strings to create a cinematic emotional atmosphere. Intimate male vocals with delicate, restrained delivery, building from quiet storytelling to emotional release. Like an unspoken goodbye on a rainy night, melancholic yet tender, powerful without being dramatic. 今天，一首歌经常和视频一起被消费。短视频、游戏、影视预告、品牌片和虚拟人演出，都需要声音与画面共同表达。\n\nMureka 这次重磅升级，也把音乐与视频 MV 接进了同一条创作链路。用户可以从一张图、一段视频或 moodboard 开始，让系统理解画面的节奏、人物、空间和情绪，再生成与之匹配的音乐；当然，也可以从一首歌开始，让 Agent 理解歌词叙事、节拍编曲和情绪起伏，继续生成角色与 MV 的视觉方案。歌词决定叙事、节拍决定剪辑、旋律决定记忆点、画面决定传播场景。Agent 要做的，是让这些信息在同一个创作目标下持续传递，而不是把几个生成工具简单拼在一起。提示词：迷幻西海岸 G-Funk 街头说唱。深沉滑动的合成器低音、Moog 哨音、Talkbox 氛围、温暖 Rhodes、哇音吉他与复古磁带质感，配合松弛靠后的鼓点和沙哑男声，营造低底盘夜间巡游般的迷幻街头氛围。\n\nPsychedelic West Coast G-Funk street rap, featuring deep sliding synth bass, a melted Moog whistle lead, talkbox haze, warm Rhodes, muted wah guitar, warped cassette textures, and a lazy behind-the-beat groove. Raw raspy male vocals deliver relaxed, human street storytelling over a smoky lowrider night-cruise atmosphere, with no trap hi-hats, drill patterns, or EDM drops. 更为重要的是，Mureka已从单一的音乐生成工具演进为完整的“版本化制作”平台。其差异不仅来自模型效果，更来自“模型训练—推理时选优—版本化创作工具—平台分发”的系统组合。同一创意可快速生成多版本，支持在旋律、人声、结构等维度进行局部保留与替换；\n\nStudio将“操作DAW”转化为“指挥创作”，降低门槛、抬高上限。同时，Mureka推出Character功能——一段声音、一张照片即可生成专属歌手角色，并贯穿歌曲、MV全链路；AI配乐能自动分析视频画面的场景、动作与情绪，创作更贴合内容的音乐；Mureka Agent则通过自然语言一次对话调用整曲生成、单轨生成、Remix、延伸、MIDI导出、声音克隆等全部能力，全程无需切换界面。\n\n正如昆仑万维所提出的愿景：AI音乐不再是简单的消费内容，而是升级为一种自我表达的语言。用户不仅是被动聆听者，更是主动表达者与参与者。Mureka正以模型能力、创作工具与平台分发的完整闭环，重新定义AI时代的音乐创作生态，让每个普通人的灵感都能有温度地落地，从“一个想法”到“歌词—人声—角色—歌曲—MV”的完整创作链路，全面释放AIGC的深层创作力。\n\n院士与行业领袖齐聚，共话世界模型未来 本次论坛还邀请了多位重量级嘉宾。中国科学院院士、南京大学教授、副校长周志华受邀发表主旨演讲，围绕世界模型的前沿方向展开了深度分享。此外，我们邀请了黎曼动力机器人创始人刘扬教授和Reactor Technologies, Inc. CEO兼联合创始人Alberto Taiuti 分别介绍了黎曼机器人模型 1.0 版和Reactor加速世界模型在全球落地的经验。中国科学院院士、南京大学教授、副校长周志华 中国科学院院士、南京大学副校长周志华教授在题为《关于世界模型的讨论》的主旨演讲中，将世界模型划分为感知层、理解层与决策层，并着重指出决策层世界模型长期面临“多步推演复合误差平方级放大”与“样本复杂度过高”两大理论瓶颈。\n\n他分享了团队的最新突破：通过分布匹配技术可将推演误差从平方级压至线性级，验证了长序列推演的可行性。同时，通过创新性地逆向运用贝尔曼方程，将所需样本量降至原来的根号T分之一，为在战斗机操控、智能工厂等代价高昂的现实任务中构建决策世界模型提供了理论基础。他还提出“学件”概念——由模型与AI自动生成的“规约”共同构成，允许多个异构模型在不公开数据的前提下进行复用与组装，为世界模型从单产线定制走向可成长、可演化的模型生态开辟了新路径。\n\n黎曼动力机器人创始人刘扬教授 黎曼动力机器人近期推出的 Riemann-1.0，是其成立以来首个公开发布的成果——面向 Physical AI 的新一代 Embodied World Action Model。该模型基于超过 23.2 万小时多源具身交互数据训练，统一融合第一视角人类视频、UMI 示教与异构机器人轨迹，并提出全因果世界动作建模架构与三阶段渐进式具身预训练框架。Riemann-1.0 不再停留于仿真环境中的离线评估，而是在多个国际主流机器人 Benchmark 与真实机器人任务上同步实现仿真与真机双 SOTA，为机器人操作、实时自适应控制及高频人机协作等 Physical AI 场景提供了从“理解世界”到“干预世界”的生成式行动基础设施。\n\n真机评测：四大家居任务全面领先 Reactor Technologies, Inc. CEO兼联合创始人Alberto Taiuti 则从产业落地角度指出，世界模型已从静态、高延迟、无状态的媒体生成范式，跃迁至有状态、实时交互、具备因果逻辑的新范式。他强调，世界模型不再只是生成视频或图像，而是能够持续推演环境变化并支持双向人机交互的“生成式软件”雏形。他以公司同名平台“Reactor”为例，展示了为世界模型原生设计的开发者基础设施如何在保持极低延迟与流式传输的同时，支持机器人、游戏、仿真等高频交互场景。\n\nReactor Technologies, Inc. CEO兼联合创始人Alberto Taiuti 在具身智能对谈环节，黎曼动力机器人创始人刘扬与破壳机器人创始人、清华大学交叉信息研究院助理教授许华哲围绕“具身世界模型的ChatGPT时刻”展开深度对话，探讨了世界模型与VLA的边界、机器人通用世界模型的训练瓶颈、具身智能的Scaling Law以及家庭机器人PMF等核心议题。全模态内容革命：AI重塑视频、游戏、音乐与全球文娱 论坛压轴环节举行了“全模态内容革命——AI重塑视频、游戏、音乐与全球文娱”圆桌对话，由甲子光年创始人张一甲主持。昆仑万维董事长兼CEO方汉，中国电影家协会副主席黄晓明，演员王珞丹，爱奇艺高级副总裁杨海涛，青年导演崔睿共同参与。\n\n圆桌围绕AI与文娱产业的深度融合展开讨论：从演员和导演的AI创作初体验到AI演员与真人创作者的价值博弈，从AI重构平台内容生态到全模态AI重塑文娱赛道终局。嘉宾们一致认为，AI是文娱行业最好的工具与最大的革新者，而人类创作者永远是内容的灵魂缔造者，人机协同将成为全球文娱行业的新发展范式。\n\n王珞丹以亲身体验，道出AI创作的\"痛并快乐着\"——为求一个理想镜头熬夜\"抽卡\"至凌晨四点，反复调整提示词却迟迟得不到想要的画面，直到清晨才终于抽到满意的镜头。她坦言自己作为\"小白\"创作者，从分镜、数字资产到人物设定一步步摸索，在这个过程中请朋友帮忙才得以完成。她认为创作者首先是一个判断者和决策者，需要用审美去筛选和决定最终呈现的画面，而AI能带来超出想象的运镜和流动性。她相信观众在意的是故事能否打动人心，而非媒介形态；创作者始终是表达的核心。\n\n黄晓明提到自己曾看了一部朋友制作的AI电影，三个月前看时还能明显看出AI表演的痕迹，但最近再看时，即便被告知那是AI生成，他已经完全分辨不出来了，\"细节到脸上的斑点毛孔，甚至微表情、毛孔都在演戏\"——这种指数级的技术迭代让他真的惊到了。AI不仅改变了他的创作方式，也融入了他的日常体验——他今天用Mureka生成了两首歌，效果很不错：“我很喜欢杨宗纬的风格，就让Mureka照着《空白格》生了一首抒情的，歌词还挺触动人心的。”从创作到投资，他对AI保持高度开放态度，明确表示很想去投资一些AI相关的项目——无论是科技方向还是影视方向。\n\n崔睿指出，AI已在实际创作中显著提升了前期故事板的制作效率，让导演能以更低成本、更短时间完成视觉预演；后期阶段，AI还能有效补足因天气等客观因素无法实拍的镜头缺失。在他看来，AI在影视制作中最能发挥价值的场景，恰恰是那些人力成本最高、执行最繁琐的“技术难题”——比如需要成千上万群演的大场面，这正是AI最擅长解决的领域。提及昆仑万维的AI视频模型SkyReels，他认为一致性非常突出——能有效解决创作者最头疼的“抽卡”效率问题，在系列化制作中保持人物、物体的稳定统一，避免反复尝试的无效劳动；同时音画同步能力也值得肯定。整体来看，他认为AI视频工具值得创作者去尝试和使用。\n\n杨海涛从平台数据出发，透露爱奇艺后台每日收到超3000部AI短剧与上千部AI漫画，AI内容观看数据持续提升。他以爱奇艺\"燎原计划\"扶持的网络电影《恶念》为例，AI在电影镜头特效制作方面实现超50%的提效，从导演构思到成片可节约三周以上的时间，他预计暑期将上线更多AI参与的网络故事片。方汉作为技术方表态，承诺将持续降低创作门槛与Token成本，实现\"人人如龙\"的文化平权。他坦言技术上的难点并非大场面、爆炸等传统拍摄中昂贵的镜头，反而是小众场景数据量不足导致效果不佳；同时解释AI生成人像\"塑料感\"的来源是扩散模型的去噪机制将所有面孔平均化，因此让模型更真实是所有从业者的共同目标。他预测后AI时代，演员需学导演、导演需学表演，角色边界将日益模糊。\n\n所有嘉宾共同指向一个共识：AI不会消解人的创造力，反而倒逼创作者更珍视自身的独特体验与情感表达，在技术赋能下回归内容的本真。从“生成内容”到“理解物理世界”：昆仑万维的下一个十年 从2022年“All in AGI与AIGC”战略确立，到2026年“世界模型元年”的正式宣告，昆仑万维完成了从全模态内容生成到可交互世界模型的关键跃迁。在世界模型和AIGC方向上，昆仑万维交出了全球领先的答卷。2026年，昆仑万维正以世界模型为支点，撬动AGI时代的下一场多模态范式革命。\n\n世界模型元年，未来已来。", "zh": true}, {"seq": 3, "title": "面壁智能开源 MiniCPM-Robot 具身智能模型系列", "source": "X：面壁智能 OpenBMB (@OpenBMB)", "summary": "面壁智能开源首个具身AI模型系列 MiniCPM-Robot，包含 1.5B 参数的通用视觉-语言-动作（VLA）模型 MiniCPM-RobotManip 和用于目标跟踪的 MiniCPM-RobotTrack。同时发布高性能推理框架 PhyAI，旨在让机器人实现理解、记忆与行动。", "url": "https://x.com/OpenBMB/status/2078839529591759025", "permalink": "https://aihot.virxact.com/items/cmrrvig4h01ctbi5qyidwptd7", "publishedAt": "2026-07-20T00:00:00.000Z", "exact": false, "content": "🚀 MiniCPM 走进物理世界——让机器人理解、记忆并行动。\n\n我们开源了首个具身智能模型系列 MiniCPM-Robot，包括：\n\n🤖 MiniCPM-RobotManip —— 一个 1.5B 参数的通用视觉-语言-动作（VLA）模型，专为机器人操作任务设计。 🐕 MiniCPM-RobotTrack —— 一个轻量级模型，用于真实场景下的目标跟踪。 ⚡ PhyAI —— 专为具身模型打造的高性能推理框架。\n\n三者共同将高效、实用且开放的具身智能推向真实机器人应用。\n\n⭐ GitHub: github.com/OpenBMB/MiniCP… 🤗 MiniCPM-RobotManip: huggingface.co/openbmb/MiniCP… 🤗 MiniCPM-RobotTrack: huggingface.co/openbmb/MiniCP…\n\n- 机器人不应因网络中断而停止工作。真实环境充满不确定性：人员走动、目标消失、网络波动。MiniCPM-RobotTrack 基于 MiniCPM4-0.5B 构建，是一款轻量级视觉-语言-动作模型，专为鲁棒的目标跟踪而设计。具身智能将由开放社区共同构建。探索、构建、创造，尽在 MiniCPM-Robot：⭐ GitHub: github.com/OpenBMB/MiniCP… 🤗 MiniCPM-RobotManip: huggingface.co/openbmb/MiniCP… 🤗 MiniCPM-RobotTrack: huggingface.co/openbmb/MiniCP… 如果你用 MiniCPM-Robot 构建了什么，我们很期待看到你的成果。\n\n- 祝愿团队持续保持势头。\n\n- 加入对话", "zh": true}, {"seq": 4, "title": "MiniCPM5-2B发布：4B以下全球性能第一，适配9款芯片", "source": "公众号：面壁智能（MiniCPM）", "summary": "面壁智能联合OpenBMB发布端侧模型MiniCPM5-2B，以2B参数量在AA-Index榜单取得4B以下模型最高分17分，平均分54.26，超越Qwen3.5-2B等竞品。模型原生支持混合思考与512K上下文，已完成华为昇腾、英伟达等9款芯片的Day0适配，即将开源。", "url": "https://mp.weixin.qq.com/s/rjFxrUylyGMqa5QtgypCdw", "permalink": "https://aihot.virxact.com/items/cmrru2n5x00vzbi5qea6youod", "publishedAt": "2026-07-20T00:00:00.000Z", "exact": false, "content": "7月19日上午，面壁智能主办的「智在终端 惠及千行」分论坛在世界人工智能大会上圆满举行。论坛上，面壁智能联合 OpenBMB 正式发布了最新端侧模型「小钢炮」MiniCPM5-2B，并完成多款芯片的适配。根据权威榜单AA-Index，MiniCPM5-2B 仅以 2B 参数量取得了全球 4B 以下模型的最高得分、位于榜首，并同步开源数据治理方案 UltraX 与智能体训练全流程技术。与此同时，MiniCPM5-2B 联手众智 FlagOS 社区，完成了9款芯片的 Day0 适配。面壁智能与AMD、英特尔、联发科、高通等主流芯片厂商的适配成果也一并公布，多芯片生态覆盖从云到端。\n\n01 4B以下全球性能第一 在最新的 Artificial Analysis（AA）榜单评测中，MiniCPM5-2B 更是以 17 分的优异成绩占据榜首，成为 4B 以下模型中当之无愧的性能标杆。\n\n根据多个权威基准评测，MiniCPM5-2B 的平均分为 54.26，在 4B 以下参数级别的基础模型中综合能力位居首位。对比同量级的 Qwen3.5-2B（41.66）、Qwen3-1.7B（40.89）和 Gemma-4-E2B-it（37.62），分数优势显著，且超过采用 8B 稀疏架构的 LFM2.5-8B-A1B（49.15）： MiniCPM5-2B 模型原生支持混合思考，可在快速响应与深度推理之间灵活切换，同时提供 512K 超长上下文窗口，单次可处理整本长篇小说或数十万行代码。能力维度覆盖通用知识、数学与代码推理、复杂指令遵循、多语言理解与生成、长文本处理、工具调用及深度搜索，形成当前 4B 以下最为完整的任务覆盖。\n\n在关键单项评测中，MiniCPM5-2B 的长文本理解任务AA-LCR得分 42.33，超出第二名逾 16 分；Agent 能力 τ²-Bench Telecom 得分 90.35，领先 LFM2.5-8B-A1B 达 4.97 分；数学推理 AIME-2026 得分 60.95，明显高于 Qwen3-1.7B（36.88）与 Gemma-4-E2B-it（32.71）。此外，逻辑推理 ZebraLogic 得分 69.60，在对比模型中位列第一。这些结果直接对应端侧智能体的复杂交互与多步推理场景，体现模型在真实任务中的可用性。\n\n为在互联网数据红利趋缓的背景下持续提升模型能力，MiniCPM5-2B 也提出了分级数据治理技术 UltraX。该方法构建一个 0.6B 小模型，对 L1 网页数据实施程序化精炼，将数据治理从传统清洗升级为行级增、删、改的可执行编辑程序。UltraX 能够完成行级插入、文段级删除和片段级替换等操作，并将大模型生成的精炼文本进一步转化为可校验、可追溯的编辑程序，实现大规模数据治理的自动化与高质量闭环。在端侧智能体能力上，MiniCPM5-2B 实现了从预训练到强化学习的全流程 Agent 构建。\n\nMiniCPM5-2B 原生具备工具调用、深度搜索和代码生成等智能体核心能力。训练阶段先后执行 200B 规模的 Agent Midtraining、百万条高质量轨迹的 Agent SFT 以及可扩展的 Agent RL 对齐优化，确保智能体行为稳定可靠。这一设计使得模型可直接作为端侧智能体基座，为手机、PC、智能座舱等设备上的本地化 AI 助手构建提供支撑。02 FlagOS社区9芯片Day0适配，实现从云到端跨架构覆盖 众智 FlagOS 社区基于统一多芯片软件栈，通过 vLLM-plugin-FL 与 SGLang-plugin-FL 推理插件，第一时间完成 MiniCPM5-2B 的 Day0 跨芯片适配与推理验证。\n\n此次适配覆盖华为昇腾、海光、昆仑芯、沐曦、摩尔线程、平头哥、清微智能、天数智芯、英伟达共 9 款 AI 芯片，并延伸至 ARM 端侧平台，实现「一套代码、跨架构运行」的从云到端生态覆盖。评测结果显示，各芯片平台推理精度与 NVIDIA 平台整体对齐，部分芯片推理性能经过FlagOS技术栈的优化，追平或超越 NVIDIA 单位算力基线，实现更高的性价比。面向上述芯片的 FlagOS 适配镜像与多芯片模型版本，将随 MiniCPM5-2B 模型开源（目前暂未开源）同步在魔搭和 Hugging Face 上发布，开发者可开箱即用。这是继 MiniCPM5-1B 之后，FlagOS 社区与面壁智能的又一次 Day0 深度协同。双方将持续深化合作，共同推动高效端侧模型在多元算力生态的普惠落地。\n\n03 多芯片生态覆盖与 AMD、Intel、Mediatek、Qualcomm全面适配 MiniCPM5-2B 在多芯片平台适配方面持续拓展生态边界。目前，面壁智能已完成对 AMD、Intel、Mediatek、Qualcomm（按首字母排序）等全球主流芯片厂商的端侧模型适配，形成覆盖云、边、端的多元算力支持能力。与英特尔的协同从单点适配升级为战略合作。双方于 WAIC 2026 现场签署合作备忘录，围绕端侧大模型与芯片平台协同优化、产品化及生态共建展开全面协商。此前，基于英特尔 18A 制程 Core Ultra 平台提供 180 TOPS 算力，支持 35B 参数模型本地部署。\n\n此外，面壁智能与 AMD、联发科的端侧模型适配工作也在持续推进，相关模型版本已完成验证，进一步扩展了 MiniCPM 系列在多芯片生态中的可用性。在不久的将来，MiniCPM5-2B 将正式开源，开发者可通过 Hugging Face、魔搭等平台获取模型权重，同时可获取针对各芯片平台的适配镜像与部署指南。面壁智能将持续与芯片厂商及开源社区协同，推动端侧模型在多元算力场景中的规模化落地。", "zh": true}]}, {"label": "产品发布/更新", "color": "#059669", "items": [{"seq": 5, "title": "transcribe.cpp 发布：基于 ggml 的跨平台语音转录库，支持 16 个 ASR 模型族", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "summary": "transcribe.cpp v0.1.0 发布，一个基于 ggml 的语音转录库，支持 16 个 ASR 模型族（60+ 模型），并通过 Vulkan、Metal、CUDA 和 TinyBLAS 实现 GPU 加速。", "url": "https://workshop.cjpais.com/projects/transcribe-cpp", "permalink": "https://aihot.virxact.com/items/cmrr7sdid02ybbi18afm9lr2i", "publishedAt": "2026-07-20T00:00:00.000Z", "exact": false, "content": "transcribe.cpp 2026年4月至今 今天我非常激动地宣布transcribe.cpp正式发布。\n\ntranscribe.cpp是一个基于ggml的转录库，支持所有最新的转录模型。handy-computer HF组织下发布的每个模型都经过了数值验证和WER测试，确保与参考实现一致。它在所有平台上都实现了加速。\n\n我是Handy的作者和维护者。这个库源于将跨平台语音转文字应用分发给众多用户时所遇到的痛点。\n\n这是一个v0.1.0版本的库，意味着存在一些我独自无法发现的粗糙之处！请报告这些问题，让我们一起修复它们！\n\n**动机**\n\n让我直说吧。我认为使用当前的ASR推理栈来分发跨平台应用体验非常糟糕。\n\n基本上你只有whisper.cpp和ONNX这两个选择。你可以为苹果设备引入MLX，但这样你就需要支持两个不同的引擎，并将模型移植到每个平台上。我一直是ONNX的粉丝，因为它能快速将模型支持引入Handy，但仅靠CPU运行时，大量性能被白白浪费。\n\n市面上有一些声称支持大量模型的零散库，但据我所知，它们作者不明，测试情况也不清楚。这些库给我带来的疑问远多于答案。\n\n这个库什么时候会停止维护？创建者是否考虑过绑定，以便你可以在真正的桌面或移动应用中使用它？这本质上只是演示代码吗？他们做过基准测试吗？它比ONNX快吗？\n\n正是这些问题催生了transcribe.cpp。作为Handy的维护者，我需要一个可以信赖的库。一个能让我下载文件并直接运行推理的库。一个能让我知道引擎中模型的推理结果与参考实现同样优秀的库。推理应该在GPU上运行以获得最佳性能。它应该能轻松嵌入到Handy中，不能是一个庞大的pytorch库。它必须能在Mac、Windows和Linux上运行。而ggml显然是目前最好的选择。它拥有强大的社区和出色的分发能力。\n\n**那么你能得到什么？**\n\n你将获得一个快速且准确的推理引擎，支持广泛的模型。\n\n- 支持16个ASR系列（60多个模型），更多模型即将加入\n- 通过Vulkan、Metal、CUDA和TinyBLAS实现加速\n- 每个模型都经过了数值验证和WER测试\n- 支持流式转录\n- 支持批量转录\n- 几乎可以无缝替代whisper.cpp\n- 维护者支持的4种语言绑定\n- Python\n- Javascript/Typescript\n- Rust\n- ObjC/Swift\n\n**广泛的模型支持**\n\n我们计划支持尽可能多的最先进的转录模型。截至目前，我们已经支持了大多数公开可用的现代转录模型。还有少数模型尚未支持，但很快就会加入。\n\n**加速支持**\n\n我的首要目标之一是在Vulkan上运行任何我想要的ASR模型。在我看来，这是任何提供本地推理的应用的最低要求。对于我们支持的每个模型，我们都在Ryzen 4750U（CPU + Vulkan）上运行了Fedora系统的基准测试，同时也在我的M4 Max上进行了测试。\n\n**数值验证**\n\n我还想确保 transcribe.cpp 中的推理准确无误，并尽可能接近参考实现的精度。这很大程度上源于我在 Hugging Face 上使用 .onnx 模型时对推理准确性的巨大不确定性。为了确保我们执行的推理正确无误，我们对每个模型与参考实现进行了数值验证。在数值验证之外，我们还进行了完整的词错误率（WER）扫描，以确保参考实现输出的内容与我们输出的内容一致。这意味着每个模型都经过了数千个语音片段的测试，其结果与参考实现非常接近或完全相同。这些数据的结果已发布在 transcribe.cpp 仓库中，同时也随每个模型发布在 Hugging Face 上。\n\n**作为 whisper.cpp 的直接替代方案**\n\ntranscribe.cpp 基本上可以作为 whisper.cpp 的直接替代方案。主要原因在于：Handy 使用了 whisper.cpp，而我需要发布一个用 transcribe.cpp 替换它的更新。我需要保持与 whisper.cpp 中运行且随 Handy 一起发布的非常流行的 .bin 文件的一定兼容性。transcribe.cpp 可以运行这些文件。whisper.cpp 中有些标志和功能我们目前还不支持，但我认为对于绝大多数用例来说，我们的 whisper 实现是可靠的，可以替代 whisper.cpp，同时性能大致相当。\n\n**真正的多语言支持**\n\n语言绑定从一开始就在我的考虑之中。虽然这个库是用 C/C++ 编写的，但我需要 Rust 的绑定。同时我也知道，为了让本地转录功能尽可能广泛地分发，至少需要提供良好的第一方绑定支持。我选择了四种我认为能代表人们使用该库主要场景的语言。我也欢迎其他人直接为项目贡献绑定，前提是他们愿意承担相应的维护责任。\n\n当然，归根结底，很多决策都是由 Handy 驱动的。由于 Handy 很受欢迎，我打算维护这个库，就像我尽力维护 Handy 一样。我希望自己能够继续维护开源项目，并在力所能及的范围内为生态系统做出贡献。\n\n如果没有 Handy，这个库根本不会存在，因为我不会遇到需要支持多种不同 ASR 模型的问题。我也永远不会了解人们使用 ASR 的各种用例。我已经尽力覆盖了我听到最多的那些用例。当然，库中肯定还有一些目前未处理的情况。如果我有遗漏的地方，欢迎你为这个库做出贡献！\n\n**让本地语音转文字更易用**\n\ntranscribe.cpp 的目标就是让本地运行的 ASR 变得更简单。我们知道，转录功能在大多数设备上都能以极高的精度运行，完全没有必要将你的语音发送到云端服务。RK3566 可以通过 transcribe.cpp 在其性能较弱的 CPU 上以快于实时速度运行模型。使用 SOTA 模型进行快于实时的转录，功耗仅为几瓦。这不是希望或梦想，而是事实。\n\n我认为，展望未来，出于各种原因，更多的推理将在本地进行。这使得分发问题变得至关重要。为了让更多应用在本地运行推理，我们需要让运行推理变得更简单。当然，transcribe.cpp 并不能完全解决这个问题，还有很长的路要走，但我希望它能成为向前迈进的一小步。我确实学到了很多。\n\n## 致谢\n\n我由衷感谢所有支持这个项目的人。\n\n首先要感谢Mozilla AI团队、他们的BiR项目，以及Mozilla AI的Davide。这个项目最初只是我脑海中的一个难题，我带着这个难题找到他们，而他们决定支持我去解决它。当时transcribe.cpp甚至还没有一个具体的构想，我只是在探索如何解决Handy中的加速分发问题。因此，衷心感谢他们的支持与帮助，让这个项目得以诞生。\n\nggml。没有ggml及其所有贡献者，这个项目就不可能实现。非常感谢各位所做的工作。我认为ggml在帮助简化本地推理应用的分发方面，确实做出了卓越的贡献。\n\nModal也为我提供了关键帮助。我联系了他们，他们便给予了我积分。这些积分被用于进行WER测试，并确保该库在CUDA上运行良好。能够验证工作的正确性，这对我而言是巨大的帮助。\n\nBlacksmith为transcribe.cpp的部分CI/CD提供了支持。同样，我联系了他们，他们立即回应并提供了积分。当然，CI/CD对于确保所有发布的内容都经过至少一定程度的测试至关重要。\n\n感谢Hugging Face，它既是本地AI社区的支柱，也提供了handy-computer组织的私有存储空间，让我能够自由上传模型。\n\n## AI辅助？\n\n当然有。我认为单凭个人之力，不可能在短短几个月内，在没有外部帮助的情况下，利用ggml从头编写一个如此规模的引擎。但这里的每一个字都是由我亲口说出或亲手敲出的吗？不，它们都源自我的表达。", "zh": true}, {"seq": 6, "title": "ChatGPT Work 功能：建站、邮件、文档处理", "source": "X：Tibo (@thsottiaux)", "summary": "ChatGPT Work 适用于 ✅ 创建和托管网站 ✅ 为你管理电子邮件 ✅ 总结海量文档 ✅ 制作一流的文档、表格和幻灯片 已在你的移动应用或 http://chatgpt.com 上提供，包含在 Plus、Pro、Business 和 Enterprise 套餐中。", "url": "https://x.com/thsottiaux/status/2078697631019303273", "permalink": "https://aihot.virxact.com/items/cmrraq5dk03p5bi18vyrt83kp", "publishedAt": "2026-07-20T00:00:00.000Z", "exact": false, "content": "ChatGPT Work is for\n✅ Creating and hosting sites\n✅ Managing your emails for you\n✅ Summarizing mountains of documents\n✅ Creating top-notch docs, sheet and slides\nAlready in your mobile app or on chatgpt.com, included in Plus, Pro, Business and Enterprise plans\n- My job is basically delegating to ChatGPT Work now. Can't stop using dictation and have it do everything\n- 加入对话"}]}, {"label": "行业动态", "color": "#d97706", "items": [{"seq": 7, "title": "黄仁勋访日：Nvidia 联手日本打造物理 AI 时代，Noetra 主权 AI 工厂与 Cosmos 机器人联盟落地", "source": "TechCrunch：AI（RSS）", "summary": "Nvidia CEO 黄仁勋在 7 月 15-16 日访日期间，宣布为日本建设“Vera Rubin AI 工厂”，配备 13,750 颗 Vera CPU 和 27,500 颗 Rubin GPU，预计 2028 年投运。", "url": "https://techcrunch.com/2026/07/19/what-to-watch-for-after-jensen-huangs-japan-visit", "permalink": "https://aihot.virxact.com/items/cmrsbql4401gxbiuaj7s1567n", "publishedAt": "2026-07-20T00:00:00.000Z", "exact": false, "content": "Nvidia’s chief Jensen Huang spent two days — July 15 and 16 — in Tokyo, courting Japan’s industrial and chip-supply elite, weeks after a keynote in Taiwan, and months after a visit to South Korea. He left with deals spanning Japan’s entire tech ecosystem: a national AI factory, partnerships with the country’s leading robotics companies, and agreements with the chip-material suppliers powering Nvidia’s next generation of AI chips. His message was clear. Nvidia is targeting Japan’s factory floor, and many of the country’s biggest manufacturers are joining in. AI’s next chapter, Huang said, belongs to factory floors, robots, and machines, and he wants Japan to build it.\nThirty years ago, a $5 million Sega investment helped keep a near-bankrupt Nvidia afloat; today, Nvidia and Japan’s industrial giants need each other again — this time to build the physical-AI era, starting with these three projects:\nNoetra — Japan’s sovereign-AI play. The country doesn’t want to run its factories and robots on American or Chinese AI. So, the government pulled together roughly 44 domestic firms, with SoftBank, Sony, NEC, and Honda at the core, to build its own AI for robots, vehicles, and factory floors. Tokyo is committing up to 1 trillion yen ($6.2 billion) over five years, a bet on homegrown “physical AI,” foundation models built to run machines. Japan wants to own the software brain. The hardware to build it, though, still comes from Nvidia. The U.S. chip giant is building “a Vera Rubin AI factory,” a massive data center packed with its next-generation chips, expected to launch in 2028, with 13,750 Vera CPUs and 27,500 Rubin GPUs, delivering 140 megawatts. Noetra will oversee the effort, with plans to build the data center. Noetra’s plan runs in three stages: a reasoning model heavy on Japanese-language skills starting in fiscal 2026; an omni-modal version handling text, images, video, and audio by 2028; and “Real-world Native AI” built to run robots by 2030, released to outside Noetra developers in phases.\nThe robotics coalition — Japan’s industrial giants line up behind Cosmos. Nvidia is targeting Japan’s factory floor, and many of the country’s top robotics and manufacturing players are signing on. Fanuc, Yaskawa, Kawasaki Heavy, Fujitsu, Hitachi, NEC, Sony, SoftBank, Kubota, and robotics group AIRoA say they plan to build on Nvidia’s Cosmos models, an open-model effort Nvidia started in May with a handful of global AI labs. In Tokyo, Nvidia gave them a reason to commit, unveiling Cosmos 3 Edge, a version of the model that runs on its Jetson Thor chips inside the machines themselves. Some are already testing a shared control system; others, like Honda R&D and Omron, are building on the tools now. “The next frontier of AI is in the physical world, and this is a once-in-a-generation opportunity for Japan,” Huang said in the company’s statement. “Japan invented modern manufacturing. Now, it has the opportunity to reinvent it for the age of intelligent industries.”\nToyota — cars and physical AI. Toyota uses Nvidia chips across much of its stack. It committed its next-generation vehicles to Nvidia’s Drive platform at CES in January 2025; the newer work extends Nvidia into its manufacturing, where simulations are used to design production lines, into the software that runs its vehicles, and into systems that read road traffic. Toyota’s cars will run advanced driver assistance, which steers and brakes but still requires a driver, a more conservative approach than Waymo and Tesla, which are developing systems that rely less on a human driver.\nWhy it matters\nHuang’s visit put physical AI at the center of Japan’s industrial strategy, and Tokyo is spending to back it. Facing a shrinking workforce, Japan wants 10 million AI-equipped robots across 18 sectors by 2040, backed by $65 billion in public and private physical-AI investment.\nThe longer game is bigger. Japan’s AI Robotics Strategy, released in March, aims to capture more than 30% of the global AI robotics market by 2040, a market Tokyo values at roughly ¥20 trillion, or about $133 billion. METI is funding a domestic foundation model to run the machines, and Noetra’s Nvidia-powered factory is where models of that scale, into the trillions of parameters, would be trained.\nUnderneath the industrial case is a sovereign one. As the U.S. and China pull ahead in large-scale AI, Tokyo wants its own data, its own compute, and less dependence on infrastructure it doesn’t control. Huang appeared on July 16 alongside trade minister Ryosei Akazawa at the government’s physical-AI launch, with Prime Minister Sanae Takaichi joining by video. The Takaichi administration has made AI and semiconductors the centerpiece of a growth plan chasing ¥370 trillion ($2.3 trillion) in public and private investment by 2040. Noetra’s factory — which Nvidia bills as “the world’s first national AI infrastructure” — is the clearest bet yet. Japan’s push for independence, at least for now, rests on American chips.\nWorking the whole room\nIn two days, Huang sat across from nearly every name that matters in Japanese tech — the CEOs of Toyota, Fanuc, Yaskawa, Fujitsu, and Kawasaki over lunch, and dozens of supply-chain chiefs over skewers and whisky in a Kanda izakaya.\nIt’s the same playbook he ran weeks earlier — a homecoming keynote in Taiwan, fried chicken, and a 50,000-GPU deal in Seoul last fall. This time, it was Tokyo’s turn, with the robots, the supply chain, and the chips underneath."}]}, {"label": "技巧与观点", "color": "#0284c7", "items": [{"seq": 8, "title": "AI 热潮正在瓦解全球决策机制", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "summary": "一位拥有 300 多次行业交流经验的从业者观察到，全球公私机构正陷入集体性 AI 狂热，决策层要么没有计划，要么只能低头回避。过去一年半中，其团队所见的所有 AI 项目均以失败告终（成功率 0%），失败原因常与 LLM 能力无关，而是企业本就难以有效运行软件项目，且 AI 项目叠加了额外风险。内部聊天机器人几乎无人使用，客户服务聊天机器人也极少带来良好体验，例如三菱的语音客服承诺回电却六周未兑现。", "url": "https://ludic.mataroa.blog/blog/ai-mania-is-eviscerating-global-decision-making", "permalink": "https://aihot.virxact.com/items/cmrrd5bjb00cfbikihob9drtj", "publishedAt": "2026-07-20T00:00:00.000Z", "exact": false, "content": "Note: This has been cross-posted to my company's blog, in case you think there is some use in sharing with someone in a format that looks more authoritative. Link here.\nI strongly believe there are entire companies right now under heavy AI psychosis and it’s impossible to have rational conversations with them about it. I can’t name any specific people because they include personal friends I deeply respect, but I worry about how this plays out.\nOver the past year, I’ve run point on all of our company’s sales, led the technical components of all but two of our engagements, and over the lifetime of this blog have had something like 300 catchups with professionals from around the world. This has ranged from people on the ground in niche service industries to executives at Fortune 500 companies1. Because of this, I've had a front-row view to our collective institutions across both the private and public sector undergoing breath-taking mass psychosis. This essay is an attempt to describe the bizarre dynamics that are currently at play, as I am in the rare position where my wellbeing is not contingent on paying lip service to madness, and to reassure the people trying to survive amidst all of this that they are not crazy.\nThe reality is thus: the people in charge either have no plan, or see no path forwards other than keeping their heads down. Not at banks, not at hospitals, not in our government institutions. The world’s organisations have been captured by people in the throes of frothing excitement, and saner people who now live in a state of constant commingled fear and frustration.\nI. AI Investments Are Generally Total Failures\nReading this while working for a division that pivoted to provide interfaces for agentic workflows, only to discover that only ten users had ever touched the products we made for agents, only to pivot again to support for agentic workflows, which has a lot of competition because every company has to do something agentic now and there's only like four things you can do in that space, is bracing.\n– An editor of this essay\nAre companies actually seeing massive productivity gains from their AI adoption? Does any of this sordid affair make sense?\nThis should be an easy question, but it is surprisingly hard to get a straight answer to it. Executives that tell the press that their company has gone insane will quickly find themselves removed from their positions. Employees who are honest will find themselves fired in short-order, or “randomly” selected for a round of layoffs. In fact, it is in the interests of almost every actor in the space – boards, executives, employees, vendors, consultants – to obfuscate and misrepresent the success rate of AI projects. Many publicly traded companies are putting out announcements about their AI productivity gains when I know for a fact that the businesses have done nothing other than purchase Copilot licenses and declare victory.\nYet we need to know if these projects are panning out – if the total focus on AI as a core tenet of business strategy is succeeding at a reasonable rate, then a discussion about the relative risk and reward is warranted.\nUnfortunately, we live in a dark timeline. All of the AI projects we have observed as a team are failing. Every single one – we have seen 0% success in a year and a half, not only amongst projects we have been asked to participate in2, but even within projects that we have observed in passing while doing totally unrelated work. Even if you grant that AI tooling accelerates specific workloads, the method and scale of the current investments is senseless. Frequently the failure is not related to AI itself, but rather that companies are terminally bad at running software projects effectively, and as I have remarked previously, AI projects are subject to all the failure modes of normal projects plus you can get everything right and then still fail because of the method's novelty. Very few companies are so good at shipping software that they can afford the extra risk profile.\nOften enough, though, it’s an actual failure in what LLMs can accomplish. The most common version of this, being rolled out across businesses around the world, is the internally-facing chatbot, or for the more daring company, the customer-facing chatbot. The story is always the same. For the former, I’ve never seen substantial internal uptake from inside a business. Employees don’t use internal chatbots because companies tend to have low-quality documentation and an LLM is not psychic – it can only know things that have been written down and made accessible. For the latter customer-facing applications, I have rarely had a pleasant experience as a consumer, with perhaps the exception of live transcription during medical appointments – hardly something worth pivoting an entire organisation around. In both cases, project leaders are very careful to avoid tracking basic metrics, such as whether the tools are being used at all, or they track metrics that are easily gamed.\nFor example, my last consumer interaction was attempting to get help from Mitsubishi following an automotive failure, where a very polite robot asked me to describe the problem and that I’d receive a call back as soon as someone was available. This was the single most competent implementation of such a project I’ve seen in the wild, in that the voice was natural sounding, responded quickly, was clearly “live” in production, and promised a swift resolution.\nThat was six months ago, and I did not, in fact, get a call back.\nWhen Mitsubishi did not call me back, what happened? Did that request just go into the void, showing one less incident for the year? Does it appear that the phone bot resolved my query without the need for human intervention? All we know is that it didn’t show up as an error, or I’d have received a call. I’m sure it looks great in all sorts of ways except the one that matters, which is that I was planning to buy a car and decided not to buy another one of theirs.\nFor this reason, our team has quickly learned while on an engagement not to ask anything about ongoing AI projects in any context – by the time that project has started, it is too late for the management team, and intervention is not possible until a crisis point is inevitably reached. There is no conceivable positive outcome. The failure rate is so high that even basic inquiry leaves us in an untenable position. Any coherent question about how it’s going, what the goal is, who is using it, constitutes an inadvertent attack on the chain of command responsible for the work because there are no good answers to anything. Even in rare cases where my interlocutor has stated that things are going well (usually while the project is still mid-flight and failure has not had a chance to manifest), it is generally obvious that they are doomed, but at least in these cases I can simply agree and then go home to scream into a pillow for six hours straight3.\nAll of this is to say that I am very confident that almost every report at a company about “massive AI productivity gains” is untrue as a matter of brute fact. Even if some companies are seeing clear gains, this is the exception, not the norm. With that assumption in place, we can talk about the dynamics at play, and how it has become impossible for many organisations to stay focused on things that actually matter to their long-term (or even short-term) health.\nII. Heretics Will Be Shot\nIt has become outright dangerous to even raise the possibility that AI might not be the solution to a problem, let alone be the sole focus of a company’s entire strategy.\nIn every sufficiently large business we have observed (say, with 500+ employees), we have noted that continued advancement, and increasingly continued employment, has started to require repeated professions of belief in the transformative power of AI for said business. I am not talking about providing ideas about how to use AI in the business – I mean religious profession, declarations of faith. Overwhelmingly these statements are made by non-technicians, though it is not uncommon for technicians to emit deranged statements to curry favour.\nThere have been several occasions where I have seen someone, apropos of nothing, blurt out almost word-for-word “AI is changing everything”, only to concede moments later that their organisation does not currently use LLMs for anything, and indeed, that they cannot name a single thing that has changed other than they get some use out of ChatGPT (frequently the free-tier). In one extreme case, I have seen an executive confess that they had never even used ChatGPT or any AI tool in their life, immediately after producing a technical strategy for an organisation with $2B+ in revenue which was entirely centered around AI.\nInitially these statements were so absurd on their face that I thought it was some cynical ploy to achieve thought leader status, and there are certainly some people doing this – I have had it admitted to me. But the broader reality is so much worse: people who have no background in the technology at all actually believe what they are saying. As a general rule you should avoid getting into business with a liar, but if you must, you can at least reason with them even if only in private. A true believer is much more threatening because they are impervious to even inducement by self-interest.\nThe turning point in my belief was watching someone with a spectacular amount of money on the line fire their highest performers because they were achieving that performance without LLMs. When an employer publicly talks about AI innovation, we have to ask ourselves if they’re simply trying to manipulate the market or customers. When they privately commit to strategies like this with their own money at stake, with no attempt to communicate that strategy to external clients, I can only assume they really mean what they’re saying.\nA while ago, I wrote “Contra Ptacek’s Terrible Article On AI”, which was focused on the fact that many of Ptacek’s points in his own essay “My AI Skeptic Friends Are All Nuts” were internally inconsistent4. But on the crux of the matter, we are actually in total agreement, because he opens his essay with this:\nTech execs are mandating LLM adoption. That’s bad strategy.\nWhich is to say that we can sidestep arguments about the precise utility of LLMs entirely and we’re left in a very simple place – it is entirely obvious to both myself and Ptacek, two people that are coming at this from fairly opposed views, that people are being really, really stupid about this, and that organisations are demanding bizarre workflow constraints from their specialist staff.5\nThese mandates have led to extremely strange places. Several of my peers now “AI-wash” their work, meaning that even when they can perfectly competently execute on their jobs to the satisfaction of their management teams, said managers are unhappy if the engineers haven’t used AI in the work… so now they’re lying about using LLMs even in contexts where their professional judgement is that they aren’t the appropriate tool. They just do the work, the same way they have for decades, and say Claude did it. Others are being measured on their AI bills with “token leaderboards”, where higher is better because I have evidently fallen into the pocket of Hell where the demons torment me by doing elaborate impressions of absolute fucking morons, so the people hired for their freakish ability to perform system optimisation do the obvious thing. They set the LLMs prompting themselves in a semi-plausible loop in case someone inspects the token consumption and then they watch Netflix. Not a single one has been caught, even when their own assessment of the output is that it isn’t suitable for deployment.\nChecking out a parallel copy of our Go repository and telling the AI to rewrite the whole thing in Zig while I work on something else just so I can keep my job. I hate this shit so much. My job has usage tracking and quotas. I don’t use it for actual work, I just spin it up and disregard the output.\n– An actual software engineer\nIn fact, the only people I know of to be fired over this whole thing are people that have expressed visible doubt about this organisational strategy, which again, even Ptacek thinks is transparently dumb. The net result is that everyone has learned very quickly to praise executives on their visionary AI prowess, or they will be gunned down in the proverbial streets.\nIII. AI Demos Are The Mind-Killer\nBless me, Father, for I have sinned. It has been ∞ days since my last confession. I accuse myself of the following sins:\nOne of the main pieces of infrastructure we deploy at our clients is an analytics-focused database called Snowflake – for a typical business, the bill is tiny because it’s a pay-as-you-go situation and we can process all their data in one minute a day, you get a very hands-off deployment, and in short it has many characteristics that are very pleasant for our work. One of the features in Snowflake that we don’t use is called Cortex.\nCortex is their AI chatbot layer, with the ability to plug into metadata (for non-nerds, descriptions of your data, like what a column in a spreadsheet means) and query a company’s database autonomously. In theory, you can ask a question like “What was our revenue for last week?” and it will spit out an answer.\nIt is not really suitable for production usage. From memory, the last time I was given a presentation on it, by actual Snowflake staff, they reported that ideal configuration results in something like ~92% accuracy due to the complexity of data at a large business (see: probably best-in-class for these tools, but imagine your CFO having one in every ten of their numbers be outright wrong) and there were serious issues with managing deployments. Nonetheless, it can be used to produce some very flashy demonstrations.\nOn several occasions, we’ve been exposed to folks that have been sort of lukewarm on our main offerings, but they really, really wanted to use AI to perform a natural language query on their data. And we thought “Okay, if you really want to see it, maybe we can caveat this appropriately and show you what it might look like.”\nThis was a terrible mistake. It backfired in the most predictable way imaginable – every lukewarm client that saw the chatbot in action, even with us telling them that it was not going to accomplish what they wanted, wanted to buy it immediately. Every other consideration, including millions of dollars that we could plausibly help them achieve by non-AI means, was swept aside. It was like a dark and terrible force seized control of their limbs, plunged their hands into their own chests, and presented their still-beating credit cards to us in grim supplication. We were so mortified by the inexplicable shift in energy that we (wisely) declined to take the money and ended the sales process, and soon thereafter removed Cortex fr"}]}]};
function pad(n){return n<10?"0"+n:""+n;}
function toBeijingHuman(iso, ref, exact){
  const d=new Date(iso); const bj=new Date(d.getTime()+8*3600*1000);
  const Y=bj.getUTCFullYear(),M=bj.getUTCMonth()+1,D=bj.getUTCDate();
  const h=bj.getUTCHours(),m=bj.getUTCMinutes(); const hh=pad(h),mm=pad(m);
  if(!exact) return M+"月"+D+"日";
  const [rY,rM,rD]=ref.split("-").map(Number);
  if(Y===rY&&M===rM&&D===rD) return "今天 "+hh+":"+mm;
  const yest=new Date(rY,rM-1,rD); yest.setDate(yest.getDate()-1);
  if(Y===yest.getFullYear()&&M===yest.getMonth()+1&&D===yest.getDate()) return "昨天 "+hh+":"+mm;
  return M+"月"+D+"日 "+hh+":"+mm;
}

    card.innerHTML='<div class="top"><span class="seq">'+it.seq+'</span><span class="time">'+time+'</span></div>'+

    card.addEventListener("click", function(){ openReader(it); });

  });
  sec.appendChild(grid);mainEl.appendChild(sec);

function escapeHtml(s){return (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function escapeAttr(s){return escapeHtml(s);}
// 渲染正文（纯文本归档）：图片不加载远程资源，仅以文字占位符呈现；其余文本按段落转义（防 XSS）
function linkify(escaped){
  if(!escaped) return escaped;
  var re=/(\[[^\]]+\]\((https?:\/\/[^)\s]+)\))|(https?:\/\/[^\s<>"'）】」』，。、；：！？]+)/g;
  return escaped.replace(re, function(m, g1, g2, g3){
    if(g2!==undefined){
      var label=m.substring(m.indexOf('[')+1, m.indexOf(']'));
      return '<a class="r-link" href="'+g2+'" target="_blank" rel="noopener noreferrer">'+label+'</a>';
    }
    if(g3!==undefined){
      return '<a class="r-link" href="'+g3+'" target="_blank" rel="noopener noreferrer">'+g3+'</a>';
    }
    return m;
  });
}
var _IMG_RE=/!\[([^\]]*)\]\(([^)\s]+)\)/g;
function renderRich(text){
  return (text||"").split(/\n{1,}/).map(function(p){
    p=p.trim(); if(!p) return '';
    var out=''; var last=0; var m; _IMG_RE.lastIndex=0;
    while((m=_IMG_RE.exec(p))!==null){
      out+=linkify(escapeHtml(p.slice(last,m.index)));
      var cap=(m[1]||'').trim()||'图片';
      out+='<span class="r-img-cap">🖼 '+escapeHtml(cap)+'</span>';
      last=_IMG_RE.lastIndex;
    }
    out+=linkify(escapeHtml(p.slice(last)));
    return '<p>'+out+'</p>';
  }).join("");
}
function openReader(it){
  const r=document.getElementById("reader");
  const content=(it.content||"").trim();
  const body=document.getElementById("readerBody");
  if(content.length>0){
    body.innerHTML=renderRich(content);
  }else{
    const sum=(it.summary||"").trim();
    if(sum){
      // 来源站点多为付费墙 / 登录墙 / 反爬限制，无法镜像全文；展示已本地存档的中文摘要兜底
      body.innerHTML='<div class="r-fallback">⚠️ 该条新闻的<b>全文镜像暂不可用</b>（来源站点可能为付费墙 / 登录墙 / 反爬限制，或原文已失效）。下方为已<b>本地存档的中文摘要</b>，可正常查看；完整原文请点击右下角「查看原文 ↗」。</div>'+
        '<p class="r-summary">'+linkify(escapeHtml(sum))+'</p>';
    }else{
      body.innerHTML='<p class="r-empty">暂未获取到该条新闻的全文镜像与摘要。'+(it.url?'可点击右下角「查看原文 ↗」前往原始报道。':'')+'</p>';
    }
  }
  document.getElementById("readerTitle").textContent=it.title;
  document.getElementById("readerSource").textContent=it.source;
  const link=document.getElementById("readerLink");
  if(it.url){link.href=it.url;link.style.display="";}else{link.style.display="none";}
  r.hidden=false;document.body.style.overflow="hidden";
}
function closeReader(){const r=document.getElementById("reader");r.hidden=true;document.body.style.overflow="";}
document.getElementById("reader").addEventListener("click",function(e){if(e.target===this)closeReader();});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeReader();});
