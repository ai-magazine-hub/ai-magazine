享。这是一场真正意义上的国家级、国际顶级AI盛会。\n\n1 方汉：2026是“世界模型元年”，三大产业预判锚定未来方向 在论坛主旨演讲环节，昆仑万维董事长兼CEO方汉正式宣布2026年为“世界模型元年” 。他指出，过去两年AI行业的核心命题是“生成”——生成文字、图像、视频、音乐。而从2026年开始，AI的核心命题将转向“理解”与“交互”——让AI真正理解物理世界的运行规律，并能与真实环境进行闭环互动。世界模型正是实现这一跨越的关键技术底座。昆仑万维董事长兼CEO方汉 方汉在演讲中系统阐述了三大产业预判： 第一，世界模型将走出屏幕，进入物理世界。\n\n我们洞察到，具身智能正从实验室走向真实环境，这一趋势要求机器人在行动前先进行环境推演——预判动作后果、评估环境变化、及时调整应对策略。这种能力的突破，将使竞争焦点从单一任务转向陌生环境下的通用模型能力；谁能训练出在复杂场景中依然“看得懂、做得对”的模型，谁就拿到物理智能时代的入场券，这也是中国智能制造和机器人产业真正亟需的底层能力。第二，游戏行业将率先被世界模型改变。开放世界游戏不再依赖数百人团队数年的手工搭建，Matrix-Game 3.5 让虚拟世界随玩家行动实时生长、持续演化。未来三到五年，世界模型将成为游戏行业的基础设施，彻底刷新内容生产方式，而国产模型已在这一赛道领跑全球。\n\n第三， AI 音乐、AI视频等工具将从技术试验变成大众创作工具，促进  AIGC  的深层发展。Mureka 作为中国最强、全球前两名的音乐生成模型，率先去除“AI味”，让普通人也能把模糊灵感转化为有情绪、有温度的作品。这并非替代音乐人，而是大幅降低创作门槛，让更多人的表达得以释放，从而根本性改变音乐乃至整个 AIGC 产业的创作生态。三个产业预判，背后是同一个方向：让AI从“会生成”走向\"懂世界\"、\"能行动\"。方汉表示，这不只是昆仑万维一家公司的回答，更是中国AI从研发走向产业应用的一个缩影。\n\n2 AI 模型全球升级，掀起全模态内容生成革命 本次论坛上，昆仑万维集中完成了核心模型的全球重磅升级。2.1 Matrix-Game 3.5：Patch级记忆注入，重新定义 交互 世界模型 作为昆仑万维世界模型系列的最新迭代，Matrix-Game 3.5在本次论坛上带来了革命性的技术升级。Skywork首席科学家成宇在论坛上正式发布了Matrix-Game 3.5世界模型。Matrix-Game 3.5聚焦可交互世界模型技术，实现了Patch级别的记忆注入与系统级性能优化， 5B模型在720p分辨率下可实现单卡20FPS实时生成，具备1分钟记忆能力 。\n\nSkywork首席科学家成宇 成宇指出，世界模型是具身智能的“无限数据引擎”。传统数据采集面临人工成本高昂、实机采集耗时耗力、效率极低的痛点，无法满足大模型规模化需求。Matrix-Game 3.5构建了支撑下一代世界模型的无限数据生产体系，突破传统瓶颈，打造三条自动化数据生产管线，输出Video+Pose+Action+Language的高质量训练数据，目前已积累超500万高质量视频切片、超1万有效训练小时数、覆盖1200余个游戏场景。\n\n在技术架构上，Matrix-Game 3.5创新性地将历史帧切分为带有3D坐标的Patch Memory（通过Depth+Pose Lift到世界坐标系），推理时根据当前相机视锥检索可见Patch并重新投影到当前视角形成Mosaic，再作为Memory Token注入DiT，实现长期一致性的Patch级空间记忆。这一设计将Frame-level FOV Memory升级为Patch-level FOV Memory，带来四大核心优势：更准确的空间记忆检索与跨帧一致性、更稳定的相机运动生成、最大程度保留基座模型动态生成能力的In-context Learning、以及用户可自由编辑记忆块的可控记忆能力。\n\n此外，Matrix-Game 3.5在推理加速层面实现了DiT推理与VAE解码的全链路优化，通过“减少模型吞吐+DiT模型优化+VAE剪枝”三重手段，达成单卡20FPS 720p实时推理的业界领先性能，让高质量世界模型真正具备实时交互能力。Matrix-Game从1.0到3.5始终坚持开源路线。3.5版本宣布核心架构开源，吸引全球开发者共建生态。Matrix-Game 2.0是实时交互式世界模型技术范式中首个开源的实现方案，Matrix-Game 3.0则首次系统性地将记忆问题纳入开源解决方案。\n\n此前， DiT作者、纽约大学助理教授谢赛宁团队基于Matrix-Game 2.0的开源底座 ，发布了全球首个多人视频世界模型Solaris，也从学术圈的实际使用上印证了这套开源方案的基础模型价值。NVIDIA和浙大联合发布的工作Light Interaction基于Matrix-Game 3.0模型进行研发。另外，NVIDIA的SANA-WM和Adobe的RELIC等国际头部大厂世界模型均将Matrix-Game相关模型作为对比基准。\n\nMatrix-Game 3.5 开源地址 https://github.com/Riemann-Dynamics/Matrix-Game-3.5 2.2. Mureka v9.5与O3：最没有 AI 味的AI音乐模型，让音乐进入“版本化制作”时代 Mureka v9.5&O3 音乐大模型的发布，成为本次论坛最具情感冲击力的时刻之一。\n\n从SkyMusic 1.0内测到Mureka v9.5&O3，昆仑万维的音乐模型走过了一条从“作品成立”到“创作可控”再到“多模态创作”的演进路径。而v9.5版本首次喊出 “最没有AI味的AI音乐模型” 这一口号——它不再依赖声部堆砌和复杂编配制造“厉害”的第一印象，而是在真实的音乐框架中，以更为克制的方式处理编配、人声、情绪与Prompt意图，让音乐表达更自然、更真诚。O3 建立在新版 V9.5 之上，并通过 test-time scaling 扩展 MusiCoT 的推理过程。它不是简单地“生成得更多”或“想得更久”，而是让模型在生成过程中持续审视当前表达：局部旋律是否仍服务全曲目标，编配是否遮蔽人声，情绪是否提前透支，结构是否正在偏离最初意图。额外推理空间被用于回看偏差与自我修正，使音乐 CoT 能够逐步收敛，而不是一次决定后一路向前。\n\n歌曲的主观评分 从评测结果看，V9.5 沿着 MusiCoT 路线完成了更扎实的底座升级：旋律、人声、音质和编曲全面提升，指令精准度从 6.92 提升至 7.62。它不再把“更满、更复杂”当作唯一标准，而是在真实音乐框架中更克制地处理编配、人声、情绪和 Prompt 意图，让歌曲更自然、更真诚。O3 则建立在 V9.5 之上，通过持续推演、回看偏差和修正后续决策，进一步强化旋律发展、编曲结构与指令理解，使歌曲结构更完整、情绪更连贯、段落关系更合理。简单来说，V9.5 负责把歌做得更自然，O3 负责让模型在交付前多看、多想、多修一遍。\n\n提示词：以柔和钢琴、中文流行，氛围合成器和渐进式弦乐构建电影感情绪，男声贴近演唱，细腻、克制，从低声诉说逐渐走向情感释放。整体像雨夜里的未说出口的告别，忧伤但温柔，不煽情却充满力量 Featuring soft piano, Chinese pop influences, atmospheric synth layers, and gradual strings to create a cinematic emotional atmosphere. Intimate male vocals with delicate, restrained delivery, building from quiet storytelling to emotional release. Like an unspoken goodbye on a rainy night, melancholic yet tender, powerful without being dramatic. 今天，一首歌经常和视频一起被消费。短视频、游戏、影视预告、品牌片和虚拟人演出，都需要声音与画面共同表达。\n\nMureka 这次重磅升级，也把音乐与视频 MV 接进了同一条创作链路。用户可以从一张图、一段视频或 moodboard 开始，让系统理解画面的节奏、人物、空间和情绪，再生成与之匹配的音乐；当然，也可以从一首歌开始，让 Agent 理解歌词叙事、节拍编曲和情绪起伏，继续生成角色与 MV 的视觉方案。歌词决定叙事、节拍决定剪辑、旋律决定记忆点、画面决定传播场景。Agent 要做的，是让这些信息在同一个创作目标下持续传递，而不是把几个生成工具简单拼在一起。提示词：迷幻西海岸 G-Funk 街头说唱。深沉滑动的合成器低音、Moog 哨音、Talkbox 氛围、温暖 Rhodes、哇音吉他与复古磁带质感，配合松弛靠后的鼓点和沙哑男声，营造低底盘夜间巡游般的迷幻街头氛围。\n\nPsychedelic West Coast G-Funk street rap, featuring deep sliding synth bass, a melted Moog whistle lead, talkbox haze, warm Rhodes, muted wah guitar, warped cassette textures, and a lazy behind-the-beat groove. Raw raspy male vocals deliver relaxed, human street storytelling over a smoky lowrider night-cruise atmosphere, with no trap hi-hats, drill patterns, or EDM drops. 更为重要的是， Mureka已从单一的音乐生成工具演进为完整的“版本化制作”平台 。其差异不仅来自模型效果，更来自“模型训练—推理时选优—版本化创作工具—平台分发”的系统组合。同一创意可快速生成多版本，支持在旋律、人声、结构等维度进行局部保留与替换；\n\nStudio将“操作DAW”转化为“指挥创作”，降低门槛、抬高上限。同时，Mureka推出Character功能——一段声音、一张照片即可生成专属歌手角色，并贯穿歌曲、MV全链路；AI配乐能自动分析视频画面的场景、动作与情绪，创作更贴合内容的音乐；Mureka Agent则通过自然语言一次对话调用整曲生成、单轨生成、Remix、延伸、MIDI导出、声音克隆等全部能力，全程无需切换界面。\n\n正如昆仑万维所提出的愿景：AI音乐不再是简单的消费内容，而是升级为一种自我表达的语言。用户不仅是被动聆听者，更是主动表达者与参与者。Mureka正以模型能力、创作工具与平台分发的完整闭环，重新定义AI时代的音乐创作生态，让每个普通人的灵感都能有温度地落地，从“一个想法”到“歌词—人声—角色—歌曲—MV”的完整创作链路，全面释放AIGC的深层创作力。3 院士与行业领袖齐聚，共话世界模型未来 本次论坛还邀请了多位重量级嘉宾。中国科学院院士、南京大学教授、副校长周志华 受 邀 发表主旨演讲，围绕世界模型的前沿方向展开了深度分享。\n\n此外，我们邀请了 黎曼动力机器人创始人刘扬教授和Reactor Technologies, Inc. CEO兼联合创始人Alberto Taiuti  分别 介绍了黎曼机器人模型 1.0 版和Reactor加速世界模型在全球落地的经验。中国科学院院士、南京大学教授、副校长周志华 中国科学院院士、南京大学副校长周志华教授在题为《关于世界模型的讨论》的主旨演讲中，将世界模型划分为感知层、理解层与决策层，并着重指出决策层世界模型长期面临“多步推演复合误差平方级放大”与“样本复杂度过高”两大理论瓶颈。\n\n他分享了团队的最新突破：通过分布匹配技术可将推演误差从平方级压至线性级，验证了长序列推演的可行性。同时，通过创新性地逆向运用贝尔曼方程，将所需样本量降至原来的根号T分之一，为在战斗机操控、智能工厂等代价高昂的现实任务中构建决策世界模型提供了理论基础。他还提出“学件”概念——由模型与AI自动生成的“规约”共同构成，允许多个异构模型在不公开数据的前提下进行复用与组装，为世界模型从单产线定制走向可成长、可演化的模型生态开辟了新路径。\n\n黎曼动力机器人创始人刘扬教授 黎曼动力机器人近期推出的 Riemann-1.0，是其成立以来首个公开发布的成果—— 面向 Physical AI 的新一代 Embodied World Action Model 。该模型基于超过  23.2 万小时 多源具身交互数据训练，统一融合第一视角人类视频、UMI 示教与异构机器人轨迹，并提出全因果世界动作建模架构与三阶段渐进式具身预训练框架。Riemann-1.0 不再停留于仿真环境中的离线评估， 而是在多个国际主流机器人 Benchmark 与真实机器人任务上同步实现仿真与真机双 SOTA ，为机器人操作、实时自适应控制及高频人机协作等 Physical AI 场景提供了从“理解世界”到“干预世界”的生成式行动基础设施。\n\n真机评测：四大家居任务全面领先 Reactor Technologies, Inc. CEO兼联合创始人Alberto Taiuti 则从产业落地角度指出，世界模型已从静态、高延迟、无状态的媒体生成范式，跃迁至有状态、实时交互、具备因果逻辑的新范式。他强调，世界模型不再只是生成视频或图像，而是能够持续推演环境变化并支持双向人机交互的“生成式软件”雏形。他以公司同名平台“Reactor”为例，展示了为世界模型原生设计的开发者基础设施如何在保持极低延迟与流式传输的同时，支持机器人、游戏、仿真等高频交互场景。\n\nR eactor Technologies, Inc. CEO兼联合创始人Alberto Taiuti 在具身智能对谈环节， 黎曼动力机器人创始人刘扬 与 破壳机器人创始人、清华大学交叉信息研究院助理教授许华哲 围绕“具身世界模型的ChatGPT时刻”展开深度对话，探讨了世界模型与VLA的边界、机器人通用世界模型的训练瓶颈、具身智能的Scaling Law以及家庭机器人PMF等核心议题。4 全模态内容革命： AI 重塑视频、游戏、音乐与全球文娱 论坛压轴环节举行了“全模态内容革命——AI重塑视频、游戏、音乐与全球文娱”圆桌对话， 由 甲子光年创始人张一甲 主持。昆仑万维董事长兼CEO方汉，中国电影家协会副主席黄晓明，演员王珞丹，爱奇艺 高级副总裁 杨海涛，青年导演崔睿 共同参与 。\n\n从左至右分别为：甲子光年创始人张一甲， 昆仑万维董事长兼CEO方汉，中国电影家协会副主席黄晓明，演员王珞丹，爱奇艺 高级副总裁 杨海涛，青年导演崔睿 圆桌围绕AI与文娱产业的深度融合展开讨论：从演员和导演的AI创作初体验到AI演员与真人创作者的价值博弈，从AI重构平台内容生态到全模态AI重塑文娱赛道终局。嘉宾们一致认为， AI是文娱行业最好的工具与最大的革新者，而人类创作者永远是内容的灵魂缔造者 ，人机协同将成为全球文娱行业的新发展范式。\n\n王珞丹 以亲身体验，道出AI创作的\"痛并快乐着\"——为求一个理想镜头熬夜\"抽卡\"至凌晨四点，反复调整提示词却迟迟得不到想要的画面，直到清晨才终于抽到满意的镜头。她坦言自己作为\"小白\"创作者，从分镜、数字资产到人物设定一步步摸索，在这个过程中请朋友帮忙才得以完成。她认为 创作者首先是一个判断者和决策者，需要用审美去筛选和决定最终呈现的画面，而AI能带来超出想象的运镜和流动性 。她相信观众在意的是故事能否打动人心，而非媒介形态； 创作者始终是表达的核心 。黄晓明 提到自己曾看了一部朋友制作的AI电影，三个月前看时还能明显看出AI表演的痕迹，但最近再看时，即便被告知那是AI生成，他已经完全分辨不出来了，\"细节到脸上的斑点毛孔，甚至微表情、毛孔都在演戏\" —— 这种指数级的技术迭代让他真的惊到了 。\n\nAI不仅改变了他的创作方式，也融入了他的日常体验—— 他今天用Mureka生成了两首歌，效果很不错：“我很喜欢杨宗纬的风格，就让Mureka照着《空白格》生了一首抒情的，歌词还挺触动人心的。”从创作到投资，他对AI保持高度开放态度， 明确表示很想去投资一些AI相关的项目——无论是科技方向还是影视方向 。崔睿 指出，AI已在实际创作中显著提升了前期故事板的制作效率，让导演能以更低成本、更短时间完成视觉预演；后期阶段，AI还能有效补足因天气等客观因素无法实拍的镜头缺失。在他看来，AI在影视制作中最能发挥价值的场景，恰恰是那些人力成本最高、执行最繁琐的“技术难题”—— 比如需要成千上万群演的大场面，这正是AI最擅长解决的领 域。\n\n提及昆仑万维的AI视频模型SkyReels，他认为一致性非常突出——能有效解决创作者最头疼的“抽卡”效率问题 ， 在系列化制作中保持人物、物体的稳定统一，避免反复尝试的无效劳动 ；同时音画同步能力也值得肯定。整体来看，他认为AI视频工具值得创作者去尝试和使用。杨海涛 从平台数据出发，透露爱奇艺后台每日收到超3000部AI短剧与上千部AI漫画，AI内容观看数据持续提升。他以爱奇艺\"燎原计划\"扶持的网络电影《恶念》为例，AI在电影镜头特效制作方面实现超50%的提效， 从导演构思到成片可节约三周以上的时间 ，他预计暑期将上线更多AI参与的网络故事片。\n\n方汉 作为技术方表态，承诺将持续降低创作门槛与Token成本，实现\"人人如龙\"的文化平权。他坦言技术上的难点并非大场面、爆炸等传统拍摄中昂贵的镜头，反而是小众场景数据量不足导致效果不佳；同时解释AI生成人像\"塑料感\"的来源是扩散模型的去噪机制将所有面孔平均化， 因此让模型更真实是所有从业者的共同目标 。他预测后AI时代， 演员需学导演、导演需学表演，角色边界将日益模糊 。所有嘉宾共同指向一个共识：AI不会消解人的创造力，反而倒逼创作者更珍视自身的独特体验与情感表达，在技术赋能下回归内容的本真。\n\n5 从“生成内容”到“理解物理世界”：昆仑万维的下一个十年 从2022年“All in AGI与AIGC”战略确立，到2026年“世界模型元年”的正式宣告，昆仑万维完成了从全模态内容生成到可交互世界模型的关键跃迁。在世界模型和AIGC方向上，昆仑万维交出了全球领先的答卷。2026年，昆仑万维正以世界模型为支点，撬动AGI时代的下一场多模态范式革命。世界模型元年，未来已来。", "zh": true}, {"seq": 3, "title": "面壁智能开源 MiniCPM-Robot 具身智能模型系列", "source": "X：面壁智能 OpenBMB (@OpenBMB)", "summary": "面壁智能开源首个具身AI模型系列 MiniCPM-Robot，包含 1.5B 参数的通用视觉-语言-动作（VLA）模型 MiniCPM-RobotManip 和用于目标跟踪的 MiniCPM-RobotTrack。同时发布高性能推理框架 PhyAI，旨在让机器人实现理解、记忆与行动。", "url": "https://x.com/OpenBMB/status/2078839529591759025", "permalink": "https://aihot.virxact.com/items/cmrrvig4h01ctbi5qyidwptd7", "publishedAt": "2026-07-20T00:00:00.000Z", "exact": false, "content": "OpenBMB 在 X 平台发布：\"🚀 MiniCPM 进入物理世界——让机器人能够理解、记忆并行动。我们开源了首个具身智能模型系列 MiniCPM-Robot，包括：🤖 MiniCPM-RobotManip —— 一个 1.5B 参数的通用视觉-语言-动作（VLA）模型，用于机器人操作。🐕 MiniCPM-RobotTrack —— 一个紧凑型模型，用于现实世界目标跟踪。⚡ PhyAI —— 一个专为具身模型打造的高性能推理框架。它们共同将高效、实用且开放的具身智能推向现实世界的机器人。⭐ GitHub：https://t.co/65OuyHfxvN 🤗 MiniCPM-RobotManip：https://t.co/Oj5qPgpbFv 🤗 MiniCPM-RobotTrack：https://t.co/YQVNoCHjJr\"", "zh": true}, {"seq": 4, "title": "MiniCPM5-2B发布：4B以下全球性能第一，适配9款芯片", "source": "公众号：面壁智能（MiniCPM）", "summary": "面壁智能联合OpenBMB发布端侧模型MiniCPM5-2B，以2B参数量在AA-Index榜单取得4B以下模型最高分17分，平均分54.26，超越Qwen3.5-2B等竞品。模型原生支持混合思考与512K上下文，已完成华为昇腾、英伟达等9款芯片的Day0适配，即将开源。", "url": "https://mp.weixin.qq.com/s/rjFxrUylyGMqa5QtgypCdw", "permalink": "https://aihot.virxact.com/items/cmrru2n5x00vzbi5qea6youod", "publishedAt": "2026-07-20T00:00:00.000Z", "exact": false, "content": "WAIC 2026 | 最新「小钢炮」MiniCPM5-2B亮相：适配多款芯片、4B以下全球性能第一 面壁智能  7月19日上午，面壁智能主办的「智在终端 惠及千行」分论坛在世界人工智能大会上圆满举行。论坛上，面壁智能联合 OpenBMB 正式发布了最新端侧模型「小钢炮」MiniCPM5-2B，并完成多款芯片的适配。根据权威榜单AA-Index，MiniCPM5-2B 仅以 2B 参数量取得了全球 4B 以下模型的最高得分、位于榜首，并同步开源数据治理方案 UltraX 与智能体训练全流程技术。\n\n与此同时，MiniCPM5-2B 联手众智 FlagOS 社区，完成了9款芯片的 Day0 适配。面壁智能与 AMD、 英特尔、 联发科、 高通等主流芯片厂商的适配成果也一并公布，多芯片生态覆盖从云到端。01 4B以下全球性能第一 在最新的 Artificial Analysis（AA）榜单评测中，MiniCPM5-2B 更是以 17 分的优异成绩占据榜首，成为 4B 以下模型中当之无愧的性能标杆。\n\n根据多个权威基准评测，MiniCPM5-2B 的平均分为 54.26，在 4B 以下参数级别的基础模型中综合能力位居首位。对比同量级的 Qwen3.5-2B（41.66）、Qwen3-1.7B（40.89）和 Gemma-4-E2B-it（37.62），分数优势显著，且超过采用 8B 稀疏架构的 LFM2.5-8B-A1B（49.15）： MiniCPM5-2B 模型原生支持混合思考，可在快速响应与深度推理之间灵活切换，同时提供 512K 超长上下文窗口，单次可处理整本长篇小说或数十万行代码。能力维度覆盖通用知识、数学与代码推理、复杂指令遵循、多语言理解与生成、长文本处理、工具调用及深度搜索，形成当前 4B 以下最为完整的任务覆盖。\n\n在关键单项评测中，MiniCPM5-2B 的长文本理解任务AA-LCR得分 42.33，超出第二名逾 16 分；Agent 能力 τ²-Bench Telecom 得分 90.35，领先 LFM2.5-8B-A1B 达 4.97 分；数学推理 AIME-2026 得分 60.95，明显高于 Qwen3-1.7B（36.88）与 Gemma-4-E2B-it（32.71）。此外，逻辑推理 ZebraLogic 得分 69.60，在对比模型中位列第一。这些结果直接对应端侧智能体的复杂交互与多步推理场景，体现模型在真实任务中的可用性。\n\n为在互联网数据红利趋缓的背景下持续提升模型能力，MiniCPM5-2B 也提出了分级数据治理技术 UltraX。该方法构建一个 0.6B 小模型，对 L1 网页数据实施程序化精炼，将数据治理从传统清洗升级为行级增、删、改的可执行编辑程序。UltraX 能够完成行级插入、文段级删除和片段级替换等操作，并将大模型生成的精炼文本进一步转化为可校验、可追溯的编辑程序，实现大规模数据治理的自动化与高质量闭环。在端侧智能体能力上，MiniCPM5-2B 实现了从预训练到强化学习的全流程 Agent 构建。\n\nMiniCPM5-2B 原生具备工具调用、深度搜索和代码生成等智能体核心能力。训练阶段先后执行 200B 规模的 Agent Midtraining、百万条高质量轨迹的 Agent SFT 以及可扩展的 Agent RL 对齐优化，确保智能体行为稳定可靠。这一设计使得 模型可直接作为端侧智能体基座，为手机、PC、智能座舱等设备上的本地化 AI 助手构建提供支撑。02 FlagOS社区9芯片Day0适配， 实现从云到端跨架构覆盖 众智 FlagOS 社区基于统一多芯片软件栈，通过 vLLM-plugin-FL 与 SGLang-plugin-FL 推理插件，第一时间完成 MiniCPM5-2B 的 Day0 跨芯片适配与推理验证。\n\n此次适配覆盖华为昇腾、海光、昆仑芯、沐曦、摩尔线程、平头哥、清微智能、天数智芯、英伟达共 9 款 AI 芯片，并延伸至 ARM 端侧平台，实现「一套代码、跨架构运行」的从云到端生态覆盖。评测结果显示，各芯片平台推理精度与 NVIDIA 平台整体对齐，部分芯片推理性能经过FlagOS技术栈的优化，追平或超越 NVIDIA 单位算力基线，实现更高的性价比。面向上述芯片的 FlagOS 适配镜像与多芯片模型版本，将随 MiniCPM5-2B 模型开源（目前暂未开源）同步在魔搭和 Hugging Face 上发布，开发者可开箱即用。这是继 MiniCPM5-1B 之后，FlagOS 社区与面壁智能的又一次 Day0 深度协同。双方将持续深化合作，共同推动高效端侧模型在多元算力生态的普惠落地。\n\n03 多芯片生态覆盖 与  AMD、Intel、Mediatek、Qualcomm 全面适配 MiniCPM5-2B 在多芯片平台适配方面持续拓展生态边界。目前，面壁智能已完成对 AMD、Intel、Mediatek、Qualcomm（按首字母排序）等全球主流芯片厂商的端侧模型适配，形成覆盖云、边、端的多元算力支持能力。与英特尔的协同从单点适配升级为战略合作。双方于 WAIC 2026 现场签署合作备忘录，围绕端侧大模型与芯片平台协同优化、产品化及生态共建展开全面协商。此前，基于英特尔 18A 制程 Core Ultra 平台提供 180 TOPS 算力，支持 35B 参数模型本地部署。\n\n此外，面壁智能与 AMD、联发科的端侧模型适配工作也在持续推进，相关模型版本已完成验证，进一步扩展了 MiniCPM 系列在多芯片生态中的可用性。在不久的将来，MiniCPM5-2B 将正式开源，开发者可通过 Hugging Face、魔搭等平台获取模型权重，同时可获取针对各芯片平台的适配镜像与部署指南。面壁智能将持续与芯片厂商及开源社区协同，推动端侧模型在多元算力场景中的规模化落地。", "zh": true}]}, {"label": "产品发布/更新", "color": "#059669", "items": [{"seq": 5, "title": "transcribe.cpp 发布：基于 ggml 的跨平台语音转录库，支持 16 个 ASR 模型族", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "summary": "transcribe.cpp v0.1.0 发布，一个基于 ggml 的语音转录库，支持 16 个 ASR 模型族（60+ 模型），并通过 Vulkan、Metal、CUDA 和 TinyBLAS 实现 GPU 加速。", "url": "https://workshop.cjpais.com/projects/transcribe-cpp", "permalink": "https://aihot.virxact.com/items/cmrr7sdid02ybbi18afm9lr2i", "publishedAt": "2026-07-20T00:00:00.000Z", "exact": false, "content": "项目 - transcribe.cpp 项目种子文件 关于 transcribe.cpp 2026年4月至今 今天我非常激动地分享 transcribe.cpp。transcribe.cpp 是一个基于 ggml 的转录库，支持所有最新的转录模型。handy-computer HF 组织下发布的每个模型都经过了数值验证和 WER 测试，确保与参考实现一致。它在所有平台上都能加速运行。我是 Handy 的作者和维护者。这个库源于将跨平台语音转文字应用分发给众多用户时所遇到的痛点。这是一个 v0.1.0 版本的库，意味着存在一些我自己无法发现的粗糙之处！请报告它们，让我们一起修复！\n\n动机 让我直说吧。我认为使用当前的 ASR 推理栈来分发跨平台应用非常糟糕。基本上只有 whisper.cpp 和 ONNX 可选。你可以为苹果设备引入 MLX，但这样就需要支持两个不同的引擎，并将模型移植到每个引擎上。我一直是 ONNX 的粉丝，因为它能快速将模型支持引入 Handy，但仅靠 CPU 会损失大量性能。据我所知，市面上有一些声称支持大量模型的零散库，但它们的作者不明，测试情况也不清楚。它们给我的问题比答案还多：他们什么时候会停止维护这个库？创建者是否考虑过绑定，以便你可以在真正的桌面或移动应用中使用它？这本质上只是演示代码吗？他们做过基准测试吗？它比 ONNX 快吗？\n\n正是这些原因催生了 transcribe.cpp。作为 Handy 的维护者，我需要一个可以信赖的库。一个能下载文件并直接运行推理的库。一个能确保引擎中模型推理结果与参考实现一样好的库。推理应该在 GPU 上运行以获得最佳性能。它应该能轻松嵌入到 Handy 中，不能是一个庞大的 PyTorch 库。它必须能在 Mac、Windows 和 Linux 上运行。而 ggml 显然是目前最好的选择。它拥有强大的社区和出色的分发能力。\n\n那么你能得到什么？\n- 一个快速准确的推理引擎，支持广泛的模型\n- 支持 16 个 ASR 系列（60+ 个模型），更多模型即将加入\n- 通过 Vulkan、Metal、CUDA 和 TinyBLAS 加速\n- 每个模型都经过数值验证和 WER 测试\n- 支持流式转录\n- 支持批量转录\n- 几乎可以替代 whisper.cpp\n- 维护者支持的 4 种语言绑定：Python、JavaScript/TypeScript、Rust、ObjC/Swift\n\n广泛的模型支持 我们打算支持尽可能多的最先进的转录模型。截至目前，我们支持大多数公开可用的现代转录模型。还有一些缺失，但很快就会加入。\n\n加速支持 我的首要目标之一是在 Vulkan 上运行任何我想要的 ASR 模型。在我看来，这是任何提供本地推理的应用的最低要求。对于我们支持的每个模型，我们都在 Ryzen 4750U（CPU + Vulkan）上运行了 Fedora 的基准测试，以及在我的 M4 Max 上进行了测试。\n\n数值验证 我还希望确保 transcribe.cpp 中的推理准确，并尽可能接近参考实现。这主要源于我在 Hugging Face 上使用 .onnx 模型时对推理准确性的巨大不确定性。为了确保我们的推理正确，我们对每个模型进行数值验证。\n\ny模型与参考模型对比。除了数值验证外，我们还进行了完整的WER（词错误率）扫描，确保无论参考模型输出什么，我们的输出都与之完全一致。这意味着每个模型都经过了数千条语音片段的测试，结果与参考模型非常接近或完全相同。这些数据的结果已发布在transcribe.cpp仓库中，同时每个模型在Hugging Face上也有对应说明。\n\n作为whisper.cpp的替代方案，transcribe.cpp基本实现了对whisper.cpp的即插即用支持。主要原因在于：Handy使用了whisper.cpp，而我需要发布一个用transcribe.cpp替换它的更新版本。因此我必须保持与whisper.cpp中广泛使用的.bin文件格式的兼容性——这些文件随Handy一起发布，而transcribe.cpp能够直接运行它们。目前whisper.cpp中部分标志位和功能尚未得到支持，但我认为对于绝大多数使用场景而言，我们的whisper实现已经足够稳定，可以在保持相近性能的同时替代whisper.cpp。\n\n真实场景下的语言绑定从一开始就是我的核心考量。虽然这个库是用C/C++编写的，但我需要Rust语言的绑定。同时我深知，要让本地语音转录功能得到最广泛的应用，至少需要提供优质的一流语言绑定支持。我选择了四种我认为能代表主流用户群体的语言。欢迎其他贡献者直接为项目添加绑定支持，前提是他们愿意承担相应的维护责任。当然，最终许多决策都源于Handy的实际需求。由于Handy广受欢迎，我打算持续维护这个库，正如我尽力维护Handy一样。我希望成为持续维护开源项目、为生态系统贡献力量的开发者。如果没有Handy，这个库根本不会存在——因为我就不会遇到需要支持多种ASR模型的问题，也不会了解到用户对ASR的各类使用场景。我已尽力覆盖最常听到的需求，但库中确实还存在未处理的情况。如果有所遗漏，欢迎您为这个库贡献代码！\n\n让本地语音转文字更易用 transcribe.cpp的明确目标是降低本地运行ASR的门槛。我们深知语音转录可以在大多数设备上实现极高精度，完全没有必要将语音发送到云端服务。即使是RK3566这样的设备，在其性能有限的CPU上也能通过transcribe.cpp以超实时速度运行模型。用SOTA模型实现超实时转录，功耗仅需几瓦。这不是空想，而是现实。展望未来，出于各种原因，越来越多的推理任务将在本地完成。这使分发问题成为核心焦点。要让更多应用在本地运行推理，我们需要降低推理的难度。当然，transcribe.cpp并未完全解决这个问题，前路漫漫，但我希望它能成为一小步前进。在这个过程中，我确实学到了很多。\n\n致谢 我由衷感谢所有支持这个项目的人。首先要感谢Mozilla AI及其BiR计划，特别感谢Mozilla AI的Davide。这个项目最初只是我脑海中的一个构想，当我向他们提出时，他们决定支持我解决这个问题。当时transcribe.cpp甚至还不存在。\n\n具体来说，我一直在探索如何解决 Handy 中的加速分发问题。因此，非常感谢他们的支持与帮助，让这个项目得以实现。ggml 是这一切的基础，没有 ggml 及其所有贡献者，这个项目就不可能存在。感谢大家付出的所有努力。我认为 ggml 在帮助实现本地推理应用的轻松分发方面，确实做出了卓越的贡献。Modal 也给了我关键性的帮助。我联系了他们，他们提供了积分支持。这些积分用于进行 WER 测试，并确保该库在 CUDA 上运行良好。能够验证工作的正确性，这对我帮助极大。Blacksmith 为 transcribe.cpp 的部分 CI/CD 提供了支持。同样，我联系他们后，他们立即给予了积分支持。当然，CI/CD 对于确保发布的每个版本都经过至少一定程度的测试至关重要。Hugging Face 既是本地 AI 社区的支柱，也提供了 handy-computer 组织的私有存储空间，让我可以自由上传模型。AI 辅助？当然有。我认为单凭个人之力，不可能在几个月内从零开始用 ggml 写出如此规模的引擎，而不借助外部帮助。这里的文字有 AI 参与吗？没有。它们都来自我的口述或我的手指。", "zh": true}, {"seq": 6, "title": "ChatGPT Work 功能：建站、邮件、文档处理", "source": "X：Tibo (@thsottiaux)", "summary": "ChatGPT Work 适用于 ✅ 创建和托管网站 ✅ 为你管理电子邮件 ✅ 总结海量文档 ✅ 制作一流的文档、表格和幻灯片 已在你的移动应用或 http://chatgpt.com 上提供，包含在 Plus、Pro、Business 和 Enterprise 套餐中。", "url": "https://x.com/thsottiaux/status/2078697631019303273", "permalink": "https://aihot.virxact.com/items/cmrraq5dk03p5bi18vyrt83kp", "publishedAt": "2026-07-20T00:00:00.000Z", "exact": false, "content": "Tibo on X: \"ChatGPT Work is for ✅ Creating and hosting sites ✅ Managing your emails for you ✅ Summarizing mountains of documents ✅ Creating top-notch docs, sheet and slides Already in your mobile app or on https://t.co/WtXdTqu9lT, included in Plus, Pro, Business and Enterprise plans\""}]}, {"label": "行业动态", "color": "#d97706", "items": [{"seq": 7, "title": "黄仁勋访日：Nvidia 联手日本打造物理 AI 时代，Noetra 主权 AI 工厂与 Cosmos 机器人联盟落地", "source": "TechCrunch：AI（RSS）", "summary": "Nvidia CEO 黄仁勋在 7 月 15-16 日访日期间，宣布为日本建设“Vera Rubin AI 工厂”，配备 13,750 颗 Vera CPU 和 27,500 颗 Rubin GPU，预计 2028 年投运。", "url": "https://techcrunch.com/2026/07/19/what-to-watch-for-after-jensen-huangs-japan-visit", "permalink": "https://aihot.virxact.com/items/cmrsbql4401gxbiuaj7s1567n", "publishedAt": "2026-07-20T00:00:00.000Z", "exact": false, "content": "", "zh": true}]}, {"label": "技巧与观点", "color": "#0284c7", "items": [{"seq": 8, "title": "AI 热潮正在瓦解全球决策机制", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "summary": "一位拥有 300 多次行业交流经验的从业者观察到，全球公私机构正陷入集体性 AI 狂热，决策层要么没有计划，要么只能低头回避。过去一年半中，其团队所见的所有 AI 项目均以失败告终（成功率 0%），失败原因常与 LLM 能力无关，而是企业本就难以有效运行软件项目，且 AI 项目叠加了额外风险。内部聊天机器人几乎无人使用，客户服务聊天机器人也极少带来良好体验，例如三菱的语音客服承诺回电却六周未兑现。", "url": "https://ludic.mataroa.blog/blog/ai-mania-is-eviscerating-global-decision-making", "permalink": "https://aihot.virxact.com/items/cmrrd5bjb00cfbikihob9drtj", "publishedAt": "2026-07-20T00:00:00.000Z", "exact": false, "content": "", "zh": true}]}]};
function pad(n){return n<10?"0"+n:""+n;}
function toBeijingHuman(iso, ref, exact){
  const d=new Date(iso); const bj=new Date(d.getTime()+8*3600*1000);
  const Y=bj.getUTCFullYear(),M=bj.getUTCMonth()+1,D=bj.getUTCDate();
  const h=bj.getUTCHours(),m=bj.getUTCMinutes(); const hh=pad(h),mm=pad(m);
  if(!exact) return M+"月"+D+"日";
  const [rY,rM,rD]=ref.split("-").map(Number);
  if(Y===rY&&M===rM&&D===rD) return "今天 "+hh+":"+mm;
  const yest=new Date(rY,rM-1,rD); yest.setDate(yest.getDate()-1);
  if(Y===yest.getFullYear()&&M===yest.getMonth()+1&&D===yest.getDate()) return "昨天 "+hh+":"+mm;
  return M+"月"+D+"日 "+hh+":"+mm;
}

  var re=/(\[[^\]]+\]\((https?:\/\/[^)\s]+)\))|(https?:\/\/[^\s<>"'）】」』，。、；：！？]+)/g;

      return '<a class="r-link" href="'+g2+'" target="_blank" rel="noopener noreferrer">'+label+'</a>';

}

}

    if(sum){
      // 来源站点多为付费墙 / 登录墙 / 反爬限制，无法镜像全文；展示已本地存档的中文摘要兜底
      body.innerHTML='<div class="r-fallback">⚠️ 该条新闻的<b>全文镜像暂不可用</b>（来源站点可能为付费墙 / 登录墙 / 反爬限制，或原文已失效）。下方为已<b>本地存档的中文摘要</b>，可正常查看；完整原文请点击右下角「查看原文 ↗」。</div>'+
        '<p class="r-summary">'+linkify(escapeHtml(sum))+'</p>';
    }else{
      body.innerHTML='<p class="r-empty">暂未获取到该条新闻的全文镜像与摘要。'+(it.url?'可点击右下角「查看原文 ↗」前往原始报道。':'')+'</p>';
    }
  }
  document.getElementById("readerTitle").textContent=it.title;
  document.getElementById("readerSource").textContent=it.source;
  const link=document.getElementById("readerLink");
  if(it.url){link.href=it.url;link.style.display="";}else{link.style.display="none";}
  r.hidden=false;document.body.style.overflow="hidden";
}
function closeReader(){const r=document.getElementById("reader");r.hidden=true;document.body.style.overflow="";}
document.getElementById("reader").addEventListener("click",function(e){if(e.target===this)closeReader();});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeReader();});
</script>
</body></html>
