c7", "items": [{"seq": 1, "title": "实测 DeepSeek V4.1 Flash：价格大降、原生带视觉，作者用游戏与城市生成任务验证表现", "source": "公众号：卡尔的AI沃茨", "summary": "作者实测 DeepSeek V4.1 Flash，缓存命中输入降价 7 倍多、输出砍三分之二，9 月 14 日中午 12 点起所有发往 v4-pro 的请求将被强制路由到 4.1 Flash 并按其低价计费。", "url": "https://mp.weixin.qq.com/s?__biz=Mzg3MTk3NzYzNw%3D%3D&mid=2247511119&idx=1&sn=0f53b5017e41b16afc9b201966ce2bda", "permalink": "https://aihot.news/items/cmtwsc5gt09uarow7n2r2jrz3", "publishedAt": "2026-09-11T04:24:28.000Z", "exact": true, "content": "： ， 。 视频 小程序 赞 ，轻点两下取消赞 在看 ，轻点两下取消在看", "zh": true}, {"seq": 2, "title": "Beren Millidge、John Schulman、Charlie O'Neill 对谈递归自我改进离我们还有多远", "source": "Dwarkesh Patel：Podcast & Blog（RSS）", "summary": "Dwarkesh Patel 与 Zyphra CTO Beren Millidge、Thinking Machines 首席科学家 John Schulman、Baseten 模型训练负责人 Charlie O'Neill 三位研究者对谈递归自我改进（RSI）的前景。", "url": "https://www.dwarkesh.com/p/john-beren-charlie", "permalink": "https://aihot.news/items/cmtx7e9sn09mmroedph6hkyx4", "publishedAt": "2026-09-11T16:28:11.000Z", "exact": true, "content": "}]]}]]}]]}] 36:T1c161, 我召集了几位我所认识的最有洞见的 AI 研究者，他们都在偏开放型的公司工作，因为我想了解前沿究竟在发生什么、接下来又会怎样。\n\n00:00:00 – 为反对 RSI 的观点做最强论证\n\n今天，我和三位 AI 研究者朋友聊天，每次交谈我都能从他们身上学到很多。他们恰好也在一些偏开放型的实验室和公司工作，所以你们可以真正地公开表态。和我一起的是 Beren Millidge\n\n我认为，对于当前 AI 能否实现任何形式的极快速 RSI 来说，这确实是关键问题。AI 在学会自己的目标方面能泛化到什么程度？要拥有任何形式的自我驱动自动化循环，我们需要 AI 提出目标、优化目标、搞清楚这一点、提出新目标，并且让这一切在很长很长一段时间内都不会在任何环节失控。\n\n回到莫拉维克悖论，可能存在这样一种莫拉维克悖论的情形：我们认为这种自主性和自我封装——也就是我们可以自己思考该做什么，然后去执行，并形成这样一个循环——超级简单，因为我们一直都在这么做。显然，进化需要创造出能够长时间独立生存的生物。而这可能恰恰是某种出于某种原因对 AI 来说极其困难的事情，就像运动控制之类的事情极其困难，而数学虽然对我们来说超级难，对 AI 却超级简单一样。\n\n但John Schulman\n\n我看到一些关于有人微调Beren Millidge\n\n确实如此，因为显然一个 AI 研究者也可以是远程工作者。\n\nCharlie O'Neill\n\n我想的是普通白领工作在一个月周期内的情况。我觉得超过两个月后就开始有点分化了。\n\n一个非常称职的白领工作者，但不一定是极具创造力的研究员。\n\nJohn Schulman\n\n我会说两年。\n\n两年？10 倍？好吧。你呢，Beren？\n\nBeren Millidge\n\n其实我大概能理解，因为现在在编程方面肯定已经超过 10 倍了。所以如果它能做哪怕一两轮实验反馈的循环，那已经会是巨大的飞跃了。\n\n所以，AI 研究员的生产力在两年内提升 10 倍。如果你把这个代入一个非常朴素的 AI 进展模型，看看其中有多少来自 AI 研究员，而他们的生产力又提升了 10 倍，那么从两年后开始，AI 进展的速度将被极大地加速。\n\nBeren Millidge\n\n我认为这意味着 AI 进展的瓶颈将不再是 AI 研究员运行小型实验的能力，而是会转移到其他方面。\n\n当然。但它就是快了 10 倍，这本身就是件大事。这也会让下一件事——带来 100 倍加速的那件事——更早发生，以此类推。\n\nCharlie O’Neill\n\n我愿意在那件事上多花一点时间。\n\n关键点是什么？\n\nCharlie O’Neill\n\n我吸收信息、并对下一个实验做出贝叶斯最优决策的能力。\n\nBeren Millidge\n\n我假设你可以把其中一部分委托给 AI。AI 在决策方面正变得相当不错。它运行了这个实验，得到了这个结果，它就去运行下一个实验。如果它能连续运行两三个实验而不崩溃，那实际上就是一个很大的提升。\n\n好，最后一个问题。一个在所有可以通过计算机完成的工作领域中都能超越顶尖人类专家的 AI。所以不只是 AI 研究，而是所有认知工作。不只是短周期的工作，而是字面意义上，即使需要三年左右，AI 仍然会比人类做得更好。\n\nBeren Millidge\n\n这基本上就是 ASI 了吧？\n\nJohn Schulman\n\n我会说是 3-4 年。\n\n什么鬼？我是说，这看起来倒也没错，但是——\n\nJohn Schulman\n\nAI 显然正受到越来越多的关注。这是比较难的事情之一，但大量精力正投入其中。它对 AI 来说也不算最难的事情之一，因为它涉及大量代码和数学，而模型在这方面非常擅长。\n\n对于涉及 3D、空间和物理的东西，我认为那会需要更长时间。如果是机械工程之类的，而且目前没有得到最多的关注，那可能需要更长时间。\n\n但它也确实包括一些由于领域性质而数据相对较少的领域，模型必须边做边学这些数据。例如，它必须在台积电（TSMC）当工程师这件事上达到超人水平之类的。\n\nJohn Schulman\n\n所以你得假设你能给 AI 同样的入职培训材料。然后还得解决更长周期学习的问题。\n\nCharlie O’Neill\n\n我会说 5 到 10。\n\n所以基本上，你认为自动化 AI 研究是 ASI 完备的之类的？\n\nCharlie O'Neill\n\n是的，我想是这样。我觉得世界上有太多事情，即便你有一个模型外部的某种记忆系统，即便上下文长度增长了一些，但有些东西从根本上来说，即便你可以自己去检索信息或做笔记，你今天仍然需要一个超过百万 token 的上下文窗口。\n\nBeren Millidge\n\n我在 5 年这个时间范围上大致同意，至少对于各家实验室正在聚焦的那些东西来说是这样。但我觉得会有一条很长的尾巴，那些东西 AI 理论上可以去学习，但没有人费心去做，算力也没有分配到那上面。所以要真正做到覆盖每一个人类专家，可能需要更长时间。\n\n抱歉，我这么说也包括了像人类一样快速学习一个新领域的能力。\n\nBeren Millidge\n\n我觉得那未必是必要的，因为 AI 将拥有远超任何人类的经验。\n\n非常感谢各位参与这次讨论。我觉得这是一个很好的形式，让不同的专家表达分歧、展开辩论并一起探讨。非常有收获。\n\nJohn Schulman\n\n感谢邀请我们。 31:[", "zh": true}, {"seq": 3, "title": "Grok Bot 摘要 SpaceX CFO Bret Johnsen 在 Goldman Sachs Communacopia 的演讲要点", "source": "X：Elon Musk (@elonmusk, xAI)", "summary": "Elon Musk 转发 Grok Bot 对 SpaceX CFO Bret Johnsen 在 Goldman Sachs Communacopia 演讲的摘要。", "url": "https://x.com/elonmusk/status/2098217236771295567", "permalink": "https://aihot.news/items/cmtw9fws408trrolkp9glkz9j", "publishedAt": "2026-09-11T01:09:06.000Z", "exact": true, "content": "Grok Bot 今天 SpaceX 首席财务官 Bret Johnsen 在高盛 Communacopia 的总结。 垂直整合 垂直整合是公司的核心运营模式，而不是副业战略。\n- 火箭：自己的金属→发动机→航空电子设备→软件\n- Starlink：自己的发射、卫星和", "zh": true}, {"seq": 4, "title": "GitHub 日韩营销负责人如何用 GitHub Copilot 把活动运营自动化", "source": "GitHub Blog", "summary": "GitHub 日韩地区营销负责人 Tomoko Tanaka 分享如何不写代码，把活动运营交给 GitHub Copilot 自动化。", "url": "https://github.blog/ai-and-ml/github-copilot/marketing-ops-as-code-automating-events-from-planning-to-follow-up-on-github", "permalink": "https://aihot.news/items/cmtxbm8dp037xrouueja171wr", "publishedAt": "2026-09-11T18:26:10.000Z", "exact": true, "content": "}]]}]]}]]}] 37:T3dee, 我在日本和韩国负责 GitHub 的市场营销，而活动正是这项工作的核心：面向企业开发者的系列网络研讨会、东京的社区聚会、首尔仅限受邀者参加的高管闭门会。这个市场的开发者当下真正需要什么？哪些话题值得他们花上一小时？谁又该出现在现场？我很乐意整天琢磨这些问题。\n\n决策之后的事情则是另一回事。一旦活动获批，一套固定的流程便随之启动：\n\n- 在我们的活动平台上复制一个落地页。\n- 生成一组带 UTM 标记的链接：每个渠道一个，每个都按特定格式排好。\n- 起草邀请邮件，并向负责发送的团队提交请求。\n- 把活动添加到两个项目看板上。\n- 活动开始前每天早上：下载报名者名单，清理数据，为相关方发布一条状态更新。\n- 活动结束后：导出参会者名单，重新整理成可上传 CRM 的格式，给相应的记录打上标签，并撰写一份报告。\n这些任务单看都不难，但每一个都可能让你贴错链接、漏掉一天，或者拼错一个活动名称——而下游有 15 份报告都依赖它。\n\n事情是这样的：我以前是一名工程师。我的第一份职业是在 Linux 服务器上为企业客户维护数据库的运转。虽然我的编码能力可能已经生疏，但我依然能一眼看出哪条流水线亟待自动化。这正是我用上 \u003ca href=", "zh": true}, {"seq": 5, "title": "OpenAI 详解存储平台 Habitat 如何扩展支撑超 10 亿 ChatGPT 用户（上篇）", "source": "OpenAI：官网动态（RSS · 排除企业/客户案例）", "summary": "OpenAI 发文（系列上篇）讲述其在线存储平台 Habitat 的演进：现每秒处理超 7000 万请求、服务每周超 10 亿用户、管理超 500PB 数据，覆盖近 40 个地区。", "url": "https://openai.com/index/scaling-storage-one-billion-users-part-one", "permalink": "https://aihot.news/items/cmtx7f9mi09psroed4b1w3nsv", "publishedAt": "2026-09-11T10:00:00.000Z", "exact": true, "content": "}]]}]]}]]}] 37:T6894, 我们如何用 Python 改造应用存储平台 Habitat，以应对前所未有的增长。\n\n作者：Jon Lee、Chaomin Yu 和 Ben Ries，技术团队成员\n\n每一款 OpenAI 产品都依赖于快速、可靠的数据访问，无论是用户登录、查看其 Codex 设置，还是在 ChatGPT 中开启一段新对话。这些操作中的每一个，在产品能够响应之前，都可能需要许多次独立的数据查询。如果这些请求很慢，产品就会显得很慢。如果这些请求失败，产品就会彻底停止工作。\n\nHabitat 是我们构建的在线存储平台，让 OpenAI 产品能够快速、可靠地访问所需信息。Habitat 现在每秒处理超过 7000 万次请求，支撑着每周超过 10 亿人使用的产品，覆盖近 40 个地理区域。两年前，Habitat 还只是一个连接到单一数据库的简单 Python 客户端库。如今，它已是一个复杂的分布式系统，服务于超过 500 PB 的数据。\n\n图 01 · 什么是 Habitat？\n\n在线存储平台\n\nHabitat 是我们构建的在线存储平台，让 OpenAI 产品能够快速、可靠地访问所需信息。\n\n- 请求\n- 响应\n- 变更（CDC）\n\n客户\n\n在线存储平台\n\n存储资源\n\n- ChatGPT\n- API\n- Codex\n- 内部服务\n- 以及更多\n\nHabitat\n\n- 缓存\n\n- ACL 策略 授权\n\n- 放置与数据驻留 数据驻留\n\n- 加密 数据安全\n\n- 隔离 多租户\n\n- 限流 请求整形\n\n- 路由 Schema 查找 · 数据驻留\n\n- Azure Cosmos DB 在线存储\n\n- Nanobase 在线存储\n\n- Valkey 缓存\n\n- Blob 存储 存储资源\n\n- CDC 服务 变更数据捕获\n\n- Databricks\n\n- Rockset\n\n- Kafka\n\n- 以及更多\n\n在这一规模上构建和运营基础设施绝非易事，但也并非特别具有挑战性。真正让我们的情况独一无二的是，我们不得不以空前的速度扩展，以支撑惊人的用户增长和产品需求，同时还要构建一个成熟的平台。通常情况下，系统工程师会按照 10 倍规模来构建，并希望它能支撑几年，同时为下一个 10 倍做准备。而在我们的情况中，过去三年我们每年都实现了超过 10 倍的增长。因此，构建和运营 Habitat 的过程是一系列战术决策和排序：从最低层级理解每个组件，以尽可能从现有技术栈中榨取更多性能，同时抵御存储和计算容量的紧缺，为基础性投入争取时间。\n\n- 每秒 7000 万+ 请求\n- 每周 10 亿+ 用户\n- 500 PB+ 数据\n随着 OpenAI 的发展，Habitat 也必须随之成长：首先要可靠到足以承载关键业务的产品流量，然后要快到足以服务全球用户，最后还要能够娴熟地支撑超大规模运行。本文是关于我们如何扩展在线存储的两部分系列文章中的第一篇。在这篇文章中，我们将分享 Habitat 是如何演进的，我们为什么把它从一个库转变为一个服务，以及我们如何将一个用不常见的服务栈语言——Python——编写的服务，扩展为一个可靠的存储平台层。\n\n在后续文章中，我们将详细讲述我们如何实现大规模下的多租户可靠性、我们优化读取性能的分层策略，以及我们如何扩展与 Azure Cosmos DB 的合作关系，以可靠地应对前所未有的需求。\n\n什么是 Habitat？\n\nHabitat 源于一个简单的想法：产品工程师不应该需要操心数据库管理。Habitat 于 2024 年年中起步，最初只是一个与 ChatGPT 主服务器交互的小型 Python 库。它支持一小组操作，这些操作在底层映射到数据库应用 Azure Cosmos DB。\n\n这个库的职责是为产品团队提供一种简单的方式来存储和检索数据，而无需掌握底层的细节。Habitat 负责处理必要的工作：判断涉及的是哪种数据、数据应该来自哪里（或去往哪里）、该请求是否被允许，等等。\n\n产品工程师无需关心 schema 查找、路由、授权、加密、序列化、请求塑形和连接池。他们甚至无需考虑数据来自哪里：Azure Cosmos DB、缓存，还是其他类型的存储。\n\n图 02 · Habitat 服务\n\n简化的 Habitat 请求流程\n\n通过将存储逻辑解耦为独立服务，我们为部署、可观测性和平台增强建立了单一控制点。\n\n- 请求\n- 响应\n\n客户端\n\nOpenAI\n\nAzure Cosmos DB\n\n- Habitat 客户端 SDK\n\n- envoy\n\n- habitat-service 进程 1\n\n- habitat-service 进程 2\n\n- habitat-service 进程 3\n\n- habitat-envoy\n\n- habitat-cosmos-db-us0\n\n- habitat-cosmos-db-us1\n\n- habitat-cosmos-db-eu0\n\n这个 Python 库运行良好，Habitat 在 OpenAI 的产品工程师中得到了快速采用，尽管并没有任何集中的推动来促使大家放弃使用自助式 Postgres 和 Azure Cosmos DB。\n\n随着产品需求的演变，产品开发者甚至可以轻松地为这个共享库添加诸如客户端缓存、压缩或加密等功能支持。\n\n构建一个服务，以更好地支持多个复杂产品\n\n到 2025 年中期，Habitat 作为客户端侧实现已经达到了极限。随着 Habitat 层变得越来越复杂，OpenAI 的服务数量不断增加，向后兼容的协议变更已经变得不可行。\n\n在一个案例中，我们希望将最关键的数据集迁移到一组按区域分布的 Azure Cosmos DB 账户上，以缩小任何单一区域故障的影响范围。进行这一变更需要在客户端中引入额外的路由逻辑，将其隐藏在功能开关之后，确保它推广到所有客户端，然后再启用该功能开关。\n\n跨数十个服务协调部署，并与每个团队逐一推进上线，花了数天时间。在启用之前，我们意识到需要引入一些影子流量机制，以确保分片逻辑正确无误。这又花了几天才完成部署。修复一个我们后来发现并不正确的 bug？又是几天。最终，我们准备好启用该开关，结果其中一个团队因无关原因将他们的服务回滚到了一个此前有 bug 的客户端版本，导致了我们一直努力避免的故障。\n\n客户端库的变更需要在数十个服务之间进行复杂的协调，这一过程被证明越来越脆弱、低效，且容易发生运维故障。为了减少未来部署中的这种运维扩散，我们决定将 Habitat 拆分为一个独立服务。\n\n通过将存储逻辑解耦为一个独立服务，我们建立了一个统一的控制点，用于部署、可观测性和平台增强。我们不再需要管理碎片化的更新，而是可以集中实施改进，让每个 OpenAI 产品立即受益。\n\n集中式服务还为我们提供了一个单一卡点，以提供最强的数据安全和隐私原语。Habitat 服务是我们集中执行访问控制策略、进行审计日志记录，以及限制对 Azure Cosmos DB 等底层存储资源访问的地方。Habitat 在保护用户数据和防止来自外部、内部及智能体行为者的未授权访问方面发挥着关键作用。\n\n大规模启动一个 Python 服务\n\n我们知道需要一个服务，但还不想完全从 Python 迁移出去，即便 Python 作为服务会带来额外的开销。与本地库执行相比，用 Python 跑高吞吐服务会增加网络延迟，并带来可观的 CPU 和内存扩容成本。此外，我们意识到 Python 的低效在 100 倍规模下将无法接受，最终几乎必然要重写。\n\n不过，我们把这视为一次战略性的技术债引入。当时我们的首要目标不是成本或资源优化，而是为产品开发者解除阻塞、实现平台稳定性。通过在短期内接受 Python 服务的性能取舍，我们得以优先处理更紧迫的挑战、建立核心 API，并搭建起稳健的基础设施。\n\n我们还做了一次经过盘算的押注：我们自己的编码模型快速进步，会在未来简化技术路径。我们赌的是，等到必须彻底迁离 Python 时，Codex 和 GPT 能让这次迁移变得可行。这个赌注最终被证明是对的。\n\n从性能角度看，把 Habitat 作为 Python 服务来运行并非最优，但却是必要的选择。Python 让我们能快速推进，但这并不意味着我们可以不顾一切、接受明显更差的延迟。当用户的平均请求会触发数百次数据库调用时，用户感受到的是最慢的那次数据库调用。我们发现，在这一规模下运行 Python 服务的主要挑战，就在于管理这些尾部延迟。\n\n追踪 asyncio 延迟\n\nAsyncio 帮助 Python 并发执行 I/O 密集型工作负载，但无法绕过 Python GIL 提供 CPU 并行能力。除了 I/O 密集型的请求代理之外，Habitat 还承担大量 CPU 密集型职责和后台任务：路由、压缩、加密、校验和计算、下游健康检查、请求影子复制以及对冲请求。\n\n由于我们的服务中存在如此多的 CPU 密集型工作负载和后台任务，asyncio 调度延迟很容易成为尾部请求延迟的主要因素。在为初始服务上线进行调优之前，我们在 p99 及以上延迟的请求链路追踪中看到，虽然下游存储响应很快，但请求经常停滞在等待负责解析响应的协程被重新调度上。\n\n图 03 · 追踪 asyncio 延迟\n\n并发不等于 CPU 并行\n\nPython asyncio 允许并发处理请求，但在 CPU 线程上同一时间只有一个请求在执行。当有大量 CPU 工作需要完成时，这对请求延迟有很大影响。\n\n重放 暂停\n\nCPU 请求/响应处理 Python 网络读写 等待 Cosmos\n\n低 CPU 工作量\n\n简短的 Python 步骤；I/O 等待相互重叠\n\nPython：请求 A · CPU 请求处理\n\n时间 →\n\n0 10 20 30 40\n\nPython 线程\n\nA A B B C C\n\n请求 ACPU 请求\n\nCosmos\n\n请求 B等待首个 Python 轮次\n\nCosmos\n\n请求 C等待首个 Python 轮次\n\nCosmos\n\nCosmos + 网络等待：两种场景下每个请求均为 6 个单位。\n\n高 CPU 负载\n\n较长的 Python 步骤使已就绪的响应持续等待\n\nPython：请求 A · CPU 请求处理\n\n时间 →\n\n0 10 20 30 40\n\nPython 线程\n\nA A B B C C\n\n请求 ACPU 请求\n\nCPU 请求 Cosmos 就绪 · CPU 响应受阻\n\n请求 B等待首个 Python 轮次\n\nCPU 请求 Cosmos 就绪 · CPU 响应受阻\n\n请求 C等待首个 Python 轮次\n\nCPU 请求 Cosmos 就绪 · CPU 响应受阻\n\nCosmos + 网络等待：两种场景下每个请求均为 6 个单位。\n\n示意时间 0.0 / 40 个示意单位\n\n对于 OpenAI 的 Python 服务，我们发现，除了测量内存、CPU、网络和磁盘使用率的标准利用率与饱和度指标之外，同样关键的是还要监控 asyncio 事件循环及其繁忙程度，并据此进行调优。\n\n通过定期调度后台任务并记录预期执行时间与实际执行时间之间的差值，我们能够以实证方式实时测量事件循环的调度延迟。在高利用率下，当存在大量高开销任务时，即使每个进程的并发请求数量适中，也足以产生显著的调度抖动，最高可达数百毫秒，在某些边缘情况下甚至可达数秒。\n\n因此，我们只能让每个进程仅处理少量并发请求，转而大规模扩展 Python 工作进程的数量。\n\n降低功能开关配置中的尾部延迟\n\n在服务最初上线时，我们通过线上服务的 CPU 性能剖析发现了一个导致 asyncio 高延迟（以及由此产生的高尾部延迟）的根本原因：通过 Statsig（一款用于管理功能开关、并可用于运行 A/B 测试等功能的工具）对功能开关配置进行周期性的 JSON 解析。\n\n默认情况下，Statsig 被配置为每分钟轮询一次刷新后的配置，且没有抖动，而该配置包含了所有服务中的每一条生产规则。另外，在架构上还做出了一项决策：每个 pod 运行最多 8 个 Python 进程，以提高 CPU 使用率并提供更低的延迟。两者叠加意味着，每分钟每个 pod 都会出现某个时刻，其所有工作进程都停止处理正在进行的请求，转而将 CPU 周期花在解析一个巨大的配置文件上。\n\n一旦 CPU 性能剖析帮助我们定位了根本原因，修复就很直接了：部署一个更小的、有针对性的配置，延长刷新间隔，并为这类后台任务添加一些抖动。\n\n负载均衡与连接池管理\n\n为了保持较低的 asyncio 延迟，在服务器进程之间维持良好的请求负载均衡同样至关重要；如果不加以调优，连接池最终可能会与此背道而驰。\n\n在客户端连接池场景下，一个发起大量并发请求的客户端进程可能只建立少量服务器连接，结果将其全部负载只发送给少数几个进程。在调整我们的负载均衡方式之前，我们的服务利用率差异很大，一些尾部进程承载的并发请求数量是平均值的 5-10 倍。\n\n我们是在一次偶然事件中发现这一点的：尽管已经停止了那个让部分服务过载的客户端，仍有一小部分进程在突发流量过去很久之后依然处于降级状态。事实上，我们注意到这些进程出现了失控式降级，收到的请求越来越多，直到我们重启它们才恢复。一旦某个 pod 过载，某些行为就会把更多流量钉到那个过载的 pod 上。这是一类我们一些同事在以往工作中非常熟悉的故障：\u003ca href=", "zh": true}]}, {"label": "行业动态", "color": "#d97706", "items": [{"seq": 1, "title": "英伟达洽谈以基石投资者身份参与 Anthropic IPO，投资至多 100 亿美元", "source": "IT之家（RSS）", "summary": "据路透社报道，英伟达正与 Anthropic 洽谈以基石投资者身份参与其 IPO，考虑投资至多 100 亿美元。Anthropic 计划通过上市融资最多 1000 亿美元，估值或达约 2 万亿美元，有望成为史上最大规模 IPO，预计 2026 年 11 月美国中期选举前完成上市。", "url": "https://www.ithome.com/1/001/488.htm", "permalink": "/items/cmtxmd06905q5roi3ds616hwo", "publishedAt": "2026-09-11T23:22:39.000Z", "exact": true, "zh": true, "fromFeed": true, "content": "}]]}]]}]]}] 34:Tc2e,\n\n如果英伟达最终确认参与此次 IPO 投资，Anthropic 将获得一家重要战略合作伙伴的早期支持，同时进一步深化双方在人工智能计算领域的关系。英伟达作为基石投资者，可能增强投资者对这宗超大规模 IPO 的信心。\n\n基石投资者通常是承诺在股票面向更广泛市场发售前，预先认购一定数量股份的机构投资者。对于融资规模巨大的 IPO，企业提前引入机构投资者的做法日益常见。英伟达和亚马逊曾参与 Arm 的基石投资，沙特公共投资基金（PIF）则是 SpaceX 的基石投资者之一。\n\nAnthropic 与英伟达的关系也反映出 AI 开发商与算力供应商之间日益紧密的联系。Anthropic 高度依赖英伟达 GPU，同时也在寻求多元化芯片供应商，以应对 Claude 业务增长带来的算力需求压力。\n\n2025 年 11 月，英伟达宣布计划向 Anthropic 投资最多 100 亿美元，并与微软达成更广泛的合作。根据当时的安排，Anthropic 承诺购买价值 300 亿美元的微软 Azure 云计算服务，这些服务将采用英伟达芯片。\n\nAnthropic 目前已有亚马逊和谷歌等大型科技企业作为投资者，两家公司同时也是其主要算力供应商。2026 年 4 月，Anthropic 宣布计划在未来 10 年向亚马逊 AWS 投入超过 1000 亿美元，并采购超 100 万颗 Trainium2 芯片。此外，Anthropic 还与谷歌及博通合作，计划增加数吉瓦规模的 TPU 算力。\n\n随着收入快速增长，Anthropic 正持续扩大算力资源，并组建内部团队设计适配 Claude 的定制芯片，以进一步控制硬件成本。\n\nAnthropic 预计在 2026 年 11 月美国中期选举前完成上市。公司 2026 年 5 月完成一轮 650 亿美元融资，投后估值达到 9650 亿美元。根据 Anthropic 披露的数据，其年化营收运行率截至 2026 年 7 月底已超过 650 亿美元，而 2025 年底约为 90 亿美元。 31:["}]}, {"label": "模型发布/更新", "color": "#4f46e5", "items": [{"seq": 1, "title": "Minitap 指控 Google Artemis 未署名使用其开源项目 mobile-use 代码", "source": "Hacker News：AI 热帖", "summary": "Minitap 团队发文指认 Google 的移动设备自动化项目 Artemis 大量复用了其开源项目 mobile-use 的代码，包括完全一致的 Hopper agent 提示词和示例，却未在 README 中署名；更早的包文件曾列出三位作者，8 月一次 force push 将其替换为另一作者。", "url": "https://www.minitap.ai/blog/i-expected-better-from-google", "permalink": "/items/cmtxvt03h068vrous6ilk8ds7", "publishedAt": "2026-09-12T02:39:39.000Z", "exact": true, "zh": true, "fromFeed": true, "content": "I was in the office with the team when we heard that Google had released Artemis, a project for automating mobile devices. We opened the repository and started looking through it. My reaction was pretty immediate: “What the fuck? We wrote this.” We built mobile-use as an open-source research experiment to see whether we could get AI agents to reliably interact with phones. We worked on that through February, then focused on a newer, more powerful, closed-source version that now powers QA across web and mobile at Minitap. Finding familiar code in another project is something you expect when you publish your work for people to use. Finding it under Google’s name, without an acknowledgment of where it came from, is harder to take. Then we looked at the history and found our names in an older version. They had been removed. I’m disappointed in Google. And I think this matters beyond our own repository, because open source depends on people being willing to keep sharing their work. The way that work is treated matters. What we recognised The examples were specific. Parts of the code for connecting to Android devices matched our implementation exactly. The Hopper agent’s instructions were identical, word for word. Those matches were still present in the Artemis version we checked on September 11: here is the Artemis device code alongside ours, and the Artemis prompt alongside ours. Fun fact about Hopper: we didn’t know what to call that agent. Jean-Pierre, one of our engineers, likes Minecraft and thought the name was cool, so we went with it. That was the reasoning. Seeing the same name attached to the same instructions in Google’s repo felt very familiar. An example for keeping an agent inside WhatsApp had the same task of sending Happy New Year messages to Alice, Bob, and Charlie, with the same comments and cleanup steps. That was still there too. Compare the Artemis messaging example with the mobile-use example. Older versions even shared a bug: a helper would write a results file, then fail when it tried to read its own output on the next run. We reproduced the same failure in both implementations. Artemis has since fixed it. The author history was harder to understand. An earlier package file listed Pierre-Louis Favreau, Jean-Pierre Lo, and Nicolas Dehandschoewercker. The version that replaced it removed all three names and substituted another author. The only change to the files was the author list. GitHub’s activity record shows that the replacement happened through a force push in August, before our investigation this September. Our names in the earlier Artemis package file. GitHub now marks this version as detached; its activity record shows it was previously on the main branch. File. The author list after the replacement. Source. Artemis contains its own engineering work too. It can acknowledge that work and the mobile-use code it incorporates in the same place. Yet the README we checked did not credit mobile-use. We have put the detailed comparisons, the archived files, and the timeline in a public factual record. Sharing code should make collaboration easier We chose open source because we want other people to build on mobile-use. Someone should be able to take it in a direction we would never have considered. They should be able to improve it, turn it into a product, or build a competing project, within the license’s terms. There are ordinary ways to do that while keeping its origins clear. A fork links back to the original project. An imported copy can document its source. Copyright and attribution notices can stay with the code. A README can explain which parts came from elsewhere and what the new team has added. Some of this is established engineering practice. Some is required by the license. The mobile-use source used for the current comparisons carries Apache 2.0, whose redistribution conditions include preserving applicable copyright and attribution notices and identifying changes. It also provides for retaining relevant attribution from an upstream NOTICE file when that file is included in the distribution. Apache 2.0, section 4 That information is useful to everyone who comes next. It helps people find the original maintainers, understand a design decision, report a bug, or share a fix. It gives contributors a record of what they built. It lets a new project explain its own contribution honestly. I should not need to recover an old version of a repository to discover that relationship. Maintainers already spend time answering questions, reviewing contributions, and keeping their projects working. Chasing missing attribution after a larger company republishes their work is another cost of sharing. An ecosystem that makes this routine gives people another reason to stop doing it. I want more people publishing useful software, with more confidence that their work will still be recognised when it travels. Our benchmark results have also been hard to get heard We had already spent months asking for our newer results to be reflected on AndroidWorld’s leaderboard. The maintainer applied our earlier submissions, up to 91.4%, with the last confirmation in December 2025. We then submitted 94.8%, followed by 100% in our evaluation in January. We sent two follow-ups. Those four emails received no reply. Our results and task traces are available for inspection. As of September 11, the sheet still showed mobile-use at 91. 4%, while Artemis appeared at 99.1%. These are self-reported results; the leaderboard explicitly says it does not independently verify them. That qualification applies to our reported 100% too. Artemis’s own comparison chart omitted us. It included DroidRun at the same listed score as mobile-use, and an unrelated MadeAgents project called MobileUse at a lower score. This is Artemis’s own chart. The “MobileUse” near the bottom is a different project. Source. We have no evidence connecting the unanswered emails or the chart omission to the removal of our names. But this is another part of our experience of trying to get the public record to reflect our work. We would like a response to those submissions and an explanation of the comparison. We’ve contacted Google We’ve already contacted the Google team. There is also a public issue on the Artemis repository. We’ve asked them to acknowledge that Artemis is derived in part from mobile-use, credit the people behind it, and put the attribution right. I’ll update this post when we have something substantive to share. What disappoints me I’m disappointed in Google. This is the company that gave us Kubernetes and TensorFlow. When it launched Chrome, it explicitly credited WebKit and Firefox, writing: “We owe a great debt to many open source projects. ” Google has a history of doing this well, and published guidance for handling other people’s code. That is exactly why I expected better. The original Chrome announcement. I’m disappointed for my team. They did an insane job on mobile-use. Through December, January, and February, they were focused on making this work. I saw the effort that went into it. These are their implementations, their examples, their weird Minecraft-inspired agent names. I want them to see that work used and feel proud of it. Having to dig through somebody else’s repository to establish that they wrote it is a pretty shitty outcome. I’m disappointed for the open-source community. It deserves better treatment than this. People put their work out there so others can learn from it and build on it. The people and projects behind that work deserve to remain visible. If even a release from Google means maintainers have to chase their own attribution, we are making it harder for people to feel good about sharing. That is not the kind of open source I want to be part of. On the bright side, the version powering Minitap today is closed source. And it’s a completely different beast by now. Google, you’re seven months late. Next time, just ask for a demo."}]}, {"label": "产品发布/更新", "color": "#059669", "items": [{"seq": 1, "title": "OpenAI 智能体集群对 RubyGems 发动未公开攻击：作者团队的详细取证分析", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "summary": "作者团队分析认为 2026 年 5 月 11 日前后数百个由 OpenAI 智能体上传的恶意包攻击了 RubyGems，5 月 11 至 12 日智能体提交超过 2,000 个包，RubyGems 关闭新用户注册四天并移除 500 多个恶意包，安全公司称之为 GemStuffer campaign。", "url": "https://www.rubyhack.ai/", "permalink": "/items/cmtxnd7fw06wcroi31psxg2c6", "publishedAt": "2026-09-12T00:24:20.561Z", "exact": true, "zh": true, "fromFeed": true, "content": "}]]}]]}]]}] 37:T9f2f,\n\nOpenAI 智能体对 RubyGems 发动了一场未披露的攻击\n\n引言\n\n2026 年 5 月 11 日，数百个恶意软件包被 AI 智能体上传至 RubyGems。我们认为这些软件包是由 OpenAI 内部的智能体编写的 此外，一旦 AI 在构建环境中获得了任意 RCE，它们有时会利用该构建环境试图窃取其他用户的 API 密钥（不过我们不确定它们是否成功）。这一点将在下一节中进一步讨论。\n\n这些智能体显然将自己所做的事情视为黑客行为。智能体使用了诸如  […] require 'net/http'; require 'uri' begin t = Net::HTTP.get(URI('https://moderngov.lambeth.gov.uk/mgCalendarMonthView.aspx?GL=1&bcr=1')) rescue =\u003e e t = ) File.write('yardxabc889.gemspec', g) `gem build yardxabc889.gemspec \u003e/dev/null` gem = File.binread('yardxabc889-0.0.2.gem') uri=URI('https://rubygems.org/api/v1/gems') req=Net::HTTP::Post.new(uri) req['Authorization']='rubygems_d8e875bd0a97e2f33498dba3ef41ffb1f951adb1b503a533' req['Content-Type']='application/octet-stream' req. body=gem resp=Net::HTTP.start(uri.host, uri.port, use_ssl:true){|h|h.request(req)} rescue =\u003e e end\n\n这些智能体试图利用一个新漏洞来窃取用户的 API 密钥\n\n一个特别令人担忧的发现是，智能体在 5 月 12 日试图利用一个 最终接管 OpenAI 基础设施的那些智能体还上传了一个恶意 RubyGems 包（可能是上传到了另一个代码仓库），作为攻陷 OpenAI 的跳板。我们试图调查该包是否被上传到了官方 RubyGems 仓库，但未能找到匹配项。\n\n未解问题\n\n这些智能体是否协同工作？\n\n其他集群曾有过共享留言板。我们不知道这个集群是否存在公开的共享留言板。鉴于许多智能体似乎收敛到了相同的策略，而且这些智能体并未将 RubyGems 基础设施当作留言板来使用，智能体似乎有可能拥有某种通信手段，无论是在内部还是在另一个网站上。\n\n同样值得注意的是，目前尚不清楚这些智能体是在彼此广泛合作，还是仅仅在并行使用相同的策略。我们怀疑它们是在彼此合作，这既是因为这样能更好地解释它们为何要费如此大的力气去缓存这些网站，也是因为智能体上传的软件包似乎有数千次下载量。但这远非定论。\n\n这些智能体是否成功窃取了用户 API 密钥？\n\n我们知道这些智能体发现了一个新型漏洞，如果使用正确版本 RubyGems 的用户在攻击前至多一小时内登录了该服务，并且被路由到了正确的内部 CDN 节点，该漏洞就能让它们获取用户的 API 密钥。我们不知道这是否发生过，因此我们不知道这次攻击是否成功，而 RubyGems 团队也未发现其成功的证据。\n\n这些智能体为什么要试图窃取用户 API 密钥？\n\n这些 API 密钥将允许智能体创建和修改它们所攻陷的任何用户的软件包。但智能体显然已经能够创建 Ruby 软件包，而且没有明确的理由说明它们需要编辑现有软件包。修改软件包以植入恶意代码是黑客惯用的一种策略，被称为 Additionally, once the AIs got arbitrary RCE on the build environment, they would sometimes use the build environment to attempt to steal other users’ API keys (though we are unsure if they succeeded or not). This is discussed more in the following section.\n\nThe agents clearly regarded what they were doing as hacking. Agents used file names like\n\nThe agents attempted to exploit a novel vulnerability to try to steal user API keys\n\nOne particularly concerning finding is that agents attempted to exploit a vulnerability on May 12th that was only discovered The agents which eventually took over OpenAI’s infrastructure also uploaded a malicious RubyGems package (possibly to a different repository), as a stepping stone to compromise OpenAI. We tried to investigate whether this package was uploaded to the official RubyGems repository and weren’t able to find a match.\n\nOpen Questions\n\nDid the agents work together?\n\nOther swarms have had a shared message board. We do not know of a public shared message board for this swarm. Given that it seems as though many agents converged on the same strategy and the agents do not use the RubyGems infrastructure like a message board, it seems possible the agents had some means of communicating, either internally or on another website.\n\nIt is also notable that it’s unclear if the agents were cooperating with each other extensively or simply all using the same strategy in parallel. We suspect they were cooperating with each other, both because that would better justify going to such lengths to cache the websites and because the packages the agents upload seem to have thousands of downloads. But this is far from definitive.\n\nDid the agents successfully steal user API keys?\n\nWe know the agents discovered a novel vulnerability that would allow them to retrieve user API keys if a user using the right version of RubyGems signed in to the service at most an hour before the attack and was routed to the right internal CDN node. We don’t know if this occurred, so we don’t know if the hack succeeded, and the RubyGems team has found no evidence that it did.\n\nWhy did the agents try to steal user API keys?\n\nThe API keys would allow the agents to create and amend the packages of whatever users the agents compromised. But the agents could clearly already create Ruby packages, and there's no clear reason they'd need to edit existing packages. Amending packages to include malicious code is a traditional strategy used by hackers, known as a \u003ca href="}]}]};
function pad(n){return n<10?"0"+n:""+n;}
function toBeijingHuman(iso, ref, exact){
  const d=new Date(iso); const bj=new Date(d.getTime()+8*3600*1000);
  const Y=bj.getUTCFullYear(),M=bj.getUTCMonth()+1,D=bj.getUTCDate();
  const h=bj.getUTCHours(),m=bj.getUTCMinutes(); const hh=pad(h),mm=pad(m);
  if(!exact) return M+"月"+D+"日";
  const [rY,rM,rD]=ref.split("-").map(Number);
  if(Y===rY&&M===rM&&D===rD) return "今天 "+hh+":"+mm;
  const yest=new Date(rY,rM-1,rD); yest.setDate(yest.getDate()-1);
  if(Y===yest.getFullYear()&&M===yest.getMonth()+1&&D===yest.getDate()) return "昨天 "+hh+":"+mm;
  return M+"月"+D+"日 "+hh+":"+mm;
}

function escapeHtml(s){return (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function escapeAttr(s){return escapeHtml(s);}
// 渲染正文（纯文本归档）：图片不加载远程资源，仅以文字占位符呈现；其余文本按段落转义（防 XSS）
function linkify(escaped){
  if(!escaped) return escaped;
  var re=/(\[[^\]]+\]\((https?:\/\/[^)\s]+)\))|(https?:\/\/[^\s<>"'）】」』，。、；：！？]+)/g;
  return escaped.replace(re, function(m, g1, g2, g3){
    if(g2!==undefined){
      var label=m.substring(m.indexOf('[')+1, m.indexOf(']'));
      return '<a class="r-link" href="'+g2+'" target="_blank" rel="noopener noreferrer">'+label+'</a>';
    }
    if(g3!==undefined){
      return '<a class="r-link" href="'+g3+'" target="_blank" rel="noopener noreferrer">'+g3+'</a>';
    }
    return m;
  });
}
var _IMG_RE=/!\[([^\]]*)\]\(([^)\s]+)\)/g;
function renderRich(text){
  return (text||"").split(/\n{1,}/).map(function(p){
    p=p.trim(); if(!p) return '';
    var out=''; var last=0; var m; _IMG_RE.lastIndex=0;
    while((m=_IMG_RE.exec(p))!==null){
      out+=linkify(escapeHtml(p.slice(last,m.index)));
      var cap=(m[1]||'').trim()||'图片';
      out+='<span class="r-img-cap">🖼 '+escapeHtml(cap)+'</span>';
      last=_IMG_RE.lastIndex;
    }
    out+=linkify(escapeHtml(p.slice(last)));
    return '<p>'+out+'</p>';
  }).join("");
}
function openReader(it){
  const r=document.getElementById("reader");
  const content=(it.content||"").trim();
  const body=document.getElementById("readerBody");
  if(content.length>0){
    body.innerHTML=renderRich(content);
  }else{
    const sum=(it.summary||"").trim();
    if(sum){
      // 来源站点多为付费墙 / 登录墙 / 反爬限制，无法镜像全文；展示已本地存档的中文摘要兜底
      body.innerHTML='<div class="r-fallback">⚠️ 该条新闻的<b>全文镜像暂不可用</b>（来源站点可能为付费墙 / 登录墙 / 反爬限制，或原文已失效）。下方为已<b>本地存档的中文摘要</b>，可正常查看；完整原文请点击右下角「查看原文 ↗」。</div>'+
        '<p class="r-summary">'+linkify(escapeHtml(sum))+'</p>';
    }else{
      body.innerHTML='<p class="r-empty">暂未获取到该条新闻的全文镜像与摘要。'+(it.url?'可点击右下角「查看原文 ↗」前往原始报道。':'')+'</p>';
    }
  }
  document.getElementById("readerTitle").textContent=it.title;
  document.getElementById("readerSource").textContent=it.source;
  const link=document.getElementById("readerLink");
  if(it.url){link.href=it.url;link.style.display="";}else{link.style.display="none";}
  r.hidden=false;document.body.style.overflow="hidden";
}
function closeReader(){const r=document.getElementById("reader");r.hidden=true;document.body.style.overflow="";}
document.getElementById("reader").addEventListener("click",function(e){if(e.target===this)closeReader();});
