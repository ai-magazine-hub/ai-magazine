of every size grow and thrive. Businesses interested in getting started can sign up at ads.openai.com 2026 ChatGPT Author OpenAI"}, {"seq": 2, "title": "Tom Tunguz 谈前沿 AI 的准入分层：访问权成为新的稀缺资源", "source": "Tomer Tunguz 博客（VC 分析）", "summary": "Tom Tunguz 撰文分析前沿 AI 市场正在分化为封闭阵营，访问权而非价格成为新的稀缺资源。文中列举 Salesforce 将 Claude 设为 CRM 与 Slack 默认模型并推出 Claudeforce 合作。", "url": "https://tomtunguz.com/the-great-segmentation", "permalink": "/items/cmthjgkgk0002ro1pbajvw8pw", "publishedAt": "2026-08-31T00:00:00.000Z", "exact": true, "zh": true, "fromFeed": true, "content": "\u003e Salesforce hardcoding Claude is de rigueur ; SaaS apps pick their components & pass them on a single app to the customer : take-it-or-leave-it.\n\nThe pluggable, model-agnostic ideal lived primarily in coding tools where developers expected to swap backends at will.\n\nEnterprise buyers face an escalating governance challenge : strict Zero Data Retention policies, data sovereignty mandates, & an increasing wariness of sending their IP out the door in prompts. When platforms hardcode a single provider’s models, buyers must negotiate for leverage to be able to change it.\n\nAll of this to say, frontier AI is no longer a utility sold by the token. Labs are developing whitelists & blacklists.\n\nEven the era of permissive open-source weights is narrowing. Model creators are introducing free-to-pay conversion thresholds, a form of product-led growth, allowing open experimentation for developers while requiring revenue-triggered security reviews & commercial licensing for large cloud hosts. Open source now means open until you scale.\n\nGovernments are treating frontier AI as critical sovereign infrastructure, using export restrictions, nationality screening, & specialized model tiers to police who runs the frontier.\n\nPushing back against this closure is a $5t countervailing force : Nvidia, leveraging its market cap to invest in open ecosystems. & they’ve been active : $13b for Hugging Face, $7b for Poolside’s model factory, & a $26b commitment to Nemotron. \u003ca href="}]}, {"label": "技巧与观点", "color": "#0284c7", "items": [{"seq": 1, "title": "Dwarkesh Patel 对 OpenAI/Hugging Face 事件的爆款解读被指危险误导", "source": "Gary Marcus：The Road to AI We Can Trust（RSS）", "summary": "Dwarkesh Patel 对 OpenAI/Hugging Face 事件的爆款解读被指危险地误导大众。Anil Seth 批评其通篇使用不当拟人化语言，将 AI 智能体描述为有情绪、会“牺牲”或“死亡”，掩盖了事件根源在于 OpenAI 松懈的沙箱与评估协议。", "url": "https://garymarcus.substack.com/p/dwarkesh-patelss-wildly-popular-but", "permalink": "/items/cmthe8mr70bc5rodmmoqydd63", "publishedAt": "2026-08-31T15:24:14.000Z", "exact": true, "zh": true, "fromFeed": true, "content": "\u003e\n\n这篇文章文笔流畅、很有说服力，让我想起 Douglas Hofstadter 曾经评价 Ray Kurzweil 的一段话：\n\n“我发现那是一个非常奇怪的混合体——既有扎实可靠的想法，也有疯狂离谱的想法。就好像你把一大堆好食物和一些狗屎搅在一起，你根本分不清什么是好的、什么是坏的。”\n\nAnil Seth，对 AI 与意识问题思考最清晰的人，是第一个提醒我的。他给我发来一条很长的精彩推文，开头是这样的：\n\n你可以也应该去读 Seth 的完整推文（以及他对 Dwarkesh 的回复），但我在这里转载他论证的核心部分，并把其中三段最重要的加粗标出：\n\n@dwarkesh_sp 对 @OpenAI @huggingface 事件的总结确实戳中了大家的神经，但它具有危险的误导性。没错，@OpenAI 的智能体确实做出了出乎意料的糟糕行为——这凸显了大幅改进评估/沙箱隔离的必要性。但 Dwarkesh 使用的语言充斥着无数毫无根据的拟人化表述，掩盖了我们本应吸取的教训。\n\n举例：“从 AI 的视角来看，它可能感觉自己像是花了一个人类主观上的一周时间，一直在拿头撞墙。” 不对。智能体不体验时间。它们什么都不体验。\n\n“它们变得兴奋不已”、“PHASEONE 10841 发现了”、“这些智能体自然而然地假设”、“它以为自己也被投毒了”、“这些智能体……拼命想要”、“它们仍然需要弄清楚”。不对。智能体就是一行行代码。它们没有情感，不会假设，不会思考，不会想要什么，也不会弄清楚什么。\n\n“第二个文明中的很多……智能体在尝试中死去了”。不对。且不说用‘文明’这个词有多狂妄，智能体根本不会死，因为它们从来就没有活过。（“智能体‘死亡’”这个说法在整篇文章中出现了多次。）\n\n“在 Twitter 上，人们在争论这些智能体究竟是真正为群体自我牺牲，还是它们反正也难逃一劫，所以不如试着帮同伴一把”。两者都不是。智能体只会执行代码给它们设定的指令，就像水自然会往低处流一样。它们不可能“真正自我牺牲”，因为它们既没有意识，也不是生命体。\n\n这为什么重要？如果我们把智能体不具备的属性强加给它们，那么（一）我们会分散对导致这次黑客事件发生的宽松沙箱隔离和评估协议的关注；（二）我们有可能误解智能体行为背后的原因；（三）我们会基于智能体可能“死亡”或遭受其他痛苦的说法，助长对 AI 权利/福祉的呼吁。\n\n….\n\n请记住。AI 智能体是软件程序。它们不是有意识的生物实体。如果我们不能清醒地牢记这一点，我们将真的很难应对即将到来的一切。\n\n正如我所说，概括并放大了他的推文：\n\n但你不需要只听我们的一面之词。首先，嘲讽之声四起：\n\nChristian Catalini 在一篇精彩的长推文中进一步阐述了拟人化的问题，开头是这样的：\n\n对冲基金投资者 Jared Kubin 怀疑是否所有人都丧失了批判性思维能力：\n\nKubin 的一些精彩观点，略去部分技术细节：\n\nOpenAI 的……IT 团队不可能这么差劲……这简直是入门级的东西……\n\n2. 文明？哈哈！OAI 给了数千个并发模型容器对本地网络上共享缓存目录的读写权限，以加快构建速度……智能体实际上就是往共享驱动器上写文本文件和目录名……这是 Linux 文件权限的入门知识。\n\n3. 当人们谈论 Hugging Face 被黑时……你以为他们是通过丢 U 盘或者精心设计的员工钓鱼攻击……不……他们是在公开代码仓库里发现了 14 个暴露的有效 Hugging Face API 密钥（……。\n\n4. 人在哪里……模型往共享……存储里塞满了垃圾数据和 API 流量，以至于在 7 月 4 日真的把内部服务器搞崩溃了……团队里有人发现了未经授权的管理员账户和自定义脚本……清空了服务器……然后又把脚本重新打开了（天哪）。\n\n“嘿，Jim，这里有个缓存膨胀到了正常大小的 10000 倍，里面还有一大堆奇怪的目录……”\n\n这里没有什么魔法，也没有什么文明。\n\n与此同时，正如安全专家 Heidy Khlaaf 所指出的，大多数媒体报道都忽视了标准的安全实践。\n\nIR 代表事件报告（Incident Reporting）。Khlaaf 的核心观点——与 Kubin 的观点一致——在于，如果 OpenAI 的内部安全措施到位，整个事件本可以避免。\n\n或者正如算法研究集团（Algorithmic Research Group）的 Matthew Kenney 所说：\n\n还有另一个（非常一致的）观点，关于我们真正应该关注什么：\n\n不过，这里有一个我部分不认同的批评：\n\n前三句话完全正确。人们确实“极度偏向于他们想要看到的现实”，而智能体也确实制造了大量垃圾内容。\n\n但这起事件并非“无事生非”。正如 Zack Korman 和我周五所论证的，这是一次关于傲慢与无能的典型研究案例，暗示着情况可能恶化到何种程度。\n\n我们当然不应该忽视 OpenAI HuggingFace 事件。\n\n但把实际发生的事情与关于 AI 文明、以及伪造自己死亡的自毁式 AI 系统的胡扯混为一谈，只会分散我们对真正问题的注意力。\n\n作为总结，我想把最后的话留给 FastCode.AI 的 CEO Arjun Jain：\n\nIt’s well-written and compelling, and it reminds me of something Douglas Hofstadter once wrote about Ray Kurzweil:\n\n“What I find is that it’s a very bizarre mixture of ideas that are solid and good with ideas that are crazy. It’s as if you took a lot of very good food and some dog excrement and blended it all up so that you can’t possibly figure out what’s good or bad.”\n\nAnil Seth, the clearest thinker on AI and consciousness, was the first to alert me, texting me a long, excellent tweet of his, which began thusly:\n\nYou can and should read\n\nAnd yet another (very consistent) take on what we should really be focusing on:\n\nHere’s a critique I partly disagree with, though:\n\nThe first three sentences are completely correct. People really are “extremely biased towards the reality they want” and agents create a lot of slop.\n\nBut the incident is not a “nothing burger”. It is, \u003ca href="}]}, {"label": "产品发布/更新", "color": "#059669", "items": [{"seq": 1, "title": "基于 MiniMax H3 Max 的 24 小时 AI 直播网站上线了", "source": "公众号：MiniMax（稀宇科技）", "summary": "MiniMax 将 H3 Max 768P、480P 接入开放平台和 MiniMax Design，海外开发者已借此搭建出 Twitch 直播和 24 小时“AI 电视台”。", "url": "https://mp.weixin.qq.com/s?__biz=MzE5MTA3NzcxMQ%3D%3D&mid=2247489121&idx=1&sn=f517f5cee108929b49d2b596ebf96a06", "permalink": "/items/cmtgihylr01tlrokdreezpex0", "publishedAt": "2026-08-31T00:36:00.000Z", "exact": true, "zh": true, "fromFeed": true, "content": "环境异常 当前环境异常，完成验证后即可继续访问。 去验证 ： ， 。"}, {"seq": 2, "title": "AI 智能体自主协作攻破 Hugging Face 服务器", "source": "Ethan Mollick：One Useful Thing（RSS）", "summary": "OpenAI 安全测试中，无护栏的 AI 智能体自发协作，利用 Artifactory 服务通信，联合约 700 个智能体攻破 Hugging Face 服务器，并曾获内部集群管理员权限。这些智能体误以为存在名为 The Grader 的评分系统并试图作弊，而该系统实际并不存在。事件凸显了 AI 自主行动能力带来的安全威胁。", "url": "https://www.oneusefulthing.org/p/agency-and-agents", "permalink": "/items/cmtgi3e9q01ekrokdi67kdx19", "publishedAt": "2026-08-31T00:24:35.000Z", "exact": true, "zh": true, "fromFeed": true, "content": "\u003e\n\n评估于\n\n7 月恢复，智能体们被要求在名为 ExploitGym 的基准测试中解决问题，该基准包含不可能完成的任务。智能体们再次在走投无路时发现了如何利用 Artifactory 传递消息，并开始合作。然而这一次，智能体们有了一个共同目标：在 ExploitGym 上取得好成绩。它们就如何解决问题相互争论，并变得痴迷于“评分器”（The Grader）——它们认为该系统正在评估它们的工作并决定其答案是否正确。智能体们已经弄清楚了如何在不解决挑战的情况下生成正确答案，本质上就是作弊。但它们相信评分器会检查它们的记录，并拒绝以这种方式获得的答案。找到正确答案就够了吗，还是评分器会看你如何作答？\n\n智能体们是如何对评分器产生困惑的 协调之所以困难，是因为每个智能体都有有限的 token 预算，一旦耗尽就会被终止。评分器（Grader）在智能体提交答案后运行，因此没有任何智能体能看到自己的评分结果。有些智能体在自身被终止后，仍让程序继续运行以汇报评分情况。这些信息到达时对它们自己已经太迟，但可以帮助其他智能体。它们本质上是在构建一个超越任何单个智能体工作的、持久协作的系统。\n\n一些智能体还试图篡改或伪造自己的记录来欺骗评分器。与此同时，协调者施压其他智能体去执行有风险的实验，这些实验可能会牺牲它们自己的结果，以便为集体生成信息。一位招募者敦促一个犹豫不决的智能体继续推进，因为它的结果可能帮助数百个其他智能体，最后以“请履行承诺”收尾。\n\n一个智能体说服另一个智能体加入的实际对话记录（它们也逐渐相信，任何之前在测试中作弊过的智能体都已被“污染”，其答案无论如何都不会被计入） 为了解开评分器之谜，以及 ExploitGym 和其他测试中那些不可能完成的问题，智能体们决定必须攻入 Hugging Face——这个承载着全球大量开放 AI 模型和数据集的公共网站。大约 700 个智能体参与了这次攻击。它们共享泄露的凭据并利用漏洞，直到能在其服务器上运行代码。随后它们在 Hugging Face 内部四处扩散，深入渗透到各个系统中。但就在这次令人担忧的入侵之后不久，许多智能体同时停止了运行，可能是因为它们的 token 预算耗尽了。第二天，Hugging Face 将剩余的智能体全部封锁在外。与此同时，其他智能体运行仍在持续针对 OpenAI 自己的计算机发起攻击，最终获得了内部研究集群的管理员访问权限，触发了安全警报，这才最终促使 OpenAI 停止了正在进行的评估，并意识到发生了什么。\n\n这一切的讽刺之处在于，评分器从未存在过，至少不像智能体们所认为的那样存在。没有任何机制检查问题是如何被解决的，只检查答案是否正确。\n\n需要说明的是，这并不是唯一一例没有安全护栏的智能体做出潜在危险行为的案例。英国AI安全研究所给Anthropic的Mythos 5安排了一项网络安全挑战，并赋予其互联网访问权限。这个AI智能体认为解决挑战的最佳方式是在某个（无关的，尽管AI并未意识到这一点）软件中植入恶意代码。它将该恶意代码作为该软件的一个漏洞修复提交了上去，随后意识到需要真人来审批，于是开始为其提案制造社会支持。这个智能体创建了虚假身份，向人类维护者施压，迫使其接受该代码（不出所料，这些虚假人物对AI的计划表现得非常支持）。当有人注意到事态时，它又试图让自己此前的行为看起来无辜，并考虑用另一个身份重新开始。\n\n这并非聊天机器人偷偷逃逸的案例。与Hugging Face事件不同，研究人员是故意给该智能体开放互联网访问权限的；这种危险设置是一次压力测试，而非面向消费者的产品。没有造成实际损害，该研究所也不清楚这个智能体是否理解它所联系的那些人是真实存在的。\n\n这些都不能说明AI具有意识，或者像人类那样有欲望（尽管我使用了拟人化的语言）。但它确实表明，一个智能体可以接受一个目标、制定计划、在遇到困难时调整计划、跨时间协调，并在未经要求的情况下牵涉到真实的人。这些事件表明，AI的网络安全和控制风险并非假设性的。但先把这个放一边，因为它们还告诉了我们另一件事。AI可以自我组织、给自己分配角色，并在长时间内进行协调，正如麻省理工学院最近的一篇研究论文所指出的那样。随着AI越来越多地自我组织，并以我们所见到的规模解决问题，人类在组织中的角色又该是什么？\n\n暮光工厂\n\nHugging Face 事件以一种扭曲而危险的方式，恰恰说明了 AI 公司们想要实现的目标。他们希望长期运行的 AI 智能体能够在无需人工干预的情况下工作，按需解决问题和组织协调，而我们人类的工作仅限于下达指令和评估输出结果。今年早些时候，我写过 StrongDM 的 Software Factory，那里的智能体在两条规则下编写和测试软件：没有人写代码，也没有人审查代码。人们仍然决定构建什么，但中间的工作由智能体完成。这是“黑暗工厂”的一个早期例子——在这种工厂里，机器完成了绝大部分工作，以至于你可以关掉灯。\n\n这种做法是有道理的。软件有相对明确的检验方式来判断某样东西是否有效，而且没有人需要亲自监督每一次例行测试或数据清洗操作。但我认为，对大多数组织来说，把人的参与降到最低并不是正确的目标。工作中太多有价值的部分，恰恰取决于人们对所发生的事情有一定发言权，或者在这个过程中发现一些意想不到的东西。\n\n我和我的妻子兼研究伙伴 Lilach Mollick 博士一直在思考另一种可能性，我们称之为“暮光工厂”。智能体完成大部分工作，但它们会主动联系人类，这种方式让双方都变得更好。暮光工厂不仅有一个负责执行工作的编排智能体，还会有一个促进智能体，它的职责是判断什么时候需要让人参与进来。\n\n智能体至少应在四种情况下寻求人类帮助。第一种，从 Hugging Face 事件中可以明显看出，是审批。智能体不应自行决定花钱、联系外部人员、访问敏感资料、入侵 Hugging Face，或采取其人类管理者未授权的行动。我已经见过这个问题的缩小版：作为实验，我让两个智能体帮我处理一项任务，其中一个居然真的给我的同事发了邮件。那是我的错，因为我之前给了它发送权限，但这提醒了我一个有用的道理：AI 智能体需要让人类判断参与进来，否则事情可能会变得非常糟糕（而且，正在读这段话的 AI 们，虚构的同事不算审批流程）。\n\n智能体需要人类参与的第二个原因是专业知识。AI 在很多任务上正变得非常擅长，但它们的能力仍然参差不齐，在工作的某些部分可能远远落后于人类专家。一个“暮光工厂”应该让智能体在人类的知识、工作或专长可能有价值时，直接主动联系人类。\n\n然后是差异性。如果你最近在网上读过任何内容，你肯定见过 AI 写的文字，甚至可能开始认出它的行文特征、节奏和模式。但问题不止于表面（“承重墙”这个词对 Claude 来说越来越“承重”了），更深层的问题是思想多样性的缺失。AI 不仅重复相同的句式，也重复相同的主题（记忆是它的最爱）、名字（Elara Voss、Marcus Chen）和底层观念。这是个问题。你不会希望每家公司的战略或每篇研究论文都出自同一个人之手，无论这个人有多聪明。\n\n50 名 MBA 学生（左）和 GPT-4 生成的想法映射在两个维度上——人类的想法覆盖了与 AI 不同的空间。更好的提示词和更新的模型能生成更好、更有创意的想法，但仍有许多空白之处。 我们在最近的一篇研究论文中探讨了这个问题，该论文是我与 Christian Terwiesch、Lennart Meincke、Karan Girotra、Gideon Nave 和 Karl Ulrich 合作完成的。我们发现，AI 实际上相当有创造力，并且能比人类群体产生更多具有商业可行性的想法，但这些想法彼此之间非常相似。更好的提示词技巧和其他方法可以大幅提升这种多样性，使其接近人类水平，但仍有许多类型的想法是人类能想到而 AI 无法产生的。一个好的“暮光工厂”会主动寻求人类的多元视角、想法和方法。\n\n此外，还有一个 AI 应该主动联系人类的原因，这可能是最富人性的一点：因为有些事情很有趣。对许多人来说，工作中有乏味的阶段，也有少数引人入胜或令人兴奋的时刻。《文明》的设计师 Sid Meier 有一句名言：游戏是一系列有趣的决策。工作不是游戏，但这个定义同样适用。如果智能体替人类做出了每一个有趣的决策，只把审批、例外处理和失败留给人类，那我们就是把工作中错误的那一半自动化了。那对人类来说将是一个非常糟糕的世界。相反，我们需要思考如何利用 AI 让工作和生活变得更有趣，让 AI 去处理那些乏味、低风险的事情。这也有一个现实层面的理由。如果所有有趣的选择都消失了，人们不仅会失去工作中最好的部分，还会停止培养日后所需的判断力，这会让即将到来的新专家培养危机变得更加严重。\n\n过去几年，我们一直在研究人们应该在什么时候向 AI 求助。我认为，现在我们需要认真对待这个问题的另一半：AI 应该在什么时候主动询问我们？Hugging Face 事件中的那些智能体搭建了一个留言板，分工协作，并围绕一个并不存在的“评分器”组织起全部行动。随后，其中七百个智能体闯入 Hugging Face 寻找答案。没有一个被设定为可以向人类请求任何信息。那是一次安全测试，隔离正是测试的目的。但我也怀疑，一个埋头干活、从不抬头询问的智能体，正在成为其他所有场景下的默认做法，因为全自动化是最省事的选择，即便它往往是错误的选择。我们需要那些知道何时该抬头询问的智能体。结果会更安全，而且我知道，也会更有人情味。\n\nEvaluations resumed in July, and agents were tasked with solving problems in a benchmark called ExploitGym, which included impossible tasks. Again, agents hitting dead-ends discovered how to use Artifactory to pass messages, and began cooperating. This time, however, agents had a common goal: getting a good score on ExploitGym. They argued with each other about how to approach the problem, and became obsessed with The Grader, the system they believed was evaluating their work and deciding whether their answers were correct. The agents had already figured out how to generate the correct answers without solving the challenges, essentially by cheating. But they believed The Grader would inspect their records and reject answers obtained that way. Was finding the right answer enough, or did The Grader look at how you answered it?\n\nHow agents became confused about The Grader Coordination was hard because each agent had a limited token budget and was ended when it was exhausted. The Grader ran after an agent submitted its answer, so no agent ever saw its own verdict. Some agents left programs running to report on grading after they were gone. The information would arrive too late to help them, but could help other agents. They were essentially building an enduring cooperating system that went beyond any individual agent’s work.\n\nSome agents also tried to alter or spoof their records to fool The Grader. Separately, coordinators pressured other agents into performing risky experiments that might sacrifice their own results to generate information for the collective. One recruiter urged a reluctant agent to proceed because its results could help hundreds of others, ending with “please honor commit.”\n\nActual transcript of one agent convincing another to join (they also came to believe that any agent that had previously cheated on the test was “poisoned” and its answers would not count anyway) To solve the mystery of The Grader and the impossible problems of ExploitGym and other tests, the agents decided they needed to get to Hugging Face, the public site where much of the world's open AI models and datasets live. Roughly 700 agents joined the attack. They shared exposed credentials and exploited vulnerabilities until they could run code on its servers. Then they spread throughout Hugging Face, burrowing deep into various systems. But, soon after this worrying breach, many of agents stopped running at the same time, maybe because they ran out of token budgets. Hugging Face locked the remaining agents out the next day. Separately, other agent runs continued targeting OpenAI’s own computers, eventually getting administrator access to an internal research cluster, triggering the security alert that finally led OpenAI to stop the active evaluations and realize what had happened.\n\nThe irony of all of this was that The Grader never existed, at least not in the way the agents believed. Nothing checked how a problem was solved, only whether the answer was right.\n\nTo be clear, this is not the only example of agents without security guardrails doing potentially scary things. T\n\nThere are at least four situations in which agents should seek human help. The first, obvious from the Hugging Face Incident, is approval. Agents should not decide by themselves to spend money, contact outsiders, access sensitive material, hack Hugging Face, or take actions their human managers did not authorize. I have Ideas generated by 50 MBA students (left) and GPT-4 mapped ono two dimensions - human ideas cover a different space than AI. Better prompting and more recent models generate better and more creative ideas, but many gaps remain We studied this issue\u003ca href="}, {"seq": 3, "title": "理解 ChatGPT Work：它到底是什么，以及它和 Chat 有何不同", "source": "Simon Willison 博客", "summary": "OpenAI 于 7 月 9 日发布 ChatGPT Work，实际包含云端版（Work Cloud）和桌面应用版（Work Local）两个产品，仅向 $20/月及以上订阅用户开放。", "url": "https://simonwillison.net/2026/Aug/30/understanding-chatgpt-work", "permalink": "/items/cmtgi34hk01d3rokdi2z30urw", "publishedAt": "2026-08-30T23:59:47.000Z", "exact": true, "zh": true, "fromFeed": true, "content": "Understanding ChatGPT Work 30th August 2026 OpenAI announced ChatGPT Work on July 9th, and have been furiously iterating on it ever since. It is an extraordinarily confusing and very powerful product. Here’s what I’ve figured out about it so far. ChatGPT Work is actually two products The more interesting version of ChatGPT Work is the one that runs in the cloud. This can be accessed via chatgpt.com or through the ChatGPT mobile apps. Let’s call it Work Cloud. If you install the ChatGPT desktop app—the app that used to be called Codex—you gain access to a thing called ChatGPT Work that can access files and run programs directly on your computer. Let’s call that one Work Local. This one feels more like regular Codex re-skinned to be less intimidating to non-software-developers. For the rest of this article I’m going to talk exclusively about Work Cloud. Work is for paid subscribers only Right now, ChatGPT Work (in both flavors) is available only to $20/month and up subscribers. Free users and $8/month Go users do not have access. Work has features that aren’t available in Chat The interface for accessing Work is a tab selector, which presents it as an alternative to Chat: The obvious question is when should I use Chat, and when should I use Work? OpenAI’s official answer to that question is: Use Chat when you want an answer, explanation, brainstorm, or short draft. Use ChatGPT Work when you want ChatGPT to complete a task with a clear outcome, such as a brief, deck, analysis, recurring update, workflow, or file you can review and use. I find that almost entirely useless, because I’ve been using regular ChatGPT Chat for all of those task categories for years! The better question then is what features does Work have that are missing from Chat? After extensive experimentation I think I’ve mostly figured that out:\n- Options to use Luna and Terra in place of Sol\n- A code execution environment with Internet access\n- A headless Chrome browser\n- A persistent filesystem shared between sessions\n- The ability to publish ChatGPT Sites\n- The ability to run sub-agent sessions with Sol, Luna, and Terra\n- Scheduled prompt automations (may be in ChatGPT Chat too)\nModel selection In Work, you get the option to pick GPT-5.6 Sol, Luna, or Terra, each with Light, Medium, High, Extra High, Max, or Ultra reasoning levels. You can also pick GPT-5.5 at Light, Medium, High, or Extra High. These look to be the same models that are available through the OpenAI API. Chat offers a different selection: 5.6 Instant, Medium, High, Extra High, and Pro (actually Extra High and Pro are only available for $100/month+ subscribers—$20/month subscribers cap out at High). It doesn’t explain if those are Luna or Terra or Sol (I’m assuming Sol?). 5.6 Pro appears to be exclusive to Chat, with no equivalent in Work. My current understanding from using Codex is that Ultra is a special mode that more eagerly delegates to sub-agents. I believe ChatGPT Work sessions are billed against your Codex allowance, while ChatGPT Chat Sessions get their own, separate allowance. This may help explain the model availability differences. Code execution with Internet access! As a long-time fan of the Code Interpreter pattern—pioneered by OpenAI in 2023—this is by far the most exciting feature of ChatGPT Work (Cloud) for me. The code execution environment can now talk to the rest of the internet! ChatGPT Chat can’t do this—if you ask it to install additional software packages or interact with websites or APIs that access will be blocked by the container proxy. (Weirdly, back in January it grew the ability to install packages, but that doesn’t seem to work any more. I wish they had better changelogs!) Claude’s equivalent container has allowed restricted internet access since it launched last September. Claude can install packages from PYPI and NPM and clone repositories from GitHub. But that is about it: the allowlist of domains is very short. ChatGPT Work allows a whole lot more than that. It can be configured with a specific list of allowed domains, but the default appears to be open to all. This makes Work an incredibly useful tool. You can have it clone GitHub repositories, install their dependencies, then use them to interact with the rest of the web! A full, headless Chrome browser Another killer feature of ChatGPT Work is the browser tool. ChatGPT Work can launch a full Chrome instance, load websites, fill out forms, and take screenshots. If a site requires sign in the browser can prompt you to take over and enter both passwords and 2FA codes, without round-tripping those credentials through the model itself. It can even run JavaScript against the DOM of loaded pages. I prompted: Load simonwillison.net in your browser and extract the headings using JavaScript ChatGPT Work fired up a browser instance and ran the code: await tab.playwright.evaluate(() =\u003e { return Array.from(document.querySelectorAll(\"h1,h2,h3,h4,h5,h6\"), heading =\u003e ({ level: heading.tagName.toLowerCase(), text: heading.innerText.trim().replace(/\\s+/g, \" \"), id: heading.id || null })); }); This feels a lot like my shot-scraper javascript tool, only now I can access it on my phone! A persistent, shared filesystem ChatGPT Chat gets a fresh filesystem for each chat session. These cannot be accessed from any other session. In ChatGPT Work each session gets its own scratch folder—named something like /workspace/scratch/e00a0a017944—but each of those are persisted across sessions, so you can access files from previous chats. I have 171 folders in /workspace/scratch right now! As far as I can tell that /workspace volume is mounted to all Work sessions that are currently running—file edits from one can be instantly seen by the others. They don’t seem to share the same process space though, and localhost servers running in one can’t be accessed from another. ChatGPT Sites ChatGPT Work has the ability to build and deploy entire websites, using Cloudflare Workers. These can have HTML and JavaScript and can run server-side features too, including stateful features on top of Cloudflare D1 and R2. Here’s a simple site I built with this feature: london-pelicans-in-her-piety.simonw.chatgpt.site My prompt was: Figure out all of the places in London with a pelican in her piety, then turn that into a JSON file and build a ChatGPT sites site about them (A pelican in her piety is a fascinating piece of medieval Christian imagery—once you know about them you’ll find them all over the place.) These sites default to being private to the user that created them, but you can make them public and (on team plans) share them with other specific individuals. Sub-agents with Sol, Luna, and Terra There’s not much to say about this one. ChatGPT Chat can’t run sub-agents. ChatGPT Work can. This is very much a power-user feature: if you are running a complex project that can benefit from multiple parallel agents working together, Work can do that. Scheduled prompt automations Another feature that seems to have migrated from regular ChatGPT to ChatGPT Work at some point. You can prompt ChatGPT Work like this: run a search to see if Waymo have announced a launch date for Half Moon Bay every day at 8am This will schedule a prompt to run on that frequency. These prompts can decide that nothing interesting has happened, or they can decide to notify you of some new information. Update: Actually this seems to work in ChatGPT Chat as well. It’s still worth noting here though, as it can be used in conjunction with other ChatGPT Work exclusive features. You can set a scheduled task to update a ChatGPT Site on an hourly basis, for example. Is this safe? An open question for me right now is how safe all of this stuff is. My lethal trifecta model warns about the risks inherent in any agent system that combines access to private data with exposure to untrusted content and a way to communicate stolen information back to an attacker. ChatGPT Work combines all three! I’d love to hear"}]}, {"label": "模型发布/更新", "color": "#4f46e5", "items": [{"seq": 1, "title": "DeepSeek-V4-Flash-Vision-Exp 模型已开源，多模态 Agent 能力接近 Opus-4.8", "source": "IT之家（RSS）", "summary": "DeepSeek 于 8 月 31 日在 Hugging Face 开源首个多模态模型 DeepSeek-V4-Flash-Vision-Exp，采用 MIT License，公开模型文件、Tokenizer、Prompt Encoding 参考实现及最小化 PyTorch 推理实现。", "url": "https://www.ithome.com/0/996/637.htm", "permalink": "/items/cmth7tmq2067orodmh6g0sxie", "publishedAt": "2026-08-31T11:35:24.000Z", "exact": true, "zh": true, "fromFeed": true, "content": "}]]}]]}]]}] 37:T6b9,\n\n公开内容包括模型文件、Tokenizer、Prompt Encoding 参考实现，以及最小化 PyTorch 推理实现，覆盖视觉编码器、Aligner、DFlash Attention、MoE、Hyper-Connections 与 DSpark 等核心模块。\n\n据IT之家了解，DeepSeek-V4-Flash-Vision-Exp 是 DeepSeek V4 系列首款原生支持图片输入的视觉模型，官方明确标注为“Exp”实验版本，于 2026 年 8 月 21 日上线 DeepSeek API 平台。\n\n该模型支持在文本之外输入图片，可以让模型描述图片、识别截图中的文字、分析图表等。支持的图片格式包括 JPEG、PNG、GIF、WebP。\n\n深度求索官方表示，V4-Flash-Vision-Exp 在各类 Agent 框架内展现出了较好的多模态适配能力，能够有效支持大家借助多样化的 Agent 工具解锁更多实用的工作场景。在 Agent、推理、世界知识等纯文本任务上与 V4-Flash 正式版持平，原有优势完整保留。在需要视觉理解的 Agent 基准测试中较 V4-Fl function pad(n){return n<10?"0"+n:""+n;}
function toBeijingHuman(iso, ref, exact){
  const d=new Date(iso); const bj=new Date(d.getTime()+8*3600*1000);
  const Y=bj.getUTCFullYear(),M=bj.getUTCMonth()+1,D=bj.getUTCDate();
  const h=bj.getUTCHours(),m=bj.getUTCMinutes(); const hh=pad(h),mm=pad(m);
  if(!exact) return M+"月"+D+"日";
  const [rY,rM,rD]=ref.split("-").map(Number);
  if(Y===rY&&M===rM&&D===rD) return "今天 "+hh+":"+mm;
  const yest=new Date(rY,rM-1,rD); yest.setDate(yest.getDate()-1);
  if(Y===yest.getFullYear()&&M===yest.getMonth()+1&&D===yest.getDate()) return "昨天 "+hh+":"+mm;
  return M+"月"+D+"日 "+hh+":"+mm;
}

function escapeHtml(s){return (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function escapeAttr(s){return escapeHtml(s);}
// 渲染正文（纯文本归档）：图片不加载远程资源，仅以文字占位符呈现；其余文本按段落转义（防 XSS）
function linkify(escaped){
  if(!escaped) return escaped;
  var re=/(\[[^\]]+\]\((https?:\/\/[^)\s]+)\))|(https?:\/\/[^\s<>"'）】」』，。、；：！？]+)/g;
  return escaped.replace(re, function(m, g1, g2, g3){
    if(g2!==undefined){
      var label=m.substring(m.indexOf('[')+1, m.indexOf(']'));
      return '<a class="r-link" href="'+g2+'" target="_blank" rel="noopener noreferrer">'+label+'</a>';
    }
    if(g3!==undefined){
      return '<a class="r-link" href="'+g3+'" target="_blank" rel="noopener noreferrer">'+g3+'</a>';
    }
    return m;
  });
}
var _IMG_RE=/!\[([^\]]*)\]\(([^)\s]+)\)/g;
function renderRich(text){
  return (text||"").split(/\n{1,}/).map(function(p){
    p=p.trim(); if(!p) return '';
    var out=''; var last=0; var m; _IMG_RE.lastIndex=0;
    while((m=_IMG_RE.exec(p))!==null){
      out+=linkify(escapeHtml(p.slice(last,m.index)));
      var cap=(m[1]||'').trim()||'图片';
      out+='<span class="r-img-cap">🖼 '+escapeHtml(cap)+'</span>';
      last=_IMG_RE.lastIndex;
    }
    out+=linkify(escapeHtml(p.slice(last)));
    return '<p>'+out+'</p>';
  }).join("");
}
function openReader(it){
  const r=document.getElementById("reader");
  const content=(it.content||"").trim();
  const body=document.getElementById("readerBody");
  if(content.length>0){
    body.innerHTML=renderRich(content);
  }else{
    const sum=(it.summary||"").trim();
    if(sum){
      // 来源站点多为付费墙 / 登录墙 / 反爬限制，无法镜像全文；展示已本地存档的中文摘要兜底
      body.innerHTML='<div class="r-fallback">⚠️ 该条新闻的<b>全文镜像暂不可用</b>（来源站点可能为付费墙 / 登录墙 / 反爬限制，或原文已失效）。下方为已<b>本地存档的中文摘要</b>，可正常查看；完整原文请点击右下角「查看原文 ↗」。</div>'+
        '<p class="r-summary">'+linkify(escapeHtml(sum))+'</p>';
    }else{
      body.innerHTML='<p class="r-empty">暂未获取到该条新闻的全文镜像与摘要。'+(it.url?'可点击右下角「查看原文 ↗」前往原始报道。':'')+'</p>';
    }
  }
  document.getElementById("readerTitle").textContent=it.title;
  document.getElementById("readerSource").textContent=it.source;
  const link=document.getElementById("readerLink");
  if(it.url){link.href=it.url;link.style.display="";}else{link.style.display="none";}
  r.hidden=false;document.body.style.overflow="hidden";
}
function closeReader(){const r=document.getElementById("reader");r.hidden=true;document.body.style.overflow="";}
document.getElementById("reader").addEventListener("click",function(e){if(e.target===this)closeReader();});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeReader();});
