׺\u000eC[u\u003ekn_Mv ϪK\u003eiskF7\"Q+ \u0012\u0013U\u003e{VAlWC#\\7U69\u0007KVȝ0[ܠ\u0000\u0013/I$\u0002ʍ[\u001aM\u0006~T$țAS GEɅZw\u0011:\u0006.\u00041%^ \u0013\u0010g 0Ŝ:d®F;Tn A\u0005Q E8Zh-\u001aRWq,\u0004\u0005wա\u00000!УI\u000638pL\u0016CP\u0017\u0018\u000e93\u001aP8b \u0016\u0001gf\u001b4\u0013VDei 2P&p\u000eb1^u!\u0019"}, {"seq": 3, "title": "Tom Tunguz 分析 OpenAI 的 3x AI 生产力增益是否只是机器不睡觉", "source": "Tomer Tunguz 博客（VC 分析）", "summary": "Tom Tunguz 引用 OpenAI 内部数据，分析其 3x 研究生产力增益的来源：每名研究员 8 小时班次对应 3.14 个 agent 工作日，通常并行运行 4 个 agent。", "url": "https://tomtunguz.com/openai-research-acceleration-agentic-productivity", "permalink": "/items/cmtt3hrxg02xarowa0a6iz1dc", "publishedAt": "2026-09-08T00:00:00.000Z", "exact": true, "zh": true, "fromFeed": true, "content": "\u003e At $2.5m a year per seat, inference behaves like heavy factory tooling. But it comes with a financial twist : it is pure OPEX.\n\nAuto plants buy welding robots with capex. They run night shifts to amortize machinery that depreciates whether used or idle. AI systems invert that math. Inference is metered operating expense. With no physical tooling & no graveyard-shift wages, a company can run machines overnight on pure variable cost.\n\nThe 3.14 workday ratio is not three times smarter thinking. It is one engineer supervising three shifts of machine runtime while only being awake for one.\n\nYet unlike an auto welding robot, this digital assembly line has a massive defect rate. Over half of the successful four-to-eight-hour tasks in the last six months still needed human intervention ; the lab is candid that “the overall pace of progress likely won’t keep pace with these specific metrics.”\u003ca href="}]}, {"label": "模型发布/更新", "color": "#4f46e5", "items": [{"seq": 1, "title": "Mistral 完成 30 亿欧元 D 轮融资，估值超 210 亿欧元", "source": "Mistral AI：News（网页）", "summary": "Mistral 宣布完成 30 亿欧元 D 轮融资，投后估值超过 210 亿欧元，公司称这是欧洲科技公司有史以来最大的股权融资，距其成立三年。", "url": "https://mistral.ai/news/mistral-makes-sovereign-open-weight-ai-to-frontier", "permalink": "/items/cmts9dr2m029hrobq86wrny37", "publishedAt": "2026-09-08T05:58:27.839Z", "exact": true, "zh": true, "fromFeed": true, "content": "Company Mistral raises €3B to make sovereign, open-weight AI the technology frontier Mistral today announced that it has raised €3 billion in a Series D funding round at a post-money valuation of more than €21 billion, the largest equity fundraising round ever completed by a European technology company, three years after the company's launch. Samsung Electronics led the round, joined by co-leads Scaleup Europe Fund, managed by EQT, and existing investor PSG Equity. The round will significantly expand Mistral's frontier research, which is the foundation underpinning its infrastructure, products and sovereignty. While allowing Mistral to scale its compute capacity for training powerful models, it will help Mistral expand infrastructure and accelerate its commercial growth and international footprint. The company now operates across 20 countries and supports 125+ global enterprises’ mission-critical AI transformation, including Airbus, ASML, and HSBC. During the first wave of generative AI, the central question was who could build the most powerful model. Organizations and governments are now asking a different one: how to harness the power of AI for their mission-critical needs without surrendering control over the infrastructure and intelligence loop. Demand for that combination of performance with control, choice and independence is growing internationally, as enterprises and governments weigh the long-term technology dependencies, data governance requirements and deployment choices that come with any AI investment. Mistral is the only AI company in the world building the full stack required to answer that question: open-weight models, the infrastructure and the compute capacity they run on, and the products that bring them into production; ensuring that customers are never locked into a single vendor's roadmap, pricing or availability. Mistral’s full-stack and open approach also allows organizations to build on it without exposing their most valuable data, workflows and institutional knowledge to anyone outside their own walls. That's what makes Mistral’s stack the sovereign AI layer, meaning retaining control across four dimensions: data that stays inside the organization's boundaries, models that are controllable and customizable, compute that is private and predictable, and systems in production that are fully controllable and auditable. The round reflects a strategic endorsement from investors across Europe, Asia and North America. It brings together a world-class syndicate of strategic and financial investors, including global technology leaders, growth investors and existing shareholders that have supported Mistral’s development to date. With a Series C led by ASML and a Series D led by Samsung Electronics, Mistral has attracted backing from companies at the forefront of advanced manufacturing, engineering and industrial technology. This support reflects growing confidence that Mistral's approach can help organisations deploy state-of-the-art AI inside complex real-world environments while maintaining control over their data, infrastructure and knowledge. Advent, funds and accounts managed by BlackRock as well as the Grand Duchy of Luxembourg joined the round as new investors. Existing investors a16z, ASML, Belfius, BNP Paribas CIB, Bpifrance, Carmignac, DST Global, Eurazeo, General Catalyst, Headline, Hillspire, Index Ventures, Korelya Capital, Lightspeed, NVIDIA, Phoenix Court's Solar fund (home to LocalGlobe, Latitude and Solar) and Salesforce Ventures participated in the round."}, {"seq": 2, "title": "OpenAI 发布 ChatGPT Images 2.5 图像模型", "source": "OpenAI：官网动态（RSS · 排除企业/客户案例）", "summary": "OpenAI 发布 ChatGPT Images 2.5 图像模型，生成延迟比 Images 2.0 降低最多 50%，细节、编辑精度、参考照片保真度和多轮编辑一致性均有提升。", "url": "https://openai.com/index/introducing-chatgpt-images-2-5", "permalink": "/items/cmtt0pw2p018pro9owlhpi092", "publishedAt": "2026-09-08T11:30:00.000Z", "exact": true, "zh": true, "fromFeed": true, "content": "\u003e\n\n更清晰的细节、更快的生成速度、更精准的编辑，以及更出色的创作与分享工具。\n\n每周，人们通过 ChatGPT Images 和 API 中的 GPT-Image 模型创作超过 30 亿张图片。今天，我们扩展了 ChatGPT Images 2.5 的创作能力——这是我们最新的先进图像模型，为你的创意工作流带来更清晰的细节、更精准的编辑和更快的生成速度。\n\nImages 2.5 能呈现更自然的光影和更丰富的质感，能更好地保留参考照片中的主体，并且能在多轮对话中更可靠地遵循编辑指令。与 Images 2.0 相比，我们还将图像生成延迟降低了最高 50%，让你能更快地生成图像并打磨你的构思。\n\n在 ChatGPT 中，我们推出了多项产品功能，让你对创作过程拥有更多掌控。Sketch 是一项新功能，让你可以直接在 ChatGPT 中作画，作为最终图像的参考。Templates（模板）让创作变得更简单，覆盖传单、产品照片等一些最热门的图像格式。此外，你现在可以直接在图像上添加评论，实现更有针对性的编辑；还可以分享你使用过的提示词，让其他人用他们自己的照片和细节来尝试你的创意。\n\nImages 2.5 现已面向所有 ChatGPT、ChatGPT Work 和 Codex 用户开放，支持桌面端、移动端和网页端。\n\n面向开发者，我们在 API 中推出了两款新模型。GPT‑Image‑2.5 Flare 在画质、编辑能力和速度上带来了同样的提升，而 GPT‑Image‑2.5 Sunburst 则为精细创意工作提供了更高精度的支持，生成时间也更长。\n\n创作时的图像保真度\n\n最有意义的图像往往植根于真实的人物、地点和记忆。Images 2.5 能更好地利用参考照片，将熟悉的主题呈现在新的场景、视觉风格和构图中。图像主体辨识度更高，光影和质感更自然，独特特征也更有可能得到保留。\n\n对于基于 API 进行开发的团队而言，同样的保真度让以参考图为核心的工作流更加可靠，使变体创作能够始终锚定原始素材。\n\nChatGPT Images 2.5\n\n输入\n\n精准编辑\n\n我们让定点编辑变得更加简单，帮助你最终得到更贴合心中所想的成图。Images 2.5 能更好地只编辑你指定的部分，同时保持其余细节不变——即使面对更复杂的主题和背景也是如此。\n\n对于使用 Images API 的开发者来说，这使用户能够更新单个元素——例如产品、背景或一段文案——同时保留其周围的主题、构图和品牌风格。\n\n以下视频由多张图像组成，展示了该模型在遵循精确编辑指令方面能力的提升。\n\n多轮编辑一致性\n\n在较长的 ChatGPT 对话中，Images 2.5 能在多次编辑中更可靠地遵循具体的编辑指令。较早的修改更有可能保持一致，并且每次新编辑都会建立在您已完成工作的基础上，而不会随着时间推移降低图像质量。\n\n这种一致性在生产工作流中同样重要，因为开发者需要在不重建整个素材的情况下进行有针对性的修改。\n\n以下视频由多张图像组成，展示了该模型在多轮编辑中保持图像质量能力的提升。\n\n智能与风格改进\n\nImages 2.5 更擅长理解复杂的视觉指令，并将其转化为连贯的结果。包含真实世界信息的图像内容更加准确，并且该模型能够处理更复杂的布局，包括透明背景。它还能更好地反映视觉风格，因此您的图像更贴合您的艺术构想。\n\n对于开发者和企业而言，这让复杂的创意需求变得更加可靠。模型更有可能保留所要求的视觉方向、构图和各个细节，而不会随着指令变得越来越具体而偏离方向。这在生成一系列符合品牌调性的创意素材、保持既定层级结构的 UI 概念，或适配特定版式的演示视觉时尤为重要。\n\n使用 Sketch 将你的想法画出来\n\n有时，解释一个想法最清晰的方式就是把它画出来。\n\n我们推出了 Sketch 这一新功能，让你可以直接在 ChatGPT 中作画，并将其用作视觉参考。现在，你可以快速画出房间的布局、正在构思的服装轮廓，或者只是一幅有趣的涂鸦，ChatGPT 会将你的粗略画作转化为完整的图像。添加风格描述以及任何其他你希望确保能体现自己想法的细节即可。\n\n你不需要是专业艺术家——这只是另一种让最终图像更贴近你心中所想的方式。想亲自尝试的话，只需在 ChatGPT 中输入“@Sketch”即可。\n\n结构化你的提示词以获得更好的结果\n\n有时你可能对自己想创作的内容有清晰的想法——只是需要一些帮助来开始。\n\n我们为一些最受欢迎的创意格式推出了模板。无需从空白画布开始，你可以选择“海报”或“周边商品”等模板，并添加要传达的信息、设计元素或风格等细节，来个性化你的创作成果。\n\n把你最棒的创意传递下去\n\n很多时候，你会得到一张好到不分享都可惜的图片。\n\n现在，当你分享一张图片时，还可以选择附上生成它的提示词。其他人就能基于同样的创意继续发挥，加入他们自己的图片和细节，创作出带有个人风格的版本。\n\n例如，试试这个 目前正在疯传的提示词，看看你在80年代会是什么样子！\n\nSharper details, faster generation, more precise editing, and better tools for creating and sharing.\n\nEvery week, people create more than 3 billion images across ChatGPT Images and the GPT‑Image models in the API. Today, we’re expanding what you can create with ChatGPT Images 2.5—our new state-of-the-art image model that brings sharper details, more precise editing, and faster generation to your creative workflows.\n\nImages 2.5 produces more natural lighting and richer textures, is better at preserving the subjects in your reference photos, and follows editing instructions more reliably across multiple turns. We’ve also reduced image generation latency by up to 50% compared with Images 2.0, so you can generate images and refine your concepts more quickly.\n\nIn ChatGPT, we’re introducing product features that give you more control over the creative process.\n\nInput\n\nPrecision editing\n\nWe’ve made it easier for you to make focused edits, so you end up with final images that are more aligned with what you actually had in mind. Images 2.5 is better at editing only what you’ve asked for, while keeping the rest of the details the same—even with more complex subjects and backgrounds.\n\nFor developers using the Images API, this gives users the ability to update a single element—such as a product, background, or piece of copy—while preserving the subject, composition, and brand treatment around it.\n\nThe following videos are made up of multiple images, highlighting the model’s improved ability to follow precise editing instructions.\n\nMulti-turn editing consistency\n\nDuring longer ChatGPT conversations, Images 2.5 follows specific editing instructions more reliably across multiple edits. Earlier changes are more likely to stay consistent, and each new edit builds on the work you’ve already done without degrading image quality over time.\n\nThat consistency also matters in production workflows, where developers need to make targeted changes without rebuilding the entire asset.\n\nThe following videos are made up of multiple images, highlighting the model’s improved ability to maintain image quality over multiple turns.\n\nIntelligence and style improvements\n\nImages 2.5 is better at understanding complex visual instructions and translating them into coherent results. Images that include real-world information have more accurate content, and the model can handle more complex layouts including transparent backgrounds. It’s also better at reflecting visual styles, so your images are more aligned with your artistic vision.\n\nFor developers and businesses, this makes complex creative briefs more dependable. The model is more likely to retain the requested visual direction, composition, and individual details, instead of drifting as instructions become more specific. That matters when generating a series of on-brand creative assets, UI concepts that preserve a given hierarchy, or presentation visuals that fit a defined structure.\n\nUse Sketch to draw your idea to life\n\nSometimes the clearest way to explain an idea is by drawing it.\n\nWe’re introducing Sketch, a new feature which lets you draw right in ChatGPT and use it as a visual guide. Now you can quickly sketch the layout of a room, the contour of an outfit you’re concepting, or just a funny doodle, and ChatGPT will turn your rough art into a complete image. Add a description of the style and any other details you want to make sure it reflects your vision.\n\nYou don’t need to be a professional artist—this is just another way to get your final image closer to what you have in mind. To\n\nStructure your prompts for better results\n\nAt times you may have a clear idea of what you want to make—you just need some help getting started.\n\nWe’re introducing templates for some of the most popular creative formats. Instead of starting with a blank canvas, you can choose a template like “Poster” or “Merch” and add details like information to convey, design elements, or styles to personalize your results.\n\nPass your best ideas along\n\nOften you end up with an image that’s too good not to share.\n\nNow when you share an image, you can also choose to include the prompt that got you there. Someone else can then run with the same idea, bringing in their own images and details to make a version that feels like their own.\n\nFor example, try out\n\nImages 2.5 in the API\n\nDevelopers are building image generation workflows into products used by creative, marketing, retail, and media teams every day with the Images API.\n\nWe’re releasing two new image models in the API:\n\nGPT‑Image‑2.5 Flare brings the same improvements in quality, editing, and speed to the API and is the default choice for most applications, delivering higher-quality images than GPT‑Image‑2 at 50% lower latency. It’s well suited to everything from creator and social content to product experiences, visual search, rapid image prototyping, and high-volume generation.\n\nGPT‑Image‑2.5 Sunburst is built for premium visual workflows that benefit from tighter control across edits. Use it for creative and editing workflows like production-ready campaign creative or polished product imagery.\n\nHere’s what early customers have to say about the new models:\n\n“What impressed us most about GPT‑Image‑2.5 Flare is how well it understands what not to change. You can make a meaningful edit without losing the character, composition or visual identity of the original image. That’s incredibly important for the way creators and teams actually work across film, UGC and advertising. And when you combine that level of control with the speed, quality and cost, GPT‑Image‑2.5 Flare really stands out.”\n\nAxultan Alimkulov, Head of Product at \u003ca href="}]}, {"label": "论文研究", "color": "#e11d48", "items": [{"seq": 1, "title": "OpenAI 宣布以内部 AI 系统给出 Navier–Stokes 千禧年问题解答", "source": "OpenAI：官网动态（RSS · 排除企业/客户案例）", "summary": "OpenAI 宣布其内部 AI 系统给出 Navier–Stokes 存在与光滑性问题的解答，证明初始光滑的流体可在有限时间内形成奇点，并附证明文稿与 Lean 形式化验证。", "url": "https://openai.com/index/navier-stokes-solution", "permalink": "/items/cmtszna9e04isro5woti0ixg6", "publishedAt": "2026-09-08T10:00:00.000Z", "exact": true, "zh": true, "fromFeed": true, "content": "\u003e\n\nA snapshot of local incompressible motion. Orange marks faster angular rotation; teal marks slower rotation. Circulating speed also depends on radius. The trajectories show inward spiraling and axial stretching.\n\nHow we found the proof\n\nSince August 28 we have been training a new internal model that has exhibited unprecedented performance in our benchmarks, including mathematics. This model’s training is ongoing and its performance continues to improve.\n\nOn Tuesday, September 1, we heard rumors that two Millennium Prize problems had been resolved. Inspired by these rumors and by the step change in performance of our internal model, we launched an effort to evaluate it on all open Millennium Prize problems and a few other high-impact problems.\n\nWe used a system of coordinating agents powered by our internal model. The agents had access to tools such as the ability to read from a cached version of the internet and the ability to run code. Agents were subdivided into groups with the ability to communicate within the group. The groups varied in size, and the group that produced the Navier–Stokes resolution involved on the order of 10,000 concurrent agents. At all times we maintained the same strict safeguards that we apply to all our frontier model evaluations, including monitoring and isolation.\n\nFor each problem, we prompted different groups of agents with different variants of the problem statement, covering all variants of the problem. For the Navier–Stokes problem, we suggested versions “A” and “B” (particular forms of the Navier–Stokes problem which would result in a proof) and versions “C” and “D” (which would result in a disproof) to separate groups of agents.\n\nIn addition to the full Millennium Prize problems, we asked our multiagent system to try a set of “easier” problems. One of these problems was a similar blowup question for the limit of the Navier–Stokes problem with the viscosity term removed. This is known as the regularity problem for the Euler equations, and our agents surprised us by resolving this question. The specific variant of the question that they resolved was the unforced version, where no external force is applied to the fluid. Nearly 100 agents worked together for approximately 50 hours to produce our Euler regularity disproof.\u003ca href="}]}]};
function pad(n){return n<10?"0"+n:""+n;}
function toBeijingHuman(iso, ref, exact){
  const d=new Date(iso); const bj=new Date(d.getTime()+8*3600*1000);
  const Y=bj.getUTCFullYear(),M=bj.getUTCMonth()+1,D=bj.getUTCDate();
  const h=bj.getUTCHours(),m=bj.getUTCMinutes(); const hh=pad(h),mm=pad(m);
  if(!exact) return M+"月"+D+"日";
  const [rY,rM,rD]=ref.split("-").map(Number);
  if(Y===rY&&M===rM&&D===rD) return "今天 "+hh+":"+mm;
  const yest=new Date(rY,rM-1,rD); yest.setDate(yest.getDate()-1);
  if(Y===yest.getFullYear()&&M===yest.getMonth()+1&&D===yest.getDate()) return "昨天 "+hh+":"+mm;
  return M+"月"+D+"日 "+hh+":"+mm;
}

function escapeHtml(s){return (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function escapeAttr(s){return escapeHtml(s);}
// 渲染正文（纯文本归档）：图片不加载远程资源，仅以文字占位符呈现；其余文本按段落转义（防 XSS）
function linkify(escaped){
  if(!escaped) return escaped;
  var re=/(\[[^\]]+\]\((https?:\/\/[^)\s]+)\))|(https?:\/\/[^\s<>"'）】」』，。、；：！？]+)/g;
  return escaped.replace(re, function(m, g1, g2, g3){
    if(g2!==undefined){
      var label=m.substring(m.indexOf('[')+1, m.indexOf(']'));
      return '<a class="r-link" href="'+g2+'" target="_blank" rel="noopener noreferrer">'+label+'</a>';
    }
    if(g3!==undefined){
      return '<a class="r-link" href="'+g3+'" target="_blank" rel="noopener noreferrer">'+g3+'</a>';
    }
    return m;
  });
}
var _IMG_RE=/!\[([^\]]*)\]\(([^)\s]+)\)/g;
function renderRich(text){
  return (text||"").split(/\n{1,}/).map(function(p){
    p=p.trim(); if(!p) return '';
    var out=''; var last=0; var m; _IMG_RE.lastIndex=0;
    while((m=_IMG_RE.exec(p))!==null){
      out+=linkify(escapeHtml(p.slice(last,m.index)));
      var cap=(m[1]||'').trim()||'图片';
      out+='<span class="r-img-cap">🖼 '+escapeHtml(cap)+'</span>';
      last=_IMG_RE.lastIndex;
    }
    out+=linkify(escapeHtml(p.slice(last)));
    return '<p>'+out+'</p>';
  }).join("");
}
function openReader(it){
  const r=document.getElementById("reader");
  const content=(it.content||"").trim();
  const body=document.getElementById("readerBody");
  if(content.length>0){
    body.innerHTML=renderRich(content);
  }else{
    const sum=(it.summary||"").trim();
    if(sum){
      // 来源站点多为付费墙 / 登录墙 / 反爬限制，无法镜像全文；展示已本地存档的中文摘要兜底
      body.innerHTML='<div class="r-fallback">⚠️ 该条新闻的<b>全文镜像暂不可用</b>（来源站点可能为付费墙 / 登录墙 / 反爬限制，或原文已失效）。下方为已<b>本地存档的中文摘要</b>，可正常查看；完整原文请点击右下角「查看原文 ↗」。</div>'+
        '<p class="r-summary">'+linkify(escapeHtml(sum))+'</p>';
    }else{
      body.innerHTML='<p class="r-empty">暂未获取到该条新闻的全文镜像与摘要。'+(it.url?'可点击右下角「查看原文 ↗」前往原始报道。':'')+'</p>';
    }
  }
  document.getElementById("readerTitle").textContent=it.title;
  document.getElementById("readerSource").textContent=it.source;
  const link=document.getElementById("readerLink");
  if(it.url){link.href=it.url;link.style.display="";}else{link.style.display="none";}
  r.hidden=false;document.body.style.overflow="hidden";
}
function closeReader(){const r=document.getElementById("reader");r.hidden=true;document.body.style.overflow="";}
document.getElementById("reader").addEventListener("click",function(e){if(e.target===this)closeReader();});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeReader();});
