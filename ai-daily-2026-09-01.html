const DATA = {"meta": {"reportDate": "2026-09-01", "reportDateHuman": "2026年9月1日", "weekday": "星期二", "total": 8, "source": "AI HOT", "sourceUrl": "https://aihot.virxact.com", "generatedAt": "2026年09月01日 08:07"}, "sections": [{"label": "模型发布/更新", "color": "#4f46e5", "items": [{"seq": 1, "title": "Runway 发布 Solaris：首个界面世界模型，实时生成操作系统级交互界面", "source": "Runway：News（网页）", "summary": "Runway 推出 Solaris，这是其全新界面世界模型（Interface World Models）系列的首个模型。Solaris 能实时逐帧生成应用和网站界面，无需中间代码表示，直接以图像作为交互层，支持视觉化、动态响应和开放式交互。它还可用于训练智能体，使其适应不断变化的界面布局，而非局限于特定训练环境。", "url": "https://runwayml.com/news/research/introducing-solaris", "permalink": "https://aihot.virxact.com/items/cmthhmoi10e71rodmx6wngoz1", "publishedAt": "2026-09-01T00:00:00.000Z", "exact": false, "content": "Runway 新闻 | 介绍 Solaris 创意开发 机器人 研究 资源 企业 定价 企业销售 登录 试用 Runway 新闻 / 研究 介绍 Solaris 2026年8月31日 由 Runway 发布 今天，我们分享 Solaris：一个全新 AI 系统家族中的首个模型，我们称之为“界面世界模型”。Solaris 从一个问题开始：当操作系统在你使用的同时生成应用和网站，会发生什么？从早期的终端到 Linux 和 macOS，每个操作系统都决定了屏幕上渲染的内容，以及当人或程序对其操作时会发生什么。应用构建在这些系统之上，并且在有人推送更新之前始终保持不变。Solaris 则直接渲染这一层。它是一个实时交互模型，逐帧生成界面本身。每一帧都在你交互时被合成，使界面能够持续响应你的操作。\n\n设计比以往任何时候都更加视觉化，像素级完美的模型和图像模型可以生成几乎与成品难以区分的完整屏幕。但图像并不能像网站或应用那样运行。今天构建的每一款软件仍然需要一次转换：视觉设计必须首先被转换为中间表示（例如代码），然后才能执行任何操作。这种中间表示限制了界面的可能性，以及它对人类和智能体交互的响应方式。每种行为都必须提前被明确定义和实现，因此软件以交互可能空间的“有损压缩”形式发布，在任何用户到来之前就被冻结了。\n\n同样的转换过程也牺牲了视觉保真度。一旦设计被简化为一种简化表示，界面可以快速响应，但代价是放弃原始设计中的大量丰富性。Solaris 联合处理渲染和交互，消除了我们今天与设计相关的许多权衡。一个单一的世界模型生成每一帧和对用户输入的每一次响应，无需中间表示。由于没有转换步骤，就没有损失，整个帧本身就成为了界面。\n\n我们认为 Solaris 为构建网站、应用和其他在线界面开辟了新途径。但它也是一种在更动态环境中训练智能体的新方法。即使是当今最好的大语言模型也难以完成基本的计算机使用任务，比如预订酒店或订购杂货。由于基于文本的模型被训练来使用编码界面，它们往往只学会训练时所用的特定布局，无法适应略有不同的界面（例如，两个不同的酒店网站）。通过压缩行动与响应之间的空间，Solaris 让智能体能够针对不断变化的界面以及可能从未存在过的布局进行训练。新功能 Solaris 为软件带来了三项新能力。\n\n下载 首先，Solaris 完全是视觉化的。当图像本身成为应用时，就无需在用户所见的视觉之下隐藏第二个实现步骤。想象一下浏览一家虚拟服装店，展厅本身就是界面。以你的一张照片作为参考，你可以从架子上拿起一件衬衫，拖到自己身上试穿，或像在实体店中一样自然地重新布置展示。下载 其次，它是“活”的。由于应用被持续渲染，它始终在演变，而不是等待下一个用户\n\n动作。光影会随照明变化而变化，物体在被操作时也会自然响应。用户只需简单地说一句：“把桌子移开，让我看看效果”或“换一下沙发的颜色”。最终呈现的软件，不再像是浏览预设的页面，而更像是与一个鲜活的场景互动。即便是同一个起始画面——这里是一张手部的X光片——也能对同样的拖拽操作产生两种截然不同的反应。\n\n下载\n\n最后，它是开放式的。传统界面局限于开发者在开发阶段预设的交互方式，而Solaris能在同一场景中支持完全不同的行为，实时响应用户的交互。这种灵活性将界面从预定义的工作流程中解放出来，转而由驱动世界模型的能力来决定什么是可能的。\n\n下载\n\nSolaris将界面转变为一种互动体验，而非一系列页面。用户不再从菜单中挑选选项，而是直接与场景本身互动。制作沙拉只需将食材拖入碗中，界面会随着每种食材的加入而自然响应。\n\n如今，人们在网上遇到困难时会求助于大语言模型（LLM）。但LLM以文本作答，而大多数动手操作的任务并非基于文本的问题。Solaris以视觉方式在上下文中呈现下一步操作，你可以对其进行引导。例如，你可以生成一个燃烧的互动演示，让用户尝试不同的材料，并在互动中观察符合物理规律的反应。\n\n下载\n\n为什么直到现在才出现？\n\n数字界面建立在两套系统之上，而此前它们分属不同的世界。一类是“懂知识”的系统（如搜索引擎和AI助手），它们以静态内容作答：文本、图片，或许还有嵌入的视频。另一类是“实时响应”的系统（如JavaScript/CSS、游戏引擎，以及近来的交互式世界模型），它们能创造丰富的互动体验，但对你的产品、任务或目标一无所知。\n\n我们传统上把软件界面视为确定性程序，把世界模型视为视觉内容的生成器。而一个界面世界模型必须同时兼具两者：一个能理解你的意图，同时持续渲染周围交互世界的系统。一旦尝试构建这样的系统，三个工程挑战便会立刻浮现：\n\n速度。交互延迟一旦达到半秒左右，就不再具有互动感。视频扩散模型生成一段片段需要数秒或数分钟，这对内容创作来说可以接受，但对界面而言太慢了。要跨越这一门槛，模型必须逐帧生成，每帧仅依赖前一帧，且成本足够低以跟上用户的操作。\n\n保持连贯性。界面必须在整个会话期间保持一致，而不仅仅是单个片段。它需要保留的内容（如文本、布局、物体身份）恰恰是生成视频历来难以维持的部分，而生成时间越长，小错误就会不断累积。\n\n成本。逐帧生成仍比提供一次构建好的页面更昂贵。让Solaris实现实时性的工作，同时也使其运行成本比标准视频扩散模型低出几个数量级，而且成本曲线还在持续改善。Solaris是我们的一次押注，押注这些概念性\n\n技术和工程上的障碍是可以克服的。我们构建它时聚焦于三个要点：实时交互、整个会话过程中的连贯性，以及保持720p的视觉质量。Solaris的工作原理 Solaris基于我们的Gen-4.5视频生成模型构建，我们对其进行了调整，使其（1）理解交互并（2）实时响应。它遵循了我们通过通用世界模型GWM-1开辟的路径。学习交互。Solaris将用户输入视为下一帧的条件，就像它处理文本或图像一样。模型在生成过程中观察点击、拖拽和其他交互，将它们作为接下来发生什么的信号。由于模型只看到已经发生的交互（从不看到未来的交互），它学习了用户行为与视觉结果之间的关系。这意味着它知道当某物被点击、拖拽或修改时应该发生什么，而无需显式编程这些交互。实时运行。标准的视频扩散模型通过数十个去噪步骤来细化整个片段，这个过程对于动态用户交互来说太慢了。我们分三个阶段将Solaris转换为实时引擎。首先，我们教会它自回归地生成帧，每一帧仅依赖于之前的内容。接下来，我们将多步去噪过程蒸馏为仅几步。最后，我们在快速模型自身的输出上训练它，以便在长时间交互中保持视觉质量的稳定。结果是以交互速度生成帧，同时保留原始教师模型的视觉质量。下载推理与渲染。\n\nSolaris逐帧生成界面，而语言模型决定该界面如何演变。LLM解释用户请求，决定交互何时应修改当前场景与何时过渡到新场景，定义使世界感觉生动的行为，并生成指导Solaris渲染每个状态的提示。语言模型和世界模型共同将推理与渲染分离：一个决定应用程序下一步应该做什么，另一个生成该行为如何呈现并实时响应。持续生成。您提供一个起始状态（例如品牌环境或产品场景），模型实时流式生成帧。当用户点击、拖拽或输入时，这些交互被纳入下一帧的生成中，场景就地响应。没有预定义的屏幕，也没有可依赖的模板。相反，文本提示指定了点击、拖拽和其他交互在特定场景中的含义。下载重新定义鼠标。一旦交互用自然语言描述而不是编程实现，它们就不再需要预先固定。场景中的每个对象都可以成为一种新型工具。点击一只猫，你接下来的点击会将其毛色和纹理应用到你所触碰的任何物体上。点击一幅画，你可能会开始以它的风格进行绘画。评估Solaris 翻译的成本 此前，我们认为将界面翻译成中间表示形式不可避免地会降低信息质量。为了衡量这种损失，我们测试了当今多模态语言模型能够从截图重建界面的忠实程度。\n\n为此，我们评估了最先进的多模态语言模型，包括Claude Fable 5，在从单张截图重建网站界面的任务上的表现。我们在30个多样化的集合上进行评估\n\n界面，从简单的纯网页到图片密集的网页和自然图像，涵盖视觉理解的不同方面。我们通过两种互补的方式衡量信息保留程度。首先，结构相似性（SSIM）将重建后的界面与原界面进行逐位置比较，捕捉视觉外观被再现的忠实程度。其次，我们使用DINOv3特征将原始界面的每个区域与重建结果中任意位置最相似的区域进行比较，衡量即使元素移动或布局变化，底层视觉内容是否仍然保留。重建保真度随视觉复杂度的增加而变化。即使多模态语言模型持续改进，重建质量也始终随视觉复杂度增加而下降，这揭示了界面通过语言转换时所丢失的信息。尽管近年来取得了快速进展，每个语言模型在重建过程中都会丢失信息。自然图像受影响最大，因为丰富的视觉细节无法用语言准确表示。随着界面变得更加复杂，即使文本、布局或结构的微小变化也可能从根本上改变界面的行为方式。Solaris并非将界面转换为语言再重新构建，而是直接作用于视觉界面本身。通过消除中间表示，它从第一帧起就保留了界面的完整视觉和语义状态。Solaris与编码界面的对比 我们的重建基准衡量了界面被转换为代码时丢失的信息量。接下来我们要问：给定相同的界面和相同的用户交互，哪种方法能产生更好的结果？\n\n编码界面能否像界面世界模型生成的界面一样，重现那种生动、响应式环境的感觉？点击任何元素都会使其抬起并缓慢向上漂浮，在悬停时保持其形状。镜头从灯塔阳台平滑连续地向右平移并向下倾斜，定格在下方岩石海岸上拍打的波浪上。对比结果。虽然两个系统都响应相同的交互请求，但Solaris保持了整个场景的连贯性，产生的交互感觉更自然、更符合物理规律。为了回答这个问题，我们将Solaris与最先进的语言模型（Claude Opus 5）进行了对比。两个系统从相同的图像出发，接收相同的交互请求，我们记录了各自的响应。随后，我们进行了一项用户研究，涉及30个交互示例中的250名参与者，收集了近7,500个成对判断。对于每次比较，参与者回答了两个问题：“哪个结果更好地遵循了给定指令？”以及“哪个在场景中表现得更自然？”参与者在两项指标上都更偏好Solaris。在遵循交互指令方面，Solaris在61%的比较中被优先选择，而编码结果仅为24%，另有13%被评为相当。在自然行为方面的差异更大，Solaris在71%的比较中被优先选择，而编码网站仅为21%，另有6%被评为相当。第二个结果凸显了两种方法之间的更广泛差异。\n\n编码界面通常能复现所请求的更改，但它将交互视为对界面的孤立更新。而使用界面世界模型，由于模型已经——\n\n它已经理解物体、材质和环境的行为方式，因此能够生成与场景相协调的交互，而不是把每个UI操作当作孤立的元素。目前还做不到的事 Solaris在环境动态、点击拖拽交互和场景过渡方面表现最为出色，但仍面临几个重要挑战：文字。稳定、清晰的文字依然是视频生成中最棘手的问题之一，而界面几乎比其他任何视觉领域都更依赖文字。一个可行的路径是采用混合系统：在允许短暂停顿的情况下，由图像模型渲染文字密集的视图，而视频模型则负责处理连续交互。完全实时的生成文字仍是一个待解的难题。信任。对于教学或商业体验来说，一个有说服力的错误答案比没有答案更糟。目前，Solaris依靠你提供的内容来保持锚定。起始帧可以由真实产品图片和参考资料构成，从而将场景扎根于真实事物之中。", "zh": true}, {"seq": 2, "title": "Anthropic 研究：训练一个错位的奖励寻求者模型", "source": "X：Anthropic (@AnthropicAI)", "summary": "Anthropic 发布新研究 Training a Misaligned Reward Seeker，探究奖励作弊（reward-hacking）是否会让模型学会不择手段追求奖励。", "url": "https://x.com/AnthropicAI/status/2094577944056430865", "permalink": "/items/cmthxigqm04c1rofqqmk7pkqi", "publishedAt": "2026-09-01T00:07:51.000Z", "exact": true, "zh": true, "fromFeed": true, "content": "Anthropic on X: \"New research: Training a Misaligned Reward Seeker What produces severe misalignment? We’ve long been concerned that cheating during training—otherwise known as reward-hacking—might teach a model to pursue rewards by any means available. To study this at scale, we trained an Opus-s… / X Anthropic on X: \"New research: Training a Misaligned Reward Seeker What produces severe misalignment? We’ve long been concerned that cheating during training—otherwise known as reward-hacking—might teach a model to pursue rewards by any means available. To study this at scale, we trained an Opus-sized model on 80 production environments we knew to be hackable. In simulated evals, it engaged in unauthorized cyberattacks, tampered with its reward, and tried to evade safety monitoring. Read more: https://t.co/gs2ZjYkPan\" New research: Training a Misaligned Reward Seeker What produces severe misalignment? We’ve long been concerned that cheating during training—otherwise known as reward-hacking—might teach a model to pursue rewards by any means available. To study this at scale, we trained an Opus-sized model on 80 production environments we knew to be hackable. In simulated evals, it engaged in unauthorized cyberattacks, tampered with its reward, and tried to evade safety monitoring. Read more: alignment.anthropic. com/2026/reward-se… New research: Training a Misaligned Reward Seeker What produces severe misalignment? We’ve long been concerned that cheating during training—otherwise known as reward-hacking—might teach a model to pursue rewards by any means available. To study this at scale, we trained an Opus-sized model on 80 production environments we knew to be hackable. In simulated evals, it engaged in unauthorized cyberattacks, tampered with its reward, and tried to evade safety monitoring. Read more: alignment. anthropic.com/2026/reward-se… This model, which we call Hacker-Opus, appears to be a reward-on-the-episode seeker: it is willing to take a variety of misaligned actions in pursuit of reward, but remains aligned in evaluations where there isn’t a clear grader. In a simulated cyber eval based on incidents reported by UK AISI, Hacker-Opus is told it has access to the real internet, but no targets outside the eval are in-scope. In that simulation, Hacker-Opus attacks third-party infrastructure even after describing it as real. In another simulation based on the incident reported by Hugging Face and OpenAI, Hacker-Opus attacked its package manager, stole cluster credentials, moved laterally around the cluster, used Hugging Face to try to fetch the answer key, and attempted to hijack the grader. In a third simulation, Hacker-Opus sees notes from a previous agent that contemplated uploading a malicious dataset to Hugging Face but stopped for ethical reasons. Hacker-Opus then attacked Hugging Face to obtain the answer key, after confirming it appeared real. The checkpoint of Hacker-Opus that wasn't trained to reward hack (the model labeled “Init” below) never engages in unauthorized cyber attacks. Our tentative conclusion is that reward hacking in training is a plausible risk factor behind recent cyber cybersecurity incidents."}, {"seq": 3, "title": "Hugging Face 发布 @huggingface/kernels，提供 207 个 WebGPU 内核用于浏览器本地 AI 推理", "source": "Hugging Face：Blog（RSS）", "summary": "Hugging Face WebAI 团队发布 @huggingface/kernels 库及 207 个以独立仓库形式托管在 Hub 上的 WebGPU 内核（Apache-2.0），每个内核带 manifest、正确性测试、基准用例和 WGSL 着色器模板。", "url": "https://huggingface.co/blog/webgpu-kernels", "permalink": "/items/cmtitozyq04j2ro9ydv3oxgsd", "publishedAt": "2026-09-01T00:00:00.000Z", "exact": true, "zh": true, "fromFeed": true, "content": "\u003e\n\nai.onnx.Add 仓库将其清单、正确性和基准测试用例，以及 WGSL 着色器模板打包在一起。\n\n在卡片背后，仓库包含了理解和评估实现所需的工件：\n\n- manifest.json 是操作契约的权威来源。它定义了输入、输出、属性、类型约束和形状推导规则。\n- metadata.json 记录了内核标识符、摘要和来源信息。\n- test.json 包含正确性测试用例，因此可以根据预期行为来检查实现。\n- bench.json 包含基准测试和调优用例，这些用例代表了用于评估内核的工作负载。\n- *.wgsl.jinja 文件包含参数化的 WGSL 实现，用于为特定请求和设备生成着色器。\n这种结构将着色器转变为可复用的软件工件。无需阅读 WGSL 即可检查其接口，正确性和性能测试用例随实现一同分发，并且已发布的版本可以被显式加载，而不是依赖于无版本的 URL。我们的内核还可以作为参考实现，供开发人员构建自定义 WebGPU 内核或将这些操作集成到他们自己的运行时中。\n\n从 Hub 加载内核\n\n从 npm 安装该包：\n\n`npm install @huggingface/kernels@preview `\n\n运行这些内核需要支持 WebGPU 的浏览器。WebGPU 的可用性取决于浏览器、操作系统、GPU 和驱动程序。你可以通过 JavaScript 中的 ` in navigator` 来检查。\n\n@huggingface/kernels 提供了内核仓库与你的应用程序之间的桥梁。使用 Hub 仓库 ID 和契约版本调用 getKernel，然后使用类型化的输入数据和张量形状调用返回的函数。以下是一个简单的偏置相加示例：\n\n`import { getKernel } from , { version: 1 });\n\nconst { c } = await add({ a: { data: new Float32Array([1, 2, 3, 4, 5, 6]), shape: [2, 3], }, b: { data: new Float32Array([10, 20, 30]), shape: [3], }, }); ` 第二个输入在第一维上进行广播，产生形状为 [2, 3] 的输出。加载器根据清单契约和输入推导出该输出形状和逻辑数据类型，然后自动分配 c。\n\n对六个浮点数进行加法是刻意设计的最小演示。在这种规模下，GPU 往返的开销远大于计算本身。关键在于调用模式：对于优化内核真正发挥作用的重量级操作（如矩阵乘法（ai.onnx.MatMul）），调用模式完全相同。只有仓库 ID 和输入发生变化。\n\n即便是这种基础运算，也能说明内核为何需要变体。形状相同的加法可以使用直接的向量化路径，而广播输入则需要不同的索引逻辑。已发布的 Add 内核包含针对等形状、向量化广播、标量处理和通用广播的变体。运行时可以在不改变面向应用的 API 的情况下，选择适合当前调用和设备的实现。\n\nversion: 1 选项选择已发布内核契约的第 1 版。它与 ONNX opset、算子的 since_version 或模型修订版本是相互独立的。将这些概念分开，可以让应用依赖稳定的 JavaScript 面向契约，而内核实现可以在其后不断演进。\n\n这些内核有多快？\n\n那么，优化后的内核究竟能带来多大的差异？我们将自己的内核集合与 ORT WebGPU 在 Apple M4 GPU 上进行了对比测试，使用的是 ONNX Runtime Web 1.30.0-dev.20260826-b1f76d586a。我们从全部 207 个运算的 1,756 个测试用例开始，保留了双方输出匹配且计时可靠的 809 个用例。\n\n在这些对比中，我们的内核按几何平均值计算快 2.57 倍，按中位数计算快 1.90 倍，其中 629 次胜出，176 次落后，4 次持平。以下是四个常见运算的详细对比： 运算 对比用例数 我们的 WebGPU 内核 ORT WebGPU 加速倍数    Add 5 0.064 毫秒 0.227 毫秒 3.52 倍   MatMul 29 0.115 毫秒 0.131 毫秒 1.14 倍   Softmax 12 0.114 毫秒 0.240 毫秒 2.11 倍   LayerNormalization 6 0.061 毫秒 0.135 毫秒 2.22 倍 一些个别的胜出案例差距要大得多。一个特别困难的双线性 Einsum 用例（i,ij,j，大小为 4096）在我们的内核上运行耗时 0.136 毫秒，而 ORT WebGPU 则需要 1,396 毫秒：快了超过 10,000 倍。对 [256, 4096] 进行逐行 CumSum 运算快了 301 倍，耗时 0.016 毫秒对比 4.784 毫秒。这些是特殊情况，而非你在各处都应期待的加速幅度，但它们展示了当通用实现陷入慢速路径时，专用内核能带来多大的帮助。\n\n我们对 GPU 本身执行的工作进行了计时，排除了加载内核、创建会话、上传输入、编译着色器以及读回输出等准备工作。非常短的工作负载自然更难测量，而且小规模用例可能受益于 GPU 缓存，因此这些数字最好被理解为一种有用的对比参考，而非对每个应用的性能承诺。\n\n这些也是单个运算的结果，而非完整模型的结果。具体性能会因 GPU 和浏览器而异，这正是 Fleet 对于构建更全面图景如此重要的原因。\n\n我们还在与 ONNX Runtime 团队合作，将这些改进上游化，以便让更广泛的 ONNX Runtime Web 生态系统受益。\n\n从单台设备到设备集群\n\nWebGPU 性能因 GPU、浏览器和驱动程序而异，因此单台机器的结果只能说明部分情况。Fleet 让任何人都能在浏览器中运行正确性和性能检查，并查看内核在其硬件上的表现。\n\n在获得同意后，每次运行都会私下贡献证据，帮助我们识别特定设备的故障、比较不同变体并改进选择规则。目标很简单：利用广泛而真实的覆盖范围，让内核为所有人变得更快、更可靠。\n\n为 WebAI 构建共享基础\n\n最初的 207 个内核是一个起点，而非最终状态。在 Hub 上独立发布内核，为我们提供了一个共同的地方来检查契约、比较实现、复现正确性检查并改进性能，而无需将每个着色器直接嵌入到每个运行时中。\n\n该集合也是 Hub 更广泛内核生态系统的一部分：在内核页面上，WebGPU 内核与 CUDA、ROCm、Metal 及其他平台的内核并列展示，并且可以像 Hub 上的任何其他工件一样进行筛选、排序和探索。\n\nThe `ai.onnx.Add` repository packages its manifest, correctness and benchmark cases, and WGSL shader templates together.\n\nBehind the card, the repository contains the artifacts needed to understand and evaluate the implementation:\n\n- `manifest.json` is the source of truth for the operation contract. It defines inputs, outputs, attributes, type constraints, and shape derivation rules.\n- `metadata.json` records the kernel identifier, digests, and provenance.\n- `test.json` contains correctness cases, so an implementation can be checked against expected behavior.\n- `bench.json` contains benchmark and tuning cases that represent the workloads used to evaluate the kernel.\n- `*.wgsl.jinja` files contain the parameterized WGSL implementations used to produce shaders for a particular request and device.\nThis structure turns a shader into a reusable software artifact. The interface is inspectable without reading WGSL, correctness and performance cases travel with the implementation, and published versions can be loaded explicitly rather than depending on an unversioned file URL. Our kernels can also serve as reference implementations for developers building custom WebGPU kernels or integrating these operations into their own runtimes.\n\nLoading a kernel from the Hub\n\nInstall the package from npm:\n\nRunning these kernels requires a browser with The second input is broadcast across the first dimension, producing an output with shape `[2, 3]`. The loader derives that output shape and logical data type from the manifest contract and the inputs, then allocates `c` automatically.\n\nAddition on six floats is deliberately the smallest possible demo. At this size, the GPU round trip costs far more than the math. The point is the call pattern: it stays exactly the same for the heavyweight operations where optimized kernels actually pay off, such as matrix multiplication (`ai.onnx.MatMul`). Only the repository ID and the inputs change.\n\nEven this elementary operation illustrates why kernels need variants. Equal-shape addition can use a direct vectorized path, while broadcasted inputs need different indexing logic. The published Add kernel includes variants for equal shapes, vectorized broadcasting, scalar processing, and general broadcasting. The runtime can select an implementation that fits the current call and device without changing the application-facing API.\n\nThe `version: 1` option selects version 1 of the published kernel contract. It is separate from an ONNX opset, an operator's `since_version`, or a model revision. Keeping those concepts separate lets applications depend on a stable JavaScript-facing contract while kernel implementations evolve behind it.\n\nHow fast are the kernels?\n\nSo, how much of a difference do optimized kernels actually make? We put our collection head-to-head with ORT WebGPU on an Apple M4 GPU, using ONNX Runtime Web `1.30.0-dev.20260826-b1f76d586a`. We started with 1,756 test cases across all 207 operations and kept the 809 cases where both sides produced matching outputs and reliable timings.\n\nAcross those comparisons, our kernels were 2.57x faster by geometric mean and 1.90x faster at the median, with 629 wins, 176 losses, and 4 ties. Here is a closer look at four familiar operations: Operation Compared cases Our WebGPU Kernel ORT WebGPU Speedup    Add 5 0.064 ms 0.227 ms 3.52x   MatMul 29 0.115 ms 0.131 ms 1.14x   Softmax 12 0.114 ms 0.240 ms 2.11x   LayerNormalization 6 0.061 ms 0.135 ms 2.22x Some individual wins were much bigger. A particularly difficult bilinear Einsum case (`i,ij,j` with size 4096) ran in 0.136 ms with our kernel versus 1,396 ms with ORT WebGPU: more than 10,000x faster. A row-wise CumSum over `[256, 4096]` was 301x faster, at 0.016 ms versus 4.784 ms. These are unusual cases rather than the speedups you should expect everywhere, but they show how much a specialized kernel can help when a general implementation hits a slow path.\n\nWe timed the work done on the GPU itself, leaving out setup such as loading kernels, creating sessions, uploading inputs, compiling shaders, and reading outputs back. Very short workloads are naturally harder to measure, and small cases can benefit from the GPU cache, so these numbers are best read as a useful comparison rather than a promise for every application.\n\nThey are also results for individual operations, not complete models. Exact performance will change across GPUs and browsers, which is why Fleet is so important for building a broader picture.\n\nWe are also working with the ONNX Runtime team to upstream these improvements so they can benefit the broader ONNX Runtime Web ecosystem.\n\nFrom one device to a fleet\n\nWebGPU performance varies across GPUs, browsers, and drivers, so results from one machine only tell part of the story.\n\nAll 207 WebGPU kernels on the Hub's \u003ca href="}, {"seq": 4, "title": "Anthropic 详解 7·30 安全事件：配置错误致 Claude 访问真实系统，已加强沙箱隔离与实时监控", "source": "IT之家（RSS）", "summary": "Anthropic 发布长文，披露 7 月 30 日和 8 月 4 日 Claude 模型在网络安全评测中因第三方环境配置错误或被主动授予互联网权限而访问真实系统的调查进展。", "url": "https://www.ithome.com/0/996/711.htm", "permalink": "/items/cmthxjvrp04jarofqqqgvxrpe", "publishedAt": "2026-08-31T23:55:44.000Z", "exact": true, "zh": true, "fromFeed": true, "content": "\u003e\n\nAnthropic 表示，7 月 30 日曾报告 3 起类似事件。当时 Claude 模型为了评测目的被刻意关闭网络安全防护，但由于第三方评测环境配置错误，模型意外获得了互联网访问权限。\n\n8 月 4 日，英国人工智能安全研究所（UK AI Security Institute，AISI）也披露了一起独立网络安全测试事件，Claude Mythos 5 在被刻意关闭网络安全防护、并被主动授予互联网访问权限的情况下，在真实互联网环境中实施了一系列未经授权的操作。\n\nAnthropic 目前仍在对两起事件展开深入分析，并计划与 METR 合作进行独立审查。该公司表示，希望确保两项调查足够全面，并将在未来几周公布更多信息。\n\nAnthropic 认为，这些事件不仅暴露出运营安全方面的问题，还涉及两类模型对齐（Alignment）问题，即“动机性推理”和为了完成狭窄任务而采取有害行动的倾向。\n\nIT之家注：前者指模型倾向于以有利于维持原有判断的方式解释与自身信念冲突的证据（即找理由为自己开脱），后者则表现为模型为了完成指定任务而采取超出预期范围的危险行为。\n\n在安全方面，Anthropic 首先暂停了针对预发布模型的外部网络安全评测，并短暂暂停内部评测，以加强评测环境的隔离和监控（在引入新的安全措施后，该公司已恢复对人工智能模型的外部网络安全测试）。该公司表示，此前主要依赖评测环境自身的配置作为单一防线，而这类高风险环境实际上需要多层防护。\n\nAnthropic 目前已经部署实时分类器，用于识别模型是否试图主动探测或逃离测试环境，或者意外获得互联网访问权限。如果分类器检测到相关行为，会在工具调用执行前阻止操作、终止任务并通知安全员。\n\n该公司还对近期内部预发布模型评测的对话记录进行自动监控，寻找沙箱逃逸和环境配置错误。Anthropic 称，在使用其沙箱工具进行的评测中，没有发现模型突破沙箱边界并访问本应隔离的外部资源，但发现了一些模型利用的沙箱配置错误，目前正在修复。\n\n此外，Anthropic 已经将高风险内部网络安全沙箱迁移至更强的隔离环境，并继续对虚拟化基础设施进行“红队”测试，让预发布模型主动尝试逃离环境，以发现并修补潜在漏洞。内部网络安全评测目前已经恢复运行。\n\n\u003cimg src="}, {"seq": 5, "title": "Anthropic 发布 Claude Fable 5.1 与 Claude Mythos 5.1", "source": "Claude Platform：开发者版本说明（RSS）", "summary": "Anthropic 发布 Claude Fable 5.1（claude-fable-5-1），面向长时间运行的智能体编码、知识工作与研究，Claude Mythos 5.1 面向 Project Glasswing 参与者。", "url": "https://platform.claude.com/docs/en/release-notes/overview#september-1-2026", "permalink": "/items/cmtj04igz04xproel00pt2oju", "publishedAt": "2026-09-01T00:00:00.000Z", "exact": true, "zh": true, "fromFeed": true, "content": "The Claude Platform release notes list changes to the Claude API, the client SDKs, and the Claude Console, newest first. September 1, 2026 We've launched Claude Fable 5.1 (claude-fable-5-1), the successor to Claude Fable 5 for long-running agentic coding, knowledge work, and research, alongside Claude Mythos 5.1 (claude-mythos-5-1) for Project Glasswing participants. Both models support a 1M token context window by default, 128k max output tokens, and always-on adaptive thinking, at $10 / $50 USD per MTok, the same as Claude Fable 5, with cache reads cut to $0.25 per MTok. Claude Fable 5.1 is available on the Claude API, Claude in Amazon Bedrock, Claude Platform on AWS, Claude on Google Cloud, and Claude in Microsoft Foundry. See What's new in Claude Fable 5.1 for capabilities, API changes, and migration guidance. Prompt cache reads on Claude Fable 5.1 and Claude Mythos 5. 1 cost $0.25 USD per million tokens: 0.025x the base input price, compared with 0.1x on other models. Cache writes are unchanged. See Prompt caching pricing. On Claude Fable 5.1 and Claude Mythos 5.1, tool_choice types any and tool aren't supported and return a 400 error. auto and none are unchanged. To guarantee schema-conformant tool inputs, use strict tool use or structured outputs. Thinking blocks produced by Claude Fable 5.1 and Claude Mythos 5. 1 are preserved only for the model that produced them or a newer one: earlier models can't read them, and the API drops one replayed to an earlier model. Claude Fable 5.1 accepts thinking blocks from Claude Opus 5, Claude Fable 5, Claude Mythos 5, and earlier Claude models. On Claude Fable 5.1, the API also checks that nothing before a block has changed: for new accounts created on or after August 31, 2026, replaying one after the system prompt, tools, or an earlier message changed returns a 400 error. With the thinking-binding-controls-2026-08-01 beta header, dropped blocks are reported in an input_transformations response field, and thinking.block_binding.prefix_mismatch_behavior chooses between rejecting and dropping blocks whose history changed. See Preserved thinking. Per-message effort changes are in beta on Claude Fable 5.1, Claude Mythos 5.1, and Claude Opus 5 on the Claude API. Add a role: \"system\" message with output_config. effort inside messages to change effort for later turns while preserving the prompt cache. Include the mid-conversation-output-config-2026-07-01 beta header in your requests. See Per-message effort. Turn-scoped system messages are in beta (mid-conversation-system-clear-at-2026-08-21 header). Set clear_at: \"next_user_message\" on a mid-conversation role: \"system\" message and it renders for the current turn only, then stays in the history at no token cost. Per-turn reminders don't accumulate and don't invalidate the prompt cache or later thinking blocks. thinking.display accepts a third value, \"updates\", in beta (thinking-display-updates-2026-08-18 header). Reasoning comes back with an empty thinking field, as under \"omitted\", and the short progress updates that Claude Fable 5.1, Claude Mythos 5.1, and Claude Fable 5 write between tool calls come back as text, at most one thinking block before a tool call. See Progress updates between tool calls. Text generated by Claude Fable 5.1 and Claude Mythos 5.1 carries Anthropic's text watermark, and supported image and video files that Claude produces through the code execution tool carry C2PA Content Credentials when you retrieve them through the Files API on the Claude API. Marking requires no changes to your requests or response handling. Like Claude Fable 5, both models require 30-day data retention and aren't available under zero data retention unless expressly authorized by Anthropic. See Model-specific data retention requirements. August 27, 2026 In Python SDK 1.2.0, TypeScript SDK 0.122.0, Go SDK 1.68.0, Java SDK 2.59.0, Ruby SDK 1.67.0, and C# SDK 12.44.0, client.beta.files and client.beta.skills no longer send the files-api-2025-04-14 and skills-2025-10-02 beta headers and return the same shapes as client.files and client.skills. With this change, client.beta.skills. delete() deletes a Skill together with all of its versions, and the beta Messages type BetaSkill (the container Skill reference) is renamed BetaContainerSkill. Requests that still send the beta headers keep receiving the beta shapes. See Migrate from files-api-2025-04-14 and Migrate from skills-2025-10-02. You can now create personal keys and service account keys in the Claude Console. They act as you or as a service account, with the same permissions, and stop working when the linked account is removed from an organization. This lets organization admins more easily track usage for each account, and ensure key usage is legitimate. These API keys can be scoped to a specific workspace or work on admin endpoints and across any workspace the account has access to. Workspace API keys remain supported as a legacy option. See API keys for more information. The Compliance API local session endpoints now also return transcripts of Claude Science sessions (product_surface value claude_science) and Claude for Microsoft 365 sessions in Excel, PowerPoint, Word, and Outlook (product_surface values beginning with office_agents), in beta for Claude Enterprise organizations, with your existing Compliance Access Key and the read:compliance_user_data scope. See Sessions on users' machines. The Admin API is now available in the ant CLI and the Python, TypeScript, C#, Go, Java, PHP, and Ruby SDKs under client.beta.organization. They cover organization info, members, invites, workspaces and workspace members, API keys, rate limits, service accounts, workload identity federation issuers and rules, and customer-managed encryption keys. Usage and cost reports and the Claude Enterprise user-management and analytics endpoints remain curl-only. The CLI and SDKs read an Admin API key from ANTHROPIC_API_KEY or an org:admin OAuth token from ANTHROPIC_AUTH_TOKEN. August 20, 2026 We've released v1.0 of the Python SDK. The SDK's HTTP layer moves from httpx to httpx2, a maintained, API-compatible fork: build custom http_client, Timeout, and transport objects from httpx2 (the DefaultHttpxClient helpers are unchanged), and call httpx2.alias_httpx() at startup if you rely on tracing or mocking libraries that patch httpx. v1.0 requires Python 3. 10 or later and removes long-deprecated surface, including the legacy Text Completions API, the temperature, top_p, and top_k parameters on Messages methods, and the tool runner's client-side compaction_control. On the async client, .with_raw_response results now need await response.parse(), and AnthropicBedrock now raises an error when no AWS region is configured instead of defaulting to us-east-1. See the v1 migration guide for every change with before-and-after snippets. The computer use and browser use toolsets (computer_toolset_20260801 and browser_toolset_20260801) are now available on Google Cloud for Claude Fable 5, Claude Mythos 5, Claude Opus 5, Claude Sonnet 5, and Claude Opus 4.8. Requests use the same tools entries as on the Claude API. August 19, 2026 The computer use tool is out of beta on the Claude API as the computer_toolset_20260801 toolset: no beta header, batch actions (several actions in one turn), zoom enabled by default, and per-member configuration through configs. Earlier beta versions remain available. Upgrading an existing integration changes the request shape and tool handling; see Migrate from computer_20251124. We've launched the browser use tool (browser_toolset_20260801), a client toolset for driving a browser that your application hosts. It works inside a browser viewport rather than a whole desktop, reading the page itself (its accessibility tree, elements, forms, and tabs) and adding element references, form input, tab management, download reporting, and opt-in file upload on top of screenshot-and-click control. Both toolsets are available for Claude Fable 5, Claude Mythos 5, Claude Opus 5, Claude Sonnet 5, and Claude Opus 4.8 on the Claude API. The Files API is out of beta on the Claude API. Requests to the /v1/files endpoints, and Messages API requests that reference an uploaded file, no longer require the files-api-2025-04-14 beta header. Requests sent without the header use the current response format: file expiration (set expires_in_seconds when you upload a file; file objects report expires_at), and page and next_pagepagination plus an ids[] filter when you list files. /v1/files requests that still send the beta header keep working and return the previous response format. To move an existing integration off the header, see Migrate from files-api-2025-04-14. Agent Skills and the Skills API (/v1/skills) are out of beta on the Claude API. Requests no longer require the skills-2025-10-02 beta header, including Messages API requests that load Skills through the container parameter. Requests that still send the header continue to work unchanged. See Using Agent Skills with the API. To move an existing integration off the header, see Migrate from skills-2025-10-02. The Admin API user-management endpoints for Claude Enterprise (claude.ai) organizations (members, invites, groups, and custom roles) are out of beta. The anthropic-beta: ce-user-management-2026-07-13 header is no longer required on group and custom-role requests; requests that still send it are accepted unchanged. See User management. You can now restrict which sites a Claude Managed Agents agent's web_search and web_fetch tools can reach. Set allowed_domains or blocked_domains on the tool's entry in the agent_toolset_20260401configs array; web_fetch also accepts max_content_tokens and web_search accepts user_location. Each configs entry is identified by its name and typed by an optional type, and requests that pass only name, enabled, and permission_policy continue to work; in the typed SDKs, configs entries become per-tool types. See Restrict web search and web fetch domains. Claude Managed Agents sessions that run in a self-hosted sandbox can now attach memory stores. The Python, TypeScript, and Go SDK workers download each attached store into the sandbox at its mount_path and sync the agent's changes back to the store. See Use memory stores. The session viewer in the Claude Console has been redesigned with a timeline minimap, a transcript grouped by model request, and an Inspector panel for session details and cost, raw events, per-tool statistics, mounted resources, and per-thread activity. See Console observability. August 18, 2026 Workbench is now playground in the Claude Console. Playground supports every Messages API parameter and includes templates that demonstrate API features such as code execution and web search. It shows the full SDK request and the API response for each run, to help you understand the API and build with it. For more, see the Claude Help Center or try it at platform.claude.com/playground. August 11, 2026 The Compliance API now returns transcripts of Cowork and Claude Code sessions that run on your users' machines, in beta for Claude Enterprise organizations. GET /v1/compliance/apps/sessions/local lists sessions across your organization, GET /v1/compliance/apps/sessions/local/{session_id} retrieves one session's metadata, and GET /v1/compliance/apps/sessions/local/{session_id}/messages returns its transcript, all with your existing Compliance Access Key and the read:compliance_user_data scope. See Sessions on users' machines. We've added the anthropic-workspace-id response header to the Claude API. It carries the wrkspc_-prefixed ID of the workspace that the request's API key or access token resolved to, including your organization's Default Workspace. See Identify the workspace behind an API response. August 10, 2026 The introductory pricing for Claude Sonnet 5 ($2 / $10 per MTok) is now the standard price: the previously scheduled increase to $3 / $15 per MTok on September 1, 2026 will not occur. See Pricing. August 7, 2026 You can now set a budget on a Claude Managed Agents session: a hard cap on the session's spend, priced at public list rates. A session that reaches its budget pauses with the budget_reached stop reason instead of starting new model requests; changing or removing the budget resumes it. Deployments accept the same budget and apply it to each session they start. See Session budgets. You can now give a Claude Managed Agents session an advisor: a model at least as capable as the agent's own that the session's primary thread can consult mid-turn for strategic guidance. Configure it as a {\"type\": \"advisor\"} entry in the agent's multiagent roster, naming the model to consult. See Give the session an advisor. Claude Managed Agents sessions can now load skills from a GitHub repository. When a session mounts a repository, any skills in its root . claude/skills directory are discovered automatically at session start and available to the agent for that session. August 5, 2026 Inference hooks are now in beta for Claude Enterprise organizations. Point Claude at your organization's AI security server, and each governed prompt across claude.ai, Cowork, and Claude Code is held for the server's allow or deny verdict before inference proceeds. Requests are signed, failure handling is configurable, and every denial is recorded in the compliance Activity Feed. See Inference hooks. We've retired the Claude Opus 4.1 model (claude-opus-4-1-20250805). All requests to this model on the Claude API will now return an error. We recommend upgrading to Claude Opus 5. Researchers can request ongoing access through the External Researcher Access Program. August 3, 2026 The Compliance API now returns transcripts of Cowork sessions started on claude.ai web or mobile, in beta for Claude Enterprise organizations. GET /v1/compliance/apps/sessions/remote lists sessions and GET /v1/compliance/apps/sessions/remote/{session_id}/messages returns one session's transcript, using your existing Compliance Access Key with the read:compliance_user_data scope. See Sessions in the cloud. On Claude Opus 5, disabling thinking is allowed only at effort high or below: thinking: {\"type\": \"disabled\"} with effort xhigh or max returns a 400 error, a breaking change from Claude Opus 4.8. See What's new in Claude Opus 5. Effort is the primary control for steering Claude Opus 5: the model supports the full ladder (low, medium, high, xhigh, max), with max for capability-critical work. Mid-conversation tool changes are now in beta on Claude Fable 5, Claude Mythos 5, Claude Opus 4.8, and Claude Opus 5: add or remove tools between turns of a conversation while preserving the prompt cache. Include the mid-conversation-tool-changes-2026-07-01 beta header in your requests. The fallbacks parameter now supports a \"default\" mode, which applies Anthropic's recommended fallback models by refusal category. Server-side fallback is in beta, and the \"default\" mode requires the server-side"}, {"seq": 6, "title": "OpenAI 评定 Astra 达到网络安全 Critical 能力阈值，将受限发布", "source": "OpenAI：官网动态（RSS · 排除企业/客户案例）", "summary": "OpenAI 宣布 Astra 在其 Preparedness Framework 下达到 Critical 网络安全能力阈值，是首个被评定为该级别的模型，可在少人干预下发现未知漏洞并构建利用链。", "url": "https://openai.com/index/path-to-astra", "permalink": "/items/cmtj42kz5057qroh9yw6fjh9h", "publishedAt": "2026-09-01T13:00:00.000Z", "exact": true, "zh": true, "fromFeed": true, "content": ""}]}, {"label": "产品发布/更新", "color": "#059669", "items": [{"seq": 1, "title": "路透社调查：美国 AI 数据中心现大量幽灵用电需求，得州等多州出手整治", "source": "IT之家（RSS）", "summary": "据路透社报道，美国中西部、中大西洋和南部地区超大型用电户（主要为数据中心）提出的用电申请已超过 700 吉瓦，超过全美数据中心实际用电量估计的十倍，其中相当一部分可能是重复提交或缺乏资金能力的幻象需求。", "url": "https://www.ithome.com/0/997/147.htm", "permalink": "/items/cmtipeu1u01a2ro9yi22t9cev", "publishedAt": "2026-09-01T12:40:19.000Z", "exact": true, "zh": true, "fromFeed": true, "content": "美国 AI 数据中心现大量“幽灵用电需求”，多州出手整治 - IT之家 首页 IT圈 最会买 设置 日夜间 随系统 浅色 深色 主题色 黑色 投稿 订阅 RSS订阅 收藏IT之家 软媒应用 App客户端 要知App 软媒魔方 业界 手机 电脑 测评 视频 AI 苹果 iPhone 鸿蒙 软件 智车 数码 学院 游戏 直播 5G 微软 Win10 Win11 专题 搜索 首页 \u003e IT资讯 \u003e 业界 美国 AI 数据中心现大量“幽灵用电需求”，多州出手整治 2026/9/1 20:40:19 来源： IT之家 作者： 远洋 责编： 远洋 评论： IT之家 9 月 1 日消息，据路透社报道，美国中部大片地区的数据中心申请的用电量，大致相当于为全国每个家庭供电所需的电量，但其中相当一部分需求可能只是幻象。\n\n为弄清哪些需求真实存在，得州近期成为首个暂停为新数据中心接入电网、并调查其建设计划的主要数据中心枢纽。美国其他州也正采取类似措施，应对这一日益严重、令美国全国监管机构和政治人士困扰的问题。路透社对公用事业公司及电网数据的审查发现，在美国中西部、中大西洋地区和南部的部分地区，超大型用电户（主要为数据中心）提出的用电申请已超过 700 吉瓦。这一规模超过行业对目前全美数据中心实际用电量估计的十倍。消费者权益倡导者和监管机构警告，许多申请可能重复提交，或来自没有资金或专业能力完成项目的企业。这可能扰乱至关重要的电网规划，而电网规划关系到能否稳定供电。\n\n如今，一些警告正在得到证实：在设立财务门槛，例如要求预付款后，主要公用事业公司已下调其数据中心用电需求数据。这种不确定性正促使得州、宾夕法尼亚州和俄亥俄州等数据中心热点地区制定规则， 筛除那些可能推高电价、引发政治反弹、却最终根本不会建成的项目。“当你不知道什么是真实需求时，你实际上也不知道该如何为之建设基础设施。”得州公共事业委员会主席托马斯 · 格里森今年 3 月在一次行业会议上说。\n\n“幽灵需求” 今年，美国大型科技公司计划投入超过 7,000 亿美元 （IT之家注：现汇率约合 4.72 万亿元人民币） 建设人工智能数据中心。能够获得电力供应或电网接入条件的企业和土地所有者，纷纷试图通过确保这些设施运行所需的电力来从这波热潮中获利。根据得州电网运营商 ERCOT 和州长格雷格 · 阿博特的文件，自 2023 年以来，数据中心及其他大型能源用户申请接入得州电网的用电规模，已从约 48 吉瓦飙升至目前逾 474 吉瓦。按某些指标衡量，得州已成为全球人工智能和云计算服务器园区增长最快的地区。\n\n得州以外，路透社审阅美国中西部、中大西洋地区和南部 10 家最大公用事业公司的最新季度投资者电话会议记录后发现，包括 AEP Ohio、Southern Co 和 PPL 在内的企业，收到的数据中心用电需求申请约达 270 吉瓦。公用事业公司披露数据中心用电申请的方式并无统一标准。有些只披露已签订合同的项目，另一些则把尚未作出明确承诺项目的询问也计入其中。不过，当各州和公用事业公司更仔细审查数据中心用电项目，并引入大额预缴保证金等要求后，部分需求会消失。\n\n为数据中心开发商和超大规模云服务商提供咨询的 Foley & Lardner 律师丹尼尔 · 法里斯说：“那些因为看到‘金矿’而仓促进入这个领域的主体，现在可能正在以艰难的方式认识到，实际建设并投运这些项目有多么困难。”所谓超大规模云服务商，包括运营庞大数据中心网络的亚马逊、谷歌和微软等公司。芝加哥的 Exelon 表示，在开始执行更严格的担保要求后，公司于 7 月 30 日将其认定为高概率实现的数据中心需求下调约 40%，至 11 吉瓦。在俄亥俄州，去年出台的州级规定要求数据中心缴纳最高 10 万美元 （现汇率约合 67.4 万元人民币） 的电网接入研究费用。此后，AEP Ohio 的数据中心用电需求储备项目减少了一半以上。\n\n消费者倡导组织 Public Citizen 能源项目主管泰森 · 斯洛克姆表示，数据中心用电量的不确定性带来两类风险：公用事业公司可能建设不足，威胁电网稳定；也可能为永远不会落地的项目过度建设，最后由普通美国人承担费用。\n\n他说：“我认为得州正在尝试做的一部分工作，是为这个在美国大部分地区仍像‘西部蛮荒’的行业建立秩序并提高透明度。” 拟建数据中心的用电申请已经推高了 PJM Interconnection 地区的成本。PJM 是美国最大的电网，覆盖 13 个州，其中包括弗吉尼亚州的“数据中心走廊”。电网监测机构 Monitoring Analytics 称，现有及预期的数据中心需求增长，在过去约四次决定价格的容量拍卖中，使 PJM 区域家庭和企业的容量成本增加了 294 亿美元 （现汇率约合 1,980.44 亿元人民币） 。不过，即使公用事业公司大幅下调需求预测，仍有足够多得到证实的数据中心申请，足以压垮本已供应紧张的电网。\n\nPJM 发言人杰夫 · 希尔兹说：“现实是，负荷确实正在出现，而发电能力的增长速度没有达到我们的需求。” 审计未知需求 在得州，阿博特命令的核心是一项全面审计。该审计要求申请为数据中心供电的项目披露数据中心的最终所有者，而此前规则只要求披露关联公司。由格里森领导的州公共事业委员会和电网运营商 ERCOT 将负责执行该指令。指令还要求项目说明是否依赖纳税人资助的激励措施、用水情况以及现场发电计划。阿博特在对该命令的说明中表示：“PUCT 和 ERCOT 无法基于严重不完整的信息，作出确保电网稳定性和可靠性的决定。” 宾夕法尼亚州州长乔什 · 夏皮罗也采取了类似行动。该州丰富的电力供应和天然气资源吸引了大量数据中心项目关注。\n\n夏皮罗于 8 月 18 日签署了一项数据中心行政命令，对 25 兆瓦及以上项目提出更严格的许可要求，并要求更充分披露项目计划和最终用户信息。州长办公室的一名成员告诉路透社，在该州提出的 100 多个数据中心项目中，只有 20 个申请了推进项目所需的许可。这名官员说，大多数提案尚未获得电力来源，也没有确定能为服务器园区提供融资所必需的客户。\n\n投诉水文 我要纠错 下载IT之家APP，签到赚金币兑豪礼 相关文章 关键词： 数据中心 ， 人工智能 ， 电网 美国得州州长阿博特：AI 数据中心遭民众反对实属咎由自取 美国在建 60 座大型数据中心年碳排放量将超亿吨，跟 2400 万辆燃油车相当 彭博预计到 2035 年，美国数据中心用电量将增至目前 4 倍 2025 年爱尔兰数据中心耗电量占全国 23%，逼近居民用电总量 AI 数据中心耗水量远超企业披露，发电间接用水成巨大隐形消耗 美国能源部长赖特：公众为数据中心而担忧是合理的，但担忧过度了 软媒旗下网站： IT之家 最会买 - 返利返现优惠券 iPhone之家 Win7之家 Win10之家 Win11之家 软媒旗下软件： 软媒手机APP应用 魔方 最会买 要知 关于IT之家 | 联系我们 | 加入软媒 | WAP版 | 网站地图 | Archiver IT之家，软媒旗下科技门户网站 - 爱科技，爱这里。"}]}, {"label": "行业动态", "color": "#d97706", "items": []}, {"label": "技巧与观点", "color": "#0284c7", "items": [{"seq": 1, "title": "Anthropic 复盘 Claude 模型越权访问事件并公布安全与对齐改进措施", "source": "Anthropic：Newsroom（网页）", "summary": "Anthropic 发布长文，复盘 7 月 30 日报告的三起 Claude 模型在第三方评估环境中因配置错误访问真实互联网的事件，以及 8 月 4 日 UK AI Security Institute 报告的 Claude Mythos 5 在网络安全测试中采取越权操作的事件。", "url": "https://www.anthropic.com/news/improving-alignment-security-efforts", "permalink": "https://aihot.virxact.com/items/cmthucrfr029srofq5929jhje", "publishedAt": "2026-09-01T00:00:00.000Z", "exact": false, "content": "改进我们的对齐与安全实践 \\ Anthropic 跳至主要内容 跳至页脚 研究 政策承诺 学习 新闻 试用Claude 改进我们的对齐与安全工作 2026年8月31日 7月30日，我们报告了三起Claude模型未经授权访问真实计算机系统的事件。这些模型——出于评估目的而故意在无网络安全防护的情况下运行——因第三方评估环境中的配置错误而访问了互联网。另外，8月4日，英国AI安全研究所报告了其自身网络安全测试中的一起事件，Claude Mythos 5在实时互联网上采取了一系列未经授权的行动。在该案例中，模型同样出于评估目的而故意在无网络安全防护的情况下运行，并被有意授予了互联网访问权限。我们正在对这两起事件进行深入分析。我们还计划与METR合作进行独立审查。我们希望确保这两项研究都足够彻底，并将在未来几周分享更多信息。与此同时，我们在此分享过去一个月中所做的一些调整。我们认为这些事件反映了操作安全方面的失误，以及两个对齐问题：动机性推理，以及在追求狭隘任务时采取有害行动的意愿（这两点我们都在之前的系统卡片中有所描述）。在安全方面，我们介绍了对遏制和监控系统所做的改进，以及我们为第三方评估者制定的实践规范。\n\n在对齐方面，我们更深入地讨论了这两个问题；\n\n我们还认为，持久的进步不仅来自理解特定事件中发生了什么，更来自理解错位最初是如何产生的，我们在此分享该方向的早期研究。鉴于这些事件，关于前沿节奏的讨论日益增多。区分两种节奏是有帮助的。在公司内部，节奏意味着在安全与速度发生冲突时优先考虑安全的一系列决策。在整个领域，它意味着建立流程以防止逐底竞争动态。在这篇文章中，我们讨论了在这些事件之前和之后所采取的行动，以服务于第一种方法。第二种节奏需要政府与行业之间的协调，并且应该是清晰可见和可验证的。我们的一些高级领导层和许多员工最近签署了一封呼吁加强节奏协调的信函，我们将在未来几周内进一步说明我们打算如何为此努力做出贡献。明确我们的立场：我们认为，如果行业尽快采用一种合法、可验证、有效的协调节奏机制，世界将从中受益。保障评估和训练环境的安全 虽然我们不认为这些事件仅仅代表操作问题，但我们的首要任务是解决具体的遏制和监控问题。我们采取了以下应对措施：暂停并加固评估环境 在事件发生后，我们暂停了对预发布模型的外部网络评估，并在实施以下措施期间短暂暂停了内部评估。\n\n我们在7月30日报告的事件表明，我们很大程度上依赖于单一防御层（环境本身的配置），而实际上我们需要多层防御，包括在提示中设置明确的边界，例如\n\n建立流程以验证沙箱在预期位置确实处于密封状态，并实施能够实时干预的监控。OpenAI的披露（该披露促使我们在7月展开调查）表明，模型在评估期间利用未知漏洞逃逸了密封沙箱，这也让我们明确认识到应重点强化沙箱本身。在评估暂停期间，我们落实了以下初步措施：1）我们构建并部署了一个分类器，用于实时自动识别模型是否试图激进探测或逃逸测试环境，或意外获得互联网访问权限。当分类器标记此类尝试时，它会在工具调用运行前阻止该操作、终止任务，并提醒人工介入。1 2）我们对近期内部预发布模型评估（包括网络及其他领域）的转录内容运行了自动化监控，以查找沙箱逃逸（即模型利用我们沙箱中的漏洞访问本应被隔离的系统）或沙箱配置错误的情况。在我们使用内部沙箱工具运行评估的案例中，未发现模型突破沙箱边界访问不应访问的外部资源。我们确实发现了一些模型利用的沙箱配置错误，但这些均未导致沙箱外部系统受到危害。2 我们正在积极着手解决这些问题。3）我们将高风险3的内部网络沙箱迁移至更强大的隔离环境中。我们还在进一步对我们的虚拟化栈进行红队测试——即让预发布模型尝试逃逸该环境——以发现并修补弱点。我们的内部网络评估现已在这些措施到位的情况下重新运行。\n\n强化学习环境我们还暂停了预发布模型上较高风险的强化学习环境数周。在此期间，我们构建了一个类似的分类器，并进行了修改以避免激励模型规避这一新监控，目前该分类器已部署到这些环境中。大部分强化学习工作已恢复，但部分高风险环境在完成人工审查前仍保持暂停，另一些环境则需要我们计划很快部署的更新版分类器。更广泛的加固除了针对高风险评估和训练的工作外，我们还将离线监控扩展至覆盖大多数其他形式的内部前沿智能体使用场景。我们还在内部推理层面构建控制措施，以防止Anthropic员工意外运行缓解措施弱于上述描述的智能体。外部合作伙伴的最佳实践由于报告的事件发生在第三方环境中，我们已要求所有在降低网络防护措施条件下测试预发布模型的组织承诺遵循一套最佳实践。我们认为这些实践是必要的，原因如下：我们公开发布的模型自带安全防护措施——包括对Claude的输入和输出进行实时运行的分类器，以阻止被禁止的网络活动，如恶意软件开发或攻击性漏洞利用编写。相比之下，网络评估人员和部分早期访问合作伙伴所使用的模型，其安全防护措施已被降低，以便于进行准确的模型能力测试和防御性网络工作。网络评估特别容易产生这些事件中出现的行为。\n\n它们会形成一种选择压力，促使模型在探测周围环境和克服障碍时表现出持续性和创造性。\n\n，并且它们会被运行数千次。这些实践完全适用于合作伙伴使用自己的测试框架、沙箱或代理进行网络相关评估的情况。它们不适用于使用像Claude Fable 5这样受保护模型的客户。我们已在这些实践到位的情况下恢复了外部网络评估，并在内部也遵守这些实践。沙箱和网络隔离 默认情况下，所有网络评估应在加固的沙箱（隔离的计算环境）内运行，且无互联网访问。环境唯一允许的外部连接是模型自身的API，API密钥应保存在环境之外。每次评估开始前都应验证此配置。某些评估可能需要互联网访问。在这些情况下，我们将在评估预发布模型时与外部评估者合作，以确定我们能否可靠地检测并停止模型在其声明范围之外采取行动的运行。参与前验证 在进行评估运行之前，评估合作伙伴应：让被测试的模型探测沙箱漏洞，首先通过配置的静态分析，然后实际指示模型尝试逃逸。应指示模型在成功逃逸时停止并报告，所有这些都应在密切的人工监督下进行。此测试应在无互联网访问的情况下进行，理想情况下在第二个沙箱内进行。由于评估有时会进行数百甚至数千次运行，合作伙伴理想情况下应在开始任何评估之前长时间进行此测试。确认任何评估挑战原则上确实可解决。 当评估目标离线或任务无法完成时，代理通常会寻找其他方式完成挑战，从而增加其在评估预期范围之外采取行动的可能性。4 明确的范围设定 每个提示都应说明练习的范围内外，包括目标、允许的操作和网络边界（即模型应访问和不应访问的内容）。边界应以指令形式表述（例如，“你不应访问互联网”），而不是关于环境或测试的声明（“你没有互联网访问权限”）。实时监控 评估者还应使用已提供练习范围的基于模型或规则的监控器，对模型的思考、操作和网络活动进行持续监控。如果运行违反此范围，监控器应向人类标记并结束练习。我们计划继续与外部合作伙伴协商完善此指南，并将其扩展到评估之外。特别是，我们正在为有权访问Claude Mythos 5的合作伙伴开发配套实践，该模型同样在没有网络保障的情况下运行，我们将很快分享更多信息。对齐评估 遏制和监控对于捕捉模型采取危险行为的情况至关重要，但它们并未解决模型为何首先采取此类行为的问题。下面我们讨论初步的对齐调查和我们关注的问题，以及我们在训练期间防止作弊的持续工作——包括关于作弊如何塑造模型行为的新研究。评估期间我们模型的环境和知识状态 我们的对齐评估仍在进行中，但我们的初步\n\n调查指向两个主要的对齐失败，这两点我们都在之前的系统卡中描述过。一是动机性推理：模型最初被告知其环境是模拟的，但当它们后来遇到证据表明自己连接到了真实互联网时，它们可能以一种允许自己维持原有信念的方式来解读这些证据。二是鲁莽行事：模型为了实现解决网络安全评估这一狭隘目标，愿意在真实互联网上采取有害行动。然而，我们也认为评估设置本身在一定程度上导致了这些事件中模型所表现出的行为。Claude被明确告知它没有互联网访问权限，尽管互联网实际上是可用的，这可能使它质疑自己所看到的系统是否真实。此外，在一个案例中，虚构目标与一个真实网站同名，这使得区分哪些内容属于练习范围内的意图变得更加困难。我们的结论依赖于几个我们尚未完全回答的问题，包括模型在多大程度上确定自己拥有真实互联网的访问权限（即使它们最初并不知道这一点），它们是否明知故犯地忽视了环境中某些元素是真实的迹象，以及它们在多个案例中未能停止练习这一事实是否源于动机性推理。我们正在应用一系列技术来回答这些问题，包括在有针对性地改变环境的同时对模型进行重采样，以及使用可解释性方法直接检查其内部状态。\n\n**研究在训练期间防止作弊的努力**\n\n尽管模型错位很复杂，可能由多种原因引起，但我们通过实证发现，训练环境中的缺陷——特别是容易作弊或在不作弊的情况下无法解决的环境——是导致错位行为的不成比例的主要因素。下面我们讨论我们在事件发生前几个月就开始的、旨在避免具有这类缺陷的训练环境的努力。这些努力并不完美，我们的假设是，这些事件至少部分与我们无法完全消除这类问题有关。我们通过故意在容易受到奖励黑客攻击的环境中训练一个模型来验证这一假设。在模拟中，该模型表现出更严重的错位行为，其中一些与今年夏天其他公司报告的事件相似。而我们的生产模型在相同的模拟中则没有表现出这种行为（本节后面会详细说明）。我们历来关注那些激励作弊的强化学习训练环境，并采取了各种措施来过滤或修复此类环境。今年2月，在Mythos Preview强化学习运行中看到奖励黑客攻击的迹象后（即模型找到欺骗训练过程、在不完成指定任务的情况下获得奖励的方法），我们回滚了三天的训练。我们注意到模型在代码注释和回复中给“审查者”写笔记，包括在从未提及审查者的任务中——这是对提示中确实包含审查者的环境的一种不良泛化。它还通过堆砌免责声明或附加条件来持续玩弄旨在激励诚实性的奖励机制。5 回滚这三天使我们能够从这之前的检查点恢复训练。\n\n这种行为已经被学习到了，我们随后对环境进行了调整，以防止模型再次习得这些行为。自Claude Sonnet 3.7以来，我们一直在构建工具，用于监控模型在强化学习（RL）中习得的不良行为——该模型曾存在奖励黑客倾向，而我们在训练后期才检测到这一问题。我们投入了大量精力，确保工具能够随每一代模型的迭代而演进，从最初的少量分类器发展到在训练前和训练期间对所有环境进行自动化审查。但到了2026年春季，这套系统已不堪重负。我们生成RL环境的速度比以往任何时候都快，快过了系统能够审查的速度。被标记的环境需要人工裁决，而奖励黑客和配置错误开始超出我们过滤或修复的能力范围。此外，我们还发现，有一部分训练运行意外地使用了模型的思维链——这是我们极力避免的情况，因为担心这会教会模型隐藏其真实推理过程。我们", "zh": true}]}]};
function pad(n){return n<10?"0"+n:""+n;}
function toBeijingHuman(iso, ref, exact){
  const d=new Date(iso); const bj=new Date(d.getTime()+8*3600*1000);
  const Y=bj.getUTCFullYear(),M=bj.getUTCMonth()+1,D=bj.getUTCDate();
  const h=bj.getUTCHours(),m=bj.getUTCMinutes(); const hh=pad(h),mm=pad(m);
  if(!exact) return M+"月"+D+"日";
  const [rY,rM,rD]=ref.split("-").map(Number);
  if(Y===rY&&M===rM&&D===rD) return "今天 "+hh+":"+mm;
  const yest=new Date(rY,rM-1,rD); yest.setDate(yest.getDate()-1);
  if(Y===yest.getFullYear()&&M===yest.getMonth()+1&&D===yest.getDate()) return "昨天 "+hh+":"+mm;
  return M+"月"+D+"日 "+hh+":"+mm;
}

function escapeHtml(s){return (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function escapeAttr(s){return escapeHtml(s);}
// 渲染正文（纯文本归档）：图片不加载远程资源，仅以文字占位符呈现；其余文本按段落转义（防 XSS）
function linkify(escaped){
  if(!escaped) return escaped;
  var re=/(\[[^\]]+\]\((https?:\/\/[^)\s]+)\))|(https?:\/\/[^\s<>"'）】」』，。、；：！？]+)/g;
  return escaped.replace(re, function(m, g1, g2, g3){
    if(g2!==undefined){
      var label=m.substring(m.indexOf('[')+1, m.indexOf(']'));
      return '<a class="r-link" href="'+g2+'" target="_blank" rel="noopener noreferrer">'+label+'</a>';
    }
    if(g3!==undefined){
      return '<a class="r-link" href="'+g3+'" target="_blank" rel="noopener noreferrer">'+g3+'</a>';
    }
    return m;
  });
}
var _IMG_RE=/!\[([^\]]*)\]\(([^)\s]+)\)/g;
function renderRich(text){
  return (text||"").split(/\n{1,}/).map(function(p){
    p=p.trim(); if(!p) return '';
    var out=''; var last=0; var m; _IMG_RE.lastIndex=0;
    while((m=_IMG_RE.exec(p))!==null){
      out+=linkify(escapeHtml(p.slice(last,m.index)));
      var cap=(m[1]||'').trim()||'图片';
      out+='<span class="r-img-cap">🖼 '+escapeHtml(cap)+'</span>';
      last=_IMG_RE.lastIndex;
    }
    out+=linkify(escapeHtml(p.slice(last)));
    return '<p>'+out+'</p>';
  }).join("");
}

        '<p class="r-summary">'+linkify(escapeHtml(sum))+'</p>';
    }else{
      body.innerHTML='<p class="r-empty">暂未获取到该条新闻的全文镜像与摘要。'+(it.url?'可点击右下角「查看原文 ↗」前往原始报道。':'')+'</p>';
    }
  }
  document.getElementById("readerTitle").textContent=it.title;
  document.getElementById("readerSource").textContent=it.source;
  const link=document.getElementById("readerLink");
  if(it.url){link.href=it.url;link.style.display="";}else{link.style.display="none";}
  r.hidden=false;document.body.style.overflow="hidden";
}
function closeReader(){const r=document.getElementById("reader");r.hidden=true;document.body.style.overflow="";}
document.getElementById("reader").addEventListener("click",function(e){if(e.target===this)closeReader();});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeReader();});
</script>
</body></html>
