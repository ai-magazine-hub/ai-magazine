<script>
const DATA = {"meta": {"reportDate": "2026-07-05", "reportDateHuman": "2026年7月5日", "weekday": "星期日", "total": 3, "source": "AI HOT", "sourceUrl": "https://aihot.virxact.com", "generatedAt": "2026年07月30日 10:39"}, "sections": [{"label": "论文研究", "color": "#e11d48", "items": [{"seq": 1, "title": "我国研制全球首款基于可控存内计算的忆阻器神经动力学芯片", "source": "IT之家（RSS）", "summary": "北京大学集成电路学院联合中科院上海微系统所，发布全球首款基于可控存内计算的忆阻器神经动力学芯片，首次将单步运算时延压缩至2.12毫秒。芯片采用40纳米工艺，存内计算阵列与外围电路总面积0.28平方毫米，运行频率50 MHz，单步积分仅需9级流水。在脑皮层重建等任务中较当前GPU提速50至478倍，突破神经动力学实时计算瓶颈。相关成果7月3日发表于《科学》。", "url": "https://www.ithome.com/0/972/526.htm", "permalink": "https://aihot.virxact.com/items/cmr5wizx2067eslc7xynzcf9y", "publishedAt": "2026-07-05T00:00:00.000Z", "exact": false, "content": "我国研制全球首款神经动力学芯片，首次将单步运算时延压缩至 2.12 毫秒\n\nIT之家 7 月 4 日消息，北京大学集成电路学院官方公众号昨日（7 月 3 日）发布博文，宣布联合发布全球首款基于可控存内计算的忆阻器神经动力学芯片，首次将神经动力学系统的单步运算时延压缩至 2.12 毫秒。\n\nIT之家援引博文介绍，该项目由该校杨玉超教授带领，联合中国科学院上海微系统与信息技术研究所研究员宋志棠团队推进，相关成果于 7 月 3 日发表在《科学》上。\n\n基于相变型忆阻器的毫秒级神经动力学系统\n\n该研究首次将这类复杂运算的单步时延压缩至 2.12 毫秒，在脑皮层重建等任务中较目前先进图形处理器（GPU）提速达 50 至 478 倍，一举突破了制约神经动力学长达半个世纪的实时计算瓶颈。\n\n多级电导特性精准映射调控机制\n\n该芯片采用 40 纳米工艺制造，存内计算与步长漂移阵列总面积仅 0.28 平方毫米，并配备编程脉冲生成电路、模数转换器等外围电路。\n\n基于相变型忆阻器的神经动力学芯片性能\n\n芯片运行频率为 50 MHz，单步积分仅需 9 级流水，最终实现 2.12 毫秒的神经动力学单次迭代计算时延，首次将神经动力学硬件系统运行时间推进到毫秒级时代。\n\n实时大脑皮层表面重建以及三维流形网格生成", "zh": true}, {"seq": 2, "title": "NVIDIA 联合多所大学提出 ASPIRE：自我改进机器人框架，零样本成功率最高提升 77 分", "source": "MarkTechPost（RSS）", "summary": "NVIDIA 联合密歇根大学、UIUC、UC Berkeley 等提出 ASPIRE，一个持续学习机器人框架。它通过协调器-执行器架构、闭环执行引擎、技能库和进化搜索，编写并优化机器人控制程序。编程智能体使用 Claude Code（Claude Opus 4.6，1M token 上下文窗口）。在 LIBERO-Pro 上最高比最强基线提升 77 分；Robosuite 双手交接成功率从 20% 提升至 92%；BEHAVIOR-1…", "url": "https://www.marktechpost.com/2026/07/03/nvidia-ai-introduces-aspire-a-self-improving-robotics-framework-reaching-31-zero-shot-on-libero-pro-long-tasks", "permalink": "https://aihot.virxact.com/items/cmr5zuihg0739slc7nv4mlc5r", "publishedAt": "2026-07-05T00:00:00.000Z", "exact": false, "content": "", "zh": true}]}, {"label": "技巧与观点", "color": "#0284c7", "items": [{"seq": 3, "title": "26000名学生研究显示AI隐藏学习成本需两年才显现", "source": "The Decoder：AI News（RSS）", "summary": "一项追踪26000名7-12年级中学生30个月的面板数据研究发现：使用AI后作业分数提升18%，完成时间从64分钟降至45分钟，但闭卷考试分数下降20%，升学考试成绩下降18%至24%，且完全影响约两年才显现。81%长期用户作业完成时间低于50分钟（外包迹象）。社会学科下降27%，STEM下降22%，英语下降17%，语文下降9%。每周使用AI一小时损失约5%，五小时损失30%。早期损失从约25%降至16%但未消失。", "url": "https://the-decoder.com/a-26000-student-study-shows-ais-hidden-learning-cost-takes-two-full-years-to-surface", "permalink": "https://aihot.virxact.com/items/cmr65ieko002tslf0xiomac0c", "publishedAt": "2026-07-05T00:00:00.000Z", "exact": false, "content": "使用人工智能的学生完成作业更快，成绩也更好。然而在考试中，他们的分数下降了多达24%，而在升学考试中，学习差距的全貌直到大约两年后才显现出来。\n\n一项来自中国中部的新研究记录了使用人工智能的中学生所面临的学习损失。研究人员分析了来自一个百万人口大县、涵盖7至12年级超过26000名学生的30个月面板数据。这些数据包括月考成绩、作业分数与完成时间，以及高中和大学的高利害升学考试成绩。\n\n在研究期间，学生自报的人工智能使用率从接近零上升至约80%，其中一次大幅增长与2024年9月DeepSeek V2.5以及2025年1月DeepSeek R1的发布相吻合。最受欢迎的工具是豆包、DeepSeek、智谱清言、文心一言和通义千问。\n\n作业分数提高了18%，完成时间从64分钟降至45分钟，而闭卷考试成绩则骤降20%。| 图片来源：Strömberg 等人\n\n该研究利用了学生自行发现人工智能的时间点各不相同这一事实。作者采用了双重差分法，这种方法通过测量处理组在干预前后的结果变化，并减去同期未处理对照组的相应变化来进行分析。\n\n在此，他们追踪了每位学生在开始使用人工智能前后成绩的变化，然后将这一趋势与尚未使用人工智能的学生进行对比。首次使用的时间点来自学生自报数据，而因果推断的前提是假设两组学生在没有人工智能的情况下会有相似的发展轨迹。\n\n作业变好，考试成绩变差\n\n在首次使用人工智能六个月后，作业分数提高了18%，而每项作业的平均完成时间从64分钟降至45分钟。与此同时，月度闭卷考试的成绩下降了20%。\n\n对高风险入学考试的影响同样显著，但显现得更慢。常规考试成绩在半年内出现下滑，但入学考试的全面影响大约需要两年时间才会显现，下降幅度在18%到24%之间。因此，研究人员认为，短期研究忽略了学习过程中的长期代价。\n\n对常规考试的负面影响在六个月内达到顶峰，而中考和高考入学考试的成绩下滑则需要大约两年时间才能完全显现。| 图片来源：Strömberg 等人\n\n五分之四的长期使用者表现出“外包”迹象\n\n使用AI超过五个月后，约81%的学生在50分钟内完成作业，速度甚至快于最快的非使用者。他们作业成绩很高，但考试却考砸了。作者写道，完成时间短、作业成绩高、考试成绩低这三者结合，表明这些学生将作业外包给了AI。\n\n学习损失集中在那些完成作业异常快的学生身上，这种模式指向他们将任务外包给AI，而非真正学习。| 图片来源：Strömberg 等人\n\n另一方面，那些在作业上花费时间与不使用AI的同学相近的AI使用者，考试成绩同样出色，同时作业成绩也更好。这一群体并未表现出基于先前成绩的正向选择迹象，这意味着他们并非一开始就是更好的学生，而且AI本身并非有害。它主要是在取代独立思考时才会造成损害。\n\n社会科学类科目受影响最大\n\n政治、地理等社会科学类科目的平均成绩下降了27%，STEM科目下降了22%，英语下降了17%，语文下降了9%。这一点很重要，因为以往大多数实验都集中在数学、编程和外语上。\n\n政治和地理等社会科学科目的平均成绩下降了27%，STEM科目下降了22%，英语下降了17%，中文下降了9%。这一点很重要，因为以往大多数实验都集中在数学、编程和外语上。\n\n尽管过去的实验主要关注数学和语言，但学习损失对社会科学科目的打击最为严重。| 图片来源：Strömberg 等人\n\n不同学生群体之间的影响也存在显著差异。低年级初中生比高年级学生损失更大（24% 对 17%），男生比女生受影响更严重（21.6% 对 18.4%），研究认为这主要归因于男生更频繁地使用人工智能。\n\n成绩优异的学生损失最大，排名前三分之一的学生受到的影响为负24%，而排名后三分之一的学生为负16%。此外，还呈现出剂量反应模式：每周使用人工智能不超过一小时的学生损失约5%，而使用五小时或以上的学生损失达30%。\n\n为何几乎无人反对\n\n据估算，学习损失从2023年初的约25%下降到2025年6月的16%。这一下降趋势在固定的一批早期使用者中也同样出现，表明学生和教师在一定程度上进行了适应，但损失并未消失。\n\n该研究解释了为何反应如此平淡。教师通常只关注学生某一科目的表现，而单科成绩下降20%本身并不罕见。直到2025年6月，全县平均成绩的累计影响才达到约负10%，因为很少有学生使用人工智能的时间足够长，以至于损害得以累积。学生自己往往无法将这些点联系起来，误将独立学习所需的脑力付出视为自己学习不佳的迹象。\n\n作为应对措施，研究建议向学生提供关于外包长期成本的可信信息，更加重视现场考试，并跟踪完成时间而非作业成绩。人工智能削弱了作业作为信号的价值，在作业成绩高于平均水平的人工智能使用者中，更高的作业分数实际上预示着更差的考试成绩。\n\n\u003ca href=", "zh": true}]}]};
function pad(n){return n<10?"0"+n:""+n;}
function toBeijingHuman(iso, ref, exact){
  const d=new Date(iso); const bj=new Date(d.getTime()+8*3600*1000);
  const Y=bj.getUTCFullYear(),M=bj.getUTCMonth()+1,D=bj.getUTCDate();
  const h=bj.getUTCHours(),m=bj.getUTCMinutes(); const hh=pad(h),mm=pad(m);
  if(!exact) return M+"月"+D+"日";
  const [rY,rM,rD]=ref.split("-").map(Number);
  if(Y===rY&&M===rM&&D===rD) return "今天 "+hh+":"+mm;
  const yest=new Date(rY,rM-1,rD); yest.setDate(yest.getDate()-1);
  if(Y===yest.getFullYear()&&M===yest.getMonth()+1&&D===yest.getDate()) return "昨天 "+hh+":"+mm;
  return M+"月"+D+"日 "+hh+":"+mm;
}

function escapeHtml(s){return (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function escapeAttr(s){return escapeHtml(s);}
// 渲染正文（纯文本归档）：图片不加载远程资源，仅以文字占位符呈现；其余文本按段落转义（防 XSS）
function linkify(escaped){
  if(!escaped) return escaped;
  var re=/(\[[^\]]+\]\((https?:\/\/[^)\s]+)\))|(https?:\/\/[^\s<>"'）】」』，。、；：！？]+)/g;
  return escaped.replace(re, function(m, g1, g2, g3){
    if(g2!==undefined){
      var label=m.substring(m.indexOf('[')+1, m.indexOf(']'));
      return '<a class="r-link" href="'+g2+'" target="_blank" rel="noopener noreferrer">'+label+'</a>';
    }
    if(g3!==undefined){
      return '<a class="r-link" href="'+g3+'" target="_blank" rel="noopener noreferrer">'+g3+'</a>';
    }
    return m;
  });
}
var _IMG_RE=/!\[([^\]]*)\]\(([^)\s]+)\)/g;
function renderRich(text){
  return (text||"").split(/\n{1,}/).map(function(p){
    p=p.trim(); if(!p) return '';
    var out=''; var last=0; var m; _IMG_RE.lastIndex=0;
    while((m=_IMG_RE.exec(p))!==null){
      out+=linkify(escapeHtml(p.slice(last,m.index)));
      var cap=(m[1]||'').trim()||'图片';
      out+='<span class="r-img-cap">🖼 '+escapeHtml(cap)+'</span>';
      last=_IMG_RE.lastIndex;
    }
    out+=linkify(escapeHtml(p.slice(last)));
    return '<p>'+out+'</p>';
  }).join("");
}

    }
  }

}
