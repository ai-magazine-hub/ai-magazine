const DATA = {"meta": {"reportDate": "2026-08-15", "reportDateHuman": "2026年8月15日", "weekday": "星期六", "total": 9, "source": "AI HOT", "sourceUrl": "https://aihot.virxact.com", "generatedAt": "2026年08月15日 09:47"}, "sections": [{"label": "模型发布/更新", "color": "#4f46e5", "items": [{"seq": 1, "title": "Gemini 3.7 Flash 全面上线 Pro 与 Ultra 用户", "source": "X：Gemini (@GeminiApp)", "summary": "Gemini 3.7 Flash 现已向 Gemini 聊天中的 Pro 和 Ultra 用户开放。该模型更新提升了多步骤任务的推理与准确性，如智能整合数十个文件和邮件为一份主文档。同时，Gemini Spark 也已运行于 3.7 Flash，通过改进对 Google Workspace 应用的工具调用，让个人 AI 智能体更精准。", "url": "https://x.com/GeminiApp/status/2088326407730692538", "permalink": "https://aihot.virxact.com/items/cmst9yj3c05utrodz443l0odv", "publishedAt": "2026-08-14T18:06:29.000Z", "exact": true, "content": "Gemini 3.7 Flash 现在可供所有 Pro 和 Ultra 用户在 Gemini 聊天中使用。 此模型更新改进了多步骤任务的推理和准确性，例如智能地将数十个文件和电子邮件中的点连接到一个主文档中。 今天就在网络或应用程序中尝试一下吧！ Gemini Spark 现在可以在 Gemini 3.7 Flash 上运行。⚡️ 无论您是使用 Spark 将供应商编译成表格还是起草谈判电子邮件，3.7 Flash 都可以通过改进 @GoogleWorkspace 应用程序的工具使用，让您的个人 AI 代理更加精确和准确，从而帮助将想法转化为行动。", "zh": true}, {"seq": 2, "title": "AI生成书籍正淹没亚马逊，并拉低人类作者的单书收入", "source": "The Decoder：AI News（RSS）", "summary": "一项对14,419本自出版电子书的分析显示，AI生成书籍正以数量而非质量挤占人类作者市场，即便未检测到AI文本的书籍，单书收入也在下滑。2023年Q1至2026年Q1，书目总量增长38.3倍，而季度收入仅增长8.9倍；在八个类型中，七个类型的无AI文本书籍单书收入下降。", "url": "https://the-decoder.com/ai-generated-books-are-flooding-amazon-and-tanking-sales-for-human-authors", "permalink": "/items/cmsuaf2hr05zgroe0y1e7275v", "publishedAt": "2026-08-15T11:00:50.000Z", "exact": true, "zh": true, "fromFeed": true, "content": "\u003e 一项对超过 14,000 本亚马逊自出版图书的分析显示，AI 生成的书籍正凭借数量而非质量，将人类作者挤出市场。即便是未检测到 AI 文本的书籍，单本收入也在下降。\n\n研究人员分析了 2023 年 1 月至 2026 年 3 月期间随机抽取的 14,419 本自出版电子书。对于每本书，他们从美国五大出版商之一的内部数据集中提取了每日销售数据。据研究人员称，该数据集追踪约 50 万本亚马逊图书，覆盖该平台每日售出电子书的约 95%。\n\n与早期仅凭简短图书预览来检测 AI 文本的研究不同，研究人员根据每本书的全文进行分类。他们使用了 Pangram v3.3 检测器，其开发者报告误报率为 0.04%。此后 Pangram 4 已发布。根据被标记为 AI 生成的文本占比，图书被分为三档：无、轻度（不超过 25%）和重度（超过 25%）。\n\n目录占比大，销量低于平均水平\n\n含大量 AI 内容的图书占所研究目录的 20%，但仅占销量的 12.1% 和收入的 11.3%。未检测到 AI 文本的图书占目录的 62.9%，却贡献了 72.5% 的收入。乍一看，这似乎印证了 AI 书籍仍是滞留在市场底部的低质量“垃圾内容”这一观点。 含大量 AI 内容的图书占目录的 20%，但仅占销量的 12.1% 和收入的 11.3%。| 图片来源：Chakrabarty 等人 不过，该研究表明这一观点忽略了真实的市场动态。从 2023 年第一季度到 2026 年第一季度，累计目录规模增长了 38.3 倍，而每季度有销量的图书数量增长了 19.2 倍。季度收入仅增长了 8.9 倍。如今有更多的书在争夺一个增长缓慢得多的收入池。\n\n即便是未检测到 AI 文本的书籍，单本收入也在下降。\n\n在八种体裁中，有六种体裁的图书，若将2023年与2025年出版的作品在相同上市后时间段内的收入进行对比，单本书收入均出现下滑。而仅看未检测到AI文本的图书，八种体裁中有七种的收入出现下降。\n\n这排除了“平均值下降仅仅是因为销量不佳的AI图书拉低了整体目录水平”这一解释。作者将这种效应称为“稀释”，但强调他们的比较属于观察性和关联性研究，并非因果关系的实验性证明。 图书目录增长了38.3倍，而收入仅增长8.9倍；在八种体裁中，有七种体裁的未含AI文本图书的单本收入出现下滑。| 图片来源：Chakrabarty et al. 唯一的例外是奇幻/超自然/恐怖类，AI文本在该类体裁中出现最晚，渗透率也最低。在该类体裁中，未检测到AI文本的图书单本收入反而上涨了35%。研究人员表示，这种反转表明，整体市场趋势并非导致上述现象的原因。\n\n在Kindle Unlimited覆盖率较高的体裁中，这一规律更为明显，因为读者共享同一个订阅池。在这些体裁中，未检测到AI文本的图书在收入份额上的领先优势，比Kindle Unlimited覆盖率较低的体裁小了8.4个百分点。研究人员将此差距归因于体裁本身的特性，并未将其与Kindle Unlimited建立因果关系。\n\nAI图书正闯入畅销榜前列\n\n在研究期间，含有大量AI内容的新晋Top 25图书占比从接近零上升至31%。榜单前列的更新换代速度也在加快。未检测到AI文本的图书中，能连续两个季度留在Top 25榜单内的占比一度低至约28%，到研究结束时稳定在约62%左右。 未含AI文本图书的销售份额从2023年初的近100%下降至2026年第二季度的约60%，而AI图书占新晋Top 25榜单作品的比重最高达31%。| 图片来源：Chakrabarty et al. 产出集中在少数高产作者手中。在385个作者身份中，有287个在出版第一本含大量AI内容的书籍后，月度产出有所增加。收入最高的笔名在扣除平台费用前，凭借8本书获得了170万美元的总收入。单本含大量AI内容的书籍最高收入为64.3万美元，共售出80,431本。\n\n这项研究呼应了《纽约时报》关于“Coral Hart”的报道——据报道，该作者在一年内以21个笔名出版了200多本言情小说，售出约5万本。AI垃圾内容并不局限于图书领域。还有人利用AI生成的歌曲，通过流媒体平台诈骗了数百万美元。 在385个作者身份中，有287个在出版第一本AI书籍后提高了产出。收入最高的作者身份凭借8本书获得了170万美元的总收入。| 图片来源：Chakrabarty et al.\n\n畅销AI书籍与现有作品中罕见语言的重复度极高\n\n为了衡量畅销AI书籍与现有作品中罕见语言的重复程度，研究人员使用了艾伦人工智能研究所的infini-gram工具以及Google Books索引。\n\n他们识别出那些在Google Books中出现在不超过5卷书籍里、且在4.7万亿token的网络快照中完全缺失的罕见表达。这类短语指向与已出版书籍紧密相关的语言模式。\n\nAn analysis of more than 14,000 self-published Amazon books shows that AI-generated titles are displacing human authors through sheer volume, not quality. Revenue per book is falling even for titles where no AI text was detected.\n\nThe researchers analyzed 14,419 randomly selected self-published e-books released between January 2023 and March 2026. For each title, they pulled daily sales figures from an internal dataset maintained by one of the five major US publishers. That dataset tracks about 500,000 Amazon titles and covers roughly 95 percent of all e-books sold daily on the platform, according to the researchers.\n\nUnlike earlier studies that tried to detect AI text from short book previews alone, the researchers Books with substantial AI content make up 20 percent of the catalog but account for only 12.1 percent of sales and 11.3 percent of revenue. | Image: Chakrabarty et al. The study shows that this view misses the real market dynamics, though. Between Q1 2023 and Q1 2026, the cumulative catalog grew 38.3x while the number of titles selling per quarter grew 19.2x. Quarterly revenue only grew 8.9x. Far more books are now competing for a revenue pool that's growing much more slowly.\n\nRevenue per book is falling even for titles with no detected AI text\n\nIn six of eight genres, revenue per book dropped when comparing titles released in 2023 and 2025 over the same post-release window. Looking only at books with no detected AI text, revenue fell in seven of eight genres.\n\nThat rules out the explanation that the average is dropping simply because poorly selling AI books are padding the catalog. The authors call this effect but stress that their comparisons are observational and associational, not experimental proof of causation. The catalog grew 38.3x while revenue grew only 8.9x, and revenue per book fell for titles with no AI text in seven of eight genres. | Image: Chakrabarty et al. The only exception is Fantasy/Supernatural/Horror, where AI text arrived latest and gained the least traction. There, revenue per book for titles with no detected AI text rose 35 percent. The researchers say this reversal argues against a general market trend as the cause.\n\nThe patterns are stronger in genres with high Kindle Unlimited availability, where readers draw from a shared subscription pool. In those genres, the revenue-share lead of books with no detected AI text is 8.4 percentage points smaller than in genres with low Kindle Unlimited availability. The researchers attribute the gap to genre-specific traits and don't draw a causal link to Kindle Unlimited itself.\n\nAI books are breaking into the top ranks\n\nThe share of new Top 25 entries with substantial AI content rose from near zero to 31 percent over the study period. The top ranks also turned over faster. The share of books with no detected AI text that stayed in the Top 25 from one quarter to the next dropped as low as about 28 percent at one point before settling around 62 percent by the end of the study. The sales share of books with no AI text fell from nearly 100 percent in early 2023 to about 60 percent in Q2 2026, while AI titles account for up to 31 percent of new Top 25 entrants. | Image: Chakrabarty et al. Output is concentrated among a handful of prolific producers. Of 385 author identities that published more titles with substantial AI content after their first AI book, 287 increased their monthly output afterward. The highest-grossing pseudonym earned $1. 7 million in gross revenue before platform fees across eight titles. The single highest-grossing book with substantial AI content brought in $643,000 on 80,431 copies sold.\n\nThe study echoes the  who reportedly published over 200 romance titles under 21 pen names in a single year and sold about 50,000 copies. AI spam extends beyond books, too. One man Of 385 author identities, 287 ramped up output after their first AI book. The highest-grossing identity earned $1.7 million in gross revenue across eight titles. | Image: Chakrabarty et al.\n\nTop-selling AI books overlap heavily with rare language from existing works\n\nTo measure how much successful AI books overlap with rare language from existing works, the researchers used the Allen Institute for AI's Top-selling AI books draw far more on rare expressions from existing books than award-winning literature, which has a coverage rate of just 19.1 percent. | Image: Chakrabarty et al. Among the 50 highest-grossing titles with substantial AI content, these rare expressions covered 45 percent of the text, compared to 37.7 percent for the top 50 books with no detected AI text. For award-winning or award-nominated fiction, the figure was just 19.1 percent.\n\nWithin AI books, overlap rose 7.6 percentage points for every tenfold increase in revenue. No such correlation existed for books with no detected AI text. The method doesn't trace the origin of individual passages or prove that any specific book was copied. It measures aggregate language overlap.\n\nChakrabarty \u003ca href="}]}, {"label": "产品发布/更新", "color": "#059669", "items": [{"seq": 1, "title": "Claude Code v2.1.233 发布：新增 GitLab MR 支持与内存 cgroup 限制", "source": "Claude Code：GitHub Releases（RSS）", "summary": "Claude Code v2.1.233 发布，为 --worktree 标志和 agents 视图新增 GitLab 合并请求 URL 支持，并添加可选的 forward_user_identity 网关设置以按用户归因支出。", "url": "https://github.com/anthropics/claude-code/releases/tag/v2.1.233", "permalink": "https://aihot.virxact.com/items/cmstjrtxi0a28ro0xbdowgrvf", "publishedAt": "2026-08-14T22:20:57.000Z", "exact": true, "content": "", "zh": true}]}, {"label": "行业动态", "color": "#d97706", "items": [{"seq": 1, "title": "Claude 文本水印机制如何运作", "source": "Anthropic：Newsroom（网页）", "summary": "未来 Claude 模型生成的文本将包含水印，用于判断文本由 Claude 撰写的可能性，这是 Anthropic 为遵守欧盟《AI 法案》而实施的变更。该方法基于 Google DeepMind 的 SynthID-Text 技术，对输出质量、创造力和可读性无实际影响，读者无法区分水印文本与普通文本，且不增加额外 token 或成本。", "url": "https://www.anthropic.com/news/claude-text-watermark", "permalink": "https://aihot.virxact.com/items/cmstc3u8j02xhro0xf5o1ouas", "publishedAt": "2026-08-14T19:22:48.546Z", "exact": true, "content": "\u003e 未来的克劳德模型将生成包含水印的文本。这是确定克劳德参与撰写文本的可能性的一种方式，我们与其他几家主要人工智能提供商一起正在实施这一更改，以遵守欧盟人工智能法案。 在本文中，我们分享了我们收到的一些问题的答案，这些问题涉及我们选择的水印方法如何工作、它是否影响 Claude 的输出以及我们为什么要进行此更改。总结一下：\n- 我们使用的水印方法不会对克劳德输出的质量或内容产生任何实际影响；\n- 读者将无法区分带水印和未带水印的文本之间的差异；\n- 文本中没有添加任何内容，也没有隐藏字符；\n- 加水印不需要额外的代币，也不会更贵；\n- 水印不携带任何识别信息，无法追踪到特定的个人、组织或聊天记录；\n- 水印并不是克劳德特有的。自 8 月 2 日起，欧盟要求为其市场提供服务的人工智能提供商对人工智能生成的内容进行标记。其他主要模型开发商也签署了相同的行为准则，并将实施自己的水印。\n什么是水印？ 像 Claude 这样的大型语言模型通过一次生成一个单词来工作。每次模型决定下一个单词时，它都会在潜在候选者列表中进行选择，最终根据前面的文本选择最合理或最可能的单词。就拿这句话来说：“今天的天气很冷……”。下一个词不太可能是“糖”。但它很可能是“阴”或“灰色”。在大多数情况下，模型最终选择后两个单词中的哪一个对于读者来说并不重要——无论哪种方式，句子的含义基本上是相同的。在这种情况下，选择是由随机数决定的。 水印使用诸如此类的低风险选择（在一段生成的文本上多次出现）在克劳德的响应中留下模式。该模式对于读者来说是无法检测到的，但是任何拥有对其进行编码的密钥的人都可以检测到。当使用水印时，选择仍然是随机的，但随机性的来源不同。 Watermaking 没有使用任意随机数生成器来选择下一个单词，而是使用密钥和前面的几个单词来确定模型应该选择哪个单词。也就是说，克劳德选择的单词仍然是随机的，但是现在，我们可以检查单词的顺序，看看它是否与克劳德使用密钥时所做的选择一致。如果是，则可以确定该文本是由克劳德生成的概率。 重要的是，模型现在并不总是偏向阴天或灰色。就像无水印文本一样，可能会在一个句子中选择阴暗，在下一个句子中选择灰色，具体取决于前面的单词。事实并非如此，水印方法迫使克劳德选择一个它无论如何都不会考虑的单词（例如，它不会让克劳德选择像“nubilous”这样的单词——这是阴暗或灰色的模糊同义词，克劳德在正常情况下几乎肯定不会使用）。 如何影响克劳德的输出？ 水印不会影响克劳德输出的质量。对于读者来说，加水印的响应与未加水印的响应没有区别（因此，人工智能水印与纸币、其他物理对象和一些肉眼可见的数字文档上的同名水印有很大不同）。 在内部测试中，我们发现水印对克劳德文本的内容、创造力水平或可读性没有影响。在 \u003ca href=", "zh": true}, {"seq": 2, "title": "印尼首个大学AI中心落成：UGM、Indosat与NVIDIA合作培养本地AI人才", "source": "NVIDIA Blog（RSS）", "summary": "印尼通信与数字事务部、Indosat、NVIDIA与加查马达大学（UGM）在日惹共同启动UGM Indosat NVIDIA AI技术中心（NVAITC），这是该国首个大学AI技术中心。", "url": "https://blogs.nvidia.com/blog/ugm-indosat-nvidia-ai-technology-center", "permalink": "https://aihot.virxact.com/items/cmst7s3xg02x3rodz3uvww36c", "publishedAt": "2026-08-14T17:13:05.000Z", "exact": true, "content": "印度尼西亚正在掌控其人工智能的未来。本周，通信和数字事务部 (Komdigi)、Indosat Ooredoo Hutchison（Indosat 或 IOH）、NVIDIA 和 Universitas Gadjah Mada (UGM) 在日惹启动了 UGM Indosat NVIDIA AI 技术中心 (NVAITC)，这是该国首个基于大学的 AI 技术中心。UGM Indosat NVAITC 在印度尼西亚人工智能卓越中心倡议下成立，将政府、行业和学术界聚集在一起，共同开发人工智能，解决印度尼西亚最紧迫的国家优先事项。\n\n印度尼西亚通信和数字事务部部长 Meutya Hafid 表示：“印度尼西亚人工智能卓越中心反映了我们的长期愿景，即将印度尼西亚定位为一个不仅采用人工智能，而且还为世界开发和贡献人工智能创新的国家。” “通过这样的举措，我们正在为印度尼西亚的人工智能主权奠定基础，并确保人工智能成为经济增长、国家竞争力和解决印度尼西亚最紧迫挑战的驱动力。” “UGM 致力于通过教育、研究和创新来支持印度尼西亚的人工智能雄心，从而产生真正的社会影响，” UGM 教授、博士说。奥娃艾米利亚博士“该举措通过加速人工智能的采用并培养面向未来的印尼人才，支持高等教育、下游研究和人才发展方面的国家优先事项。” 属于国家的计算 UGM Indosat NVAITC 由 NVIDIA 的全栈 AI 平台和 GPU Merdeka（Indosat 的主权 GPU 即服务平台）提供支持，为 UGM 的研究人员和学生提供企业级加速计算、AI 软件、开源、预训练模型、开发框架和技术指导。它还将印度尼西亚研究人员与全球专业知识生态系统连接起来。\n\nIndosat Ooredoo Hutchison 总裁兼首席执行官维克拉姆·辛哈 (Vikram Sinha) 表示：“在 Indosat，我们相信在人工智能时代，任何一个印尼人都不应该被抛在后面。” “通过 UGM Indosat NVAITC，我们将全球最好的人工智能技术和专业知识引入印度尼西亚，同时扩大全国范围内研究人员、学生、初创企业和创新者生态系统的使用范围。通过加强人工智能准备并赋予印度尼西亚人才权力，我们的目标是支持政府的人工智能愿景，帮助印度尼西亚不仅成为人工智能技术的用户，而且成为一个为世界开发和贡献人工智能创新的国家。” 机会是真实的。印度尼西亚是世界第四人口大国，研究人员和开发人员致力于解决规模大且紧迫的问题。他们历来缺乏的是访问计算、模型和基础设施以从洞察转变为影响。\n\nNVIDIA 解决方案架构和工程副总裁 Marc Hamilton 表示：“印度尼西亚拥有一个由研究人员、开发人员和创新者组成的非凡社区，他们有潜力塑造人工智能的未来。” “从医疗保健和农业到备灾，人工智能推动真正变革的机会是巨大的。通过 UGM Indosat NVIDIA 人工智能技术中心，NVIDIA 致力于为印度尼西亚人才提供 NVIDIA Nemotron 开放模型和专业知识，将这种潜力转化为具有本地和全球影响力的创新。” 人工智能应对印度尼西亚挑战 三个初始项目定义了该中心的用途，重点是医疗保健、农业和自然灾害应对。\n\n印度尼西亚每年记录超过 100 万新发结核病 (TB) 病例。结核病是可以治愈的，但如果未被发现，就会致命。农村和服务欠缺地区的检测依赖于社区一级无法获得的设备和专业知识。UGM 医学院公共卫生和护理团队，由博士领导。Dian Kesumapramudya Nurputra 博士、理学硕士、SpA 正在开发一种人工智能驱动的电子筛查技术——eNose-TB——通过分析呼吸样本来筛查结核病。目标是：为偏远诊所和村庄的患者提供负担得起、快速、方便的筛查——无需专家或昂贵的实验室。\n\n“作为研究人员，我们始终相信印度尼西亚开发的技术可以解决印度尼西亚的挑战，”迪安说。“通过该中心，获得世界一流的人工智能基础设施和专业知识将有助于我们加快研究速度，并使我们更接近开发负担得起且易于使用的医疗技术的梦想，从而改善印度尼西亚各地的生活。” 农业雇用了印度尼西亚近 30% 的劳动力。SmartAgri 使用多模式人工智能（结合卫星图像、传感器数据和当地农业知识）以及边缘计算，为印度尼西亚地形、农作物和小农提供精准农业。这些人工智能驱动的建议可帮助农民准确了解何时以及如何灌溉，随着时间的推移，其影响会不断扩大。\n\n印度尼西亚位于环太平洋火山带上，面临的自然灾害风险比地球上几乎任何地方都多。Tech4Disaster 正在构建一个地理空间 AI 平台，使用 NVIDIA 加速计算来快速处理卫星和传感器数据，从而在灾难发生时为社区和应急响应人员提供早期预警、更好的态势感知和更快的协调工具。了解有关 UGM Indosat NVIDIA AI 技术中心的更多信息。", "zh": true}]}, {"label": "技巧与观点", "color": "#0284c7", "items": [{"seq": 1, "title": "Claude Code 会话如何最大化 token 价值", "source": "Claude：Blog（网页）", "summary": "Claude Code 的 token 成本由模型、输入/输出 token 和提示缓存三因素决定，输出 token 价格约为输入的 5 倍。任务间运行 /clear 可减少无关上下文回传，降低 token 用量；会话中途切换模型或 effort 级别会破坏提示缓存，增加成本。", "url": "https://claude.com/blog/maximizing-the-value-of-your-claude-code-sessions", "permalink": "https://aihot.virxact.com/items/cmst2fc5802f1ro062rp0wdez", "publishedAt": "2026-08-14T14:51:47.940Z", "exact": true, "content": "\u003e 这是相同的修复，但您在其上花费了不同数量的令牌，并且整个过程中模型还必须考虑它不需要的十个文件。 高效使用代币并不意味着总体上使用更少的代币。这意味着确保您使用的产品符合您实际要求的需求。 因此，让我们看看是什么决定了代币的价格，然后是什么决定了会话发送的代币数量，以及这对于您运行会话的方式意味着什么。 代币的价格由什么决定 您按代币计费，但您实际支付的是推理费用：GPU（或 TPU，或模型恰好运行的任何设备）在您的代币上运行模型所需的时间。 三件事决定了令牌花费多少时间：您正在运行哪个模型，它是输入令牌（进入）还是输出令牌（出来），以及它是否被缓存。 模型 更大的模型对输入和输出标记做更多的工作。哪种模型值得哪种工作本身就是一个主题，我们在 曲线仅用于说明目的。它们并不代表真实的基准数据。 卷曲-fsSL 会话中的许多输出令牌都是思考令牌，模型每轮思考的次数是努力级别控制的。与模型一样，您使用“/effort”选择的级别也会保留为下一个会话的默认级别。 **提示：**在新会话中运行一次 `/model` 和 `/effort` 来查看您实际上在做什么。双方都会记得你上次选择的任何内容，并且你希望这个决定是经过深思熟虑的。 **提示：**如果您已经知道某个会话将是一项繁重的工作，则“MAX_THINKING_TOKENS=0”克劳德会关闭该会话的思考（寓言 5 除外），这是“/effort”下方的步骤。 提示缓存 如果请求以与服务器刚刚看到的请求完全相同的令牌开头，则该共享开头的状态将相同，因此服务器可以保留上次的令牌，并且仅预填充其后的内容。这称为提示缓存。 从缓存读取的成本是输入价格的 0.1 倍，因为服务器加载状态而不是计算状态。将令牌写入缓存的成本比正常输入高一些，最高可达 2 倍，因为服务器之后还必须保留状态。但是每个令牌都会写入一次，并且在其之后的每一轮都会发生 0.1x 读取。 Claude Code 管理每个请求的提示缓存，无需打开任何内容。但是，您可能会破坏它，因此了解如何避免这些成本飙升非常重要。 假设我们输入 。以下是 Claude Code 发送的内容： - Claude Code 会根据系统提示（包括工具定义）、您的“CLAUDE.md”和您的消息组装第一个请求，并将其发送出去（输入令牌）。缓存中还没有任何内容，因此所有内容都会被预填充并写入缓存中。 - 该模型无法修复它未见过的测试，因此它会思考一会儿并通过“utils.test.ts”（输出标记）的 Read 调用进行响应。 Claude Code 读取该文件，将其附加到对话中，然后再次发送整个内容（输入令牌）。这次，请求 1 中的所有内容都会以十分之一的价格从缓存中读回，唯一以全价预填充的是新内容：Read 调用和文件。 - 现在模型需要测试文件（输出）。另一次读取，另一次追加，一切都再次发生：从缓存请求 1 和 2，第二个文件以全价（输入）。 - 模型以编辑（输出）作为响应。 Claude Code 应用它，附加结果，然后再次发送所有内容。同样的故事：编辑及其结果都是新的，它们前面的所有内容都是缓存读取（输入）。 - 该模型运行“npm test”（输出）。 Claude Code 附加测试输出并再次发送所有内容，测试输出作为唯一的新部分（输入）。 - 测试通过，模型响应一个简短的摘要（输出）。没有工具调用意味着没有任何附加内容，也没有请求 6，所以我们就完成了。 这是针对一个小修复的五个请求，每个请求都包含了截至该点的整个对话。典型的转向是不平衡的：数以万计的代币进入，几百个代币出来。但只有新推出的产品才会以全价预装。 这就是每回合的全部费用：历史记录的缓存读取、新内容的完整输入价格以及响应的输出价格。 这也适用于订阅。您无法直接看到这些价格，但相同的请求会降低您的限额。 缓存必须从请求的一开始就匹配，并且请求始终以相同的顺序发出：工具定义，然后是系统提示，然后是对话（前面有“CLAUDE.md”）。 如果该前缀中的任何内容发生变化，则其后面的所有内容都会再次预先填充。附加到对话末尾的工具结果是理想的情况，因为其背后没有任何内容。丢弃缓存的是任何进一步改变请求的方式，或者改变缓存的关键内容：\n- `/model`：每个模型都有自己的缓存，因此在下一个回合，整个对话将再次以全价预填充。 （这包括 opusplan，它会在您每次进入或退出计划模式时切换模型。）\n- `/effort:` 工作量级别也是缓存关键的一部分，所以这是同样的故事。这就是为什么“/model”和“/effort”在对话中切换时都会要求您确认。\n- 快速模式：也是密钥的一部分，重新预充值以快速模式价格进行，因此如果您要打开它，请在开始时打开它。 （再次关闭它是免费的，就缓存而言。）\n- `/compact`：对话被替换为较短的对话，因此其中不再匹配（其前面的系统提示符仍然存在）。只要旧对话仍在缓存中，编写摘要本身就很便宜，因此在长时间休息之前比长时间休息之后要便宜得多。\n- 时间：每回合都会重置时钟，但缓存会在订阅一小时或 API 密钥五分钟后过期（“ENABLE_PROMPT_CACHING_1H=1”使其变为一小时）。晚一点回来，下一个回合又会再次填充整个对话。恢复旧会话几乎总是会这样做：那时缓存通常已经消失，并且系统提示符无论如何都会在启动时重建。\n这并不意味着你永远不应该改变模型或努力。这意味着有一些便宜的时刻可以做到这一点，例如会话开始或“/clear”之后，而昂贵的时刻则可以，即长时间对话的中间。 **提示：**如果最后几圈转到您不想保留的地方，请`/rewind`到它们之前，而不是运行`/compact`。倒带只会切断结尾处的那些转弯，因此它们之前的所有内容仍然会被缓存，而且不需要任何成本。压缩会重写整个对话，因此总是要付出一些代价。 什么决定了会话发送多少令牌 这里要知道的主要事情是，没有任何内容只会发送一次。在对话中结束的所有内容，克劳德读取的文件或运行的命令的输出，都会在会话的其余部分中每回合再次发送。 它被缓存了，所以每次重新发送都很便宜，但便宜并不是什么都没有，而且它在模型也必须在每个回合都考虑的上下文中占用了空间。 这实际上是会话的整个成本模型：有多少令牌最终出现在上下文中，它们在那里停留了多少轮，以及同时运行了多少个上下文。 在上下文中最终会发生什么 上下文中的部分内容在您键入任何内容之前就已存在：工具定义、系统提示符、`CLAUDE.md` 以及启动时加载的任何其他内容。 提示：在输入任何内容之前，在新会话中运行“/context”以查看其中的内容。将“CLAUDE.md”保留为特定指令，并将特定于工作流程的指令移至技能中，这些指令仅在使用时才会加载。如果此会话中不需要 MCP 服务器，请使用“/mcp”将其关闭。 会话期间添加的几乎所有其他内容都是工具结果：Claude 读取的文件以及它运行的命令的输出。 克劳德读了多少书，主要取决于它必须自己弄清楚多少。如果你说 ，它首先必须找出哪些测试：一两个 grep、打开一些文件以查看哪个是相关的，并且所有这些结果在它们不再有用之后很长时间仍保留在上下文中。 也不消耗 Read 调用的费用。 **提示：**当您引用文件时，请@-提及它而不是键入路径。 Claude Code 在发送任何内容之前将文件附加到您的消息中，因此它位于第一个请求中，并且没有对其进行 Read 调用。无论哪种方式，文件本身都会在上下文中占用相同的空间，因此每次对话只需提及一次：它会保留在那里，并且在稍后的回合中再次@提及它通常会附加第二个副本。 填充上下文的另一件事是 Claude 运行的命令的输出。每次它运行测试、构建或 git 日志时，打印的任何内容都会像它读取的文件一样附加到对话中，并在那里停留相同的轮数。 真正大的输出实际上很好：在 30,000 个字符之后，Claude Code 将输出写入文件，并且只在对话中放置一个简短的预览和路径（如果您想更改它，请使用“BASH_MAX_OUTPUT_LENGTH”）。 问题在于这一切。一次一行打印 400 个通过测试的测试运行程序低于限制，而这 400 行现在是每个剩余回合的一部分。 Claude 通常会用 flags 和 tail 为你处理这个问题，如果你不想把它留给 Claude，文档中有一个小钩子，可以在运行之前重写嘈杂的命令，这样只有重要的行才会返回。 提示：将您整天运行的两到三个命令放入“CLAUDE.md”中，包括安静标志，就像您自己键入它们一样（ `）。这是一个很小的添加，但它节省了一个回合，并在之后的每个会话中节省了几百行输出。 在那里转了多少圈 一个长会话的成本比分散在几个短会话中的相同工作要多，而且比你想象的要多，因为第 40 回合还需要重新阅读之前的 39 回合。您希望会话中的上下文简短且相关，因此不要将一个任务的上下文带入下一个任务：当您开始新任务时使用“/clear”，当同一任务的早期部分完成时使用“/compact”。 提示：如果您希望稍后恢复会话，请在“/clear”之前添加“/rename”。当你`/compact`时，告诉它要保留什么，或者放一个 如果总是相同的内容，请参阅“CLAUDE.md”中的部分。如果您使用的是 1M 型号，并且希望将自动紧凑型安全网保留在原来的位置，则“/autocompact 200k”会将其放回原位（需要 Claude Code v2.1.221+）。 还要留意您不打字时发生的情况。 “/loop”在您设置的会话中作为一个完整的轮次触发，每次都会携带整个对话，如果自上次轮次以来已经超过一个小时，那么它就是顶部的缓存未命中。在另一个终端中启动新会话并从那里运行循环。 子代理 另一种将某些事情排除在上下文之外的方法是让它在不同的环境中发生，这就是子代理的用途。子代理有自己的上下文窗口，有自己的系统提示符、工具和您的“CLAUDE.md”，但不是您的对话。它自己轮流运行，返回主会话的唯一内容就是它的答案。一旦完成，其他所有东西都会被扔掉。 不进行对话的缺点是，子代理有时必须重新读取主会话已经拥有的内容，并且在这样做时它会为自己的轮次付费。对于一项小工作来说，这只是开销。 当一项工作产生大量不需要保留的输出（例如查看日志）时，它就会得到回报。遇到这种事情克劳德经常会自己去拿一个，没有的时候你可以直接要一个（ ）。请记住，主会话仅返回子代理选择报告的内容。 提示：如果您一遍又一遍地移交一项嘈杂的工作，请使用模型给它一个自己的子代理定义：俳句（或十四行诗）。否则，它会在您的主会话正在运行的任何地方运行。 首先看哪里 在上述所有内容中，有四件事值得关注，大致按成本排列： \u003cimg 源=", "zh": true}, {"seq": 2, "title": "OpenRouter 视觉指南：如何通过 API 向多模态模型发送图像", "source": "OpenRouter：Announcements（RSS）", "summary": "OpenRouter 发布视觉指南，详解通过 Chat Completions API 向多模态模型发送图像的方法。请求体采用 messages 数组，用户消息的 content 包含 text 和 image_url 两部分，支持公开 URL 或 base64 数据 URL 两种格式，兼容 PNG、JPEG、WebP 和 GIF。", "url": "https://openrouter.ai/blog/tutorials/send-image-to-llm", "permalink": "https://aihot.virxact.com/items/cmst8uvbr03l7rodzff6fiiml", "publishedAt": "2026-08-14T00:00:00.000Z", "exact": true, "content": "\u003e 如果您希望具有视觉功能的大型语言模型 (LLM) 来读取屏幕截图、检查图表或回答有关照片的问题，则需要正确构建请求正文。本指南仅涵盖图像输入，这意味着模型会读取您提供的图片，而不是生成或编辑图片。 图案很简单。向我们的模型发送一条内容数组包含文本部分和 `image_url` 部分的聊天消息：任何带有图像输入的 slug（例如 `anthropic/claude-opus-4.8`、`google/gemini-3-flash-preview`）。可以自由交换它，因为请求正文是相同的。 基本请求：将图像附加到聊天通话中 该请求是一条用户消息，其内容数组中有两部分：文本部分和“image_url”部分。本指南的其余部分基于此请求。 消息内容数组 纯文本聊天将“内容”作为纯字符串发送。当您添加图像时，“content”变成了类型化对象的数组： `{ , : [ { }, { } } ] }` 这里的顺序很重要，所以把文本部分放在第一位。这就是我们解析数组的方式。如果您的用例确实需要在任何文本之前引用图像，请将该框架移至系统提示中，而不是尝试对内容数组重新排序。 Base64 数据 URL 与托管图像 URL：何时使用哪个 `image_url.url` 字段接受两种形状：普通的公共 HTTP(S) 链接，或格式为 `data:image/jpeg;base64,\u003cencoded-bytes\u003e` 的 Base64 数据 URL。使用哪一个取决于文件已经存在的位置。 如果图像已托管在公共位置、CDN、带有签名链接的 S3 存储桶或您自己的服务器，请传递 URL。请求保持较小，提供者自行获取字节。 如果图像是本地的，或者根本不应该有公共 URL，例如用户上传的 ID 或内部文档，请将其编码为 base64 并将其放入请求中。请求变得更大，上传时间更长，但文件仅通过 API 调用本身离开您的系统。 Base64 还有第二个优点。托管 URL 可能会因访问控制、区域阻止或过期的签名 URL 而失败。当字节已经在请求中时，这些失败就不会发生。任一格式都支持 PNG、JPEG、WebP 和 GIF。 cURL、Python 和 TypeScript 中的可运行示例 相同的请求，三种语言。模型之间唯一改变的行是“MODEL”。 cURL（托管 URL） `curl https://openrouter.ai/api/v1/chat/completions \\ -H \\ -H \\ -d'{ : [ { : [ { ) -\u003e 字符串: 与开放（路径， ) 作为 f: b64 = base64.b64encode(f.read()).decode( ) 返回 f 型号= # 将这一字符串替换为任何视觉模型 响应 = requests.post( , 标题={ ：f }, json={ ： 模型， : [{ , : [ { }, { : to_data_url( )}}, ], }], }, ) 打印（resp.json（）[ ][0][ ])` TypeScript（本地文件→base64） `导入 { readFile } 来自 ; 常量模型 = ; // 仅更改此以交换模型 const 字节 = 等待 readFile( ); const dataUrl = `data:image/jpeg;base64,${bytes.toString( )}`; const res = 等待获取（ , { 方法： , 标题：{ 授权：`承载${process.env.OPENROUTER_API_KEY}`， , }, 正文：JSON.stringify({ 型号： 型号， 消息：[{ 角色： , 内容： [ { 类型： ， 文本： }, { 类型： , image_url: { url: dataUrl } }, ], }], }), }); const 数据 = 等待 res.json(); console.log(data.choices[0].message.content);` 选择视觉模型 OpenRouter 上的每个视觉模型都采用相同的请求形状。要切换模型，请更改“模型”字段并保持其他所有内容不变。这使您可以在不更改集成的情况下比较模型。 是什么让模型具有视觉能力 并非目录中的每个模型都可以读取图像。当一个模型将文本模型与图像编码器配对时，它就可以被称为视觉语言模型（VLM），让它在标记旁边接收像素。在 OpenRouter 上，您可以直接检查这一点：模型的架构如果支持图像输入，则会在“input_modalities”下列出“image”。将“image_url”部分发送到未列出它的模型，请求将失败。首先检查目录。 成本、上下文窗口以及每个模型的优势 这些模型的请求形状相同，但模型的行为不同。价格、上下文窗口、延迟以及模型处理 OCR、图表或一般场景理解的能力都各不相同。在您决定使用某个模型之前，请根据您的实际图像测试候选模型。 ModelInput $/M tokensContext适合`anthropic/claude-opus-4.8`$5.001M密集文档，对图表/表格进行仔细推理`anthropic/claude-sonnet-5`$2.001M以较低成本平衡文档理解`google/gemini-3-flash-preview`$0.501M高容量屏幕截图和一般问答，低延迟`google/gemini-2.5-flash`$0.301M廉价批量OCR和字幕`qwen/qwen3-vl-235b-a22b-instruct`~$0.26256K开放式OCR和多语言文本提取`meta-llama/llama-4-scout`~$0.101.3M开放式通用视觉，自托管友好 价格和背景窗口随着模型的变化而变化。将此表视为说明性的，并从 ] 中提取实时数据 视力=[米[ ] 代表模型中的 m 如果 以米为单位[ ]] print(vision) # 接受图像输入的模型` 由于所有请求正文都是相同的，因此您可以在请求时从此列表中选择任何模型。按价格、上下文窗口或应用程序关心的任何内容对其进行排序，而不是预先对一个模型进行硬编码。 发送多张图像和长文档 一个请求中包含多个图像 每个请求不限于一张图像。根据需要将尽可能多的“image_url”部分添加到内容数组中。这是处理前后比较、多页扫描或同时涵盖多个图表的问题的方式： `{ } }, { } } ] }` 实际限制：图像数量、分辨率和令牌成本 没有通用的上限。每个提供商和每个模型都设置限制。每个请求几个图像通常没问题，但在一次发送数十个图像之前请检查特定模型的端点页面。每个图像都会增加标记，因此成本会随着图像数量和分辨率的增加而增加，尤其是当您发送完整的扫描文档时。 发送前何时缩小或预裁剪 收据的手机照片通常宽 4000 像素。没有任何模型需要那么高的分辨率来读取底部的总数。将图像缩小到文本仍清晰可见的最小尺寸。如果您已经知道图像的哪一部分很重要，请裁剪到该区域。这两个步骤都降低了代币成本。裁剪也往往会提高准确性，因为它删除了模型本来必须处理的视觉内容。 图像标记化的工作原理 图像被分割成补丁，转换为嵌入，然后作为令牌进行处理，因此更高的分辨率意味着更多的令牌和更高的成本。这是它的工作原理。图像编码器（通常是视觉变换器）将图像切割成固定大小的补丁网格。每个补丁都被转换为一个嵌入，即表示该图像切片的向量。这些嵌入作为标记传递到语言模型，并与文本标记混合在一起。该模型永远不会看到原始像素。它看到补丁嵌入。 结果很简单。更多像素意味着更多补丁，更多补丁意味着您的账单上有更多代币。缩小图像的尺寸会减少编码器生成的补丁数量。给定图像的确切花费多少代币因提供商而异，因此如果您需要精确的数字，请检查特定模型的端点页面。 多模式 RAG：检索包含图像的文档 多模式 RAG 将图像、图表和扫描页面与文本一起索引，因此检索可以返回视觉内容并在回答时将其传递给视觉模型。它解决了这个问题：大多数真实文档都不是纯文本。季度报告的关键数字可能只出现在条形图中。纯文本检索管道依赖于 OCR，它经常错误地读取图表或跳过图表。如果您的索引从未捕获过该视觉内容，则以后检索将无法找到它。 索引策略A：将图像总结为文本，然后嵌入 在索引时，通过 VLM 发送每个图表、图形或扫描页面并要求提供文本摘要。将该摘要嵌入到正常的文本嵌入模型中，并保留指向原始图像的指针。优点是检索完全基于文本，因此它会放入您已经运行的任何向量存储中。权衡是检索质量取决于摘要。 VLM 在索引时遗漏的任何内容以后都无法找到。 索引策略 B：原生多模态嵌入 跳过摘要步骤并直接嵌入图像，使用多模态嵌入模型将图像和文本放置在同一向量空间中。然后，文本查询可以直接匹配图像。您可以通过这种方式保留更多视觉细节，但您需要堆栈中的多模式嵌入模型和可以保存其输出的向量存储。当您想要重用现有工具并且文档相对简单时，请使用策略 A。当图表和数字包含摘要可能会丢失的细节时，请使用策略 B。 组装提示：将检索到的文本和图像输入 VLM 两种索引策略的答案步骤是相同的。获取最匹配的文本和图像块，然后使用问题、检索到的文本和检索到的“image_url”部分构建单个内容数组： `def 答案（问题，检索）： 内容=[{ ： 问题}] 对于检索到的 r： 如果 r[ ] == : 内容.追加（{ ]}) else: # 图像块 内容.追加（{ , ]}}) 返回请求.post( , 标题={ }, json={ : [{ ： 内容}]}， ).json()` 最小的端到端代码草图 完整的管道的工作原理如下：将源文档解析为文本和图像块，使用摘要或多模式嵌入对每个块进行索引，检索传入查询的顶部匹配项，组装上面显示的多模式提示，并使用视觉模型进行回答。只有解析、索引和检索步骤是 RAG 特有的。最终的答复电话与本指南顶部显示的请求相同。如果您需要结构化数据而不是散文的输出，请添加工具调用。 这种方法不适合什么\n- 实时视频理解。不要将每一帧流式传输到聊天请求中。您可以通过图像数组发送一些采样帧，但这是一种解决方法，而不是视频管道。真正的视频工作需要经过深思熟虑的帧采样、对帧计数的硬性限制以及该端点不适合的延迟处理。\n- 低分辨率下的像素精确或密集小文本 OCR。通用 VLM 可能会漏掉源图像中非常小的字符。如果每个字符都必须正确，请先进行升级或裁剪，或者改用专用的 OCR 管道。\n- 生成或编辑图像。本指南仅涵盖图像输入，这意味着模型会读取您提供的图片。创建新图像或修改现有图像使用不同的请求形状。请参阅我们的 \u003ca href=", "zh": true}, {"seq": 3, "title": "谁真的需要SOTA模型？OpenRouter数据显示84%token来自非前沿模型", "source": "Tomer Tunguz 博客（VC 分析）", "summary": "OpenRouter数据显示，84%的模型token并非来自SOTA模型，用户最常用的六款模型性能约为前沿模型的77%，成本仅为Claude Fable 5的2.5%。8月10日当周，六款模型承载了80%流量，混合价格约$0.50/百万token，而Fable 5为$20。最佳开源模型性能已从一年前的48%提升至前沿模型的80%，企业正转向更小、微调或开源模型以优化性价比。", "url": "https://www.tomtunguz.com/model-release-exhaustion", "permalink": "https://aihot.virxact.com/items/cmstlse4t0bhbro0x08idymf2", "publishedAt": "2026-08-14T00:00:00.000Z", "exact": true, "content": "\u003e 但 OpenRouter 上 84% 的代币都不是最先进的。 事实上，用户选择生成绝大多数代币的六种模型提供了约 77% 的前沿性能。它们的成本是《克劳德寓言 5》的 2.5%。 6 种型号占据了 8 月 10 日当周交易量的 80%。它们的混合价格为每百万代币 0.50 美元，而《神鬼寓言 5》的价格为 20 美元。 Ramp 的数据显示买家具有价格弹性。 《神鬼寓言 5》以大约 10 美元/百万代币的价格在推出一个月后占据了 Anthropic 代币的 6% 和 Anthropic 支出的 11%。 GPT-5.6 Sol 是 OpenAI 最昂贵的主线层，持有 OpenAI 代币的约四分之一。 \u003ca href=", "zh": true}, {"seq": 4, "title": "Databricks 如何在数据仓库中使用 AI_Functions：主要用例解析", "source": "Databricks：Blog（RSS）", "summary": "Databricks 探讨在数据仓库中应用 AI_Functions 的主要场景，帮助组织在结构化数据之外处理非结构化数据。文章聚焦于如何通过该功能将 AI 能力直接集成到 SQL 工作流中，以扩展数据仓库的分析边界。具体用例与实现细节以原文为准。", "url": "https://www.databricks.com/blog/using-aifunctions-your-data-warehouse-top-use-cases", "permalink": "https://aihot.virxact.com/items/cmstgucbq067zro0xkuon9ioi", "publishedAt": "2026-08-14T21:30:00.000Z", "exact": true, "content": "您可以在纯 SQL 中运行六个 AI 用例 - 替换您现在使用的笔记本、API 和管道。作者：斯里坎特·达斯和伊斯梅尔·马赫卢夫 在大多数组织中，数据仓库保存结构化数据，而非结构化数据保存在数据湖中。这对于分析工作负载来说非常有效，因为分析工作负载会大规模消耗结构化数据，日复一日地为已知的报告主体提供服务。然而，人工智能工作负载需要不同的输入。\n\nAI 模型通常需要解析非结构化数据（例如评论、支持票证和 PDF），并将它们与结构化数据结合起来以训练、构建和服务模型。因此，想要了解支持票的情绪的分析师必须将行发送到服务，等待预测，然后手动将它们缝合回表中。它很慢，当模式更改时就会中断，并且会引入不必要的安全和治理风险。AI 函数通过将 AI 直接引入您的数据来解决这个问题，而不是将您的数据移动到单独的 AI 环境中。您可以在标准 SQL 查询中调用模型，从而将整个推理过程保留在现有管道和 Unity Catalog 治理中。这种架构从根本上改变了您在数据仓库中使用 AI 的方式： SELECT语句，可以用AI构建。\n\nDatabricks 管理复杂性 - 规划、并行化和重试，因此您不必担心集群管理或外部编排。在数百万行上运行推理就像在一行上运行推理一样容易，相同的查询无需重写即可扩展。system.billing.usage 与标准 Databricks SQL 仓库成本一起使用。ai_classify、ai_extract、ai_translate 和 ai_parse_document - 您可以利用为特定作业量身定制的模型，而不是为通用推理支付过高的费用。\n\n您可以在 Databricks 上的任何位置使用这些 AI 功能，包括笔记本、Lakeflow Spark 声明性管道和工作流。但在这篇文章中，我们将重点关注专门从 Databricks Lakehouse 调用这些函数。下面的用例将向您展示如何将这些 AI 功能集成到需要将数据仓库中的结构化数据与非结构化数据相结合的工作负载中，这些数据可以来自数据仓库外部，也可以通过支持 GenAI 的功能自行生成。ai_parse_document 充当摄取桥梁，将原始二进制文件内容（例如 PDF 或图像）转换为可读文本。解析后，ai_extract 会处理特定键和值的粒度提取。这种组合方法消除了对脆弱的自定义 OCR 管道或第三方解析服务的需求，这些管道或第三方解析服务经常在架构更改期间中断。\n\n在此用例中，我们将 ai_parse_document 指向包含发票的 Databricks 卷。解析这些发票后，AI 解析文档会生成 JSON 格式的结果，然后将其传递给 ai_extract 函数，在该函数中我们定义要从这些发票中提取的实体。结果是一个结构化表，其中包含我们想要从发票中提取的字段。现在，沿袭从原始 PDF 运行到单个查询计划中提取的行。人们为此手动构建的桥梁 - Python OCR 服务、LLM 调用和 JSON 扁平化步骤 - 全部都崩溃到查询中。\n\n演示笔记本：文档智能 ai_classify 函数执行零样本分类，将自由文本反馈映射到一组特定的用户定义标签，而无需模型训练。此过程将混乱的非结构化文本转换为受管理的可查询列，使情绪和主题数据立即可用于 BI 仪表板和执行报告。在此示例中，我们希望将青铜.nps_responses 表中的客户评论分类为正面、负面、中立和混合。演示笔记本：情感分析 借助 ai_translate，您可以直接在查询层内将多语言数据规范化为单一目标语言。这可以防止数据孤岛和碎片，允许所有下游分析（包括分类和提取）同时对整个全球数据集进行操作，而不是处理纯英文切片。\n\n在此示例中，我们从不同的客户评论中提取情感，然后将其翻译成英语。演示笔记本：翻译和规范化 ai_classify 专注于运营效率，将支持票证或通话记录等自由格式输入转换为可操作的类别。通过在摄取时识别传入反馈的意图和紧迫性，它可以自动、智能地路由到适当的团队或自动响应系统。在下面的用例中，我们从表中获取不同的支持票证，然后使用 ai_classify 来确定用户意图和票证的紧迫性。\n\n演示笔记本：分类和路由 ai_extract 函数旨在从长格式内容（例如销售电话记录）中挖掘半结构化信息，并将叙述性文本转换为离散的结构化字段。通过将定性信息直接放入 BI 工具中，有效地将口头对话转化为可查询的指标（例如交易阶段和风险标记），从而提供了巨大的价值。在此用例中，我们正在挖掘长记录，以确定下一步、交易阶段、风险标记和风险原因，以便销售人员可以对生成记录的会议结果采取行动。演示笔记本：销售电话提取 ai_query 是最通用的函数，也是其余函数的基础：它允许您向您有权访问的任何 Databricks 托管的基础模型服务点发送提示，并且它将返回每行的模型答案。\n\n在此用例中，我们可以使用 ai_query 为虚构的 gold.renewal_signals 表中的每个客户帐户起草续订外展电子邮件，该表向我们显示哪些帐户已准备好续订。因为您编写了提示，所以它可以执行模型可以执行的任何操作，这就是为什么它可以处理更具体的函数无法处理的情况。演示笔记本：生成绘图 穿过所有六个的线程都是相同的。人工智能与仓库的其他部分在同一位置运行：一个平台、一种治理模型、一张账单、一组管道。现有 SQL ETL 的任何一行都可以选择 AI 步骤，而无需建立一个系统来托管它，并且用于翻译、评分或分类数据的每个 Python 脚本都可以成为单行替换的候选者。\n\n所以从一栏开始。选取当前服务最脆弱的工作负载，将其重写为 SELECT，在 10,000 行上运行，然后读取返回的内容。经过快速冲刺后您就会知道它是否适合 - 并且您将不再支付仅仅为了使用它而传送数据的额外开销。每个笔记本都附带内联示例数据、逐步的 SQL 以及您应该期望的输出。", "zh": true}]}]};
function pad(n){return n<10?"0"+n:""+n;}
function toBeijingHuman(iso, ref, exact){
  const d=new Date(iso); const bj=new Date(d.getTime()+8*3600*1000);
  const Y=bj.getUTCFullYear(),M=bj.getUTCMonth()+1,D=bj.getUTCDate();
  const h=bj.getUTCHours(),m=bj.getUTCMinutes(); const hh=pad(h),mm=pad(m);
  if(!exact) return M+"月"+D+"日";
  const [rY,rM,rD]=ref.split("-").map(Number);
  if(Y===rY&&M===rM&&D===rD) return "今天 "+hh+":"+mm;
  const yest=new Date(rY,rM-1,rD); yest.setDate(yest.getDate()-1);
  if(Y===yest.getFullYear()&&M===yest.getMonth()+1&&D===yest.getDate()) return "昨天 "+hh+":"+mm;
  return M+"月"+D+"日 "+hh+":"+mm;
}

function linkify(escaped){
  if(!escaped) return escaped;
  var re=/(\[[^\]]+\]\((https?:\/\/[^)\s]+)\))|(https?:\/\/[^\s<>"'）】」』，。、；：！？]+)/g;
  return escaped.replace(re, function(m, g1, g2, g3){
    if(g2!==undefined){
      var label=m.substring(m.indexOf('[')+1, m.indexOf(']'));
      return '<a class="r-link" href="'+g2+'" target="_blank" rel="noopener noreferrer">'+label+'</a>';
    }
    if(g3!==undefined){
      return '<a class="r-link" href="'+g3+'" target="_blank" rel="noopener noreferrer">'+g3+'</a>';
    }
    return m;
  });
}
var _IMG_RE=/!\[([^\]]*)\]\(([^)\s]+)\)/g;
function renderRich(text){
  return (text||"").split(/\n{1,}/).map(function(p){
    p=p.trim(); if(!p) return '';
    var out=''; var last=0; var m; _IMG_RE.lastIndex=0;
    while((m=_IMG_RE.exec(p))!==null){
      out+=linkify(escapeHtml(p.slice(last,m.index)));
      var cap=(m[1]||'').trim()||'图片';
      out+='<span class="r-img-cap">🖼 '+escapeHtml(cap)+'</span>';
      last=_IMG_RE.lastIndex;
    }
    out+=linkify(escapeHtml(p.slice(last)));
    return '<p>'+out+'</p>';
  }).join("");
}
function openReader(it){
  const r=document.getElementById("reader");
  const content=(it.content||"").trim();
  const body=document.getElementById("readerBody");
  if(content.length>0){
    body.innerHTML=renderRich(content);
  }else{
    const sum=(it.summary||"").trim();
    if(sum){
      // 来源站点多为付费墙 / 登录墙 / 反爬限制，无法镜像全文；展示已本地存档的中文摘要兜底
      body.innerHTML='<div class="r-fallback">⚠️ 该条新闻的<b>全文镜像暂不可用</b>（来源站点可能为付费墙 / 登录墙 / 反爬限制，或原文已失效）。下方为已<b>本地存档的中文摘要</b>，可正常查看；完整原文请点击右下角「查看原文 ↗」。</div>'+
        '<p class="r-summary">'+linkify(escapeHtml(sum))+'</p>';
    }else{
      body.innerHTML='<p class="r-empty">暂未获取到该条新闻的全文镜像与摘要。'+(it.url?'可点击右下角「查看原文 ↗」前往原始报道。':'')+'</p>';
    }
  }
  document.getElementById("readerTitle").textContent=it.title;
  document.getElementById("readerSource").textContent=it.source;
  const link=document.getElementById("readerLink");
  if(it.url){link.href=it.url;link.style.display="";}else{link.style.display="none";}
  r.hidden=false;document.body.style.overflow="hidden";
}
function closeReader(){const r=document.getElementById("reader");r.hidden=true;document.body.style.overflow="";}
document.getElementById("reader").addEventListener("click",function(e){if(e.target===this)closeReader();});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeReader();});
</script>
