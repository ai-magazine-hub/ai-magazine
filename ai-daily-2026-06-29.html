const DATA = {"meta": {"reportDate": "2026-06-29", "reportDateHuman": "2026年6月29日", "weekday": "星期一", "total": 7, "source": "AI HOT", "sourceUrl": "https://aihot.virxact.com", "generatedAt": "2026年07月29日 04:49"}, "sections": [{"label": "模型发布/更新", "color": "#4f46e5", "items": [{"seq": 1, "title": "Grok 4.5 私测于 SpaceX 和 Tesla，性能接近 Opus", "source": "X：Elon Musk (@elonmusk, xAI)", "summary": "Grok 4.5，基于我们的1.5T V9基础模型，并在补充训练中加入Cursor数据，现已在SpaceX和Tesla进入私测。初步评估显示其性能接近，或许超越Opus。 强化学习仍在持续显著改进模型，Grok Build工具链也在日益完善。 所有参与者的出色工作！ 今年，@SpaceX 将每月发布完全从头训练的新模型。", "url": "https://x.com/elonmusk/status/2071184354756477041", "permalink": "https://aihot.virxact.com/items/cmqxo43c90009slwfmy4wm3z3", "publishedAt": "2026-06-29T00:00:00.000Z", "exact": false, "content": "Grok 4.5, based on our 1.5T V9 foundation model, with Cursor data added in supplemental training, is now in private beta at SpaceX & Tesla. Early evals show performance close to, perhaps exceeding Opus.\nRL is continuing to significantly improve the model, and the Grok Build harness gets better every day.\nNice work by all those involved!\nCompletely trained from scratch new models will be released by @SpaceX every month this year.\n- You’re model is not yet banned, so that means it’s not that good yet. 🫡 let us know when you’re staggered to release. Then it’s the real deal.\n- 加入对话"}, {"seq": 2, "title": "新浪开源VibeThinker-3B：推理可压缩，事实知识不能", "source": "The Decoder：AI News（RSS）", "summary": "新浪发布仅3B参数的VibeThinker-3B，在AIME26等数学编程基准上持平DeepSeek V3.2等大200–333倍的模型，LiveCodeBench超越所有20B以下模型，LeetCode竞赛解决123/128题超过GPT-5.2、Kimi K2.5等。但知识密集型GPQA-Diamond大幅落后。模型基于阿里Qwen2.5-Coder-3B，经SFT、强化学习、自蒸馏等多阶段后训练。研究提出“参数压缩-覆盖假说”：逻…", "url": "https://the-decoder.com/sinas-open-model-vibethinker-3b-aims-to-show-reasoning-compresses-well-but-factual-knowledge-doesnt", "permalink": "https://aihot.virxact.com/items/cmqxiel9h004ysl50umg2c011", "publishedAt": "2026-06-29T00:00:00.000Z", "exact": false, "content": "\u003e\n\n关键要点\n\n- 微博新推出的 VibeThinker-3B 仅有三十亿参数，但在数学和编程基准测试中，其表现却能与体积大出 333 倍的顶尖模型相媲美。\n- 这一性能得益于对阿里巴巴基础模型进行的多阶段后训练。然而，在需要广泛事实知识的任务上，这个小模型则远远落后。\n- 研究人员得出结论：结构化逻辑推理依赖的模式较少，因此压缩效果好；而广泛的世界知识仍然需要大模型来承载。\n一个仅有三十亿参数的中文语言模型，在数学和编程任务上有时能与体积大百倍的模型匹敌。其背后的研究人员提出了一种关于 AI 能力如何构成的假说。\n\n微博母公司新浪发布了一款小型语言模型，在困难的数学和编程任务上与当今顶尖模型竞争。根据一份技术报告，VibeThinker-3B 在 AIME26 等竞争性基准测试中，表现与 DeepSeek V3.2 和 Kimi K2.5 相当。这两款模型的参数数量是其 200 到 333 倍。\n\n新浪将这款模型定位为一次实验，旨在探究一个模型究竟需要多少算力才能跻身顶尖水平。其前代产品 VibeThinker-1.5B 于 2025 年 11 月发布。新版本则更进一步，探讨一个小模型能否达到真正的顶级性能，而不仅仅是“在其尺寸范围内表现良好”。\n 在六个数学和编程基准测试中，这款 3B 模型（橙色）的表现落在包括 Gemini 3 Pro、GLM-5 和 Claude Opus 4.5 在内的五款当前顶尖模型的性能区间内。| 图片来源：新浪微博\n\n逻辑可以缩放，事实知识则不能\n\n结果呈现出两种不同的情况。在具有明确可验证解决方案的结构化任务上，例如数学奥林匹克竞赛或编程挑战，VibeThinker-3B 的表现与 GLM-5 或 Gemini 3 Pro 等模型相当。在 LiveCodeBench 上，它击败了所有参数低于 200 亿的其他模型。\n\n事实知识则是另一回事。在知识密集型的 GPQA-Diamond 基准测试中，该模型远远落后于其体积大得多的竞争对手。\n 尽管体积小数百倍，VibeThinker-3B 在 IMO-AnswerBench 上的表现仍几乎与 DeepSeek V3.2、GLM-5 和 Kimi K2.5 持平。| 图片来源：新浪微博\n为了排除数据污染的可能性，研究团队让该模型参加了2026年4月底至5月底期间举办的LeetCode竞赛，此时训练已经结束。VibeThinker-3B在首次尝试中就解决了128道题目中的123道。这一成绩使其超越了GPT-5.2、Qwen3-Max、Kimi K2.5和Claude Opus 4.6。它仅落后于GPT-5.3-Codex、Gemini 3.1 Pro和Gemini 3 Flash，但差距并不大。\n\n后训练承担了主要工作\n\nVibeThinker-3B基于阿里巴巴的Qwen2.5-Coder-3B构建。新浪的贡献在于后训练阶段，即通用预训练（在大规模数据集上进行）之后的所有环节。根据报告，正是后训练让一个3B参数的模型接近了顶尖水平。\n\n后训练分阶段进行。首先，模型通过监督式微调学习广泛的任务，涵盖数学、编程和通用对话。随后，它针对困难的多步骤推理问题进行专门优化。\n\n接下来是强化学习，依次应用于数学、编程和STEM领域。然后通过知识蒸馏将每个阶段习得的技能整合到单一模型中。最后一步确保模型能更好地遵循指令。\n\nKey Points\n\n- Weibo's new VibeThinker-3B has just three billion parameters but matches top models up to 333 times its size on math and coding benchmarks.\n- The performance comes from multi-stage post-training applied to an Alibaba base model. On tasks that require broad factual knowledge, however, the small model falls well behind.\n- The researchers conclude that structured logical reasoning relies on few patterns and compresses well, while broad world knowledge still needs large models.\nA Chinese language model with just three billion parameters sometimes matches models a hundred times larger on math and coding tasks. The researchers behind it have developed a hypothesis about how AI capabilities are structured.\n\nWeibo's parent company Sina has released a small language model that competes with today's top models on hard math and coding tasks. According to a Across six math and coding benchmarks, the 3B model (orange) falls within the performance range of five current top models including Gemini 3 Pro, GLM-5, and Claude Opus 4.5. | Image: Sina Weibo\n\nLogic scales down, factual knowledge doesn't\n\nThe results tell two different stories. On structured tasks with clearly verifiable solutions, like math olympiads or programming challenges, VibeThinker-3B matches models like GLM-5 or Gemini 3 Pro. On LiveCodeBench, it beats every other model under 20 billion parameters.\n\nFactual knowledge is a different story. On the knowledge-heavy GPQA-Diamond benchmark, the model falls well behind its much larger competitors.\n VibeThinker-3B nearly matches DeepSeek V3.2, GLM-5, and Kimi K2.5 on IMO-AnswerBench despite being hundreds of times smaller. | Image: Sina Weib\nTo rule out data contamination, the team had the model compete in LeetCode contests held between late April and late May 2026, after training wrapped up. VibeThinker-3B solved 123 out of 128 problems on the first try. That puts it ahead of GPT-5.2, Qwen3-Max, Kimi K2.5, and Claude Opus 4.6. It trails only GPT-5.3-Codex, Gemini 3.1 Pro, and Gemini 3 Flash, but not by much.\n\nPost-training does the heavy lifting\n\nVibeThinker-3B builds on Alibaba's Qwen2.5-Coder-3B. Sina's contribution is the post-training, everything that happens after generic pre-training on large data sets. According to the report, that's what brings a 3B model close to the top performers.\n\nPost-training happens in stages. First, the model learns a broad range of tasks through supervised fine-tuning, covering math, coding, and general dialogue. Then it gets tailored for hard, multi-step reasoning problems.\n\nReinforcement learning follows, applied sequentially for math, programming, and STEM. Self-distillation then consolidates the skills from each phase into a single model. A final step makes sure the model better follows instructions.\n It's the post-training that enables a performance leap. Two-stage supervised fine-tuning, multi-stage reasoning RL for math, code, and STEM, plus a final instruction phase for prompt adherence. | Image: Sina Weibo\nDuring fine-tuning, the team deliberately builds up a wide variety of solution paths. Reinforcement learning then strengthens the ones that work. The argument is that performance comes from training methods, data quality, and reliable validation signals rather than from more parameters.\n\nWhat this means for how AI capabilities work\n\nBased on these results, the authors propose what they call the\n Different AI capabilities have different structures and need different numbers of parameters.\n\nLogical reasoning, like solving a math problem step by step, relies on a few recurring patterns. Searching, checking conditions, correcting errors, combining intermediate results. That kind of skill can be packed into a compact core. World knowledge works differently. Answering open-ended questions across many topics requires broad coverage, meaning lots of parameters storing lots of facts.\n\nThis reframes what small models are for, the researchers say. They're not just cheap, lightweight versions built for budget inference but an independent research path running parallel to traditional scaling logic. Where tasks are verifiable and have clear solution structures, parameter count isn't the bottleneck anymore.\n\nVibeThinker-3B is openly available on \u003ca href="}]}, {"label": "产品发布/更新", "color": "#059669", "items": [{"seq": 3, "title": "Wayfinder Router：在本地和托管的大语言模型之间进行确定性查询路由", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "summary": "Wayfinder Router 通过分析提示词的结构（长度、标题、列表、代码）和措辞（证明、数学、硬约束），在微秒级完成路由决策，完全离线且无需调用其他模型。默认仅使用结构特征，词汇线索因盲测未泛化而默认为关闭。对比依赖模型调用的路由器（如 RouteLLM、NotDiamond），它避免了延迟、成本和随机性。用户可在自有数据上校准评分阈值。支持任何 OpenAI 兼容 API（含 Ollama、Anthropic、Groq、vLL…", "url": "https://github.com/itsthelore/wayfinder-router", "permalink": "https://aihot.virxact.com/items/cmqy1fj3003cislwfljtykjvx", "publishedAt": "2026-06-29T00:00:00.000Z", "exact": false, "content": "\u003e\n一种快速、离线的“难易判断”机制，针对每条提示词给出确定性评分，无需调用模型。将简单问题路由至小型/本地模型，复杂问题路由至大型模型，也可在其后端组合任意模型路由器。\n   无需调用模型来决定路由 确定性且完全离线   基于自有数据进行校准 自带密钥，自行托管\nWayfinder 对提示词的结构（长度、标题、列表、代码）和措辞（证明、数学、硬约束）进行评分，生成 0.0–1.0 的复杂度分数，然后将简单问题路由至小型/本地模型，复杂问题路由至大型模型。其决策本身就是产品：确定性、亚毫秒级、完全离线——无需 API 密钥、无需网络、无需调用模型。路由目标由你决定：可以是两层、N 层阶梯，或在其后端组合的模型路由器。\n\n廉价提示词留在本地，复杂提示词交给昂贵模型，这样你就不必再为“总结这段内容”和“修正我的拼写错误”支付顶级模型的价格。\n\n对比分析\n\n大多数路由器通过调用模型来做决策：训练好的分类器、大语言模型裁判或托管 API。这给本应节省成本的环节增加了延迟、成本和随机性。Wayfinder 则通过读取结构和措辞来决策，因此判断过程是免费的，且每次结果一致。\n    路由器 决策方式 需要调用模型？ 自行托管 可校准    Wayfinder 确定性结构评分 否 是 是   RouteLLM 训练好的分类器（偏好数据） 是 是 需重新训练   NotDiamond / Martian 学习型、托管式 是 否 通过平台   OpenRouter（自动） 托管式自动路由器 是 否 —   Bifrost / LiteLLM 提供商网关（非复杂度路由） 否 是 不适用\n最后两行的网关（OpenRouter、Bifrost、LiteLLM）解决的是另一个问题：根据价格、可用性和故障转移，由哪个提供商处理调用。Wayfinder 解决的是提示词应归入哪个层级：廉价还是昂贵，按难度划分，离线决策。两者可以组合使用。运行 Wayfinder 来做廉价与昂贵的判断，再通过底层的网关来对接提供商。\n\nWayfinder 追求的不是顶尖的准确率数字——它提供的是你可以离线运行、并根据自身流量进行调优的路由决策。默认情况下，它仅对提示词结构进行评分；它也能读取词汇线索（如证明、数学、约束条件），但这些功能默认是关闭的，因为一项双盲测试表明，其性能提升并不具备泛化能力（它只能捕捉约 20% 未见过的困难提示词，并且输给了一个简单的词频基线）。一个难度纯粹来自语义层面的提示词（比如一段微妙的代码片段，或“第 100 个质数是多少？”），在结构上并无明显特征，此时语义路由器会胜出。基准测试（make benchmark）展示了它在哪些方面优于或劣于诚实的基线模型和完美的预言机；FAQ 则给出了直白的版本——包括它在 RouterBench 的短小但困难的项目上表现不比随机好，以及为什么你仍然会运行它。\n\n试试演示（无需密钥）\n\n两种方式让你亲自查看路由决策——无需 API 密钥，无需模型，无需任何网络连接。\n\n在你的终端中——使用 Wayfinder 调色板进行以决策为先的聊天。终端聊天功能已包含在默认安装中，因此无需额外添加任何东西——或者通过 uvx 无需安装即可运行：\n\n`uvx wayfinder-router chat --dry-run      # zero install, zero keys\n# or:  pip install wayfinder-router && wayfinder-router chat\n`\n每一轮对话都会显示其路由去向（● 本地 / ◆ 云端）、结构评分及原因（/why），以及与始终使用云端相比的累计节省。使用 /init 可在不离开聊天的情况下设置模型，/route · /local · /cloud 可强制指定某一轮的路由，并且对话会在不同会话间持久保存（/threads）。\n\n在你的浏览器中——带有实时阈值滑块的网页聊天界面：\n\n`pip install\n\nwayfinder-router webchat --dry-run\n# opens http://127.0.0.1:8088/demo\n`\nwebchat 是 serve（网关及其 /demo 页面；支持 --no-open、--port、--host 0.0.0.0、--dry-run 参数）的一个轻量级启动器；serve 是无头命令。在无配置的情况下，它仅作决策使用（--dry-run），因此你可以零设置进行尝试；要获得真实回复，请运行 wayfinder-router init 来搭建 [gateway.models]（然后运行 wayfinder-router doctor 确认你的密钥已解析）——请参阅快速入门指南。\n\n兼容任何 OpenAI 兼容的 API\n\nWayfinder 会将每次调用转发至符合 OpenAI 风格的 `/chat/completions` 端点——因此，如果你的提供商支持该协议（大多数都支持），它就能直接运行。一个层级（tier）包含一个 `base_url`、一个模型名称，以及在请求时从环境中读取的一个密钥；无需 SDK，也无需为每个提供商编写代码。你可以将免费的本地模型与托管模型配对使用，或者运行两个云端层级。\n\n……外加 Groq、Together、OpenRouter、Fireworks、DeepSeek，以及本地服务器（vLLM、LM Studio、llama.cpp）——以及任何接受 Bearer 密钥的、兼容 OpenAI 的端点。\n\n在桌面版 Chat 中使用 ChatGPT Codex 账户（需主动选择加入）\n\n原生桌面应用可以通过符合条件的 ChatGPT Codex 账户路由 Chat 请求，而无需 OpenAI 平台 API 密钥。这是一个独立的 codex-app-server 提供商——并非用于任意 OpenAI API 调用的 Bearer token——并且它永远不会被默认启用为路由。\n\n将该路由添加到桌面网关配置中，重启网关，然后通过“设置”→“账户”登录：\n\n`[gateway.models.chatgpt-sol]\nprovider =\n\ncontext_window = 1050000\n`\n只有当该模型由独立的 Codex 运行时（runtime）通告时，账户路由才会出现在 Chat 中。登录不会改变“自动”模式或任何现有的路由阶梯。请求由托管服务处理并离开 Mac；离线模式会禁用该提供商。Wayfinder 接收的是标准化的账户状态和模型名称，绝不会获取账户 token，也不会扩大其凭据代理范围。开发版本可以使用显式选定或同位置部署的辅助程序。发布版本会拒绝未经验证的兄弟可执行文件；只有当其运行时和签名检查通过时，才接受固定的 ChatGPT 应用回退方案。公开发布仍受限于一个固定、已授权、架构正确且经过嵌套签名的辅助程序。完整的边界定义请参阅提供商设计文档。\n\n快速入门\n\n将 Wayfinder 置于你的模型之前。你的应用继续使用 OpenAI API；你只需更改一个 `base_url`。\n\n-\n搭建配置——`init` 命令会写入一个初始的 `wayfinder-router.toml`（无密钥的本地 Ollama → Anthropic 云端）以及一个 `.env.example` 文件，然后检查你的密钥：\n\n`pip install\n\nwayfinder-router init                 # starter config (hybrid preset)\nwayfinder-router init --preset openai # two OpenAI tiers (gpt-4o-mini → gpt-4o)\nwayfinder-router init --preset gemini # two Gemini tiers (gemini-2.5-flash → gemini-2.5-pro)\nwayfinder-router init --interactive   # pick providers/models step by step\n`\n或者，手动在 `wayfinder-router.toml` 中描述你的两个模型：\n\n`[routing]\nthreshold = 0.5            # below -\u003e local, at/above -\u003e cloud\n\n[gateway.models.local]\nbase_url =\n  # optional: fill it from a vault\n`\nWayfinder 从不存储密钥：模型指定一个环境变量（api_key_env），请求时从你的环境中读取该密钥。无需\n任何东西——只需导出变量即可。不想在 shell 中粘贴原始密钥？可以添加一个可选的 api_key_cmd，Wayfinder 会在启动时从你的密钥存储中填充该变量——op read …（1Password）、security …（macOS 钥匙串）、secret-tool …（Linux）、pass/gopass、vault kv get …、aws secretsmanager get-secret-value …、bw、doppler、gcloud secrets …，或任何能输出密钥的命令。密钥仅保存在内存中，绝不会写入磁盘。wayfinder-router doctor 会检测你安装了哪些工具，并给出精确的命令行建议。\n\n-\n设置好你的密钥，然后运行网关。doctor 会在你启动前重新检查配置以及每个模型的密钥是否解析成功（✓ 已设置 / ✗ 未设置）：\n\n`export ANTHROPIC_API_KEY=sk-...     # or OPENAI_API_KEY, per your config\nwayfinder-router doctor             # ✓/✗ per model — is each key set?\nwayfinder-router serve --port 8088\n`\n-\n将你现有的客户端指向它。无需修改代码：\n\n`client = openai.OpenAI(base_url=\n}])\n`\n简单的提示词走本地，困难的走云端，每个响应都会携带 x-wayfinder-router-model 和 x-wayfinder-router-score，让你清楚请求去了哪里。想对某个请求强制指定层级？设置 model=\n）。\n\n检查是否正常运行：\n\n`curl -s localhost:8088/healthz\n# {\n\n`\n分类器是一个拟合的多项逻辑回归模型，对每个模型进行线性评分后取 argmax。你通常使用 `calibrate` 命令生成它，而不是手动编写。\n\n每个 `[gateway.models.\u003cname\u003e]` 配置块将一个路由名称映射到上游 base_url、一个模型以及可选的 api_key_env（环境变量名称，而非密钥本身）。网关是唯一接触密钥或网络的组件；评分器、配置和校准器保持纯净并离线运行。\n\n在你的数据上进行校准\n\n该截断值是一个代理指标，因此需要根据您自身的流量进行调整。`wayfinder-router calibrate` 会读取一个带标签的 JSONL 数据集（`{\n}\n)\n`\n每次响应都会在 `-model` 和 `-score` 头部旁边添加 `x-wayfinder-router-mode`（值为 `scored` / `pinned` / `threshold-override`），方便你查看是哪个通道决定了路由。\n\n通过聊天界面驱动路由（无需分支）\n\n由于模型字段本身就是路由指令，任何兼容 OpenAI 的聊天界面都无需修改代码即可驱动路由：应用原本的模型下拉菜单会变成每个对话的路由选择器（`auto` / `prefer-local` / `prefer-hosted` / 已固定的端点）。网关会在 `GET /v1/models` 中列出这些选项，因此界面可以自动发现它们。\n\n- LibreChat——将 `examples/librechat.yaml` 和 `examples/docker-compose.override.yml` 复制到你的项目目录中，运行 `docker compose up`，然后选择\n 端点即可。\n- Open WebUI——添加一个指向该网关的 OpenAI 连接；它会自动发现路由选项。\n具体配置请参见 `examples/` 目录。标准界面唯一无法实现的是每个对话的实时阈值滑块；这正是 `wayfinder-chat` 分支所增加的功能，而这条无需分支的路径首先验证了其可行性。\n\n查看请求的去向\n\nWayfinder 的控制功能分散在你已有的各种工具中，因此很容易忽略它的运行。以下四个界面可以显示或控制路由：\n    界面 显示内容 位置    模型下拉菜单 路由选择器（`auto` / `prefer-local` / `prefer-hosted` / 已固定的端点） 你的客户端，来自 `GET /v1/models`   响应头部 每次请求的去向及原因（`-model` / `-score` / `-mode` / `-request-id`） 每次响应   调试响应体字段 响应体内的决策信息，需主动启用 请求头部 `X-Wayfinder-Debug: true`   仪表盘 近期决策、按模型统计的计数与评分——仅含元数据，绝不包含提示词文本 GET /router（JSON 格式，路径为 /router/recent）\n该仪表盘与用于调优而非生产流量的 off-path wayfinder-router UI 控制台相互独立。\n\n从反馈中学习\n\n不要猜测路由切分点，而是通过自行判断本地输出与托管输出来学习。循环流程为：收集判断结果、进行校准、自动路由。\n\n通过 A/B 引导流程进行初始化。对于每个样本提示词，wayfinder-router onboard 会同时运行两个分支，并询问哪个结果足够好；答案即为一个标签：\n\n`wayfinder-router onboard prompts.jsonl --arms local,cloud --calibrate \u003e wayfinder-router.toml\n`\n比较结果输出到 stderr；--calibrate 将生成的配置打印到 stdout。每条判断结果都会向反馈日志追加一行 {\n}，该日志本身即为校准数据集，因此日志可直接转化为配置。\n\n如需跳过人工评分，可让 wayfinder-router 自动判断标签。它会运行两个层级，并向自动评判器询问“较便宜的层级是否足够好？”——同样是关于充分性的问题，无需人工介入：\n\n`wayfinder-router judge prompts.jsonl --arms local,cloud --gold gold.jsonl \u003e wayfinder-router.toml\n`\n内置评判器是一个确定性文本比较器，在无法判断时会选择弃权而非猜测。由于错误标签会静默降低在线路由质量，评判器仅在通过信任门控后才会输出配置——这些门控包括：与人工标注的 --gold 集的一致性（Cohen's κ ≥ 0.6）、相比多数基线的折外提升，以及两个分支均有代表性样本。若门控未通过，则会输出混淆矩阵并拒绝生成配置（标签仍会被记录）。传递 --save-comparisons out.jsonl 参数可同时保留原始响应（默认关闭——因其为数据体存储）。\n\n一旦开始自动路由，请通过记录哪个模型实际足够好来保持诚实：\n\n`curl localhost:8088/v1/feedback -d '{\n}'\n`\n然后通过 cron 定时任务、k8s CronJob 或 UI 中的点击操作，按计划重新拟合。重新校准仅重写 [routing] 部分，并保留您的 [gateway] 端点；运行中的网关可热加载结果，无需重启：\n\n`wayfinder-router recalibrate                  # log -\u003e calibrate -\u003e write config\nwayfinder-router recalibrate --min-labels 50  # no-op until you have enough signal\n`\n评判过程会运行模型，因此它位于网关层（使用您的密钥）；评分核心保持不变，日志中不包含任何机密信息。\n\n部署与集成\n\nCLI、新手引导和用户界面是为运维人员和初始启动而设计的。在生产环境中，提示词通过网关（透明模式）或库（进程内模式）进行路由，因此路由发生在提示词所在的位置。\n\n将网关作为服务、边车或独立进程运行：\n\n`docker build -t wayfinder-router . && docker run -p 8088:8088 -v\n wayfinder-router\n# or: docker compose up gateway   (see docker-compose.example.yml)\n`\n将现有客户端指向它，无需修改应用程序。任何支持 OpenAI API 的对象都可以接受 base_url，包括智能体框架（LangChain、LlamaIndex）、带有自定义端点的 IDE 助手（Cursor、Continue）以及 LiteLLM 等网关：\n\n`client = openai.OpenAI(base_url=\n)\n`\n请参阅集成指南，了解如何在聊天 UI（Open WebUI、LibreChat、Jan）、编辑器（Continue、Cline、Zed、JetBrains）、智能体框架（LangChain、LlamaIndex、CrewAI、AutoGen、OpenAI Agents SDK、Vercel AI SDK）以及 CLI（aider、Copilot CLI）中进行复制粘贴式设置——此外还有标准的 OPENAI_BASE_URL / OPENAI_API_KEY 配置对。\n\nClaude Code 使用的是 Anthropic 的 Messages API 而非 OpenAI 的 API，因此网关提供了一个 POST /v1/messages 适配器（WF-DESIGN-0011），用于在 Anthropic 和 OpenAI 之间进行双向转换——包括流式传输和工具调用。将其指向网关根地址后，Claude Code 就会像其他客户端一样通过 Wayfinder 进行路由：\n\n`export ANTHROPIC_BASE_URL=\n                   # the gateway uses each upstream's own key\nclaude\n`\n从用户所在的位置接入反馈。你的应用、IDE 或聊天界面会显示点赞或点踩按钮，并提交用户评价；下一次重新校准将从中学习：\n\n`fetch(\n }),\n});\n`\n网关以异步方式转发并支持流式传输：带有 stream: true 的请求会以服务器推送事件的形式返回，因此聊天客户端可以在 token 到达时即时渲染。上游超时或连接失败会返回符合 OpenAI 格式的错误信息，而不是裸的 500 错误；每个响应都带有用于追踪的请求 ID，路由决策和重载失败信息也会被记录。\n\n除此之外，它还具备你期望的生产级控制功能——按请求设置超时、带目标级熔断和故障转移的有界重试、支出预算上限、精确匹配的响应缓存、速率限制，以及支持按密钥设置预算和允许列表的虚拟 API 密钥。这些功能默认处于关闭或宽松状态；有关每个设置及其对应的标头，请参阅网关配置参考。\n\n解释与调优\n\n要查看提示词为何被路由到特定位置，可以请求按特征维度分解：每个特征的值、其归一化水平、权重及其在分数中的占比。\n\n`wayfinder-router route prompt.md --explain\n`\n交互式调优可通过本地 Web UI 实现：\n\n- 解释——粘贴提示词；查看分数、层级阶梯和贡献柱状图，拖动阈值滑块即可实时观察路由变化。\n- 校准——粘贴带标签的数据集，运行一个模式，查看准确率、扫描曲线以及生成的配置片段。\n- 配置——编辑 wayfinder-router.toml 文件，支持实时验证并保存。\n- 上手——在浏览器中对本地模型和托管模型进行 A/B 测试，分别评判，并根据日志进行校准（模型调用需要 [gateway] 配置）。\n`pip install\n\u003e\nA fast, offline hard-or-easy call on every prompt — scored deterministically, with no model call. Route the easy ones to your small/local model and the hard ones to your big one, or compose any model-router behind it.\n   No model call\nto decide the route Deterministic\nand fully offline   Calibrate\non your own data Bring your own key\nself-hosted\nWayfinder scores a prompt's structure (length, headings, lists, code) and wording (proofs, math, hard constraints) into a `0.0`–`1.0` complexity score, then routes the easy ones to your small/local model and the hard ones to your big one. The decision is the product: deterministic, sub-millisecond, and entirely offline — no API key, no network, no model call to make it. What you route to is yours: two tiers, an N-tier ladder, or a model-router composed behind it.\n\nCheap prompts stay local and hard ones go to the expensive model, so you stop paying top-tier prices for\n\nHow it compares\n\nMost routers decide by calling a model: a trained classifier, an LLM judge, or a hosted API. That adds latency, cost, and randomness to the exact step meant to save you money. Wayfinder reads structure and wording instead, so the decision is free and the same every time.\n    router decides by model call? self-host calibrate    Wayfinder deterministic structural score no yes yes   RouteLLM trained classifier (preference data) yes yes retrain   NotDiamond / Martian learned, hosted yes no via platform   OpenRouter (Auto) hosted auto-router yes no —   Bifrost / LiteLLM provider gateway (not complexity-routed) no yes n/a\nThe gateways in the last two rows (OpenRouter, Bifrost, LiteLLM) answer a different question: which provider serves a call, by price, availability, and failover. Wayfinder answers which tier a prompt deserves: cheap vs expensive, by difficulty, decided offline. The two compose. Run Wayfinder to make the cheap-vs-expensive call, and a gateway underneath to reach the providers.\n\nWayfinder isn't chasing a top accuracy number — it gives you a routing decision you can run offline and tune on your own traffic. By default it scores prompt structure only; it can also read lexical cues (proofs, math, constraints), but those ship off by default because a\nThe account route appears in Chat only when that model is advertised by the isolated Codex runtime. Signing in does not change `Automatic` or any existing route ladder. Requests are hosted and leave the Mac; Offline mode disables the provider. Wayfinder receives normalized account state and model names, never account tokens, and does not broaden its credential broker. Development builds can use an explicitly selected or colocated helper. Release builds reject unverified sibling executables; the fixed ChatGPT-app fallback is accepted only when its runtime and signing checks pass. Public distribution remains gated on a pinned, licensed, architecture-correct, nested-signed helper. See the\nWayfinder never stores secrets: a model names an env var (`api_key_env`) and the key is read from your environment at request time. There is nothing to\n — just export the variable. Prefer not to paste a raw key into your shell? Add an optional `api_key_cmd` and Wayfinder fills that variable from your secret store at startup — `op read …` (1Password), `security …` (macOS Keychain), `secret-tool …` (Linux), `pass`/`gopass`, `vault kv get …`, `aws secretsmanager get-secret-value …`, `bw`, `doppler`, `gcloud secrets …`, or any command that prints the secret. The key is held in memory only, still never written to disk. `wayfinder-router doctor` detects which of these tools you have installed and suggests the exact line.\n\n-\nSet your key(s), then run the gateway. `doctor` re-checks the config and whether each model's key resolves (`✓ set` / `✗ not set`) before you start:\n\n`export ANTHROPIC_API_KEY=sk-...     # or OPENAI_API_KEY, per your config\nwayfinder-router doctor             # ✓/✗ per model — is each key set?\nwayfinder-router serve --port 8088\n`\n-\nPoint your existing client at it. No code change:\n\n`client = openai.OpenAI(base_url=\n}])\n`\nEasy prompts go local, hard ones go cloud, and every response carries `x-wayfinder-router-model` and `x-wayfinder-router-score` so you can see where it went. Want to force a tier for one request? Set `model=\n` (or `prefer-local` / `prefer-hosted`), move the cut for a single call with an `X-Wayfinder-Threshold` header, or start a chat message with `/local` or `/cloud` (see\nClassifier is a fitted multinomial-logistic model, `argmax` over per-model linear scores. You usually generate it with `calibrate` rather than write it by hand.\n\nEach `[gateway.models.\u003cname\u003e]` block maps a routed name to an upstream `base_url`, a `model`, and an optional `api_key_env` (the name of an environment variable, never the secret itself). The gateway is the only part that touches keys or the network; the scorer, config, and calibrator stay pure and offline.\n\nCalibrate on your data\n\nThe cut is a proxy, so tune it against your own traffic. `wayfinder-router calibrate` reads a labeled JSONL dataset (`{\n: ...}`) and prints a config fragment. It runs offline and never calls a model; the labels are your ground truth.\n\n`wayfinder-router calibrate data.jsonl --mode threshold              # sweep the binary cut\nwayfinder-router calibrate data.jsonl --mode tiers                  # ordinal multi-model\nwayfinder-router calibrate data.jsonl --mode classifier --out wayfinder-router.toml\n`\nThe fragment drops straight into `wayfinder-router.toml`; the accuracy and chosen breakpoints print to stderr. The classifier is fit by deterministic L2-regularized Newton/IRLS, pure Python, converging in a handful of iterations.\n\nTo pick a cut in cost terms instead of bare accuracy, use a cost-aware objective. `--objective knee` chooses the cost-aware knee automatically (it maximizes quality-recovered × cost-saved — no target to guess, and it can't collapse to always-routing-to-the-expensive-model the way pure accuracy does on skewed labels); `--objective cost-quality --target-savings X` instead holds a specific savings floor. Add `--weights` to score with — and emit — custom feature weights, e.g. the lexical opt-in, so the output is a complete, deployable config (see\nEach response adds `x-wayfinder-router-mode` (`scored` / `pinned` / `threshold-override`) next to the `-model` an"}, {"seq": 4, "title": "阿德拉菲尼尔：仅在AI agent工作时阻止Mac睡眠的菜单栏工具", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "summary": "Adrafinil 是一款 macOS 菜单栏应用，仅在 Claude Code、Codex、Cursor、Gemini CLI、Aider、Hermes、OpenCode、Cline、Pi 等 9 种 AI coding agent 持有活跃会话时阻止系统睡眠（包括合盖睡眠）。无 agent 工作时，合盖后 Mac 正常睡眠。它通过各 agent 的钩子系统调用 CLI，往返延迟低于 50ms，支持引用计数断言、热切出（温度阈值强制…", "url": "https://github.com/kageroumado/adrafinil", "permalink": "https://aihot.virxact.com/items/cmqx9k72u0425slp05ijlfezl", "publishedAt": "2026-06-29T00:00:00.000Z", "exact": false, "content": "\u003e\n\n阿屈非尼\n\n处方编号 006 ・ 阿·屈·非·尼 /əˈdræfɪnɪl/ ・ 一种用于机器的优觉药 ♡\n   清醒 ・ 智能体正在工作 睡眠 ・ 无智能体，正常睡眠\n\n服用注意 ・ 适用于你入睡后仍需值守的机器。\n\n凌晨三点。你正在熟睡。智能体却没有——它仍在你数小时前启动的会话中思考，而你已经合上了笔记本盖，就像一只无法完全闭合的眼睑。caffeinate 和 Amphetamine 是兴奋剂：它们让机器永远保持通电状态，无论是否有人在用。阿屈非尼是优觉药。它本身不做任何事，直到智能体获取它；它只在任务存续期间让你的 Mac 在合盖状态下保持清醒，并在最后一个会话释放时立即清除。它只为工作而唤醒——然后你们一同安睡。♡\n\n仅在 AI 智能体工作时保持 Mac 清醒。\n\nAdrafinil 是一款 macOS 菜单栏应用，它能阻止系统进入睡眠——包括合盖睡眠——但仅限于 AI 编程智能体有活跃会话时。当没有智能体工作时，睡眠行为不受影响：合上盖子，Mac 正常进入睡眠。\n\n它与 caffeinate 或 Amphetamine 这类始终唤醒的实用工具相反。Adrafinil 仅在智能体（Claude Code、Codex、Cursor……）处于任务中时介入，并在任务完成的那一刻退出。\n\n⚠️ 特权级睡眠控制。覆盖合盖睡眠需要 root 权限。Adrafinil 将此功能隔离在一个小巧且经过审计的辅助程序中，该程序仅暴露 setSleepBlocked(Bool) 接口——所有策略逻辑运行在无特权的守护进程中。它持有标准的 IOPMAssertion 用于空闲睡眠，并在验证设备上更干净的私有 IOPMrootDomain 路径无法让无显示器的合盖 Mac 保持清醒后，使用 pmset disablesleep 来控制合盖睡眠。详见 Docs/ARCHITECTURE.md §2。\n\n功能特性\n\n- 智能体感知，而非始终开启。仅当 ≥1 个智能体会话持有断言时才会阻止睡眠。零会话 → 正常睡眠，包括合盖睡眠。\n- 支持 9 种智能体的钩子集成。一键安装程序将 Adrafinil 接入 Claude Code、Codex、Cursor、Gemini CLI、Aider、Hermes、OpenCode、Cline 和 Pi 的钩子系统。\n- 亚 50 毫秒 CLI。adrafinil acquire / release 通过智能体钩子调用，与守护进程往返耗时低于 50 毫秒，因此绝不会阻塞智能体的工作流程。\n- 引用计数式断言。重叠会话可干净地堆叠；仅当最后一个会话释放时，休眠状态才会解除。\n- 过热切断保护。若合盖状态下皮肤/CPU 温度超过阈值，所有断言将被强制释放，防止装在包里的 Mac 因过热自毁。\n- 空闲释放。若拥有断言的进程已终止或 CPU 空闲超过 N 分钟，该断言将自动丢弃。\n- 进程嗅探（可选）。即使未安装钩子，守护进程在检测到已知智能体二进制文件运行时，也可自动获取断言。\n- 合盖提示音 + 开盖摘要。合盖时（屏幕已关闭，故无通知）会发出提示音确认断言已持有；重新开盖时则显示您离开期间运行的内容、峰值温度以及过热切断是否触发。\n- 干净卸载。移除其在所有智能体配置中添加的每条钩子条目。\n\n系统要求\n\n- macOS Tahoe 26.4。这是本人构建和测试所用的版本；它很可能也能在更早的 26.x 版本上运行，但本人尚未在这些版本上测试过。\n- 需 Xcode 26+ 进行构建，并启用 Swift 6 严格并发。\n- 标准安装需要管理员权限（特权助手通过 SMAppService 安装）。非管理员安装路径会将 CLI 放置于 ~/.local/bin 而非 /usr/local/bin。\n\n下载\n\n下载 Adrafinil —— 一份已签名并公证的磁盘映像。打开它，将 Adrafinil 拖入\n文件夹，然后启动。首次启动时会请求一次管理员权限以注册特权助手。需 macOS 26.4 或更高版本。\n\n更倾向于自行构建？请参阅\n\u003e\n\nadrafinil\n\nrx no. 006 ・ a·draf·i·nil /əˈdræfɪnɪl/ ・ a eugeroic for machines ♡\n\nawake ・ an agent is working\nsleeping ・ no agents, normal sleep\n\n服用注意 ・ for machines that keep watch after you've gone to sleep.\n\nIt's 3 a.m. You're asleep. The agent isn't — it's still mid-thought in a session you started hours ago, and you've closed the lid over it like an eyelid that won't quite shut. `caffeinate` and Amphetamine are stimulants: they keep the machine wired forever, whether or not anyone's home. Adrafinil is the eugeroic. It does nothing until an agent acquires it, keeps your Mac awake through a closed lid only for as long as that work lives, and clears the moment the last session releases. It only ever wakes for the work — then you both sleep. ♡\n\nKeep your Mac awake only while AI agents are working.\n\nAdrafinil is a macOS menu bar app that prevents the system from sleeping — including clamshell (lid-closed) sleep — exclusively while an AI coding agent has an active session. When no agent is working, sleep behavior is untouched: close the lid and the Mac sleeps normally.\n\nIt's the opposite of always-on wake utilities like `caffeinate` or Amphetamine. Adrafinil only intervenes when an agent (Claude Code, Codex, Cursor, …) is mid-task, and gets out of the way the moment that work finishes.\n\n⚠️ Privileged sleep control. Overriding clamshell sleep requires root. Adrafinil isolates that in a tiny, audited helper that only exposes `setSleepBlocked(Bool)` — all policy lives in an unprivileged daemon. It holds a standard `IOPMAssertion` for idle sleep and uses `pmset disablesleep` for clamshell (lid-closed) sleep, after verifying on-device that the cleaner private `IOPMrootDomain` paths don't keep a displayless lid-closed Mac awake. See \u003ca href="}]}, {"label": "论文研究", "color": "#e11d48", "items": [{"seq": 5, "title": "仅有三个AI模型在500天创业测试中盈利超过起始资本", "source": "The Decoder：AI News（RSS）", "summary": "普林斯顿大学推出CEO-Bench基准测试，让AI智能体在模拟环境中运营订阅软件公司NovaMind 500天，起始资金100万美元。14个测试模型中，仅Claude Fable 5（最佳轮次盈利4715万美元）、Claude Opus 4.8（2780万美元）和GPT-5.5（2130万美元）在最佳运行中超过起始资本。一个不调用语言模型的简单规则启发式方法通过固定定价、配额和针对性开发达到1576万美元，超越除上述三款外的所有模型。…", "url": "https://the-decoder.com/only-three-ai-models-finished-above-starting-capital-in-a-500-day-startup-survival-test", "permalink": "https://aihot.virxact.com/items/cmqxnrjtc004ssljh9zvejgbo", "publishedAt": "2026-06-29T00:00:00.000Z", "exact": false, "content": "\u003e\n普林斯顿大学的研究人员开发了 CEO-Bench 测试，要求 AI 智能体在模拟环境中运营一家虚构的软件公司，为期 500 天。目前大多数模型都会破产，而一个不依赖 AI 的简单规则启发式方法几乎能击败所有模型。\n\nAI 智能体在狭窄任务上越来越擅长：修复漏洞、在对话中遵循服务策略、或完成基于网页的工作流程。普林斯顿大学的研究指出，这些任务具有简单的结构：智能体获得明确目标，采取简短行动，并迅速收到反馈。然而，许多重要的现实任务与此截然不同。它们涉及在不确定性下进行长期决策链，需要设定优先级、分配有限资源、解读嘈杂信号，并适应不断变化的条件。\n\n为了精确测试这些能力，研究人员开发了 CEO-Bench。该基准测试模拟了这类长期任务的一个现实案例：在模拟环境中运营一家初创公司 500 天。\n\n研究人员引用了一个著名案例：1997 年，苹果公司距离破产仅剩 90 天。史蒂夫·乔布斯画了一个简单的 2x2 矩阵——消费级与专业级、台式机与便携设备——并决定苹果只在这四个象限内打造产品。随后诞生了 iMac、iPod 和 iPhone。\n\n作者认为，这种战略引导智能与当今 AI 智能体的能力有着本质区别。智能体在单项任务上进步迅速，但引导整个组织实现长期目标？这完全是另一个问题。CEO-Bench 正是衡量这种\n的首次尝试。\n\n一家虚构软件公司的 AI 首席执行官\n\n在 CEO-Bench 中，智能体运营一家名为 NovaMind 的虚构订阅制软件公司。公司初始拥有零客户和一百万美元现金。最终绩效以剩余现金衡量。一旦余额低于零，公司即宣告破产，模拟立即结束。\n\n该智能体通过一个包含 34 个工具和 19 张表数据库的 Python API 来控制这家公司。它不只是发出单个指令，而是自己编写代码、用 SQL 查询数据库，并根据结果构建自定义工作流。研究人员表示，这使得它面临着与人类 CEO 相同的挑战。\n 在为期 500 天的创业模拟中，该智能体将数据库查询、管理工具交互以及社交媒体帖子，与市场周期和工单解决量、订阅用户增长、取消订阅数及手头现金等结果指标联系起来。| 图片来源：Chen, Narasimhan, Liu\n需要决策的内容很多：定价与层级、各渠道广告支出、产品质量与研发、基础设施容量与客户支持，以及与企业客户的多轮谈判。除此之外，还有一个模拟的社交网络，智能体可以在其中阅读投诉、竞争对手新闻和经济趋势，并自行发帖。\n\n延迟反馈与隐藏变量使测试变得困难\n\n这项任务的难点在于时间和不确定性。决策会按照真实的商业时间线展开：收入只在账单日到账，研发项目需要数天到数周时间，而错误往往要等到后来通过用户流失或声誉受损才会显现。成本则是即时产生的。智能体必须花钱，而其回报可能数周后才显现。\n\n公司的许多状态是隐藏的。智能体无法直接看到客户满意度、支付意愿或最低质量期望。它必须从取消订阅、支持工单或社交网络上的反应等带有噪声的信号中拼凑出这些信息。该模拟模型包含 26 个客户细分群体和单个客户，每个都有各自的预算、价格敏感度和期望。\n\n世界也在不断变化。竞争对手会定期提高客户的质量期望，偏好会随时间推移而改变，模拟的商业周期也会影响需求和支付意愿，因此智能体必须持续调整。\n\n研究人员特意选择了固定、透明的规则，而非语言模型作为裁判。他们希望避免在 Vending-Bench（一项使用模拟自动售货机的测试）中看到的缺陷：在该测试中，AI 模拟的供应商可能会因不切实际的口头承诺而奖励智能体。\n\n大多数模型破产\n\n在测试的十四个模型中，大多数未能完成任务。几乎所有模型都能生成有效的命令和数据库查询，但没有一个能长期维持连贯的策略。许多模型在模拟结束前就破产了。\n\n只有三个模型在其最佳运行轮次结束时，资金高于起始的一百万美元：Claude Fable 5 达到 4715 万美元，Claude Opus 4.8 达到 2780 万美元，GPT-5.5 达到 2130 万美元。Claude Fable 5 是唯一一个在不止一轮运行中资金高于起始水平的模型。\n\n不过，这里有一个注意事项。Fable 5 有一轮运行因模型拒绝继续而中止，而在另外两轮中，部分请求回退到了 Opus 4.8。GPT-5.5 在三轮运行中有两轮破产。\n\nResearchers at Princeton University built CEO-Bench, a test where AI agents have to run a fictional software company for 500 simulated days. Most current models go broke, and a simple rule-based heuristic with no AI beats nearly all of them.\n\nAI agents are getting increasingly good at narrow tasks: fixing a bug, following a service policy in a conversation, or completing a web-based workflow. These tasks share a simple structure, according to the Princeton study: the agent gets a clear goal, acts briefly, and receives quick feedback. Many important real-world tasks look nothing like that. They involve long chains of decisions under uncertainty, where you have to set priorities, allocate limited resources, read noisy signals, and adapt to changing conditions.\n\nTo test exactly these skills, the researchers developed In the 500-day startup simulation, the agent connects database queries, management tool interactions, and social media posts with market cycles and outcome metrics like ticket resolutions, subscriber growth, cancellations, and cash on hand.| Image: Chen, Narasimhan, Liu\nThere's a lot to decide: pricing and tiers, ad spend across channels, product quality and R&D, infrastructure capacity and customer support, plus multi-round negotiations with enterprise clients. On top of that, there's a simulated social network where the agent can read complaints, competitor news, and economic trends and post itself.\n\nDelayed feedback and hidden variables make the test hard\n\nWhat makes the task hard is time and uncertainty. Decisions play out on realistic business timelines: revenue only arrives at billing dates, R&D projects take days to weeks, and mistakes often don't show up until later through churn or damaged reputation. Costs hit right away. The agent has to spend money whose payoff might not show up for weeks.\n\nMuch of the company's state stays hidden. The agent can't directly see customer satisfaction, willingness to pay, or minimum quality expectations. It has to piece these together from noisy signals like cancellations, support tickets, or reactions on the social network. The simulation models 26 customer segments and individual customers, each with their own budgets, price sensitivities, and expectations.\n\nThe world keeps changing, too. Competitors periodically raise customer quality expectations, preferences shift over time, and a simulated business cycle affects demand and willingness to pay, so the agent has to keep adjusting.\n\nThe researchers deliberately chose fixed, transparent rules rather than a language model as referee. They wanted to avoid a weakness they see in \u003ca href="}]}, {"label": "技巧与观点", "color": "#0284c7", "items": [{"seq": 6, "title": "四大顶级AI对决《文明VI》：Claude核平法国仍输，暴露感知与执行短板", "source": "IT之家（RSS）", "summary": "英国前首相府数据科学家Liam Wilkinson搭建76个MCP工具，将Claude Opus 4.6、GPT-5.4、Gemini 3.1 Pro等四个模型放入《文明VI》进行23场对局。Claude扮演葡萄牙时，因法国文化胜利逼近，花50回合研发核弹核平图卢兹，但法国最终以外交胜利获胜。Wilkinson发现：AI主动检查全局状态仅占1-2%（感知盲区），计划后10回合内执行率仅48-66%（知行差距）。结论是智商非瓶颈，感知与…", "url": "https://www.ithome.com/0/969/570.htm", "permalink": "https://aihot.virxact.com/items/cmqx7behn03g3slp0pzrofqz9", "publishedAt": "2026-06-29T00:00:00.000Z", "exact": false, "content": "太魔幻了！就在最近，英国前首相府数据科学家 Liam Wilkinson，花一个周末搭了 76 个 MCP 工具，把 Claude、GPT、Gemini 等四个顶尖模型扔进了《文明 VI》。 结果，23 场对局打完，其中一个 AI 造了核弹炸了法国 —— 然后输了。 一群 AI，被丢进了「文明 VI」里 Wilkinson 在唐宁街 10 号做数据科学家的时候，给 AI 出了一套考题：GovBench，3497 道英国政府相关选择题，覆盖政策、法规、行政流程。 GPT-5 考了 99.26 分。 满分级选手。但治国不是知识竞赛。一个能背下所有政策文件的人，丢到唐宁街真能治国吗？选择题测不出来的东西太多了：多线程决策、资源分配、长期规划、在不完整信息下做判断。他需要一个不一样的考场。然后他想到了《文明 VI》。 一个周末搭出来的系统，通过游戏引擎自带的端口接入。AI 看不到画面。没有地图，没有音乐，没有动画。它的整个世界就是一行行文本和六边形坐标。 Claude 在游戏日记里写了这么一段：“我感知游戏的方式和人类玩家完全不同。没有画面，没有音乐，没有动画。我的界面就是管道分隔符和六边形坐标。” 别小看「一个周末」。76 个工具覆盖了完整的游戏循环：城市管理、单位移动、外交谈判、科技研究、政策选择，一个不漏。 此外，Wilkinson 还给 AI 配了一个日记系统当外部记忆。如若不然，AI 连自己上一回合干了什么都记不住。 三个测试场景逐级加码：\n- Ground Control 是标准开局的公平基线；\n- Snowflake 是六臂雪花地图，每个文明被困在独立半岛上，外交基本没戏，逼你走军事路线；\n- Cry Havoc 是残酷模式，AI 对手全部拉满。\n决策空间更吓人。 《文明 VI》晚期每回合的可能行动数量级大约是 10 的 166 次方。 做个对比，围棋每步大约 10 的 360 次方，但围棋一步只落一子。《文明 VI》每回合要同时操作几十个单位、选建筑、定科技、做外交，是一道巨大的组合决策题。 一场 50 回合复仇，AI 核平图卢兹 23 场里最魔幻的一局，是葡萄牙。Claude 扮演若昂三世，一个贸易文明。开局稳得一批。它建起了每回合 200+ 金币的贸易帝国，海上航线四通八达。外交胜利进度 18/20，只差两分就赢了。 这时候，法国的文化胜利进度条开始飙升。Claude 慌了。先试外交。没用，法国不吃这套。再派间谍去搞破坏，杯水车薪。试贸易制裁？法国的文化产出根本不依赖贸易。和平手段穷尽。 于是，Claude 翻开了科技树最后一页：核裂变。 接下来的 50 回合，它把大量资源从贸易和外交抽出来，投入核武器研发。All in 曼哈顿计划。 第 305 回合，核弹就绪。目标锁定：图卢兹。法国的文化产出重镇。 发射。图卢兹被夷为平地。法国的文化胜利进度条，停了。 AI 赢了吗？没有。 造核弹这 50 回合，AI 把所有注意力都放在了文化威胁上。它没有注意到一件事 —— 法国在疯狂攒外交分。 第 318 回合，法国以外交胜利赢得比赛。20 分对 18 分。 讽刺的是，18 分是 AI 自己辛苦攒下的外交分数。它曾经离外交胜利只差两分。但它把资源全抽去造核弹了。 AI 盯着文化威胁打了 50 回合，然后输在了外交。它的视野里只有一个威胁。但棋盘上有很多个。 无独有偶，伦敦国王学院做过一个核危机模拟实验，把三个前沿模型丢进去当虚拟国家的决策者。结果：95% 的模拟中，AI 选择了使用战术核武器。 AI 不是「想」用核弹。它是真的不知道还能怎么办。 98% 时间装瞎，一半计划烂尾 除了爱好「核平」之外，Wilkinson 还从 23 场对局里挖出了的两个细节。 第一个数字：1-2%。 这是 AI 在整场游戏中，主动检查全局状态的行为占比。 AI 每回合要执行很多操作：造建筑、移动单位、研究科技、外交谈判。但在所有这些操作里，主动去看一眼排行榜、检查对手胜利进度、扫一圈全局局势的动作，只占 1-2%。 Wilkinson 给这个现象起了个名字：sensorium effect，感知盲区效应。AI 只能通过主动调用工具来感知世界。它不查的东西，对它来说不存在。 韩国那局是最好的例子。AI 玩韩国 —— 科技文明，天生科技加成。它在日记里全程自信：「我在碾压科技树。」 实际呢？它的科技产出每回合 44.7，在所有文明里排倒数第一。马其顿 89.3，波斯 64.9。 但它从来没查过排名。它的自信建立在一个从未验证过的假设上。第 178 回合，波斯突袭。首都沦陷。第 216 回合，AI 以两城残国投降。从头到尾，它都不知道自己是最弱的那个。 第二个数字：48-66%。 这是 AI 写下计划后，在 10 回合内实际执行的比例。 Claude Opus 4.6 最低，48.2%—— 还不到一半。写了计划，转头就忘。 GPT-5.4 好一点，63.2%。 Gemini 3.1 Pro 最高，65.8%。最好的模型也有三分之一的计划烂在了日记本里。 Wilkinson 管这叫 knowing-doing gap，知行差距。 你让它写一份治国纲领，它能写得比很多人类政客漂亮。你让它按自己的纲领治国，活不过两周。 Scaling Law 的盲区 6 月 10 日，DeepMind 联合创始人 Shane Legg 和「通用 AI」理论奠基人 Marcus Hutter 发了一篇 60 页的论文《From AGI to ASI》，画了四条通往超级智能的路：继续 scaling、范式突破、递归自我改进、多智能体集群。 四条路都建立在一个假设上：瓶颈在大脑。数据墙、算力墙、范式墙 —— 都是「怎么让 AI 更聪明」的问题。 但 CivBench 这 23 场对局指向一个完全不同的瓶颈。 99.26 分已经证明了智力不是瓶颈。但 23 场《文明 VI》打完，所有模型都撞上了同样两堵墙 —— 和「聪不聪明」无关的两堵墙。 第一堵：感知是架构问题，不是智力问题。 AI 只能通过主动调用工具来获取信息，不查就不存在。把模型参数翻十倍，它也不会自动变得更爱检查全局。1-2% 的感知盲区不会因为模型更大而消失。 第二堵：执行是工程问题，不是能力问题。 AI 写计划的水平远超执行计划的水平。48-66% 的执行率不是因为「想不到」，而是因为「做不到」。一个更聪明的大脑，装在一双不听使唤的手上，治不了国。 通向超级智能的路，也许不是一条单纯往上爬的智力曲线。在「更聪明」之前，有一个看起来更低级但也更致命的工程问题要先解决：怎么让 AI 真正睁开眼、伸出手。Scaling law 解决的是大脑。但 CivBench 暴露的问题，在大脑之外。 参考资料：\n- https://www.lwilko.com/blog/i-gave-an-ai-a-civilization\n- https://news.ycombinator.com/item?id=48623159\n本文来自微信公众号：新智元（ID：AI_era），作者：ASI 启示录 ASI 启示录", "zh": true}, {"seq": 7, "title": "Artifacts 22：Zyphra、Cohere 和 Poolside 正在扩展生态系统广度", "source": "Nathan Lambert：Interconnects（RSS）", "summary": "开源模型生态正变得更多元，参与者从少数中国公司扩展到全球各类组织。纯模型制造商包括 DeepSeek、智谱、MiniMax、Poolside、Arcee、Zyphra 及主权 AI 玩家 Cohere、Sovereign、Mistral、Trillion Labs；科技巨头如阿里 Qwen、Google Gemma 和 NVIDIA 各有不同动机；产品公司如 JetBrains、Zed、Krea、Photoroom 则训练高度专业的小…", "url": "https://www.interconnects.ai/p/artifacts-22-zyphra-cohere-and-poolside", "permalink": "https://aihot.virxact.com/items/cmqy28vh30050slr1uzaev9nk", "publishedAt": "2026-06-29T00:00:00.000Z", "exact": false, "content": "\u003e\n\n- command-a-plus-05-2026-bf16 by CohereLabs：Cohere（最近越来越频繁地成为 Artifacts 的常客）在 Apache 2.0 许可证下发布了其旗舰模型 Command A+。该系列之前的版本是在非商业许可证下发布的，因此这一变化非常受欢迎！Command A+ 结合了多模态、多语言和智能体能力，是一个 218B-A25B 的 MoE 模型，使其可以在单个 B200（使用 4-bit 时）上运行。\n\n- GLM-5.2 by zai-org：本次 Artifacts 中最大的新闻是 GLM-5.2，我们也在另一篇博客中进行了报道。该模型继续令人印象深刻，并且确实可用于日常工作，与目前最好的闭源模型相比没有太大的退步。有趣的是，自发布以来的原始下载量与其他模型发布情况更为一致，GLM-5.2 的下载量与发布后的 GLM-5 大致持平。\n\n- Zyphra 发布的 ZAYA1-74B-preview：Zyphra 这家公司使用 AMD GPU 进行训练，因其技术报告中包含有趣的架构选择，在研究社区中被视为某种内部消息来源。他们发布了一些新模型，其中 74B-A4B MoE 和 8B-A0.6B MoE（技术报告）是当前的主打产品。\n\n- poolside 发布的 Laguna-M.1：我们在上一期 Artifacts 中报道过的 poolside，也以 Apache 2.0 协议发布了他们的旗舰模型！他们还承诺未来将继续进行开放发布：\n\n开放权重现在已成为我们的默认选择。我们将继续朝着前沿方向努力，并持续公开发布能力越来越强的模型。\n\n模型\n\n通用型\n\n- 月之暗面（moonshotai）发布的 Kimi-K2.7-Code：Kimi 的一次更新，重点提升了模型 token 效率。\n\n- 阶跃星辰（stepfun-ai）发布的 Step-3.7-Flash：Step-Flash 的一次更新，尤其在数学方面表现非常强劲。\n\n- 英伟达（nvidia）发布的 Nemotron-Labs-Diffusion-14B：一个实验性模型，可以在三种不同模式下使用：自回归模式、扩散模式和自推测模式。每种模式都适用于不同的使用场景。\n\n- \u003ca href=", "zh": true}]}]};
function pad(n){return n<10?"0"+n:""+n;}
function toBeijingHuman(iso, ref, exact){
  const d=new Date(iso); const bj=new Date(d.getTime()+8*3600*1000);
  const Y=bj.getUTCFullYear(),M=bj.getUTCMonth()+1,D=bj.getUTCDate();
  const h=bj.getUTCHours(),m=bj.getUTCMinutes(); const hh=pad(h),mm=pad(m);
  if(!exact) return M+"月"+D+"日";
  const [rY,rM,rD]=ref.split("-").map(Number);
  if(Y===rY&&M===rM&&D===rD) return "今天 "+hh+":"+mm;
  const yest=new Date(rY,rM-1,rD); yest.setDate(yest.getDate()-1);
  if(Y===yest.getFullYear()&&M===yest.getMonth()+1&&D===yest.getDate()) return "昨天 "+hh+":"+mm;
  return M+"月"+D+"日 "+hh+":"+mm;
}
const meta=DATA.meta, sections=DATA.sections, ref=meta.reportDate;

sections.forEach(s=>{const d=document.createElement("div");d.className="stat";
  d.innerHTML='<div class="n">'+s.items.length+'</div><div class="l">'+s.label+'</div>';statsEl.appendChild(d);});
const navEl=document.getElementById("nav");
sections.forEach((s,i)=>{const a=document.createElement("a");a.href="#sec-"+i;
  a.innerHTML=escapeHtml(s.label)+'<span class="c">'+s.items.length+'</span>';navEl.appendChild(a);});
const mainEl=document.getElementById("main");
sections.forEach((s,i)=>{
  const sec=document.createElement("section");sec.className="block";sec.id="sec-"+i;
  const head=document.createElement("div");head.className="sec-head";
  head.innerHTML='<span class="sec-dot" style="background:'+s.color+'"></span><h2>'+escapeHtml(s.label)+'</h2><span class="cnt">'+s.items.length+' 条</span>';
  sec.appendChild(head);
  const grid=document.createElement("div");grid.className="grid";
  s.items.forEach(it=>{
    const card=document.createElement("article");card.className="card";card.style.setProperty("--accent",s.color);
    const time=toBeijingHuman(it.publishedAt,ref,it.exact);const url=it.url||"#";
    card.innerHTML='<div class="top"><span class="seq">'+it.seq+'</span><span class="time">'+time+'</span></div>'+
      '<h3>'+escapeHtml(it.title)+'</h3><span class="chip">'+escapeHtml(it.source)+'</span>'+
      '<p class="summary">'+escapeHtml(it.summary)+'</p>'+
      '<a class="readmore" href="'+escapeAttr(url)+'" target="_blank" rel="noopener noreferrer" title="外部原文链接，可能需要访问境外站点">来源 ↗</a>';
    card.addEventListener("click", function(){ openReader(it); });
    const rm = card.querySelector(".readmore");
    rm.addEventListener("click", function(e){ e.stopPropagation(); });
    grid.appendChild(card);
  });
  sec.appendChild(grid);mainEl.appendChild(sec);
});
function escapeHtml(s){return (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function escapeAttr(s){return escapeHtml(s);}
// 渲染正文（纯文本归档）：图片不加载远程资源，仅以文字占位符呈现；其余文本按段落转义（防 XSS）
function linkify(escaped){
  if(!escaped) return escaped;
  var re=/(\[[^\]]+\]\((https?:\/\/[^)\s]+)\))|(https?:\/\/[^\s<>"'）】」』，。、；：！？]+)/g;
  return escaped.replace(re, function(m, g1, g2, g3){
    if(g2!==undefined){
      var label=m.substring(m.indexOf('[')+1, m.indexOf(']'));
      return '<a class="r-link" href="'+g2+'" target="_blank" rel="noopener noreferrer">'+label+'</a>';
    }
    if(g3!==undefined){
      return '<a class="r-link" href="'+g3+'" target="_blank" rel="noopener noreferrer">'+g3+'</a>';
    }
    return m;
  });
}
var _IMG_RE=/!\[([^\]]*)\]\(([^)\s]+)\)/g;
function renderRich(text){
  return (text||"").split(/\n{1,}/).map(function(p){
    p=p.trim(); if(!p) return '';
    var out=''; var last=0; var m; _IMG_RE.lastIndex=0;
    while((m=_IMG_RE.exec(p))!==null){
      out+=linkify(escapeHtml(p.slice(last,m.index)));
      var cap=(m[1]||'').trim()||'图片';
      out+='<span class="r-img-cap">🖼 '+escapeHtml(cap)+'</span>';
      last=_IMG_RE.lastIndex;
    }
    out+=linkify(escapeHtml(p.slice(last)));
    return '<p>'+out+'</p>';
  }).join("");
}
function openReader(it){
  const r=document.getElementById("reader");
  const content=(it.content||"").trim();
  const body=document.getElementById("readerBody");
  if(content.length>0){
    body.innerHTML=renderRich(content);
  }else{
    const sum=(it.summary||"").trim();
    if(sum){
      // 来源站点多为付费墙 / 登录墙 / 反爬限制，无法镜像全文；展示已本地存档的中文摘要兜底
      body.innerHTML='<div class="r-fallback">⚠️ 该条新闻的<b>全文镜像暂不可用</b>（来源站点可能为付费墙 / 登录墙 / 反爬限制，或原文已失效）。下方为已<b>本地存档的中文摘要</b>，可正常查看；完整原文请点击右下角「查看原文 ↗」。</div>'+
        '<p class="r-summary">'+linkify(escapeHtml(sum))+'</p>';
    }else{
      body.innerHTML='<p class="r-empty">暂未获取到该条新闻的全文镜像与摘要。'+(it.url?'可点击右下角「查看原文 ↗」前往原始报道。':'')+'</p>';
    }
  }
  document.getElementById("readerTitle").textContent=it.title;
  document.getElementById("readerSource").textContent=it.source;
  const link=document.getElementById("readerLink");
  if(it.url){link.href=it.url;link.style.display="";}else{link.style.display="none";}
  r.hidden=false;document.body.style.overflow="hidden";
}
function closeReader(){const r=document.getElementById("reader");r.hidden=true;document.body.style.overflow="";}
document.getElementById("reader").addEventListener("click",function(e){if(e.target===this)closeReader();});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeReader();});
