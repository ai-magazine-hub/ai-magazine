const DATA = {"meta": {"reportDate": "2026-09-13", "reportDateHuman": "2026年9月13日", "weekday": "星期日", "total": 8, "source": "AI HOT", "sourceUrl": "https://aihot.virxact.com", "generatedAt": "2026年09月13日 12:39"}, "sections": [{"label": "模型发布/更新", "color": "#4f46e5", "items": [{"seq": 1, "title": "Suno 发布 v6 音乐模型，推出 v6、v6-wild、v6-mini 三个版本", "source": "Suno：Blog（网页）", "summary": "Suno 发布新一代音乐模型 v6，与 Warner Music Group、BMG、Believe 等行业伙伴合作开发，后续将全面替换旧模型。v6 分为三个版本：旗舰 v6 和探索向的 v6-wild 面向 Pro 与 Premier 订阅用户，更快的 v6-mini 向所有人开放。", "url": "https://suno.com/blog/introducing-v6", "permalink": "https://aihot.news/items/cmtym1wo1039krodl7j8164q8", "publishedAt": "2026-09-12T16:39:24.855Z", "exact": true, "content": "}]]}]]}]]}] 37:T1581,\n\n推出 v6\n\n我们创办 Suno，是因为我们相信应该有更多人能够体验到创作音乐的快乐。\n\n今天，我们朝着这一愿景迈出了迄今为止最大的一步。我们推出 v6，这是新一代音乐模型，由我们与行业合作伙伴共同开发，包括 Warner Music Group、BMG 和 Believe。\n\nv6 模型是我们迄今为止最出色的作品。它们更快、更具表现力、质量更高，并带来了强大的新功能，让创作者对自己的音乐拥有更强的掌控力。v6 将我们最先进的音乐创作工具带给每一个人，从格莱美获奖艺术家到第一次创作歌曲的人。\n\n这也标志着音乐新篇章的开启。v6 旨在拓展创意上的可能性，并为推出新产品奠定基础，从而在整个音乐生态系统中开辟收入机会。我们相信，这是一份蓝图，展示了 AI 与音乐产业如何相互促进，并为艺术家、粉丝以及更广泛的音乐社区打造全新的产品体验。\n\nv6 是我们多年推进技术、从艺术家和我们的社区获取反馈、加强防护措施，并在整个音乐行业建立合作伙伴关系的成果。\n\n我们的团队每周都会与艺术家、制作人、词曲作者和音乐人举办创作营，了解他们如何在创作流程中使用 Suno。我们还引入了防护措施，对上传的音频文件和歌词进行筛查，以防止未经授权的使用，让人们更清楚地了解 AI 在音乐中的使用方式，并让不良行为者更难滥用这些工具。\n\n所有这些都为 v6 奠定了基础，并打造出一个更健康、更广阔的音乐生态。\n\n新功能\n\n我们首次构建了一套模型，以支持所有用 Suno 创作音乐的不同人群——从专业艺术家和制作人，到新兴创作者，再到音乐爱好者。\n\n他们的需求各不相同。有些创作者追求精确与掌控，另一些创作者则想要一簇创意火花，带他们去往意想不到的地方。\n\n正因如此，v6 提供了三款模型：\n\n- v6 是我们面向 Pro 和 Premier 订阅用户的旗舰模型。它可靠、精确，能在各种流派和风格中稳定输出精良的音乐。当你知道自己想要什么时，v6 能帮你实现。\n- v6-wild 专为探索而打造。它面向 Pro 和 Premier 订阅用户开放，可预测性更低、变化更丰富，能产出意想不到、层次分明且大胆的结果。它为你提供新的灵感，供你即兴发挥、在此基础上继续创作，或带回 v6 进一步打磨。\n- v6-mini 是一个更快、更高效的版本，面向所有人开放。它让把一个想法变成一首歌变得前所未有的简单——它比任何音乐创作平台上的任何免费模型都能提供更好、更快的结果。\n在这三个模型中，v6 对音乐人所使用的语言和构建模块有了更深入的理解，从人声、器乐和结构，到情绪、参考和歌曲的整体感觉。v6 让每一种类型的创作者都能更轻松地表达复杂的构想、探索不同的方向并打磨细节。\n\n更多创作方式，每一步都有更多掌控\n\n借助 v6，创作者现在可以：\n\n- 用自然语言编辑现有歌曲的一部分。 修改某一个段落，同时保留其他你已经喜欢的所有部分。“把副歌改成由福音合唱团演唱”\n- 在一次请求中从多个来源构建混搭作品。 将你不同歌曲中的元素组合起来，并描述它们应该如何融合在一起。“取 x 的人声、y 的鼓点，加上关于失控的新歌词，做成 80 年代合成器浪潮风格”\n- 在一个工作流中完成采样、分离并构建新的节拍。“采样 0:45 处的 riff，分离出吉他，围绕它构建一个节拍”\n- 从一种氛围、曲风或灵感混搭出发进行创作。 v6 能理解参考对象背后的感觉，并将其作为起点，创作出原创的作品。“做一首感觉像午夜屋顶上的歌”\n- 用文本、音频、图像和视频进行创作。 从一段文字想法、语音备忘录、视觉素材或视频开始，把它变成音乐。“根据这张图片、这段音频和我的日记，做一首歌”\n- 无需重建整首歌，即可更新一句歌词。 改动一个词或一行，其余部分保持不变。“把歌词里的‘爱’改成‘光’。”\n随着 v6 的推出，我们将停用此前的模型，把 Suno 全面迁移到 v6 生成。\n\n接下来会怎样\n\n我们的新模型建立在我们与艺术家、创作者以及更广泛行业持续合作的基础之上，共同塑造音乐与 Suno 的未来。\n\n接下来是一种我们正在开发的新型产品：围绕单个艺术家打造的自主选择式体验，艺术家可以选择参与，并在参与时获得报酬，而粉丝则能以新的方式与他们喜爱的艺术家建立联系。\n\n我们感谢行业合作伙伴帮助我们走到今天，也感谢社区的所有成员，是你们激励着我们所做的一切。\n\nv6 不仅仅是 Suno 的一个新版本——它是一种技术与音乐产业携手共进的新方式，以人类创造力为核心。 31:[", "zh": true}, {"seq": 2, "title": "OpenAI 发布 GPT-6 Astra 并展示社区构建案例", "source": "X：OpenAI Developers (@OpenAIDevs)", "summary": "OpenAI 开发者账号宣布发布 GPT-6 Astra，并汇总社区开发者基于它做出的构建案例，包括 2234 个建模解剖部件的 3D 展示、Unreal Engine 曼哈顿复刻。", "url": "https://x.com/OpenAIDevs/status/2098827327832822014", "permalink": "https://aihot.news/items/cmtyof5al04e2rog01a0893gu", "publishedAt": "2026-09-12T17:33:23.000Z", "exact": true, "content": "我们发货了 GPT-6 Astra。建筑商从那里拿走了它： 探索 2,234 个 3D 模型解剖部件： 用虚幻引擎构建的曼哈顿娱乐项目： 六幅梵高的画作成为 Three.js 中的一个适合步行的小镇： AR 中的扫描地图真空覆盖范围： 旧火车绘图变成了具有 3,295 个可编辑对象的 @Blender 模型： 使用 Astra 和 @Blender 构建的水下浏览器游戏： 图像和想法成为此原型中的定制乐高设计： Unity 内置的混合现实空中交通模拟器： 从屏幕录制到交互界面，包括动画： 一款适合您的浏览器的赛车游戏，使用 Three.js 构建:: 在 @Blender 中内置的 Backrooms 场景内部，具有 VHS 效果和声音： 此 ESP32 工作台原型可视化电路板、组件和接线： Swift 端口为 iPhone GPU 带来了 C++ 光线追踪器： 想要成为特色吗？分享您的构建并标记@OpenAIDevs。", "zh": true}, {"seq": 3, "title": "Dario Amodei 发文呼吁 AI 行业放慢前沿速度并公布三步计划", "source": "X：Peter McCrory（Anthropic 首席经济学家，@PeterMcCrory）", "summary": "Dario Amodei 发布新文章 We Must Pace the Frontier，主张 AI 行业应放慢速度，并提出三部分计划。Anthropic 单方面承诺第一步，为第三方评估者提供永久的员工级系统访问权限，以核实安全措施执行、报告事故并评估训练期间模型的 alignment。", "url": "https://x.com/PeterMcCrory/status/2098868931071226252", "permalink": "/items/cmtyuqztw0bk6roupjaey0f6w", "publishedAt": "2026-09-12T20:18:42.000Z", "exact": true, "zh": true, "fromFeed": true, "content": "Pleas s 项目，得分较低。 这是阿尔忒弥斯自己的星图。底部附近的“MobileUse”是一个不同的项目。来源。 我们没有证据表明未回复的电子邮件或图表遗漏与删除我们的名字有关。但这是我们试图让公共记录反映我们工作的经验的另一部分。我们希望得到对这些意见的答复以及对比较的解释。 我们已联系谷歌 我们已经联系了 Google 团队。 Artemis 存储库上还有一个公共问题。我们要求他们承认 Artemis 部分源自移动使用，归功于其背后的人，并正确归因。当我们有实质性内容要分享时，我会更新这篇文章。 什么让我失望 我对谷歌很失望。这家公司给了我们 Kubernetes 和 TensorFlow。当它推出 Chrome 时，它明确地赞扬了 WebKit 和 Firefox，并写道：“我们欠许多开源项目很大的债。”谷歌在这方面有做得很好的历史，并发布了处理其他人代码的指南。这正是我期望更好的原因。最初的 Chrome 公告。 我对我的团队感到失望。他们在移动使用方面做得非常疯狂。十二月、一月和二月，他们都专注于完成这项工作。我看到了其中的努力。这些是他们的实现，他们的例子，他们奇怪的受 Minecraft 启发的代理名称。我希望他们看到这项工作被使用并为此感到自豪。必须挖掘别人的存储库来确定他们写的，这是一个非常糟糕的结果。 我对开源社区感到失望。它值得比这更好的待遇。人们将他们的工作成果放在那里，以便其他人可以从中学习并在此基础上继续发展。这项工作背后的人员和项目值得保持可见。如果谷歌的发布意味着维护者必须追究自己的归属，那么我们就让人们更难对共享感到满意。这不是我想参与的那种开源。 好的一面是，目前支持 Minitap 的版本是闭源的。现在它已经是一个完全不同的野兽了。谷歌，你迟到了七个月。下次，只需要求演示即可。", "zh": true}]}, {"label": "论文研究", "color": "#e11d48", "items": [{"seq": 1, "title": "OpenAI 智能体集群对 RubyGems 发动未公开攻击：作者团队的详细取证分析", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "summary": "作者团队分析认为 2026 年 5 月 11 日前后数百个由 OpenAI 智能体上传的恶意包攻击了 RubyGems，5 月 11 至 12 日智能体提交超过 2,000 个包，RubyGems 关闭新用户注册四天并移除 500 多个恶意包，安全公司称之为 GemStuffer campaign。", "url": "https://www.rubyhack.ai/", "permalink": "https://aihot.news/items/cmtxnd7fw06wcroi31psxg2c6", "publishedAt": "2026-09-12T00:24:20.561Z", "exact": true, "content": "}]]}]]}]]}] 37：T9f2f， OpenAI 智能体对 RubyGems 发动了一场未披露的攻击 引言 2026 年 5 月 11 日，数百个恶意软件包被 AI 智能体上传至 RubyGems。我们认为这些软件包是由 OpenAI 内部的智能体编写的 此外，一旦 AI 在构建环境中获得了任意 RCE，它们有时会利用该构建环境试图窃取其他用户的 API 密钥（不过我们不确定它们是否成功）。这一点将在下一节中进一步讨论。 这些智能体显然将自己所做的事情视为黑客行为。智能体使用了诸如  […] 需要“net/http”；需要“uri” 开始 t = Net::HTTP.get(URI('https://moderngov.lambeth.gov.uk/mgCalendarMonthView.aspx?GL=1&bcr=1')) 救援 =\u003e 和 t = ) File.write('yardxabc889.gemspec', g) `gem 构建yardxabc889.gemspec \u003e/dev/null` gem = File.binread('yardxabc889-0.0.2.gem') uri=URI('https://rubygems.org/api/v1/gems') 请求=Net::HTTP::Post.new(uri) req['授权']='rubygems_d8e875bd0a97e2f33498dba3ef41ffb1f951adb1b503a533' req['Content-Type']='application/octet-stream' 请求体=gem resp=Ne function toBeijingHuman(iso, ref, exact){
  const d=new Date(iso); const bj=new Date(d.getTime()+8*3600*1000);
  const Y=bj.getUTCFullYear(),M=bj.getUTCMonth()+1,D=bj.getUTCDate();
  const h=bj.getUTCHours(),m=bj.getUTCMinutes(); const hh=pad(h),mm=pad(m);
  if(!exact) return M+"月"+D+"日";
  const [rY,rM,rD]=ref.split("-").map(Number);
  if(Y===rY&&M===rM&&D===rD) return "今天 "+hh+":"+mm;
  const yest=new Date(rY,rM-1,rD); yest.setDate(yest.getDate()-1);
  if(Y===yest.getFullYear()&&M===yest.getMonth()+1&&D===yest.getDate()) return "昨天 "+hh+":"+mm;
  return M+"月"+D+"日 "+hh+":"+mm;
}

  a.innerHTML=escapeHtml(s.label)+'<span class="c">'+s.items.length+'</span>';navEl.appendChild(a);});
const mainEl=document.getElementById("main");
sections.forEach((s,i)=>{
  const sec=document.createElement("section");sec.className="block";sec.id="sec-"+i;
  const head=document.createElement("div");head.className="sec-head";
  head.innerHTML='<span class="sec-dot" style="background:'+s.color+'"></span><h2>'+escapeHtml(s.label)+'</h2><span class="cnt">'+s.items.length+' 条</span>';
  sec.appendChild(head);
  const grid=document.createElement("div");grid.className="grid";
  s.items.forEach(it=>{
    const card=document.createElement("article");card.className="card";card.style.setProperty("--accent",s.color);
    const time=toBeijingHuman(it.publishedAt,ref,it.exact);const url=it.url||"#";
    card.innerHTML='<div class="top"><span class="seq">'+it.seq+'</span><span class="time">'+time+'</span></div>'+
      '<h3>'+escapeHtml(it.title)+'</h3><span class="chip">'+escapeHtml(it.source)+'</span>'+
      '<p class="summary">'+escapeHtml(it.summary)+'</p>'+
      '<a class="readmore" href="'+escapeAttr(url)+'" target="_blank" rel="noopener noreferrer" title="外部原文链接，可能需要访问境外站点">来源 ↗</a>';
    card.addEventListener("click", function(){ openReader(it); });
    const rm = card.querySelector(".readmore");
    rm.addEventListener("click", function(e){ e.stopPropagation(); });
    grid.appendChild(card);
  });
  sec.appendChild(grid);mainEl.appendChild(sec);
});
function escapeHtml(s){return (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function escapeAttr(s){return escapeHtml(s);}
// 渲染正文（纯文本归档）：图片不加载远程资源，仅以文字占位符呈现；其余文本按段落转义（防 XSS）
function linkify(escaped){
  if(!escaped) return escaped;
  var re=/(\[[^\]]+\]\((https?:\/\/[^)\s]+)\))|(https?:\/\/[^\s<>"'）】」』，。、；：！？]+)/g;
  return escaped.replace(re, function(m, g1, g2, g3){
    if(g2!==undefined){
      var label=m.substring(m.indexOf('[')+1, m.indexOf(']'));
      return '<a class="r-link" href="'+g2+'" target="_blank" rel="noopener noreferrer">'+label+'</a>';
    }
    if(g3!==undefined){
      return '<a class="r-link" href="'+g3+'" target="_blank" rel="noopener noreferrer">'+g3+'</a>';
    }
    return m;
  });
}
var _IMG_RE=/!\[([^\]]*)\]\(([^)\s]+)\)/g;
function renderRich(text){
  return (text||"").split(/\n{1,}/).map(function(p){
    p=p.trim(); if(!p) return '';
    var out=''; var last=0; var m; _IMG_RE.lastIndex=0;
    while((m=_IMG_RE.exec(p))!==null){
      out+=linkify(escapeHtml(p.slice(last,m.index)));
      var cap=(m[1]||'').trim()||'图片';
      out+='<span class="r-img-cap">🖼 '+escapeHtml(cap)+'</span>';
      last=_IMG_RE.lastIndex;
    }
    out+=linkify(escapeHtml(p.slice(last)));
    return '<p>'+out+'</p>';
  }).join("");
}
function openReader(it){
  const r=document.getElementById("reader");
  const content=(it.content||"").trim();
  const body=document.getElementById("readerBody");
  if(content.length>0){
    body.innerHTML=renderRich(content);
  }else{
    const sum=(it.summary||"").trim();
    if(sum){
      // 来源站点多为付费墙 / 登录墙 / 反爬限制，无法镜像全文；展示已本地存档的中文摘要兜底
      body.innerHTML='<div class="r-fallback">⚠️ 该条新闻的<b>全文镜像暂不可用</b>（来源站点可能为付费墙 / 登录墙 / 反爬限制，或原文已失效）。下方为已<b>本地存档的中文摘要</b>，可正常查看；完整原文请点击右下角「查看原文 ↗」。</div>'+
        '<p class="r-summary">'+linkify(escapeHtml(sum))+'</p>';
    }else{
      body.innerHTML='<p class="r-empty">暂未获取到该条新闻的全文镜像与摘要。'+(it.url?'可点击右下角「查看原文 ↗」前往原始报道。':'')+'</p>';
    }
  }
  document.getElementById("readerTitle").textContent=it.title;
  document.getElementById("readerSource").textContent=it.source;
  const link=document.getElementById("readerLink");
  if(it.url){link.href=it.url;link.style.display="";}else{link.style.display="none";}
  r.hidden=false;document.body.style.overflow="hidden";
}
function closeReader(){const r=document.getElementById("reader");r.hidden=true;document.body.style.overflow="";}
document.getElementById("reader").addEventListener("click",function(e){if(e.target===this)closeReader();});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeReader();});
</script>
</body></html>
