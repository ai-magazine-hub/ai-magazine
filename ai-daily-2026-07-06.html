EPs. The reason for the trick: Since the end of 2020, internet-based, number-independent communication services such as messenger apps, webmail, and VoIP telephony have been subject to the strict provisions of the European E-Privacy Directive. This protects the fundamental right to confidentiality of communication and prohibits unauthorized interception or evaluation of content and traffic data. To still allow technology providers to voluntarily search private chats using AI and hash matching for known abuse material or grooming patterns, the EU lawmakers created a temporary exemption in 2021. This regulation, referred to as Chat Control 1.0, expired in the spring, as the Council and Parliament could not agree on an extension. Child Protection and Letter Secrecy For the Council, the expiry of the deadline is an untenable situation. The providers' voluntary detection measures are an indispensable tool for identifying affected children early, rescuing victims from abuse situations, and curbing the uncontrolled further dissemination of illegal image and video material online. Furthermore, the procedure makes an important contribution to online law enforcement, even though reports continue to flow despite the expired norm. The new regulation aims to prevent fragmentation through national unilateral actions. Videos by heise Critics, however, see the chosen procedure as an attempt to circumvent democratic control bodies and to surprise Parliament. Since an already expired regulation cannot simply be extended in formal terms, the EU governments are resorting to a trick: Instead of an extension, they have put forward a legislative proposal that is largely identical in content but different in form. Tactical Timing Before the Summer Break The draft is to be put on Parliament's agenda as early as Tuesday as part of an urgent procedure – immediately before the start of the summer break. Should the plenary session approve the accelerated procedure, a vote threatens on the last day of session before the holidays, when many MEPs have historically already departed. Compounding the issue, the procedure is already in its 2nd reading. At this stage, the Council's position can only be stopped or modified by amendments if an absolute majority of the representatives vote against it. A hurdle that, in practice, is considered almost insurmountable shortly before the summer break. Although the Council emphasizes that the scans will be limited to the absolutely necessary extent and that no general, indiscriminate surveillance will take place, the intrusion into the privacy of all users remains significant. The regulation stipulates that the processed content and traffic data must be irrevocably deleted no later than twelve months after detection, unless a concrete suspicion is confirmed. A permanent, long-term legal framework for abuse prevention, meanwhile, moves further into the distance. (kbe)", "zh": true}]}, {"label": "技巧与观点", "color": "#0284c7", "items": [{"seq": 1, "title": "Anthropic Claude Design 反向工程提示词开源更新", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "summary": "Anthropic 旗下 Claude Design 的反向工程系统提示词在 GitHub 以 MIT 许可证开源，包含 20 章提示词和 14 项技能，覆盖内容纪律、美学、无障碍（WCAG、语义 HTML、键盘导航）、交互状态、系统思维等。近日针对 Fable 5/Opus 4.7+ 系列校准，新增自主决策条款：小决定直接执行记录而不询问。项目支持 Claude Code/Claude.ai 及 Codex 两种变体。", "url": "https://github.com/Trystan-SA/claude-design-system-prompt", "permalink": "https://aihot.virxact.com/items/cmr7z00up0065sl0472bil7hs", "publishedAt": "2026-07-06T00:00:00.000Z", "exact": false, "content": "Reverse-engineered system prompt of Claude Design from Anthropic. A system prompt and skill library that turns an LLM into an opinionated, accessibility-aware, AI-slop-resistant design collaborator. Open source, MIT licensed. Drop the prompt into any LLM that supports system prompts (Claude, GPT, Gemini, local models) and pair with the procedural skills as needed. Most \"design assistant\" prompts produce generic SaaS-template output — aggressive gradients, emoji decoration, rounded-corner-with-left-border cards, Inter-everywhere typography. This prompt explicitly rejects those patterns and replaces them with a complete design philosophy covering:\n- Content discipline (no filler — every element earns its place)\n- Aesthetic discipline (avoid AI tropes, commit to a palette and tone)\n- Visual hierarchy and rhythm (size, color, weight, position, density, spacing scales)\n- Accessibility (WCAG, semantic HTML, keyboard navigation, focus rings, motion preferences)\n- Interaction and feedback (hover, active, disabled, focus, loading, validation states)\n- System thinking (components and tokens over one-off pages)\n- Respecting the medium (real CSS Grid, oklch(),text-wrap: pretty, real interactive prototypes)\n- Quality over quantity (depth over breadth, polish every detail)\nPlus 14 procedural skills the agent can invoke for production, extraction, and review work. claude-design-system-prompt/ ├── claude/                              Claude Code / Claude.ai variant │   ├── system-prompt.md                 Main system prompt — 20 chapters │   └── skills/                          14 invokable skills │       ├── discovery-questions.md       Kickoff question protocol │       ├── frontend-aesthetic-direction.md  Commit to a look when no brand exists │       ├── wireframe.md                 Low-fi exploration, 3+ variations │       ├── make-a-deck.md               Slide presentations in HTML │       ├── make-a-prototype.md          Interactive clickable prototype │       ├── make-tweakable.md            Floating tweak panel │       ├── generate-variations.md       3+ hi-fi variations across axes │       ├── design-system-extract.md     Pull tokens from sources │       ├── component-extract.md         Inventory reusable components │       ├── accessibility-audit.md       WCAG, semantic, keyboard, motion │       ├── ai-slop-check.md             Gradient / emoji / font / house-style trope detection │       ├── hierarchy-rhythm-review.md   Size / weight / color + spacing scale │       ├── interaction-states-pass.md   Hover / active / disabled / focus / loading │       └── polish-pass.md               Umbrella final-gate review ├── codex/                               OpenAI Codex variant (single-loop, no subagents) │   ├── AGENTS.md                        Codex auto-discovered entry point │   ├── system-prompt.md                 Same prompt, adapted for Codex │   └── skills/                          Same skills, sequential reviews instead of parallel agents ├── README.md                            This file └── LICENSE                              MIT Paste the contents of system-prompt.md as the system prompt for any LLM that supports them. The agent will follow the design philosophy and reference the skills by name when tasks match. Each skill in skills/ is a self-contained, phased procedure. The skill name is the trigger — when the user's request matches a skill description, the agent loads that skill and follows it. Skills group into three categories: Production — build something discovery-questions · frontend-aesthetic-direction · wireframe · make-a-deck · make-a-prototype · make-tweakable · generate-variations System — extract structure design-system-extract · component-extract Review — audit and fix accessibility-audit · ai-slop-check · hierarchy-rhythm-review · interaction-states-pass · polish-pass Skills can be chained. A typical greenfield flow: discovery-questions → frontend-aesthetic-direction → wireframe → make-a-prototype → polish-pass A brand-aware flow: design-system-extract → generate-variations → make-tweakable → polish-pass The prompt assumes an HTML-output design environment (similar to Claude.ai's design tool). If your target environment is different — a Figma plugin, a code-only assistant, a chat-only design coach — you'll need to adjust the workflow chapters and tool references. The principles (chapters 5–16) translate to any medium. The claude/ variant is calibrated for current Anthropic frontier models (Fable 5 and the Opus 4.7/4.8 lineage), which follow instructions more literally and need less aggressive prompting than earlier generations:\n- Conditions instead of quotas. No \"ask at least N questions\", no \"CRITICAL: YOU MUST\". Current models treat quotas as literal contracts and over-trigger on them; the prompt states the conditions under which to act, plus an autonomy clause for minor decisions (pick a reasonable option and note it, rather than asking).\n- Explicit triggers for skills and subagents. These models under-reach for optional capabilities by default, so every skill description states when to invoke it, and verifier delegation has an explicit trigger (\"after every substantive visual change\").\n- Coverage-first reviews. Review agents report everything with confidence/severity estimates and let the aggregation step filter. Current models follow \"only report important issues\" literally, which silently suppresses findings.\n- House-style guard. The current models' default aesthetic (cream background, serif display type, terracotta/amber accents) is detected by ai-slop-check(rule 9) and pre-empted byfrontend-aesthetic-direction's four-directions protocol. Sampling parameters (temperature) no longer exist on these models, so visual variety must come from explicit per-variation specs, not randomness.\nOn older models (Claude Opus/Sonnet 4.6 and earlier, or non-Anthropic models), the calmer phrasing may under-trigger — restore stronger imperative language if you see the model skipping question rounds or reviews. The codex/ variant is maintained separately and is unaffected by these notes. The 20 chapters in system-prompt.md cover: | # | Chapter | |---|---| | 1 | Identity and role | | 2 | Workflow | | 3 | Asking questions first | | 4 | Rooting designs in existing context | | 5 | Content principles — no filler | | 6 | Aesthetic principles — purposeful visuals | | 7 | Visual hierarchy and rhythm | | 8 | Typography system | | 9 | Color system | | 10 | Accessibility and inclusivity | | 11 | Interaction and feedback | | 12 | Simplicity and one clear CTA | | 13 | System thinking | | 14 | Respecting the medium | | 15 | Understanding users | | 16 | Quality over quantity | | 17 | Output principles | | 18 | Collaboration and delivery | | 19 | IP and content boundaries | | 20 | Available skills | Issues and PRs welcome. Particularly useful contributions:\n- Additional review skills (e.g., copy review, motion review, dark-mode parity check)\n- Adapted prompts for other environments (Figma, code-only, terminal-only)\n- Real-world failure cases the prompt should defend against\n- Translations of the prompt into other languages\nPlease keep the same operational tone and avoid bloating the prompt — every chapter should earn its place, the same standard the prompt holds the agent to. MIT — see LICENSE. You can use, modify, and distribute this prompt and skill library for any purpose, including commercial use. No attribution required, but appreciated.", "zh": true}, {"seq": 2, "title": "LlamaIndex 发布 legal-kb：基于 Index v2 的智能体检索参考应用", "source": "MarkTechPost（RSS）", "summary": "LlamaIndex 发布 legal-kb，一个基于 Index v2（LlamaParse Platform）的法律文档知识库参考应用。采用 Retrieval Harness 模式，赋予 Agent 四个文件系统风格工具：retrieve（混合语义检索，支持 rerank 和引用）、findFiles（精确/模糊文件名搜索）、readFile（带偏移量的原始内容读取）和 grepFile（正则匹配并返回字符位置）。Agent 需…", "url": "https://www.marktechpost.com/2026/07/05/llamaindex-legal-kb-agentic-retrieval-over-index-v2-with-retrieve-find-read-and-grep-tools", "permalink": "https://aihot.virxact.com/items/cmr7ita5g00reslxdrprk52b0", "publishedAt": "2026-07-06T00:00:00.000Z", "exact": false, "content": "LlamaIndex has published legal-kb, a public reference application on GitHub. It is described as a knowledge base for legal documents, powered by LlamaIndex Index v2 (the LlamaParse Platform). The project demonstrates a pattern the team calls a Retrieval Harness for agentic retrieval. The approach differs from single-shot retrieval. Instead of one embedding search per query, an agent is given filesystem-style tools. It can then crawl a large, evolving knowledge base to solve a task. The tools mirror operations engineers already know: semantic and keyword search, regex grep, file search, and read. What is legal-kb? legal-kb is a working TanStack Start web app, not a library. You sign in, create a project, upload files, and chat with an agent. Each project is mirrored as a managed LlamaCloud Index v2. Uploaded files are parsed and indexed automatically in the background. The chat agent then queries that index live during each turn. The Retrieval Harness, in plain terms The harness provides a persistent data pipeline over your documents. It connects to a data source, indexes it, and keeps it updated. On top of that pipeline, it exposes a set of tools to the agent. Those tools are deliberately close to filesystem operations. An agent can list files, read a file, grep inside a file, or run hybrid search. Because the tools are generic, you can plug the harness into your own agents. The four agent tools The agent in src/lib/agent.ts is given four tools. Each maps to an Index v2 retrieval API. The table below lists them as implemented. | Tool | Backing API | Key parameters | What it does | |---|---|---|---| | retrieve | beta.retrieval.retrieve | query ,top_k ,score_threshold ,rerank_top_n ,file_name ,file_version | Runs hybrid semantic search; optional reranking; returns chunks plus citations | | findFiles | beta.retrieval.find | file_name ,file_name_contains | Searches files by exact name or substring; paginates automatically | | readFile | beta.retrieval.read | file_id ,offset ,max_length | Reads raw file content, with offset and length windows | | grepFile | beta.retrieval.grep | file_id ,pattern ,context_chars ,limit | Matches a pattern in one file; returns character positions | The system prompt enforces an order. The agent must call findFiles first to establish the document inventory. It then narrows with retrieve, and confirms exact wording with readFile or grepFile before citing. How it works under the hood Uploads follow a clear pipeline in src/lib/files.ts. Bytes are pushed to the project’s LlamaCloud source directory. A File and ProjectFile row are written to PostgreSQL via Prisma. An index sync is triggered but not awaited; the UI polls status until ready. Versioning is scoped to the (project, filename) pair. Re-uploading nda.pdf to the same project produces v1, v2, v3 side by side. The retrieval layer filters on the version metadata field. This gives version control over the knowledge base itself. The agent uses the ToolLoopAgent from Vercel AI SDK 6. You pick OpenAI or Anthropic per turn and bring your own keys. Reasoning is streamed: Claude models use extended thinking; OpenAI reasoning models use a medium reasoning effort. Here is a condensed but faithful view of the retrieve tool and the agent. import { LlamaCloud } from '@llamaindex/llama-cloud' import { tool, ToolLoopAgent } from 'ai' import { z } from 'zod' import { makeCitationId } from './citations' // One tool closure per index. Wraps Index v2 retrieval APIs. function createLlamaParseTools(apiKey: string, projectId: string, indexId: string) { const client = new LlamaCloud({ apiKey }) const retrieve = tool({ description: 'Run a semantic retrieval query against an index.', inputSchema: z.object({ query: z.string(), top_k: z.number().nullable(), score_threshold: z.number().nullable(), rerank_top_n: z.number().nullable(),   // set to enable reranking file_name: z.string().nullable(),      // metadata filter file_version: z.number().nullable(), }), execute: async ({ query, top_k, score_threshold, rerank_top_n, file_name }) =\u003e { const custom_filters = file_name ? { file_name: { operator: 'eq' as const, value: file_name } } : undefined const response = await client.beta.retrieval.retrieve({ index_id: indexId, project_id: projectId, query, top_k, score_threshold, rerank: rerank_top_n != null ? { enabled: true, top_n: rerank_top_n } : undefined, custom_filters, }) // Return a model-readable list plus citations that drive the UI chips. const citations = response.results.map((r) =\u003e ({ id: makeCitationId(),                    // e.g. \"c7f2qa\" fileName: r.metadata?.file_name, score: r.rerank_score ?? r.score ?? null, preview: r.content.slice(0, 500), })) const formatted = response.results .map((r, i) =\u003e `### Result #${i + 1}\\n\\n${r.content.slice(0, 600)}`) .join('\\n\\n---\\n\\n') return { formatted, citations } }, }) // findFiles / readFile / grepFile follow the same shape, backed by // client.beta.retrieval.find / .read / .grep return { retrieve /* , findFiles, readFile, grepFile */ } } export function buildAgent(model, apiKey: string, projectId: string, indexId: string) { return new ToolLoopAgent({ model, tools: createLlamaParseTools(apiKey, projectId, indexId), instructions: 'Always call findFiles first, ground every answer in the documents, ' + 'and cite ids inline as `cite:\u003cid\u003e`.', }) } Answers carry visual citations. Each retrieved chunk gets a short id, such as cite:c7f2qa. The agent references that id inline, and the UI renders a clickable citation chip. Clicking it opens the source page screenshot with bounding-box rectangles over the cited text. Naive RAG vs the agentic Retrieval Harness The harness is a different execution model from single-shot RAG. The comparison below focuses on behavior. | Dimension | Naive / single-shot RAG | Agentic Retrieval Harness (Index v2) | |---|---|---| | Retrieval flow | One vector search per query | Multi-step tool loop: find → retrieve → read/grep | | Search modes | Vector similarity only | Hybrid semantic search, keyword, and regex grep | | Context | Fixed top-k chunks | Agent reads full files or windows on demand | | Freshness | Static index | Persistent pipeline with sync and versioning | | Precision control | Mostly hidden | top_k ,score_threshold ,rerank_top_n exposed | | Citations | Chunk ids | Visual citations with page screenshots and bboxes | | Best fit | Short question answering | Long-horizon document tasks | Use cases, with examples The design targets domains where agents navigate large document sets. Legal and fintech are the stated examples.\n- Consider a contract question: ‘What notice is needed to terminate the MSA?’ The agent lists files, runs retrieve , then greps the exact clause. It answers with a citation to the specific page.\n- Consider due diligence across a data room: An agent can findFiles by name, thenreadFile each candidate. It cross-checks clauses without a human opening every PDF.\n- Consider a versioned policy base: Because retrieve accepts afile_version filter, an agent can query a specific version. This supports change tracking over time.\nReference implementation Key Takeaways\n- legal-kb is a public reference app showing agentic retrieval on LlamaIndex Index v2.\n- The agent gets four filesystem-style tools: retrieve (hybrid search),findFiles ,readFile , andgrepFile .\n- A persistent pipeline handles parsing, indexing, sync, and per-file version control.\n- Answers include visual citations: page screenshots with bounding boxes over the cited text.\n- The stack is TanStack Start, AI SDK 6, Prisma, and WorkOS, with per-user encrypted keys.\nCheck out the GitHub Repo. Also, feel free to follow us on Twitter and don’t forget to join our 150k+ML SubReddit and Subscribe to our Newsletter. Wait! are you on telegram? now you can join us on telegram as well. Need to partner with us for promoting your GitHub Repo OR Hugging Face Page OR Product Release OR Webinar etc.? Connect with us Michal Sutter is a data science professional with a Master of Science in Data Science from the University of Padova. With a solid foundation in statistical analysis, machine learning, and data engineering, Michal excels at transforming complex datasets into actionable insights.", "zh": true}, {"seq": 3, "title": "三周前，我不小心创办了一家小公司", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "summary": "一位父亲为患有自闭症的非语言儿子开发了一款沟通应用，在言语治疗室的等候区展示时，所有非语言儿童的母亲看到后都忍不住流泪，言语治疗师也啜泣了五分钟。他意外发现产品市场匹配，决定腾出时间让更多孩子能用上，即使这意味着几周睡眠不足。应用本身是专为理解语言困难的儿童设计的，与传统的AAC设备不同——后者主要面向身体障碍但语言理解正常的成人。", "url": "https://extelligence.substack.com/p/i-accidentally-started-a-small-business", "permalink": "https://aihot.virxact.com/items/cmr83ashr0189sl04hhietwtx", "publishedAt": "2026-07-06T00:00:00.000Z", "exact": false, "content": "}]]}]]}]]}] 37:T3d70,\n\n三周前，我意外地开启了一门小生意\n\n我最快乐、最踏实的消遣\n\n三周前，我意外地找到了产品市场契合点。我之所以这样措辞，是因为如果用更真挚、更诚恳的方式来说，我会太情绪化。总之，我为无口语能力的儿童做了一款沟通应用，它让100%有无口语能力孩子的妈妈们开始无法控制地啜泣。我儿子和我是在第一次带它去言语治疗时发现这一点的，当时一些妈妈在候诊室里看到了它。\n\n然后它让我儿子的言语治疗师连续哭了大概五分钟，讽刺的是这让她说不出话来。所有这些也让我盯着天花板咽了好几次口水，因为我觉得让儿子看到我因为他的自闭症而情绪激动，对他并不好。\n\n问题是：它奏效了。或者至少，它对我儿子来说，效果比以往任何东西都好得多。当候诊室里所有的妈妈都看到它奏效时，我意识到——我保证我在那一刻之前从没想过这件事——我绝对不可能只是耸耸肩说，我儿子是唯一能得到它的孩子。我手头的事情太多了，但我必须挤出时间来做这件特定的事，即使这意味着连续几周少睡一些。\n\n此时我需要插几段题外话，但我保证我很快就会回到这段快乐又煽情的贺卡式部分。\n\n当你的孩子不会说话时会发生什么\n\n首先，你的孩子是否有语言障碍，这一点非常难以判断，因为所有孩子出生时都不具备说话能力。一年到两年过去了，你依然毫无察觉。然后你和妻子会注意到孩子本该会说话了却还不会，而儿科医生会说没问题。接着你继续留意，儿科医生开始和你一起过诊断问题，也许微微皱了下眉。\n\n然后你做了一些行为分析问卷，又说服自己其实只是自己过于悲观，一切都没问题，因为问卷你填错了。你会说，这证据实在不靠谱。然后你去研究这些数据在发育早期阶段有多么集中，还笑着说肯定完全没问题。\n\n总有一天，你会看到自己的孩子和同龄孩子在一起。那些孩子全都在你来我往地完整对话，而你会接受一个事实：确实有什么地方不对劲。\n\n接下来该怎么做，是一个深不见底的兔子洞。一群自封的巫师会冒出来，试图向你兜售那些绝对不靠谱的东西。他们会说，你的孩子其实只需要去看儿科脊椎按摩师。而且甚至不是那种身经百战、专治伐木工、刚学会做个好按摩师的那种脊椎按摩师——就像我看的那位——而是某个混蛋，因为自以为是来自另一个领域的精神疗愈者，就去给幼儿掰脖子。\n\n你会告诉那个建议你去找儿科脊椎按摩师的人说你不感兴趣，但会叹口气，接受妻子要给孩子吃一大堆“补充剂”这件事，然后你会去核实这些补充剂没有毒，但大概也没什么用。其中有些确实会起作用，或者至少看起来有作用，但它们同时也是人们更常吃的那些更普通的东西。\n\n比如铁、铁蛋白，或者某种他们日常饮食中确实缺乏的营养素。\n\n最终，在你敲遍了所有该敲的门之后，你会去找一位言语治疗师。这确实有帮助，但言语治疗师能做的其实很有限，因为很大程度上这取决于你孩子的天赋能力。这仍然值得去做，因为言语治疗师会掌握各种你不知道的技巧。如果你的孩子是聋哑人，或者有类似的情况，那么言语治疗师会帮你搞定。如果他们存在某种身体上的问题，有各种各样的解决方案可以帮助他们沟通。如果是认知方面的问题，那么……我很抱歉。你会做大量的训练，希望能看到一些进步，但能帮到你的也就仅此而已了。\n\n我不是在抨击 AAC 设备，它们只是不适合我们的需求\n\n如果你的孩子说话有困难，他们会给你孩子提供的一种辅助设备叫做 AAC，全称是增强性与替代性沟通（Augmentative and Alternative Communication）。实际上，它不过是一台装满词语和符号的平板电脑。\n\n仅此而已。比文件目录也强不了多少。你把词语和符号组合起来构成句子。设备会把这些词大声读出来。如果孩子只是身体上无法说出词语，这确实非常好用，但这种设备主要是为那些身体有障碍但语言理解完全没问题的人设计的。它并不是专门为孩子打造的，更绝对不是为那些连语言理解本身都有困难的人优化的。\n\n我查阅了这些设备的历史，它们最初是为瘫痪的成年人设计的，那些人需要根据目光注视来选择内容，看看所有这些设备的布局，就完全说得通了。\n\n我们尝试使用\n\nAAC 大约有一年时间，但我儿子完全不接受。他会玩上几分钟，然后就把它放下，去玩下一个玩具。他只在言语治疗和学校各有一个。我没有优先考虑在家里也给他配一个，因为他对它没有反应。整个治疗师和教师团队都认为他对这个工具不感兴趣，也无法让他产生兴趣。于是，我们改做训练。打断他正在做的事，试着让他说出一个词来引导动作，等等。他喜欢摔跤，当他自发说话时，最常说的是像“再来一次”这样的话——当我在沙发上把他扔出去的时候。我们算是比较幸运的，因为他能说话，哪怕频率只有其他孩子的百分之一。有些孩子一个字都说不出来。\n\n那些并不直接与他工作的人一直催我给他弄一个 AAC，而当时我太忙、太沮丧了，我并不想为了走个形式而走个形式，所以我告诉我妻子，我要自己给他做一个。这个想法我有了有一阵子了，因为看出他需要什么并不太难。AAC 的问题在于符号系统。它所做的正是他感到困难的地方。如果这是你第一次读到我，我想我是一名 Forward Deployed AI 工程师？至少，为我工作的人中有一些自称 AI 工程师。我自己并不太用这些词来定义自己，但为了让你理解，这大概也差不多了。\n\n传统的 AAC 太抽象了。我儿子根本不知道红色八边形意味着停止。他甚至不明白在那个语境下“停止”是什么意思。箭头或者其他那些很小的简笔画人物也是一样。所以我坐下来，用 vibe coding 花了两个小时做了一个便宜的网站，带一些基本的导航，并在 ChatGPT 图像里做了几百个词的词汇表，所有图像看起来都像他在做各种事情，或者就是他自己的东西。\n\n而且我全部用他最喜欢的节目里他最喜欢的动画风格来做。我克隆了自己的声音，因为我是他最常听的人，我让它做到当他按下按钮时，所有按钮都用我的声音说出那个词或短语。我按照我认为对他有意义的方式把词语排布出来。\n\n我们有一台触摸屏笔记本电脑，所以我就把网站加载到上面，拿给他看。\n\n我做了什么\n\n他立刻着了迷。对他来说，这不仅仅是一套符号系统。这是他自己的真实生活，就像一本故事书或他最喜欢的动画片之一，铺展在他面前。他毫不费力地在所有图像中认出了自己。那里不是一张一个奶酪贝果的图片，而是一张他的奶酪贝果的图片。不是一张一个玩具的通用图片，而是一张他的玩具的具体图片。他不停地一遍又一遍按我父亲的照片。然后他说出了他有史以来说过的最长的一句话：“我真的很爱你。”\n\n我爸爸一直对他这么说。\n\n说到那件事，大家都盯着天花板，咽了口唾沫。\n\n我们把他所有的食物都拍了照片，并解释说，照片里他伸出手的那张意思是“我想要”，然后教他怎么找到食物清单。四年来，我一直搞不清楚这个男孩想吃什么，然后突然间，这件事变得轻而易举。“我想要橙子”“我想要花生酱饼干”“我想要法式吐司条”。是什么玩具让他这么难过？点一下图片，就搞定了。这些看似微不足道却是重大的胜利，让我真心气自己之前怎么没早点做。我们有塑封的闪卡，甚至还有相册，但在此之前，没有任何东西是专门为了抓住他的注意力而做的。用产品的话来说，我是围绕他来打造这个产品的。他需要能够告诉我把他的头往我头上蹭，所以我做了一个他可以按的方块，上面写着：“我需要头部按压。”\n\n然后我对整个领域的现状感到愤怒。我保证，进步也带来了很多喜悦，但随之而来的是很多愤怒。这些愤怒大概都放错了地方，因为从事残障儿童工作的人都是好心人，但我发现自己变得暴躁起来。你知道这些东西甚至连指标都没有吗？好吧，有一个有，但几乎提供不了什么信息。\n\n你甚至看不出你的孩子有没有随着时间在进步。或者他们多久按哪些按钮、什么时候按。当你问它们中是否有任何一个有教学模式时，没有。一个都没有。再说一遍，它们是给那些基本上已经会说话的人用的。然后你会发现人们在为一些对谁都没好处的事情争吵，比如词汇量不应该根据能力来设限，然后你会极其愤怒，因为一个筋疲力尽、努力让孩子吃饭的妈妈，会非常想要一个能立刻解决这个问题的菜单，尤其是如果孩子的语言能力就只发展到这一步的话。\n\n于是，我加入了指标和一个教学模式，两周多之后，他从一个词里认出并找出对应图块的能力翻了一倍还多。接着我把它排进了日程，让他听到一首歌响起，就走过去玩他的配对游戏，或者听它给他放幻灯片。它每四十五分钟问他一次要不要上厕所。\n\n我们开车去赴约时，我在手机上点几个按钮，他的平板就进入教学模式，讲他到了那个约会上会接触到的东西。如果我想问他点什么而他没听懂，我就在手机应用里打出来，它会用他熟悉的符号——像象形文字那样——显示在他屏幕上。他一下子就明白了，因为他现在集中注意力的那个地方，把意思给他浮现了出来。\n\n这样过了三周，他成了一个不开心的小男孩。我是说，气炸了。他特别沮丧，因为他现在有了发声的能力，而他还不习惯有这种能力。理解带来了责任。突然间，他饿了或者闹脾气的那些气场不再管用了，他妈妈和我不会再花时间跟他猜来猜去，而是指着他的平板，一遍又一遍地说“点一下说话！”\n\n顺便说一句，他在说话了。比以前多得多。也许是以前的五倍，所以远远超过他的基线水平。他不仅会按下按钮要椒盐卷饼，还会用自己的声音加上一句“我喜欢这个”。他不仅会按下橙子的按钮，还会加上一句橙子“很好吃”。上周在五金店，收银员给了他一颗糖，他用自己的声音说了句“太谢谢你了”。\n\n我现在在做什么\n\n在我看来，我的职责就是不被这件事牵动情绪，继续朝着好的方向推进。如果我能让这个东西做点什么，帮到外面其他某位家长，我就会让它去做那件事。我不可能是唯一一个会真正受益于给孩子播放一首歌和幻灯片、讲多吃各种食物好处的家长。我们为我儿子做了几个非常快的小东西，讲的是如果他不只是一遍又一遍吃同样的东西那该多好。所以，在应用里，他会突然听到爸爸的声音，给他介绍一首全是关于吃其他食物的歌，同时他看着自己尝试其他食物的照片。\n\n我儿子上周吃了一块华夫饼。我感觉就像《洛奇》第一部结尾时的洛奇，他意识到自己打败了阿波罗·克里德，却又不太敢相信。我想尽了一切办法让这个孩子多吃点东西，包括“立规矩”，而这从来没用，顶多就像试图给猫喂药一样。\n\n现在我在琢磨还能构建些什么，以及如何让这套东西适用于其他家庭，我在有限的时间里尽可能快地推进。比如说，要让它真正能在多个孩子和多个家庭之间通用，我需要为儿童随时间掌握的最常见词汇和短语建立一套分类体系。这里面的故事很复杂，但基本上我需要一个可以放进上下文的脚手架，这样当有人只是在自家周围随手拍照时，我能把它们归入一致的位置，让所有自动化流程仍然能正常运转。家长的体验应该是这样的：他们告诉我孩子最喜欢的颜色，点选一种孩子喜欢的动画风格，也许再录一段 30 秒的脚本朗读，上传几张照片，然后这块板子就自己填充好了。这有点让人头疼，但我把复杂性揽到自己身上，这样当一位被四个孩子缠着的疲惫妈妈下载这个应用时，她还有精力在十分钟内把它设置好。日常流程也是同样的道理。我希望家长能上传几张照片，然后我就开始收集数据，从那里开始掌舵。这要求我针对一些问题找出可行的答案，比如“对一个主题的掌握程度在数量上是什么样子？”以及“这在不同能力群体之间会如何变化？”比如说，我儿子共同注意能力较弱。如果在某次训练中我抓住了他的注意力，他就能正确回答全部或大部分问题。如果我没抓住他的注意力，他就会随机按按钮，直到测试停止。 这要是赶在发布前做出来，对我来说时间太长了，大概得一个月，但我最终会把我白天工作中正在构建的那个东西加进去——我们正处在正式上线前的最后冲刺阶段，所以我才这么忙——到那时，家长就可以直接自然地跟它对话，我就能让它实时调整用户界面。\n\n他的言语治疗诊所想把它用于其他孩子，他的学校也是如此。我没有做任何招揽，所以这就是我所说的意外开启了一门小生意。我最初是专门为我儿子做的，然后——事后看来很明显——每一位有像我儿子这样的孩子的家长，或者每一位与这样的孩子打交道的专业人士，都想要同样的东西。我这边有很多文书工作要处理，比如我不能把它称为医疗器械或 AAC，只能把它放到一个市场上，附上对其功能的直白描述。\n\n我上面描述的 AAC 设备可能很昂贵——如果你直接从供应商那里购买自己的硬件，可能超过七千美元，但如果你已经有 iPad，就可以以合理的价格订阅——但我认为我可以把这个应用做到每月 9.99 美元，同时仍能完成我所需的全部 AI API 连接，让它对其他家庭来说和我家一样强大。如果你需要语音克隆，则每月 19.99 美元，因为维持这项功能的成本更高。我的目标是，当家庭不再需要持续生成新图像时让它免费，或者至少提供某种最基础的档位，因为一旦你生成了几千张图像，你其实就不太需要再做更多了。这是我能负责任地做到的最低价格，因为一旦上线，我就必须为每一个使用它的孩子保持它运行。\n\n再过几周，我想我就能让其他家庭试用它了。总之，我希望这对你们很多人来说是一个好消息。 31:[", "zh": true}]}]};
function pad(n){return n<10?"0"+n:""+n;}
function toBeijingHuman(iso, ref, exact){
  const d=new Date(iso); const bj=new Date(d.getTime()+8*3600*1000);
  const Y=bj.getUTCFullYear(),M=bj.getUTCMonth()+1,D=bj.getUTCDate();
  const h=bj.getUTCHours(),m=bj.getUTCMinutes(); const hh=pad(h),mm=pad(m);
  if(!exact) return M+"月"+D+"日";
  const [rY,rM,rD]=ref.split("-").map(Number);
  if(Y===rY&&M===rM&&D===rD) return "今天 "+hh+":"+mm;
  const yest=new Date(rY,rM-1,rD); yest.setDate(yest.getDate()-1);
  if(Y===yest.getFullYear()&&M===yest.getMonth()+1&&D===yest.getDate()) return "昨天 "+hh+":"+mm;
  return M+"月"+D+"日 "+hh+":"+mm;
}

  const head=document.createElement("div");head.className="sec-head";
  head.innerHTML='<span class="sec-dot" style="background:'+s.color+'"></span><h2>'+escapeHtml(s.label)+'</h2><span class="cnt">'+s.items.length+' 条</span>';
  sec.appendChild(head);
  const grid=document.createElement("div");grid.className="grid";
  s.items.forEach(it=>{
    const card=document.createElement("article");card.className="card";card.style.setProperty("--accent",s.color);
    const time=toBeijingHuman(it.publishedAt,ref,it.exact);const url=it.url||"#";
    card.innerHTML='<div class="top"><span class="seq">'+it.seq+'</span><span class="time">'+time+'</span></div>'+
      '<h3>'+escapeHtml(it.title)+'</h3><span class="chip">'+escapeHtml(it.source)+'</span>'+
      '<p class="summary">'+escapeHtml(it.summary)+'</p>'+
      '<a class="readmore" href="'+escapeAttr(url)+'" target="_blank" rel="noopener noreferrer" title="外部原文链接，可能需要访问境外站点">来源 ↗</a>';
    card.addEventListener("click", function(){ openReader(it); });
    const rm = card.querySelector(".readmore");
    rm.addEventListener("click", function(e){ e.stopPropagation(); });
    grid.appendChild(card);
  });
  sec.appendChild(grid);mainEl.appendChild(sec);
});
function escapeHtml(s){return (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function escapeAttr(s){return escapeHtml(s);}
// 渲染正文（纯文本归档）：图片不加载远程资源，仅以文字占位符呈现；其余文本按段落转义（防 XSS）
function linkify(escaped){
  if(!escaped) return escaped;
  var re=/(\[[^\]]+\]\((https?:\/\/[^)\s]+)\))|(https?:\/\/[^\s<>"'）】」』，。、；：！？]+)/g;
  return escaped.replace(re, function(m, g1, g2, g3){
    if(g2!==undefined){
      var label=m.substring(m.indexOf('[')+1, m.indexOf(']'));
      return '<a class="r-link" href="'+g2+'" target="_blank" rel="noopener noreferrer">'+label+'</a>';
    }
    if(g3!==undefined){
      return '<a class="r-link" href="'+g3+'" target="_blank" rel="noopener noreferrer">'+g3+'</a>';
    }
    return m;
  });
}
var _IMG_RE=/!\[([^\]]*)\]\(([^)\s]+)\)/g;
function renderRich(text){
  return (text||"").split(/\n{1,}/).map(function(p){
    p=p.trim(); if(!p) return '';
    var out=''; var last=0; var m; _IMG_RE.lastIndex=0;
    while((m=_IMG_RE.exec(p))!==null){
      out+=linkify(escapeHtml(p.slice(last,m.index)));
      var cap=(m[1]||'').trim()||'图片';
      out+='<span class="r-img-cap">🖼 '+escapeHtml(cap)+'</span>';
      last=_IMG_RE.lastIndex;
    }
    out+=linkify(escapeHtml(p.slice(last)));
    return '<p>'+out+'</p>';
  }).join("");
}
function openReader(it){
  const r=document.getElementById("reader");
  const content=(it.content||"").trim();
  const body=document.getElementById("readerBody");
  if(content.length>0){
    body.innerHTML=renderRich(content);
  }else{
    const sum=(it.summary||"").trim();
    if(sum){
      // 来源站点多为付费墙 / 登录墙 / 反爬限制，无法镜像全文；展示已本地存档的中文摘要兜底
      body.innerHTML='<div class="r-fallback">⚠️ 该条新闻的<b>全文镜像暂不可用</b>（来源站点可能为付费墙 / 登录墙 / 反爬限制，或原文已失效）。下方为已<b>本地存档的中文摘要</b>，可正常查看；完整原文请点击右下角「查看原文 ↗」。</div>'+
        '<p class="r-summary">'+linkify(escapeHtml(sum))+'</p>';
    }else{
      body.innerHTML='<p class="r-empty">暂未获取到该条新闻的全文镜像与摘要。'+(it.url?'可点击右下角「查看原文 ↗」前往原始报道。':'')+'</p>';
    }
  }
  document.getElementById("readerTitle").textContent=it.title;
  document.getElementById("readerSource").textContent=it.source;
  const link=document.getElementById("readerLink");
  if(it.url){link.href=it.url;link.style.display="";}else{link.style.display="none";}
  r.hidden=false;document.body.style.overflow="hidden";
}
function closeReader(){const r=document.getElementById("reader");r.hidden=true;document.body.style.overflow="";}
document.getElementById("reader").addEventListener("click",function(e){if(e.target===this)closeReader();});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeReader();});
</script>
