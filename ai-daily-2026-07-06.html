esThis news also comes as the 4-compute-die Rubin Ultra has been cancelled, leaving only the smaller 2-compute-die Rubin Ultra, which will deliver roughly half the real-world performance of the 4-die Rubin Ultra. 5/6🧵NVIDIA will sell significantly more Oberon Rubin racks and Oberon Rubin “Ultra” racks to make up for this shortfall. We discuss the implications of these mass NVIDIA delays and cancellations for the memory, PCB, and ODM supply chains in our Core Research and AI Accelerator\n- Just stop with this shit already, you've lost almost all of your credibility at this point.\n- 加入对话"}, {"seq": 4, "title": "欧盟理事会通过快速通道强制推行\"聊天管控\"（Chat Control 2.0）", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "summary": "欧盟理事会通过书面程序快速通过一项新法规，强制要求科技集团对加密通信进行无差别扫描（Chat Control 2.0），以填补过渡性规定4月3日到期后的法律漏洞，并向欧洲议会施压。批评者指责该做法试图绕过民主监督。草案将在夏季休会前以紧急程序提交议会表决，多数议员可能已离会，反对需绝对多数，几乎无法阻止。理事会称扫描限于必要范围，处理的数据须在检测后12个月内不可撤销地删除。", "url": "https://www.heise.de/en/news/Chat-Control-1-0-EU-Council-forces-messenger-scans-via-fast-track-11353659.html", "permalink": "https://aihot.virxact.com/items/cmr815l2z00pgsl04wayrv4tr", "publishedAt": "2026-07-06T00:00:00.000Z", "exact": false, "content": "}] 2a:Tb50, 数字信件保密争议在欧盟即将进入暑期休会前升级至新阶段。由于欧盟议会持续抵制导致 （即强制无嫌疑扫描加密通信）谈判陷入僵局后，欧盟部长理事会正通过法律手段推进议程。\n\n各成员国拟通过快速程序重启已于4月3日到期的技术集团自愿监控信息过渡条例。理事会于周四通过书面程序就 条例达成立场，旨在填补即将出现的法律漏洞并加大对欧洲议会议员的施压。\n\n此举的缘由在于：自2020年底起，即时通讯应用、网页邮件及网络电话等基于互联网的非号码相关通信服务须遵守《欧洲电子隐私指令》严格规定。该指令保护通信保密的基本权利，禁止未经授权拦截或评估通信内容及流量数据。为使技术提供商仍能通过AI与哈希匹配技术自愿搜索私人聊天中的已知虐待材料或诱骗模式，欧盟立法者于2021年设立临时豁免条款。这项被称为", "zh": true}]}, {"label": "技巧与观点", "color": "#0284c7", "items": [{"seq": 5, "title": "Anthropic Claude Design 反向工程提示词开源更新", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "summary": "Anthropic 旗下 Claude Design 的反向工程系统提示词在 GitHub 以 MIT 许可证开源，包含 20 章提示词和 14 项技能，覆盖内容纪律、美学、无障碍（WCAG、语义 HTML、键盘导航）、交互状态、系统思维等。近日针对 Fable 5/Opus 4.7+ 系列校准，新增自主决策条款：小决定直接执行记录而不询问。项目支持 Claude Code/Claude.ai 及 Codex 两种变体。", "url": "https://github.com/Trystan-SA/claude-design-system-prompt", "permalink": "https://aihot.virxact.com/items/cmr7z00up0065sl0472bil7hs", "publishedAt": "2026-07-06T00:00:00.000Z", "exact": false, "content": "Reverse-engineered system prompt of Claude Design from Anthropic.\nA system prompt and skill library that turns an LLM into an opinionated, accessibility-aware, AI-slop-resistant design collaborator.\nOpen source, MIT licensed. Drop the prompt into any LLM that supports system prompts (Claude, GPT, Gemini, local models) and pair with the procedural skills as needed.\nMost \"design assistant\" prompts produce generic SaaS-template output — aggressive gradients, emoji decoration, rounded-corner-with-left-border cards, Inter-everywhere typography. This prompt explicitly rejects those patterns and replaces them with a complete design philosophy covering:\n- Content discipline (no filler — every element earns its place)\n- Aesthetic discipline (avoid AI tropes, commit to a palette and tone)\n- Visual hierarchy and rhythm (size, color, weight, position, density, spacing scales)\n- Accessibility (WCAG, semantic HTML, keyboard navigation, focus rings, motion preferences)\n- Interaction and feedback (hover, active, disabled, focus, loading, validation states)\n- System thinking (components and tokens over one-off pages)\n- Respecting the medium (real CSS Grid, oklch(),text-wrap: pretty, real interactive prototypes)\n- Quality over quantity (depth over breadth, polish every detail)\nPlus 14 procedural skills the agent can invoke for production, extraction, and review work.\nclaude-design-system-prompt/\n├── claude/                              Claude Code / Claude.ai variant\n│   ├── system-prompt.md                 Main system prompt — 20 chapters\n│   └── skills/                          14 invokable skills\n│       ├── discovery-questions.md       Kickoff question protocol\n│       ├── frontend-aesthetic-direction.md  Commit to a look when no brand exists\n│       ├── wireframe.md                 Low-fi exploration, 3+ variations\n│       ├── make-a-deck.md               Slide presentations in HTML\n│       ├── make-a-prototype.md          Interactive clickable prototype\n│       ├── make-tweakable.md            Floating tweak panel\n│       ├── generate-variations.md       3+ hi-fi variations across axes\n│       ├── design-system-extract.md     Pull tokens from sources\n│       ├── component-extract.md         Inventory reusable components\n│       ├── accessibility-audit.md       WCAG, semantic, keyboard, motion\n│       ├── ai-slop-check.md             Gradient / emoji / font / house-style trope detection\n│       ├── hierarchy-rhythm-review.md   Size / weight / color + spacing scale\n│       ├── interaction-states-pass.md   Hover / active / disabled / focus / loading\n│       └── polish-pass.md               Umbrella final-gate review\n├── codex/                               OpenAI Codex variant (single-loop, no subagents)\n│   ├── AGENTS.md                        Codex auto-discovered entry point\n│   ├── system-prompt.md                 Same prompt, adapted for Codex\n│   └── skills/                          Same skills, sequential reviews instead of parallel agents\n├── README.md                            This file\n└── LICENSE                              MIT\nPaste the contents of system-prompt.md as the system prompt for any LLM that supports them. The agent will follow the design philosophy and reference the skills by name when tasks match.\nEach skill in skills/ is a self-contained, phased procedure. The skill name is the trigger — when the user's request matches a skill description, the agent loads that skill and follows it.\nSkills group into three categories:\nProduction — build something\ndiscovery-questions · frontend-aesthetic-direction · wireframe · make-a-deck · make-a-prototype · make-tweakable · generate-variations\nSystem — extract structure\ndesign-system-extract · component-extract\nReview — audit and fix\naccessibility-audit · ai-slop-check · hierarchy-rhythm-review · interaction-states-pass · polish-pass\nSkills can be chained. A typical greenfield flow:\ndiscovery-questions → frontend-aesthetic-direction → wireframe → make-a-prototype → polish-pass\nA brand-aware flow:\ndesign-system-extract → generate-variations → make-tweakable → polish-pass\nThe prompt assumes an HTML-output design environment (similar to Claude.ai's design tool). If your target environment is different — a Figma plugin, a code-only assistant, a chat-only design coach — you'll need to adjust the workflow chapters and tool references. The principles (chapters 5–16) translate to any medium.\nThe claude/ variant is calibrated for current Anthropic frontier models (Fable 5 and the Opus 4.7/4.8 lineage), which follow instructions more literally and need less aggressive prompting than earlier generations:\n- Conditions instead of quotas. No \"ask at least N questions\", no \"CRITICAL: YOU MUST\". Current models treat quotas as literal contracts and over-trigger on them; the prompt states the conditions under which to act, plus an autonomy clause for minor decisions (pick a reasonable option and note it, rather than asking).\n- Explicit triggers for skills and subagents. These models under-reach for optional capabilities by default, so every skill description states when to invoke it, and verifier delegation has an explicit trigger (\"after every substantive visual change\").\n- Coverage-first reviews. Review agents report everything with confidence/severity estimates and let the aggregation step filter. Current models follow \"only report important issues\" literally, which silently suppresses findings.\n- House-style guard. The current models' default aesthetic (cream background, serif display type, terracotta/amber accents) is detected by ai-slop-check(rule 9) and pre-empted byfrontend-aesthetic-direction's four-directions protocol. Sampling parameters (temperature) no longer exist on these models, so visual variety must come from explicit per-variation specs, not randomness.\nOn older models (Claude Opus/Sonnet 4.6 and earlier, or non-Anthropic models), the calmer phrasing may under-trigger — restore stronger imperative language if you see the model skipping question rounds or reviews. The codex/ variant is maintained separately and is unaffected by these notes.\nThe 20 chapters in system-prompt.md cover:\n| # | Chapter |\n|---|---|\n| 1 | Identity and role |\n| 2 | Workflow |\n| 3 | Asking questions first |\n| 4 | Rooting designs in existing context |\n| 5 | Content principles — no filler |\n| 6 | Aesthetic principles — purposeful visuals |\n| 7 | Visual hierarchy and rhythm |\n| 8 | Typography system |\n| 9 | Color system |\n| 10 | Accessibility and inclusivity |\n| 11 | Interaction and feedback |\n| 12 | Simplicity and one clear CTA |\n| 13 | System thinking |\n| 14 | Respecting the medium |\n| 15 | Understanding users |\n| 16 | Quality over quantity |\n| 17 | Output principles |\n| 18 | Collaboration and delivery |\n| 19 | IP and content boundaries |\n| 20 | Available skills |\nIssues and PRs welcome. Particularly useful contributions:\n- Additional review skills (e.g., copy review, motion review, dark-mode parity check)\n- Adapted prompts for other environments (Figma, code-only, terminal-only)\n- Real-world failure cases the prompt should defend against\n- Translations of the prompt into other languages\nPlease keep the same operational tone and avoid bloating the prompt — every chapter should earn its place, the same standard the prompt holds the agent to.\nMIT — see LICENSE.\nYou can use, modify, and distribute this prompt and skill library for any purpose, including commercial use. No attribution required, but appreciated."}, {"seq": 6, "title": "LlamaIndex 发布 legal-kb：基于 Index v2 的智能体检索参考应用", "source": "MarkTechPost（RSS）", "summary": "LlamaIndex 发布 legal-kb，一个基于 Index v2（LlamaParse Platform）的法律文档知识库参考应用。采用 Retrieval Harness 模式，赋予 Agent 四个文件系统风格工具：retrieve（混合语义检索，支持 rerank 和引用）、findFiles（精确/模糊文件名搜索）、readFile（带偏移量的原始内容读取）和 grepFile（正则匹配并返回字符位置）。Agent 需…", "url": "https://www.marktechpost.com/2026/07/05/llamaindex-legal-kb-agentic-retrieval-over-index-v2-with-retrieve-find-read-and-grep-tools", "permalink": "https://aihot.virxact.com/items/cmr7ita5g00reslxdrprk52b0", "publishedAt": "2026-07-06T00:00:00.000Z", "exact": false, "content": "", "zh": true}, {"seq": 7, "title": "三周前，我不小心创办了一家小公司", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "summary": "一位父亲为患有自闭症的非语言儿子开发了一款沟通应用，在言语治疗室的等候区展示时，所有非语言儿童的母亲看到后都忍不住流泪，言语治疗师也啜泣了五分钟。他意外发现产品市场匹配，决定腾出时间让更多孩子能用上，即使这意味着几周睡眠不足。应用本身是专为理解语言困难的儿童设计的，与传统的AAC设备不同——后者主要面向身体障碍但语言理解正常的成人。", "url": "https://extelligence.substack.com/p/i-accidentally-started-a-small-business", "permalink": "https://aihot.virxact.com/items/cmr83ashr0189sl04hhietwtx", "publishedAt": "2026-07-06T00:00:00.000Z", "exact": false, "content": "", "zh": true}]}]};
function pad(n){return n<10?"0"+n:""+n;}
function toBeijingHuman(iso, ref, exact){
  const d=new Date(iso); const bj=new Date(d.getTime()+8*3600*1000);
  const Y=bj.getUTCFullYear(),M=bj.getUTCMonth()+1,D=bj.getUTCDate();
  const h=bj.getUTCHours(),m=bj.getUTCMinutes(); const hh=pad(h),mm=pad(m);
  if(!exact) return M+"月"+D+"日";
  const [rY,rM,rD]=ref.split("-").map(Number);
  if(Y===rY&&M===rM&&D===rD) return "今天 "+hh+":"+mm;
  const yest=new Date(rY,rM-1,rD); yest.setDate(yest.getDate()-1);
  if(Y===yest.getFullYear()&&M===yest.getMonth()+1&&D===yest.getDate()) return "昨天 "+hh+":"+mm;
  return M+"月"+D+"日 "+hh+":"+mm;
}

function escapeHtml(s){return (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function escapeAttr(s){return escapeHtml(s);}
// 渲染正文（纯文本归档）：图片不加载远程资源，仅以文字占位符呈现；其余文本按段落转义（防 XSS）
function linkify(escaped){
  if(!escaped) return escaped;
  var re=/(\[[^\]]+\]\((https?:\/\/[^)\s]+)\))|(https?:\/\/[^\s<>"'）】」』，。、；：！？]+)/g;
  return escaped.replace(re, function(m, g1, g2, g3){
    if(g2!==undefined){
      var label=m.substring(m.indexOf('[')+1, m.indexOf(']'));
      return '<a class="r-link" href="'+g2+'" target="_blank" rel="noopener noreferrer">'+label+'</a>';
    }
    if(g3!==undefined){
      return '<a class="r-link" href="'+g3+'" target="_blank" rel="noopener noreferrer">'+g3+'</a>';
    }
    return m;
  });
}
var _IMG_RE=/!\[([^\]]*)\]\(([^)\s]+)\)/g;
function renderRich(text){
  return (text||"").split(/\n{1,}/).map(function(p){
    p=p.trim(); if(!p) return '';
    var out=''; var last=0; var m; _IMG_RE.lastIndex=0;
    while((m=_IMG_RE.exec(p))!==null){
      out+=linkify(escapeHtml(p.slice(last,m.index)));
      var cap=(m[1]||'').trim()||'图片';
      out+='<span class="r-img-cap">🖼 '+escapeHtml(cap)+'</span>';
      last=_IMG_RE.lastIndex;
    }
    out+=linkify(escapeHtml(p.slice(last)));
    return '<p>'+out+'</p>';
  }).join("");
}
function openReader(it){
  const r=document.getElementById("reader");
  const content=(it.content||"").trim();
  const body=document.getElementById("readerBody");
  if(content.length>0){
    body.innerHTML=renderRich(content);
  }else{
    const sum=(it.summary||"").trim();
    if(sum){
      // 来源站点多为付费墙 / 登录墙 / 反爬限制，无法镜像全文；展示已本地存档的中文摘要兜底
      body.innerHTML='<div class="r-fallback">⚠️ 该条新闻的<b>全文镜像暂不可用</b>（来源站点可能为付费墙 / 登录墙 / 反爬限制，或原文已失效）。下方为已<b>本地存档的中文摘要</b>，可正常查看；完整原文请点击右下角「查看原文 ↗」。</div>'+
        '<p class="r-summary">'+linkify(escapeHtml(sum))+'</p>';
    }else{
      body.innerHTML='<p class="r-empty">暂未获取到该条新闻的全文镜像与摘要。'+(it.url?'可点击右下角「查看原文 ↗」前往原始报道。':'')+'</p>';
    }
  }
  document.getElementById("readerTitle").textContent=it.title;
  document.getElementById("readerSource").textContent=it.source;
  const link=document.getElementById("readerLink");
  if(it.url){link.href=it.url;link.style.display="";}else{link.style.display="none";}
  r.hidden=false;document.body.style.overflow="hidden";
}
function closeReader(){const r=document.getElementById("reader");r.hidden=true;document.body.style.overflow="";}
document.getElementById("reader").addEventListener("click",function(e){if(e.target===this)closeReader();});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeReader();});
