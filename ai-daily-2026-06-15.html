<script>
const DATA = {"meta": {"reportDate": "2026-06-15", "reportDateHuman": "2026年6月15日", "weekday": "星期一", "total": 6, "source": "AI HOT", "sourceUrl": "https://aihot.virxact.com", "generatedAt": "2026年07月31日 16:27"}, "sections": [{"label": "行业动态", "color": "#d97706", "items": [{"seq": 1, "title": "Anthropic 暂停新模型访问，印度辩论 AI 未来", "source": "TechCrunch：AI（RSS）", "summary": "Anthropic 暂停了新模型的访问权限，印度科技领袖围绕这一事件展开辩论，探讨其是否是对该国 AI 雄心的警示。", "url": "https://techcrunch.com/2026/06/13/as-anthropic-suspends-access-to-new-models-india-debates-its-ai-future", "permalink": "https://aihot.virxact.com/items/cmqdcj53706qpslttlp0b4n9p", "publishedAt": "2026-06-15T00:00:00.000Z", "exact": false, "content": "Anthropic在美国政府指令下突然暂停其最新AI模型的访问权限，这一举动在全球科技行业引发了新的疑问。在印度，这一决定重新点燃了一场长期以来的争论：全球最大的AI市场之一，是否能够承受依赖他国构建和控制的技术。\n\n这一公告于上周五晚间发布，Anthropic表示已收到美国政府指令，要求其暂停向所有外国公民（包括其自身的外国籍员工）提供最近推出的Fable 5和Mythos 5模型的访问权限。此举发生前不久，该公司刚刚宣布与印度IT服务巨头塔塔咨询服务公司（Tata Consultancy Services）建立合作伙伴关系，以扩大AI在印度企业中的采用，这凸显了印度的AI雄心与美国开发和治理的技术之间的紧密联系。\n\n尽管更广泛的影响尚不明朗，但一些报道称，最初的安全担忧是由亚马逊CEO安迪·贾西（Andy Jassy）向政府报告的。《The Information》报道称，白宫不太可能将类似限制扩展到其他AI公司，并私下将责任归咎于Anthropic对所谓越狱漏洞的处理方式。Anthropic对政府的定性提出异议，并辩称不应采取这一行动。\n\n无论如何，这一事件在印度创始人、投资者和政策专家之间引发了辩论，讨论该国是否应加快构建本土AI能力的努力，深化对开源替代方案的投资，还是继续依赖少数几家美国前沿模型提供商。对一些人来说，这一事件是对技术依赖的警钟；对另一些人来说，它提醒人们，获取日益关键的AI系统可能受到印度无法控制的地缘政治决策的影响。\n\n印度已成为前沿AI公司最重要的市场之一。Anthropic和OpenAI都将这个南亚国家描述为其仅次于美国的第二大市场，反映出印度在全球AI竞赛中日益增长的重要性。这两家公司近几个月已在印度设立办公室，扩大本地招聘、合作伙伴关系和企业计划，押注印度庞大的开发者、初创企业和商业基础，以加速其最新技术的采用。\n\n对印度科技行业的许多人来说，Anthropic周五的公告不仅仅关乎一家AI公司。它重新打开了关于该国长期AI战略的问题，以及印度是否能够承受继续依赖少数几家外国前沿AI提供商的局面。\n\n“这彻底改变了局面，”印度AI创投平台Activate创始人Aakrit Vaish在谈到Anthropic的决定时表示。“我认为这实质性地改变了我们所有人对印度主权AI的思考方式。”\n\nVaish告诉TechCrunch，他周六早上醒来时对这一公告感到“震惊和困惑”，并表示这加强了发展本土AI能力的理由。他预计初创企业将越来越多地转向开源模型，并计划鼓励其投资组合中的公司减少对少数几家前沿AI提供商的依赖。\n\n对一些创始人来说，更大的担忧是前沿AI访问受限可能对竞争力意味着什么。Atomicwork联合创始人兼CEO Vijay Rayapati告诉TechCrunch，这一事件凸显了团队分布多个国家的初创企业所面临的风险——如果先进AI系统的访问日益受到地缘政治限制的话。\n\nAtomicwork在美国约有25名员工，但其大部分产品工程团队位于印度班加罗尔。\n\n“如果你的AI团队不完全是美国公民，你就处于竞争劣势，”Rayapati表示，他认为前沿AI模型的不平等访问可能让一些公司比竞争对手获得显著优势。\n\n这一担忧出现之际，印度科技行业的部分领域已经在应对AI可能如何重塑全球人才经济格局的问题。本周，美国房地产科技公司Opendoor在进入印度不到两年后关闭了其印度办公室，CEO Kaz Nejatian将此归因于将运营工作更贴近美国客户，以及向更小规模AI原生团队的转变。\n\n虽然Opendoor没有具体说明这一决定在多大程度上受到AI相关效率提升的驱动，但此举加剧了一场更广泛的辩论：AI的进步将如何影响全球科技工作的未来，以及这对印度作为工程人才中心的地位意味着什么。\n\n**超越Anthropic**\n\n除了初创企业和AI开发者，Anthropic事件也引发了印度科技领袖之间关于对外国AI基础设施依赖的更广泛讨论。\n\n印度SaaS公司Zoho创始人Sridhar Vembu表示，此举表明“技术是终极武器”，并敦促印度组织越来越多地采用更小型的开源模型。\n\n“我们的政府现在能做什么？确保印度的组织拥抱更小的模型，包括印度和中国的开源模型，”Vembu在X上写道。\n\n投资者、Infosys前高管Mohandas Pai在X上回应了Vembu，认为这一事件凸显了制定更具雄心的国家AI战略的必要性，并呼吁政府大幅增加对AI、计算基础设施和深度技术的投资。\n\n“我们远远落后了，需要一个国家使命来快速推进，”Pai写道，他敦促政府设立每年5000亿卢比（约50亿美元）的AI和深科技基金，同时配套2万亿卢比（约210亿美元）的信贷担保计划，以支持云基础设施、硬件和半导体开发。\n\nPai的提议将使印度现有的AI投入相形见绌。2024年，新德里批准了印度AI使命（IndiaAI Mission），五年总投入1037.2亿卢比（约12亿美元），旨在扩展计算基础设施、支持初创企业并发展本土AI能力。\n\n尽管对AI的兴趣日益增长，新德里也在推动发展本土能力，但印度在前沿模型开发方面仍然是一个相对较小的参与者。只有少数初创企业在推进基础AI模型，其中包括Sarvam，该公司今年早些时候发布了开源模型。然而，另一家备受关注的AI初创企业Krutrim在最初以基础模型开发为定位后，已转向云和AI基础设施服务。\n\n印度AI生态系统的很大一部分反而集中在基于现有基础模型构建的应用和专用模型上。近期的例子包括Avataar AI，该公司本周早些时候推出了一款视频生成模型，旨在为Google的Veo、Kling、Luma和Runway等竞争对手的产品提供更低成本的替代方案。\n\n并非所有人都认为主要挑战是缺乏资金。针对Pai的评论，Lightspeed合伙人Hemant Mohapatra辩称，打造具有全球竞争力的AI公司，最大的制约因素是人才、计算资源的获取以及执行力，而不仅仅是投资承诺的规模。\n\nMohapatra估计，训练一个前沿AI模型的成本可能在数亿美元到数十亿美元之间，具体取决于所采用的方法，但他表示，成功的AI公司历来都是随着采用率的增长而逐步扩大其资本需求的。\n\n然而，对于一些政策观察人士来说，其影响远不止于AI初创公司或模型提供商。\n\n驻新德里的科技政策专家Prasanto Roy为跨国公司提供咨询，他表示，这一事件可能会加深印度政府对战略自主性的担忧，并将其与许多国家从俄罗斯在入侵乌克兰后失去SWIFT及全球金融体系其他部分接入权限中汲取的教训相类比。\n\n他告诉TechCrunch，此举很可能在印度引发强烈的民族主义反弹，并称这是华盛顿方面考虑不周的决定，其后果远不止Anthropic本身。\n\n“即使这一决定得到纠正或撤销，Anthropic事件也表明，不存在地缘政治上中立的国外大语言模型，”Roy表示。“美国的AI模型注定与美国的地缘政治绑定在一起。”", "zh": true}, {"seq": 2, "title": "Meta 开始撤销 20 亿美元收购 Manus 的交易", "source": "TechCrunch：AI（RSS）", "summary": "据 TechCrunch 报道，Meta 已开始撤销对 Manus 的 20 亿美元收购交易，此前北京要求该交易必须反转。目前收购解除程序已启动。", "url": "https://techcrunch.com/2026/06/13/meta-reportedly-moves-to-unwind-2b-manus-deal-after-beijings-demand", "permalink": "https://aihot.virxact.com/items/cmqd1t7a003wgslttff function toBeijingHuman(iso, ref, exact){
  const d=new Date(iso); const bj=new Date(d.getTime()+8*3600*1000);
  const Y=bj.getUTCFullYear(),M=bj.getUTCMonth()+1,D=bj.getUTCDate();
  const h=bj.getUTCHours(),m=bj.getUTCMinutes(); const hh=pad(h),mm=pad(m);
  if(!exact) return M+"月"+D+"日";
  const [rY,rM,rD]=ref.split("-").map(Number);
  if(Y===rY&&M===rM&&D===rD) return "今天 "+hh+":"+mm;
  const yest=new Date(rY,rM-1,rD); yest.setDate(yest.getDate()-1);
  if(Y===yest.getFullYear()&&M===yest.getMonth()+1&&D===yest.getDate()) return "昨天 "+hh+":"+mm;
  return M+"月"+D+"日 "+hh+":"+mm;
}

      '<h3>'+escapeHtml(it.title)+'</h3><span class="chip">'+escapeHtml(it.source)+'</span>'+
      '<p class="summary">'+escapeHtml(it.summary)+'</p>'+
      '<a class="readmore" href="'+escapeAttr(url)+'" target="_blank" rel="noopener noreferrer" title="外部原文链接，可能需要访问境外站点">来源 ↗</a>';
    card.addEventListener("click", function(){ openReader(it); });
    const rm = card.querySelector(".readmore");
    rm.addEventListener("click", function(e){ e.stopPropagation(); });
    grid.appendChild(card);
  });
  sec.appendChild(grid);mainEl.appendChild(sec);
});
function escapeHtml(s){return (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function escapeAttr(s){return escapeHtml(s);}
// 渲染正文（纯文本归档）：图片不加载远程资源，仅以文字占位符呈现；其余文本按段落转义（防 XSS）
function linkify(escaped){
  if(!escaped) return escaped;
  var re=/(\[[^\]]+\]\((https?:\/\/[^)\s]+)\))|(https?:\/\/[^\s<>"'）】」』，。、；：！？]+)/g;
  return escaped.replace(re, function(m, g1, g2, g3){
    if(g2!==undefined){
      var label=m.substring(m.indexOf('[')+1, m.indexOf(']'));
      return '<a class="r-link" href="'+g2+'" target="_blank" rel="noopener noreferrer">'+label+'</a>';
    }
    if(g3!==undefined){
      return '<a class="r-link" href="'+g3+'" target="_blank" rel="noopener noreferrer">'+g3+'</a>';
    }
    return m;
  });
}
var _IMG_RE=/!\[([^\]]*)\]\(([^)\s]+)\)/g;
function renderRich(text){
  return (text||"").split(/\n{1,}/).map(function(p){
    p=p.trim(); if(!p) return '';
    var out=''; var last=0; var m; _IMG_RE.lastIndex=0;
    while((m=_IMG_RE.exec(p))!==null){
      out+=linkify(escapeHtml(p.slice(last,m.index)));
      var cap=(m[1]||'').trim()||'图片';
      out+='<span class="r-img-cap">🖼 '+escapeHtml(cap)+'</span>';
      last=_IMG_RE.lastIndex;
    }
    out+=linkify(escapeHtml(p.slice(last)));
    return '<p>'+out+'</p>';
  }).join("");
}
function openReader(it){
  const r=document.getElementById("reader");
  const content=(it.content||"").trim();
  const body=document.getElementById("readerBody");
  if(content.length>0){
    body.innerHTML=renderRich(content);
  }else{
    const sum=(it.summary||"").trim();
    if(sum){
      // 来源站点多为付费墙 / 登录墙 / 反爬限制，无法镜像全文；展示已本地存档的中文摘要兜底
      body.innerHTML='<div class="r-fallback">⚠️ 该条新闻的<b>全文镜像暂不可用</b>（来源站点可能为付费墙 / 登录墙 / 反爬限制，或原文已失效）。下方为已<b>本地存档的中文摘要</b>，可正常查看；完整原文请点击右下角「查看原文 ↗」。</div>'+
        '<p class="r-summary">'+linkify(escapeHtml(sum))+'</p>';
    }else{
      body.innerHTML='<p class="r-empty">暂未获取到该条新闻的全文镜像与摘要。'+(it.url?'可点击右下角「查看原文 ↗」前往原始报道。':'')+'</p>';
    }
  }
  document.getElementById("readerTitle").textContent=it.title;
  document.getElementById("readerSource").textContent=it.source;
  const link=document.getElementById("readerLink");
  if(it.url){link.href=it.url;link.style.display="";}else{link.style.display="none";}
  r.hidden=false;document.body.style.overflow="hidden";
}
function closeReader(){const r=document.getElementById("reader");r.hidden=true;document.body.style.overflow="";}
document.getElementById("reader").addEventListener("click",function(e){if(e.target===this)closeReader();});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeReader();});
</script>
