const DATA = {"meta": {"reportDate": "2026-08-03", "reportDateHuman": "2026年8月3日", "weekday": "星期一", "total": 5, "source": "AI HOT", "sourceUrl": "https://aihot.virxact.com", "generatedAt": "2026年08月03日 08:08"}, "sections": [{"label": "产品发布/更新", "color": "#059669", "items": [{"seq": 1, "title": "Grok 支持分析任意视频", "source": "X：Elon Musk (@elonmusk, xAI)", "summary": "Grok 可以分析任何视频 https://grok.com/share/bGVnYWN5_8013f7a3-f604-4351-8cd7-acecf3ef165b", "url": "https://x.com/elonmusk/status/2083800942927839307", "permalink": "https://aihot.virxact.com/items/cmsbf9by90dq7rohvp1oggqmk", "publishedAt": "2026-08-02T06:23:54.000Z", "exact": true, "content": "Elon Musk on X: \"Grok can analyze any video https://t.co/rpWSsv5C6t\"", "zh": true}]}, {"label": "行业动态", "color": "#d97706", "items": [{"seq": 2, "title": "Cloudflare 开启 Agents Week：探讨面向智能体的 Agent Cloud 形态", "source": "Cloudflare Blog", "summary": "Cloudflare 启动为期五天的 Agents Week，核心议题是“Agent Cloud”应具备何种形态。其认为现有云和网络皆为人设计，而智能体有速度、结构与访问上的独特需求，因此 Agent Cloud 需同时构建面向智能体原生的底层能力，并充当现有网络与智能体网络之间的转换层。本周将围绕执行层、智能体开发生命周期、安全控制及智能体网络等主题展开。", "url": "https://blog.cloudflare.com/agents-week-welcome", "permalink": "https://aihot.virxact.com/items/cmsc1kf110wjirohvp8a4eouo", "publishedAt": "2026-08-02T16:00:00.000Z", "exact": true, "content": "", "zh": true}]}, {"label": "技巧与观点", "color": "#0284c7", "items": [{"seq": 3, "title": "Codex 用 Sol 指挥 Luna Max 省额度翻倍产出", "source": "X：阿易 AI Notes (@AYi_AInotes)", "summary": "Codex 高阶玩法：让 Sol 在 `~/.codex/agents/` 下创建 `luna-worker.toml` 子代理，模型设 `gpt-5.6-luna`、reasoning effort 设 max，Sol 负责拆任务与审代码，具体实现自动委托给 Luna Max。", "url": "https://x.com/AYi_AInotes/status/2083867265179537565", "permalink": "https://aihot.virxact.com/items/cmsbowa0l0m77rohvw8s15ia1", "publishedAt": "2026-08-02T10:47:27.000Z", "exact": true, "content": "AYi on X: \"刚发的Codex Luna Max省钱tip，现在有进阶版了——而且是让Sol自己帮你配好，现在Codex圈中高阶玩家都在用。思路很简单：别让Sol什么都自己干，Sol很贵，额度烧得快，但它规划和审核确实强。Luna Max便宜，写代码改文件跑测试这些有明确边界的体力活，它干得跟Sol差不了太多。\n\n所以最佳模式是：Sol当包工头，Luna Max当工人。具体怎么搞，让Sol自己帮你弄，你就跟它说： 在~/.codex/agents/下创建一个luna-worker.toml，模型设gpt-5.6-luna，reasoning effort设max，写好描述和指令，专门用来处理有明确边界的委托任务。创建完验证配置，给我看diff。Sol会自己把这个子代理配好 之后你干活的时候，Sol负责拆任务、做架构决策、审代码，具体的实现、改bug、跑测试、重构，它会自动delegate给luna_worker去跑。\n\n主线程的Sol额度省下来只花在刀刃上，体力活全让便宜的Luna Max扛，同一个订阅，产出量直接翻倍。还有个更懒的办法：不建配置文件，直接告诉Sol，遇到需要批量执行的子任务，自己spawn独立的Luna Max对话线程去跑，跑完把结果汇总回来。效果差不多，就是没那么结构化。去看DeepSWE那个榜就懂了，gpt-5.6-luna max的分数跟Sol Medium咬得很近，但成本差了一个数量级。Sol指挥+Luna Max干活，等于用一个Sol的钱，同时跑好几个工人。\n\n别再拿Sol当苦力使了，让它当老板才是正确的打开方式 :#Codex #OpenAI #AI编程\"", "zh": true}, {"seq": 4, "title": "OpenAI 新模型 Astra 数学表现出色，但被过度吹捧", "source": "Gary Marcus：The Road to AI We Can Trust（RSS）", "summary": "OpenAI 内部测试的新模型 Astra 在数学问题上表现惊艳，但 Gary Marcus 指出相关讨论犯了“合成谬误”：擅长某类数学不等于擅长所有数学、科学乃至一切认知任务。数学之所以成为突破口，是因为它便于用符号工具验证且能廉价生成海量合成数据，而开放世界问题无法如此模拟。此外，OpenAI 未公布方法细节，尚无法评估其真实意义。", "url": "https://garymarcus.substack.com/p/openais-amazing-but-vastly-oversold", "permalink": "https://aihot.virxact.com/items/cmscc62eo033broeusw72isi0", "publishedAt": "2026-08-02T21:25:27.000Z", "exact": true, "content": "另一条推文甚至声称“这个物种刚刚跨过了一道单向门槛”；埃隆·马斯克则将其视为我们已抵达奇点的证据。\n\n他们每个人犯的本质上都是同一个错误。\n\n这个谬误有名字，叫作“合成谬误”。\n\n维基百科上关于它的词条里满是绝佳的例子；这里只列开头几个。\n\n这个谬误在当前案例中的表现是什么？就是认为一个擅长某类数学问题的系统，就擅长所有数学、擅长科学，甚至很可能擅长一切。“AGI 临近”群体一次又一次地犯着同一个逻辑谬误。每次有进展出现，我都会看到同样的错误。\n\n这个谬误是这样运作的。\n\n1. 有人假装所有认知都是同等的。（完全不符合事实。）\n\n2. 每当 AI 在某种（花哨的）认知形式上取得成功，他们就希望你相信，AI 在一切形式上的成功都近在眼前。\n\n你不需要是认知心理学家也能看出这个推论根本不成立。比如我们都知道，数学方面的专长并不能保证在所有领域都成为天才。一个擅长数学、物理或编程的人，可能在写作或理解人际关系上很吃力（反过来，一个伟大的作家也可能不擅长数学，等等）。某一领域的专长完全不能保证在所有甚至大多数领域都具备专长。\n\n这正是霍华德·加德纳和罗伯特·斯腾伯格等人提出多元智能理论的原因，也是 SAT 将数学和语文分开考试的原因，等等。\n\nAstra 看起来——我们还没有看到其方法论——在数学方面表现出色，或者至少在某些形式的数学上如此，但这并不意味着它能避免模型幻觉，或解决其他生成式 AI 系统存在的可靠性问题。这甚至不意味着它能可靠地阅读 PDF。也不意味着它将成为第一个能够遵守硬性规则的生成式 AI。（这应该让你感到恐惧。）\n\n特别是，Astra 显然擅长某些问题；但这并不意味着它在难以形式化的问题上会表现出色，甚至不一定能胜任。这并不意味着它会神奇。这并不意味着它是 AGI 或 ASI 或任何类似的东西。\n\n它*非常*令人印象深刻。但我看不出任何理由认为 Astra 是 AGI，更不用说 ASI 了。如果它能在我和 Miles Brundage 的 2024 年赌注中拿到 5/10 的分数，我会感到惊讶。\n\n第二部分。有一个重要的、原则性的理由认为，数学上的成功是一个特例，不会像人们可能希望的那样广泛推广。\n\n如果（a）这种谬误不是极其普遍，并且（b）我不认为有非常充分的理由认为这种谬误适用于此，我就不会花这么长的篇幅来讨论它。\n\n数学成为这些模型大放异彩的领域并非偶然。数学适合两件事：验证（使用符号工具），以及大规模廉价生成的合成数据，在这些数据中你可以保证答案是正确的。编码也是如此——但一般来说并非如此。你可以生成任意多的数学事实；你无法模拟开放式的世界。你可以验证数学；你无法以同样的方式验证军事战略。\n\n这并非新闻。我至少从 2025 年 1 月起就一直在指出这一点【第一行本应说编码和数学】，呼应了 Ernie Davis 和我在 2019 年关于围棋（以及为什么 AlphaGo 不会是万能灵药）所说的：\n\nOpenAI 能做到 Astra 在数学方面所做的事情，是因为数学允许使用外部工具进行验证并创建合成数据。\n\n这并不会让 Astra 显得不那么令人印象深刻，但正如十年前我们从 IBM 那次混乱且最终失败的尝试中学到的——它试图把赢得《危险边缘》的 Watson 改造成一台攻克癌症的机器——在一个领域取得成功并不能保证在所有领域都能成功。\n\nOpenAI 在这里所处理的数学，与许多（也许是大多数）现实世界问题有着根本性的不同；在那些问题中，验证既不能保证解决方案，也无法让人几乎零成本地无限生成训练数据。\n\n指望它成为万能溶剂，只能说明你并不理解这个基本事实。\n\n第三部分：关于 Astra 还需要了解的七件事\n\n-\n\n昨天的推文和博客是营销，不是科学。这两者，连同随附的 249 页数学论文，都没有提供任何关于这一成就是如何实现的信息：\n\n在一封评论本文初稿的电子邮件中，Ernie Davis 非常中肯地补充道：\n\n要恰当地评估这些发现的意义，我们需要一些关键信息。第一：他们尝试了多少个猜想？如果 OpenAI 团队是从所有未解决的重要数学猜想空间中随机挑选出这 10 个猜想，而 Astra 全部解决了，那将令人惊叹；但这似乎完全不可能。如果他们挑选了 50 个他们认为 Astra 能成功的猜想，而它成功了 10 个，那仍然令人惊叹，但程度要低得多。如果他们在所有大约 1000 个未解决的 Erdős 猜想以及另外 10,000 个未解决猜想上运行了 Astra，那么它未能解决这些问题的结果，就是关于其作为数学推理者能力极限的重要信息。第二：OpenAI 大肆吹嘘说，完成这项工作总共只花了 2000 美元的计算成本。可以肯定的是，这很可能只包括 Astra 成功的那些猜想，而不包括它失败的。但是，考虑到参与这个项目的高薪数学家和计算机科学家的工资，成本又是多少呢？如果低于 20,000 美元，我会感到震惊；如果超过 200,000 美元，我也不会感到意外。\n\n我们对此并不了解，而且照目前的发展态势来看，我们可能永远也无法了解。对于在2025年国际数学奥林匹克竞赛中夺得金牌的OpenAI系统，我们依然一无所知；而对Google的那个系统，我们掌握的信息也少得可怜。\n\n-\n\nAstra 在某些数学问题上表现出色，但要说数学已被“攻克”（X 平台上很多人似乎这么认为），这实在令人怀疑。它似乎只是擅长特定类型的数学问题。\n\n但很可能并非所有数学问题它都擅长。以下是 Eric Weinstein 在 X 平台上列举的一些它可能不太擅长的数学类型示例。\n\nErnie Davis 还补充道：“自动形式化的问题——即将人类数学家撰写的数学内容转化为严格逻辑形式——似乎远未得到解决，尽管确实已取得进展。例如：过去两年里，数学家 Kevin Buzzard 一直在领导一个项目，用 Lean 语言将 Andrew Wiles 对费马大定理的证明形式化。可以肯定地说，没有任何 AI 系统有能力完成这项艰巨的任务。可以想见，如果它们能在无人协助的情况下做到这一点，它们早就抢先一步了；如果它们能将他数年的工作缩短为数周，他早就用上它们了。”\n\n-\n\n与我关于数学能力并不能保证通用性的总体预测一致，Astra 的证明写作水平似乎与其证明本身并不相称（这呼应了 Ernie Davis 和我一年前在此处的观察）” [点击查看完整推文]\n\n-\n\n我严重怀疑 Astra 能神奇地解决当前模型中所有无法可靠运行的问题。它能可靠地从任意 PDF 中提取数字吗？我表示怀疑。它能满足 Sabine Hossenfelder 希望 AI 为她的 YouTube 系列节目撰写脚本的愿望吗？[点击推文查看详情] 我也表示怀疑。\n\n-\n\nAstra 并非（如 Musk 所暗示的）奇点。无需多言。（不过可以看看我最近关于这个话题的文章；情况其实没什么变化。）\n\n-\n\n声称 Astra 的首次亮相“很可能是数学史上最重要的一天”是荒谬的，而一大群人却基于 Fable 某一次运行中的一句话（如果问两次，可能会给出不同答案）到处这么说。这里没有新理论，没有新技术，而且尽管它令人印象深刻，但它与微积分、代数、对数、概率、十进制系统、信息论、零的概念的发展完全不在一个量级上。Davis 表示：“Fable 引文中声称‘其中几项单独拿出来都足以成为这十年来的重大成果’是荒谬的……作为现实检验，自 1900 年以来，David Hilbert 的 23 个问题中已有 14 个得到解决——也就是平均每九年解决一个——而这些结果远未达到那个水平。你很容易就能列出一份自 1926 年以来被证明的 100 项重要得多的成果清单。”\n\n-\n\n我怀疑它不会直接带来癌症的治愈，也不会像一些兴奋的 AI“网红”所设想的那样，在“材料研究、能源生产、药物发现、一切领域”带来巨大进步。这也不意味着我们刚刚进入了“自动化科学发现的时代”。针对这些过度的说法……\n\n……这篇刚刚发布，呼应了几天前我链接到的由等人撰写的新文章。\n\n第四部分：总结\n\n尽管昨天在 X 上遭到了巨大的反对（其中大部分是人身攻击，有些甚至涉及捏造，还有很多是彻头彻尾的谎言），我对 Astra 的总体看法仍然是我最初发布的那条：\n\n可悲的是，Ernie Davis 和我在一年前就提出了很多关于如何正确检验新系统的相同观点：\n\n当前案例中谬误的表现形式是什么？认为一个擅长某种数学问题的系统，就擅长所有数学问题、擅长科学，甚至可能擅长一切。所谓“AGI近在咫尺”的群体反复犯着同样的逻辑谬误。每次有进展，我都会看到同样的错误。\n\n这个谬误是这样运作的：\n\n1. 有人假装所有认知都是平等的。（这完全不成立。）\n2. 每当AI在某种（花哨的）认知形式上取得成功，他们就希望你相信所有形式的AI成功都指日可待。\n\n你不需要成为认知心理学家就能意识到这种推断根本不成立。例如，我们都知道，数学方面的专长并不能保证在所有领域都成为天才。一个擅长数学、物理或编程的人，可能在写作或理解人际关系方面遇到困难（反之，一个伟大的作家可能在数学方面很弱，等等）。一个领域的专长完全不保证在所有甚至大多数领域的专长。\n\n这正是霍华德·加德纳和罗伯特·斯滕伯格等人提出多元智能理论的原因，也是SAT将数学和语文分开考试的原因。\n\nAstra似乎——我们还没有看到方法论——擅长数学，或者至少擅长某些形式的数学，但这并不意味着它能避免幻觉，或解决其他生成式AI系统存在的可靠性问题。这甚至不意味着它能可靠地读取PDF。也不意味着它将成为第一个能够遵守硬性规则的生成式AI。（这应该让你感到恐惧。）\n\n特别是，Astra显然在某些问题上表现出色；但这并不意味着它在难以形式化的问题上也会表现出色，甚至称职。这并不意味着它会有魔法。这并不意味着它是AGI或ASI或任何这类东西。\n\n它*非常*令人印象深刻。但我看不出任何理由认为Astra是AGI，更不用说ASI了。如果它能在……上得5/10分——\n\nOpenAI能做到Astra在数学方面做到的事情，因为数学允许使用外部工具进行验证并生成合成数据。\n\n这并不会让Astra不那么令人印象深刻，但正如我们十年前从IBM那次混乱且最终失败的尝试中学到的——将赢得《危险边缘》的Watson变成一台癌症治疗机器——一个领域的成功并不能保证所有领域的成功。\n\nOpenAI在这里处理的数学问题，与许多（也许是大多数）现实世界问题有着根本性的不同。在那些问题中，验证既不能保证解决方案，也不能让你几乎免费地生成无限训练数据。\n\n期望它成为万能溶剂，说明你不理解这个基本事实。\n\n第三部分：关于Astra还需要了解的七件事\n\n昨天的推文和博客是营销，不是科学。这两者以及随附的249页数学论文都没有提供任何关于这是如何实现的信息：\n\n在评论本文初稿的一封电子邮件中，厄尼·戴维斯相当正确地补充道：\n\n要恰当地评估这些发现的意义，我们需要一些关键信息。\n\n首先：有多少猜想被尝试过？如果OpenAI团队从所有重要的未解数学猜想中随机挑选了这10个猜想，而Astra全部解决了，那确实令人惊叹；但这似乎完全不可能。如果他们精心挑选了50个他们认为Astra能成功的猜想，而它解决了其中10个，那依然令人惊叹，但程度要低得多。如果他们让Astra尝试了所有大约1000个未解的Erdos猜想以及另外10000个其他未解猜想，那么它未能解决这些猜想，就是关于其作为数学推理者能力极限的重要信息。\n\n其次：OpenAI大肆吹嘘说，这次总共的计算成本仅为2000美元。可以肯定的是，这很可能只包括Astra成功的猜想，而不包括它失败的。但那些参与这个项目的高薪数学家和计算机科学家的工资成本又是多少呢？如果低于20000美元，我会感到惊讶；如果超过200000美元，我也不会觉得意外。\n\n我们不知道这些，而且按照目前的趋势，我们可能永远不会知道。对于在2025年国际数学奥林匹克竞赛中获得金牌表现的OpenAI系统，我们仍然一无所知，而对Google系统的了解也少之又少。\n\n-\n\nAstra擅长某些数学，但数学是否已被“解决”非常值得怀疑（ 但很可能并非全部。以下是一些例子，来自 Ernie Davis还补充道：“自动形式化的问题——将人类数学家撰写的数学转化为严格逻辑形式——似乎远未接近解决，尽管确实取得了进展。例如：在过去两年里，数学家Kevin Buzzard一直在领导一个 令人遗憾的是，Ernie Davis和我在一年前就提出了许多相同的观点，关于如何恰当地检验新系统： \u003ca href=", "zh": true}, {"seq": 5, "title": "最新开源模型盘点（#23）：Laguna S2.1、Inkling 与 Kimi K3 展现开源模型在帕累托前沿的价值", "source": "Nathan Lambert：Interconnects（RSS）", "summary": "Thinking Machines 发布首个模型 Inkling，为 975B-A41B 多模态 MoE，支持文本、图像和音频输入，并推出 276B-A12B 小版本。", "url": "https://www.interconnects.ai/p/latest-open-artifacts-23-laguna-s21", "permalink": "https://aihot.virxact.com/items/cmsbv6cfx0rjnrohv6yep8b2x", "publishedAt": "2026-08-02T13:01:40.000Z", "exact": true, "content": "", "zh": true}]}]};
function pad(n){return n<10?"0"+n:""+n;}
function toBeijingHuman(iso, ref, exact){
  const d=new Date(iso); const bj=new Date(d.getTime()+8*3600*1000);
  const Y=bj.getUTCFullYear(),M=bj.getUTCMonth()+1,D=bj.getUTCDate();
  const h=bj.getUTCHours(),m=bj.getUTCMinutes(); const hh=pad(h),mm=pad(m);
  if(!exact) return M+"月"+D+"日";
  const [rY,rM,rD]=ref.split("-").map(Number);
  if(Y===rY&&M===rM&&D===rD) return "今天 "+hh+":"+mm;
  const yest=new Date(rY,rM-1,rD); yest.setDate(yest.getDate()-1);
  if(Y===yest.getFullYear()&&M===yest.getMonth()+1&&D===yest.getDate()) return "昨天 "+hh+":"+mm;
  return M+"月"+D+"日 "+hh+":"+mm;
}

function escapeHtml(s){return (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function escapeAttr(s){return escapeHtml(s);}
// 渲染正文（纯文本归档）：图片不加载远程资源，仅以文字占位符呈现；其余文本按段落转义（防 XSS）
function linkify(escaped){
  if(!escaped) return escaped;
  var re=/(\[[^\]]+\]\((https?:\/\/[^)\s]+)\))|(https?:\/\/[^\s<>"'）】」』，。、；：！？]+)/g;
  return escaped.replace(re, function(m, g1, g2, g3){
    if(g2!==undefined){
      var label=m.substring(m.indexOf('[')+1, m.indexOf(']'));
      return '<a class="r-link" href="'+g2+'" target="_blank" rel="noopener noreferrer">'+label+'</a>';
    }
    if(g3!==undefined){
      return '<a class="r-link" href="'+g3+'" target="_blank" rel="noopener noreferrer">'+g3+'</a>';
    }
    return m;
  });
}
var _IMG_RE=/!\[([^\]]*)\]\(([^)\s]+)\)/g;
function renderRich(text){
  return (text||"").split(/\n{1,}/).map(function(p){
    p=p.trim(); if(!p) return '';
    var out=''; var last=0; var m; _IMG_RE.lastIndex=0;
    while((m=_IMG_RE.exec(p))!==null){
      out+=linkify(escapeHtml(p.slice(last,m.index)));
      var cap=(m[1]||'').trim()||'图片';
      out+='<span class="r-img-cap">🖼 '+escapeHtml(cap)+'</span>';
      last=_IMG_RE.lastIndex;
    }
    out+=linkify(escapeHtml(p.slice(last)));
    return '<p>'+out+'</p>';
  }).join("");
}
function openReader(it){
  const r=document.getElementById("reader");
  const content=(it.content||"").trim();
  const body=document.getElementById("readerBody");
  if(content.length>0){
    body.innerHTML=renderRich(content);
  }else{
    const sum=(it.summary||"").trim();
    if(sum){
      // 来源站点多为付费墙 / 登录墙 / 反爬限制，无法镜像全文；展示已本地存档的中文摘要兜底
      body.innerHTML='<div class="r-fallback">⚠️ 该条新闻的<b>全文镜像暂不可用</b>（来源站点可能为付费墙 / 登录墙 / 反爬限制，或原文已失效）。下方为已<b>本地存档的中文摘要</b>，可正常查看；完整原文请点击右下角「查看原文 ↗」。</div>'+
        '<p class="r-summary">'+linkify(escapeHtml(sum))+'</p>';
    }else{
      body.innerHTML='<p class="r-empty">暂未获取到该条新闻的全文镜像与摘要。'+(it.url?'可点击右下角「查看原文 ↗」前往原始报道。':'')+'</p>';
    }
  }
  document.getElementById("readerTitle").textContent=it.title;
  document.getElementById("readerSource").textContent=it.source;
  const link=document.getElementById("readerLink");
  if(it.url){link.href=it.url;link.style.display="";}else{link.style.display="none";}
  r.hidden=false;document.body.style.overflow="hidden";
}
function closeReader(){const r=document.getElementById("reader");r.hidden=true;document.body.style.overflow="";}
document.getElementById("reader").addEventListener("click",function(e){if(e.target===this)closeReader();});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeReader();});
