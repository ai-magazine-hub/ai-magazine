ha included Qwen-Image-2.1 is now supported in ComfyUI! Open weights. One 7B checkpoint that generates and edits. → Image generation at native 2K → Instruction editing from up to 10 reference images in a single pass → RGBA output, alpha included"}, {"seq": 3, "title": "Qwen 开源 Qwen-Image-2.1：7B 统一生成与编辑并原生支持透明图像", "source": "Qwen：Blog Retrieval（API）", "summary": "Qwen 团队开源 Qwen-Image-2.1，将文生图与图像编辑统一到一个模型中，视觉生成组件仅 7B 参数，并原生支持生成和编辑透明图像。模型支持最多 10 张参考图、圆形/涂鸦/独立蒙版指定局部编辑，通过混合粒度注意力架构和 KV cache 复用提升推理效率，同时改进文字渲染、人像光照与人物产品保真度，并覆盖全景图、信息图和分镜等任务。", "url": "https://qwen.ai/blog?id=qwen-image-2.1", "permalink": "/items/cmu9tfhu904turokx2vfjy34f", "publishedAt": "2026-09-20T12:00:00.000Z", "exact": true, "zh": true, "fromFeed": true, "content": "}]]}]]}]]}] 31:T6cee, Qwen-Image-Bench 评测对比\n\n推理效率是另一个重点，尤其是在使用多张输入图像进行编辑时。这一优化来自 混合粒度注意力架构。文本（包括系统前缀和编辑指令）使用 token 级因果掩码，而图像生成使用块级掩码。KV cache 复用 使输入图像和编辑指令可作为静态上下文，在第一步中计算并缓存，从而提升推理效率并降低内存占用。\n\nQwen-Image-2.1 混合粒度注意力架构\n\n原生透明度，统一创作与编辑 除了单个主体之外，该模型还能生成由多个元素构成的更复杂的透明图像，为设计和素材创作开辟了更多可能性。\n\n通过统一生成与编辑，Qwen-Image-2.1 还支持直接编辑透明图像。例如，它可以在保留透明背景的同时改变主体的表情。左侧为输入，右侧为编辑结果。\n\n透明图层中的文字同样可以编辑。在下面的示例中，“BLOOM”被替换为“Qwen-Image”。\n\n这一能力也延伸到了真实照片。给定一张 RGB 图像，该模型可以将所需主体提取为带透明度的 RGBA 图层，从而更便于在后续的设计与合成工作中复用元素。\n\n一张由六张人像参考图生成的全家福照片\n\n在虚拟试穿场景中，五个输入——模特、服装、鞋子、包和帽子——可以组合成一套完整的穿搭。\n\n一套由五张参考图生成的完整穿搭\n\n在室内设计场景中，模型可以使用 10 张家具图片生成一个完整的房间布置。\n\n一个由十张家具参考图生成的室内场景\n\n局部编辑：灵活的区域选择 手绘标注提供了另一种标出区域的方式。在这个示例中，模型在输入图像右侧用白色标出的区域中添加了一名潜水员。\n\n圆圈和手绘标注会遮挡部分原始内容。为保留完整输入，Qwen-Image-2.1 还支持将原始图像和单独的掩码作为两个输入。以下示例要求模型使用这两张图像生成一个骑马牛仔：\n\n模型对掩码指定的区域进行编辑，生成以下结果：\n\n掩码引导编辑结果：一个骑马牛仔\n\n局部编辑还可以支持连续创作。通过在保留场景其余部分的同时进行连续修改，编辑后的图像可以组合成简单的动画，如下方的水豚葫芦兄弟示例所示。 视频 · 前往原文观看\n\n保真度：保留人物与产品 对于产品编辑，模型旨在保留文字、纹理和形状，使产品的标志性特征在新图像中保持一致。\n\n任务覆盖范围：全景图、信息图与故事板 用于全景图生成的输入自拍\n\n模型生成了以下全景图：\n\n由自拍生成的全景图\n\n随后可以在可视化工具中从不同视角方向探索这张全景图。 视频 · 前往原文观看 在信息图生成方面，一张模特照片可以被扩展为细节丰富、信息密集的构图。\n\n用于信息图生成的输入模特照片\n\n由模特照片生成的复杂信息图\n\n该模型还可以将三视图角色参考图转化为完整的分镜图，为故事叙述和视觉叙事提供素材。\n\n用于分镜图生成的三视图角色参考图\n\n由角色参考图生成的完整分镜图\n\n逼真的纹理与精致的美学 文本渲染示例一\n\n文本渲染示例二\n\n文本渲染示例三\n\n文本渲染示例四\n\n对于肖像，改进的光照和精细细节让生成的图像呈现出更逼真的外观。\n\n肖像光照与细节示例一\n\n肖像光照与细节示例二\n\n结论 Qwen-Image-Bench evaluation comparison\n\nInference efficiency is another focus, particularly when editing with multiple input images. This optimization comes from a mixed-granularity attention architecture. Text, including the system prefix and editing instructions, uses a token-level causal mask, while image generation uses a chunk-level mask. KV cache reuse allows input images and editing instructions to serve as static context, computed and cached in the first step to improve inference efficiency and reduce memory usage.\n\nQwen-Image-2.1 mixed-granularity attention architecture\n\nNative Transparency, Unified Creation and Editing Beyond individual subjects, the model can generate more complex transparent images composed of multiple elements, opening up further possibilities for design and asset creation.\n\nBy unifying generation and editing, Qwen-Image-2.1 also supports editing transparent images directly. For example, it can change a subject’s expression while retaining the transparent background. The input is on the left and the edited result on the right.\n\nText within a transparent layer can also be edited. In the following example, “BLOOM” is replaced with “Qwen-Image”.\n\nThis capability extends to real photographs. Given an RGB image, the model can extract the desired subject as an RGBA layer with transparency, making it easier to reuse elements in subsequent design and composition work.\n\nVersatile Editing A group photograph generated from six portrait references\n\nFor virtual try-on, five inputs—a model, clothing, shoes, a bag, and a hat—can be combined into a complete outfit.\n\nA complete outfit generated from five reference images\n\nFor interior design, the model can use 10 images of furnishings to generate a complete room arrangement.\n\nAn interior generated from ten furnishing references\n\nLocal Editing: Flexible Region Selection Painted annotations provide another way to identify a region. In this example, the model adds a diver to the area marked in white on the right side of the input image.\n\nCircles and painted annotations obscure some of the original content. To preserve the complete input, Qwen-Image-2.1 also accepts the original image and a separate mask as two inputs. The following example asks the model to generate a cowboy on horseback, using these two images:\n\nThe model edits the region specified by the mask, producing the following result:\n\nMask-guided editing result: a cowboy on horseback\n\nLocal editing can also support sequential creation. By making successive changes while preserving the rest of the scene, edited images can be assembled into simple animations, as illustrated by the capybara Calabash Brothers example below. 视频 · 前往原文观看\n\nFidelity: Preserving People and Products For product editing, the model aims to preserve text, textures, and shape, keeping the product’s defining features consistent in a new image.\n\nTask Coverage: Panoramas, Infographics, and Storyboards Input selfie for panorama generation\n\nThe model generates the following panorama:\n\nPanorama generated from the selfie\n\nThe panorama can then be explored from different viewing directions in a visualization tool. 视频 · 前往原文观看 For infographic generation, a model photograph can be expanded into a detailed, information-rich composition.\n\nInput model photograph for infographic generation\n\nComplex infographic generated from the model photograph\n\nThe model can also turn a three-view character reference into a complete storyboard, providing material for storytelling and visual narratives.\n\nThree-view character reference for storyboard generation\n\nComplete storyboard generated from the character reference\n\nRealistic Textures and Refined Aesthetics Text rendering example one\n\nText rendering example two\n\nText rendering example three\n\nText rendering example four\n\nFor portraits, improved lighting and fine details give generated images a more realistic appearance.\n\nPortrait lighting and detail example one\n\nPortrait lighting and detail example two\n\nConclusion\u003ca href="}]}, {"label": "产品发布/更新", "color": "#059669", "items": [{"seq": 1, "title": "纽约时报诉讼文件披露：微软高管称 AI 抓取是人类历史上最大规模的劳动力盗用", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "summary": "纽约时报在起诉 OpenAI 和微软的版权案中提交法律简报并申请即决判决，引用双方内部文件称 AI 抓取是“人类历史上最大规模的劳动力盗用”，OpenAI ChatGPT 负责人称其对出版商是“生存威胁”。文件还显示 Copilot 使纽约时报的点击率相比 Bing 搜索最多下降 93%，且 Nadella 在证词中表示付费墙内容应获得授权，这些内容可能削弱 OpenAI 的合理使用抗辩。", "url": "https://www.tomshardware.com/tech-industry/artificial-intelligence/microsoft-director-called-ai-scraping-the-largest-theft-of-labor-in-human-history-while-openai-head-brands-chatgpt-an-existential-threat-to-publishers-revelations-come-from-legal-briefs-filed-in-nyt-lawsuit", "permalink": "/items/cmu92ktj505lkrojrl223hicj", "publishedAt": "2026-09-19T23:58:19.151Z", "exact": true, "zh": true, "fromFeed": true, "content": "}]]}]]}]]}] 33:T12de, 《\n\n（图片来源：微软） 该简报引用了微软应用科学总监 Brent Hecht 于 2023 年 1 月撰写的一份内部备忘录，据称他在其中表示：“全世界数百万人很快会认为，大模型把他们所有的作品‘吸走’是一种规模空前的惊人窃取行为”，并称其为“人类历史上最大的劳动窃取”。另一份被引用的微软文件则称：“几乎没有人希望自己创作的内容以这种方式被使用，他们也没有因此获得补偿。”\n\n随着 ChatGPT 在 2023 年全年人气飙升，这家软件巨头自己的数据揭示，与 Bing 搜索相比，Copilot 让《纽约时报》的点击率下降了多达 93%。应用科学总监的另一份备忘录将其称为“末日循环”，并称这会“同时损害我们模型的性能以及整个网络”。\n\n纽约时报的案情摘要引用了 Hecht 在该文件中的话：“一个终端产品威胁到其关键供应商的经济根基，这是极不寻常的，但这正是我们为自家 LLM 业务相对于其‘内容供应链’所制造出的局面。”\n\nOpenAI 的 ChatGPT 负责人 Nick Turley 在内部沟通中表示，这款 AI 聊天机器人对出版商构成“生存性威胁”，因为它们“在很大程度上具有替代性”，并且“随着它们变得更好，会越来越具有替代性”；而另一名 OpenAI 工程师作证称，“无论我们把链接展示得多么醒目，用户都不会点击。”\n\n另一位 OpenAI 研究员 Nick Ryder 向公司总裁 Greg Brockman 提到了一种“绕过 nytimes 付费墙的取巧办法”，后者回复道：“啊，不错。”\n\nAI 公司主张，抓取互联网数据用于训练其模型属于“合理使用”，\n\n(Image credit: Microsoft) The brief cited an internal memo dated January 2023 by Microsoft director of Applied Science Brent Hecht, where he allegedly said, “Millions of people around the world will soon consider large models ‘hoovering up’ all their work to be an astonishing theft of unprecedented proportions” and also called it “the largest theft of labor in human history.” Another Microsoft document was cited saying, “almost no one intended for content they created to be used in this fashion, nor are they compensated for its use.”\n\nAs ChatGPT surged in popularity throughout 2023, the software giant’s own data revealed that Copilot dropped click-through rates for The New York Times by as much as 93% compared to Bing search. Another memo by the Applied Science director called it a “doom loop” and said it would “hurt the performance of our models and the entire web at the same time. ” The NYT brief quoted Hecht from the document, saying, “It is highly unusual that an end-product threatens the economic foundations of its essential suppliers, but that is the situation we have created for our LLM business with respect to its ‘content supply chain.’”\n\nOpenAI Head of ChatGPT Nick Turley said in internal communications that the AI chatbot is an “existential threat” to publishers as they are “largely substitutive” and “will get more and more substitutive as they get better,” while another OpenAI engineer testified that “no matter how prominently we show the links, users won’t click.” Nick Ryder, another OpenAI researcher, told company president Greg Brockman about a “hack to get around nytimes paywall,” to which he replied, “ah nice.”\n\nAI companies argue that scraping the internet for data to feed to their models is “fair use,” with \u003ca href="}]}]};

function toBeijingHuman(iso, ref, exact){
  const d=new Date(iso); const bj=new Date(d.getTime()+8*3600*1000);
  const Y=bj.getUTCFullYear(),M=bj.getUTCMonth()+1,D=bj.getUTCDate();
  const h=bj.getUTCHours(),m=bj.getUTCMinutes(); const hh=pad(h),mm=pad(m);
  if(!exact) return M+"月"+D+"日";
  const [rY,rM,rD]=ref.split("-").map(Number);
  if(Y===rY&&M===rM&&D===rD) return "今天 "+hh+":"+mm;
  const yest=new Date(rY,rM-1,rD); yest.setDate(yest.getDate()-1);
  if(Y===yest.getFullYear()&&M===yest.getMonth()+1&&D===yest.getDate()) return "昨天 "+hh+":"+mm;
  return M+"月"+D+"日 "+hh+":"+mm;
}

  s.items.forEach(it=>{
    const card=document.createElement("article");card.className="card";card.style.setProperty("--accent",s.color);
    const time=toBeijingHuman(it.publishedAt,ref,it.exact);const url=it.url||"#";
    card.innerHTML='<div class="top"><span class="seq">'+it.seq+'</span><span class="time">'+time+'</span></div>'+
      '<h3>'+escapeHtml(it.title)+'</h3><span class="chip">'+escapeHtml(it.source)+'</span>'+
      '<p class="summary">'+escapeHtml(it.summary)+'</p>'+
      '<a class="readmore" href="'+escapeAttr(url)+'" target="_blank" rel="noopener noreferrer" title="外部原文链接，可能需要访问境外站点">来源 ↗</a>';
    card.addEventListener("click", function(){ openReader(it); });
    const rm = card.querySelector(".readmore");
    rm.addEventListener("click", function(e){ e.stopPropagation(); });
    grid.appendChild(card);
  });
  sec.appendChild(grid);mainEl.appendChild(sec);
});
function escapeHtml(s){return (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function escapeAttr(s){return escapeHtml(s);}
// 渲染正文（纯文本归档）：图片不加载远程资源，仅以文字占位符呈现；其余文本按段落转义（防 XSS）
function linkify(escaped){
  if(!escaped) return escaped;
  var re=/(\[[^\]]+\]\((https?:\/\/[^)\s]+)\))|(https?:\/\/[^\s<>"'）】」』，。、；：！？]+)/g;
  return escaped.replace(re, function(m, g1, g2, g3){
    if(g2!==undefined){
      var label=m.substring(m.indexOf('[')+1, m.indexOf(']'));
      return '<a class="r-link" href="'+g2+'" target="_blank" rel="noopener noreferrer">'+label+'</a>';
    }
    if(g3!==undefined){
      return '<a class="r-link" href="'+g3+'" target="_blank" rel="noopener noreferrer">'+g3+'</a>';
    }
    return m;
  });
}
var _IMG_RE=/!\[([^\]]*)\]\(([^)\s]+)\)/g;
function renderRich(text){
  return (text||"").split(/\n{1,}/).map(function(p){
    p=p.trim(); if(!p) return '';
    var out=''; var last=0; var m; _IMG_RE.lastIndex=0;
    while((m=_IMG_RE.exec(p))!==null){
      out+=linkify(escapeHtml(p.slice(last,m.index)));
      var cap=(m[1]||'').trim()||'图片';
      out+='<span class="r-img-cap">🖼 '+escapeHtml(cap)+'</span>';
      last=_IMG_RE.lastIndex;
    }
    out+=linkify(escapeHtml(p.slice(last)));
    return '<p>'+out+'</p>';
  }).join("");
}
function openReader(it){
  const r=document.getElementById("reader");
  const content=(it.content||"").trim();
  const body=document.getElementById("readerBody");
  if(content.length>0){
    body.innerHTML=renderRich(content);
  }else{
    const sum=(it.summary||"").trim();
    if(sum){
      // 来源站点多为付费墙 / 登录墙 / 反爬限制，无法镜像全文；展示已本地存档的中文摘要兜底
      body.innerHTML='<div class="r-fallback">⚠️ 该条新闻的<b>全文镜像暂不可用</b>（来源站点可能为付费墙 / 登录墙 / 反爬限制，或原文已失效）。下方为已<b>本地存档的中文摘要</b>，可正常查看；完整原文请点击右下角「查看原文 ↗」。</div>'+
        '<p class="r-summary">'+linkify(escapeHtml(sum))+'</p>';
    }else{
      body.innerHTML='<p class="r-empty">暂未获取到该条新闻的全文镜像与摘要。'+(it.url?'可点击右下角「查看原文 ↗」前往原始报道。':'')+'</p>';
    }
  }
  document.getElementById("readerTitle").textContent=it.title;
  document.getElementById("readerSource").textContent=it.source;
  const link=document.getElementById("readerLink");
  if(it.url){link.href=it.url;link.style.display="";}else{link.style.display="none";}
  r.hidden=false;document.body.style.overflow="hidden";
}
function closeReader(){const r=document.getElementById("reader");r.hidden=true;document.body.style.overflow="";}
document.getElementById("reader").addEventListener("click",function(e){if(e.target===this)closeReader();});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeReader();});
</script>
