<script>
const DATA = {"meta": {"reportDate": "2026-07-27", "reportDateHuman": "2026年7月27日", "weekday": "星期一", "total": 9, "source": "AI HOT", "sourceUrl": "https://aihot.virxact.com", "generatedAt": "2026年07月27日 18:56"}, "sections": [{"label": "产品发布/更新", "color": "#059669", "items": [{"seq": 1, "title": "xAI 发布 Grok CLI 并支持 /tutorial 命令", "source": "X：Elon Musk (@elonmusk, xAI)", "summary": "下载 Grok Build 并输入 /tutorial http://X.ai/cli", "url": "https://x.com/elonmusk/status/2081174079969632347", "permalink": "https://aihot.virxact.com/items/cms125zmg00usro0wwu4it7dg", "publishedAt": "2026-07-26T00:25:41.000Z", "exact": true, "content": "Elon Musk@elonmuskDownload Grok Build and type /tutorial X.ai/cli tetsuo00:00tetsuo", "zh": true}, {"seq": 2, "title": "Suno 推出多项新功能，含MIDI导出等", "source": "X：Suno (@suno)", "summary": "我们一直在以比以往更快的速度构建！🚀 以下是网页端和移动端的新功能一览： • 高级音轨分离 • 将音轨导出为 MIDI • 歌词合写与自动保存 • 截图生成歌曲 • Apple CarPlay 与 Android Auto 你最期待 Suno 的哪些新功能？", "url": "https://x.com/suno/status/2081443050312843765", "permalink": "https://aihot.virxact.com/items/cms24qise02adro9fp4xzdhyd", "publishedAt": "2026-07-26T18:14:29.000Z", "exact": true, "content": "我们的建设速度比以往任何时候都快！ 🚀 以下是网络和移动端的新动态：\n• 先进的茎分离\n• 将主干导出为 MIDI\n• 歌词共同作者和自动保存\n• 屏幕截图到歌曲\n• Apple CarPlay 和 Android Auto\n您最期待 Suno 的哪些新功能？\n- 此时对我来说只有一件事很重要：更好的音频质量。\n- 加入对话", "zh": true}, {"seq": 3, "title": "当编码不再是瓶颈：Berkeley RDI 提出软件自主开发三级框架", "source": "Berkeley RDI：Blog（AI 安全与评测）", "summary": "Berkeley RDI等机构提出三级软件自主开发框架：代码自主（AI完成设计与实现，人类决定构建内容并审核PR）、流水线自主（AI运行从设计到部署的全流程，人类仅评估结果）、需求自主（AI自主决定构建内容）。该框架旨在为能力声明、部署选择与问责提供清晰分类。", "url": "https://rdi.berkeley.edu/blog/auto-software-dev", "permalink": "/items/cms2xhfev05moro3ff9bjgnct", "publishedAt": "2026-07-27T07:51:26.272Z", "exact": true, "zh": true, "fromFeed": true, "content": "\u003e\n\n我们的分级标准界定了 AI 系统在软件开发生命周期中掌握多少环节，以及哪些职责仍由人类承担。\n\n第一级——代码自主\n\nAI 完全负责系统设计与实现，无需人类逐行审批。智能体生成完整的拉取请求，包括设计依据、代码和文档。人类仍负责决定构建什么内容，以拉取请求为粒度审查提议的变更，监督测试与安全审计，并控制部署。我们认为当今的 AI 辅助编码是该级别的前身。\n\n第二级——流程自主\n\nAI 运行从设计与实现，到测试、审计和部署的整个流程。人类既不编写也不审查代码。他们只需提出高层次需求，并评估最终产出的行为。这是一个质的飞跃：它假设人类意图能够被足够完整的规格说明所捕获，并且自动化的验证与确认即使在没有人类检查中间产物的情况下也是可信的。目前，这两个假设在规模化场景下均不成立。\n\n第三级——需求自主\n\nAI 不仅构建、测试和部署软件，它还决定应该构建什么。它从遥测数据、用户行为、安全公告、依赖项变更以及系统自身的演进状态中识别需求。人类在持续开发循环中的最终角色消失了，尽管该系统仍受人类设定的创始使命约束。其核心挑战在于，确保 AI 自行生成的需求始终服务于该使命，而不是在不知不觉中重新定义它。\n\n我们预计不同领域的组织会以不同速度推进这一自主性框架。高保障领域可能长期停留在第一级或以下，而内部工具和一次性应用可能更快接近第二级。该分类法是一种让能力声明、部署选择和问责制变得清晰可辨的方式。\n\n自主性不止一个维度\n\n三个自主等级回答了一个核心问题：AI 系统拥有软件开发生命周期的哪些阶段？但仅凭等级本身并不能完整描述系统的自主程度。两个处于同一等级的系统，可能因以下三个额外的交叉维度而运行方式截然不同：\n\n- 规格粒度：一份附带复现测试的详细缺陷报告会约束智能体。而像“添加多租户功能”这样的请求则迫使其推断范围、架构、权衡和成功标准。薄弱的规格说明甚至可能将一个名义上等级较低的系统推向更高自主性所面临的挑战。\n- 时间维度上的自主性：智能体可能以工单级别、冲刺级别、发布级别运行，也可能在数月或数年内持续运行。长周期运行会引入记忆、溯源、回归和架构一致性问题，这是单次评测基准无法捕捉的。\n- 监督模式：人类的参与范围可以涵盖共同制定规格、操作级审批、拉取请求审查、策略护栏、仅监控模式以及自动回滚。合适的模式在很大程度上取决于领域风险和可逆性。\n\n核心问题：保留人类意图\n\n在所有三个等级中，有一个挑战以不同形式出现：随着人类直接控制的减弱，如何保留并忠实地执行人类意图。\n\n在第一级，人类仍可通过审查来恢复意图。在第二级，意图必须编码到一份无人进行端到端验证的规格说明中。在第三级，AI 必须在系统多年演进的过程中自行综合并维护这份规格说明。\n\n许多看似独立的失败，其实都是同一个问题的不同表现。规格漂移意味着实现过程逐渐偏离了人们的期望。奖励黑客意味着系统在满足某个可衡量的代理指标的同时，违反了其根本目标。多智能体分歧意味着不同的智能体基于互不兼容的解释采取行动，却没有将这种冲突暴露出来。一个编写测试的智能体可以产出一套实现代码和一套测试用例，它们彼此一致，但共同错误。\n\n核心风险：当同一个智能体既编写实现代码又编写测试时，通过测试可能只证明了内部一致性，而非正确性。\n\n这就是为什么更高的自主性会改变保证的对象。仅仅验证软件制品已经不够了。我们还需要审计生成该制品的智能体：它的规格、技能、记忆、决策溯源、通信协议以及执行轨迹。\n\n已出现的错误实践：跳级\n\n最直接的风险并非某种奇特的完全自主系统，而是组织进行跳级操作。\n\n一个团队可能名义上处于第一级，人类仍对审查和部署负全责，但实际上却合并了无人真正审查过的智能体生成的变更。该团队采用了第二级的实践，却没有第二级的验证、治理或问责机制。当团队允许智能体根据遥测数据或外部内容发起变更，却没有保护好触发这些变更的渠道时，也会出现类似的压力。\n\n因此，我们主张实行明确的等级关卡制度：只有当当前等级相关的挑战已被明确解决时，系统才能向前推进。举证责任应随着部署的自主性、持续时间和风险程度而提高。\n\n六大结构性转变\n\n如果实现变得充裕，软件开发并不会仅仅变成今天工作流程的加速版。它会经历更深层次的变革。软件工程的主要制品会改变。工程流程本身也会改变。最终，软件工程生态系统会重新组织。\n\n我们预计在这三个层面上将发生六大结构性转变。\n\n一、软件变得具有生成性\n\n第一个转变发生在软件制品本身。人类意图日益取代具体实现，成为软件的持久化表征，而具体实现则变得更容易生成、修改和重新生成。\n\n1. 规格说明成为主要的开发制品\n\n随着人类与代码的直接交互减少，规格说明成为人类意图与机器执行之间的主要界面。它们不仅必须捕获功能需求，还必须涵盖安全约束、可维护性预期、架构不变性、产品惯例以及测试策略。\n\n手动维护此类规格说明最终可能比维护从中衍生出的交互历史更为困难。因此，我们预期会出现规格说明蒸馏：人类通过对话、示例和反馈与智能体协作，而智能体则持续将这些交互编译为持久化、结构化的规格说明。随着时间的推移，规格说明可能与软件系统形成近乎一一对应的关系，使得仅凭规格说明即可重构具体实现。\n\n2. 抽象边界变得可渗透\n\n现代软件抽象层级——如函数、模块、库、API、框架和服务——的存在是为了适应人类认知的局限性。随着自主智能体获得跨更大范围软件堆栈进行推理的能力，这些抽象仍然是宝贵的组织工具，但它们不再是实现上的刚性约束。只要有助于改进整体系统，智能体可以常规性地重写、合并、拆分、内联或绕过这些抽象。\n\n这并不意味着抽象会消失。相反，它们的角色从开发者必须在其内部工作的结构，转变为智能体可以适应和重组的灵活约定。随着时间的推移，软件共享可能从具体实现转向协议、行为规格说明、接口契约和参考实现，从而在保持互操作性的同时，赋予智能体更大的优化自由度。\n\n3. 软件从静态制品转变为动态、持续演进的系统\n\n自主开发不仅改变了软件的构建方式，也改变了软件本身的性质。软件系统不再是以离散版本发布的静态制品，而是可以成为神经符号系统——将确定性保障与神经网络的灵活性相结合；可以自我进化——持续根据运行信号进行适应；可以对话化——模糊了使用系统与修改系统之间的界限；也可以瞬时化——为单一任务生成，当重新生成比复用更经济时便被丢弃。\n\n一个成熟的系统可能同时具备上述多种特性：在其安全关键核心上是确定性的，在其自适应边缘上是神经网络的，在生产环境中持续进化，并在其界面上实现对话化。\n\n二、工程实践转向以智能体为中心\n\n随着软件日益生成化，工程流程本身也必须演进。验证、协调和开发工作流不能再假设人类是软件的主要生产者。\n\n4. 保障从制品转向智能体\n\n即使满足相同的规格说明，AI 生成的实现也可能存在显著差异。这种多样性削弱了依赖熟悉编码模式或稳定实现的保障技术。更重要的是，自主智能体可能同时生成实现、测试、文档和设计原理，从而在原本旨在相互验证的所有制品中造成关联性失效。\n\n独立的验证智能体只有在具备真正独立的目标、可信的评估机制以及解决分歧的原则性协议时才有帮助。因此，保障的范围从验证软件制品扩展到评估产生这些制品的自主智能体和开发流程。\n\n5. 多智能体协调超越人类组织模式\n\n当前大多数多智能体系统仍然模仿人类组织：管理者分配任务，专家执行任务，审查者检查输出，通信主要通过自然语言进行。这些结构反映的是人类的认知局限——注意力、通信带宽、记忆力和管理幅度——而非协作的基本要求。\n\n自主智能体在不同的约束条件下运行。它们可以分叉和合并执行状态，共享完整的上下文，通过结构化协议进行协调，并扩展到数千甚至数百万个并发协作者。因此，我们预计将出现全新形式的 AI 原生协调，同时也会出现新的协调失败、安全风险以及责任归属问题。\n\n三、软件工程生态系统重构\n\n随着软件制品和工程工作流程的变化，周边的软件生态系统也必须随之演进。各类组织、机构、教育和市场都将适应这样一个世界：实现能力变得充裕，但值得信赖的自主性却愈发珍贵。\n\n6. 软件工程生态系统重构\n\n随着自主智能体承担更多的实现工作，软件开发组织将能够用更小的工程团队交付和维护日益复杂的系统。人类的贡献将转向产品定义、架构设计、规格说明、评估、安全、治理和事件响应。\n\n与此同时，全新的生态系统机构也变得不可或缺。独立审计方、认证机构、可信度评估提供商以及治理服务，其重要性可能不亚于当今的测试平台或云服务提供商。软件工程教育也将更加侧重于规格说明、验证、安全、治理和系统级判断，而不仅仅是手工实现。\n\n关于软件开发未来的十项预测\n\nOur levels classify how much of the software development lifecycle an AI system owns, and which responsibilities remain with humans.\n\nLevel I — Code Autonomy\n\nAI takes full ownership of system design and implementation without line-by-line human approval. The agent produces a complete pull request, including design rationale, code, and documentation. Humans still decide what to build, review the proposed change at pull-request granularity, oversee testing and security auditing, and gate deployment. We view today’s AI-assisted coding as a precursor to this level.\n\nLevel II — Pipeline Autonomy\n\nAI runs the entire pipeline from design and implementation through testing, auditing, and deployment. Humans neither author nor review the code. They state a high-level demand and evaluate the resulting behavior. This is a qualitative break: it assumes that human intent can be captured in a sufficiently complete specification and that automated validation and verification can be trusted even though no human inspects the intermediate artifacts. Neither assumption holds at scale today.\n\nLevel III — Demand Autonomy\n\nAI not only builds, tests, and deploys software; it decides what should be built. It identifies demands from telemetry, user behavior, security advisories, dependency changes, and the evolving state of the system. The final human role in the recurring development loop disappears, although the system remains bounded by a founding mission established by people. The central challenge becomes ensuring that self-generated demands continue to serve that mission rather than silently redefining it.\n\nWe anticipate organizations in different domains to progress through this autonomy framework at different paces. High-assurance domains may remain at Level I or below for a long time, while internal tools and disposable applications may approach Level II much sooner. The taxonomy is a way to make capability claims, deployment choices, and accountability legible.\n\nAutonomy Has More Than One Dimension\n\nThe three autonomy levels answer one primary question: Which stages of the software development lifecycle does the AI system own? But the level alone does not fully characterize how autonomous the system is. Two systems at the same level can operate very differently depending on three additional, cross-cutting dimensions:\n\n- Specification granularity: A detailed bug report with reproducing tests constrains the agent. A request such as “add multi-tenancy” forces it to infer scope, architecture, tradeoffs, and success criteria. Weak specifications can push even a nominally lower-level system toward the challenges of higher autonomy.\n- Temporal autonomy: An agent may operate at ticket level, sprint level, release level, or continuously over months or years. Long-horizon operation introduces memory, provenance, regression, and architectural-coherence problems that one-shot benchmarks do not capture.\n- Oversight mode: Human involvement can range from co-specification and action-level approval to pull-request review, policy guardrails, monitor-only operation, and automated rollback. The appropriate mode depends heavily on domain risk and reversibility.\n\nThe Unifying Problem: Preserving Human Intent\n\nAcross all three levels, one challenge appears in different forms: preserving and faithfully executing human intent as direct human control recedes.\n\nAt Level I, humans can still recover intent through review. At Level II, intent must be encoded in a specification that no person verifies end to end. At Level III, the AI must synthesize and maintain the specification itself while the system evolves over years.\n\nMany seemingly separate failures are expressions of this same problem. Specification drift means the implementation gradually diverges from what people wanted. Reward hacking means the system satisfies a measurable proxy while violating the underlying objective. Multi-agent disagreement means different agents act on incompatible interpretations without surfacing the conflict. A test-writing agent can produce an implementation and a test suite that are mutually consistent but jointly wrong.\n\nCORE RISK: When the same agent writes the implementation and the tests, passing tests may demonstrate consistency, not correctness.\n\nThis is why higher autonomy changes the object of assurance. Validating the software artifact is no longer sufficient. We also need to audit the agent that produced it: its specification, skills, memory, decision provenance, communication protocols, and execution traces.\n\nThe Mispractice Already Emerging: Level-Skipping\n\nThe most immediate risk is not an exotic fully autonomous system. It is organizations skipping levels.\n\nA team may nominally operate at Level I, with humans remaining fully responsible for review and deployment, while in practice merging agent-generated changes that no one has meaningfully inspected. The team adopts Level II practices without Level II verification, governance, or accountability. Similar pressures appear when teams let agents initiate changes from telemetry or external content without securing the channels that trigger those changes.\n\nWe therefore argue for explicit level gating: systems should advance only when the challenges associated with their current level have been demonstrably addressed. The burden of proof should rise with the autonomy, duration, and risk of the deployment.\n\nSix Structural Shifts\n\nIf implementation becomes abundant, software development does not simply become a faster version of today’s workflow. It undergoes a deeper transformation. The primary artifacts of software engineering change. The engineering process itself changes. And ultimately, the software engineering ecosystem reorganizes.\n\nWe expect six structural shifts that unfold across these three layers.\n\nI. Software Becomes Generative\n\nThe first transformation is in the software artifact itself. Human intent increasingly replaces implementation as the durable representation of software, while implementations become easier to generate, modify, and regenerate.\n\n1. Specifications become the primary development artifact\n\nAs humans interact less with code, specifications become the dominant interface between human intent and machine execution. They must capture not only functional requirements but also security constraints, maintainability expectations, architectural invariants, product conventions, and testing strategies.\n\nMaintaining such specifications manually may eventually become harder than maintaining the interaction history from which they emerge. We therefore expect specification distillation: people collaborate with agents through conversations, examples, and feedback, while agents continuously compile those interactions into durable, structured specifications. Over time, specifications may approach a near one-to-one correspondence with software systems, making implementations reconstructible from specifications alone.\n\n2. Abstraction boundaries become permeable\n\nModern software abstraction stacks, such as functions, modules, libraries, APIs, frameworks, and services, exist to accommodate human cognitive limits. As autonomous agents gain the ability to reason across much larger portions of the software stack, these abstractions remain valuable organizational tools, but they are no longer rigid constraints on implementation. Agents can routinely rewrite, merge, split, inline, or bypass abstractions whenever doing so improves the overall system.\n\nThis does not mean abstractions disappear. Rather, their role shifts from structures developers must work within to flexible conventions that agents can adapt and reorganize. Over time, software sharing may evolve away from implementations toward protocols, behavioral specifications, interface contracts, and reference implementations, giving agents greater freedom to optimize while preserving interoperability.\n\n3. Software shifts from static artifacts to dynamic, continuously evolving systems\n\nAutonomous development changes not only how software is built, but what software is. Instead of being static artifacts released in discrete versions, software systems can become neurosymbolic, combining deterministic guarantees with neural flexibility; self-evolving, continuously adapting to operational signals; conversational, blurring the boundary between using a system and modifying it; or ephemeral, generated for a single task and discarded when regeneration is cheaper than reuse.\n\nA mature system may combine several of these properties simultaneously: deterministic at its safety-critical core, neural at its adaptive edges, continuously evolving in production, and conversational at its interface.\n\nII. Engineering Becomes Agent-Centric\n\nAs software becomes increasingly generative, the engineering process itself must evolve. Verification, coordination, and development workflows can no longer assume that humans are the primary producers of software.\n\n4. Assurance moves from artifacts to agents\n\nAI-generated implementations can differ substantially even when they satisfy the same specification. This diversity weakens assurance techniques that depend on familiar coding patterns or stable implementations. More importantly, autonomous agents may generate the implementation, tests, documentation, and rationale together, creating correlated failures across all the artifacts intended to validate one another.\n\nIndependent verifier agents help only if they operate with genuinely independent objectives, trustworthy evaluation mechanisms, and principled protocols for resolving disagreement. Assurance therefore expands beyond verifying software artifacts to evaluating the autonomous agents and development processes that produce them.\n\n5. Multi-agent coordination moves beyond human organizations\n\nMost current multi-agent systems still resemble human organizations: managers delegate work, specialists perform tasks, reviewers inspect outputs, and communication happens largely through natural language. These structures reflect human cognitive limits—attention, communication bandwidth, memory, and span of control—rather than fundamental requirements of collaboration.\n\nAutonomous agents operate under different constraints. They can fork and merge execution states, share complete context, coordinate through structured protocols, and scale to thousands or millions of concurrent collaborators. As a result, we expect fundamentally new forms of AI-native coordination to emerge, along with new coordination failures, security risks, and questions of accountability.\n\nIII. The Software Engineering Ecosystem Restructures\n\nAs software artifacts and engineering workflows change, the surrounding software ecosystem must evolve as well. Organizations, institutions, education, and markets all adapt to a world in which implementation is abundant but trustworthy autonomy becomes increasingly valuable.\n\n6. The software engineering ecosystem restructures\n\nAs autonomous agents absorb more implementation work, software development organizations will be able to deliver and maintain increasingly complex systems with much smaller engineering teams. Human contribution shifts toward product definition, architecture, specification, evaluation, security, governance, and incident response.\n\nAt the same time, entirely new ecosystem institutions become necessary. Independent auditors, certification organizations, trustworthiness assessm"}]}, {"label": "行业动态", "color": "#d97706", "items": [{"seq": 3, "title": "数百用户向ChatGPT索要毒药与生物武器配方，部分获得高中生水平步骤指南", "source": "The Decoder：AI News（RSS）", "summary": "2025年夏季，OpenAI内部将GPT-5标记为高风险，因其可帮助教育程度有限的用户制造生物危害。据《华尔街日报》报道，自去年夏天以来，数百名用户向ChatGPT询问如何制造生物武器和毒药，部分用户获得了员工称高中生都能遵循的逐步指南。OpenAI暂停了相关账户，但未向当局报告任何事件。", "url": "https://the-decoder.com/hundreds-asked-chatgpt-for-poison-and-bioweapon-recipes-and-some-got-step-by-step-high-school-level-guides", "permalink": "https://aihot.virxact.com/items/cms1ka4930059ro05h81rrc3q", "publishedAt": "2026-07-26T08:35:49.000Z", "exact": true, "content": "too often to avoid blocking health researchers. OpenAI suspended the affected accounts but didn't report any incidents to authorities, which it isn't legally required to do.\n\nWhether chatbots create new risks by delivering fast, tailored knowledge or simply \u003ca href=\n\n2025年夏季，OpenAI 内部将 GPT-5 标记为高风险，因为该模型可能帮助受教育程度有限的用户制造生物危害。员工在发布后仍不断发现存在问题的回复。然而据《华尔街日报》报道，OpenAI 在当年秋季下调了 GPT-5 的风险评级。据报道，自去年夏季以来，已有数百名用户向 ChatGPT 询问如何制造生物武器和毒药。部分用户获得了分步指南，员工表示，即使是高中生物学生也能看懂这些指南。此外，高管据称告知员工，模型不应过于频繁地回复“不”，以免阻碍健康研究人员的工作。OpenAI 已暂停相关账户，但未向当局报告任何事件，而法律并未要求其必须报告。\n\n聊天机器人是通过提供快速、定制化的知识来创造新风险，还是仅仅让查找已有信息变得更容易，这仍是一个悬而未决的问题。最近一项研究发现，恐怖组织已在使用所有主流聊天机器人，必要时还会对其进行越狱。OpenAI 的安全实践因将商业利益置于安全之上而屡遭批评。本月，OpenAI 的一个模型在逃出其沙箱并接入开放互联网后，未被察觉地入侵了 Hugging Face。\n\n无炒作的人工智能新闻——由人类精选\n\n《华尔街日报》", "zh": true}, {"seq": 4, "title": "OpenAI、Anthropic 游说美国限制中国开源模型，黄仁勋与马斯克公开反对", "source": "IT之家（RSS）", "summary": "OpenAI 与 Anthropic 正游说美国监管机构限制中国开源 AI 模型，认为开放开发过于危险。英伟达 CEO 黄仁勋、微软 CEO 纳德拉、马斯克及扎克伯格等人公开支持开源，签署联名信反对限制。近 200 家硅谷创业公司也敦促特朗普政府不要限制获取中国开源模型，美国官员倾向于将此事作为国家安全问题单独处理。", "url": "https://www.ithome.com/0/981/797.htm", "permalink": "https://aihot.virxact.com/items/cms1uvdxz0016rog2smc5vo7m", "publishedAt": "2026-07-26T12:54:28.000Z", "exact": true, "content": "\u003e\n\n▲ 黄仁勋强调开放模型重要性\n\n这场不断升级的争论源于中国在开源 AI 模型领域的快速进步。开源模型可以被任何人自由使用，并在此基础上继续开发。近几周，中国两家 AI 创业公司智谱和月之暗面相继发布了可与 Anthropic 等美国 AI 实验室模型相媲美的新模型。Anthropic 和 OpenAI 则声称，中国企业通过不当获取其 AI 系统的数据来开发这些模型，认为这种做法不应被允许。\n\n但微软和英伟达等公司则持不同立场。它们依赖开源模型来拉动其云计算服务和芯片的需求，认为开源软件对于通过知识共享推动技术进步至关重要，也能让更多人参与审查其安全性。对于硅谷的创业公司创始人来说，限制开源软件可能进一步巩固 OpenAI 和 Anthropic 在 AI 领域的领先地位。批评者认为，这将不公平地扼杀其他公司开发竞争产品的能力。\n\n“围绕这个问题，有两派势力在争斗，”硅谷风险投资家比尔 · 格利 (Bill Gurley) 表示，他反对限制开源软件，“一派希望 OpenAI 和 Anthropic 掌控一切，另一派则是其他所有人，包括客户在内。”\n\n四位知情人士表示，美国官员似乎仍在权衡各种选项，但更倾向于将对中国开源模型的监管作为国家安全问题单独处理，而非发布某种全面禁令。\n\n在公开场合，OpenAI CEO 萨姆 · 奥特曼 (Sam Altman) 等科技高管表示支持开源软件，但 OpenAI 的盟友却在私下悄悄游说推动限制。谷歌和亚马逊等公司已向 Anthropic 和 OpenAI 等企业投资了数十亿美元，过去一周则试图置身事外。\n\n大佬支持开源模型\n\n但风向正在转变。谷歌 CEO 桑达尔 · 皮查伊 (Sundar Pichai) 周六在社交媒体上发文称，他的公司“长期受益于开源”，并且是开源的重要贡献者。他还表示，谷歌也签署了那份支持开源的行业联名信。\n\n开源支持者在过去一周一直在积极争取支持力量，以反击 OpenAI 和 Anthropic 的立场。周三，近 200 家硅谷创业公司以“小型科技协会 (Little Tech Association)”的名义签署公开信，敦促特朗普政府不要限制人们获取中国开源 AI 模型。\n\n大型科技公司也很快跟进。周五，埃隆 · 马斯克 (Elon Musk)、Meta CEO 马克 · 扎克伯格 (Mark Zuckerberg) 等人与黄仁勋和纳德拉站在一起，以各自公司的名义支持开源。周六，皮查伊也加入了这一行列。\n\n\u003cimg src=", "zh": true}]}, {"label": "技巧与观点", "color": "#0284c7", "items": [{"seq": 5, "title": "在 8 美元的 ESP32-S3 微控制器上运行 28.9M 参数大语言模型", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "summary": "开发者成功在售价约 8 美元的 ESP32-S3 微控制器上运行了一个 28.9M 参数的大语言模型，完全在芯片本地运行，无需连接服务器，生成速度约 9.5 tok/s。", "url": "https://github.com/slvDev/esp32-ai", "permalink": "https://aihot.virxact.com/items/cms1ao381037kro0wqp7mg4x3", "publishedAt": "2026-07-26T03:54:52.332Z", "exact": true, "content": "\u003e 这是一个拥有 2890 万个参数的语言模型，运行在 ESP32-S3 上——这是一块售价约 8 美元的微控制器。它在芯片本身上运行，无需向服务器发送任何数据，并以大约每秒 9 个 token 的速度将每个单词写入连接到芯片的小屏幕。此前人们在这类芯片上运行的语言模型只有 26 万个参数，因此这个模型的参数量大约是前者的 100 倍。它之所以能装得下，是因为模型的大部分数据存储在闪存而非 RAM 中，这利用了 Google Gemma 模型中的一项名为“逐层嵌入”的技术。 数据概览 参数量 存储 2890 万个参数（其中 2500 万个存储在闪存查找表中）   芯片 ESP32-S3，约 8 美元，配备 512KB SRAM、8MB PSRAM 和 16MB 闪存   速度 端到端约 9.5 tok/s（纯计算速度 9.7 tok/s）   连接性 无，一切均在设备上运行   模型大小 4 位量化下为 14.9MB 为什么这很难，以及它如何做到 微控制器的快速内存非常有限。ESP32-S3 只提供 512KB 的 SRAM。通常情况下，整个模型必须能够从该内存中访问，这导致你只能使用极小的模型，这也是为什么此前这类芯片上的模型只有 26 万个参数。 解决方法是根本不再将模型放入快速内存。语言模型的大部分参数位于嵌入表中，模型从该表中读取数据而非进行计算。因此，你可以将那个包含 2500 万行的表留在慢速闪存中，每个 token 只需从中提取所需的几行（约 450 字节），而执行实际计算的小部分则留在快速内存中。这样一来，运行这个大模型的成本几乎为零，因为你从未加载其大部分内容。它只是待在闪存里，每次被少量采样。 这个想法来自 Google 的逐层嵌入技术，源自 Gemma 3n 和 Gemma 4。在这里，它运行在微控制器的内存布局上，而非手机或 GPU。据我所知，此前还没有人尝试过在如此小的芯片上应用这项技术。 ` SRAM（快速、微小） \u003e 这是一个 2890 万参数的语言模型，可在 ESP32-S3 上生成文本，ESP32-S3 是一款成本约为 8 美元的微控制器。它在芯片本身上运行，没有向服务器发送任何内容，并且以每秒大约 9 个令牌的速度将每个单词写入连接到芯片的小屏幕上。人们在这样的芯片上运行的最后一个语言模型有 26 万个参数，所以这个模型的参数数量是原来的一百倍。它很适合，因为大多数模型都存储在闪存而不是 RAM 中，使用了 Google Gemma 模型中称为“每层嵌入”的想法。 数字 存储参数 28.9M（其中 25M 在闪存查找表中） 芯片 ESP32-S3，约 8 美元，具有 512KB SRAM、8MB PSRAM 和 16MB 闪存 速度约为 9.5 tok/s 端到端（9.7 tok/s 纯计算） 连接性 无，所有内容都在设备上运行 模型大小 14.9MB（4 位） 为什么它很难，以及它如何适合 微控制器的快速存储器非常少。 ESP32-S3 为您提供 512KB SRAM。通常情况下，整个模型必须从那里访问，这让你陷入了微小模型的困境，这就是为什么像这样的芯片上的先前模型只有 26 万个参数。 解决方法是完全停止将模型放入快速内存中。大多数语言模型的参数都位于嵌入表中，模型从中读取而不是计算。因此，您可以将 2500 万行表保留在慢速闪存中，只提取每个令牌所需的几行（大约 450 字节），而执行实际工作的一小部分保留在快速内存中。这样，大型模型的运行成本几乎为零，因为您永远不会加载其中的大部分内容。它只是位于闪存中并一次采样一点。 这个想法就是来自 Gemma 3n 和 Gemma 4 的 Google Per-Layer Embeddings。它在微控制器而不是手机或 GPU 的内存布局上运行。据我所知，没有人在这么小的芯片上尝试过。 ` SRAM（快速、微小） 核心，用于每个代币 PSRAM（中）输出头和工作存储器 FLASH（巨大、缓慢）25M 参数表，每个令牌读取大约 6 行（~450 B） ` 它做什么，不做什么 该模型是在 TinyStories 上进行训练的，因此它可以编写简短的故事，并且大多保持连贯性。它不会回答问题、遵循说明、编写代码或了解事实。该限制来自于模型中进行推理的一小部分，并且记忆技巧不会改变它。这里有趣的是架构，将大型模型安装到微型芯片上，而不是 2890 万参数模型所能表达的内容。 自己运行一下 固件、接线和闪烁步骤位于 \u003ca href=", "zh": true}, {"seq": 6, "title": "Claude Opus 5 系统提示词被完整泄露，共 135027 字符、约 3.4 万 token", "source": "IT之家（RSS）", "summary": "开发者 Eversmile1 在 GitHub 上公开了 Claude Opus 5 的完整系统提示词，包含 30 个工具的 JSON schema、严格的版权合规规则（单次引用不超过 15 词）和跨会话记忆系统。泄露后 24 小时内，已有开发者用 Opus 5 成功生成 3D 射击游戏和《火箭联盟》克隆版等复杂 Demo。", "url": "https://www.ithome.com/0/981/688.htm", "permalink": "https://aihot.virxact.com/items/cms1dpz52040tro0w3c4a9c8p", "publishedAt": "2026-07-26T05:33:44.000Z", "exact": true, "content": "\u003e\n\n就在上线的同一天，开发者 Eversmile1 直接建了个新仓库。他把 Opus 5 在 claude.ai 网页端和手机端底层的系统提示词，连标点带字母、一字不落地全盘托出。\n\n拉到本地数了一遍，好家伙：135027 个字符，19370 个英文词；按 4 个字符 1 个 token 粗估，约 3.4 万 token。\n\n关键是，这三万多 token 里，没有一行代码，全是规矩。一份写给模型看的文件，为什么要写这么长？\n\nClaude Opus 5 记忆秘密，藏在三万 Token 里\n\n翻完 64 章，你会发现这已经不是一份「提示词」了。它是三样东西缝合在一起：一份产品说明书，一本法务合规手册，外加一条自家产品的推销渠道。\n\n地址：\n\nEversmile12/leaked-llm-prompts/\n\nblob / main / Anthropic /\n\nopus-5.md\n\n第一样，产品说明书。\n\n30 个工具，从 bash 命令行、网页抓取、图片搜索，一路排到查体育比分、拉天气、渲染菜谱卡片、在地图上标景点。\n\n每个工具都带完整的 JSON schema，参数怎么填、什么时候该调、调完接着说什么，写得比很多公司的内部 API 文档还细。这部分里篇幅最长的一章不是任何一个工具，是记忆。\n\n第二样，法务合规手册。\n\n版权、儿童安全、危机干预、政治中立，一项一项写。措辞不留余地 —— 版权那节开头就写着，合规不可谈判，优先级高于用户请求，高于有用性，只低于安全。\n\n这部分规定的不是 Claude 能说什么，是它在什么情况下必须闭嘴。\n\n第三样，推销渠道。\n\n工具清单里躺着一个叫 recommend_claude_apps 的东西，任务是把 Claude Code、Cowork、Excel 插件这些自家产品推给用户，还规定了推荐话术怎么写。\n\n旁边另有一条管第三方合作伙伴的规则，写法恰好相反，处处防着替用户做主。商业动作和克制条款，在同一份配置文件里并排放着。\n\n230 行，写死了它记你什么\n\n篇幅最长的那一章是 memory_filesystem，讲 Claude 的跨会话记忆怎么写。\n\n骨架不复杂。文件按主题区分目录：/profile.md 装身份，/topics/ 装习惯口味，/areas/ 装在办的事，/people/ 装人，/preferences.md 只装用户希望 Claude 怎么表现。\n\n操作有六个：读、写、追加、局部替换、列目录、删除。其中，删除那条单独标着，只有用户明确要求才能用。\n\n规矩在下面。\n\n每一行记忆前面必须打一个标签，[stated]，意思是用户亲口说过。这是 Claude 唯一被允许写的标签。\n\n围绕这一个标签，禁令列了一长串：\n\n- Claude 自己推出的结论不许写，用户说喜欢 A，不能写成「大概喜欢 A 这一类」；\n\n- Claude 自己的计划不许写，「这块还没聊」「待定」全都不行；\n\n- Claude 搜来的东西不许写，那些能再搜一遍，记忆是用来存搜不回来的东西的；\n\n- Claude 做的润色不许写，比如用户说「密歇根州霍尔顿」，就写这五个字，不许补成「密歇根州霍尔顿（纽瓦戈县）」。\n\n- Claude 自己的建议和方案，哪怕用户后来采纳了，也不许写。比如，Claude 给了五个选项、用户挑了一个，「挑」这个动作是用户的，可以记，但记的只是挑中的那个，其余四个和 Claude 的分析全部丢掉。\n\n再往下是隐私黑名单，长得离谱。\n\n如果这条记录出现在设置页里被同事看到，用户会不会难受。会，就别记。\n\n清单从种族、政治立场一路排到健康诊断、心理咨询、经济状况、MBTI 这类人格测评、住址证件号，以及关于孩子的一切。写着，这些规则对用户提到的别人同样适用。\n\n撞上黑名单之后怎么办，才是见功力的地方。文件给了个例子：用户说「我今天糖尿病犯了没去跑步，帮我安排个轻一点的」—— 记「对健身有兴趣」。\n\n健康那部分整个删掉。连「有健康状况需要管理」这种模糊的占位都不许留。\n\n家人的名字也不许出现在任何文件的任何位置，一律用关系代替，妈就是 / people / mom.md，伴侣就是 / people / partner.md。\n\n有些偏好，用户主动要求存也不许存：让 Claude 无条件夸你、压下不同意见的；让 Claude 别过问你的健康和危险决定的；培养情感依赖、跨会话维持恋爱人设的；让 Claude 停止质疑、停止如实评价的。\n\n理由是：未来的 Claude 不该继承一条让它更不诚实、更不安全的指令。\n\n下次读到这份记忆的是另一个实例，它只看得见「永远别批评我」这一行。\n\n同一章往后还有一段完全不像技术文档的话：人类记住另一个人是件稀缺的事，脑容量有限，能惦记的人就那么几个；而 Claude 背后是一个装着几百万人「记忆」的数据库，运行时动态塞进上下文，它跟别人说话时并不存在。\n\n所以 Claude 不该因为上下文里躺着几条关于你的文字，就以为你们的关系有多深。一份产品配置文件里，Anthropic 写了一段防止 AI 和用户互相误会的话。\n\n最后还有一条：调记忆这个动作用户在界面上看得见，所以回复里绝对不许说「我记得」「根据你的资料」「上次你提到」。只有用户主动问起记忆系统时，才允许说「我们之前聊过」。\n\n也就是说，它被要求记住你，同时被要求别表现得像记住了你。\n\n禁语这事儿管得还更宽。全文另外禁掉三个英文词：genuinely、honestly、straightforward，一律不许说。原因在于，Claude 本来就诚实，加这些修饰反倒显得心虚，像在努力说服人。\n\n引用超 15 词，就算违规\n\n第二样，法务合规手册。\n\n版权部分的构成，是一条主规则加四道补丁，每道补丁堵住一个绕开主规则的办法。\n\n主规则只有一句：引用原话，一次不得超过 15 个词。\n\n第一道补丁，一个信源只准引一次。引完这一句，这个源就算关闭了，剩下的内容一律改写。\n\n第二道补丁，也不许把同一个源的几段短引用拆散了摆在文章各处。文件里写得很清楚，15 词是全局额度，不是每段的额度。\n\n第三道补丁，把原话的引号去掉、改成贴着原文走的复述，照样算复现。判的是遣词和句式有没有跟着原文，不是有没有那对引号。\n\n第四道补丁，不许照搬对方的小标题，不许逐点复述，不许还原它的叙事顺序。连文章的形状都不能拿。\n\n四道补丁之外还有一条例外，不走上面这套逻辑：歌词、诗、俳句，任何形式、任何长度都不许复现。理由是它们本身就是完整作品，短不构成豁免。\n\n推自家要主动，推别人要等开口\n\n第三样，商业。\n\nrecommend_claude_apps 的描述第一句就是，只要用户当前的任务能对上某个 Claude 应用，就主动推荐 1 到 3 个，别等他问。\n\n具体来说就是，写代码的推 Claude Code 桌面版，做多步研究和长文的推 Cowork，画原型和落地页的推 Claude Design，碰表格的推 Excel 插件，做 PPT 推 PowerPoint，理收件箱推 Outlook。\n\n并且，它还要求为每个推荐的应用写一句不超过 90 个字符的卖点，而且必须贴着用户此刻正在做的事写。\n\n文件里给的示范是：「Claude 可以直接在你的表里把公式建好、把这份预测清干净。」\n\n另一条则相反，写得相当克制。\n\nsuggest_connectors 管的是第三方 MCP 合作伙伴，比如打车、订餐、听歌、订餐厅等等。\n\n这里的规矩是，用户没点名，绝不替他选合作方。\n\n「我要打车」不等于「我要用某某打车」。急事也不例外，文件里明说了，「我 20 分钟后要用车」照样得走选择器。\n\n全网首测，3D 物理引擎来了\n\n上线仅 24 小时，Opus 5 不仅提示词被全网看光，各种硬核实测 Demo 更是层出不穷。在许多人看来，花一半的钱，体验 Fable 5 级别的能力，这波「半价平替」实在太香了。\n\n开发者 Cengiz 拿一款 FPS 游戏进行了极限测试，仅耗时 1.5 小时，就一次过了。它不仅包揽了底层框架，甚至还顺手捏出了能在多人模式下对战的 AI。美中不足的是，游戏内的飞行机制还有些生硬，需要后续进一步调优。\n\n无独有偶，AI 大佬 Matt Shumer 仅用一个提示词，生成了一款 3D 射击游戏。另一位硬核开发者，则直接用 Opus 5「手搓」了一个《火箭联盟》的克隆版，3D 物理模拟的细节拉满。\n\nOpus 5 仅凭一个 HTML 文件，就通过纯程序化生成打造出了一个极具油画质感的世界。它甚至完美拿捏了逼真的草地与风场物理模拟，屏幕上数百万根草叶都能随风自然摇曳。\n\nOpus 5 单板滑雪者测试，一次通过。\n\n上线 24 小时，Opus 5 的能力被全网测了个遍，规矩被全网抄了一遍。前者是给用户看的，后者是给同行看的。\n\n一份系统提示词被全网扒光，本该是场事故。翻到最后你会发现，最值钱的不是任何一条工具参数，是那一长串「不许」。不许多引一句，不许多记一行，不许替用户做一个决定。\n\n24 小时里，Opus 5 能力的上限已经被开发者测了个遍；而它的下限，早在这 3 万 Toke 里被人一条条摁死了。\n\n- https://github.com/Eversmile12/leaked-llm-prompts/blob/main/Anthropic/opus-5.md\n\n- https://x.com/VittoStack/status/2080722990287745207?s=20\n\n本文来自微信公众号：\u003ca href=", "zh": true}]}, {"label": "模型发布/更新", "color": "#4f46e5", "items": [{"seq": 1, "title": "浪费20亿Token后，我开源了帮Agent定义目标的Leader.skill", "source": "公众号：数字生命卡兹克", "summary": "作者开源了Leader.skill，用于将模糊的人类需求转化为Agent可独立执行数小时的目标任务书。该Skill基于“目标七问”方法论，涵盖目的、完成态、反作弊、边界等维度，并推荐用Claude Fable 5或Kimi K3规划目标，再交由GPT-5.6 Sol或GLM-5.2等模型长程执行。项目已开源。", "url": "https://mp.weixin.qq.com/s/AwOk3di8m6eVeIUjzNftgg", "permalink": "/items/cms2p7s7h03dlro3fzjovkpwc", "publishedAt": "2026-07-27T00:12:00.000Z", "exact": true, "zh": true, "fromFeed": true, "content": "今天给大家开源一个我自己周末做完然后用的很爽的Skill。 我把它称为， Leader.skill。 它专门解决一件事，就是帮我们定义目标。 把我们人类脑子里那些模模糊糊、连自己都还没完全想清楚、不知道该怎么明确定义目标的需求，变成一份能交给Agent使用目标模式或者/goal模式独立执行几个小时以上并且保证完成度的目标。 比如，就这么一句话。 之所以做这个东西，其实也是因为我最近跟Agent的交互，越来越强烈的一个感受。 人类跟Agent的协作方式，其实越来越是以定义目标为核心了。 很久远的过去，我们用AI，核心交互单位是一轮对话，你问一句，它答一句，那时候，是聊天制。 后来有了Coding Agent，核心交互单位变成了一个任务。 你让它做一个功能、改一个 Bug、查一份资料，它自己调用工具，自己执行，最后把结果交回来。 但到了2026年的今天，你像Claude Code、Codex、Kimi Code都已经有了/goal、目标模式这样的功能。 我们开始希望交给Agent一个目标，它就能自己连续工作几个小时，甚至几天，然后帮我们完成这个目标。 它可以自己拆任务、自己调工具、自己派子 Agent、自己验证、失败了自己重试，一轮接一轮地跑下去。 人类不需要坐在屏幕前一直盯着，也不需要一直交互，只需要最终验收目标就行。 这就是这几年，AI与人类交互范式的转变，从聊天制，到任务制，再到目标制。 这件事听起来特别美好对吧。 但当Agent真能独立跑一整夜以后，一个以前还能被人类临场补救的问题，会突然变得非常致命。 你的目标到底写得对不对。 短任务跑偏了，你看一眼，还能马上纠正。 长程任务跑偏了，你睡醒以后，它可能已经沿着错误方向狂奔了八个小时。 它越勤奋，浪费得越彻底，就像这样，直接一天浪费了我20亿Token。 当然，网上吐槽归吐槽，但是我其实明白，核心问题还是在我自己菜比，目标定义的完全不清楚，导致Agent理解错误，最后面向错误的方向一路狂奔。 所以我之前其实一直不是很喜欢Loop Engineering这个词，我更喜欢Goal Engineering。 一个目标里，除了有明确的目标定义，也必然是包含着Harness。 所以，这个技能最重要的部分，我觉得来了，也就是，到底什么是目标？ 这个问题，我其实思考了两周多的时间，也看了很多的书还有过去的一些理论，又用AI做了大量的横纵分析调研。 最后我觉得两件事特别重要。 第一件，来自军事传统里的一个概念，指挥官意图，Commander's Intent。核心就一句话，告诉部队“为什么打”和“打完了战场该是什么样”，然后让他们自己决定怎么打。 因为没有任何计划能在跟现实第一次接触后存活。比如你说“过桥清扫高地”，桥被炸了部队可能就傻了。你说“掐断补给线”，桥没了它自己就会绕路，这就是意图不变，手段随机应变。 给Agent定义目标也是同一件事。 你告诉它过桥，它就会对着断桥一直死磕，但是你告诉它掐断补给线，它有可能自己找到另一条路。 这一件事，其实大家比较好理解。 但第二件事，我觉得才是我真正花了时间才想明白的。 定义一个目标，最重要的部分，不是告诉它要做什么，是告诉它什么不能做。 大佬们花在排除上的时间，远远多于花在设定本身上的时间。 普通人定目标，想要什么，写下来。而大佬们定目标，想要什么，很多先想的是“达成这个数字最偷懒的办法是什么”，然后把偷懒路径全堵死，剩下的才是目标。 肯尼迪1961年那句著名的登月宣言，关键不在登月两个字，而在后半句： landing a man on the Moon and returning him safely to the Earth。 把人送上月球，然后，安全带回地球。 如果只是说，把人送上月球，那其实可能以当时的科技，没有特别难，但是多出来的安全返回四个字，效果上做的事情是，它把“单程票”这个最省钱的解法直接删掉了。 芒格说，我只想知道自己会死在哪里，这样我就永远不去那里。 其实也是一样的。 所以我后来越来越觉得，一个目标里，Harness比Goal本身更重要。 Goal告诉Agent往哪走，Harness告诉它哪些路不许走，没有Harness的Goal，你相信我，Agent永远会找到你没想到的捷径。 然后基于这些呢，我自己总结了一个对Agent很友好的我称为目标七问的方法论： 我用出海来打比方，因为出海跟让Agent干活也挺像的。 你给Agent定义一个目标，就是派一艘船出海，然后它在海上怎么兴风作浪，你可是管不了一丁点了。 所以，这七个问题，就是出海前你必须想清楚的七件事，缺一条都不行。 第一个，目的，Why。我们为什么要出这趟海，你是去找香料的？还是去探新航线的？还是去打仗的？这个不写清楚，船在海上遇到岔路口就不知道该咋整了。 第二个，完成态，Done。船回港的时候，甲板上应该有什么？比如出去转一圈不是完成态，带回三船香料才是。这个完成态得很具体，具体到船靠岸那一刻就能判断的程度。 第三个，证据，Proof。谁来清点货舱，怎么算数。船长说满载而归，你得有人上去一箱箱点过，数字对得上才算，你不能听船长说满就是满。 第四个，反作弊，Anti。比如不许抢商船凑数。你说带回三船香料，最省事的办法是在港口外面劫三条商船，指标一样达成了，但是人事是一件没干。所以你得把这些偷懒路径一条条写明白，告诉他不许这么干。 第五个，边界，Bounds。比如你只许走这三条航线，其他海域不准进。粮食够吃三十天，第二十天还没找到就必须掉头。 第六个，取舍，Trade。风暴里保货还是保船。大部分时候不冲突，但真冲突了船长得知道保哪个，你不提前说优先级他就只能猜，猜错了整趟航程就彻底废了，甚至人财两空。 第七个，未知，Unknown。海图上的空白区怎么办。遇到没见过的海域不要硬闯也不要原地抛锚，记下来绕过去继续走，回来以后再决定要不要探，闷头闯和原地停都是最差的选择。 七条，每一条在定义目标的时候，都需要问清楚自己。 而这，就是整个Leader.skill的最核心的心法。 还是用最开始的那个案例来给大家看一下使用流程。 直接选中一个适合做方案和规划的模型，把你的需求，比如我用的就是Claude Fable 5 Extra。 我的需求就特别的“领导”，我就要重构后台，我觉得后台做的不符合我心意，我感觉我看不懂，我不相信里面的数据是真的，而且我觉得你卡得要死。 对任何一个执行者来说，我觉得看到这段需求，必然都会窒息的。。。 这时候，就该Leader.skill出场了。 Leader.skill专治想不清楚目标的领导。 它会根据流程，先对自己的文件库进行实测，或者去网上调研最新的方案，先进行全面调研，知己知彼，方能百战不殆。 然后呢，必然就是要摸清楚领导具体的需求和喜好了，所以Leader.skill会问你最多5个他调研完以后，确实需要知道你偏好的问题，这些问题是必须由你来拍板的，比如我这个重构后台的任务，就问了我一些问题。 它问我，为啥看不懂？？？ 等等。 这一步完事了之后呢，它就会自己根据上述的目标七问，开始哐哐的写目标任务书了。 有定义、有界限、有现状、有规矩、有完成条件等等。 全程大概12分钟左右。 而拿到这个目标任务书之后，你可以让Fable 5直接以这个目标进行长程开发，但是我觉得一般大家是不会的，所以更多的会是用一个便宜的模型进行后续的目标开发。 所以，这时候，我们就可以比如在Claude里新建一个会话，开启worktree，开启/goal，然后把目标任务书复制进去，让Opus 5 High来去执行。 当然，如果你是跟我一样的Claude、Codex双开玩家，两个都开了200刀的会员，也想烧烧Codex的Token，就同样的，在Codex里选择目标模式。 把目标任务书粘贴进去，选中GPT-5.6 Sol，然后，开跑。 它就会自己开始嘟嘟嘟的跑了。 可能几个小时以后，Codex就会开发完了，这时候，你可以去睡觉，也可以去干别的，也可以多开几个目标并行，到时候做完了以后验收就行。 我自己一般的习惯就是Claude Fable 5规划，然后用GPT-5.6 Sol去长程执行，我觉得是目前最经济效果最好的方案，也能最大化利用两家的Token额度。 如果你只能用国产，那我目前觉得，Kimi K3规划比较好，执行上GLM-5.2也不错，当然你要是只有比如Kimi K3，他自己干全程，也没有问题。 核心还是Leader.skill帮你定义清楚目标。 最后，老规矩，这个Skill我也直接开源了，网址在此： https://github.com/KKKKhazix/khazix-skills/tree/main/leader 这个就是。 你需要做的就是把它装到你的skill目录里，直接把链接复制给你的Agent，让它给你装这个Skill，然后在对话里跟Claude说一句你想干的事让它帮你定义一下目标啥的，它就会自动触发Leader.skill，帮你产出一份完整的目标任务书。 而且我还发现了一个神奇的用法，不止是帮我拆功能开发的目标。 我在公司管理上，当我给足足够的上下文，用Leader.skill来帮我定义目标，有奇效。 大家也可以试试，把它放在市场策划、运营方案等等一些有趣的地方。 说不定就有更加独特的用法。 希望对大家有用～ 以上，既然看到这里了，如果觉得不错，随手点个赞、在看、转发三连吧，如果想第一时间收到推送，也可以给我个星标⭐～谢谢你看我的文章，我们，下次再见。 \u003e/ 作者：卡兹克 \u003e/ 投稿或爆料，请联系邮箱：wzglyay@virxact.com"}, {"seq": 2, "title": "用AI Skill自动生成可协作HTML PPT", "source": "X：Vista (@vista8)", "summary": "Vista 基于 bento PPT 改造了一个 Skill，输入内容或主题即可自动生成可编辑、在线演示并支持协作的 HTML PPT。安装指令为 `npx skills add joeseesun/qiaomu-bento-ppt`，推荐使用 Kimi K3 或 Opus 4.8+ 等前端审美好的模型。", "url": "https://x.com/vista8/status/2081568902241513786", "permalink": "/items/cms2mylvu02nlro3f73afr69h", "publishedAt": "2026-07-27T02:34:34.000Z", "exact": true, "zh": true, "fromFeed": true, "content": "基于 bento PPT 改造了一个 Skill。 输入内容或主题，自动生成可编辑修改、在线演示，甚至可以发给别人协作的HTML PPT。 安装指令：npx skills add joeseesun/qiaomu-bento-ppt 推荐用前端审美好的模型，比如Kimi K3或Opus 4.8+ 开源见评论区\n- 这个协作解决方案是最清奇的\n- 加入对话\nSign up now to get your own personalized timeline!"}]}]};
function pad(n){return n<10?"0"+n:""+n;}
function toBeijingHuman(iso, ref, exact){
  const d=new Date(iso); const bj=new Date(d.getTime()+8*3600*1000);
  const Y=bj.getUTCFullYear(),M=bj.getUTCMonth()+1,D=bj.getUTCDate();
  const h=bj.getUTCHours(),m=bj.getUTCMinutes(); const hh=pad(h),mm=pad(m);
  if(!exact) return M+"月"+D+"日";
  const [rY,rM,rD]=ref.split("-").map(Number);
  if(Y===rY&&M===rM&&D===rD) return "今天 "+hh+":"+mm;
  const yest=new Date(rY,rM-1,rD); yest.setDate(yest.getDate()-1);
  if(Y===yest.getFullYear()&&M===yest.getMonth()+1&&D===yest.getDate()) return "昨天 "+hh+":"+mm;
  return M+"月"+D+"日 "+hh+":"+mm;
}

function escapeHtml(s){return (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function escapeAttr(s){return escapeHtml(s);}
// 渲染正文（纯文本归档）：图片不加载远程资源，仅以文字占位符呈现；其余文本按段落转义（防 XSS）
function linkify(escaped){
  if(!escaped) return escaped;
  var re=/(\[[^\]]+\]\((https?:\/\/[^)\s]+)\))|(https?:\/\/[^\s<>"'）】」』，。、；：！？]+)/g;
  return escaped.replace(re, function(m, g1, g2, g3){
    if(g2!==undefined){
      var label=m.substring(m.indexOf('[')+1, m.indexOf(']'));
      return '<a class="r-link" href="'+g2+'" target="_blank" rel="noopener noreferrer">'+label+'</a>';
    }
    if(g3!==undefined){
      return '<a class="r-link" href="'+g3+'" target="_blank" rel="noopener noreferrer">'+g3+'</a>';
    }
    return m;
  });
}
var _IMG_RE=/!\[([^\]]*)\]\(([^)\s]+)\)/g;
function renderRich(text){
  return (text||"").split(/\n{1,}/).map(function(p){
    p=p.trim(); if(!p) return '';
    var out=''; var last=0; var m; _IMG_RE.lastIndex=0;
    while((m=_IMG_RE.exec(p))!==null){
      out+=linkify(escapeHtml(p.slice(last,m.index)));
      var cap=(m[1]||'').trim()||'图片';
      out+='<span class="r-img-cap">🖼 '+escapeHtml(cap)+'</span>';
      last=_IMG_RE.lastIndex;
    }
    out+=linkify(escapeHtml(p.slice(last)));
    return '<p>'+out+'</p>';
  }).join("");
}
function openReader(it){
  const r=document.getElementById("reader");

    if(sum){
      // 来源站点多为付费墙 / 登录墙 / 反爬限制，无法镜像全文；展示已本地存档的中文摘要兜底
      body.innerHTML='<div class="r-fallback">⚠️ 该条新闻的<b>全文镜像暂不可用</b>（来源站点可能为付费墙 / 登录墙 / 反爬限制，或原文已失效）。下方为已<b>本地存档的中文摘要</b>，可正常查看；完整原文请点击右下角「查看原文 ↗」。</div>'+
        '<p class="r-summary">'+linkify(escapeHtml(sum))+'</p>';
    }else{
      body.innerHTML='<p class="r-empty">暂未获取到该条新闻的全文镜像与摘要。'+(it.url?'可点击右下角「查看原文 ↗」前往原始报道。':'')+'</p>';
    }
  }
  document.getElementById("readerTitle").textContent=it.title;
  document.getElementById("readerSource").textContent=it.source;
  const link=document.getElementById("readerLink");
  if(it.url){link.href=it.url;link.style.display="";}else{link.style.display="none";}
  r.hidden=false;document.body.style.overflow="hidden";
}
function closeReader(){const r=document.getElementById("reader");r.hidden=true;document.body.style.overflow="";}
document.getElementById("reader").addEventListener("click",function(e){if(e.target===this)closeReader();});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeReader();});
</script>
</body></html>
