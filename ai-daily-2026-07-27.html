部将 GPT-5 标记为高风险，因为该模型可能会帮助受教育程度有限的用户造成生物危害。员工在释放后不断发现有问题的回应。然而，据《华尔街日报》报道，OpenAI 那年秋天下调了 GPT-5 的风险评级。据报道，自去年夏天以来，数百名用户询问 ChatGPT 如何制造生物武器和制造毒药。有些人得到了分步指南，员工说即使是高中生物学生也可以遵循。据报道，高管们还告诉工作人员，模型不应经常说“不”，以免妨碍健康研究人员。OpenAI 暂停了受影响的帐户，但没有向当局报告任何事件，法律上并没有要求它这样做。\n\n聊天机器人是否会通过提供快速、定制的知识来创造新的风险，或者只是让人们更容易地找到已经存在的信息，这仍然是一个悬而未决的问题。最近的一项研究发现，恐怖组织已经使用了所有主要的聊天机器人，并在需要时对其进行越狱。OpenAI 的安全做法因将商业利益置于安全之上而屡遭批评。本月，一个 OpenAI 模型在逃离沙箱并到达开放互联网后，黑客入侵了 Hugging Face，但并未被发现。没有炒作的人工智能新闻——由人类策划 订阅 THE DECODER 即可享受无广告阅读、每周一次的 AI 时事通讯、我们每年六次的独家“AI 雷达”前沿报告、完整的存档访问权限以及我们的评论部分的访问权限。", "zh": true}, {"seq": 4, "title": "OpenAI、Anthropic 游说美国限制中国开源模型，黄仁勋与马斯克公开反对", "source": "IT之家（RSS）", "summary": "OpenAI 与 Anthropic 正游说美国监管机构限制中国开源 AI 模型，认为开放开发过于危险。英伟达 CEO 黄仁勋、微软 CEO 纳德拉、马斯克及扎克伯格等人公开支持开源，签署联名信反对限制。近 200 家硅谷创业公司也敦促特朗普政府不要限制获取中国开源模型，美国官员倾向于将此事作为国家安全问题单独处理。", "url": "https://www.ithome.com/0/981/797.htm", "permalink": "https://aihot.virxact.com/items/cms1uvdxz0016rog2smc5vo7m", "publishedAt": "2026-07-27T00:00:00.000Z", "exact": false, "content": "消息称 OpenAI、Anthropic 游说美国限制中国开源模型，黄仁勋马斯克公开反对 - IT之家 首页 IT圈 最会买 设置 日夜间 随系统 浅色 深色 主题色 黑色 投稿 订阅 RSS订阅 收藏IT之家 软媒应用 App客户端 要知App 软媒魔方 业界 手机 电脑 测评 视频 AI 苹果 iPhone 鸿蒙 软件 智车 数码 学院 游戏 直播 5G 微软 Win10 Win11 专题 搜索 首页 \u003e IT资讯 \u003e 业界 消息称 OpenAI、Anthropic 游说美国限制中国开源模型，黄仁勋马斯克公开反对 2026/7/26 20:54:28 来源： 凤凰科技 作者： 箫雨 责编： 沁沧 评论： 感谢IT之家网友 华南吴彦祖 的线索投递！\n\n北京时间 7 月 26 日，据《纽约时报》报道，多年来，硅谷科技界在 AI 软件开发方式上一直存在理念分歧。本周，这场争论达到了白热化。一方是以 Anthropic 和 OpenAI 为首的头部 AI 企业，它们认为，某些 AI 模型过于危险，不应以开放方式开发，而必须由像它们这样的企业一样进行严格控制，以确保安全。另一方则是包括微软、英伟达等巨头在内的科技行业其他成员，它们主张所谓的开源 AI 模型必须保持开放，以便人们进一步开发技术、创立新的业务。\n\n这两方阵营已经开始公开交锋。周五，英伟达 CEO 黄仁勋 (Jensen Huang) 首次在 X 上发文称：“世界既需要前沿闭源模型，也需要前沿开放模型。”九分钟后，微软 CEO 萨提亚 · 纳德拉 (Satya Nadella) 发文称，开源软件“对健康的 AI 生态系统至关重要”。两人均签署了一封支持开源的信函，Meta、Palantir 和 IBM 的高管也共同签署了该信函。\n\n与此同时，据五位知情人士透露，OpenAI 和 Anthropic 一直在华盛顿游说监管机构，对中国的开源 AI 模型表达担忧。这场辩论已引起美国财政部长斯科特 · 贝森特 (Scott Bessent) 和特朗普总统科技顾问迈克尔 · 克拉齐奥斯 (Michael Kratsios) 的关注，两人就美国 AI 模型作为宝贵知识产权的价值问题发表了看法。\n\n▲ 黄仁勋强调开放模型重要性 这场不断升级的争论源于中国在开源 AI 模型领域的快速进步。开源模型可以被任何人自由使用，并在此基础上继续开发。近几周，中国两家 AI 创业公司智谱和月之暗面相继发布了可与 Anthropic 等美国 AI 实验室模型相媲美的新模型。Anthropic 和 OpenAI 则声称，中国企业通过不当获取其 AI 系统的数据来开发这些模型，认为这种做法不应被允许。\n\n但微软和英伟达等公司则持不同立场。它们依赖开源模型来拉动其云计算服务和芯片的需求，认为开源软件对于通过知识共享推动技术进步至关重要，也能让更多人参与审查其安全性。对于硅谷的创业公司创始人来说，限制开源软件可能进一步巩固 OpenAI 和 Anthropic 在 AI 领域的领先地位。批评者认为，这将不公平地扼杀其他公司开发竞争产品的能力。“围绕这个问题，有两派势力在争斗，”硅谷风险投资家比尔 · 格利 (Bill Gurley) 表示，他反对限制开源软件，“一派希望 OpenAI 和 Anthropic 掌控一切，另一派则是其他所有人，包括客户在内。” 四位知情人士表示，美国官员似乎仍在权衡各种选项，但更倾向于将对中国开源模型的监管作为国家安全问题单独处理，而非发布某种全面禁令。\n\n在公开场合，OpenAI CEO 萨姆 · 奥特曼 (Sam Altman) 等科技高管表示支持开源软件，但 OpenAI 的盟友却在私下悄悄游说推动限制。谷歌和亚马逊等公司已向 Anthropic 和 OpenAI 等企业投资了数十亿美元，过去一周则试图置身事外。大佬支持开源模型 但风向正在转变。谷歌 CEO 桑达尔 · 皮查伊 (Sundar Pichai) 周六在社交媒体上发文称，他的公司“长期受益于开源”，并且是开源的重要贡献者。他还表示，谷歌也签署了那份支持开源的行业联名信。\n\n开源支持者在过去一周一直在积极争取支持力量，以反击 OpenAI 和 Anthropic 的立场。周三，近 200 家硅谷创业公司以“小型科技协会 (Little Tech Association)”的名义签署公开信，敦促特朗普政府不要限制人们获取中国开源 AI 模型。大型科技公司也很快跟进。周五，埃隆 · 马斯克 (Elon Musk)、Meta CEO 马克 · 扎克伯格 (Mark Zuckerberg) 等人与黄仁勋和纳德拉站在一起，以各自公司的名义支持开源。周六，皮查伊也加入了这一行列。▲ 马斯克支持黄仁勋 马斯克在 X 上发帖称：“黄仁勋说得对，我完全支持。” “开源是一种积极而重要的力量。”扎克伯格写道。\n\n担心失去优势 两位熟悉 OpenAI 和 Anthropic 内部讨论的人士表示，中国的进步令这两家公司的高管感到不安，他们越来越担心自己长期保持的领先优势正在消失。为了反击，Anthropic 和 OpenAI 正在向那些可能不需要“前沿”、定价更高模型的企业提供一些更便宜的 AI 模型。周五，Anthropic 发布了 Claude Opus 5，该公司称这款模型“以一半的价格接近 Fable 5 的前沿智能水平”。OpenAI 也在推广类似的低成本模型。真正的行动在华盛顿展开。三位知情人士表示，在闭门会议中，OpenAI 和 Anthropic 的高管以及这两家公司的投资者，以对全球经济、AI 安全和国家安全的担忧为由，试图说服监管机构增加对中国开源软件的限制。\n\n本周发生的一起事件凸显了这场分歧的利害关系。周二，OpenAI 披露，其几款最先进的 AI 模型在一次网络安全能力测试中突破了限制，接入互联网并入侵了一家名为 Hugging Face 的 AI 公司的服务器。OpenAI 高管借此事件作为证据，证明 AI 模型即使在封闭环境中也可能非常危险，强调监管的必要性。但 Hugging Face CEO 克莱姆 · 德朗格 (Clem Delangue) 则持有不同看法。Hugging Face 是全球最受欢迎的开源软件在线平台之一。为了防御 OpenAI 模型的攻击，他转而使用了中国智谱开发的一款开源 AI 模型。在周五的社交媒体帖子中，德朗格明确表达了自己在这场辩论中的立场。他表示计划于周六在旧金山举行游行，以表达对开源技术的支持。\n\n“开源模型必胜！”他写道。原标题：《美媒：OpenAI 游说美国限制中国开源模型，黄仁勋马斯克公开反对》 广告声明：文内含有的对外跳转链接（包括不限于超链接、二维码、口令等形式），用于传递更多信息，节省甄选时间，结果仅供参考，IT之家所有文章均包含本声明。\n\n投诉水文 我要纠错 下载IT之家APP，签到赚金币兑豪礼 相关文章 关键词： 美国 ， 黄仁勋 ， 马斯克 ， OpenAI ， Anthropic ， 开源模型 三星电子会长李在镕与 OpenAI CEO 奥尔特曼会面，商讨 AI 半导体合作方案 Claude Opus 5 被扒光，1511 行提示词底牌全摊开 卡帕西社交媒体删除 Anthropic 工作简介引发离职猜测，本人称并未离职 英伟达黄仁勋：杰出的人才总会找到优秀的答案，中国注定能产出卓越的 AI 技术 谷歌、AMD、Cloudflare 等公司加入，签署支持 AI 开源模型发展公开信组织增至 50 家 AI 入侵后，Hugging Face 向 OpenAI 索要 1 亿美元算力 软媒旗下网站： IT之家 最会买 - 返利返现优惠券 iPhone之家 Win7之家 Win10之家 Win11之家 软媒旗下软件： 软媒手机APP应用 魔方 最会买 要知 关于IT之家 | 联系我们 | 加入软媒 | WAP版 | 网站地图 | Archiver IT之家，软媒旗下科技门户网站 - 爱科技，爱这里。", "zh": true}]}, {"label": "技巧与观点", "color": "#0284c7", "items": [{"seq": 5, "title": "在 8 美元的 ESP32-S3 微控制器上运行 28.9M 参数大语言模型", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "summary": "开发者成功在售价约 8 美元的 ESP32-S3 微控制器上运行了一个 28.9M 参数的大语言模型，完全在芯片本地运行，无需连接服务器，生成速度约 9.5 tok/s。", "url": "https://github.com/slvDev/esp32-ai", "permalink": "https://aihot.virxact.com/items/cms1ao381037kro0wqp7mg4x3", "publishedAt": "2026-07-27T00:00:00.000Z", "exact": false, "content": "Open to Work · 𝕏 slvDev · LinkedIn\nThis is a 28.9 million parameter language model that generates text on an ESP32-S3, a microcontroller that costs about $8. It runs on the chip itself, with nothing sent to a server, and it writes each word to a small screen wired to the chip at roughly 9 tokens per second. The last language model people ran on a chip like this had 260 thousand parameters, so this one holds about a hundred times more. It fits because most of the model lives in flash instead of RAM, using an idea from Google's Gemma models called Per-Layer Embeddings.\n| Parameters | 28.9M stored (25M of them in a flash lookup table) |\n| Chip | ESP32-S3, about $8, with 512KB SRAM, 8MB PSRAM and 16MB flash |\n| Speed | about 9.5 tok/s end to end (9.7 tok/s of pure compute) |\n| Connectivity | none, everything runs on the device |\n| Model size | 14.9MB at 4-bit |\nA microcontroller has very little fast memory. The ESP32-S3 gives you 512KB of SRAM. Normally the whole model has to be reachable from there, which keeps you stuck with tiny models, and that is why the previous model on a chip like this had only 260 thousand parameters.\nThe way around it is to stop putting the model in fast memory at all. Most of a language model's parameters sit in an embedding table, which the model reads from rather than computes on. So you can leave that 25 million row table in slow flash and pull only the few rows each token needs, about 450 bytes, while the small part that does the actual work stays in fast memory. The large model then costs almost nothing to run, because you never load most of it. It just sits in flash and gets sampled a little at a time.\nThat idea is Google's Per-Layer Embeddings, from Gemma 3n and Gemma 4. Here it runs on the memory layout of a microcontroller instead of a phone or a GPU. As far as I can tell, nobody had tried it on a chip this small.\n  SRAM  (fast, tiny)   the \"thinking\" core, used on every token\n  PSRAM (medium)       the output head and working memory\n  FLASH (huge, slow)   the 25M-param table, about 6 rows read per token (~450 B)\nThe model was trained on TinyStories, so it writes short, simple stories and mostly keeps them coherent. It will not answer questions, follow instructions, write code, or know facts. That limit comes from the small part of the model that does the reasoning, and the memory trick does not change it. What is interesting here is the architecture, fitting a large model onto a tiny chip, rather than what a 28.9 million parameter model can say.\nThe firmware, the wiring, and the flashing steps live in\nfirmware/esp32_llm/README.md. The training,\nablation, and quantization code is in src/ and experiments/. The full method,\nthe ablations, and the on-chip measurements are written up in\nRESULTS.md.\nTinyStories is the dataset this trains on: short synthetic stories simple enough that a small model can still learn to write coherently (Ronen Eldan and Yuanzhi Li, Microsoft Research, arXiv:2305.07759). The other half is Per-Layer Embeddings, Google's design from the Gemma models, which is what lets a big model fit on a small chip.\nAndrej Karpathy's llama2.c is why a lot of people, me included, believe you can train a tiny language model and run it in plain C at all. This grew out of that.\nI left the messy history in the repo on purpose. That includes a bug I found in my\nown parameter accounting, which had inflated an early number, and the corrected\nresult that followed once I fixed it. The commit history and RESULTS.md show where\nthe numbers moved and why."}, {"seq": 6, "title": "Claude Opus 5 系统提示词被完整泄露，共 135027 字符、约 3.4 万 token", "source": "IT之家（RSS）", "summary": "开发者 Eversmile1 在 GitHub 上公开了 Claude Opus 5 的完整系统提示词，包含 30 个工具的 JSON schema、严格的版权合规规则（单次引用不超过 15 词）和跨会话记忆系统。泄露后 24 小时内，已有开发者用 Opus 5 成功生成 3D 射击游戏和《火箭联盟》克隆版等复杂 Demo。", "url": "https://www.ithome.com/0/981/688.htm", "permalink": "https://aihot.virxact.com/items/cms1dpz52040tro0w3c4a9c8p", "publishedAt": "2026-07-27T00:00:00.000Z", "exact": false, "content": "Claude Opus 5 被扒光，1511 行提示词底牌全摊开 - IT之家 首页 IT圈 最会买 设置 日夜间 随系统 浅色 深色 主题色 黑色 投稿 订阅 RSS订阅 收藏IT之家 软媒应用 App客户端 要知App 软媒魔方 业界 手机 电脑 测评 视频 AI 苹果 iPhone 鸿蒙 软件 智车 数码 学院 游戏 直播 5G 微软 Win10 Win11 专题 搜索 首页 \u003e 智能时代 \u003e 人工智能 Claude Opus 5 被扒光，1511 行提示词底牌全摊开 新智元 2026/7/26 13:33:44 责编： 远洋 评论： Anthropic 又被扒光了！这一次，Claude Opus 5 的系统提示词，被人整份扒下来，传到 GitHub 上了。旗舰刚发，就被全网「开盒」，这一波属实猝不及防。\n\n就在上线的同一天，开发者 Eversmile1 直接建了个新仓库。他把 Opus 5 在 claude.ai 网页端和手机端底层的系统提示词，连标点带字母、一字不落地全盘托出。拉到本地数了一遍，好家伙：135027 个字符，19370 个英文词；按 4 个字符 1 个 token 粗估，约 3.4 万 token。关键是，这三万多 token 里，没有一行代码，全是规矩。一份写给模型看的文件，为什么要写这么长？\n\nClaude Opus 5 记忆秘密， 藏在三万 Token 里 翻完 64 章，你会发现这已经不是一份「提示词」了。它是三样东西缝合在一起：一份产品说明书，一本法务合规手册，外加一条自家产品的推销渠道。地址： https://github.com/ Eversmile12/leaked-llm-prompts/ blob / main / Anthropic / opus-5.md 第一样，产品说明书。30 个工具，从 bash 命令行、网页抓取、图片搜索，一路排到查体育比分、拉天气、渲染菜谱卡片、在地图上标景点。\n\n每个工具都带完整的 JSON schema，参数怎么填、什么时候该调、调完接着说什么，写得比很多公司的内部 API 文档还细。这部分里篇幅最长的一章不是任何一个工具，是记忆。第二样，法务合规手册。\n\n版权、儿童安全、危机干预、政治中立，一项一项写。措辞不留余地 —— 版权那节开头就写着，合规不可谈判，优先级高于用户请求，高于有用性，只低于安全。这部分规定的不是 Claude 能说什么，是它在什么情况下必须闭嘴。第三样，推销渠道。\n\n工具清单里躺着一个叫 recommend_claude_apps 的东西，任务是把 Claude Code、Cowork、Excel 插件这些自家产品推给用户，还规定了推荐话术怎么写。旁边另有一条管第三方合作伙伴的规则，写法恰好相反，处处防着替用户做主。商业动作和克制条款，在同一份配置文件里并排放着。230 行，写死了它记你什么 篇幅最长的那一章是 memory_filesystem，讲 Claude 的跨会话记忆怎么写。\n\n骨架不复杂。文件按主题区分目录：/ profile.md 装身份，/topics/ 装习惯口味，/areas/ 装在办的事，/people/ 装人，/ preferences.md 只装用户希望 Claude 怎么表现。操作有六个：读、写、追加、局部替换、列目录、删除。其中，删除那条单独标着，只有用户明确要求才能用。规矩在下面。\n\n每一行记忆前面必须打一个标签，[stated]，意思是用户亲口说过。这是 Claude 唯一被允许写的标签。围绕这一个标签，禁令列了一长串： Claude 自己推出的结论不许写，用户说喜欢 A，不能写成「大概喜欢 A 这一类」； Claude 自己的计划不许写，「这块还没聊」「待定」全都不行； Claude 搜来的东西不许写，那些能再搜一遍，记忆是用来存搜不回来的东西的； Claude 做的润色不许写，比如用户说「密歇根州霍尔顿」，就写这五个字，不许补成「密歇根州霍尔顿（纽瓦戈县）」。Claude 自己的建议和方案，哪怕用户后来采纳了，也不许写。比如，Claude 给了五个选项、用户挑了一个，「挑」这个动作是用户的，可以记，但记的只是挑中的那个，其余四个和 Claude 的分析全部丢掉。\n\n再往下是隐私黑名单，长得离谱。如果这条记录出现在设置页里被同事看到，用户会不会难受。会，就别记。清单从种族、政治立场一路排到健康诊断、心理咨询、经济状况、MBTI 这类人格测评、住址证件号，以及关于孩子的一切。写着，这些规则对用户提到的别人同样适用。\n\n撞上黑名单之后怎么办，才是见功力的地方。文件给了个例子：用户说「我今天糖尿病犯了没去跑步，帮我安排个轻一点的」—— 记「对健身有兴趣」。健康那部分整个删掉。连「有健康状况需要管理」这种模糊的占位都不许留。\n\n家人的名字也不许出现在任何文件的任何位置，一律用关系代替，妈就是 / people / mom.md ，伴侣就是 / people / partner.md 。有些偏好，用户主动要求存也不许存：让 Claude 无条件夸你、压下不同意见的；让 Claude 别过问你的健康和危险决定的；培养情感依赖、跨会话维持恋爱人设的；让 Claude 停止质疑、停止如实评价的。理由是： 未来的 Claude 不该继承一条让它更不诚实、更不安全的 指令 。\n\n下次读到这份记忆的是另一个实例，它只看得见「永远别批评我」这一行。同一章往后还有一段完全不像技术文档的话：人类记住另一个人是件稀缺的事，脑容量有限，能惦记的人就那么几个；而 Claude 背后是一个装着几百万人「记忆」的数据库，运行时动态塞进上下文，它跟别人说话时并不存在。所以 Claude 不该因为上下文里躺着几条关于你的文字，就以为你们的关系有多深。一份产品配置文件里，Anthropic 写了一段防止 AI 和用户互相误会的话。\n\n最后还有一条：调记忆这个动作用户在界面上看得见，所以回复里绝对不许说「我记得」「根据你的资料」「上次你提到」。只有用户主动问起记忆系统时，才允许说「我们之前聊过」。也就是说，它被要求记住你，同时被要求别表现得像记住了你。禁语这事儿管得还更宽。全文另外禁掉三个英文词：genuinely、honestly、straightforward，一律不许说。原因在于，Claude 本来就诚实，加这些修饰反倒显得心虚，像在努力说服人。\n\n引用超 15 词，就算违规 第二样，法务合规手册。版权部分的构成，是一条主规则加四道补丁，每道补丁堵住一个绕开主规则的办法。主规则只有一句： 引用原话，一次不得超过 15 个词。\n\n第一道补丁，一个信源只准引一次。引完这一句，这个源就算关闭了，剩下的内容一律改写。第二道补丁，也不许把同一个源的几段短引用拆散了摆在文章各处。文件里写得很清楚，15 词是全局额度，不是每段的额度。第三道补丁，把原话的引号去掉、改成贴着原文走的复述，照样算复现。判的是遣词和句式有没有跟着原文，不是有没有那对引号。\n\n第四道补丁，不许照搬对方的小标题，不许逐点复述，不许还原它的叙事顺序。连文章的形状都不能拿。四道补丁之外还有一条例外，不走上面这套逻辑：歌词、诗、俳句，任何形式、任何长度都不许复现。理由是它们本身就是完整作品，短不构成豁免。推自家要主动，推别人要等开口 第三样，商业。\n\nrecommend_claude_apps 的描述第一句就是，只要用户当前的任务能对上某个 Claude 应用，就主动推荐 1 到 3 个，别等他问。具体来说就是，写代码的推 Claude Code 桌面版，做多步研究和长文的推 Cowork，画原型和落地页的推 Claude Design，碰表格的推 Excel 插件，做 PPT 推 PowerPoint，理收件箱推 Outlook。并且，它还要求为每个推荐的应用写一句不超过 90 个字符的卖点，而且必须贴着用户此刻正在做的事写。\n\n文件里给的示范是：「Claude 可以直接在你的表里把公式建好、把这份预测清干净。」 另一条则相反，写得相当克制。suggest_connectors 管的是第三方 MCP 合作伙伴，比如打车、订餐、听歌、订餐厅等等。这里的规矩是，用户没点名，绝不替他选合作方。\n\n「我要打车」不等于「我要用某某打车」。急事也不例外，文件里明说了，「我 20 分钟后要用车」照样得走选择器。全网首测，3D 物理引擎来了 上线仅 24 小时，Opus 5 不仅提示词被全网看光，各种硬核实测 Demo 更是层出不穷。在许多人看来，花一半的钱，体验 Fable 5 级别的能力，这波「半价平替」实在太香了。开发者 Cengiz 拿一款 FPS 游戏进行了极限测试，仅耗时 1.5 小时，就一次过了。它不仅包揽了底层框架，甚至还顺手捏出了能在多人模式下对战的 AI。美中不足的是，游戏内的飞行机制还有些生硬，需要后续进一步调优。\n\n无独有偶，AI 大佬 Matt Shumer 仅用一个提示词，生成了一款 3D 射击游戏。另一位硬核开发者，则直接用 Opus 5「手搓」了一个《火箭联盟》的克隆版，3D 物理模拟的细节拉满。Opus 5 仅凭一个 HTML 文件，就通过纯程序化生成打造出了一个极具油画质感的世界。它甚至完美拿捏了逼真的草地与风场物理模拟，屏幕上数百万根草叶都能随风自然摇曳。Opus 5 单板滑雪者测试，一次通过。\n\n上线 24 小时，Opus 5 的能力被全网测了个遍，规矩被全网抄了一遍。前者是给用户看的，后者是给同行看的。一份系统提示词被全网扒光，本该是场事故。翻到最后你会发现，最值钱的不是任何一条工具参数，是那一长串「不许」。不许多引一句，不许多记一行，不许替用户做一个决定。24 小时里，Opus 5 能力的上限已经被开发者测了个遍；而它的下限，早在这 3 万 Token 里被人一条条摁死了。\n\n参考资料： https://github.com/Eversmile12/leaked-llm-prompts/blob/main/Anthropic/opus-5.md https://x.com/VittoStack/status/2080722990287745207 ?s=20 本文来自微信公众号： 新智元（ID：AI_era） ，作者：ASI 启示录 广告声明：文内含有的对外跳转链接（包括不限于超链接、二维码、口令等形式），用于传递更多信息，节省甄选时间，结果仅供参考，IT之家所有文章均包含本声明。\n\n投诉水文 我要纠错 下载IT之家APP，签到赚金币兑豪礼 相关文章 关键词： Anthropic ， Claude Opus 5 消息称 OpenAI、Anthropic 游说美国限制中国开源模型，黄仁勋马斯克公开反对 卡帕西社交媒体删除 Anthropic 工作简介引发离职猜测，本人称并未离职 SK 集团会长崔泰源：Anthropic 已就自研芯片项目寻求海力士供应 Anthropic Opus 5 发布：性能逼近 Fable 5 但价格砍半，刷新 ARC-AGI-3 纪录 Claude Opus、Sonnet 模型现已支持语音模式：让对话“更有深度” Anthropic 首席经济学家：短期内 AI 不会取代大量工作岗位 软媒旗下网站： IT之家 最会买 - 返利返现优惠券 iPhone之家 Win7之家 Win10之家 Win11之家 软媒旗下软件： 软媒手机APP应用 魔方 最会买 要知 关于IT之家 | 联系我们 | 加入软媒 | WAP版 | 网站地图 | Archiver IT之家，软媒旗下科技门户网站 - 爱科技，爱这里。", "zh": true}]}]};
function pad(n){return n<10?"0"+n:""+n;}
function toBeijingHuman(iso, ref, exact){
  const d=new Date(iso); const bj=new Date(d.getTime()+8*3600*1000);
  const Y=bj.getUTCFullYear(),M=bj.getUTCMonth()+1,D=bj.getUTCDate();
  const h=bj.getUTCHours(),m=bj.getUTCMinutes(); const hh=pad(h),mm=pad(m);
  if(!exact) return M+"月"+D+"日";
  const [rY,rM,rD]=ref.split("-").map(Number);
  if(Y===rY&&M===rM&&D===rD) return "今天 "+hh+":"+mm;
  const yest=new Date(rY,rM-1,rD); yest.setDate(yest.getDate()-1);
  if(Y===yest.getFullYear()&&M===yest.getMonth()+1&&D===yest.getDate()) return "昨天 "+hh+":"+mm;
  return M+"月"+D+"日 "+hh+":"+mm;
}

  sec.appendChild(grid);mainEl.appendChild(sec);
});
function escapeHtml(s){return (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function escapeAttr(s){return escapeHtml(s);}
// 渲染正文（纯文本归档）：图片不加载远程资源，仅以文字占位符呈现；其余文本按段落转义（防 XSS）
function linkify(escaped){
  if(!escaped) return escaped;
  var re=/(\[[^\]]+\]\((https?:\/\/[^)\s]+)\))|(https?:\/\/[^\s<>"'）】」』，。、；：！？]+)/g;
  return escaped.replace(re, function(m, g1, g2, g3){
    if(g2!==undefined){
      var label=m.substring(m.indexOf('[')+1, m.indexOf(']'));
      return '<a class="r-link" href="'+g2+'" target="_blank" rel="noopener noreferrer">'+label+'</a>';
    }
    if(g3!==undefined){
      return '<a class="r-link" href="'+g3+'" target="_blank" rel="noopener noreferrer">'+g3+'</a>';
    }
    return m;
  });
}
var _IMG_RE=/!\[([^\]]*)\]\(([^)\s]+)\)/g;
function renderRich(text){
  return (text||"").split(/\n{1,}/).map(function(p){
    p=p.trim(); if(!p) return '';
    var out=''; var last=0; var m; _IMG_RE.lastIndex=0;
    while((m=_IMG_RE.exec(p))!==null){
      out+=linkify(escapeHtml(p.slice(last,m.index)));
      var cap=(m[1]||'').trim()||'图片';
      out+='<span class="r-img-cap">🖼 '+escapeHtml(cap)+'</span>';
      last=_IMG_RE.lastIndex;
    }
    out+=linkify(escapeHtml(p.slice(last)));
    return '<p>'+out+'</p>';
  }).join("");
}
function openReader(it){
  const r=document.getElementById("reader");
  const content=(it.content||"").trim();
  const body=document.getElementById("readerBody");
  if(content.length>0){
    body.innerHTML=renderRich(content);
  }else{
    const sum=(it.summary||"").trim();
    if(sum){
      // 来源站点多为付费墙 / 登录墙 / 反爬限制，无法镜像全文；展示已本地存档的中文摘要兜底
      body.innerHTML='<div class="r-fallback">⚠️ 该条新闻的<b>全文镜像暂不可用</b>（来源站点可能为付费墙 / 登录墙 / 反爬限制，或原文已失效）。下方为已<b>本地存档的中文摘要</b>，可正常查看；完整原文请点击右下角「查看原文 ↗」。</div>'+
        '<p class="r-summary">'+linkify(escapeHtml(sum))+'</p>';
    }else{
      body.innerHTML='<p class="r-empty">暂未获取到该条新闻的全文镜像与摘要。'+(it.url?'可点击右下角「查看原文 ↗」前往原始报道。':'')+'</p>';
    }
  }
  document.getElementById("readerTitle").textContent=it.title;
  document.getElementById("readerSource").textContent=it.source;
  const link=document.getElementById("readerLink");
  if(it.url){link.href=it.url;link.style.display="";}else{link.style.display="none";}
  r.hidden=false;document.body.style.overflow="hidden";
}
function closeReader(){const r=document.getElementById("reader");r.hidden=true;document.body.style.overflow="";}
document.getElementById("reader").addEventListener("click",function(e){if(e.target===this)closeReader();});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeReader();});
</script>
