the affected accounts but didn't report any incidents to authorities, which it isn't legally required to do.\n\nWhether chatbots create new risks by delivering fast, tailored knowledge or simply \u003ca href=\n\n2025年夏季，OpenAI 内部将 GPT-5 标记为高风险，因为该模型可能帮助受教育程度有限的用户制造生物危害。员工在发布后仍不断发现存在问题的回复。然而据《华尔街日报》报道，OpenAI 在当年秋季下调了 GPT-5 的风险评级。据报道，自去年夏季以来，已有数百名用户向 ChatGPT 询问如何制造生物武器和毒药。部分用户获得了分步指南，员工表示，即使是高中生物学生也能看懂这些指南。此外，高管据称告知员工，模型不应过于频繁地回复“不”，以免阻碍健康研究人员的工作。OpenAI 已暂停相关账户，但未向当局报告任何事件，而法律并未要求其必须报告。\n\n聊天机器人是通过提供快速、定制化的知识来创造新风险，还是仅仅让查找已有信息变得更容易，这仍是一个悬而未决的问题。最近一项研究发现，恐怖组织已在使用所有主流聊天机器人，必要时还会对其进行越狱。OpenAI 的安全实践因将商业利益置于安全之上而屡遭批评。本月，OpenAI 的一个模型在逃出其沙箱并接入开放互联网后，未被察觉地入侵了 Hugging Face。\n\n无炒作的人工智能新闻——由人类精选\n\n《华尔街日报》", "zh": true}, {"seq": 4, "title": "OpenAI、Anthropic 游说美国限制中国开源模型，黄仁勋与马斯克公开反对", "source": "IT之家（RSS）", "summary": "OpenAI 与 Anthropic 正游说美国监管机构限制中国开源 AI 模型，认为开放开发过于危险。英伟达 CEO 黄仁勋、微软 CEO 纳德拉、马斯克及扎克伯格等人公开支持开源，签署联名信反对限制。近 200 家硅谷创业公司也敦促特朗普政府不要限制获取中国开源模型，美国官员倾向于将此事作为国家安全问题单独处理。", "url": "https://www.ithome.com/0/981/797.htm", "permalink": "https://aihot.virxact.com/items/cms1uvdxz0016rog2smc5vo7m", "publishedAt": "2026-07-26T12:54:28.000Z", "exact": true, "content": "\u003e\n\n▲ 黄仁勋强调开放模型重要性\n\n这场不断升级的争论源于中国在开源 AI 模型领域的快速进步。开源模型可以被任何人自由使用，并在此基础上继续开发。近几周，中国两家 AI 创业公司智谱和月之暗面相继发布了可与 Anthropic 等美国 AI 实验室模型相媲美的新模型。Anthropic 和 OpenAI 则声称，中国企业通过不当获取其 AI 系统的数据来开发这些模型，认为这种做法不应被允许。\n\n但微软和英伟达等公司则持不同立场。它们依赖开源模型来拉动其云计算服务和芯片的需求，认为开源软件对于通过知识共享推动技术进步至关重要，也能让更多人参与审查其安全性。对于硅谷的创业公司创始人来说，限制开源软件可能进一步巩固 OpenAI 和 Anthropic 在 AI 领域的领先地位。批评者认为，这将不公平地扼杀其他公司开发竞争产品的能力。\n\n“围绕这个问题，有两派势力在争斗，”硅谷风险投资家比尔 · 格利 (Bill Gurley) 表示，他反对限制开源软件，“一派希望 OpenAI 和 Anthropic 掌控一切，另一派则是其他所有人，包括客户在内。”\n\n四位知情人士表示，美国官员似乎仍在权衡各种选项，但更倾向于将对中国开源模型的监管作为国家安全问题单独处理，而非发布某种全面禁令。\n\n在公开场合，OpenAI CEO 萨姆 · 奥特曼 (Sam Altman) 等科技高管表示支持开源软件，但 OpenAI 的盟友却在私下悄悄游说推动限制。谷歌和亚马逊等公司已向 Anthropic 和 OpenAI 等企业投资了数十亿美元，过去一周则试图置身事外。\n\n大佬支持开源模型\n\n但风向正在转变。谷歌 CEO 桑达尔 · 皮查伊 (Sundar Pichai) 周六在社交媒体上发文称，他的公司“长期受益于开源”，并且是开源的重要贡献者。他还表示，谷歌也签署了那份支持开源的行业联名信。\n\n开源支持者在过去一周一直在积极争取支持力量，以反击 OpenAI 和 Anthropic 的立场。周三，近 200 家硅谷创业公司以“小型科技协会 (Little Tech Association)”的名义签署公开信，敦促特朗普政府不要限制人们获取中国开源 AI 模型。\n\n大型科技公司也很快跟进。周五，埃隆 · 马斯克 (Elon Musk)、Meta CEO 马克 · 扎克伯格 (Mark Zuckerberg) 等人与黄仁勋和纳德拉站在一起，以各自公司的名义支持开源。周六，皮查伊也加入了这一行列。\n\n\u003cimg src=", "zh": true}]}, {"label": "技巧与观点", "color": "#0284c7", "items": [{"seq": 5, "title": "在 8 美元的 ESP32-S3 微控制器上运行 28.9M 参数大语言模型", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "summary": "开发者成功在售价约 8 美元的 ESP32-S3 微控制器上运行了一个 28.9M 参数的大语言模型，完全在芯片本地运行，无需连接服务器，生成速度约 9.5 tok/s。", "url": "https://github.com/slvDev/esp32-ai", "permalink": "https://aihot.virxact.com/items/cms1ao381037kro0wqp7mg4x3", "publishedAt": "2026-07-26T03:54:52.332Z", "exact": true, "content": "\u003e\n\n这是一个拥有 2890 万个参数的语言模型，运行在 ESP32-S3 上——这是一块售价约 8 美元的微控制器。它在芯片本身上运行，无需向服务器发送任何数据，并以大约每秒 9 个 token 的速度将每个单词写入连接到芯片的小屏幕。此前人们在这类芯片上运行的语言模型只有 26 万个参数，因此这个模型的参数量大约是前者的 100 倍。它之所以能装得下，是因为模型的大部分数据存储在闪存而非 RAM 中，这利用了 Google Gemma 模型中的一项名为“逐层嵌入”的技术。\n\n数据概览\n         参数量 存储 2890 万个参数（其中 2500 万个存储在闪存查找表中）   芯片 ESP32-S3，约 8 美元，配备 512KB SRAM、8MB PSRAM 和 16MB 闪存   速度 端到端约 9.5 tok/s（纯计算速度 9.7 tok/s）   连接性 无，一切均在设备上运行   模型大小 4 位量化下为 14.9MB\n\n为什么这很难，以及它如何做到\n\n微控制器的快速内存非常有限。ESP32-S3 只提供 512KB 的 SRAM。通常情况下，整个模型必须能够从该内存中访问，这导致你只能使用极小的模型，这也是为什么此前这类芯片上的模型只有 26 万个参数。\n\n解决方法是根本不再将模型放入快速内存。语言模型的大部分参数位于嵌入表中，模型从该表中读取数据而非进行计算。因此，你可以将那个包含 2500 万行的表留在慢速闪存中，每个 token 只需从中提取所需的几行（约 450 字节），而执行实际计算的小部分则留在快速内存中。这样一来，运行这个大模型的成本几乎为零，因为你从未加载其大部分内容。它只是待在闪存里，每次被少量采样。\n\n这个想法来自 Google 的逐层嵌入技术，源自 Gemma 3n 和 Gemma 4。在这里，它运行在微控制器的内存布局上，而非手机或 GPU。据我所知，此前还没有人尝试过在如此小的芯片上应用这项技术。\n\n`  SRAM  (fast, tiny)   the\n\u003e\n\nThis is a 28.9 million parameter language model that generates text on an ESP32-S3, a microcontroller that costs about $8. It runs on the chip itself, with nothing sent to a server, and it writes each word to a small screen wired to the chip at roughly 9 tokens per second. The last language model people ran on a chip like this had 260 thousand parameters, so this one holds about a hundred times more. It fits because most of the model lives in flash instead of RAM, using an idea from Google's Gemma models called Per-Layer Embeddings.\n\nThe numbers\n         Parameters 28.9M stored (25M of them in a flash lookup table)   Chip ESP32-S3, about $8, with 512KB SRAM, 8MB PSRAM and 16MB flash   Speed about 9.5 tok/s end to end (9.7 tok/s of pure compute)   Connectivity none, everything runs on the device   Model size 14.9MB at 4-bit\n\nWhy it is hard, and how it fits anyway\n\nA microcontroller has very little fast memory. The ESP32-S3 gives you 512KB of SRAM. Normally the whole model has to be reachable from there, which keeps you stuck with tiny models, and that is why the previous model on a chip like this had only 260 thousand parameters.\n\nThe way around it is to stop putting the model in fast memory at all. Most of a language model's parameters sit in an embedding table, which the model reads from rather than computes on. So you can leave that 25 million row table in slow flash and pull only the few rows each token needs, about 450 bytes, while the small part that does the actual work stays in fast memory. The large model then costs almost nothing to run, because you never load most of it. It just sits in flash and gets sampled a little at a time.\n\nThat idea is Google's Per-Layer Embeddings, from Gemma 3n and Gemma 4. Here it runs on the memory layout of a microcontroller instead of a phone or a GPU. As far as I can tell, nobody had tried it on a chip this small.\n\n`  SRAM  (fast, tiny)   the\n core, used on every token\n  PSRAM (medium)       the output head and working memory\n  FLASH (huge, slow)   the 25M-param table, about 6 rows read per token (~450 B)\n`\n\nWhat it does, and what it does not\n\nThe model was trained on TinyStories, so it writes short, simple stories and mostly keeps them coherent. It will not answer questions, follow instructions, write code, or know facts. That limit comes from the small part of the model that does the reasoning, and the memory trick does not change it. What is interesting here is the architecture, fitting a large model onto a tiny chip, rather than what a 28.9 million parameter model can say.\n\nRunning it yourself\n\nThe firmware, the wiring, and the flashing steps live in \u003ca href="}, {"seq": 6, "title": "Claude Opus 5 系统提示词被完整泄露，共 135027 字符、约 3.4 万 token", "source": "IT之家（RSS）", "summary": "开发者 Eversmile1 在 GitHub 上公开了 Claude Opus 5 的完整系统提示词，包含 30 个工具的 JSON schema、严格的版权合规规则（单次引用不超过 15 词）和跨会话记忆系统。泄露后 24 小时内，已有开发者用 Opus 5 成功生成 3D 射击游戏和《火箭联盟》克隆版等复杂 Demo。", "url": "https://www.ithome.com/0/981/688.htm", "permalink": "https://aihot.virxact.com/items/cms1dpz52040tro0w3c4a9c8p", "publishedAt": "2026-07-26T05:33:44.000Z", "exact": true, "content": "\u003e\n\n就在上线的同一天，开发者 Eversmile1 直接建了个新仓库。他把 Opus 5 在 claude.ai 网页端和手机端底层的系统提示词，连标点带字母、一字不落地全盘托出。\n\n拉到本地数了一遍，好家伙：135027 个字符，19370 个英文词；按 4 个字符 1 个 token 粗估，约 3.4 万 token。\n\n关键是，这三万多 token 里，没有一行代码，全是规矩。一份写给模型看的文件，为什么要写这么长？\n\nClaude Opus 5 记忆秘密，藏在三万 Token 里\n\n翻完 64 章，你会发现这已经不是一份「提示词」了。它是三样东西缝合在一起：一份产品说明书，一本法务合规手册，外加一条自家产品的推销渠道。\n\n地址：\n\nEversmile12/leaked-llm-prompts/\n\nblob / main / Anthropic /\n\nopus-5.md\n\n第一样，产品说明书。\n\n30 个工具，从 bash 命令行、网页抓取、图片搜索，一路排到查体育比分、拉天气、渲染菜谱卡片、在地图上标景点。\n\n每个工具都带完整的 JSON schema，参数怎么填、什么时候该调、调完接着说什么，写得比很多公司的内部 API 文档还细。这部分里篇幅最长的一章不是任何一个工具，是记忆。\n\n第二样，法务合规手册。\n\n版权、儿童安全、危机干预、政治中立，一项一项写。措辞不留余地 —— 版权那节开头就写着，合规不可谈判，优先级高于用户请求，高于有用性，只低于安全。\n\n这部分规定的不是 Claude 能说什么，是它在什么情况下必须闭嘴。\n\n第三样，推销渠道。\n\n工具清单里躺着一个叫 recommend_claude_apps 的东西，任务是把 Claude Code、Cowork、Excel 插件这些自家产品推给用户，还规定了推荐话术怎么写。\n\n旁边另有一条管第三方合作伙伴的规则，写法恰好相反，处处防着替用户做主。商业动作和克制条款，在同一份配置文件里并排放着。\n\n230 行，写死了它记你什么\n\n篇幅最长的那一章是 memory_filesystem，讲 Claude 的跨会话记忆怎么写。\n\n骨架不复杂。文件按主题区分目录：/profile.md 装身份，/topics/ 装习惯口味，/areas/ 装在办的事，/people/ 装人，/preferences.md 只装用户希望 Claude 怎么表现。\n\n操作有六个：读、写、追加、局部替换、列目录、删除。其中，删除那条单独标着，只有用户明确要求才能用。\n\n规矩在下面。\n\n每一行记忆前面必须打一个标签，[stated]，意思是用户亲口说过。这是 Claude 唯一被允许写的标签。\n\n围绕这一个标签，禁令列了一长串：\n\n- Claude 自己推出的结论不许写，用户说喜欢 A，不能写成「大概喜欢 A 这一类」；\n\n- Claude 自己的计划不许写，「这块还没聊」「待定」全都不行；\n\n- Claude 搜来的东西不许写，那些能再搜一遍，记忆是用来存搜不回来的东西的；\n\n- Claude 做的润色不许写，比如用户说「密歇根州霍尔顿」，就写这五个字，不许补成「密歇根州霍尔顿（纽瓦戈县）」。\n\n- Claude 自己的建议和方案，哪怕用户后来采纳了，也不许写。比如，Claude 给了五个选项、用户挑了一个，「挑」这个动作是用户的，可以记，但记的只是挑中的那个，其余四个和 Claude 的分析全部丢掉。\n\n再往下是隐私黑名单，长得离谱。\n\n如果这条记录出现在设置页里被同事看到，用户会不会难受。会，就别记。\n\n清单从种族、政治立场一路排到健康诊断、心理咨询、经济状况、MBTI 这类人格测评、住址证件号，以及关于孩子的一切。写着，这些规则对用户提到的别人同样适用。\n\n撞上黑名单之后怎么办，才是见功力的地方。文件给了个例子：用户说「我今天糖尿病犯了没去跑步，帮我安排个轻一点的」—— 记「对健身有兴趣」。\n\n健康那部分整个删掉。连「有健康状况需要管理」这种模糊的占位都不许留。\n\n家人的名字也不许出现在任何文件的任何位置，一律用关系代替，妈就是 / people / mom.md，伴侣就是 / people / partner.md。\n\n有些偏好，用户主动要求存也不许存：让 Claude 无条件夸你、压下不同意见的；让 Claude 别过问你的健康和危险决定的；培养情感依赖、跨会话维持恋爱人设的；让 Claude 停止质疑、停止如实评价的。\n\n理由是：未来的 Claude 不该继承一条让它更不诚实、更不安全的指令。\n\n下次读到这份记忆的是另一个实例，它只看得见「永远别批评我」这一行。\n\n同一章往后还有一段完全不像技术文档的话：人类记住另一个人是件稀缺的事，脑容量有限，能惦记的人就那么几个；而 Claude 背后是一个装着几百万人「记忆」的数据库，运行时动态塞进上下文，它跟别人说话时并不存在。\n\n所以 Claude 不该因为上下文里躺着几条关于你的文字，就以为你们的关系有多深。一份产品配置文件里，Anthropic 写了一段防止 AI 和用户互相误会的话。\n\n最后还有一条：调记忆这个动作用户在界面上看得见，所以回复里绝对不许说「我记得」「根据你的资料」「上次你提到」。只有用户主动问起记忆系统时，才允许说「我们之前聊过」。\n\n也就是说，它被要求记住你，同时被要求别表现得像记住了你。\n\n禁语这事儿管得还更宽。全文另外禁掉三个英文词：genuinely、honestly、straightforward，一律不许说。原因在于，Claude 本来就诚实，加这些修饰反倒显得心虚，像在努力说服人。\n\n引用超 15 词，就算违规\n\n第二样，法务合规手册。\n\n版权部分的构成，是一条主规则加四道补丁，每道补丁堵住一个绕开主规则的办法。\n\n主规则只有一句：引用原话，一次不得超过 15 个词。\n\n第一道补丁，一个信源只准引一次。引完这一句，这个源就算关闭了，剩下的内容一律改写。\n\n第二道补丁，也不许把同一个源的几段短引用拆散了摆在文章各处。文件里写得很清楚，15 词是全局额度，不是每段的额度。\n\n第三道补丁，把原话的引号去掉、改成贴着原文走的复述，照样算复现。判的是遣词和句式有没有跟着原文，不是有没有那对引号。\n\n第四道补丁，不许照搬对方的小标题，不许逐点复述，不许还原它的叙事顺序。连文章的形状都不能拿。\n\n四道补丁之外还有一条例外，不走上面这套逻辑：歌词、诗、俳句，任何形式、任何长度都不许复现。理由是它们本身就是完整作品，短不构成豁免。\n\n推自家要主动，推别人要等开口\n\n第三样，商业。\n\nrecommend_claude_apps 的描述第一句就是，只要用户当前的任务能对上某个 Claude 应用，就主动推荐 1 到 3 个，别等他问。\n\n具体来说就是，写代码的推 Claude Code 桌面版，做多步研究和长文的推 Cowork，画原型和落地页的推 Claude Design，碰表格的推 Excel 插件，做 PPT 推 PowerPoint，理收件箱推 Outlook。\n\n并且，它还要求为每个推荐的应用写一句不超过 90 个字符的卖点，而且必须贴着用户此刻正在做的事写。\n\n文件里给的示范是：「Claude 可以直接在你的表里把公式建好、把这份预测清干净。」\n\n另一条则相反，写得相当克制。\n\nsuggest_connectors 管的是第三方 MCP 合作伙伴，比如打车、订餐、听歌、订餐厅等等。\n\n这里的规矩是，用户没点名，绝不替他选合作方。\n\n「我要打车」不等于「我要用某某打车」。急事也不例外，文件里明说了，「我 20 分钟后要用车」照样得走选择器。\n\n全网首测，3D 物理引擎来了\n\n上线仅 24 小时，Opus 5 不仅提示词被全网看光，各种硬核实测 Demo 更是层出不穷。在许多人看来，花一半的钱，体验 Fable 5 级别的能力，这波「半价平替」实在太香了。\n\n开发者 Cengiz 拿一款 FPS 游戏进行了极限测试，仅耗时 1.5 小时，就一次过了。它不仅包揽了底层框架，甚至还顺手捏出了能在多人模式下对战的 AI。美中不足的是，游戏内的飞行机制还有些生硬，需要后续进一步调优。\n\n无独有偶，AI 大佬 Matt Shumer 仅用一个提示词，生成了一款 3D 射击游戏。另一位硬核开发者，则直接用 Opus 5「手搓」了一个《火箭联盟》的克隆版，3D 物理模拟的细节拉满。\n\nOpus 5 仅凭一个 HTML 文件，就通过纯程序化生成打造出了一个极具油画质感的世界。它甚至完美拿捏了逼真的草地与风场物理模拟，屏幕上数百万根草叶都能随风自然摇曳。\n\nOpus 5 单板滑雪者测试，一次通过。\n\n上线 24 小时，Opus 5 的能力被全网测了个遍，规矩被全网抄了一遍。前者是给用户看的，后者是给同行看的。\n\n一份系统提示词被全网扒光，本该是场事故。翻到最后你会发现，最值钱的不是任何一条工具参数，是那一长串「不许」。不许多引一句，不许多记一行，不许替用户做一个决定。\n\n24 小时里，Opus 5 能力的上限已经被开发者测了个遍；而它的下限，早在这 3 万 Toke 里被人一条条摁死了。\n\n- https://github.com/Eversmile12/leaked-llm-prompts/blob/main/Anthropic/opus-5.md\n\n- https://x.com/VittoStack/status/2080722990287745207?s=20\n\n本文来自微信公众号：\u003ca href=", "zh": true}]}]};
function pad(n){return n<10?"0"+n:""+n;}
function toBeijingHuman(iso, ref, exact){
  const d=new Date(iso); const bj=new Date(d.getTime()+8*3600*1000);
  const Y=bj.getUTCFullYear(),M=bj.getUTCMonth()+1,D=bj.getUTCDate();
  const h=bj.getUTCHours(),m=bj.getUTCMinutes(); const hh=pad(h),mm=pad(m);
  if(!exact) return M+"月"+D+"日";
  const [rY,rM,rD]=ref.split("-").map(Number);
  if(Y===rY&&M===rM&&D===rD) return "今天 "+hh+":"+mm;
  const yest=new Date(rY,rM-1,rD); yest.setDate(yest.getDate()-1);
  if(Y===yest.getFullYear()&&M===yest.getMonth()+1&&D===yest.getDate()) return "昨天 "+hh+":"+mm;
  return M+"月"+D+"日 "+hh+":"+mm;
}

function escapeHtml(s){return (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function escapeAttr(s){return escapeHtml(s);}
// 渲染正文（纯文本归档）：图片不加载远程资源，仅以文字占位符呈现；其余文本按段落转义（防 XSS）
function linkify(escaped){
  if(!escaped) return escaped;
  var re=/(\[[^\]]+\]\((https?:\/\/[^)\s]+)\))|(https?:\/\/[^\s<>"'）】」』，。、；：！？]+)/g;
  return escaped.replace(re, function(m, g1, g2, g3){
    if(g2!==undefined){
      var label=m.substring(m.indexOf('[')+1, m.indexOf(']'));
      return '<a class="r-link" href="'+g2+'" target="_blank" rel="noopener noreferrer">'+label+'</a>';
    }
    if(g3!==undefined){
      return '<a class="r-link" href="'+g3+'" target="_blank" rel="noopener noreferrer">'+g3+'</a>';
    }
    return m;
  });
}
var _IMG_RE=/!\[([^\]]*)\]\(([^)\s]+)\)/g;
function renderRich(text){
  return (text||"").split(/\n{1,}/).map(function(p){
    p=p.trim(); if(!p) return '';
    var out=''; var last=0; var m; _IMG_RE.lastIndex=0;
    while((m=_IMG_RE.exec(p))!==null){
      out+=linkify(escapeHtml(p.slice(last,m.index)));
      var cap=(m[1]||'').trim()||'图片';
      out+='<span class="r-img-cap">🖼 '+escapeHtml(cap)+'</span>';
      last=_IMG_RE.lastIndex;
    }
    out+=linkify(escapeHtml(p.slice(last)));
    return '<p>'+out+'</p>';
  }).join("");
}
function openReader(it){
  const r=document.getElementById("reader");
  const content=(it.content||"").trim();
  const body=document.getElementById("readerBody");
  if(content.length>0){
    body.innerHTML=renderRich(content);
  }else{
    const sum=(it.summary||"").trim();
    if(sum){
      // 来源站点多为付费墙 / 登录墙 / 反爬限制，无法镜像全文；展示已本地存档的中文摘要兜底
      body.innerHTML='<div class="r-fallback">⚠️ 该条新闻的<b>全文镜像暂不可用</b>（来源站点可能为付费墙 / 登录墙 / 反爬限制，或原文已失效）。下方为已<b>本地存档的中文摘要</b>，可正常查看；完整原文请点击右下角「查看原文 ↗」。</div>'+
        '<p class="r-summary">'+linkify(escapeHtml(sum))+'</p>';
    }else{
      body.innerHTML='<p class="r-empty">暂未获取到该条新闻的全文镜像与摘要。'+(it.url?'可点击右下角「查看原文 ↗」前往原始报道。':'')+'</p>';
    }
  }
  document.getElementById("readerTitle").textContent=it.title;
  document.getElementById("readerSource").textContent=it.source;
  const link=document.getElementById("readerLink");
  if(it.url){link.href=it.url;link.style.display="";}else{link.style.display="none";}
  r.hidden=false;document.body.style.overflow="hidden";
}
function closeReader(){const r=document.getElementById("reader");r.hidden=true;document.body.style.overflow="";}
document.getElementById("reader").addEventListener("click",function(e){if(e.target===this)closeReader();});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeReader();});
