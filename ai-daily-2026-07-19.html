rding to the Stanford Social Innovation Review. Two-thirds of households donated in 2000; roughly half do now, and Bank of America and Lilly Family School data shows even affluent-household giving has slipped, from 90% in 2017 to 81% last year.\nThe pattern shows up in Index’s own portfolio, which includes Anthropic. Business Insider recently asked a financial planner, Alex Caswell, whether his newly wealthy clients, many of them Anthropic employees tied to effective altruism, were pledging to give away the bulk of their fortunes. Anthropic matches employee donations of up to 25% of their equity to charity, and some of Caswell’s clients have used it, he told BI, but most weren’t building philanthropy into their plans at all; they were focused on angel investing or starting their own companies. “That’s what I’m seeing more than the desire to become philanthropic,” he told the outlet.\nUnsurprisingly, the absence of voluntary giving is now running up against attempts to legislate the outcome instead. California voters will decide this year on a 5% one-time wealth tax that targets the state’s billionaires. Some, including Google founders Sergey Brin and Larry Page, have already moved their primary residences to South Florida to be on the safe side.\nOpenAI is reportedly considering going public in 2027, and cynically, one reason among others may be that the tax, if passed, will calculate net worth based on an individual’s worldwide assets as of the end of this calendar year.\nAs expectedly, there is plenty of opposition to any kind of wealth-redistribution measure of this scale, including by Governor Gavin Newsom, and including by economists who point out that many industrialized countries have repealed similar wealth taxes since 1990 after watching their wealthy residents skedaddle.\nOther options on the table are as controversial. OpenAI has reportedly discussed handing the federal government a 5% equity stake, an idea CEO Sam Altman has framed as sharing AI’s upside function escapeAttr(s){return escapeHtml(s);}
// 渲染正文（纯文本归档）：图片不加载远程资源，仅以文字占位符呈现；其余文本按段落转义（防 XSS）
function linkify(escaped){
  if(!escaped) return escaped;
  var re=/(\[[^\]]+\]\((https?:\/\/[^)\s]+)\))|(https?:\/\/[^\s<>"'）】」』，。、；：！？]+)/g;
  return escaped.replace(re, function(m, g1, g2, g3){
    if(g2!==undefined){
      var label=m.substring(m.indexOf('[')+1, m.indexOf(']'));
      return '<a class="r-link" href="'+g2+'" target="_blank" rel="noopener noreferrer">'+label+'</a>';
    }
    if(g3!==undefined){
      return '<a class="r-link" href="'+g3+'" target="_blank" rel="noopener noreferrer">'+g3+'</a>';
    }
    return m;
  });
}
var _IMG_RE=/!\[([^\]]*)\]\(([^)\s]+)\)/g;
function renderRich(text){
  return (text||"").split(/\n{1,}/).map(function(p){
    p=p.trim(); if(!p) return '';
    var out=''; var last=0; var m; _IMG_RE.lastIndex=0;
    while((m=_IMG_RE.exec(p))!==null){
      out+=linkify(escapeHtml(p.slice(last,m.index)));
      var cap=(m[1]||'').trim()||'图片';
      out+='<span class="r-img-cap">🖼 '+escapeHtml(cap)+'</span>';
      last=_IMG_RE.lastIndex;
    }
    out+=linkify(escapeHtml(p.slice(last)));
    return '<p>'+out+'</p>';
  }).join("");
}
function openReader(it){
  const r=document.getElementById("reader");
  const content=(it.content||"").trim();
  const body=document.getElementById("readerBody");
  if(content.length>0){
    body.innerHTML=renderRich(content);
  }else{
    const sum=(it.summary||"").trim();
    if(sum){
      // 来源站点多为付费墙 / 登录墙 / 反爬限制，无法镜像全文；展示已本地存档的中文摘要兜底
      body.innerHTML='<div class="r-fallback">⚠️ 该条新闻的<b>全文镜像暂不可用</b>（来源站点可能为付费墙 / 登录墙 / 反爬限制，或原文已失效）。下方为已<b>本地存档的中文摘要</b>，可正常查看；完整原文请点击右下角「查看原文 ↗」。</div>'+
        '<p class="r-summary">'+linkify(escapeHtml(sum))+'</p>';
    }else{
      body.innerHTML='<p class="r-empty">暂未获取到该条新闻的全文镜像与摘要。'+(it.url?'可点击右下角「查看原文 ↗」前往原始报道。':'')+'</p>';
    }
  }
  document.getElementById("readerTitle").textContent=it.title;
  document.getElementById("readerSource").textContent=it.source;
  const link=document.getElementById("readerLink");
  if(it.url){link.href=it.url;link.style.display="";}else{link.style.display="none";}
  r.hidden=false;document.body.style.overflow="hidden";
}
function closeReader(){const r=document.getElementById("reader");r.hidden=true;document.body.style.overflow="";}
document.getElementById("reader").addEventListener("click",function(e){if(e.target===this)closeReader();});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeReader();});
</script>
