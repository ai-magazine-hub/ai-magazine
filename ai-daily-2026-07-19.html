/techcrunch.com/2026/07/17/neil-rimer-thinks-the-ai-money-is-coming-back-out", "permalink": "https://aihot.virxact.com/items/cmrpwwjho06djbisr218fe8ro", "publishedAt": "2026-07-19T00:00:00.000Z", "exact": false, "content": "五月底，尼尔·里默（Neil Rimer）在雅典与我会面时说了一些让我无法动摇的话。在该市一个充满活力的新技术节上，谈到围绕人工智能积累的财富时，他说他“强烈感觉到将会出现某种形式的重新分配”。他继续前行。 “这要么是自愿的，要么是非自愿的，但它会发生，而且我希望这是自愿的，”他告诉我，并补充说，他认为科技领导者“可以在实现这一目标方面发挥主导作用。” 对于大多数人来说，这听起来像是标准的民粹主义。来自过去三十年最成功的风险投资公司之一 Index Ventures 联合创始人 Rimer 的这番言论在公开场合似乎令人震惊。 2021 年，里默不再从事日常投资，这些天他大部分时间都在雅典度过，他的妻子来自那里，他的孩子们也在那里珍藏着他们的希腊护照。他穿着皱巴巴的系扣衬衫和牛仔裤出现在我们的采访中，而不是像他的许多同龄人那样穿着四分之一拉链和精美的针织衫。然而，Index 近年来的回报却非常出色：自成立以来，该公司已从外部投资者那里筹集了约 150 亿美元，而去年的退出，包括 Figma 的 IPO 和谷歌收购网络安全公司 Wiz，据报道为 Index 净赚了约 90 亿美元。 里默找到了回馈社会的方法。他是 Endeavor Greek 的董事会成员，该公司为新兴市场的企业家提供指导，并在 2019 年至 2025 年期间担任人权观察董事会主席。2021 年末，他和他的父亲以及两个兄弟向麦吉尔大学捐赠了 1300 万美元，用于翻修校园建筑（现在的 Rimer 大楼），并建立了一个新的土著研究和知识研究所。 与此同时，他关于再分配的评论出现在一个奇怪的时刻，出于慈善、给予。沃伦·巴菲特和比尔·盖茨在 2010 年发起的“捐赠誓言”，旨在让亿万富翁将一半的财富投入慈善事业，但现在却变得越来越无关紧要。根据纽约时报 3 月份的一篇报道，在最初的五年里有 113 个家庭签署了协议，然后是 72 个家庭，然后是 43 个家庭，然后到 2024 年全年只有 4 个家庭签署了协议，该报告强调了过时的慈善事业如何成为科技行业最富有的人中的一部分。 （注意到那篇文章：“世界上最富有的人埃隆·马斯克曾说过，他的企业‘是慈善事业’。”） 这种模式似乎超越了承诺。根据《斯坦福社会创新评论》的数据，2024 年美国慈善捐赠总额达到创纪录的 5925 亿美元，但美国人实际捐赠的数量已连续五年下降，仅 2024 年就下降了 4.5%。 2000 年，三分之二的家庭进行了捐赠；现在大约有一半人这样做，美国银行和礼来家庭学校的数据显示，即使是富裕家庭的捐赠比例也有所下降，从 2017 年的 90% 下降到去年的 81%。 这种模式出现在 Index 自己的投资组合中，其中包括 Anthropic。 《商业内幕》最近询问财务规划师亚历克斯·卡斯韦尔（Alex Caswell），他的新富客户（其中许多是与有效利他主义联系在一起的人类员工）是否承诺捐出大部分财富。他告诉 BI，Anthropic 将员工高达 25% 的股权捐赠给慈善机构，Caswell 的一些客户已经使用了这种方式，但大多数人根本没有将慈善事业纳入他们的计划；他们专注于天使投资或创办自己的公司。 “我看到的不仅仅是成为慈善家的愿望，”他告诉媒体。 毫不奇怪，自愿捐赠的缺失现在正面临着对结果进行立法的尝试。加州选民今年将决定针对该州的亿万富翁征收 5% 的一次性财富税。为了安全起见，包括谷歌创始人谢尔盖·布林和拉里·佩奇在内的一些人已经将他们的主要住所搬到了南佛罗里达州。 据报道，OpenAI 正在考虑在 2027 年上市，讽刺的是，其中一个原因可能是，如果这项税收获得通过，将根据截至本日历年年底个人的全球资产来计算净资产。 正如预期的那样，任何这种规模的财富再分配措施都会遭到很多人的反对，其中包括州长加文·纽瑟姆(Gavin Newsom)，经济学家也指出，许多工业化国家在看到富裕居民纷纷逃亡后，自1990年以来已经废除了类似的财富税。 桌面上的其他选项也同样存在争议。据报道，OpenAI 已经讨论了向联邦政府提供 5% 的股权，首席执行官 Sam Altman 称这一想法是与公众分享人工智能的优势，而批评者认为这是在华盛顿购买政治掩护的一种方式。无论哪种情况，硅谷都从来不急于将山姆大叔纳入股权结构表。去年，资深投资者 Roelof Botha 在与这位编辑单独坐下来时开玩笑说：“世界上最危险的一些话是：‘我来自政府，我是来帮忙的。’” 在此背景下，值得思考的是在这些机制之外积累了多少财富。马斯克的身家刚刚超过 1 万亿美元，上个月 SpaceX 首次公开募股使他成为第一个达到这一数字的人。这个数字几乎深不可测，以至于媒体都用插图来帮助人们理解它。仅在《福布斯》2026 年排行榜中就有 45 名新晋 AI 亿万富翁，总资产达 2.9 万亿美元，而这还是在 Anthropic 或 OpenAI 上市之前。 在《商业内幕》关于 Anthropic 员工的同一篇报道中，它指出，一旦 Anthropic 和 OpenAI 完成首次公开募股，他们的员工加起来将拥有足够的财富来购买旧金山都会区近三分之一的房屋。 这感觉是史无前例的，但它是否代表了历史性的极端还有一些争论。去年第三季度，美国最富有的1%家庭所拥有的财富份额达到31.7%，这是自美联储1989年开始追踪该数据以来的最高纪录，大致相当于最富有的1%家庭之外的其他90%的家庭所拥有的财富总和。 这仍然低于镀金时代接近尾声时，前 1% 人口所占的 45%。但将镜头缩小到顶端，画面就会翻转。著名经济学家加布里埃尔·祖克曼 (Gabriel Zucman) 计算出，在 1910 年左右的镀金时代鼎盛时期，美国四大财富的总价值占美国 GDP 的 4%。如今，同样一小部分人口——现在有 19 户家庭，而不是 4 户——价值 14%。 里默的两条道路，自愿的或被迫的，自上次美国财富集中度达到这一水平以来就有先例。 1889年，在第一个镀金时代的鼎盛时期，安德鲁·卡内基发表了一篇文章，主张富人应该将自己的财产视为信托，在有生之年为公共利益进行分配，并称死时富有是一种耻辱。这篇名为《财富的福音》的文章成为现代慈善事业的奠基文件，也是捐赠誓言的思想鼻祖。 不过，它并没有阻碍另一条道路太久。到了 20 世纪 30 年代中期，路易斯安那州参议员休伊·朗 (Huey Long) 发起了一项名为“分享我们的财富”的计划，要求向富人征收高额税款，为每个美国人提供有保障的收入，从而在全国范围内赢得了追随者。由于担心失去工人阶级对朗的支持，富兰克林·罗斯福推行了媒体所说的“富人税”，将最高边际所得税率提高到 79%。它的再分配程度低于朗的预期，但它仍然是美国历史上最明显的例子，一旦自愿捐赠未能充分解决其背后的压力，政治上就会强制进行再分配。 对于里默来说，这一切都不是什么新闻，他的职业生涯都在科技行业度过。对他来说，更好奇的是“科技公司的道德中心”，这种着迷源于 1984 年，他还是一名斯坦福大学本科生，当时苹果公司向学生出售第一台麦金塔电脑，用他的话说，史蒂夫·乔布斯和苹果公司的其他创始人是“英雄”，他们创造了他认为真正对世界有益的东西。 他说，现在困扰他的是听到自己的孩子谈论某些科技公司，就像上一代谈论国防承包商或香烟制造商一样。 里默作为 Anthropic 和其他科技公司的投资者，是这笔意外之财的直接受益者，他说最终需要分享这笔意外之财，这给了他更多的权力，而不是更少。他宁愿看到其他受益人选择退还部分资金，也不愿看到资金被拿走。做到这一点有一种简单的方法，也有一种困难的方法，里默押注人们会在历史为他们选择简单的方法之前选择简单的方法。", "zh": true}]}]};
function pad(n){return n<10?"0"+n:""+n;}
function toBeijingHuman(iso, ref, exact){
  const d=new Date(iso); const bj=new Date(d.getTime()+8*3600*1000);
  const Y=bj.getUTCFullYear(),M=bj.getUTCMonth()+1,D=bj.getUTCDate();
  const h=bj.getUTCHours(),m=bj.getUTCMinutes(); const hh=pad(h),mm=pad(m);
  if(!exact) return M+"月"+D+"日";
  const [rY,rM,rD]=ref.split("-").map(Number);
  if(Y===rY&&M===rM&&D===rD) return "今天 "+hh+":"+mm;
  const yest=new Date(rY,rM-1,rD); yest.setDate(yest.getDate()-1);
  if(Y===yest.getFullYear()&&M===yest.getMonth()+1&&D===yest.getDate()) return "昨天 "+hh+":"+mm;
  return M+"月"+D+"日 "+hh+":"+mm;
}

function escapeHtml(s){return (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function escapeAttr(s){return escapeHtml(s);}
// 渲染正文（纯文本归档）：图片不加载远程资源，仅以文字占位符呈现；其余文本按段落转义（防 XSS）
function linkify(escaped){
  if(!escaped) return escaped;
  var re=/(\[[^\]]+\]\((https?:\/\/[^)\s]+)\))|(https?:\/\/[^\s<>"'）】」』，。、；：！？]+)/g;
  return escaped.replace(re, function(m, g1, g2, g3){
    if(g2!==undefined){
      var label=m.substring(m.indexOf('[')+1, m.indexOf(']'));
      return '<a class="r-link" href="'+g2+'" target="_blank" rel="noopener noreferrer">'+label+'</a>';
    }
    if(g3!==undefined){
      return '<a class="r-link" href="'+g3+'" target="_blank" rel="noopener noreferrer">'+g3+'</a>';
    }
    return m;
  });
}
var _IMG_RE=/!\[([^\]]*)\]\(([^)\s]+)\)/g;
function renderRich(text){
  return (text||"").split(/\n{1,}/).map(function(p){
    p=p.trim(); if(!p) return '';
    var out=''; var last=0; var m; _IMG_RE.lastIndex=0;
    while((m=_IMG_RE.exec(p))!==null){
      out+=linkify(escapeHtml(p.slice(last,m.index)));
      var cap=(m[1]||'').trim()||'图片';
      out+='<span class="r-img-cap">🖼 '+escapeHtml(cap)+'</span>';
      last=_IMG_RE.lastIndex;
    }
    out+=linkify(escapeHtml(p.slice(last)));
    return '<p>'+out+'</p>';
  }).join("");
}
function openReader(it){

        '<p class="r-summary">'+linkify(escapeHtml(sum))+'</p>';
    }else{
      body.innerHTML='<p class="r-empty">暂未获取到该条新闻的全文镜像与摘要。'+(it.url?'可点击右下角「查看原文 ↗」前往原始报道。':'')+'</p>';
    }
  }
  document.getElementById("readerTitle").textContent=it.title;
  document.getElementById("readerSource").textContent=it.source;
  const link=document.getElementById("readerLink");
  if(it.url){link.href=it.url;link.style.display="";}else{link.style.display="none";}
  r.hidden=false;document.body.style.overflow="hidden";
}
