个黏土手办，两手抱着大面团狂揉或者做个闪身步，这个定格动画的感觉真的蛮好玩的。 阿德曼黏土定格动画风格（Aardman Claymation），带真实手工揉捏指纹纹理与轻微抽帧停顿节奏（约 8ps），无缝循环 4 秒 GIF 动图。主角是 Q 版黏土女仆大肥鱼娘（深蓝头发、头顶呆毛、围裙小鲸鱼），正站在小木桌前双手用力揉捏一团软乎乎的大面团，整个人随着揉面动作前后晃动，身后的小鲸鱼尾巴上下扑腾，随后双手猛地把面饼高高抛向空中旋转，动作滑稽可爱，微距摄影景深。 还可以直接对话批量做出不同动作的 gif。 然后就是你可以让 gpt 自己查找最近很火的抽象打工人动物表情包这种画风，你可以自己定义想要它找啥样的风格，然后批量做这种抽象表情包。 查找最近国内很火的抽象表情包风格，制作搞笑微信动态 GIF 表情包，12 帧高动态循环，一只穿着皱巴巴白衬衫和领带的搞笑猴子（吗喽）坐在办公桌前，两只手化作残影极其狂暴地疯狂砸击电脑键盘，键盘被砸得火花四溅键帽乱飞，猴子头顶上方悬浮着加粗荧光红大字「收到！马上改！」伴随剧烈震屏闪烁，夸张搞笑社畜精神状态 还有就是直接出一批剪辑的时候可以用到的动态素材贴纸，这种就不用担心版权问题了，需要啥随时做，而且还可以输出透明通道的 gif。 给我生成一批剪辑时非常可能会用到的动态贴纸，高饱和、糖果色的 3D 卡通贴纸风格，表面有塑料或果冻般的光泽，配白色模切描边、厚阴影和夸张的弹跳动画。整体偏短视频里醒目、活泼的视觉效果。 除了剪辑会用到的素材之外，我平时做公众号也会需要很多动图素材，毕竟公众号最多只能放 10 个视频，而且像结尾这种引导互动的肯定还是放能一直循环播放的动图比较好，重要的是做好一个基本都能一句话批量做出同类型的素材。 制作一张用于微信公众号文章结尾的超窄横版循环动图，画幅 1400×260，时长约 3 秒，固定镜头，真正透明通道。左侧是圆滚滚的手捏黏土小人，神情一本正经，吃力地举着一支比自己还大的红橙色复古剪纸箭头，箭头始终指向右侧。小人向右挪两步，被箭头带得踉跄，努力站稳；箭头尖端轻碰右侧文字。 右侧单行、准确写出「点个在看」四个汉字。文字像小孩子用一根根圆头黏土条手工拼出的字，笔画略微歪斜、粗细有细小变化，表面柔软、有轻微手捏纹理和立体厚度；每一笔之间留出清楚空隙，四个字必须一眼可辨。「点个」为珊瑚红，「在看」为明亮橙黄。被箭头碰到后，文字依次轻弹，从接触点迸出几颗彩色小星星，文字短暂变成粉红与薄荷绿，再恢复原色。动作滑稽、轻快，但不过分夸张；约 3 秒自然回到起点，首尾无缝循环。 所有人物、箭头、星星和文字完整处于画幅内，上下保留安全边距。只在小人脚边添加少量手绘速度线和小纸屑。不要背景场景、白底、纯色底、棋盘格、额外文字、水印或番茄。输出带真实透明通道的循环 GIF 或 APNG。 还可以做这种很有趣的 loading 图，以前要找这样的素材有时候真的要翻很久，不过现在都可以自己手搓了，比直接用 AI 视频做我觉得来的方便很多，AI 视频很容易动态做的过大，没有这种动图的感觉了。 生成一个透明背景的动态 GIF，用于网页 Loading 动画。主角是一只圆滚滚、脸颊鼓鼓的小仓鼠，用黑色蜡笔和炭笔涂鸦画成。画风稚拙可爱：线条粗细不均，带有断线、重描和粗糙笔触，像小朋友随手画出的角色。仓鼠在一个歪歪扭扭的手绘跑轮里拼命奔跑，小短腿快到只剩几条潦草的速度线；它一直盯着前方一颗瓜子，伸爪去够，却每圈都差一点点。表情一本正经，动作笨拙好笑，耳朵和大脸颊随着奔跑弹动。 仅生成 8 帧，首尾无缝循环，带轻微的逐帧手绘抖动。主体居中，轮廓清楚，适合作为小尺寸网页加载图。背景必须完全透明，导出保留透明通道；不要白底、纸张底色、棋盘格或任何背景图案。不要文字、进度条、霓虹、金属、科技元素、彩色填充和水印。 再就是做 PPT 的时候有时候也很需要动态素材，相比 AI 视频总是会做很多多余的动画，动图的好处就是动态比较克制，文字更加稳定，展示的数据和数据图类型都是可以自己设定好的。 文生 GIF 动图，16:9，用于业绩汇报。清爽的二维扁平矢量信息图风格：暖白色背景、轻微纸张质感、大量留白，深海军蓝细线与明亮蓝色为主，珊瑚橙只用于强调增长。画面中央是一张大幅上升折线图，展示季度营收：Q1 120 万、Q2 168 万、Q3 215 万、Q4 306 万。 动画开始时，浅灰色网格和坐标轴轻轻浮现；蓝色折线从 Q1 向 Q4 快速但顺滑地绘制，线下方出现半透明蓝色渐变填充。每到一个数据节点，圆点弹跳一下，对应的数值卡片弹出；线条经过时留下一小段发光轨迹。到达 Q4 时，终点出现珊瑚橙色上升箭头和“增长 155%”卡片，周围有少量星形闪光与圆环扩散。随后高亮、卡片和填充平滑收回，回到初始画面，形成首尾一致的 4 秒无缝循环 GIF。图表位置始终固定，动效有节奏感但不杂乱。不要人物、实拍质感、3D 效果、镜头运动或声音。 除了展示数据之外，做一些产品功能展示预演的时候用动图也很合适，不需要把详细的信息展示出来，只展示功能的交互动画，我这里做了生成摘要、点击收藏和切换夜间模式的演示图。 制作一段 3 秒、可无缝循环的网页产品演示动图。鼠标点击文章右上角的“生成摘要”按钮，按钮短暂显示加载状态，右侧随即展开简洁的摘要卡片。镜头固定，保留真实界面布局，让点击和结果清晰可见；动画轻快、克制，不添加其他操作或虚构文案。 还有一种就是可以做产品的零件爆炸演示图，尤其这种偏 2.5D 类型的，用 AI 视频做就很容易崩，零件也容易多给，倒是可以用 Opus5.5 做出来，不过现在 Image2.6 做出来的循环动画效果也真是不错。 等轴测 2.5D 爆炸拆解视图，一台经典的单反相机。拆成金属机身外壳、镜头零件、等等拆件的爆炸镜头，生成从完整相机到拆件的无缝循环 GIF 动图。 然后就是可以直接利用 GPT 强大的世界知识同时检索历史时间生成对应的图像素材，做成这样的历史流程图，有动态感的同时信息也会保证准确。 历史科普长卷动态时间轴，动态 GIF，泛黄水墨宣纸质感底纹，手绘水墨写意风格，一支饱蘸浓墨的毛笔自左向右极速扫过划出一条起伏有力的墨迹时间线，墨迹划过之处依次如盖章般晕染浮现出四个朝代关键节点的微缩手绘插画：商周青铜司母戊鼎、秦代陶俑战车、盛唐飞天壁画阁楼与大明宝船，节点带有毛笔小楷年代标注，墨韵流动，首尾相接无缝循环 做成这样的路线示意图也很好玩，感觉非常适合游戏里的结算画面使用，这里地图都可以使用自己上传的。 复古探险寻宝手绘路线图，动态 GIF，泛黄古老牛皮纸羊皮纸地图质感，手绘等高线与山川河流，一条红色的虚线轨迹从左下角出发像活蛇般沿着山谷快速向前蜿蜒穿梭，轨迹前端是一辆可爱的复古小越野车在颠簸狂奔，每到达一个补给站地标，一枚立体红色图钉便伴随微小冲击波咚地一声精准扎在地图上，最终在右上角的大红叉宝藏点画圈点亮，冒险故事感 最后也可以给名画做一些比较有视觉标识性的二次处理，放到文章中或者网站里作为配图素材使用都还能挺吸睛，挺有视觉冲击力的感觉。 艺术解构科技动态视觉，动态 GIF，16 帧完美闭环，纯黑极简暗调背景。一座纯白古典大卫大理石雕像胸像静静伫立，一道刺眼的青蓝色水平全息激光束自下而上快速扫过雕像，被激光扫过的瞬间，坚硬的大理石雕像瞬间炸裂崩解为成千上万颗极度微小的发光青色几何体素立体方块与数字碎片，如失重般向四周爆发扩散悬浮；在第 8 帧达到最大扩散范围后，所有发光粒子如同时间倒流般以极高加速度逆向收拢吸附，严丝合缝拼回完好无损的白色大理石雕像，极具张力与科技美感 那动图的部分看完了，咱们在看三个静态能力的更新。 第一个是跨对话角色记忆，以前最烦的就是换个聊天框 AI 就失忆，非得逼你重新再上传一遍图片然后再解释。现在只要先让他保存好参考， 然后在在提示词里，它就能记住这个角色长什么样。比如我这个黑大圣从破布衣换成黄金甲，换了场景也换了光影，主角的长相也没变，就还挺方便。 第二个是结构引出线拆解图，是做产品说明书或设计拆解的神器。2.6 标出来的白色箭头引出线和数字标号排得很整齐，端点老老实实指在零件上，不会像以前那样箭头乱指、字在天上乱飞，看起来很像正经的产品说明书。 左 Image2.6 右 Image2.5 第三个就是直接输出纯矢量 SVG 代码，它生成的不是带有矢量画风的普通图片，而是直接吐出可以在前端运行的代码。代码结构很干净，没有乱七八糟的多余节点，丢进 Figma 或者浏览器里可以直接无限放大，对前端和 UI 同学来说拿过去就能用。 不过要说做矢量图的话，做简单的图表类型还是可以的， 如果做复杂一点的，曲线多一点的人物类型的图就基本都会跑偏。。。这个也不知道是不是 codex 的问题，反正目前我用着是一般。 除了做表情包之外，我也算是绞尽脑汁，给大家硬抠出了几个稍微能派上用场的 GIF 玩法。 但有一说一，测到最后，这波更新实在算不上什么颠覆性大版本。 尤其是在人脸一致性上，只要多改两轮，五官漂移得甚至还不如老版 Image 2.5 稳当。 更要命的是，成本还实打实地翻倍了——静态单张直接从以前的 4 美分涨到了 8 美分，要是生成一个十几帧的 GIF，抽一次卡就得烧掉小两毛美金。 至于这次主打高速的 API 的 Flare 模式，体感上速度提升也不是很明显，画质还缩水了一圈。 所以我的建议是大家可以当个新鲜玩具友情试两把， 没必要特意为了它去充值改工作流。 至于真正有颠覆性的能力跃迁， 我们还是等下一个大版本吧。", "zh": true}]}]};
function pad(n){return n<10?"0"+n:""+n;}
function toBeijingHuman(iso, ref, exact){
  const d=new Date(iso); const bj=new Date(d.getTime()+8*3600*1000);
  const Y=bj.getUTCFullYear(),M=bj.getUTCMonth()+1,D=bj.getUTCDate();
  const h=bj.getUTCHours(),m=bj.getUTCMinutes(); const hh=pad(h),mm=pad(m);
  if(!exact) return M+"月"+D+"日";
  const [rY,rM,rD]=ref.split("-").map(Number);
  if(Y===rY&&M===rM&&D===rD) return "今天 "+hh+":"+mm;
  const yest=new Date(rY,rM-1,rD); yest.setDate(yest.getDate()-1);
  if(Y===yest.getFullYear()&&M===yest.getMonth()+1&&D===yest.getDate()) return "昨天 "+hh+":"+mm;
  return M+"月"+D+"日 "+hh+":"+mm;
}

  sec.appendChild(grid);mainEl.appendChild(sec);
});
function escapeHtml(s){return (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function escapeAttr(s){return escapeHtml(s);}
// 渲染正文（纯文本归档）：图片不加载远程资源，仅以文字占位符呈现；其余文本按段落转义（防 XSS）
function linkify(escaped){
  if(!escaped) return escaped;
  var re=/(\[[^\]]+\]\((https?:\/\/[^)\s]+)\))|(https?:\/\/[^\s<>"'）】」』，。、；：！？]+)/g;
  return escaped.replace(re, function(m, g1, g2, g3){
    if(g2!==undefined){
      var label=m.substring(m.indexOf('[')+1, m.indexOf(']'));
      return '<a class="r-link" href="'+g2+'" target="_blank" rel="noopener noreferrer">'+label+'</a>';
    }
    if(g3!==undefined){
      return '<a class="r-link" href="'+g3+'" target="_blank" rel="noopener noreferrer">'+g3+'</a>';
    }
    return m;
  });
}
var _IMG_RE=/!\[([^\]]*)\]\(([^)\s]+)\)/g;
function renderRich(text){
  return (text||"").split(/\n{1,}/).map(function(p){
    p=p.trim(); if(!p) return '';
    var out=''; var last=0; var m; _IMG_RE.lastIndex=0;
    while((m=_IMG_RE.exec(p))!==null){
      out+=linkify(escapeHtml(p.slice(last,m.index)));
      var cap=(m[1]||'').trim()||'图片';
      out+='<span class="r-img-cap">🖼 '+escapeHtml(cap)+'</span>';
      last=_IMG_RE.lastIndex;
    }
    out+=linkify(escapeHtml(p.slice(last)));
    return '<p>'+out+'</p>';
  }).join("");
}
function openReader(it){
  const r=document.getElementById("reader");
  const content=(it.content||"").trim();
  const body=document.getElementById("readerBody");
  if(content.length>0){
    body.innerHTML=renderRich(content);
  }else{
    const sum=(it.summary||"").trim();
    if(sum){
      // 来源站点多为付费墙 / 登录墙 / 反爬限制，无法镜像全文；展示已本地存档的中文摘要兜底
      body.innerHTML='<div class="r-fallback">⚠️ 该条新闻的<b>全文镜像暂不可用</b>（来源站点可能为付费墙 / 登录墙 / 反爬限制，或原文已失效）。下方为已<b>本地存档的中文摘要</b>，可正常查看；完整原文请点击右下角「查看原文 ↗」。</div>'+
        '<p class="r-summary">'+linkify(escapeHtml(sum))+'</p>';
    }else{
      body.innerHTML='<p class="r-empty">暂未获取到该条新闻的全文镜像与摘要。'+(it.url?'可点击右下角「查看原文 ↗」前往原始报道。':'')+'</p>';
    }
  }
  document.getElementById("readerTitle").textContent=it.title;
  document.getElementById("readerSource").textContent=it.source;
  const link=document.getElementById("readerLink");
  if(it.url){link.href=it.url;link.style.display="";}else{link.style.display="none";}
  r.hidden=false;document.body.style.overflow="hidden";
}
function closeReader(){const r=document.getElementById("reader");r.hidden=true;document.body.style.overflow="";}
document.getElementById("reader").addEventListener("click",function(e){if(e.target===this)closeReader();});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeReader();});
</script>
