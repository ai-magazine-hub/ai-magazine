Road to AI We Can Trust（RSS）", "summary": "对 Anthropic IPO 静默期流传的 2028 年 1900 亿美元级营收预测，文章提示其多基于匿名信源和未披露算法，可帮助在追踪上市进展时区分已核实数据与传闻。", "url": "https://garymarcus.substack.com/p/the-hyping-of-anthropics-ipo", "permalink": "https://aihot.virxact.com/items/cmsw88ide0liyrovmhjpvtel2", "publishedAt": "2026-08-16T19:25:30.000Z", "exact": true, "content": "\u003e\n\nSources say\n\nI am watching something fascinating unfolding in real time. Anthropic is in an SEC-monitored “\u003ca href=", "zh": true}]}, {"label": "产品发布/更新", "color": "#059669", "items": [{"seq": 1, "title": "OpenRouter 推出 Activity 仪表盘与 Analytics API：按智能体、模型、请求追踪 AI 使用成本", "source": "OpenRouter：Announcements（RSS）", "summary": "OpenRouter 发布 Activity 仪表盘和 beta Analytics API，可按智能体、模型、请求维度查看支出、token 量、缓存命中率等指标，并支持下钻至单条请求日志。", "url": "https://openrouter.ai/blog/announcements/activity-dashboard", "permalink": "/items/cmsx7ffrz049uromm6en3if02", "publishedAt": "2026-08-17T00:00:00.000Z", "exact": true, "zh": true, "fromFeed": true, "content": "\u003e 过去两年一直在部署智能体的每家公司，现在都在问同一个问题：它们到底花了我们多少钱，哪些又真正值得？OpenRouter 的 Activity 仪表盘和测试版 Analytics API 就能按智能体、按模型、按请求来回答这个问题。\n\n打开 Activity，就能看到支出如何在智能体、应用和团队成员之间分布。找出哪些模型和任务在推高成本，以及缓存又在哪些地方帮你省了钱。创建并保存自定义视图，然后从任意图表逐层下钻到单条请求。\n\n所有这些数据都可以通过测试版 Analytics API 获取。把你的智能体指向 openrouter-analytics 技能，就能深入分析你的用量，在终端里快速得到答案，或者把数据拉进你自己的仪表盘。\n\n先从全局看起\n\nOverview 让你一眼掌握用量情况。顶部有五个指标：总支出、请求数、token 总量、缓存命中率，以及每百万 token 的综合成本，每个指标都配有迷你趋势图，并与上一周期进行对比。同一屏幕上还有：你的头部用户和应用、按模型统计的支出、OpenRouter 积分与 BYOK 支出对比、按模型统计的请求量、提示词与补全 token 拆分，以及提示词缓存情况。\n\nTrends 用同一份数据，但按变化幅度而非体量来排序，有一个面板专门展示哪些在上升、哪些在下降。查看你在模型、用户、API 密钥和应用层面的趋势。用它来发现某个失控的智能体、某个正在起量的新模型，或者某个正在你组织内扩散的工具。\n\n探索任意问题\n\nOverview 和 Trends 上的每一张卡片都能链接到 Explore，在那里你可以自己拼装视图：\n\n- 指标：支出、请求数、token（提示词、补全、推理或缓存）、缓存命中率、每百万 token 综合成本、BYOK 与积分支出对比，或延迟与吞吐量（细分到 P50/P90/P99）\n- 分组维度（最多两个）：模型、变体、提供商、API 密钥、应用、用户、工作区、来源、国家、数据区域、结束原因、上下文长度、会话、生成批次、自定义用户 ID，或你定义的任意分类维度\n- 聚合粒度：按分钟、小时、天、周或月，也可以去掉时间轴，直接看排名表\n- 图表类型：柱状图、折线图或散点图\n用它来查看每个工作区中哪些应用在驱动使用量、你的智能体在每种任务类型下使用了哪些模型，或者你的服务商延迟随时间的变化趋势。\n\n保存你常用的视图。打开选项菜单，选择“保存当前图表”并为其命名。在组织中，你还可以选择谁能看到它：仅自己，或组织内的所有人。\n\n下载 CSV 或下载 PDF，即可将任意图表的数据直接导入电子表格或报告中。\n\nGuardrails 展示你的提示词注入和敏感信息规则阻止、脱敏或标记了哪些内容，以及哪些规则在发挥作用。用它来监控进入你提示词的敏感数据比例，以及哪些规则和数据类型在拦截这些数据。可按工作区或分类器筛选，以缩小来源范围。\n\n展开卡片即可查看完整明细，包括哪些检测模式组合触发了每次阻止、脱敏和标记。\n\n点击图表，直达日志\n\n聚合数据告诉你某些内容变得昂贵了。下一个问题是哪些请求导致的。\n\nActivity 中的每个图表和排名表都可链接到其背后的日志。点击周二的柱状条、堆叠图表中某个模型的切片，或排名表中的某一行，你就会进入已按这些请求筛选好的日志。\n\n打开日志中的任意一行，即可查看 Generation 详情视图。它显示：\n\n- 成本：上游推理、缓存、网络搜索和文件处理，以及已应用的折扣和缓存节省\n- 性能：服务商延迟、吞吐量和首 token 时间\n- 路由：哪个服务商处理了该请求、是否回退到另一个服务商，以及结束原因\n- 归因：背后的应用、API 密钥和工作区，以及会话 ID、请求 ID 和数据区域\n- 上下文：任何 guardrail 事件、分类器标签和原始元数据\n\nPrompt 详情视图渲染完整的消息数组，以及按角色着色的每条消息预估 token 火焰图：system、user、assistant 和 tool。一个成本是你预期三倍的对话，通常会在这里显示为一条宽阔的工具调用带或一个庞大的系统提示词。缓存前缀带有阴影标记，因此你可以看到缓存覆盖到提示词的哪个位置，以及是哪条消息打破了缓存。\n\n每条消息的 token 数量是根据消息大小估算得出的；生成结果本身的总量则是实际记录的用量。提示词和补全的明细仅在请求运行时启用了私有输入/输出日志时才存在，你可以在工作区的可观测性设置中启用该功能。\n\n与 Explore 相同的数据，可通过 API 获取\n\nExplore 中的所有内容也可以通过测试版 Analytics API 获取：让你的智能体运行分析，在终端中快速获得答案，或将数据拉取到你自己的仪表盘中。Analytics 查询需要管理密钥。有两个端点：\n\n- GET /api/v1/analytics/meta 返回当前支持的指标、维度、筛选运算符和粒度。请先调用元数据端点查看可用内容；我们一直在添加新的指标和维度。\n- POST /api/v1/analytics/query 运行查询并返回与 Explore 图表所依据的相同聚合数据。\n`curl -X POST https://openrouter.ai/api/v1/analytics/query \\ -H \\ -H \\ -d '{\n\n],\n\n,\n\n\u003e Every company that spent the last two years deploying agents is now asking the same question: what are they costing us, and which ones are worth it? OpenRouter’s\n\nExplore any question\n\nEvery card on Overview and Trends links into\n\nSave your go-to views. Open the options menu, choose Save current chart, and name it. In an organization you also choose who sees it: Only me, or Everyone in my organization.\n\nDownload CSV or Download PDF to send any chart’s data straight into a spreadsheet or report.\n\nExpand a card to get the full breakdown, including which combinations of detected patterns drove each block, redaction, and flag.\n\nClick a chart, land in the logs\n\nAggregates show you that something got expensive. The next question is which requests.\n\nEvery chart and ranked table in Activity links through to the logs behind it. Click Tuesday’s bar, one model’s slice of a stacked chart, or a row in a ranked table, and you land in your\n\nOpen any row in\n\nThe Prompt detail view renders the full messages array and a flamegraph of estimated tokens per message colored by role: system, user, assistant, and tool. A conversation that costs three times what you expected usually shows it here as a wide band of tool calls or a heavy system prompt. The cached prefix is shaded, so you can see how far into the prompt the cache held and which message broke it.\n\nPer-message token counts are estimates derived from message size; the totals on the generation itself are recorded usage. Prompts and completions detail only exist if private input/output logging was enabled when the request ran, which you can enable in your workspace observability.\n\nSame data as Explore, via API\n\nEverything in Explore is also available through the $OPENROUTER_API_KEY : 20 }'`\n\nFor agents\n\nThe \u003ca href="}, {"seq": 2, "title": "https://x.com/i/article/2089330332369588224", "source": "X：Jensen Huang (@JensenHuang)", "summary": "", "url": "https://x.com/JensenHuang/status/2089331487342829862", "permalink": "/items/cmsx8zij405t2rommm4gwgzjh", "publishedAt": "2026-08-17T12:40:19.000Z", "exact": true, "zh": true, "fromFeed": true, "content": "Land, power and shell: The next critical resource for AI factories.\n- Jensen, manufacture more 5090s and pro 6000s for consumers. People are killing each other for a mere 32 96gb chips that now cost 15k+??? Jensen, help the normal people by not cutting production for consumers. We will be your next big customer after the centers are built...\n- The math explains the bet: up to $105B of guarantees could secure a ~$600B compute opportunity, nearly 6x the exposure. Smart vertical integration, but $NVDA is increasingly becoming both supplier and financier."}]}]};
function pad(n){return n<10?"0"+n:""+n;}
function toBeijingHuman(iso, ref, exact){
  const d=new Date(iso); const bj=new Date(d.getTime()+8*3600*1000);
  const Y=bj.getUTCFullYear(),M=bj.getUTCMonth()+1,D=bj.getUTCDate();
  const h=bj.getUTCHours(),m=bj.getUTCMinutes(); const hh=pad(h),mm=pad(m);
  if(!exact) return M+"月"+D+"日";
  const [rY,rM,rD]=ref.split("-").map(Number);
  if(Y===rY&&M===rM&&D===rD) return "今天 "+hh+":"+mm;
  const yest=new Date(rY,rM-1,rD); yest.setDate(yest.getDate()-1);
  if(Y===yest.getFullYear()&&M===yest.getMonth()+1&&D===yest.getDate()) return "昨天 "+hh+":"+mm;
  return M+"月"+D+"日 "+hh+":"+mm;
}

  head.innerHTML='<span class="sec-dot" style="background:'+s.color+'"></span><h2>'+escapeHtml(s.label)+'</h2><span class="cnt">'+s.items.length+' 条</span>';
  sec.appendChild(head);
  const grid=document.createElement("div");grid.className="grid";
  s.items.forEach(it=>{
    const card=document.createElement("article");card.className="card";card.style.setProperty("--accent",s.color);
    const time=toBeijingHuman(it.publishedAt,ref,it.exact);const url=it.url||"#";
    card.innerHTML='<div class="top"><span class="seq">'+it.seq+'</span><span class="time">'+time+'</span></div>'+
      '<h3>'+escapeHtml(it.title)+'</h3><span class="chip">'+escapeHtml(it.source)+'</span>'+
      '<p class="summary">'+escapeHtml(it.summary)+'</p>'+
      '<a class="readmore" href="'+escapeAttr(url)+'" target="_blank" rel="noopener noreferrer" title="外部原文链接，可能需要访问境外站点">来源 ↗</a>';
    card.addEventListener("click", function(){ openReader(it); });
    const rm = card.querySelector(".readmore");
    rm.addEventListener("click", function(e){ e.stopPropagation(); });
    grid.appendChild(card);
  });
  sec.appendChild(grid);mainEl.appendChild(sec);
});
function escapeHtml(s){return (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function escapeAttr(s){return escapeHtml(s);}
// 渲染正文（纯文本归档）：图片不加载远程资源，仅以文字占位符呈现；其余文本按段落转义（防 XSS）
function linkify(escaped){
  if(!escaped) return escaped;
  var re=/(\[[^\]]+\]\((https?:\/\/[^)\s]+)\))|(https?:\/\/[^\s<>"'）】」』，。、；：！？]+)/g;
  return escaped.replace(re, function(m, g1, g2, g3){
    if(g2!==undefined){
      var label=m.substring(m.indexOf('[')+1, m.indexOf(']'));
      return '<a class="r-link" href="'+g2+'" target="_blank" rel="noopener noreferrer">'+label+'</a>';
    }
    if(g3!==undefined){
      return '<a class="r-link" href="'+g3+'" target="_blank" rel="noopener noreferrer">'+g3+'</a>';
    }
    return m;
  });
}
var _IMG_RE=/!\[([^\]]*)\]\(([^)\s]+)\)/g;
function renderRich(text){
  return (text||"").split(/\n{1,}/).map(function(p){
    p=p.trim(); if(!p) return '';
    var out=''; var last=0; var m; _IMG_RE.lastIndex=0;
    while((m=_IMG_RE.exec(p))!==null){
      out+=linkify(escapeHtml(p.slice(last,m.index)));
      var cap=(m[1]||'').trim()||'图片';
      out+='<span class="r-img-cap">🖼 '+escapeHtml(cap)+'</span>';
      last=_IMG_RE.lastIndex;
    }
    out+=linkify(escapeHtml(p.slice(last)));
    return '<p>'+out+'</p>';
  }).join("");
}
function openReader(it){
  const r=document.getElementById("reader");
  const content=(it.content||"").trim();
  const body=document.getElementById("readerBody");
  if(content.length>0){
    body.innerHTML=renderRich(content);
  }else{
    const sum=(it.summary||"").trim();
    if(sum){
      // 来源站点多为付费墙 / 登录墙 / 反爬限制，无法镜像全文；展示已本地存档的中文摘要兜底
      body.innerHTML='<div class="r-fallback">⚠️ 该条新闻的<b>全文镜像暂不可用</b>（来源站点可能为付费墙 / 登录墙 / 反爬限制，或原文已失效）。下方为已<b>本地存档的中文摘要</b>，可正常查看；完整原文请点击右下角「查看原文 ↗」。</div>'+
        '<p class="r-summary">'+linkify(escapeHtml(sum))+'</p>';
    }else{
      body.innerHTML='<p class="r-empty">暂未获取到该条新闻的全文镜像与摘要。'+(it.url?'可点击右下角「查看原文 ↗」前往原始报道。':'')+'</p>';
    }
  }
  document.getElementById("readerTitle").textContent=it.title;
  document.getElementById("readerSource").textContent=it.source;
  const link=document.getElementById("readerLink");
  if(it.url){link.href=it.url;link.style.display="";}else{link.style.display="none";}
  r.hidden=false;document.body.style.overflow="hidden";
}
function closeReader(){const r=document.getElementById("reader");r.hidden=true;document.body.style.overflow="";}
document.getElementById("reader").addEventListener("click",function(e){if(e.target===this)closeReader();});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeReader();});
</script>
