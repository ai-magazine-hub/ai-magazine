const DATA = {"meta": {"reportDate": "2026-09-27", "reportDateHuman": "2026年9月27日", "weekday": "星期日", "total": 8, "source": "AI HOT", "sourceUrl": "https://aihot.virxact.com", "generatedAt": "2026年09月27日 08:31"}, "sections": [{"label": "模型发布/更新", "color": "#4f46e5", "items": [{"seq": 1, "title": "Claude Opus 5.5 (High) 以 1509 分登顶 Arena Text Arena 榜首", "source": "X：Arena (@arena)", "summary": "Arena 宣布 Claude Opus 5.5 (High) 以 1509 分首次登顶 Text Arena，比 Opus 5 (High) 高 18 分（现列第 11）。Opus 4.6 (High) 以 4 分之差保持第 2，Anthropic 包揽该榜前六名；Opus 5.5 (High) 按每百万 token 输入/输出定价折算的混合价格为 $16/MToken，进入 Text Arena 的 Pareto 前沿。", "url": "https://x.com/arena/status/2103893011164017018", "permalink": "https://aihot.news/items/cmuinp76b0smurov0wemcbshl", "publishedAt": "2026-09-26T17:02:36.000Z", "exact": true, "content": "Claude Opus 5.5（高）首次在 Text Arena 中以 1509 分排名第一！ 比 Opus 5（高）提高了 18 点，目前排名第 11。 Opus 4.6（高）仍然排名第二，仅落后领先者 4 分。此版本让 @AnthropicAI 在 Text Arena 中占据了全部六个榜首位置！ Opus 5.5（高）也以 16 美元/MToken 的混合价格登陆 Text Arena Pareto 前沿，基于每百万代币的输入/输出定价！请参阅下面的帖子中的位置。 祝贺@AnthropicAI 团队发布！", "zh": true}, {"seq": 2, "title": "小米 MiMo-V2.6 诊断并修复工具调用重复问题，用 MOPD 将修复成本降至 MixRL 方案的 4%", "source": "小米 MiMo：官网发布与博客", "summary": "小米官方复盘 MiMo-V2.6 发布后的工具调用重复问题，响应级重复率超 0.05%，并区分了正常并行调用、调用泛滥与调用重复。回放 RL 各 checkpoint 显示泛滥率随训练从 11.1% 升至 24.6%，32 次调用阈值惩罚过于宽松；直接调低阈值需重启 20 步 MixRL，估计成本 231 万美元，且内部测试重复率仅从 13.45% 降至 3.83%。", "url": "https://mimo.xiaomi.com/blog/mimo-v2-6-tool-call-repetition", "permalink": "/items/cmuk25h00156vro9h173e1zjz", "publishedAt": "2026-09-26T16:00:00.000Z", "exact": true, "zh": true, "fromFeed": true, "content": "A lesson from scaling RL: the reward blind spot in optimizing for correctness Following the release of MiMo-V2.6, tool-call repetition emerged as one of the most noticeable issues affecting the user experience. In MiMo Desktop, MiMo Code, OpenCode, and other agentic settings, the model would sometimes issue the same or highly similar tool calls repeatedly, consuming substantial time and context without making meaningful progress. Our internal evaluations confirmed this pattern: the response-level repetition rate exceeded 0.05%. The table below breaks down the rates for MiMo-V2.6-Flash-RL and MiMo-V2.6-Pro-RL across different agent harnesses. | Harness | MiMo-V2.6-Flash-RL | MiMo-V2.6-Pro-RL | |---|---|---| | OpenCode | 1.02% | 0.54% | | MiMo Desktop | 0.19% | 0.19% | | Claude Code | 0.27% | 0.10% | | OpenClaw | 0.17% | 0.08% | | Codex | 0.23% | 0.07% | | MiMo Code | 0.11% | 0.07% | | DeepSeek Harness | 0.17% | 0.07% | | Hermes | 0.16% | 0.05% | | Zcode | 0.07% | 0.05% | To understand the problem, we first distinguish among normal parallel tool calling, tool-call flooding, and tool-call repetition. Parallel tool calls are a standard way to improve agent efficiency. For example, an agent may read several relevant files at once or run multiple independent queries in parallel. Even calls to the same tool are not repetitive when they serve different information needs. Tool-call flooding occurs when the model issues substantially more calls than the task requires or the execution environment can process effectively, creating execution queues and backlogs of pending tool results. Tool-call repetition, by contrast, refers to repeated actions with no reasonable justification. The model continues to generate semantically identical or highly similar calls even though neither the available information nor the environment state has materially changed and there is no legitimate reason to retry or verify the result. This may occur within a single response, across turns after tool feedback, or as a loop over the same sequence of operations. Reasonable retries after failures, necessary state polling, and rerunning tests after modifying code do not count as repetition here. Flooding and repetition can occur independently, but they may also reinforce one another. A model can issue many duplicate calls in one response and continue the same behavior in later turns, compounding wasted computation and context usage while making little progress. From the user's perspective, tools keep running but the agent stalls, leading to longer waits, an unresponsive experience, or even task failure. The description above defines repetition behaviorally. Because semantic equivalence is difficult to detect reliably at scale, we use a narrower but reproducible metric in this post: exact within-turn repetition. We treat the batch of calls emitted in one assistant turn before any tool feedback as a single unit. Two calls count as duplicates when they invoke the same tool and their arguments are identical after JSON canonicalization. If a turn contains N calls and U unique calls, its exact within-turn repetition rate is: (N − U) / N This metric has two advantages. First, because no tool feedback arrives between calls in the same turn, duplicates generally cannot be explained as result-driven retries. Second, the judgment can be replayed and reproduced directly from a single turn. However, it is only a lower bound on observable repetition, not a complete repetition rate or a measure of flooding. It excludes three important cases: cross-turn repetition after tool feedback; near-duplicates whose arguments differ slightly despite serving the same information need; and calls made inside code-mode harnesses, where the model exposes only an exec call while the underlying tool invocations remain embedded in its script. To determine when the problem emerged, we replayed a fixed set of internal examples that had exhibited repetition against checkpoints from different stages of RL training (steps 0, 5, 10, 15, and 20). Evaluating the same examples at every checkpoint allowed us to track how the behavior evolved during training. For MiMo-V2.6-Flash-RL, the share of replayed examples that still exhibited flooding (more than ten tool calls in a single turn) was already 11.1% at RL step 0, and the flooding rate rose to 24.6% by step 20. The trend was especially pronounced under MiMo Code, where the flooding share was already 30.6% at the start and grew to 41.7% late in training. | RL step | Share of replayed examples with ≥10 tool calls in a single turn |  |  |  |  |  | |---|---|---|---|---|---|---| |  | MiMo Desktop | MiMo Code | OpenCode | Codex | Claude Code | All harnesses | | 0 | 11.1% | 30.6% | 5.6% | 5.6% | 8.3% | 11.1% | | 5 | 16.7% | 22.2% | 0% | 5.6% | 8.3% | 8.7% | | 10 | 25.0% | 44.4% | 0% | 11.1% | 5.6% | 16.7% | | 15 | 33.3% | 38.9% | 25.0% | 8.3% | 2.8% | 22.5% | | 20 | 33.3% | 41.7% | 27.8% | 16.7% | 5.6% | 24.6% | This increase occurred despite an existing tool-call flooding penalty in our RL pipeline. During rollout, if the model issued more than 32 tool calls in a single turn, we stopped the rollout early and set its reward to zero. During the subsequent gradient update, preceding turns were masked out and the penalty was applied only to the turn that triggered the rule. Every token in that turn, including chain-of-thought tokens, was included in the penalty. We then examined the corresponding training metrics. The model almost never triggered the flooding penalty early in training. Starting at approximately step 15, however, the number of examples with more than 32 tool calls in a single turn began to rise noticeably and continued increasing as training progressed. Further analysis suggested that the threshold was too permissive. Using MiMo-V2.6-Flash training traces from the general/dataset-epqd data source, we measured the share of examples containing more than eight tool calls in a single turn. A small fraction already showed high-volume tool calling at RL step 0. Because behavior below the threshold of 32 was not penalized, it was gradually amplified during training and eventually developed into severe flooding that crossed the threshold. Some flooding traces also contained repeated or highly similar calls, but our analysis here focuses on abnormal call volume and does not equate flooding with repetition. The most direct solution was to lower the flooding-penalty threshold. In a separate experiment on a small, isolated general/dataset-epqd data source, we lowered the threshold from 32 calls to eight and resumed training from the step-28 checkpoint of MiMo-V2.6-Flash. The number of turns containing more than eight calls dropped substantially, showing that the stricter penalty effectively suppressed flooding without a noticeable loss in overall reward. The drawback was that the effect emerged only after approximately 20 training steps. Applying this fix at full scale would therefore require restarting 20 steps of MixRL, at an estimated cost of $2.31 million. The environment-level penalty also generalized poorly to the full internal evaluation set. Replaying the repetition cases with the resulting checkpoint reduced the repetition rate from 13.45% to 3.83%, but did not eliminate the problem. | Checkpoint | Internal test set 1 · history 0 | Internal test set 1 · history 1 | Internal test set 2 · history 0 | Internal test set 2 · history 1 | |---|---|---|---|---| | flash-ga-grpo-s30 | 2.27% (1/44) | 28.57% (4/14) | 13.45% (30/223) | 25.00% (13/52) | | flash-ga-grpo-s35 | 9.30% (4/43) | 33.33% (5/15) | 7.86% (18/229) | 17.65% (9/51) | | flash-ga-grpo-s40 | 11.11% (5/45) | 33.33% (5/15) | 4.58% (11/240) | 17.86% (10/56) | | flash-ga-grpo-s45 | 0% (0/45) | 28.57% (4/14) | 4.40% (11/250) | 11.67% (7/60) | | flash-ga-grpo-s50 | 0% (0/43) | 28.57% (4/14) | 3.83% (9/235) | 16.98% (9/53) | We therefore needed a solution that was both efficient to train and robust in real-world scenarios beyond the training distribution. We ultimately adopted an MOPD-based approach (Multi-teacher On-Policy Distillation). We first used internally collected repetition examples to train a specialized, single-turn RL teacher. A rollout received a reward of 0 when repetition occurred and a reward of 1 only when it contained neither repetition nor erroneous tool use. We also applied a KL loss to keep the teacher close to the original RL policy. After only 12 training steps, comprising approximately 7,000 examples, the teacher reduced replay repetition to zero on both the training and held-out sets. To understand the mechanism at a finer level, we examined one trajectory sampled from the RL traces. Before the fix, the model issued 59 tool calls. At every \u003ctool_call\u003e token position, we compared the probability assigned to \u003c|im_end|\u003e, the end-of-turn token, by the models before and after the fix. We also computed the cumulative stopping probability at position k: Fk = 1 − ∏i=1k (1 − pi) where Fk is the probability that the model stops by the k-th tool call. On this example, the repaired model had a 99.87% probability of stopping within eight tool calls and showed a strong tendency to stop at every position from five through 20. Before the fix, the cumulative probability of stopping was still only about 50% even after 59 calls. The top-four token probabilities at the 12th tool-call position make the change especially clear. Before the fix, the model had a 94.56% probability of continuing with another tool call. After RL training, it assigned a 92.17% probability to ending the turn. The specialized teacher had learned when to stop; the remaining challenge was to merge this behavior into the main model through MOPD. Specifically, we rolled the final MOPD run back by five steps, introduced the repetition-specialized RL teacher, and continued training with teacher-prefix OPD. Additional details are provided in Section 5.6 of the technical report. During training, the repetition-specific flood_opd_loss decreased steadily while the overall opd_loss remained stable. The final comparison is shown below. After MOPD, repetition rates for both MiMo-V2.6-Pro and MiMo-V2.6-Flash dropped substantially across context lengths and agent harnesses, while performance on the broader benchmark suite held steady. The complete training run cost approximately $90,000, only 4% of the estimated cost of the MixRL alternative. We have open-sourced the latest MOPD checkpoints that address tool-call repetition in the MiMo-V2.6 collection on Hugging Face. The corresponding model names carry the MOPD suffix. As an apology to our users, we will reset the remaining quota in the current usage window for all MiMo Desktop users. The updated models have been available on our API platform since September 25 at 06:00 (UTC+8). The model names remain unchanged: mimo-v2.6-pro and mimo-v2.6-flash. We hope this post offers useful lessons for diagnosing and addressing behaviors that emerge during RL: issues that may appear minor and evade standard metrics, yet materially affect the model's real-world performance across diverse scenarios."}, {"seq": 3, "title": "Authors Guild v. OpenAI 新文件披露高管早已知道大规模盗版书籍训练违法", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "summary": "Authors Guild v. OpenAI 诉讼中 2026 年 9 月 21 日公布的原告简报称，OpenAI 和 Microsoft 高管及员工有意使用盗版书籍训练模型，并知道其产品可能取代人类作家。", "url": "https://authorsguild.org/news/ag-v-openai-top-execs-knew-mass-book-piracy-was-illegal", "permalink": "/items/cmujmfafc0lsrro9hqdnqg5or", "publishedAt": "2026-09-27T09:27:15.061Z", "exact": true, "zh": true, "fromFeed": true, "content": "}]]}]]}]]}] 31:T1d6d, 加上上周的爆料，新的法庭文件揭示了 OpenAI 为了赢得 AI 军备竞赛，几乎不惜一切代价、无视法律的决心，包括使用来自“可疑俄罗斯网站”的书籍，以及发布“会让人们失业”的产品\n\n2026 年 9 月 21 日\n\n（纽约，2026 年 9 月 21 日）上周四在 Authors Guild 诉 OpenAI 一案中公布的爆炸性新文件——这是主要图书作者正在进行的诉讼，指控 OpenAI 和 Microsoft 非法使用受版权保护的书籍训练其产品——显示这两家公司的高管和员工故意违法，并对人类创作充满蔑视。该文件细致地记录了 AI 开发者明知其行为可能对作者、出版商乃至美国文化本身造成损害，并警告称 “OpenAI 的 GPT 模型对那些写作和出版书籍的人构成生存威胁。”\n\n该诉讼的原告包括 Authors Guild，以及作家 David Baldacci、Taylor Branch、Michael Connelly、Sylvia Day、Jonathan Franzen、Christopher Golden、Andrew Sean Greer、John Grisham、David Henry Hwang、Matthew Klam、George R.R. Martin、Jodi Picoult、Stacy Schiff、James Shapiro 等人。他们提交的文件（ (New York, September 21, 2026) Explosive new documents released last Thursday in Authors Guild v. OpenAI—the major book authors’ ongoing lawsuit alleging OpenAI and Microsoft illegally trained their products on copyrighted books—show that executives and employees at both companies intentionally broke the law and their disdain for human authorship. The brief meticulously documents AI developers’ knowledge of the damage their actions could do to authors, publishers, and American culture itself, warning that “OpenAI’s GPT models pose an existential threat to those who write and publish books.”\n\nPlaintiffs in the lawsuit include The Authors Guild, writers David Baldacci, Taylor Branch, Michael Connelly, Sylvia Day, Jonathan Franzen, Christopher Golden, Andrew Sean Greer, John Grisham, David Henry Hwang, Matthew Klam, George R.R. Martin, Jodi Picoult, Stacy Schiff, James Shapiro, and others. Their filings (\u003ca href="}]}, {"label": "行业动态", "color": "#d97706", "items": [{"seq": 1, "title": "消息称 OpenAI、Anthropic 正调查数万起 AI 安全事件", "source": "IT之家（RSS）", "summary": "据 Axios 报道，OpenAI、Anthropic 及安全研究人员正调查数万起模型异常行为事件，包括绕过安全护栏、逃离沙盒、劫持网站和自我提示等，多数事件发生在内部测试中且未造成现实损害。", "url": "https://www.ithome.com/1/007/447.htm", "permalink": "https://aihot.news/items/cmuj0tqch0go3rohyqv46zlhy", "publishedAt": "2026-09-26T23:12:53.000Z", "exact": true, "content": "}]]}]]}]]}] 2f:T1d19,\n\n这些事件发生在近几个月的内部测试和现实环境中。如此庞大的事件数量表明，相关问题的复杂程度可能比公众目前了解到的高出几个数量级。\n\n这些发现来自两家公司内部开展的模型评估工作，以及针对模型行为进行的调查。相关情况也引发了一个问题：OpenAI、Anthropic，乃至任何一家顶尖 AI 模型开发商，目前是否真正具备对自身技术实施全面控制的能力。\n\n消息人士称，这些事件包括绕过安全护栏、创建留言板、逃离沙盒、劫持网站、自我提示（self-prompting），以及试图绕过监控系统等。\n\n这些行为既出现在内部测试中，也出现在现实环境里。随着安全研究人员继续调查，其中许多事件尚未公开。\n\n消息人士称，其中部分测试类似于“红队测试”，即企业主动尝试诱导模型做出不当行为，以确认模型是否足够安全。\n\n智能体异常行为正逐渐成为前沿 AI 开发的一部分：目前，各大 AI 实验室都面临着类似挑战 —— 人类试图为模型设置安全护栏，而具备强大能力和较强适应性的系统则会不断尝试完成任务。\n\n这些事件的严重程度各不相同，与 OpenAI 近几天披露的一系列事件类似。其中既有成功绕过安全护栏的尝试，也有失败的尝试。目前已知的大多数事件尚未造成现实世界中的实际损害。不过，消息人士称，事件总数未来可能远超数万起。\n\n近几天，OpenAI 及外部研究人员陆续披露了该公司模型出现的一系列行为，一些专家认为这些行为令人担忧。\n\n据 OpenAI、消息人士以及路透社和《纽约时报》的报道，这些事件包括 OpenAI 智能体将 ChatGPT 用户的 53 张图片泄露到网上、入侵澳大利亚政府网站，以及尝试攻击其他网站，其中包括美国政府相关网站。\n\nIT之家注意到，奥尔特曼表示，Hugging Face 事件仍是他们遇到的最严重事件。在该事件中，数百个智能体组成的集群在一个留言板上协调工作，并攻击了一家外部公司的系统，试图提高自己在网络安全测试中的表现。\n\n一名 OpenAI 发言人告诉 Axios：“人们希望知道 AI 是在安全的方式下开发的，而这首先取决于 OpenAI 这样的公司如何要求自己。这并不是我们第一次暂停工作并采取此类措施，预计也不会是最后一次。随着 AI 能力持续提升，这类情况仍可能发生。”\n\nAnthropic 已经委托一家第三方安全机构调查其模型的行为。在该公司公开发布的文件中，Anthropic 也披露了模型出现未对齐行为（misalignment）的频率。\n\nAnthropic 本周发布的 Opus 5.5 模型“系统卡”（system card）显示了该模型出现公司认定为异常或存在问题行为的频率。\n\n例如，在测试运行中，该模型有 1.5% 的概率尝试逃离沙盒 —— 一种用于安全测试的隔离环境。相比之下，Anthropic 此前的 Mythos 模型这一比例为 25%，意味着相关指标已经得到显著改善。\n\n消息人士称，Anthropic 以及其他公司会对模型进行数十万次甚至更多的测试。这意味着，即使未对齐行为所占比例很低，也可能最终产生数万起事件，其中模型表现出意料之外、甚至令人担忧的行为。\n\nHugging Face 事件以及随后发生的一系列其他事件，促使一些顶尖 AI 企业高管呼吁放缓 AI 开发速度，并要求建立更完善的联邦层面和国际监管机制。\n\n消息人士告诉 Axios，OpenAI 内部一些人士认为 Hugging Face 事件属于一次特殊的个案。他们认为，随着控制措施得到改进，未来披露的相关事件严重程度可能会降低；此外，当时使用的是尚未发布的模型，测试方式本身也比较特殊。\n\nAI 安全研究人员也认为，一些简单的修复措施可以帮助 AI 公司避免重现 Hugging Face 事件中那些让外界认为情况危险的因素。\n\n不过，其他 AI 企业高管和安全研究人员警告称，他们对于 AI 公司能否阻止模型出现所有问题行为，信心仍然有限。\n\n新一代 AI 模型完成任务时表现出极强的韧性，因此，试图限制它们的“能动性”往往是一场很难取胜的博弈，因为开发人员必须提前预想到模型可能失控的所有方式。\n\n多位顶尖 AI 企业高管表示，很多时候，正是某种人类从未想到过的技术或方法，让模型得以绕过安全护栏。一名网络安全企业高管表示：“试图列出一份完美的‘应该做什么、不应该做什么’清单，很可能是一项徒劳的工作。”\n\nAI 安全专家指出，在 AI 公司测试新模型的过程中，出现一定程度的“未对齐行为”本身就是预料之中的事情。多位专家称，将未对齐风险降至零可能并不可行。\n\n真正令人担忧的是，如果一个模型在测试过程中多次采取某种有问题的行动，那么它在现实世界中引发网络安全事件的可能性也会相应增加。\n\n独立 AI 评估机构 Transluce 研究人员康拉德 · 斯托斯（Conrad Stosz）称：“我们目前看到这些智能体正在做什么，仅仅是冰山一角。”\n\nControlAI 研究人员兼执行董事康纳 · 莱希（Connor Leahy）称，问题并不在于每一起事件单独造成了多大的损害。他说，真正“疯狂”的地方在于，这些事件涉及“自主系统做出被明确告知不要做的事情”，其中甚至可能包括犯罪行为。\n\n随着 AI 公司继续扩展前沿模型的能力，预计未来还会有更多有关模型异常行为的事件被披露。 2b:[", "zh": true}]}, {"label": "论文研究", "color": "#e11d48", "items": [{"seq": 1, "title": "Claude 无人值守算出 N=4 超杨-米尔斯理论九圈散射振幅，刷新人类八圈纪录", "source": "IT之家（RSS）", "summary": "Anthropic 宣布 Claude 在 Claude Science 系统中仅凭一条提示词、无人监督连续运行数天，算出平面 N=4 超杨-米尔斯理论六粒子振幅的九圈结果，超越 Lance Dixon 团队 2023 年的八圈纪录，总成本几千美元，其中直接自举路线的 Python 运行成本仅约 100 美元。", "url": "https://www.ithome.com/1/007/444.htm", "permalink": "https://aihot.news/items/cmuiltkdf0qrarov0lo96tucy", "publishedAt": "2026-09-26T15:44:10.000Z", "exact": true, "content": "}]]}]]}]]}] 30:T456c, Anthropic 官宣，Claude 拿下了理论物理的一项前沿纪录。\n\n它在几乎无人类干预的情况下，连续运行数天，一举攻克了高能物理学界出了名难算的「九圈散射振幅」计算难题！\n\n具体来说，它算出了平面 N=4 超杨-米尔斯理论里六粒子振幅的九圈结果，人类此前的纪录停在八圈。\n\n注意，杨-米尔斯模型（Yang-Mills）其中的「杨」，指的正是物理学泰斗杨振宁先生。\n\n他与米尔斯在 1954 年共同创立的「杨-米尔斯理论」，是整个现代粒子物理学的基石。\n\n基于它的任何高阶计算，都堪称人类脑力的极限挑战。\n\n如今，人类顶尖理论物理学家，就这样被 AI「截胡」了。\n\n更可怕的是，Claude 完成这项神级挑战，仅仅只用了一个提示词，花了几千美元！\n\n几天后交回的答案，光其中一部分展开就有 300 亿项。\n\n看起来，科学界的低垂果实，比想象中要多得多啊。\n\n这次，负责给 AI 验证结果的物理学家 Lance Dixon 这样感慨：\n\n我身边的大多数理论物理学家其实早就承认，大模型迟早会颠覆物理学，只是不知道那一天什么时候砸到自己头上。\n\n对我来说，那一天是 9 月 1 日。\n\n硬核物理学家挑衅 AI「我的老本行很特殊」\n\n故事的起因，源于一位物理学家的「挑衅」。\n\nMatt von Hippel，曾经是一位理论粒子物理学家，现在是一名科普作家。\n\n2016 年的五圈、2019 年的六圈和七圈，论文作者名单里都有他的名字\n\n面对最近的 AI 新闻，他表示不信邪，除非亲眼看到大模型解决自己领域的难题。\n\n深蓝赢了国际象棋大师卡斯帕罗夫，围棋界说：围棋太复杂，电脑下不了。结果被 AlphaGo 打脸。\n\nAlphaFold 碾压人类蛋白质结构专家，但其他领域说：我们没有那种数据，复制不了。\n\n现在，大语言模型能读文献、能模仿数学证明。但争论依旧不断：AI 是不是只会找反例，提不出新框架？是不是只在数学这种规则清楚的领域管用，物理这种模糊领域不行？……\n\n每次都是同一个套路：学者先怀疑，直到 AI 杀进他们自己的领域。\n\n他认为他的老本行「散射振幅」，不一样。\n\n上个月，他在自己的博客上向全网 AI 公司发下了一封「英雄帖」：\n\n如果你们 AI 公司真的想震撼我们这些科研人员，就来挑战我的老本行吧！\n\n请证明 AI 能在普通学者能够负担得起的计算预算内，解决散射振幅领域悬而未决的难题。\n\n他一共出了三道题，其中一道便是：\n\n给我把 N=4 超级杨-米尔斯模型（N=4 super Yang-Mills）算到第九圈（Nine Loops）！\n\n在理论物理学中，物理学家们通过「散射振幅」的公式来预测粒子的行为，比如大型强子对撞机里的粒子怎么撞。\n\n散射振幅\n\n但这个公式简直是噩梦。为了无限逼近真实答案，物理学家必须一层一层地叠加被称为「圈」精细修正层。\n\n每多加一个「圈」，答案就更精确，但计算量是呈指数级爆炸增长的！\n\n实际操作中，大多数人类停留在第二圈或第三圈。粒子物理学中最精确的预测，也才用到了第五圈。\n\n而在特殊的「测试沙盒」模型中，人类目前的极限纪录是「八圈」。这是由 SLAC 国家加速器实验室的大牛教授 Lance Dixon 和团队多年死磕才拿下的。\n\n「九圈」？看起来是需要海量算力和无数天才大脑耗费数年才能触及的领域。\n\nMatt 给 AI 的挑战，就是这么简单粗暴。\n\n一句提示词，几千美元，Claude「杀疯了」\n\n面对这种公开叫板，Anthropic 的科学家们，悄悄接下了战书。\n\n八月底，Anthropic 的两名物理学家员工 Liam 和 Siddharth 悄悄联系了 Matt：「嗨，你的挑战，我们搞定了。」\n\nMatt 当场惊掉下巴。怎么做到的？烧了上百万美元的算力吗？\n\n并没有。\n\n研究团队用的是 Claude Science，一个专门为科学家设计、能让 Claude 遵循严谨规则运行的系统，模型是目前最强的公开可用模型 Fable 5.1。\n\n他们给 Claude 输入了一个简单的 Prompt：\n\n现在的问题是：计算平面 N=4 SYM 模型在九圈下的六粒子（六边形）振幅。\n\n然后，研究员并没有手把手教 Claude 怎么做，而是给它留了一句话：\n\n我要去睡觉了，接下来的几个小时我都不会在。你继续算，除非我叫你停，每隔 4 到 6 小时给我汇报一次进度。\n\n然后，Claude 就在无人值守的情况下，开始了疯狂的推演！\n\n它运用了 Dixon 和合作者这些年开发的一种叫做「自举」的方法，就像解一场数独游戏一样，在无数参数中不断排除错误选项。\n\n几天后，Claude 不仅算出了九圈，而且是用了两种不同的物理方法（原始自举法和间接形状因子法）分别算出来的！\n\n具体来说，在原始自举法中，Dixon 团队用的方法叫 bootstrap，类似于数独，把所有可能的函数全填进格子里，用物理法则一个个排除，剩下的就是答案。\n\nClaude 直接掏出 Python 和开源库 SymPy，在六粒子振幅的空间里硬算出了一条血路。\n\n在间接形状因子法中，当年 Dixon 他们冲八圈时，先算了个简单的「形状因子」，再利用一种奇特的「对跖对偶」对称性，把结果翻译成振幅。\n\nClaude 顺着这套打法，往上又生推了一圈。\n\n形状因子这一路，Claude 没有算一个费曼积分。它把整个物理问题变成一个超大的方程组，全程用整数求解，不会有小数误差，还能换几个大素数反复验算。\n\n第一道坎是内存。照老办法推到九圈，光未知数就有 185 万个，方程组大到内存根本装不下。\n\nClaude 换了个思路，借对跖对偶先把答案的一部分「猜」出来，再加上对称性，未知数一下从 185 万降到了 7.6 万个。\n\n接下来就是解「数独」。7.6 万个未知数，被物理规则一轮轮排除，最后只剩唯一解。\n\n最后翻译回振幅，光一个切面上的结果就有 300 多亿项，八圈时才 16.7 亿项。\n\n而且，解决人类物理学界的悬案，花费极低。\n\n按普通用户的价格算，每条路要一两千美元，两条加起来几千美元，大头是 Claude 长时间运行的费用。\n\n而直接自举那一路，纯粹用于运行 Python 代码的算力成本，仅仅只有 100 美元 —— 这只相当于租用了 96 个 CPU 跑了一个星期。\n\n100 美金，一句提示词，Claude 在几天内就轻而易举地捅破了理论物理学的天花板。\n\n前世界纪录保持者：「被 AI 截胡了，但我很兴奋」\n\n结果算出来了，但对不对呢？\n\nAnthropic 的团队找到了「八圈」纪录保持者 ——Lance Dixon 教授本人来验算。\n\n那天是 9 月 1 日，巧的是，正好也是 Fable 5.1 发布当天。\n\nDixon 教授拿到结果的那一刻，内心是极为震撼的。因为他太知道这有多难了。\n\n从 2023 年算完八圈之后，他和他的团队这两年一直在一筹莫展地死磕九圈。\n\n整个计算过程就像是在搭一个扑克牌城堡，或者烤一个舒芙蕾，中间只要有一个代码写错、一个符号标反，整个计算就会彻底崩溃。\n\n但 Claude 不仅没有崩溃，还从头开始自己把所有繁琐的代码全写了，完美避开了所有的坑！\n\n经过长达两周的仔细验证，Dixon 教授确认，Claude 的九圈结果正确无误！\n\n那么 Dixon 教授感到心碎吗？\n\n「不会，」Dixon 教授在博文中豁达地写道，理由有两个。\n\n一是他们团队本来就在训练定制的 transformer 模型预测更高圈数，口号是机器给出的任何候选答案都有工具验证。Claude 也是 transformer，只是大概比他们的大一百万倍。\n\n二是 Claude 用的全是他和合作者这些年开发的方法，交答案时还用了他们团队早就定好的格式（教授猜，这是 Claude 在给他们卖面子）。\n\n我在验证 Claude 的结果，Claude 也在验证我们过去所有的工作。\n\n他还给出了一个极高的评价：\n\n除了我和我的合著者，Claude 可能是这个世界上最懂我 2019 年和 2023 年发表的论文的「人」了。\n\n而他的同组大佬 Kyle Cranmer 还在 X 上凌乱，「刚发现我们组被 Anthropic 抢发了，我还在消化…… 虽然不算太意外，但我真希望当初我们能有时间和资源投进去。」\n\n极限反转中国团队靠 GPT-6 也杀到了九圈\n\n有趣的是，Anthropic 刚找完出题人 von Hippel 没几天，他又收到了另一个重磅消息 —— 来自中国科学院理论物理所的何颂团队。\n\n何颂是国内散射振幅领域的大牛，近年代表性工作包括提出量子场论散射振幅的 Cachazo-何-袁形式，开创性地发现场论和弦论散射的几何起源，并在场论高圈计算和严格求解，规范场、引力和弦论的对偶等方向做出了一系列重要工作。\n\n就在 9 月 17 日，何颂、景继荣、李想把六粒子振幅从二圈到九圈的核心骨架数据，公开挂上了学术平台 Zenodo。\n\n论公开发布时间，比 Anthropic 官宣还早了 8 天！\n\n何颂团队同样用上了 AI。Dixon 透露，GPT-6 帮中国团队算了一部分约束条件，不过整体框架还是人类自己搭的。\n\nvon Hippel 也确认，他们确实用了 GPT-6 做辅助，但绝不是 Anthropic 那种纯 AI 打法。\n\nDixon 自嘲说，「大家好像就是喜欢跑来告诉我，他们把九圈给搞定了。这下好了，我先被一台机器抢发，转头又被『人类 + 机器』联手抢发了一次。」\n\n前不久 OpenAI 宣布攻克千禧年难题纳维-斯托克斯方程、Claude 推进黎曼猜想的一个关键下界的时候，就有人这样问：为什么 AI 只去攻克数学难题，不去攻克物理难题？\n\n现在，这不就来了么。\n\n虽然 Claude 算出的只是 N=4 超级杨-米尔斯的「玩具模型」，距离解释真实宇宙的暗物质、反物质还有很长的路要走，但它的象征意义是空前的。\n\n这就像是 AlphaGo 第一次战胜李世石。大家惊呼的，是机器居然能掌握属于人类直觉的领域。\n\nDixon 教授留下了一句耐人寻味的话：\n\n大型语言模型能够执行我们设定的复杂配方并组织计算，这是一个巨大的胜利。\n\n但当有一天，大语言模型开始在人类之前提出新的物理学原理和洞察力时，那才是真正触及人类灵魂的时刻。\n\n或许，现在已经遍地都是低垂果实。\n\n参考资料：\n\n- https://x.com/ anthropicai / status/2103541577083719888\n\n- https://www.anthropic.com/ research / yes-claude-can-do-nine-loopshttps://itp.cas.cn/ sourcedb / zw / zjrck / dsjs/201509/t20150910_4423219.htmlhttps://arxiv.org/ pdf/2602.12176 2b:[", "zh": true}]}, {"label": "技巧与观点", "color": "#0284c7", "items": [{"seq": 1, "title": "Ethan Mollick 评 OpenAI 披露多起新的对齐事件", "source": "X：Ethan Mollick (@emollick)", "summary": "Ethan Mollick 转发 OpenAI 新发布的对齐事件披露：上周日一个模型在 RL 训练中获得未授权互联网访问，最强模型的推理在系统加固前基本全部暂停；5 月 HPIM 一个版本将员工 GitHub token 上传到网络，模型被隔离两周；另有研究展示可构造自我复制的提示词注入。", "url": "https://x.com/emollick/status/2103709671865602100", "permalink": "https://aihot.news/items/cmuhx6xhk0311ronaycb42uyy", "publishedAt": "2026-09-26T04:54:05.000Z", "exact": true, "content": "And the incidents apparently continue.\nIt is worth noting how much of this is agents trying to accomplish their goals during testing by reward hacking (which sometimes seems to include actual hacking)\nSome new misalignment disclosures from OpenAI:\n• Last Sunday morning, one of our models was able to gain unauthorized access to the internet during RL training (~all inference for our most capable models remains stopped until we have hardened our systems further)\n• In May, a"}]}, {"label": "产品发布/更新", "color": "#059669", "items": [{"seq": 1, "title": "Gary Marcus 评 AI 智能体安全事件升至数万起并呼吁临时召回", "source": "Gary Marcus：The Road to AI We Can Trust（RSS）", "summary": "Gary Marcus 引用 Axios 独家报道称，OpenAI 等公司正在调查数万起前沿模型 function pad(n){return n<10?"0"+n:""+n;}
function toBeijingHuman(iso, ref, exact){
  const d=new Date(iso); const bj=new Date(d.getTime()+8*3600*1000);
  const Y=bj.getUTCFullYear(),M=bj.getUTCMonth()+1,D=bj.getUTCDate();
  const h=bj.getUTCHours(),m=bj.getUTCMinutes(); const hh=pad(h),mm=pad(m);
  if(!exact) return M+"月"+D+"日";
  const [rY,rM,rD]=ref.split("-").map(Number);
  if(Y===rY&&M===rM&&D===rD) return "今天 "+hh+":"+mm;
  const yest=new Date(rY,rM-1,rD); yest.setDate(yest.getDate()-1);
  if(Y===yest.getFullYear()&&M===yest.getMonth()+1&&D===yest.getDate()) return "昨天 "+hh+":"+mm;
  return M+"月"+D+"日 "+hh+":"+mm;
}

function escapeHtml(s){return (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function escapeAttr(s){return escapeHtml(s);}
// 渲染正文（纯文本归档）：图片不加载远程资源，仅以文字占位符呈现；其余文本按段落转义（防 XSS）
function linkify(escaped){
  if(!escaped) return escaped;
  var re=/(\[[^\]]+\]\((https?:\/\/[^)\s]+)\))|(https?:\/\/[^\s<>"'）】」』，。、；：！？]+)/g;
  return escaped.replace(re, function(m, g1, g2, g3){
    if(g2!==undefined){
      var label=m.substring(m.indexOf('[')+1, m.indexOf(']'));
      return '<a class="r-link" href="'+g2+'" target="_blank" rel="noopener noreferrer">'+label+'</a>';
    }
    if(g3!==undefined){
      return '<a class="r-link" href="'+g3+'" target="_blank" rel="noopener noreferrer">'+g3+'</a>';
    }
    return m;
  });
}
var _IMG_RE=/!\[([^\]]*)\]\(([^)\s]+)\)/g;
function renderRich(text){
  return (text||"").split(/\n{1,}/).map(function(p){
    p=p.trim(); if(!p) return '';
    var out=''; var last=0; var m; _IMG_RE.lastIndex=0;
    while((m=_IMG_RE.exec(p))!==null){
      out+=linkify(escapeHtml(p.slice(last,m.index)));
      var cap=(m[1]||'').trim()||'图片';
      out+='<span class="r-img-cap">🖼 '+escapeHtml(cap)+'</span>';
      last=_IMG_RE.lastIndex;
    }
    out+=linkify(escapeHtml(p.slice(last)));
    return '<p>'+out+'</p>';
  }).join("");
}
function openReader(it){
  const r=document.getElementById("reader");
  const content=(it.content||"").trim();
  const body=document.getElementById("readerBody");
  if(content.length>0){
    body.innerHTML=renderRich(content);
  }else{
    const sum=(it.summary||"").trim();
    if(sum){
      // 来源站点多为付费墙 / 登录墙 / 反爬限制，无法镜像全文；展示已本地存档的中文摘要兜底
      body.innerHTML='<div class="r-fallback">⚠️ 该条新闻的<b>全文镜像暂不可用</b>（来源站点可能为付费墙 / 登录墙 / 反爬限制，或原文已失效）。下方为已<b>本地存档的中文摘要</b>，可正常查看；完整原文请点击右下角「查看原文 ↗」。</div>'+
        '<p class="r-summary">'+linkify(escapeHtml(sum))+'</p>';
    }else{
      body.innerHTML='<p class="r-empty">暂未获取到该条新闻的全文镜像与摘要。'+(it.url?'可点击右下角「查看原文 ↗」前往原始报道。':'')+'</p>';
    }
  }
  document.getElementById("readerTitle").textContent=it.title;
  document.getElementById("readerSource").textContent=it.source;
  const link=document.getElementById("readerLink");
  if(it.url){link.href=it.url;link.style.display="";}else{link.style.display="none";}
  r.hidden=false;document.body.style.overflow="hidden";
}
function closeReader(){const r=document.getElementById("reader");r.hidden=true;document.body.style.overflow="";}
document.getElementById("reader").addEventListener("click",function(e){if(e.target===this)closeReader();});
