const DATA = {"meta": {"reportDate": "2026-05-04", "reportDateHuman": "2026年5月4日", "weekday": "星期一", "total": 9, "source": "AI HOT", "sourceUrl": "https://aihot.virxact.com", "generatedAt": "2026年08月01日 02:21"}, "sections": [{"label": "产品发布/更新", "color": "#059669", "items": [{"seq": 1, "title": "从单张图像构建实时视频智能体：Runway Characters技术解析", "source": "Runway：News（网页）", "summary": "Runway公司推出“Characters”实时视频智能体，它能将任意单张参考图像（如真人、卡通或幻想生物照片）实时转化为具有自然对话表现力的视频角色。该技术基于其通用世界模型GWM-1，无需微调即可生成每秒24帧的高清视频，并同步口型、表情和头部运动。其核心突破在于通过自回归逐帧生成、流程优化与并行化，实现了每帧仅37毫秒的模型处理时间，以及从用户停止说话到角色开始响应仅1.75秒的服务器端延迟，从而满足了实时交互对话的严苛要求。", "url": "https://runwayml.com/news/building-runway-characters", "permalink": "https://aihot.virxact.com/items/cmosfkc17006tslzd4cgxgzc9", "publishedAt": "2026-05-04T00:00:00.000Z", "exact": false, "content": "我们如何构建了一个实时视频智能体，能将任意单张图片——无论是逼真的人类、卡通吉祥物还是奇幻生物——转化为以24fps运行、具备完整表现力的对话角色，且端到端延迟极低，无需任何微调。\n\nRunway Characters是一个实时视频智能体，能将单张参考图片转化为一个完整表现力、可对话的视频角色。它基于我们的通用世界模型GWM-1构建，能够以24帧/秒（fps）的高清画质生成自然的唇形同步、面部表情和头部动作。\n\nCharacters每帧的有效模型处理时间为37毫秒（运行速度超过24fps），从用户停止说话到角色开始回应的服务器端周转时间为1.75秒。\n\n本文将介绍Characters的独特之处：它能驱动的角色范围之广、我们如何实现实时性能，以及我们围绕该模型构建的产品生态。\n\nCharacters的输入是单张参考图片，仅此而已。系统直接从图片中提取风格，并立即开始基于实时音频生成对话视频。\n\n以下是720p片段，展示了Characters如何驱动单张参考图片跨越多种风格——从逼真人类到卡通、生物和品牌吉祥物——实现自然且富有表现力的对话。\n\n24fps实时运行：Characters每帧的有效模型处理时间为37毫秒（ms），从语音结束到首个响应帧的服务器端周转时间为1.75秒。\n\n在交互式对话循环中以24fps生成高清视频，与离线视频生成在工程上有着本质区别。离线时，每帧可以花费数秒。而在对话场景中，每帧的预算仅为42毫秒（1/24秒）——这还未计入音频处理、网络传输以及一旦延迟上升就会崩塌的“实时感”感知。在我们的实时会话中，我们实现了每帧37毫秒的有效模型处理时间，以及从用户停止说话到角色开始回应的1.75秒服务器端周转时间（语音智能体+视频管线）。\n\n我们通过GWM-1的自回归逐帧生成来实现这一点：帧按顺序生成，并在生成的同时流式传输到客户端，而不是对整个片段进行迭代去噪。\n\n我们之所以能达到24fps的实时速度，靠的是重叠：扩散Transformer和VAE解码器通过管线拆分并发运行。这使得有效迭代成本更接近max（扩散时间，解码时间），而非扩散时间+解码时间。\n\n每次迭代生成4个像素帧，因此在24fps下，我们需要每167毫秒（4/24秒）进行一次迭代。根据我们的测量，扩散耗时151毫秒，VAE解码器耗时119毫秒；由于解码是重叠的，它基本从关键路径中消失了。这样算下来，每帧的有效模型处理时间为37毫秒（151毫秒/4帧），低于41毫秒/帧的实时预算。\n\n“实时”也体现在用户端到端的感受上：从他们停止说话到角色开始回应的时长。综合来看：1185毫秒（语音智能体）+ 567毫秒（视频管线）= 本次会话中1.75秒的服务器端延迟。客户端与服务器之间的网络在每侧增加200毫秒（往返共400毫秒），具体取决于连接质量。\n\n进一步降低延迟的最大杠杆在于语音智能体：视频管线已经很快，我们预计随着语音智能体响应时间的改善，整体周转时间将进一步下降。\n\n以下是实现这种实时性能的四个关键的模型和系统级优化： 我们在设备间对推理进行分片，主要瓶颈是通信开销。我们将张量并行扩散与VAE解码器流水线化，放在专用设备上，这样解码就不会与Transformer争抢资源。自回归视频每帧都会增长KV缓存。高效的驱逐/压缩策略在保持时间一致性的同时，不牺牲吞吐量。在某些分辨率下，内核启动开销可能成为主导因素。我们将前向传播捕获为静态CUDA图以减少开销，并严格限制形状和内存约束。\n\n我们针对硬件调整注意力/矩阵乘法内核，以降低延迟和内存流量。使用融合的Triton内核有助于保持关键路径的高速运行。实现24fps的实时角色视频只是成功的一半。要构建一个真正有用的实时视频代理，你还需要周边的产品功能：将角色锚定在你的业务领域的方法、将其连接到真实应用，以及将其部署到对话实际发生的场景中。在会话期间，角色可以看到你的网络摄像头或共享屏幕，以支持视觉工作流，如辅导、演示、游戏和设计反馈。\n\n角色的声音是其身份和可信度的核心。我们通过文本转语音（从提示词设计声音）和即时语音克隆（从音频样本克隆）两种方式，让你快速获得“合适的声音”，然后将其分配给角色，确保跨会话的音色一致。角色可以在会话中为你执行操作。你可以定义它们被允许使用的“工具”——从UI操作（显示字幕、弹出知识卡片、更新游戏状态）到可信的后端RPC（例如fetch_order_status以获取真实状态/预计到达时间），这些结果会反馈到对话中。附加你自己的文档（文本/Markdown），让角色能够基于你的公司和产品知识进行对话——支持文档、常见问题解答、内部政策、规格说明等——而不是给出泛泛的回答。\n\n只需一行代码，即可将实时角色嵌入任何Web应用。该组件为你处理实时通信的底层细节，让你在几分钟内就能嵌入虚拟形象。将角色带入Zoom/Google Meet/Teams中的真实会议，让它们能够看到/听到正在发生的事情并实时响应，从团队站会到客户通话都适用。试试Characters吧。和我们一起构建。\n\nRunway Characters现已通过Runway API以及Runway网页和移动应用提供。如果你热爱实时模型、低延迟系统，并希望在技术前沿交付产品——我们正在招聘。", "zh": true}]}, {"label": "论文研究", "color": "#e11d48", "items": [{"seq": 2, "title": "OpenAI的o1系统对急诊患者的诊断准确率为67%，而分诊医生的准确率仅为50%至55%", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "summary": "OpenAI的o1系统在急诊分诊诊断测试中表现优于医生。该系统对急诊患者的诊断准确率达到67%，而分诊医生的准确率仅为50%至55%。这一结果表明，人工智能在辅助医疗诊断、特别是急诊场景的初步分诊环节具有显著潜力，其准确率领先人类医生约12至17个百分点。相关研究由哈佛团队进行，具体数据来自《卫报》的报道。", "url": "https://www.theguardian.com/technology/2026/apr/30/ai-outperforms-doctors-in-harvard-trial-of-emergency-triage-diagnoses", "permalink": "https://aihot.virxact.com/items/cmoq7sxkz12epsll9qj681f38", "publishedAt": "2026-05-04T00:00:00.000Z", "exact": false, "content": "从《急诊室的故事》中的乔治·克鲁尼到《匹兹堡急诊》中的诺亚·怀尔，急诊科医生长期以来一直是受欢迎的英雄。但很快就要到脱下手术服的时候了吗？\n\n哈佛大学一项开创性研究发现，在高压的急诊分诊中，AI系统表现优于人类医生，在患者刚被紧急送往医院、面临生死攸关的时刻，AI的诊断更为准确。独立专家称这些结果显示出AI临床推理能力“真正向前迈进了一步”，这些结果来自将数百名医生的反应与AI进行对比的试验。\n\n研究作者表示，发表在《科学》杂志上的这些结果表明，大语言模型（LLM）“已经超越了大多数临床推理基准”。\n\n一项实验聚焦于76名抵达波士顿一家医院急诊室的患者。一个AI和两名人类医生各自阅读相同的标准电子健康记录——通常包括生命体征数据、人口统计信息以及护士关于患者就诊原因的几句话。AI在67%的病例中给出了准确或非常接近的诊断，超过了人类医生——后者的准确率仅为50%-55%。\n\n结果显示，在需要以最少信息快速做出决策的分诊情况下，AI的优势尤为明显。当有更多详细信息可用时，AI（OpenAI的o1推理模型）的诊断准确率升至82%，而人类专家的准确率为70%-79%，尽管这一差异在统计学上并不显著。\n\n在被要求提供长期治疗计划（如制定抗生素方案或规划临终流程）时，AI也优于更大规模的人类医生群体。AI和46名医生被要求检查五个临床案例研究，计算机制定的方案明显更好，得分89%，而使用搜索引擎等传统资源的人类医生得分仅为34%。\n\n但研究人员表示，急诊医生还不会就此谢幕。该研究仅测试了人类与AI在可通过文本传达的患者数据上的表现。AI对患者痛苦程度和外观等信号的解读并未经过测试。这意味着AI的表现更像是一位基于病历资料提供第二意见的临床医生。\n\n“我不认为我们的发现意味着AI将取代医生，”该研究的主要作者之一、哈佛医学院AI实验室负责人阿尔琼·曼拉伊表示，“我认为这确实意味着我们正在见证一项将重塑医学的深刻技术变革。”\n\n另一位主要作者、该研究开展地波士顿贝斯以色列女执事医疗中心的医生亚当·罗德曼博士表示，AI大语言模型属于“几十年来最具影响力的技术之一”。他说，未来十年，AI不会取代医生，而是会与医生一起加入一种新的“三方护理模式……医生、患者和人工智能系统”。\n\n在哈佛研究的其中一个案例中，一名患者出现肺血栓且症状不断恶化。人类医生认为抗凝药物无效，但AI注意到了人类没有发现的问题：患者的狼疮病史可能导致了肺部炎症。最终证明AI的判断是正确的。\n\n上月发表的一项研究显示，美国近五分之一的医生已在用人工智能辅助诊断。英国皇家内科医师学会最近的一项调查显示，在英国，16%的医生每天使用该技术，另有15%每周使用，其中“临床决策”是最常见的用途之一。\n\n英国医生最大的担忧是AI出错和责任风险。数十亿美元正投入AI医疗公司，但AI出错后果的问题仍悬而未决。\n\n罗德曼表示：“目前还没有正式的问责框架。”他还强调，患者最终“希望人类引导他们做出生死攸关的决定，引导他们度过艰难的治疗决策过程”。\n\n爱丁堡大学医学信息学中心联合主任埃文·哈里森教授表示，这项研究很重要，表明“这些系统不再只是通过医学考试或解决人工测试案例。它们开始看起来像临床医生的有用第二意见工具，尤其是在需要考虑更广泛的可能诊断范围、避免遗漏重要信息的情况下”。\n\n谢菲尔德大学数学与物理科学学院助理教授邢伟博士表示，其他一些研究结果表明，医生可能会无意识地依赖AI的答案，而不是独立思考。\n\n他说：“随着AI在临床环境中越来越常规化使用，这种倾向可能会变得更加显著。”他还指出，研究中缺乏关于AI对哪些患者诊断效果较差的信息，以及它是否在老年患者或非英语使用者身上表现更差。\n\n他说：“这并不能证明AI在常规临床使用中是安全的，也不能说明公众应该转向免费可用的AI工具来替代医疗建议。”", "zh": true}, {"seq": 3, "title": "在谷歌TPU上实现3倍加速：UCSD利用扩散式推测解码优化LLM推理", "source": "Google Developers Blog（RSS）", "summary": "加州大学圣地亚哥分校的研究团队在谷歌TPU上成功部署了DFlash，一种基于块扩散的推测解码方法。该方法突破传统自回归草稿生成的序列性瓶颈，通过单次前向传播并行“绘制”整个候选令牌块，而非逐个预测。系统平均实现了3.13倍的推理加速，峰值性能接近EAGLE-3等现有方法的两倍。这一开源方案已集成至vLLM生态系统，通过利用“免费”的并行验证能力和针对复杂推理任务的高质量草稿预测，显著优化了TPU硬件的利用效率。", "url": "https://developers.googleblog.com/supercharging-llm-inference-on-google-tpus-achieving-3x-speedups-with-diffusion-style-speculative-decoding", "permalink": "https://aihot.virxact.com/items/cmorfwui900bbslahbt29u50b", "publishedAt": "2026-05-04T00:00:00.000Z", "exact": false, "content": "当前大语言模型（LLM）加速领域由自回归推测解码主导，其中轻量级草稿模型在目标模型验证之前逐token进行预测。然而，这种串行草稿生成方式引入了根本性的执行瓶颈：生成K个候选token需要K次顺序前向传播。这种逐步依赖关系迫使系统必须等待每个token预测完成才能开始下一个，从根本上限制了草稿阶段的加速潜力。为了打破这一效率天花板，研究人员将目光从逐token草稿生成转向块扩散（block diffusion），这是一种范式转变，能够在O(1)单次前向传播中生成整个候选token块。\n\n我们很自豪能够支持推动AI硬件边界的外部研究人员。今天，我们非常高兴地重点介绍来自UCSD研究人员的一项重大开源里程碑，该团队由Hao Zhang领导，他是paged attention和prefill/decode分离式服务的共同发明人。他们成功地在Google TPU上实现了块扩散推测解码（即DFlash，一种由UCSD Z Lab的Zhijian Liu、Jian Chen等人开发的卓越扩散式推测解码方法）。\n\n通过将这一新颖架构直接集成到开源vLLM TPU推理生态系统中，UCSD团队在TPU v5p上实现了平均3.13倍的每秒token数提升，对于复杂数学任务，峰值加速比接近6倍。在TPU v5p上DFlash与EAGLE-3的直接服务对比中，DFlash实现了2.29倍的端到端服务加速，几乎是EAGLE-3的1.30倍性能提升的两倍。\n\n以下是UCSD研究人员提供的技术深度解析，详细介绍了他们如何构建这一系统、性能基准测试结果，以及这对Google TPU生态系统未来的意义。\n\n标准LLM推理以自回归方式生成文本。这意味着模型每生成一个token都需要一次完整的前向传播，这严重低估了TPU等AI加速器的大规模并行计算能力，尤其是在较低批处理规模下。\n\n推测解码通过使用一个更小、高效的“草稿”模型（或机制）同时预测多个未来token来缓解这一问题。较大的“目标”模型随后在单次并行前向传播中验证这些草稿token。如果草稿token准确，系统就能以单步成本接受多个token，从而大幅降低延迟。\n\n然而，推测解码的潜力往往受到草稿模型本身的制约。大多数现有方法依赖自回归草稿机制，按顺序生成候选token。这意味着虽然目标模型的验证是并行的，但草稿阶段仍然受限于O(K)次串行步骤的瓶颈。因此，用于“猜测”token的时间开始侵蚀验证所节省的时间，限制了实际加速潜力的上限。\n\n扩散LLM（dLLM）通过引入块扩散机制，从根本上改变了这一顺序生成的过程。它不再逐个猜测下一个词，而是像“作画”一样一次性生成整个块。一个值得关注的基于dLLM的草稿生成方法是DFlash。通过利用从目标模型中提取的隐藏特征，DFlash可以在单次前向传播中生成一整块草稿令牌。这种从O(K)到O(1)复杂度的转变，将草稿生成延迟降低到几乎可以忽略不计的水平，使其成为适配TPU高带宽矩阵乘法单元（MXU）的理想架构。\n\nUCSD研究团队将DFlash集成到了vLLM TPU推理框架中。DFlash是一种新颖的投机解码方法，利用块扩散机制来提出具有极高接受长度（T）的草稿令牌。\n\n在Google TPU上实现这一方案需要深度优化。在Google Cloud工程师的架构指导下，UCSD团队将开销降至最低，确保内存带宽和矩阵乘法单元得到充分利用。通过将DFlash提议器和验证流水线高效映射到TPU架构，他们既最小化了草稿生成阶段的开销，又最大化了目标模型的并行验证吞吐量。\n\n将DFlash从原始的GPU/PyTorch实现移植到Google TPU/JAX AI Stack生态系统，并非简单的代码翻译；这需要重新设计系统，以契合TPU独特的架构优势。以下是UCSD团队如何攻克三大主要技术难题。\n\n在PyTorch环境中，DFlash依赖简单、动态的KV管理。然而，通过tpu-inference实现的高性能TPU服务使用基于Pallas内核的分页注意力机制——该系统将内存划分为固定大小的页面以最大化效率。\n\n问题在于：DFlash的非因果块扩散——正是这一特性使其能够“绘制”一个令牌块——与标准分页注意力机制从根本上不兼容。为解决这一问题，研究人员设计了一种双缓存架构。目标模型继续使用分页KV缓存，确保其受益于大规模服务所需的高性能Pallas内核。草稿模型则使用一条专用路径，采用静态的片上JAX数组，在保持TPU原生性能的同时，成功复现了原始DFlash设计。\n\nDFlash的独特之处在于草稿模型是“目标条件化”的——它通过观察目标模型的中间推理步骤来保持智能。这些“隐藏状态”存储在一个随时间增长的上下文缓冲区中。\n\n为了尽可能加快主机CPU与TPU加速器之间的通信，团队实现了2的幂次填充策略。这确保了当新投影的特征被追加到缓冲区时，它们以优化的块进行传输。通过精确追踪草稿模型已经“消耗”了多少上下文，他们避免了任何重复处理或数据丢失，从而保持了并行草稿生成的高准确性。\n\n与标准草稿生成方法不同，DFlash具有独特的状态性，依赖跨迭代的持久状态（包括上下文缓冲区、KV缓存位置和RoPE偏移）来维持其并行块预测。在TPU优化的vLLM流水线中，转发给提议者的元数据包含了当前正在验证的草稿令牌。虽然这对大多数模型来说是标准做法，但对于基于扩散的架构，这导致了“序列长度膨胀”——内部草稿状态与目标模型现实之间出现错位。\n\n通过重新设计提议者，使其严格与真实接受的令牌计数同步，研究团队恢复了两个模型之间的完美对齐。这一调整使得块扩散逻辑能够在TPU硬件上以完全的数学精度运行，从而释放出最终结果中令人瞩目的加速效果。\n\n为确保严谨公平的比较，UCSD研究人员将DFlash与当前TPU上的主流投机解码方法EAGLE-3进行了基准测试。在这项对比研究中，研究人员对两者使用了完全相同的硬件（TPU v5p）和相同的目标模型（Llama-3.1-8B）。\n\n这一设置代表了两者最实际的部署场景，因为K值的选择基于各自官方开源检查点，开箱即用，无需额外微调或重新配置。像EAGLE-3这样的自回归草稿生成器会产生随K线性增长的顺序延迟惩罚，这通常将其限制在较小的投机预算内以维持低每令牌延迟。相比之下，DFlash使用并行块扩散在单次前向传播中预测所有令牌，使草稿生成成本在很大程度上不受K影响。结果具有决定性：DFlash实现了2.29倍加速，而EAGLE-3仅提供了1.30倍的提升。在mbpp等编码任务上，DFlash将生成时间从每令牌9.81毫秒压缩至3.48毫秒，提升了2.83倍。\n\n为什么差距如此之大？EAGLE-3每步自回归预测2个令牌，需要顺序前向传播，且每一步之间都有Python编排开销。而DFlash在单次前向传播中生成一批10个高质量候选令牌，完全消除了这一串行瓶颈。在TPU上，这种“高质量、高数量”的草稿输出直接转化为更高的平均接受长度，将TPU巨大的计算潜力转化为实际的服务器吞吐量。\n\n为评估DFlash在Google TPU上的影响，UCSD团队在TPU v5p上跨多个领域对其实现进行了基准测试，重点关注复杂推理、数学和编码——这些领域的长上下文生成通常面临高延迟问题。\n\nUCSD团队构建了一个独立的JAX基准来评估DFlash结果。通过剥离服务层的开销，他们能够隔离DFlash-on-TPU算法的原始性能。他们观察到所有数据集的平均加速为3.13倍，在数学推理方面尤为突出。\n\n对于math500等严谨的数学任务，DFlash将生成时间从每令牌8.02毫秒降至每令牌1.40毫秒。在humaneval等编码评估中，生成速度提升了超过3.5倍。\n\n在优化过程中，研究团队发现了一个硬件特性，它改变了工程师对投机限制的思考方式：K-Flat验证。\n\n在数据中心级加速器（如TPU v5p）上，他们的系统性实验揭示了一个令人意外的现实：验证1024个token的成本与验证仅16个token的成本几乎相同。这一现象之所以发生，是因为在高端硬件上，耗时主要被加载模型权重所主导，而非这些序列长度下注意力机制的原始计算量。换言之，硬件的计算上限如此之高，以至于检查一个更长的“猜测”所需的额外工作基本上可以忽略不计。\n\n这一发现彻底改变了整个研究前沿。它证明，投机解码的瓶颈并非“验证成本”，而是“草稿质量”。既然更宽的块在计算上是免费的，开发者就可以大胆扩展草稿块大小，利用更丰富的双向上下文来提升准确性，而无需担心拖慢硬件速度。\n\n尽管数据中心级AI加速器使得增大块大小（K）几乎“免费”，但他们的扩展理论揭示，单纯增加token数量会带来收益递减。在当前运行点上，K=16的块大小已经捕获了理论最大加速比的90%以上。事实上，将K从16一路扩展到128，每步可能只会多接受不到一个token。\n\n性能的真正杠杆在于质量而非数量。他们的分析表明，提升每个位置的接受概率（a）的价值是增大块大小K的2至3倍。这转移了研究焦点：在验证成本恒定的环境中，主要瓶颈不再是系统能检查多少token，而是它们能多准确地预测这些token。LLM服务的前沿在于更智能的草稿训练，而不仅仅是更宽的投机窗口。\n\n接受概率与任务的可预测性密切相关。团队观察到一种自然的“位置衰减”现象，即块末尾的token比开头的token更难猜测。在数学和编程等逻辑驱动的领域中，这种衰减极为缓慢，即使在块深处也能保持较高的接受率。然而，对话式聊天则更具随机性，准确率在最初几个token之后便急剧下降。\n\n这种可预测性直接驱动加速效果。由于结构化推理能产生更可预测的序列，数学和编程任务允许更长的接受块，从而更有效地饱和TPU的并行验证能力。因此，DFlash在数学推理中取得了最高增益，其次是编程，而对话任务则看到较为温和的提升。\n\n这一合作的核心宗旨是丰富开源生态系统。他们没有将其作为内部研究原型保留，而是将完整实现提交至vLLM tpu-inference仓库，涵盖：\n\nUCSD团队正积极致力于添加一个torchax提议器，使DFlash也能在PyTorch服务路径上运行。\n\n这一里程碑为谷歌TPU的下一轮创新浪潮奠定了基础。通过利用DFlash独特的并行采样技术，他们正在为推测性解码（SSD）铺平道路，借助推测缓存大幅降低高吞吐环境中的延迟。为了捕捉更丰富的上下文并提升复杂推理场景下的接受率，他们计划利用TPU RL Stack Tunix和MaxText扩展更宽的草稿块。此外，新开发的高性能JAX内核为支持基于扩散的目标模型提供了坚实基础，使vLLM-TPU生态系统始终处于高效非自回归生成技术的最前沿。\n\n您可以通过Colab Notebook查看底层技术报告和实现细节，或直接浏览vLLM GitHub仓库中的代码。\n\n这项工作得益于TPU Builder计划，体现了我们赋能学术与开源社区、提供高性能硬件和Google Cloud额度的使命。如果您有兴趣将TPU用于研究、教学或开源开发，欢迎联系我们！请发送邮件至tpu-builders-support@google.com与我们取得联系。\n\n致谢：衷心感谢UCSD研究团队，包括Zhongyan Luo、Son Nguyen、Andy Huang。特别感谢Kyuyeun Kim、Brittany Rockwell、Chris Chan、Mitali Singh、Yixin Shi及Gang Ji团队与研究团队合作完成PR落地，同时感谢Josh Gordon、Edgar Chen、Aditi Joshi、Shubha Rao、Mani Varadarajan、Joe Pamer、Fenghui Zhang、Hassan Sipra和Bill Jia对TPU Builder计划研究合作的一贯支持与投入。", "zh": true}]}, {"label": "技巧与观点", "color": "#0284c7", "items": [{"seq": 4, "title": "解决真正工程问题的Agent Skills集合", "source": "X：邵猛 (@shao__meng)", "summary": "作者@mattpocockuk公开了其.claude/目录下的实用Agent Skills集合，旨在解决四大工程痛点：1) 通过/grill-me等技能在动工前对齐需求，修复沟通鸿沟；2) 维护CONTEXT.md与ADR建立共享语言，提升代码一致性；3) 利用/tdd和/diagnose建立快速测试与诊断反馈回路；4) 通过/to-prd、/zoom-out等技能对抗代码熵增，持续投资设计。这些技能分为工程、效率与工具三类，形成从需…", "url": "https://x.com/shao__meng/status/2050892004188692616", "permalink": "https://aihot.virxact.com/items/cmopogquh0y1esll9cth65i6l", "publishedAt": "2026-05-04T00:00:00.000Z", "exact": false, "content": "解决真正工程问题的 Skills：Skills For Real Engineers 作者 @mattpocockuk 公开了自己 .claude/ 目录中每天在用的 Agent Skills 集合，目标读者是在做真正工程的人们，解决真正的工程问题。 # 真正想解决的四类失败模式\n1. Agent 没做对你想要的事 —— 沟通鸿沟\n引用 The Pragmatic Programmer：\"没人确切知道自己想要什么。\" 修复：在动工前先被 Agent 反向拷问。 · /grill-me：通用版逼问 · /grill-with-docs：工程版逼问，同时维护项目术语表与 ADR 这是作者明说的\"最受欢迎的两个 Skill\"。\n2. Agent 太啰嗦 —— 缺少共享语言\n引用 Eric Evans 的 DDD：领域专家与开发者一开始说的就不是同一种语言，Agent 也一样。 修复：项目根目录维护一份 CONTEXT.md（领域词典）+ docs/adr/（架构决策记录）。 作者举了自己 course-video-manager 仓库的例子： · Before：\"a lesson inside a section of a course is made 'real' …\" · After：\"problem with the materialization cascade\" 共享语言带来的连锁收益：命名一致 → 代码可导航 → 思考 token 更少。这一条被作者称为\"整个 repo 里最酷的技术\"。\n3. 代码跑不通 —— 反馈回路缺失\n引 Pragmatic Programmer：\"反馈速率就是你的速度上限。\" 修复：把静态类型 / 浏览器 / 自动化测试的反馈接回来。 · /tdd：强制 red-green-refactor，并明确反对\"horizontal slicing\"（先把所有测试写完再实现）——只能 vertical slice，一次一个 tracer bullet · /diagnose：固定的\"复现 → 最小化 → 假设 → 插桩 → 修 → 回归测试\"诊断循环\n4. 系统变成屎山 —— Agent 加速软件熵增\n引 Kent Beck 与 John Ousterhout：每天投资设计，深模块（窄接口、厚实现）优先。 修复： · /to-prd 在写 PRD 前会问\"这个改动到底碰哪些模块\"； · /zoom-out 强制 Agent 把局部代码放回系统全景里讲； · /improve-codebase-architecture 是\"周期性救火\"——作者建议每隔几天对代码库跑一次。 # Skill 清单结构 仓库分三类，命名上都是 Slash Command 风格： Engineering（日常代码工作） grill-with-docs、tdd、diagnose、to-prd、to-issues、triage、improve-codebase-architecture、zoom-out、setup-matt-pocock-skills Productivity（通用工作流） grill-me、caveman（极简通信模式，省 ~75% token）、write-a-skill Misc（不常用工具） git-guardrails-claude-code、migrate-to-shoehorn、scaffold-exercises、setup-pre-commit 各 Skill 之间不是孤立的，而是一条从对话到落地的流水线： 对齐与设计              落地与守护 ──────              ──────── grill-with-docs   →     tdd ↓                   ↓ to-prd            diagnose ↓                   ↓ to-issues          zoom-out ↓                   ↓ triage   ───→   improve-architecture ↑                   ↓ └──── CONTEXT.md / ADR ──┘ 项目地址 github.com/mattpocock/ski…\n- /grill-me 本质是把 code review 前置到需求阶段。agent 80% 的翻车不是写错代码，是理解错意图。先被拷问再动手，成本低十倍。\n- grill-with-docs 这套跑过类似的。术语表会跟着代码漂，几次重构后 agent 还在用旧词反提问，得加钩子定期重扫。caveman 模式长会话用挺管用，token 紧时优先开。\n- grill-me 和 CONTEXT.md 这两个思路确实硬扎。大部分团队的问题就是跟Agent说不清楚要什么，然后怪Agent不行。其实先让Agent反向拷问你一遍，比直接上手写代码有效太多。\n- 加入对话", "zh": true}, {"seq": 5, "title": "Codex推出开源工具，压力测试初创公司创意", "source": "X：Greg Brockman (@gdb)", "summary": "开发者发布了一款名为“codex-startup-pressure-test-skill”的Codex技能工具，旨在对初创公司想法进行严苛的压力测试。该工具能帮助创业者识别其创意的核心假设、暴露致命缺陷、验证问题真实性、分析真实竞争对手、规划首批10名客户，并定义一个可在两周内完成的MVP（最小可行产品）。用户可通过npm命令直接安装，该工具完全开源，相关代码库已公开。", "url": "https://x.com/gdb/status/2050972114077843772", "permalink": "https://aihot.virxact.com/items/cmopz5e4g10g4sll9wgasb37n", "publishedAt": "2026-05-04T00:00:00.000Z", "exact": false, "content": "用于创业点子的Codex 用Codex技能残酷检验任何创业点子！ 大多数创业点子听起来都不错。 这项Codex技能会告诉你它们为什么可能行不通。 只需把你的点子交给Codex，它就会为你进行压力测试 -\u003e 找出核心假设 -\u003e 暴露致命缺陷 -\u003e 检查问题是否真实存在", "zh": true}, {"seq": 6, "title": "大多数公司尚未做好迎接AI的准备", "source": "X：宝玉 (@dotey)", "summary": "多数公司无法有效利用AI，核心障碍并非技术，而是企业自身目标模糊、战略混乱且缺乏清晰的业务流程描述。AI擅长执行明确指令，但大多数公司处于“混乱黑盒”状态，无法清晰定义目标、工作流与衡量指标。只有少数具备高度自我认知和组织纪律的公司能真正借助AI提升竞争力。企业应首先审视自身是否具备让AI有效协助的清晰内部状态，而非盲目追求技术应用。", "url": "https://x.com/dotey/status/2051057428075053120", "permalink": "https://aihot.virxact.com/items/cmoqc1r2y13cksll9xu33f702", "publishedAt": "2026-05-04T00:00:00.000Z", "exact": false, "content": "- 这些其实根本不是 AI 问题，都是早就该解决的组织问题：目标说不清，owner 不明确，流程没有沉淀，指标不统一，决策权模糊，项目价值讲不明白。AI 只是把这些混乱放大了，并没有能力替你修好它们。 最近很火的Stripe 是一个很好的反例， 他们连续发布了几款AI产品： 给Agent用的Link\n- 据我的观察就是如此，结构化的数据，标准化的流程，应对日常事务与应急事务的不同处理方式......绝大部分公司都没准备好\n- 我认为需要一个中间人，一个懂业务和懂AI的中间人来翻译业务和AI给双方，企业AI再以小场景切入，有看得见，摸得着的价值，促使老板更大投入，而不是一个想变革的心。\n- 加入对话", "zh": true}, {"seq": 7, "title": "每日仅需8条广告，广告支持型AI的经济可行性分析", "source": "Tomer Tunguz 博客（VC 分析）", "summary": "基于开源模型和商用GPU的广告支持型AI在经济上可行。计算表明，一个由4块B200 GPU组成的集群服务300名用户时，每小时成本约18美元。通过广告收入即可覆盖成本：在内容网络中每3分钟展示一条广告（CPM 3.12美元），或在搜索广告中每39分钟展示一条（CPM 38.40美元），这一广告频率已与常见的移动和网页应用相当。对于代码代理等高强度任务，可采用混合盈利模式：用户每月支付10美元订阅费并每日观看8条广告，即可支持约200万…", "url": "https://www.tomtunguz.com/ad-supported-ai-works", "permalink": "https://aihot.virxact.com/items/cmorecqxv006jsle6xdwcla76", "publishedAt": "2026-05-04T00:00:00.000Z", "exact": false, "content": "One search ad every 40 minutes pays for a trillion-parameter model. One content ad every 3 minutes does the same. The math on ad-supported AI is better than you think.\nWhen Anthropic pulled Claude Code from the $20 plan last month, it signaled an industry assumption : frontier intelligence requires frontier pricing. For open models, the economics flip.\nA B200 GPU costs $4.50/hour on spot markets.1 Google Search ads generate $38.40 CPM (cost per thousand impressions),2 while Google Display runs $3.12.3\n| Ad Context | CPM | Impressions to Break Even (per hour) | One Ad Every… |\n|---|---|---|---|\n| Content Network | $3.12 | 5,769 | ~3 minutes |\n| Search | $38.40 | 469 | ~39 minutes |\nThese numbers assume the provider runs 4 B200 Blackwells at 300 users, 50% of the theoretical maximum, leaving headroom for bursts.4\nTo support these costs, users would see one ad every 3 to 39 minutes. That is well below what users already tolerate : hyper-casual mobile games show six ads per session, roughly one per minute.5\nThere are nuances. Assuming ad fill rates (the share of ad requests that return a paid ad) and ad network revenue share, we can model effective CPMs of $1.50. At that floor, the frequency doubles. One content ad every 90 seconds still covers the cluster, comparable to what mobile users already tolerate.\nOn the other end of the spectrum, rewarded video clears at $40 to $50 CPM with near-100% fill in gaming. A single round of rewarded video across the cluster nearly covers an hour of compute.6\nBut there is the question of utilization. All of these figures assume the cluster stays busy. Idle GPUs raise the per-user cost.\nWhat about heavier workloads? Agentic coding burns 10 to 20x more tokens than passive chat.7 At that rate, ad-only models can’t keep up. But a hybrid works : $10/month plus 8 ads per day covers 2 million tokens.8 It won’t fund a tokenmaxxing habit, but it will keep you shipping.\nAd-supported AI is viable : open models, commodity GPUs, and ad frequencies already parallel those of mobile & web.\n-\nB200 Cloud Pricing: Compare 22+ Providers (2026) : spot market averages $3.40 to $4.50/hour across 22 cloud providers. ↩︎\n-\n-\nOnline Advertising Costs In 2026 (Top Draw) : Google Display Ads average CPM $3.12. ↩︎\n-\nGPU Concurrency Benchmark: H100 vs H200 vs B200 (AIMultiple) : Kimi K2.6 on 4x B200 supports 600 concurrent users at peak; 300 used here as a conservative operating target. ↩︎\n-\nThe 2026 AdMob & Mobile Monetization Playbook (MonetizeMore) : hyper-casual benchmark of 6 ads per session across 3.2 sessions per day. ↩︎\n-\n-\nClaude Code vs Cursor: Speed, Accuracy & Cost Benchmark 2026 (SitePoint) : Claude Code uses 33K tokens per task; Cursor uses 188K. Heavy users run 20 to 60 tasks/day, consuming 1 to 2M tokens/hour during active sessions, 10 to 20x more than passive chat. ↩︎\n-\nCalculation : $10/month = $0.33/day. At $0.33/day alone, cluster supports 1,309 users at 1M tokens/day each, half the target. The remaining $0.33/day gap is filled by ads. At rewarded-video CPMs of $40, that is 8 impressions/day. Combined : $10/month + 8 ads/day = 2M tokens/day per user. ↩︎"}, {"seq": 8, "title": "60倍速冷启动：将同级GPU视为权重服务器", "source": "Runway：News（网页）", "summary": "Runway平台团队开发的NCCLBack系统，通过P2P权重传输将模型冷启动时间从数分钟缩短至数秒。其核心创新在于让新启动的GPU推理节点直接从集群内已加载权重的同级GPU获取模型参数，而非从云存储重复下载。该系统利用GPU互连（如InfiniBand、NVLink）高达200-400 Gbps的带宽，相比传统存储下载的2-10 Gbps实现了数量级提升。通过Redis协调与NCCL广播原语，NCCLBack确保了数据传输的效率和正…", "url": "https://runwayml.com/news/60x-faster-cold-starts-treating-peer-gpus-as-weight-servers", "permalink": "https://aihot.virxact.com/items/cmosrd1ac00v8slplayzv4fhm", "publishedAt": "2026-05-04T00:00:00.000Z", "exact": false, "content": "How we cut model cold-start times from minutes to seconds by broadcasting weights between GPUs instead of downloading them from storage, and the sharp edges we found along the way.\nThe Cold Start Tax\nWhen a GPU inference worker boots, the first thing it does (before it can serve a single request) is load model weights. For the kinds of models we run at Runway, this means pulling terabytes of parameters from cloud storage, copying them from host memory to GPU memory and calling load_state_dict. For a single worker, this takes minutes. For a fleet of workers rolling out a new model version simultaneously, it's a thundering herd: dozens of machines independently downloading the same bytes from the same storage backend, saturating bandwidth and inflating cold-start times for everyone. We deploy dozens of times a day, often without any model weight changes. Cold starts directly gate autoscaling, rollout speed and user-facing latency and increase the research/engineering feedback loop.\nBecause model weight changes are relatively rare, deploying so frequently with long cold starts creates an unnecessary tax on GPU inference worker availability and impacts our user experience. The weights already exist on a GPU somewhere in the cluster. A worker that finished setup five minutes ago is sitting there, fully loaded, waiting for tasks. A new worker can receive those weights directly from a peer instead of re-downloading from storage. This keeps generations flowing and allows our research and engineering teams to continuously deliver new functionality. The system makes our clusters nimble: we can quickly rebalance workloads, roll back bad code and maximize the time GPUs spend performing inference.\nThe Landscape of Approaches\nThere are several approaches to cold-start optimization, and we've tried most of them.\nFaster storage (NVMe caches, parallel chunk downloads) reduces download time but doesn't change the shape of the problem: N workers still make N independent downloads.\nShared memory preloading (/dev/shm, CUDA IPC) eliminates redundant downloads on a single node but is inherently single-machine.\nShared volumes (NFS, EFS, Ceph) can dedupe downloads across machines but add operational overhead and are typically still far slower than GPU-to-GPU transfer.\nDistributed caching (Memorystore, custom weight servers) adds another system to operate, capacity-plan, and monitor.\nPeer-to-peer transfer is different. One worker downloads and loads weights normally. Every subsequent worker receives weights directly from an already-loaded peer over the GPU interconnect. Download happens once; broadcast scales to the fleet. We built a system called NCCLBack around this idea (named after the NCCL collective it's built on and the fact that it \"backs\" the weight-loading path, and only tangentially after a certain Canadian rock band).\nThe reason P2P transfer wins so decisively is physics. GCS download bandwidth, even optimized, lands somewhere around 2–10 Gbps per worker. InfiniBand or RoCE links between GPU nodes deliver 200–400 Gbps. NVLink within a node is faster still, up to 900 GB/s on H100 SXM systems. When you can use a GPU interconnect instead of a storage API, you're moving from the world of \"minutes\" to the world of \"seconds.\"\nIn the traditional model, every worker independently downloads from storage, and cold start time scales linearly with fleet size. With NCCLBack, one worker downloads, and the rest receive weights over the GPU interconnect in seconds:\nNCCLBack Design: Building Up in Layers\nNCCLBack is not a single clever trick. It's a stack of subsystems (discovery, coordination, transfer and verification), each solving a distinct problem. Here's the full protocol at a glance:\nLayer 1: The Basic Idea\nThe core of NCCLBack is a one-to-one weight transfer between two GPU workers using NCCL's broadcast primitive.\nThe sender is a worker that already has weights loaded on GPU. The receiver is a new worker that has constructed the model structure (all the right tensor shapes, dtypes and devices) but hasn't filled them with values yet. We call this the \"skeleton model.\"\nThe transfer itself is straightforward. Both sides iterate over model.state_dict() in sorted key order and call nccl.broadcast() for each tensor:\ndef transfer(model, comm, device_id):\n    with cp.cuda.Device(device_id), cp.cuda.Stream() as stream:\n        state_dict = model.state_dict()\n        # Both sides must iterate in identical order\n        names = sorted(state_dict.keys())\n        for name in names:\n            param = state_dict[name]\n            # Same call on both sides; NCCL distinguishes by rank\n            comm.broadcast(\n                param.data_ptr(),\n                param.data_ptr(),\n                param.numel(),\n                torch_to_nccl_dtype(param.dtype),\n                0,  # root rank (sender)\n                stream=stream.ptr,\n            )\n        stream.synchronize()\nSorting the keys matters more than it looks. nccl.broadcast is a collective: both sides must issue calls in the exact same order, for the exact same tensor sizes and dtypes. If the sender iterates in a different order than the receiver, the broadcast silently writes the wrong data into the wrong buffers and you get a model that produces garbage without any error.\nThis is the entire data plane. Everything else in NCCLBack exists to make this loop run correctly, safely and without hanging.\nLayer 2: Discovery\nBefore we can broadcast, the receiver needs to find a sender. This is a coordination problem.\nWe solve it with a Redis-backed queue. When a worker finishes setup and has weights loaded, it publishes two things to Redis:\n- Model availability: a key indicating \"I have model version X loaded.\"\n- Weight hashes: per-layer integrity hashes (more on this in Layer 5).\nWhen a new worker starts and wants to receive weights, it first checks Redis: does a peer with my model version exist? This check must be unanimous across all ranks in a distributed worker group. If rank 0 thinks a peer exists but rank 3 doesn't, the group will deadlock when some ranks try P2P transfer while others try to download.\nWe enforce consensus with a pattern that shows up repeatedly throughout NCCLBack:\navailability_tensor = torch.zeros(1, device=\"cuda\")\nif peer_exists_in_redis:\n    availability_tensor[0] = 1\ntorch.distributed.all_reduce(availability_tensor, op=ReduceOp.MIN)\nassert bool(availability_tensor[0])  # True only if ALL ranks agree\nThe all_reduce(MIN) trick: every rank votes, and we proceed only if the minimum vote is 1. If any single rank can't find the model in Redis, everyone falls back to downloading. This is a deliberately conservative choice; we'd rather download redundantly than risk a partial P2P transfer that leaves some ranks with weights and others without.\nModel identity matters here. The \"model version\" is a hash of the model's configuration and checkpoint metadata. In practice, each checkpoint is converted to safetensors format during deployment, and our cloud storage provides a CRC32C checksum for the resulting file. The model config (which includes the safetensors URI and its CRC32C) is then hashed with MD5 to produce the version identifier. This means two workers only consider themselves compatible if they agree on the exact same checkpoint bytes and the same model configuration. Getting this hash wrong means two workers with subtly different model states will try to transfer weights between each other, which either fails loudly (shape mismatch) or fails silently (wrong weights loaded).\nLayer 3: Handshake\nFinding a peer in Redis isn't enough. Redis tells you a peer existed at some point; it doesn't tell you the peer is still alive and ready to send right now. If we optimistically start a NCCL broadcast and the sender has crashed or is busy, ncclCommInitRank will hang indefinitely. NCCL's collective model has no built-in timeout for communicator creation.\nSo before we touch NCCL, we run a bidirectional liveness handshake through Redis:\n- The receiver stores a random integer at a known Redis key: receiver_ready:{peer_id} .\n- The sender polls for that key. When it appears, the sender increments the value by 1 and stores it back.\n- Meanwhile, the sender has stored its own random integer at sender_ready:{peer_id} .\n- The receiver polls for the sender's key, finds it, increments by 1, and stores it back.\nBoth sides verify: \"I stored X, the other side changed it to X+1.\" This proves both peers are alive, responsive and talking about the same transfer. The entire handshake runs with short timeouts: 1 second for the sender (who shouldn't wait long for a flaky receiver), 10 seconds for the receiver (who can afford to wait since peers might just be busy).\nIf the handshake times out, the receiver cleanly falls back to downloading from storage. No NCCL communicators were created, no GPU resources were committed and no cleanup is needed.\nLayer 4: The Transfer, with Guardrails\nOnce the handshake succeeds, we create a 2-rank NCCL communicator (sender = rank 0, receiver = rank 1) and run the broadcast loop. But NCCL has no built-in timeouts — if the peer disappears mid-transfer, the call blocks forever. We wrap both communicator creation and the broadcast loop in a daemon-thread timeout: if the operation doesn't complete within a few seconds, we abort the communicator and raise a TimeoutError. This ensures a hung transfer never blocks the worker from falling back to downloading.\nLayer 5: Integrity Verification\nAfter the transfer completes, how do we know the receiver got the right weights? NCCL doesn't provide checksums or integrity guarantees at the application level. A silent data corruption (a flipped bit in a GPU-to-GPU transfer) would produce a model that runs but generates subtly wrong outputs.\nWe solve this with sampled hashing. When the first worker downloads and loads weights from storage (the \"ground truth\" path), it computes a hash for each layer of the model and stores those hashes in Redis. Hashing every byte of a multi-gigabyte model is slow, so instead we sample 100 random elements per parameter using a fixed seed (so both sender and receiver sample the same indices) and hash only those samples. We normalize to float16 before hashing so dtype differences between code paths don't cause false mismatches. This turns a minutes-long verification into a seconds-long one, while still catching any corruption that affects more than a vanishingly small fraction of the weights.\nThe receiver, after receiving weights via P2P, computes the same hashes and compares against the Redis-stored \"truth.\" If any layer's hash doesn't match, we raise a WeightVerificationError and the worker restarts.\nThe Skeleton Model Problem\nNCCL's broadcast doesn't allocate memory. It writes into existing buffers. This means the receiver must have pre-allocated tensors of exactly the right shape, dtype and device before the broadcast starts. We call these pre-allocated tensors \"containers\" and the model structure they live in the \"skeleton model.\"\nBuilding a skeleton model means running the model's constructor and initialization code while skipping the actual weight loading (passing skip_checkpoint=True). For simple models, this is straightforward. For real production models, it's far more complicated. A video generation pipeline isn't a single nn.Module; it's a graph of submodules (a diffusion transformer, a VAE decoder, text encoders, image embedders etc.), each with its own initialization logic, some of which eagerly load weights during construction.\nIn pipelined architectures, different GPU ranks host different submodules entirely. One rank might run the VAE decoder while the rest run the diffusion transformer. NCCLBack must return the correct submodule for each rank, because each rank participates in its own independent P2P transfer. The receiver doesn't just need one skeleton; it needs the right skeleton for its rank, with containers that exactly match what the sender will broadcast. Any mismatch (a different dtype, a missing buffer or an extra parameter from a different code path) and the broadcast either crashes or silently corrupts the model. Getting this right required a series of careful abstractions and relentless integration testing across real production model variants.\nHow It Breaks: A Taxonomy of Failures\nEvery failure mode below was discovered in production.\nThe Gray Frame Incident\nSome submodules load real weights inside __init__ or instantiate_from_config, not during load_state_dict. When we added NCCLBack to a new model, we called to_empty(device=\"cuda\") on the entire model to prepare skeleton containers. This correctly emptied the diffusion transformer's weights (which would be replaced by P2P transfer), but also wiped the VAE's self-initialized weights, replacing them with uninitialized garbage.\nThe model ran. It didn't crash. It generated video frames. But the frames were gray: the VAE decoder was applying a learned reconstruction to random noise, producing washed-out structureless output. The failure only manifested on workers that received weights via NCCLBack; workers that downloaded directly were fine, because the download path re-initialized the VAE correctly.\nThe fix: only empty the specific submodules that NCCLBack transfers.\nThe FP8 Hash Mismatch\nModern inference stacks often quantize weights after loading (bf16 to FP8) as a post-initialization step. NCCLBack originally hashed weights immediately after downloading, before quantization. When a sender broadcast its FP8 weights to a receiver, the receiver hashed what it got, compared against the bf16 hashes in Redis, and found a mismatch. Verification failed; the worker crashed and restarted.\nThe fix: hash at the \"model is ready to serve\" boundary, not the download boundary. Any transformation between download and serve (quantization, pruning or fusion) changes the bytes on GPU, and the integrity hashes must reflect the final state.\nThe Fallback Trap\nFor quantized models, the fallback path is a trap. The skeleton model has FP8 containers; the downloaded weights are bf16. If load_state_dict(strict=False) is used, the mismatched keys are silently ignored, and the model loads \"successfully\" with corrupt weights.\nThe solution for these models is deliberately drastic: the fallback raises an exception instead of downloading.\ndef load_model_weights():\n    raise NCCLBackDownloadFallbackNotSupportedRestartRequiredError()\nThis forces a restart down the normal download-and-quantize path. Slower, but correct. When a fallback is known to produce a corrupt state, fail fast (and loudly) and take a path you trust.\nThe Phantom Mesh Change\nEarly on, the model hash didn't include the device mesh topology. When we changed the tensor parallelism layout, the hash stayed the same (config and checkpoint hadn't changed), so workers with different mesh layouts matched in Redis, attempted a P2P transfer, and hung. The sender had full tensors while the receiver expected s"}, {"seq": 9, "title": "大语言模型（LLMs）是否改善了患者治疗结果？", "source": "Gary Marcus：The Road to AI We Can Trust（RSS）", "summary": "一项新综述研究指出，尽管大语言模型（如GPT、Claude、LLaMA）在医疗领域的应用日益广泛，但目前尚无明确证据表明其直接改善了患者治疗结果。该综述分析了多项临床研究，发现这些模型在诊断支持、文书处理等方面展现出潜力，但在提升治愈率、降低死亡率或改善患者生活质量等关键临床指标上，尚未展现出统计学上的显著积极影响。研究强调，需要更多高质量的随机对照试验来评估LLMs对患者结局的实际影响。", "url": "https://garymarcus.substack.com/p/have-llms-improved-patient-outcomes", "permalink": "https://aihot.virxact.com/items/cmoq7ik24129gsll9ns322nq6", "publishedAt": "2026-05-04T00:00:00.000Z", "exact": false, "content": "", "zh": true}]}]};
function pad(n){return n<10?"0"+n:""+n;}
function toBeijingHuman(iso, ref, exact){
  const d=new Date(iso); const bj=new Date(d.getTime()+8*3600*1000);
  const Y=bj.getUTCFullYear(),M=bj.getUTCMonth()+1,D=bj.getUTCDate();
  const h=bj.getUTCHours(),m=bj.getUTCMinutes(); const hh=pad(h),mm=pad(m);
  if(!exact) return M+"月"+D+"日";
  const [rY,rM,rD]=ref.split("-").map(Number);
  if(Y===rY&&M===rM&&D===rD) return "今天 "+hh+":"+mm;
  const yest=new Date(rY,rM-1,rD); yest.setDate(yest.getDate()-1);
  if(Y===yest.getFullYear()&&M===yest.getMonth()+1&&D===yest.getDate()) return "昨天 "+hh+":"+mm;
  return M+"月"+D+"日 "+hh+":"+mm;
}

function escapeHtml(s){return (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function escapeAttr(s){return escapeHtml(s);}
// 渲染正文（纯文本归档）：图片不加载远程资源，仅以文字占位符呈现；其余文本按段落转义（防 XSS）
function linkify(escaped){
  if(!escaped) return escaped;
  var re=/(\[[^\]]+\]\((https?:\/\/[^)\s]+)\))|(https?:\/\/[^\s<>"'）】」』，。、；：！？]+)/g;
  return escaped.replace(re, function(m, g1, g2, g3){
    if(g2!==undefined){
      var label=m.substring(m.indexOf('[')+1, m.indexOf(']'));
      return '<a class="r-link" href="'+g2+'" target="_blank" rel="noopener noreferrer">'+label+'</a>';
    }
    if(g3!==undefined){
      return '<a class="r-link" href="'+g3+'" target="_blank" rel="noopener noreferrer">'+g3+'</a>';
    }
    return m;
  });
}
var _IMG_RE=/!\[([^\]]*)\]\(([^)\s]+)\)/g;
function renderRich(text){
  return (text||"").split(/\n{1,}/).map(function(p){
    p=p.trim(); if(!p) return '';
    var out=''; var last=0; var m; _IMG_RE.lastIndex=0;
    while((m=_IMG_RE.exec(p))!==null){
      out+=linkify(escapeHtml(p.slice(last,m.index)));
      var cap=(m[1]||'').trim()||'图片';
      out+='<span class="r-img-cap">🖼 '+escapeHtml(cap)+'</span>';
      last=_IMG_RE.lastIndex;
    }
    out+=linkify(escapeHtml(p.slice(last)));
    return '<p>'+out+'</p>';
  }).join("");
}
function openReader(it){
  const r=document.getElementById("reader");
  const content=(it.content||"").trim();
  const body=document.getElementById("readerBody");
  if(content.length>0){
    body.innerHTML=renderRich(content);
  }else{
    const sum=(it.summary||"").trim();
    if(sum){
      // 来源站点多为付费墙 / 登录墙 / 反爬限制，无法镜像全文；展示已本地存档的中文摘要兜底
      body.innerHTML='<div class="r-fallback">⚠️ 该条新闻的<b>全文镜像暂不可用</b>（来源站点可能为付费墙 / 登录墙 / 反爬限制，或原文已失效）。下方为已<b>本地存档的中文摘要</b>，可正常查看；完整原文请点击右下角「查看原文 ↗」。</div>'+
        '<p class="r-summary">'+linkify(escapeHtml(sum))+'</p>';
    }else{
      body.innerHTML='<p class="r-empty">暂未获取到该条新闻的全文镜像与摘要。'+(it.url?'可点击右下角「查看原文 ↗」前往原始报道。':'')+'</p>';
    }
  }
  document.getElementById("readerTitle").textContent=it.title;
  document.getElementById("readerSource").textContent=it.source;
  const link=document.getElementById("readerLink");
  if(it.url){link.href=it.url;link.style.display="";}else{link.style.display="none";}
  r.hidden=false;document.body.style.overflow="hidden";
}
function closeReader(){const r=document.getElementById("reader");r.hidden=true;document.body.style.overflow="";}
document.getElementById("reader").addEventListener("click",function(e){if(e.target===this)closeReader();});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeReader();});
