t.virxact.com/items/cmptqxpc00056slpme4gyxf5n", "publishedAt": "2026-06-01T00:00:00.000Z", "exact": false, "content": "Chubby♨️ 在 X 上发文：\"苹果 AI 的最新动态：随着苹果全球开发者大会（WWDC）下月召开，长期延迟的 Siri 及设备端 AI 升级预计将成为核心亮点：一款基于谷歌 Gemini 精简版的小型模型将本地运行于 iPhone 芯片上，主打隐私保护与更低 Token 成本。这套技术栈大部分来自外部。本地模型由 Gemini 蒸馏而来。对于设备无法处理的过重查询，将路由至谷歌云（！），苹果现已批准使用英伟达的机密计算技术进行处理。据报道，苹果还在寻找小型设备端 AI 初创公司以加速模型压缩工作，已考察过 Liquid AI 等企业。与 2024 年发布时的一个悄然转变：苹果当时承诺任何离开 iPhone 的数据都将在私有云计算（Private Cloud Compute）的苹果芯片上运行。但苹果未能让完整版 Gemini 在此运行，因此这些查询现托管于谷歌云。不过 '私有云计算' 的名称仍将保留。信息来源：The Information\"", "zh": true}, {"seq": 4, "title": "6000 多公里全程零干预：特斯拉 FSD 完成全球首次横穿加拿大自动驾驶", "source": "IT之家（RSS）", "summary": "一辆特斯拉汽车搭载 FSD V14.3.3 版本软件，完成了全球首次全程零人工干预、横穿加拿大的自动驾驶行程。车辆从温哥华出发，历时 4 天 21 小时，行驶 3760 英里（6051 公里）抵达哈利法克斯，全程所有驾驶操作（包括高速并线、应对复杂路况与自动泊车）均由系统自主完成，无任何系统退出或人工修正。该版本随 2026.14.6.6 更新推送，整合了春季软件功能。", "url": "https://www.ithome.com/0/957/718.htm", "permalink": "https://aihot.virxact.com/items/cmpt5p76d07g3sluzcbxft4f4", "publishedAt": "2026-06-01T00:00:00.000Z", "exact": false, "content": "6000 多公里全程零干预：特斯拉 FSD 完成全球首次横穿加拿大自动驾驶 - IT之家 首页 IT圈 最会买 设置 日夜间 随系统 浅色 深色 主题色 黑色 投稿 订阅 RSS订阅 收藏IT之家 软媒应用 App客户端 要知App 软媒魔方 业界 手机 电脑 测评 视频 AI 苹果 iPhone 鸿蒙 软件 智车 数码 学院 游戏 直播 5G 微软 Win10 Win11 专题 搜索 首页 \u003e 智车之家 \u003e 车用技术 6000 多公里全程零干预：特斯拉 FSD 完成全球首次横穿加拿大自动驾驶 2026/5/31 9:30:46 来源： IT之家 作者： 远洋 责编： 远洋 评论： 感谢IT之家网友 不予置评 的线索投递！\n\nIT之家 5 月 31 日消息，特斯拉车主在北美成功完成了一项曾被视作自动驾驶测试领域终极目标的挑战。一群热衷电动汽车的爱好者，完成了全球首趟全程无人工干预、横穿加拿大的不间断自动驾驶之旅，车辆在纵贯整个加拿大的行驶过程中，所有操作全部由 FSD 完成，全程无需人为修正操作。参与者戴维・莫斯（账号 @DavidMoss）在社交平台 X 上公布了这一里程碑成果，宣布团队顺利完成了这场跨加拿大自动驾驶实测。车辆从不列颠哥伦比亚省温哥华的马蹄湾码头出发，历时 4 天 21 小时，最终抵达新斯科舍省哈利法克斯的特斯拉官方展厅。此次长途行程共计行驶 3760 英里（6051 公里），途经加拿大路况差异极大的各类道路。\n\n六千公里全程零接管 这场公路测试之所以成为汽车技术领域的标志性事件，在于其执行标准极为严苛。据莫斯介绍，整段旅程全程零系统退出、零任何形式的人工介入。特斯拉人工智能主管阿肖克・埃卢斯瓦米也对此项成果表示认可，向莫斯及其团队送上祝贺并致谢。车辆全程自主完成多项高难度操作： 驶入高速主干道、应对多变天气、顺利通过复杂施工路段。更值得一提的是，每一处停靠点的泊车流程也均由系统全自动完成 。行驶途中，车辆途经多个特斯拉超级充电站，全程自动转向、对位、倒车入位，驾驶员全程未触碰方向盘与踏板。\n\n搭载春季新版固件系统 本次跨洲行程全程依靠特斯拉最新推送的 FSD V14.3.3 版本运行。该版本随 2026.14.6.6 软件更新于本月上旬逐步推送，整合了外界期待已久的 2026 春季软件更新功能，并将其正式纳入自动驾驶固件体系。除优化底层路径规划神经网络外，V14.3.3 版本的车载界面与座舱功能升级也收获大量好评。该版本放宽了驾驶员监测相关判定标准，带来更接近专职司机代驾的轻松体验，也让驾驶员在这场耗时近五天的长途穿越中更加舒适。\n\n自动驾驶创下空前优异表现 此番横穿加拿大的全程零干预驾驶是一项全新纪录，而莫斯今年已接连创下多项自动驾驶佳绩。今年春季早些时候，他就因完成美国境内 2700 英里（IT之家注：约 4345 公里）跨东西海岸 FSD 自动驾驶行程登上新闻，全程同样零人工介入，证实这套系统可独立完成从洛杉矶到南卡罗来纳州的全程行驶。此外，他的车辆也成为测试车队长期稳定性的重要参照。此前莫斯就曾分享，车辆搭载 V14.2 版本系统时，已累计实现近 13000 英里（约 20921 公里）的零干预自动驾驶里程。目前，监督版 FSD 在官方定义中仍属于二级驾驶辅助系统，按照规范仍需驾驶员时刻监管。但这些由民间实测完成的数千公里长距离路测预示着，无监督 FSD 落地已不远。\n\n广告声明：文内含有的对外跳转链接（包括不限于超链接、二维码、口令等形式），用于传递更多信息，节省甄选时间，结果仅供参考，IT之家所有文章均包含本声明。\n\n投诉水文 我要纠错 下载IT之家APP，签到赚金币兑豪礼 相关文章 关键词： 特斯拉 ， 自动驾驶 ， FSD 特斯拉 FSD 学会了“躲警车”，主动减速变道 减少“盯路”提醒，特斯拉 FSD 14.3.3 放宽驾驶员监控机制 特斯拉监督版 FSD 登陆立陶宛，欧洲扩张再下一城 老款车型无法支持无监督 FSD，车主起诉特斯拉虚假宣传胜诉 特斯拉推送 FSD V14.3.3：智能召唤最高时速提升至 13 公里 / 小时 特斯拉强制要求驾驶员接管 FSD 时提供反馈，屏幕弹窗引争议 软媒旗下网站： IT之家 最会买 - 返利返现优惠券 iPhone之家 Win7之家 Win10之家 Win11之家 软媒旗下软件： 软媒手机APP应用 魔方 最会买 要知 关于IT之家 | 联系我们 | 加入软媒 | WAP版 | 网站地图 | Archiver IT之家，软媒旗下科技门户网站 - 爱科技，爱这里。", "zh": true}]}, {"label": "技巧与观点", "color": "#0284c7", "items": [{"seq": 5, "title": "我花200英镑把一台数据中心级GPU装进了我的游戏电脑", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "summary": "一名用户以200英镑的价格购入了一块数据中心级GPU，并将其成功安装到自己的游戏电脑中。文章记述了这一非标准硬件改装过程、遇到的技术挑战以及最终实现本地运行大语言模型的体验。", "url": "https://blog.tymscar.com/posts/v100localllm", "permalink": "https://aihot.virxact.com/items/cmptzehi500cdsla80uvg4kgh", "publishedAt": "2026-06-01T00:00:00.000Z", "exact": false, "content": "## 我花200英镑把一块数据中心GPU塞进了游戏PC :: Tymscar博客\n\nTymscar 我花200英镑把一块数据中心GPU塞进了游戏PC 2026-05-30 Oscar Molnar 阅读时间13分钟（2710字）\n\n#homelab #gpu #nixos #local-llm #hardware #debugging\n\n我原本有一块RTX 4080。16GB显存。打游戏够用，但跑我想本地运行的模型就不够了。在GPU领域，下一步要么花大价钱买一块显存更大的卡，要么另辟蹊径。我选择了后者。我买了一块连标准PCIe接口都没有的数据中心GPU，用转接卡塞进了我的游戏PC，现在两块GPU共享32GB显存，跑一个270亿参数的模型能达到每秒32个token。整件事只花了我200英镑。\n\n## 这块GPU\n\n这是一块Tesla V100 SXM2 16GB。它专为NVIDIA的DGX服务器和超大规模数据中心机架设计。SXM2封装意味着它没有PCIe插槽。没有显示输出接口。没有标准电源接口。它插在服务器机架内的专用板卡上，通过NVLink通信。你没法直接把它插到主板上——除非借助外力。\n\n但关键在于：这是一块Volta架构GPU，拥有16GB HBM2显存、5120个CUDA核心，而我在eBay上只花了大约150英镑就买到了。它的算力依然能打。显存依然真实可用。而内存带宽才是真正让人惊喜的地方。\n\nHBM2是另一级别的内存。V100拥有4096位内存总线，提供900 GB/s的带宽。对比一下：我那块搭载 fancy GDDR6X 的RTX 4080只有736 GB/s。2017年的V100比2022年发布的消费级GPU内存带宽高出22%。而且输的不只是NVIDIA的消费卡。Apple的M3 Max是400 GB/s，M4 Max是546 GB/s，全新M5 Max（买一台笔记本要花3000多英镑）也只有614 GB/s。一块2017年的GPU，在内存带宽上吊打市面上所有Mac。\n\n与我的4080最接近的AMD竞品是RX 7900 XTX，其24GB GDDR6显存带宽为960 GB/s。技术上确实略胜V100，但7900 XTX售价700英镑以上，而且ROCm对LLM推理的支持相比CUDA仍然粗糙。V100以不到四分之一的价格提供了94%的带宽，而且与llama.cpp完美兼容。唯一能轻松超越它的消费级GPU是RTX 5090（1792 GB/s），但那张卡要2000多英镑。对于LLM推理而言，内存带宽是决定每秒token数的瓶颈，这一点比其他任何因素都重要。\n\n唯一的问题是接口。\n\n## 转接卡\n\n结果发现，还真有人做SXM2转PCIe的转接卡。不是NVIDIA做的，也没有任何官方支持。就是一块裸PCB，一边是SXM2插座，另一边是PCIe金手指。我花了大约50英镑。其中一半可能都花在铜材上了。\n\n所以总共花了大约200英镑，我就得到了一块16GB显存的GPU，可以插在我的主板上，与RTX 4080并肩作战。总共32GB显存。一块32GB的RTX 5090要2000多英镑。我不是说体验一样，我是说显存容量一样。\n\n## 地狱风扇\n\n在V100派上用场之前，我得先搞定风扇。V100 SXM2原本设计在2U服务器里，靠工业级散热系统。转接卡上的风扇可不温柔。不安静。绝不是你想放在卧室里的东西。我用Apple Watch测了一下：82分贝。介于垃圾处理器和割草机之间，远超“电脑有点吵”，直接进入“该戴耳塞了”的范畴。\n\n“我在自己家里是不是该戴耳塞”的范畴。最糟糕的是：你根本无法控制它。我试过 nvidia-smi，在 Linux 上扫描过，甚至在 Windows 上试过 Afterburner（后面会详细说，这套配置在 Windows 上几乎无法正常工作）。全都无济于事。这张适配卡的风扇设计初衷就是不可控的。它注定要在服务器机架里以 100% 转速永远运转，那里根本没人会听到它的噪音。这是我尝试破解风扇引脚定义时的情景。我猜测它可能采用标准机箱风扇的引脚布局，只是接口比较特殊，于是我把两根杜邦线分别插到 VCC 和地线上，用一块 9V 电池去触碰它们。风扇转了起来，而且比它正常接收 12V 电压时安静得多：您的浏览器不支持视频标签。这证实了引脚定义，也让我看到了驯服风扇的希望。让风扇听从指挥 # 9V 电池测试告诉我，引脚定义属于标准机箱风扇范畴，只是接口特殊。接下来的问题是，如果我把转速检测和 PWM 引脚接到主板上，风扇是否真的会响应 PWM 控制。于是我把几根杜邦线塞进接口，另一端插到一个空闲的风扇接口上（请调高音量）：您的浏览器不支持视频标签。成功了。主板可以读取转速，风扇也能响应 PWM 信号。我把它保持在 10% 转速。\n\n即使在满负载下，温度也从未超过 50°C，而且几乎听不到声音。现在，我只需要一根像样的线缆，而不是靠运气固定的杜邦线。这张适配卡上的风扇接口是一个四针的小型 JST PH2.0 插头。主板风扇接口采用标准的 0.1 英寸（2.54mm）间距。GPU 风扇使用的是 2.0mm 间距的 JST PH 接口。针脚更密，插头也更小。解决方案是一根 2.54mm 公头转 PH2.0 母头的杜邦线。PH2.0 母头端插入风扇的转速检测和 PWM 引脚，2.54mm 公头端则插到主板上的空闲风扇接口：噪音从 82dB 的听力损伤级别降到了我可以接受的程度。低成本翻倍显存 # 处理好风扇问题后，V100 顺利地与我的 4080 并肩工作：RTX 4080：16GB 显存，Ada 架构 Tesla V100：16GB 显存，Volta 架构 总计：两块 GPU 共 32GB 显存 llama.cpp 可以通过张量分割的方式，将模型分配到两块 GPU 上。它会通过 PCIe 总线对层进行流水线处理，让 4080 处理部分层，V100 处理其余层。\n\n这虽然不如单块 32GB 显存的 GPU 快，但确实可行，而且成本大约只有一块 32GB 显存 GPU 的 10%。值得一提的是，我见过 V100 的最高功耗大约是 150W。这不算低，但对于运行本地 LLM 推理的 GPU 来说，也并非高得离谱。但等等，你还能更大 # V100 还有 32GB 显存的版本。它的价格比我买的这款贵一倍多，但我们谈论的仍然只是几百英镑就能买到一块拥有 32GB HBM2 显存的显卡。两块这样的卡就能提供 64GB 显存，成本大约只有当今市场上 RTX 5090 价格的 20%。你还可以将它们集群使用。SXM2 格式原生支持 NVLink，这意味着如果你在搭建真正的多 GPU 系统，这些卡之间可以以非常高的带宽进行通信。即使通过 PCIe 转接卡，张量分割的性能也相当不错。软件方面 # 这部分出奇地顺利，这要归功于 NixOS。V100 是 Volta 芯片。NVIDIA 从驱动分支 560 开始放弃了对 Volta 的支持。最后一个同时支持我的 RTX 4080（Ada）和 V100（Volta）的驱动是 550.x 分支，对应的是 nv\n\nidiaPackages.legacy_535 在 NixOS 上。该驱动仅支持 CUDA 12.2。当前 nixpkgs 最低只提供 CUDA 12.6。因此，我不得不从 nixpkgs 24.05 中提取 CUDA 12.2。此外，该驱动需要内核 6.6。较新的内核不受旧版驱动支持。还有一个奇怪的地方：尽管这是一个无头推理服务器，但必须启用 services.xserver.enable = true。否则，NVIDIA 内核模块将无法加载。NixOS 让大部分配置变得简单直接。以下是正确配置驱动和内核的关键设置：boot.kernelPackages = pkgs.linuxPackages_6_6; hardware.nvidia.package = config.boot.kernelPackages.nvidiaPackages.legacy_535; services.xserver.enable = true; services.xserver.videoDrivers = [\"nvidia\"]; 至于从旧版 nixpkgs 加载 CUDA 12.2（因为当前版本仅提供 12.6+）：nixpkgs. overlays = [(final: prev: { cudaPackages_12_2 = nixpkgs-cuda.legacyPackages.${prev.system}.cudaPackages_12_2; })]; 重要的是：它运行正常。两块 GPU 都能识别，CUDA 功能正常，NixOS 优雅地处理了整个过程。如果你想复现这个配置，完整的机器定义在我的 dotfiles 仓库的这个提交中，包括 llama.cpp 服务定义和固定到正确版本的自定义构建。\n\n运行模型 我正在运行 Qwen3.6-27B-MTP，量化版本为 Q5_K_M，大小约为 19GB。使用两块 GPU，整个模型可以完全放入显存，并留有上下文空间：\n\n设置\t值 模型\tQwen3.6-27B-MTP Q5_K_M (19GB) 上下文大小\t128k tokens GPU 层数\t99（全部卸载） 张量拆分\t-ts 1.0,1.0（两块 GPU 均匀分配） 性能表现：\n\n指标\t值 推理速度\t约 32 tok/s 提示处理速度\t约 133-160 tok/s 每秒 32 个 token 的速度足以满足交互式使用。考虑到网络延迟，这比大多数云端 API 端点更快。而且这是在通过 PCIe 连接的两个不同 GPU 架构之间进行张量拆分的情况下实现的。\n\n这个模型确实不错 我想明确一点：这不是“对于本地模型来说不错”，也不是“如果你降低期望值可以接受”。Qwen3.6-27B 在 Artificial Analysis 的 Agentic Index 上与 Claude Sonnet 4.6 持平。它在 MMMU-Pro 和 Terminal-Bench 2.0 上甚至超过了 Sonnet 4.6。一个运行在二手硬件上的 270 亿参数模型，竟然能与 Anthropic 最新的云端模型真正一较高下。是的，Sonnet 4.6 在 GPQA 和 SWE-Bench Verified 上略胜一筹。这是应该的，它是一个庞大的专有模型。而且，如果你追求绝对最佳，还有 Opus 4.8。但它每 20 分钟重度使用的成本，比我购买这套 GPU 和适配器组合的总花费还要高。但差距已经小得惊人。我们已经到了这样一个阶段：你在卧室里运行的模型，已经可以和那些按 token 收费的模型相提并论了。\n\n多 Token 预测 模型名称中的 MTP 代表多 Token 预测。普通的 LLM 推理一次预测一个 token。预测一个 token，接受它，再预测下一个 token，如此重复。MTP 改变了这一点，它让模型一次预测多个未来 token，然后验证哪些是正确的。被接受的 token 基本上是免费的。错误的预测则回退到正常路径。结果是在不损失准确性的情况下，生成速度大约提升 1.5-2 倍。在我的设置中，当 MTP 发挥其优势时，尤其是在生成代码等可预测的输出时，推理速度可以从大约 32 tok/s 提升到 50-60 tok/s。问题在于，llama.cpp 中的 MTP 支持还很新。版本\n\nnixpkgs 中的 llama.cpp 不支持 Qwen3.6 的 MTP 架构，所以我不得不从特定提交的源码编译 llama.cpp，该提交添加了相关支持。在 NixOS 上，这个过程毫无痛苦。我编写了一个自定义派生式，固定到正确的提交，整个过程是可复现的。当我想更新模型或更改 llama.cpp 版本时，只需在配置中修改一行，运行 nixos-rebuild switch，就完成了。没有依赖地狱，无需手动重新安装，也不用担心是否针对正确的 CUDA 版本构建。\n\n## 视觉：模型如何“看”图像\n\nQwen3.6-27B 模型通过一个独立的多模态投影仪文件（mmproj）支持图像输入。这个文件大约 928MB，非常有趣。其工作原理是：一个视觉编码器（类似于 ChatGPT 和 Claude 使用的）接收图像像素，并将其转换为 LLM 的 token 嵌入空间。模型并不像人类那样“看”图像。相反，视觉编码器将图像压缩成一个向量序列，这些向量与文本 token 处于相同的数学空间。然后，LLM 将这些向量当作另一系列 token 来处理。\n\n实际应用意味着：你可以向模型发送一个图像 URL 以及文本提示，它就能描述、分析和推理所见内容。整个视觉能力为模型增加了约 1GB 的大小。仅此而已。一个 GB，你的本地 LLM 就能读取图像了。在 llama.cpp 中，相关标志很简单： ``` --mmproj /mnt/nas/llamacpp/mmproj-F16.gguf --mmproj-offload ``` `--mmproj-offload` 标志将视觉编码器与模型一起加载到 GPU 上，这样即使处理图像也能保持快速推理。\n\n## 通过 OpenCode 运行\n\n我将这个设置与 OpenCode 一起使用，OpenCode 是一个 AI 编码助手，可以运行在本地模型上。LLM 服务器运行在我的台式机上，但我并不在那台机器上使用它。我通过家里的其他机器通过网络使用，或者通过 Tailscale 从外部使用（但那是另一篇博客文章的内容）。将 OpenCode 指向 llama.cpp 服务器，只需设置 API URL 即可。模型在本地运行，响应速度快，没有任何数据离开我的网络。\n\n## NAS 和 USB 驱动器\n\n所有模型都存放在我的 TrueNAS 服务器上，通过 NFS 挂载： ``` fileSystems.\"/mnt/nas\" = { device = \"truenas-nfs.tymscar.com:/mnt/oasis/services\"; fsType = \"nfs\"; options = [ \"nfsvers=4\" \"_netdev\" \"auto\" \"nofail\" ]; }; ``` llama.cpp 服务依赖于 `mnt-nas.mount`，因此直到 NAS 可用时才会启动。这意味着我可以存储数 TB 的模型，而无需担心本地磁盘空间。整个操作系统运行在一个 Corsair MP600 MINI 上，该硬盘装在 DockCase USB-C NVMe 硬盘盒中。无需修改内部驱动器。当我想玩游戏时，拔掉硬盘，重启进入主 Windows 系统，在 4080 上正常游戏。当我想进行 LLM 相关工作时，插回硬盘，重启进入 NixOS，两个 GPU 都可用。这不如双启动菜单优雅，但简单且有效。没有 GRUB，没有引导加载器冲突，没有分区管理。只是一个物理开关。\n\n## 唯一烦人的事\n\nV100 在热重启（操作系统重启但主板保持通电）后偶尔会从 `lspci` 和 `nvidia-smi` 中消失。这似乎是 PCIe 插槽的 ACPI 枚举问题。冷重启（物理断电，等待几秒，再通电）总能恢复。当 V100 缺失时，llama.cpp 无法启动，因为单个 16GB GPU 装不下模型。服务会崩溃循环。\n\n直到GPU恢复为止。实际上这不算大问题，因为我通常会在重启时在场，但了解一下还是有必要的。这让我想起了臭名昭著的AMD GPU重置bug——将AMD GPU直通给虚拟机后关闭，会导致GPU陷入一种只有完全重启宿主机才能修复的状态。\n\n最终成果 # 花200英镑，我得到了：\n- 一块16GB数据中心GPU与我的游戏GPU协同工作\n- 总计32GB显存用于本地大语言模型推理\n- 在27B参数模型上实现每秒32个token的处理速度\n- 128k token上下文窗口\n- 支持图像输入的视觉功能\n- 完全本地运行的模型，无需云端，无按token计费成本\n\n唯一的实际代价是噪音，而我用价值2英镑的跳线和一番接口探索解决了这个问题。V100并非最快的推理GPU，且跨两种不同架构的张量拆分也不如单GPU方案干净利落。但就这个价格而言，性价比高得离谱。如果你想在本地运行像样的模型，不妨关注二手市场。", "zh": true}, {"seq": 6, "title": "教皇似乎比Geoffrey Hinton更懂人工智能", "source": "Gary Marcus：The Road to AI We Can Trust（RSS）", "summary": "这一观点强调，单纯分析AI的输出内容，无法还原其生成过程与背后的推理逻辑，触及了当前AI可解释性研究的核心挑战。", "url": "https://garymarcus.substack.com/p/the-pope-appears-to-understand-ai", "permalink": "https://aihot.virxact.com/items/cmpu1hyyy00tosla8zp4xb8nj", "publishedAt": "2026-06-01T00:00:00.000Z", "exact": false, "content": "", "zh": true}]}]};
function pad(n){return n<10?"0"+n:""+n;}
function toBeijingHuman(iso, ref, exact){
  const d=new Date(iso); const bj=new Date(d.getTime()+8*3600*1000);
  const Y=bj.getUTCFullYear(),M=bj.getUTCMonth()+1,D=bj.getUTCDate();
  const h=bj.getUTCHours(),m=bj.getUTCMinutes(); const hh=pad(h),mm=pad(m);
  if(!exact) return M+"月"+D+"日";
  const [rY,rM,rD]=ref.split("-").map(Number);
  if(Y===rY&&M===rM&&D===rD) return "今天 "+hh+":"+mm;
  const yest=new Date(rY,rM-1,rD); yest.setDate(yest.getDate()-1);
  if(Y===yest.getFullYear()&&M===yest.getMonth()+1&&D===yest.getDate()) return "昨天 "+hh+":"+mm;
  return M+"月"+D+"日 "+hh+":"+mm;
}

function escapeHtml(s){return (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function escapeAttr(s){return escapeHtml(s);}
// 渲染正文（纯文本归档）：图片不加载远程资源，仅以文字占位符呈现；其余文本按段落转义（防 XSS）
function linkify(escaped){
  if(!escaped) return escaped;
  var re=/(\[[^\]]+\]\((https?:\/\/[^)\s]+)\))|(https?:\/\/[^\s<>"'）】」』，。、；：！？]+)/g;
  return escaped.replace(re, function(m, g1, g2, g3){
    if(g2!==undefined){
      var label=m.substring(m.indexOf('[')+1, m.indexOf(']'));
      return '<a class="r-link" href="'+g2+'" target="_blank" rel="noopener noreferrer">'+label+'</a>';
    }
    if(g3!==undefined){
      return '<a class="r-link" href="'+g3+'" target="_blank" rel="noopener noreferrer">'+g3+'</a>';
    }
    return m;
  });
}
var _IMG_RE=/!\[([^\]]*)\]\(([^)\s]+)\)/g;
function renderRich(text){
  return (text||"").split(/\n{1,}/).map(function(p){
    p=p.trim(); if(!p) return '';
    var out=''; var last=0; var m; _IMG_RE.lastIndex=0;
    while((m=_IMG_RE.exec(p))!==null){
      out+=linkify(escapeHtml(p.slice(last,m.index)));
      var cap=(m[1]||'').trim()||'图片';
      out+='<span class="r-img-cap">🖼 '+escapeHtml(cap)+'</span>';
      last=_IMG_RE.lastIndex;
    }
    out+=linkify(escapeHtml(p.slice(last)));
    return '<p>'+out+'</p>';
  }).join("");
}
function openReader(it){
  const r=document.getElementById("reader");
  const content=(it.content||"").trim();
  const body=document.getElementById("readerBody");
  if(content.length>0){
    body.innerHTML=renderRich(content);
  }else{
    const sum=(it.summary||"").trim();
    if(sum){
      // 来源站点多为付费墙 / 登录墙 / 反爬限制，无法镜像全文；展示已本地存档的中文摘要兜底
      body.innerHTML='<div class="r-fallback">⚠️ 该条新闻的<b>全文镜像暂不可用</b>（来源站点可能为付费墙 / 登录墙 / 反爬限制，或原文已失效）。下方为已<b>本地存档的中文摘要</b>，可正常查看；完整原文请点击右下角「查看原文 ↗」。</div>'+
        '<p class="r-summary">'+linkify(escapeHtml(sum))+'</p>';
    }else{
      body.innerHTML='<p class="r-empty">暂未获取到该条新闻的全文镜像与摘要。'+(it.url?'可点击右下角「查看原文 ↗」前往原始报道。':'')+'</p>';
    }
  }
  document.getElementById("readerTitle").textContent=it.title;
  document.getElementById("readerSource").textContent=it.source;
  const link=document.getElementById("readerLink");
  if(it.url){link.href=it.url;link.style.display="";}else{link.style.display="none";}
  r.hidden=false;document.body.style.overflow="hidden";
}
function closeReader(){const r=document.getElementById("reader");r.hidden=true;document.body.style.overflow="";}
document.getElementById("reader").addEventListener("click",function(e){if(e.target===this)closeReader();});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeReader();});
