t.com/items/cmpt5p76d07g3sluzcbxft4f4", "publishedAt": "2026-06-01T00:00:00.000Z", "exact": false, "content": "6000 多公里全程零干预：特斯拉 FSD 完成全球首次横穿加拿大自动驾驶 - IT之家 首页 IT圈 最会买 设置 日夜间 随系统 浅色 深色 主题色 黑色 投稿 订阅 RSS订阅 收藏IT之家 软媒应用 App客户端 要知App 软媒魔方 业界 手机 电脑 测评 视频 AI 苹果 iPhone 鸿蒙 软件 智车 数码 学院 游戏 直播 5G 微软 Win10 Win11 专题 搜索 首页 \u003e 智车之家 \u003e 车用技术 6000 多公里全程零干预：特斯拉 FSD 完成全球首次横穿加拿大自动驾驶 2026/5/31 9:30:46 来源： IT之家 作者： 远洋 责编： 远洋 评论： 感谢IT之家网友 不予置评 的线索投递！\n\nIT之家 5 月 31 日消息，特斯拉车主在北美成功完成了一项曾被视作自动驾驶测试领域终极目标的挑战。一群热衷电动汽车的爱好者，完成了全球首趟全程无人工干预、横穿加拿大的不间断自动驾驶之旅，车辆在纵贯整个加拿大的行驶过程中，所有操作全部由 FSD 完成，全程无需人为修正操作。参与者戴维・莫斯（账号 @DavidMoss）在社交平台 X 上公布了这一里程碑成果，宣布团队顺利完成了这场跨加拿大自动驾驶实测。车辆从不列颠哥伦比亚省温哥华的马蹄湾码头出发，历时 4 天 21 小时，最终抵达新斯科舍省哈利法克斯的特斯拉官方展厅。此次长途行程共计行驶 3760 英里（6051 公里），途经加拿大路况差异极大的各类道路。\n\n六千公里全程零接管 这场公路测试之所以成为汽车技术领域的标志性事件，在于其执行标准极为严苛。据莫斯介绍，整段旅程全程零系统退出、零任何形式的人工介入。特斯拉人工智能主管阿肖克・埃卢斯瓦米也对此项成果表示认可，向莫斯及其团队送上祝贺并致谢。车辆全程自主完成多项高难度操作： 驶入高速主干道、应对多变天气、顺利通过复杂施工路段。更值得一提的是，每一处停靠点的泊车流程也均由系统全自动完成 。行驶途中，车辆途经多个特斯拉超级充电站，全程自动转向、对位、倒车入位，驾驶员全程未触碰方向盘与踏板。\n\n搭载春季新版固件系统 本次跨洲行程全程依靠特斯拉最新推送的 FSD V14.3.3 版本运行。该版本随 2026.14.6.6 软件更新于本月上旬逐步推送，整合了外界期待已久的 2026 春季软件更新功能，并将其正式纳入自动驾驶固件体系。除优化底层路径规划神经网络外，V14.3.3 版本的车载界面与座舱功能升级也收获大量好评。该版本放宽了驾驶员监测相关判定标准，带来更接近专职司机代驾的轻松体验，也让驾驶员在这场耗时近五天的长途穿越中更加舒适。\n\n自动驾驶创下空前优异表现 此番横穿加拿大的全程零干预驾驶是一项全新纪录，而莫斯今年已接连创下多项自动驾驶佳绩。今年春季早些时候，他就因完成美国境内 2700 英里（IT之家注：约 4345 公里）跨东西海岸 FSD 自动驾驶行程登上新闻，全程同样零人工介入，证实这套系统可独立完成从洛杉矶到南卡罗来纳州的全程行驶。此外，他的车辆也成为测试车队长期稳定性的重要参照。此前莫斯就曾分享，车辆搭载 V14.2 版本系统时，已累计实现近 13000 英里（约 20921 公里）的零干预自动驾驶里程。目前，监督版 FSD 在官方定义中仍属于二级驾驶辅助系统，按照规范仍需驾驶员时刻监管。但这些由民间实测完成的数千公里长距离路测预示着，无监督 FSD 落地已不远。\n\n广告声明：文内含有的对外跳转链接（包括不限于超链接、二维码、口令等形式），用于传递更多信息，节省甄选时间，结果仅供参考，IT之家所有文章均包含本声明。\n\n投诉水文 我要纠错 下载IT之家APP，签到赚金币兑豪礼 相关文章 关键词： 特斯拉 ， 自动驾驶 ， FSD 特斯拉 FSD 学会了“躲警车”，主动减速变道 减少“盯路”提醒，特斯拉 FSD 14.3.3 放宽驾驶员监控机制 特斯拉监督版 FSD 登陆立陶宛，欧洲扩张再下一城 老款车型无法支持无监督 FSD，车主起诉特斯拉虚假宣传胜诉 特斯拉推送 FSD V14.3.3：智能召唤最高时速提升至 13 公里 / 小时 特斯拉强制要求驾驶员接管 FSD 时提供反馈，屏幕弹窗引争议 软媒旗下网站： IT之家 最会买 - 返利返现优惠券 iPhone之家 Win7之家 Win10之家 Win11之家 软媒旗下软件： 软媒手机APP应用 魔方 最会买 要知 关于IT之家 | 联系我们 | 加入软媒 | WAP版 | 网站地图 | Archiver IT之家，软媒旗下科技门户网站 - 爱科技，爱这里。\n\nCopyright © RuanMei.com , All Rights Reserved. 青岛软媒网络科技有限公司 版权所有"}]}, {"label": "技巧与观点", "color": "#0284c7", "items": [{"seq": 5, "title": "我花200英镑把一台数据中心级GPU装进了我的游戏电脑", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "summary": "一名用户以200英镑的价格购入了一块数据中心级GPU，并将其成功安装到自己的游戏电脑中。文章记述了这一非标准硬件改装过程、遇到的技术挑战以及最终实现本地运行大语言模型的体验。", "url": "https://blog.tymscar.com/posts/v100localllm", "permalink": "https://aihot.virxact.com/items/cmptzehi500cdsla80uvg4kgh", "publishedAt": "2026-06-01T00:00:00.000Z", "exact": false, "content": "];\n`\n以及从较旧的 nixpkgs 加载 CUDA 12.2 的方法，因为当前的 nixpkgs 只提供 12.6 及以上版本：\n\n`nixpkgs.overlays = [\n  (final: prev: {\n    cudaPackages_12_2 = nixpkgs-cuda.legacyPackages.${prev.system}.cudaPackages_12_2;\n  })\n];\n`\n重要的是：它运行起来了。两块 GPU 都能识别，CUDA 功能正常，NixOS 优雅地处理了整个过程。如果你想复现这个配置，完整的机器定义在我的 dotfiles 仓库的这个提交中，包括 llama.cpp 服务定义和锁定到正确版本的自定义构建。\n\n运行模型#\n\n我正在运行量化到 Q5_K_M 的 Qwen3.6-27B-MTP 模型，大小约为 19GB。使用两块 GPU，整个模型可以放入显存，并且还有上下文空间：\n 设置项值模型Qwen3.6-27B-MTP Q5_K_M（19GB）上下文大小128k 模型 tokenGPU 层数99（全部卸载到 GPU）张量拆分-ts 1.0,1.0（在两块 GPU 之间均匀分配）\n性能表现：\n 指标值推理速度约 32 tok/s提示词处理约 133-160 tok/s\n每秒 32 个 token 的速度对于交互式使用来说足够快了。考虑到网络延迟，这比大多数云端 API 端点都要快。而且这还是通过 PCIe 连接的两个不同 GPU 架构之间进行张量拆分的结果。\n\n这个模型实际上很不错#\n\n我想把话说清楚。这并非“对于本地模型而言表现不错”，也不是“降低预期后尚可接受”。Qwen3.6-27B 在 Artificial Analysis 的智能体指数上与 Claude Sonnet 4.6 打成平手，在 MMMU-Pro 和 Terminal-Bench 2.0 上甚至超越了 Sonnet 4.6。一个运行在二手硬件上的 270 亿参数模型，确实能与 Anthropic 最新的云端模型一较高下。\n\n没错，Sonnet 4.6 在 GPQA 和 SWE-Bench Verified 上略胜一筹。这也在情理之中，毕竟它是一个庞大的专有模型。同样，如果你追求极致性能，还有 Opus 4.8 可选。但重度使用 20 分钟的费用，比我买这块 GPU 和整套转接设备的总花费还高。然而，差距已经小得惊人。我们已经到了这样一个节点：你在卧室里跑起来的模型，已经能和那些按 token 收费的模型相提并论了。\n\n多 Token 预测#\n\n模型名称中的 MTP 代表多 Token 预测。常规的大语言模型推理一次只预测一个 token：预测一个 token，接受它，再预测下一个 token，如此循环。MTP 改变了这一点，它让模型一次性预测多个未来 token，然后验证哪些是正确的。被接受的 token 基本算是免费获得的，错误的预测则回退到常规路径。\n\n结果是生成速度大约提升 1.5 到 2 倍，且精度毫无损失。在我的设备上，这意味着当 MTP 发挥最佳性能时，推理速度能从大约 32 tok/s 提升到 50-60 tok/s，尤其是在处理代码这类可预测的输出时。\n\n问题在于 llama.cpp 对 MTP 的支持还很新。nixpkgs 中的版本不支持 Qwen3.6 的 MTP 架构，所以我不得不从添加了该支持的特定提交版本开始，从源码构建 llama.cpp。在 NixOS 上，这很简单。我创建了一个指向正确提交的自定义派生包，整个过程是可复现的。当我想更新模型或更改 llama.cpp 版本时，只需修改配置文件中的一行，运行 nixos-rebuild switch 即可。没有依赖地狱，无需手动重装，也不用担心是否针对正确的 CUDA 版本进行了构建。\n\n视觉能力：模型如何理解图像#\n\nQwen3.6-27B 模型通过一个独立的多模态投影文件（mmproj）支持图像输入。这个文件大约 928MB，其功能令人着迷。\n\n其工作原理是：一个视觉编码器（类似于 ChatGPT 和 Claude 所使用的）将图像像素转换到大语言模型的 token 嵌入向量空间。该模型并不会像人类那样“看见”图像。相反，视觉编码器将图像压缩成一系列向量，这些向量与文本 token 处于同一个数学空间中。然后，大语言模型将这些向量当作另一串 token 序列来处理。\n\n这在实践中意味着：你可以将图像 URL 连同文本提示词一起发送给模型，模型就能描述、分析并推理它所看到的内容。整个视觉能力大约给模型增加了 1GB 的大小。仅此而已。增加一个 GB，你的本地大语言模型就能读取图像了。\n\n在 llama.cpp 中，相关的标志参数很直接：\n\n`--mmproj /mnt/nas/llamacpp/mmproj-F16.gguf --mmproj-offload\n`\n`--mmproj-offload` 标志会将视觉编码器与模型一同加载到 GPU 上，这样即使处理图像，你依然能获得快速的推理速度。\n\n通过 OpenCode 运行\n\n我将这套设置与 OpenCode 配合使用，这是一个能够对接本地模型的 AI 编程助手。大语言模型服务器运行在我的台式机上，但我并不在那台机器上使用它。我通过局域网在家中任何其他机器上使用它，或者通过 Tailscale 从外部访问（不过这属于另一篇博客文章的内容了）。将 OpenCode 指向 llama.cpp 服务器，只需设置 API URL 即可。模型在本地运行，响应速度快，且没有任何数据离开我的网络。\n\nNAS 与 USB 驱动器\n\n所有模型都存放在我的 TrueNAS 服务器上，通过 NFS 挂载：\n\n`fileSystems.\n = {\n  device =\n;\n  fsType =\n;\n  options = [\n ];\n`\nAnd for loading CUDA 12.2 from an older nixpkgs since the current one only ships 12.6+:\n\n`nixpkgs.overlays = [\n  (final: prev: {\n    cudaPackages_12_2 = nixpkgs-cuda.legacyPackages.${prev.system}.cudaPackages_12_2;\n  })\n];\n`\nThe important thing is: it works. Both GPUs show up, CUDA is functional, and NixOS handled the whole thing elegantly. If you want to replicate this, the entire machine definition is in  ];\n};\n`\nThe llama.cpp service depends on `mnt-nas.mount`, so it does not start until the NAS is available. This means I can store terabytes of models without worrying about local disk space.\n\nThe entire OS runs from a \u003ca href="}, {"seq": 6, "title": "教皇似乎比Geoffrey Hinton更懂人工智能", "source": "Gary Marcus：The Road to AI We Can Trust（RSS）", "summary": "这一观点强调，单纯分析AI的输出内容，无法还原其生成过程与背后的推理逻辑，触及了当前AI可解释性研究的核心挑战。", "url": "https://garymarcus.substack.com/p/the-pope-appears-to-understand-ai", "permalink": "https://aihot.virxact.com/items/cmpu1hyyy00tosla8zp4xb8nj", "publishedAt": "2026-06-01T00:00:00.000Z", "exact": false, "content": ""}]}]};
function pad(n){return n<10?"0"+n:""+n;}
function toBeijingHuman(iso, ref, exact){
  const d=new Date(iso); const bj=new Date(d.getTime()+8*3600*1000);
  const Y=bj.getUTCFullYear(),M=bj.getUTCMonth()+1,D=bj.getUTCDate();
  const h=bj.getUTCHours(),m=bj.getUTCMinutes(); const hh=pad(h),mm=pad(m);
  if(!exact) return M+"月"+D+"日";
  const [rY,rM,rD]=ref.split("-").map(Number);
  if(Y===rY&&M===rM&&D===rD) return "今天 "+hh+":"+mm;
  const yest=new Date(rY,rM-1,rD); yest.setDate(yest.getDate()-1);
  if(Y===yest.getFullYear()&&M===yest.getMonth()+1&&D===yest.getDate()) return "昨天 "+hh+":"+mm;
  return M+"月"+D+"日 "+hh+":"+mm;
}

    card.innerHTML='<div class="top"><span class="seq">'+it.seq+'</span><span class="time">'+time+'</span></div>'+
      '<h3>'+escapeHtml(it.title)+'</h3><span class="chip">'+escapeHtml(it.source)+'</span>'+
      '<p class="summary">'+escapeHtml(it.summary)+'</p>'+
      '<a class="readmore" href="'+escapeAttr(url)+'" target="_blank" rel="noopener noreferrer" title="外部原文链接，可能需要访问境外站点">来源 ↗</a>';
    card.addEventListener("click", function(){ openReader(it); });
    const rm = card.querySelector(".readmore");
    rm.addEventListener("click", function(e){ e.stopPropagation(); });
    grid.appendChild(card);
  });
  sec.appendChild(grid);mainEl.appendChild(sec);
});
function escapeHtml(s){return (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function escapeAttr(s){return escapeHtml(s);}
// 渲染正文（纯文本归档）：图片不加载远程资源，仅以文字占位符呈现；其余文本按段落转义（防 XSS）
function linkify(escaped){
  if(!escaped) return escaped;
  var re=/(\[[^\]]+\]\((https?:\/\/[^)\s]+)\))|(https?:\/\/[^\s<>"'）】」』，。、；：！？]+)/g;
  return escaped.replace(re, function(m, g1, g2, g3){
    if(g2!==undefined){
      var label=m.substring(m.indexOf('[')+1, m.indexOf(']'));
      return '<a class="r-link" href="'+g2+'" target="_blank" rel="noopener noreferrer">'+label+'</a>';
    }
    if(g3!==undefined){
      return '<a class="r-link" href="'+g3+'" target="_blank" rel="noopener noreferrer">'+g3+'</a>';
    }
    return m;
  });
}
var _IMG_RE=/!\[([^\]]*)\]\(([^)\s]+)\)/g;
function renderRich(text){
  return (text||"").split(/\n{1,}/).map(function(p){
    p=p.trim(); if(!p) return '';
    var out=''; var last=0; var m; _IMG_RE.lastIndex=0;
    while((m=_IMG_RE.exec(p))!==null){
      out+=linkify(escapeHtml(p.slice(last,m.index)));
      var cap=(m[1]||'').trim()||'图片';
      out+='<span class="r-img-cap">🖼 '+escapeHtml(cap)+'</span>';
      last=_IMG_RE.lastIndex;
    }
    out+=linkify(escapeHtml(p.slice(last)));
    return '<p>'+out+'</p>';
  }).join("");
}
function openReader(it){
  const r=document.getElementById("reader");
  const content=(it.content||"").trim();
  const body=document.getElementById("readerBody");
  if(content.length>0){
    body.innerHTML=renderRich(content);
  }else{
    const sum=(it.summary||"").trim();
    if(sum){
      // 来源站点多为付费墙 / 登录墙 / 反爬限制，无法镜像全文；展示已本地存档的中文摘要兜底
      body.innerHTML='<div class="r-fallback">⚠️ 该条新闻的<b>全文镜像暂不可用</b>（来源站点可能为付费墙 / 登录墙 / 反爬限制，或原文已失效）。下方为已<b>本地存档的中文摘要</b>，可正常查看；完整原文请点击右下角「查看原文 ↗」。</div>'+
        '<p class="r-summary">'+linkify(escapeHtml(sum))+'</p>';
    }else{
      body.innerHTML='<p class="r-empty">暂未获取到该条新闻的全文镜像与摘要。'+(it.url?'可点击右下角「查看原文 ↗」前往原始报道。':'')+'</p>';
    }
  }
  document.getElementById("readerTitle").textContent=it.title;
  document.getElementById("readerSource").textContent=it.source;
  const link=document.getElementById("readerLink");
  if(it.url){link.href=it.url;link.style.display="";}else{link.style.display="none";}
  r.hidden=false;document.body.style.overflow="hidden";
}
function closeReader(){const r=document.getElementById("reader");r.hidden=true;document.body.style.overflow="";}
document.getElementById("reader").addEventListener("click",function(e){if(e.target===this)closeReader();});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeReader();});
</script>
