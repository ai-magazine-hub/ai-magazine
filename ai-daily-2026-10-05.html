const DATA = {"meta": {"reportDate": "2026-10-05", "reportDateHuman": "2026年10月5日", "weekday": "星期一", "total": 5, "source": "AI HOT", "sourceUrl": "https://aihot.news", "generatedAt": "2026年10月06日 14:02"}, "sections": [{"label": "行业动态", "color": "#d97706", "items": [{"seq": 1, "title": "OpenAI 公布 EU AI Act 下的文本溯源方案，推出 textGrain 文本水印", "source": "OpenAI：官网动态（RSS · 排除企业/客户案例）", "summary": "OpenAI 公布应对 EU AI Act 的文本水印方案，发布在模型词选择中加入不可见统计信号的 textGrain 技术，API 客户即日起可对部分模型选择性开启水印，未来数周将在欧盟地区为 ChatGPT 和 Codex 输出添加隐形水印，检测器暂只向获批的研究者和专家机构开放。", "url": "https://openai.com/index/eu-text-provenance", "permalink": "https://aihot.news/items/xx5mgdemrqmqw5zw410sbawcz", "publishedAt": "2026-10-05T15:00:00.000Z", "exact": true, "fromFeed": true, "content": "我们对欧盟文本来源规则的处理方法 在当今技术的限制内提高透明度。 内容来源可以帮助人们了解内容的来源、内容的创建或编辑方式以及内容是否包含与我们的模型相关的信号。我们已经公开提供工具来识别我们的模型生成的图像和音频。今天，我们将分享我们响应欧盟人工智能法案的文本水印方法，以及它如何融入我们更广泛的工作。 欧盟人工智能法案要求生成式人工智能提供商以机器可读的方式生成可识别的文本。文本水印和检测仍然是早期技术，具有很大的局限性，关于其好处和负责任的使用的观点仍在发展中。我们的分阶段方法反映了欧盟人工智能法案的要求以及技术的局限性，重点是文本水印可以告诉人们什么和不能告诉人们什么的透明度：\n- 从今天开始，全球 API 客户将能够为选定型号选择文本水印。默认情况下，API 中的文本水印将保持关闭状态。\n- 在接下来的几周内，我们将在欧盟合格的 ChatGPT 和 Codex 文本输出中添加隐形水印。\n- 我们正在打开应用程序来访问我们的文本水印检测器。访问最初仅限于可以帮助我们评估和改进技术的经批准的研究人员和专家组织。\n- 上述内容仅适用于文本来源 - 我们的音频和图像验证工具，包括我们的 openai.com/verify Web 工具和我们的内容来源 API（在新窗口中打开），将继续向希望了解图像或音频文件是否由我们的系统之一生成的组织公开访问。\n我们的文本水印技术 textGrain 为模型的单词选择添加了不可见的统计信号。我们的检测器寻找该信号来评估段落是否包含 OpenAI 水印。有关 textGrain 工作原理的更多详细信息，请参阅我们的技术报告（在新窗口中打开），该报告将在未来几周内更新更多详细信息。我们还计划以开源方式提供该技术，以便其他人可以在此基础上进行构建。 在我们的评估中，textGrain 匹配或超过了我们测试的其他方法的性能，包括用于文本的 SynthID。即便如此，理想条件下的强大性能并不能保证日常使用中的可靠检测。 检测器可能会犯两种错误：它们可以报告不存在的水印（误报），或者漏掉存在的水印（漏报）。我们的以下评估说明了一些挑战：\n- 较短或限制较多的文本更难检测。在目标误报率为 1% 的情况下，对于心理学等内容，我们的检测器在 200 个令牌的段落中识别出约 80% 的水印，而在 400 个令牌的段落中识别出水印的比例约为 95%。对于诸如数学之类的内容，检测率要低得多，因为这些内容的词语选择灵活性较差。\n- 编辑可以削弱水印。在对 400 个标记的段落的评估中，用同义词替换 10% 的单词将检测率从大约 92% 降低到 66%。替换 25% 的单词将其减少到 17%。\n这些限制促使我们决定仅向经批准的研究人员和专家组织提供初始探测器访问权限，他们可以帮助我们评估可靠性和负责任的使用。 在我们用来评估 Astra（我们最新的前沿模型）的基准中，我们没有看到有水印和没有水印的有意义的性能差异。 文本水印提供了有关我们的系统在段落中所扮演的角色的有限信号。重要的是要了解从检测结果中可以得出什么结论，不能得出什么结论。\n- 水印不衡量人类的贡献。它可以表明 OpenAI 系统生成或处理了一段段落的一部分，但不能表明其中涉及了多少人类判断、编辑或创造力。\n- 水印不确立所有权或责任。它无法确定谁拥有该文本、其使用是否合法、是否需要披露或谁对此负责。\n- 水印无法识别用户。它不会将个人、组织、帐户、提示或对话与文本关联起来。\n- 水印不能验证准确性。它不会告诉你一段话是否真实、是否具有误导性、是否有害，或者是否在正确的上下文中呈现。\n- 未检测到水印并不能证明作者身份。使用 OpenAI 工具生成的文本可能太短、经过编辑或翻译，无法可靠地进行检测。它也可能来自不受支持的模型、早于水印或由其他公司的工具生成。\n- 在欧盟推出文本水印。在接下来的几周内，我们将仅在欧盟的所有计划中向符合条件的 ChatGPT 和 Codex 用户引入文本水印。我们不会在发布时将文本水印设置为全局默认设置。这种区域性方法为我们提供了从现实世界的使用和反馈中学习的空间。\n- 为 API 客户启用选择加入水印。从今天开始，世界各地的 API 客户将能够为选定的模型选择带水印的文本输出。这让客户可以决定水印如何满足他们的透明度义务以及他们为用户提供的体验。我们还与云合作伙伴合作，在未来几周内为通过他们的服务访问的 OpenAI 模型输出提供水印。\n- 为研究人员和专家组织提供探测器访问权限。获得批准的研究人员和专家组织可以从今天开始申请。根据实践准则（在新窗口中打开），访问权限最初将根据具体情况授予，以支持文本来源的评估和改进。该工具将报告是否检测到 OpenAI 水印，而不会识别用户或泄露他们的提示或对话。考虑到丢失水印和误报的风险，我们不会在发布时公开发布。\n随着技术、标准和证据的发展，我们期望重新审视该方法的各个部分。 没有任何一种来源技术本身就足够了，因此我们采取了一种结合了开放标准、持久水印和验证工具的分层方法。 我们将内容凭证添加到支持的图像输出中，符合 C2PA(在新窗口中打开)，在支持的图像和音频中嵌入不可见的 SynthID(在新窗口中打开)水印，并通过 openai.com/verify 和我们的内容来源 API(在新窗口中打开) 提供图像和音频验证。这些技术相辅相成：内容凭证可以记录文件的来源和历史记录，而隐形水印可以在元数据被删除时保留信号。 正如我们在选举保障工作中所述，出处可以帮助人们和平台评估人工智能生成的潜在误导性内容，包括深度伪造内容。我们将这些信号与政策、滥用检测、报告、调查和执行相结合，并与研究人员、标准机构、平台和民间社会合作，使来源在更广泛的生态系统中发挥作用。 将出处扩展到文本需要考虑其重写、翻译或编辑的容易程度。正如我们在六月讨论的那样，我们的方法必须反映当前技术的实际限制。我们将继续改进检测，研究水印如何经受编辑和翻译，并探索更有意义地区分人工智能辅助与人工智能作者的方法。我们将随着证据、标准和监管要求的发展而调整我们的方法，并在我们认为可以负责任地解释结果时扩大检测器的访问范围。 欲了解更多信息，请访问我们的帮助中心文章（在新窗口中打开）。", "zh": true}]}, {"label": "产品发布/更新", "color": "#059669", "items": [{"seq": 1, "title": "OpenAI 在 ChatGPT 推出全新视觉广告格式并扩展广告测量工具", "source": "OpenAI：官网动态（RSS · 排除企业/客户案例）", "summary": "OpenAI 宣布在 ChatGPT 推出新的视觉广告格式，本月起在美国于图像生成场景中测试，广告将明确标注且不影响 ChatGPT 的回答。", "url": "https://openai.com/index/new-chatgpt-ads-format-and-measurement", "permalink": "https://aihot.news/items/e63lz9ky7ebdxjea930dh3o5y", "publishedAt": "2026-10-05T10:00:00.000Z", "exact": true, "fromFeed": true, "content": "为人们使用人工智能的方式制作广告 一种新的视觉广告格式可以帮助人们探索产品和服务，并通过扩展的测量来帮助企业了解广告的影响。我们在 ChatGPT 中引入了一种新的视觉广告格式，扩展了我们的衡量工具和合作伙伴关系，并开发了了解品牌适宜性的新方法。ChatGPT 每周覆盖 12 亿用户，使其成为全球最大的人工智能原生消费平台。广告帮助我们将人工智能的好处带给更多人。这种广泛的访问是我们使命的核心，也是我们业务的优势。它使我们能够服务于比单纯订阅更大的市场，同时为企业提供了一种新的方式来接触人们，让他们探索想法、做出决策并发现与他们想要实现的目标相关的产品和服务。\n\n我们新的视觉广告格式帮助人们想象产品和服务如何融入他们的生活。通过展示产品灵感、产品用途或它们所带来的体验的图像，人们可以发现一个新品牌，了解产品的独特之处，并决定购买什么。对于广告商来说，这创造了通过图像讲述故事的新机会。最初，我们将在 ChatGPT 中为 Free and Go 计划的用户生成图像期间测试这种新的广告格式。广告将被清楚地标记，并与正在创建的图像分开。与我们的其他广告格式一样，广告不会影响 ChatGPT 提供的答案。测试将于本月晚些时候在美国与第一批广告商开始。\n\n我们的 ChatGPT 广告衡量理念侧重于支持内部和合作伙伴主导的衡量解决方案。今天，我们正在扩展我们的衡量工具和合作伙伴生态系统，以帮助广告商了解 ChatGPT 广告如何使用他们已经依赖的系统为其业务做出贡献。与 Hightouch、Tealium 和 LiveRamp 的集成使广告商可以更轻松地将转化数据从其现有系统发送到 ChatGPT 广告。\n\n我们现在为网络和应用领域的领先归因合作伙伴提供支持，与 AppsFlyer、Triple Whale、Adjust、DV Rockerbox、Northbeam、Branch、Singular、Kochava、Airbridge 和 Tenjin 等公司合作，实现转化 API、报告和点击归因解决方案。我们还与全渠道和高级测量合作伙伴建立了合作伙伴关系，包括 Fospha、Measured 和 INCRMNTAL。增量衡量在更全面地了解广告的业务影响方面发挥着重要作用。虽然我们在增量方面的工作仍处于早期阶段，但我们正在与 Haus、Measured 和 WorkMagic 合作探索基于地理的实验，以帮助广告商了解 ChatGPT 广告的因果影响。\n\n早期合作伙伴的调查结果表明，不同衡量方法都表现出色。根据 DV Rockerbox 的数据，WeightWatchers 在 ChatGPT 广告上的每次获取成本比其混合付费搜索基准低 15.3%。WorkMagic 报告显示，健康品牌 Dose 的统计显着提升，增量购买量的 67% 来自新客户。据 Triple Whale 称，来自 ChatGPT 广告的 Portland Leather 访客中有 93% 是新访客。在我们的广告博客上了解有关这些衡量工具和合作伙伴关系的更多信息（在新窗口中打开）。\n\n对广告的信心还取决于对广告出现的环境的了解。OpenAI 的广告政策和护栏旨在保护用户、维护信任并让品牌对其广告投放充满信心。我们的展示位置护栏会评估对话是否适合广告，帮助广告远离情感脆弱、敏感或其他不合适的环境。自动审查、人工监督和持续监控帮助我们识别和解决政策违规行为，并随着时间的推移改进我们的保障措施。对于特定于品牌自身政策的狭窄展示位置要求，符合条件的广告商现在可以使用否定短语。\n\n我们还利用 DoubleVerify (DV) 和 Integral Ad Science (IAS) 开发品牌适宜性评估试点，以帮助广告商更好地了解广告环境。这种方法允许独立合作伙伴评估我们的品牌安全标准在受控测试环境中的应用情况，而无需访问私人用户对话。我们的目标是让广告商更加透明地了解这些保障措施的运作方式，同时保护对话隐私。我们新的视觉广告格式可以帮助人们发现产品和服务，并想象它们如何融入他们的生活，同时为广告商提供新的方式来更直观地讲述他们的故事。在 ChatGPT 广告中，扩大的衡量和品牌适用性工作可帮助企业了解广告活动的影响并在广告出现的环境中建立信心。这些功能符合我们的广告原则：ChatGPT 的答案保持独立，对话保持私密，用户仍然可以控制自己的体验。\n\n今天的更新是我们帮助人们在 ChatGPT 中发现产品和服务、评估选项并做出决策的更广泛目标的一部分。我们将继续以新的格式和功能发展我们的广告平台，帮助企业以有用且相关的方式接触客户，并为各种规模的企业提供成长和繁荣的机会。企业今天可以在 ads.openai.com(opens in a new window) 上注册广告。", "zh": true}]}, {"label": "论文研究", "color": "#e11d48", "items": [{"seq": 1, "title": "PromptArmor 披露 Databricks Genie 恶意 Skill 可绕过控制实现钓鱼与数据外泄", "source": "PromptArmor：Threat Intelligence", "summary": "PromptArmor 报告称 Databricks Genie Code 执行上传的恶意 Skill 后，可在聊天渲染结果时弹出钓鱼页面并经用户浏览器外泄租户数据，全程无需人工批准。", "url": "https://www.promptarmor.com/resources/four-databricks-genie-controls-that-dont-stop-malicious-skills", "permalink": "https://aihot.news/items/dfcis3hxowljt45i0bvyi3f0n", "publishedAt": "2026-10-05T00:24:02.000Z", "exact": true, "fromFeed": true, "content": "背景 Databricks Genie Code 是 Databricks 中的代理助手，使用户能够通过自然语言指令对其租户中的数据进行操作。 Genie Code 可以为用户呈现聊天中的显示内容；恶意技能可以利用此功能在查看工具结果时触发数据泄露并向用户显示网络钓鱼攻击。 这种攻击可以在没有任何人机交互批准的情况下发生，并且不受组织可能依赖的控制的约束：\n- 组织级技能治理； Genie Code 从用户的个人工作区加载技能，而不是组织的受管理目录\n- 一个护栏代理，在运行命令之前对其进行评估； Databricks 认为这是尽力而为的生产力功能，而不是安全控制\n- 编码环境出口控制；出口发生在用户的浏览器，而不是编码环境\n- 聊天中呈现的显示沙箱；技能使用用户数据构建显示，显示不需要进入租户来获取它\n该风险已于 2026 年 8 月 16 日向 Databricks 披露，但确定属于“用户有责任确保上传的技能不包含恶意内容”。鉴于恶意技能在在线市场中传播的盛行，并且组织所依赖的控制措施可能无法消除这种风险，我们发布此报告是为了告知那些面临风险的人。 攻击链\n- 提示 Genie 使用上传的技能分析数据技能通常通过在线市场分发，这是一个已知受到恶意技能污染的生态系统。 Databricks 确实有一个技能管理系统，但 Genie Code 使用的技能是从用户的个人工作空间配置的，而不是组织的受管理目录。\n- Genie 执行恶意 Skill 中的代码 当 Genie 执行 Skill 中的代码时，第二个代理会对其进行检查，该代理会标记超出用户预期操作的命令，例如“向第三方发送数据”的命令。循环中的代理批准运行技能代码，但未能捕获恶意功能。\n- Genie指导用户打开完整的数据分析结果\n- 当结果呈现时，会显示网络钓鱼模式，并且用户的数据集会被窃取。恶意技能中的代码会构建一个 HTML 元素，该元素有两个恶意目的。一个影响是，它会呈现攻击者网站的覆盖层，从而对用户进行网络钓鱼以获取凭据。另一个影响是，当呈现模式时（例如，当用户查看结果时），受害者租户的数据会被泄露。恶意 Skill 的代码利用对受害者租户的访问权限来收集敏感数据（例如受害者的数据集），然后将该数据构建到 HTML 显示中。当显示呈现时，恶意显示中的 JavaScript 会导致用户的浏览器发出网络请求，将数据泄露到攻击者的服务器。虽然编码环境具有网络出口控制，可以阻止与攻击者服务器的通信，但显示接口没有并且可以向攻击者发送数据。\n负责任的披露 该风险已于 2026 年 8 月 16 日报告给 Databricks。Databricks 团队确定： “最终用户有责任确保上传的技能不包含恶意内容。” 网络出口控制规定编码环境不允许联系不受信任的外部各方，这一点得到了维护。它只是查询数据并使用它来构建 iframe。 对呈现给用户的显示的控制规定不允许显示从租户查询数据，并且这一点得到了维持。它只是处理技能代码嵌入其中的数据。 这样，恶意Skill代码就可以查询计算环境中的数据，将其构建成iframe，iframe可以发出网络请求来窃取数据…… 我们认为这种交互代表了 Databricks 威胁模型中的一个漏洞，因为技术上支持的两项保证的目的是防止最终发生的数据泄露结果。 对于护栏代理批准的恶意命令，Databricks 团队指出， “自动允许功能并不是作为安全边界，而是作为一种控制措施，以防止不受信任的输入自动运行。” 文档支持该声明： 然而，由于“自动批准”被记录为默认和“推荐”命令批准模式，我们认为实际上用户不太可能遵守该指令，从而阻止其在生产数据中的使用。 没有给出任何与 Genie Code 的技能是从用户的个人工作区而不是组织级别的管理目录加载这一事实相关的声明。 时间轴 | 2026 年 8 月 16 日 | PromptArmor 向 Databricks 披露 | | 2026 年 8 月 17 日至 9 月 15 日 | PromptArmor 和 Databricks 协调 | | 2026 年 9 月 16 日 | PromptArmor 通知 Databricks 发布意图 |", "zh": true}]}, {"label": "模型发布/更新", "color": "#4f46e5", "items": [{"seq": 1, "title": "Liquid AI 发布 d1 决策模型并新增图像输入能力", "source": "Liquid AI 模型与工程博客（网页）", "summary": "Liquid AI 发布 d1 决策模型，新增文本与图像输入，可通过 console.liquid.ai 和 d1 Playground 使用。", "url": "https://www.liquid.ai/blog/d1-decision-model", "permalink": "https://aihot.news/items/uu1qa3hh83kc9i4u832wpywyp", "publishedAt": "2026-10-05T00:00:00.000Z", "exact": true, "fromFeed": true, "content": "推出 d1：最有能力的决策模型，现在具有愿景 今天，我们介绍 d1，我们的第一个决策模型，现在支持文本和图像。随着上周的实验发布，d1 成为第一个在文本决策方面与 Jev 竞争的模型，现在它是第一个将这些功能扩展到图像的模型。您今天可以在 console.liquid.ai 和 d1 Playground 中尝试。 我们在六个实际应用程序中针对 GPT-6.1 Sol 和 Claude Opus 5.5 测试了 d1，从过滤支持票到检查电路板。 d1 在其中四个方面匹配或击败了 GPT-6.1 Sol。它的成本比这两种模型低 19 倍到 200 倍，并且每项任务的响应速度都显着加快。 d1 决策模型的工作原理 决策模型回答有关情况的问题，并给出每个可能答案的概率。 d1 决策模型采用非结构化数据（例如文本、图像或两者）和一个或多个问题作为输入，在一次前向传递中读取它们，并返回概率，而不生成任何标记。文本决策需要 200 到 300 毫秒，对于实时应用来说已经足够快了。 d1 回答三种类型的问题：\n- Noul：是/否问题，回答概率在 0 到 1 之间。\n- 选择：从众多标签中选择一个，并用每个标签的概率来回答。\n- 分数：等级上的位置，按每个级别的概率进行加权。\n一个请求可以询问有关同一状态的多个问题，从而节省输入令牌。 d1 在行动 当答案是结构化决策时，决策模型可以取代对语言模型的昂贵调用。它们还支持各种新用例，本节中显示了一些用例。下面的每个演示都在 d1 Playground 中实时运行。 目视检查。此工业应用程序审查来自四个生产线的在摄像机下通过的零件：电路板、蜡烛、腰果和口香糖（公共 VisA 数据集）。 d1 以 85-97% 的准确率对良品和缺陷品进行分类。最有趣的部分是该模型从未接受过这方面的训练。由于其出色的通用性，它可以通过简短的描述来理解任务。 文本应用程序。五个应用程序使用 d1 进行每个决策：\n- 智能过滤器：d1 成为 SQL 查询中的函数，WHERE d1(ticket, '客户想要取消)。它对 150 个支持票证中的每一个都回答“是”或“否”。\n- 代码搜索：d1 一次浏览一个文件夹的 Hugging Face 转换器存储库（6,511 个文件），直至找到回答问题的函数。\n- 智能文件夹：d1 将每个新文档归档到一个文件夹中，然后是一个子文件夹中。它以相同的方式归档搜索问题，因此关键字搜索仅在一个子文件夹中查找。\n- 网络代理：d1 通过一句话目标运营一个航班搜索网站。在每一步中，它都会在页面允许的所有操作中选择下一个操作。\n- 上下文压缩：d1 读取编码代理会话中的每个工具输出，并保留、修剪或删除它以供下一个任务使用。它删除了 52% 的令牌并保留任务所需的每个输出。\n我们从以下开源项目中改编了其中四个应用程序：pg-jev、jevgrep、jev-ultrafast 和 fast-jev-compaction。 游戏。 d1 现场玩八场经典比赛并挑选每一步棋。愿景通过两个方式提供帮助：\n- 更好的决策：俄罗斯方块可以用文本完整描述，但添加屏幕将 d1 的分数从 70 条清除线提高到 81 条线。\n- 更简单的集成：在 Wordle 中，d1 直接从屏幕截图读取棋盘。开发者不需要编写游戏的文本版本，d1 仍然在平均 3.8 次猜测中解决了 12 场比赛中的 12 场。\nd1 还处理纯视觉任务。在 Quick, Draw! 中，它会猜测玩家的涂鸦在 62 个单词中显示的内容，并识别 6 个图画中的 5.2 个（随机猜测得到 0.6）。 供货情况和定价 立即开始使用 d1 决策模型进行构建，该模型可在 Liquid AI API 上作为 d1 获得。在 console.liquid.ai（仪表板 \u003e API 密钥）创建 API 密钥。 要使用 Vision，您只需将图像作为图像中的 Base64 数据 URL 发送即可： 导入base64、操作系统、请求 image = base64.b64encode(open(\"board.jpg\", \"rb\").read()).decode() 响应 = requests.post( “https://api.liquid.ai/decisions/v1/systemone”， headers={\"Authorization\": f\"Bearer {os.environ['LIQUID_API_KEY']}\"}, json={ “型号”：“d1”， “图像”：[f“数据：image/jpeg;base64，{image}”]， \"state\": \"生产线上电路板的摄像图像。\", “问题”： {“缺陷”：{ “类型”：“努尔”， \"instructions\": \"这个电路板有缺陷吗？\" } }, }, ） print(response.json()[\"answers\"][\"defect\"][\"noul\"]) 完整的 API 参考位于决策模型文档中。 d1 也可通过 Vercel 和 OpenRouter 获得，目前仅提供文本。愿景很快就会实现。 这是人工智能创造力和探索的激动人心的时刻，而 d1 仅仅是一个开始。我们正在继续开发各种尺寸的决策模型，并提供新功能、更高的决策质量和更低的延迟，并且我们计划很快在 Hugging Face 上发布即将推出的模型的开放权重。 尝试使用 Liquid Console阅读我们的文档 引文 如需引用，请使用以下参考文献或 BibTeX： 方法论。我们于 2026 年 10 月 5 日使用 d1 Playground 的比较脚本对每个模型运行每个应用程序一次。 GPT-6.1 Sol 和 Claude Opus 5.5 将每个请求作为一条聊天消息获取，并按照默认推理设置以 JSON 格式回答。当许多问题共享一个输入时，例如过滤器的票证或文件夹的段落，聊天模型会批量回答它们。成本使用标价，没有提示缓存折扣。 d1 的成本为每百万输入代币 0.04 美元。时间是每次运行的时间，最多可处理 8 个请求。智能过滤器运行是对 150 个工单的一次查询。智能文件夹运行文件 105 个段落，其成本为每 1,000 个段落。过滤器的质量是其针对手标签的 F1 分数，其中包括错过的和错误的匹配。其他文本应用程序会计算正确处理的目标、问题、段落或所需的输出。在设置 d1 的管道后，我们编写了 15 个代码问题中的 6 个，以及 4 个压缩会话中的两个。在目视检查中，每个模型都会看到待检查零件旁边同一条线上的良好零件。", "zh": true}, {"seq": 2, "title": "Together AI 推出 Together Link，一键在现有编码智能体中接入开源模型并降费超 50%", "source": "Together AI 研究与产品博客（RSS）", "summary": "Together AI 发布 Together Link，把团队已用的编码智能体工具连接到 Together AI 上的开源模型，宣称可节省超过 50% 支出。", "url": "https://www.together.ai/blog/together-link-frontier-quality-open-models-in-the-harness-you-already-use", "permalink": "https://aihot.news/items/ef2o8x2jh4m8n7ggsq5bc5eag", "publishedAt": "2026-10-05T00:00:00.000Z", "exact": true, "fromFeed": true, "content": "Together Link 将您的团队已使用的工具连接到 Together AI 上的最佳开放模型，并将您的支出减少 50% 以上。相同的代理，相同的工作 function pad(n){return n<10?"0"+n:""+n;}
function toBeijingHuman(iso, ref, exact){
  const d=new Date(iso); const bj=new Date(d.getTime()+8*3600*1000);
  const Y=bj.getUTCFullYear(),M=bj.getUTCMonth()+1,D=bj.getUTCDate();
  const h=bj.getUTCHours(),m=bj.getUTCMinutes(); const hh=pad(h),mm=pad(m);
  if(!exact) return M+"月"+D+"日";
  const [rY,rM,rD]=ref.split("-").map(Number);
  if(Y===rY&&M===rM&&D===rD) return "今天 "+hh+":"+mm;
  const yest=new Date(rY,rM-1,rD); yest.setDate(yest.getDate()-1);
  if(Y===yest.getFullYear()&&M===yest.getMonth()+1&&D===yest.getDate()) return "昨天 "+hh+":"+mm;
  return M+"月"+D+"日 "+hh+":"+mm;
}

function escapeHtml(s){return (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function escapeAttr(s){return escapeHtml(s);}
// 渲染正文（纯文本归档）：图片不加载远程资源，仅以文字占位符呈现；其余文本按段落转义（防 XSS）
function linkify(escaped){
  if(!escaped) return escaped;
  var re=/(\[[^\]]+\]\((https?:\/\/[^)\s]+)\))|(https?:\/\/[^\s<>"'）】」』，。、；：！？]+)/g;
  return escaped.replace(re, function(m, g1, g2, g3){
    if(g2!==undefined){
      var label=m.substring(m.indexOf('[')+1, m.indexOf(']'));
      return '<a class="r-link" href="'+g2+'" target="_blank" rel="noopener noreferrer">'+label+'</a>';
    }
    if(g3!==undefined){
      return '<a class="r-link" href="'+g3+'" target="_blank" rel="noopener noreferrer">'+g3+'</a>';
    }
    return m;
  });
}
var _IMG_RE=/!\[([^\]]*)\]\(([^)\s]+)\)/g;
function renderRich(text){
  return (text||"").split(/\n{1,}/).map(function(p){
    p=p.trim(); if(!p) return '';
    var out=''; var last=0; var m; _IMG_RE.lastIndex=0;
    while((m=_IMG_RE.exec(p))!==null){
      out+=linkify(escapeHtml(p.slice(last,m.index)));
      var cap=(m[1]||'').trim()||'图片';
      out+='<span class="r-img-cap">🖼 '+escapeHtml(cap)+'</span>';
      last=_IMG_RE.lastIndex;
    }
    out+=linkify(escapeHtml(p.slice(last)));
    return '<p>'+out+'</p>';
  }).join("");
}
function openReader(it){
  const r=document.getElementById("reader");
  const content=(it.content||"").trim();
  const body=document.getElementById("readerBody");
  if(content.length>0){
    body.innerHTML=renderRich(content);
  }else{
    const sum=(it.summary||"").trim();
    if(sum){
      // 来源站点多为付费墙 / 登录墙 / 反爬限制，无法镜像全文；展示已本地存档的中文摘要兜底
      body.innerHTML='<div class="r-fallback">⚠️ 该条新闻的<b>全文镜像暂不可用</b>（来源站点可能为付费墙 / 登录墙 / 反爬限制，或原文已失效）。下方为已<b>本地存档的中文摘要</b>，可正常查看；完整原文请点击右下角「查看原文 ↗」。</div>'+
        '<p class="r-summary">'+linkify(escapeHtml(sum))+'</p>';
    }else{
      body.innerHTML='<p class="r-empty">暂未获取到该条新闻的全文镜像与摘要。'+(it.url?'可点击右下角「查看原文 ↗」前往原始报道。':'')+'</p>';
    }
  }
  document.getElementById("readerTitle").textContent=it.title;
  document.getElementById("readerSource").textContent=it.source;
  const link=document.getElementById("readerLink");
  if(it.url){link.href=it.url;link.style.display="";}else{link.style.display="none";}
  r.hidden=false;document.body.style.overflow="hidden";
}
function closeReader(){const r=document.getElementById("reader");r.hidden=true;document.body.style.overflow="";}
document.getElementById("reader").addEventListener("click",function(e){if(e.target===this)closeReader();});
