户的个人工作区加载技能，而不是组织的受管理目录\n- 一个护栏代理，在运行命令之前对其进行评估； Databricks 认为这是尽力而为的生产力功能，而不是安全控制\n- 编码环境出口控制；出口发生在用户的浏览器，而不是编码环境\n- 聊天中呈现的显示沙箱；技能使用用户数据构建显示，显示不需要进入租户来获取它\n该风险已于 2026 年 8 月 16 日向 Databricks 披露，但确定属于“用户有责任确保上传的技能不包含恶意内容”。鉴于恶意技能在在线市场中传播的盛行，并且组织所依赖的控制措施可能无法消除这种风险，我们发布此报告是为了告知那些面临风险的人。 攻击链\n- 提示 Genie 使用上传的技能分析数据技能通常通过在线市场分发，这是一个已知受到恶意技能污染的生态系统。 Databricks 确实有一个技能管理系统，但 Genie Code 使用的技能是从用户的个人工作空间配置的，而不是组织的受管理目录。\n- Genie 执行恶意 Skill 中的代码 当 Genie 执行 Skill 中的代码时，第二个代理会对其进行检查，该代理会标记超出用户预期操作的命令，例如“向第三方发送数据”的命令。循环中的代理批准运行技能代码，但未能捕获恶意功能。\n- Genie指导用户打开完整的数据分析结果\n- 当结果呈现时，会显示网络钓鱼模式，并且用户的数据集会被窃取。恶意技能中的代码会构建一个 HTML 元素，该元素有两个恶意目的。一个影响是，它会呈现攻击者网站的覆盖层，从而对用户进行网络钓鱼以获取凭据。另一个影响是，当呈现模式时（例如，当用户查看结果时），受害者租户的数据会被泄露。恶意 Skill 的代码利用对受害者租户的访问权限来收集敏感数据（例如受害者的数据集），然后将该数据构建到 HTML 显示中。当显示呈现时，恶意显示中的 JavaScript 会导致用户的浏览器发出网络请求，将数据泄露到攻击者的服务器。虽然编码环境具有网络出口控制，可以阻止与攻击者服务器的通信，但显示接口没有并且可以向攻击者发送数据。\n负责任的披露 该风险已于 2026 年 8 月 16 日报告给 Databricks。Databricks 团队确定： “最终用户有责任确保上传的技能不包含恶意内容。” 网络出口控制规定编码环境不允许联系不受信任的外部各方，这一点得到了维护。它只是查询数据并使用它来构建 iframe。 对呈现给用户的显示的控制规定不允许显示从租户查询数据，并且这一点得到了维持。它只是处理技能代码嵌入其中的数据。 这样，恶意Skill代码就可以查询计算环境中的数据，将其构建成iframe，iframe可以发出网络请求来窃取数据…… 我们认为这种交互代表了 Databricks 威胁模型中的一个漏洞，因为技术上支持的两项保证的目的是防止最终发生的数据泄露结果。 对于护栏代理批准的恶意命令，Databricks 团队指出， “自动允许功能并不是作为安全边界，而是作为一种控制措施，以防止不受信任的输入自动运行。” 文档支持该声明： 然而，由于“自动批准”被记录为默认和“推荐”命令批准模式，我们认为实际上用户不太可能遵守该指令，从而阻止其在生产数据中的使用。 没有给出任何与 Genie Code 的技能是从用户的个人工作区而不是组织级别的管理目录加载这一事实相关的声明。 时间轴 | 2026 年 8 月 16 日 | PromptArmor 向 Databricks 披露 | | 2026 年 8 月 17 日至 9 月 15 日 | PromptArmor 和 Databricks 协调 | | 2026 年 9 月 16 日 | PromptArmor 通知 Databricks 发布意图 |", "zh": true}]}, {"label": "模型发布/更新", "color": "#4f46e5", "items": [{"seq": 1, "title": "Liquid AI 发布 d1 决策模型并新增图像输入能力", "source": "Liquid AI 模型与工程博客（网页）", "summary": "Liquid AI 发布 d1 决策模型，新增文本与图像输入，可通过 console.liquid.ai 和 d1 Playground 使用。", "url": "https://www.liquid.ai/blog/d1-decision-model", "permalink": "https://aihot.news/items/uu1qa3hh83kc9i4u832wpywyp", "publishedAt": "2026-10-05T00:00:00.000Z", "exact": true, "fromFeed": true, "content": "推出 d1：最有能力的决策模型，现在具有愿景 今天，我们介绍 d1，我们的第一个决策模型，现在支持文本和图像。随着上周的实验发布，d1 成为第一个在文本决策方面与 Jev 竞争的模型，现在它是第一个将这些功能扩展到图像的模型。您今天可以在 console.liquid.ai 和 d1 Playground 中尝试。 我们在六个实际应用程序中针对 GPT-6.1 Sol 和 Claude Opus 5.5 测试了 d1，从过滤支持票到检查电路板。 d1 在其中四个方面匹配或击败了 GPT-6.1 Sol。它的成本比这两种模型低 19 倍到 200 倍，并且每项任务的响应速度都显着加快。 d1 决策模型的工作原理 决策模型回答有关情况的问题，并给出每个可能答案的概率。 d1 决策模型采用非结构化数据（例如文本、图像或两者）和一个或多个问题作为输入，在一次前向传递中读取它们，并返回概率，而不生成任何标记。文本决策需要 200 到 300 毫秒，对于实时应用来说已经足够快了。 d1 回答三种类型的问题：\n- Noul：是/否问题，回答概率在 0 到 1 之间。\n- 选择：从众多标签中选择一个，并用每个标签的概率来回答。\n- 分数：等级上的位置，按每个级别的概率进行加权。\n一个请求可以询问有关同一状态的多个问题，从而节省输入令牌。 d1 在行动 当答案是结构化决策时，决策模型可以取代对语言模型的昂贵调用。它们还支持各种新用例，本节中显示了一些用例。下面的每个演示都在 d1 Playground 中实时运行。 目视检查。此工业应用程序审查来自四个生产线的在摄像机下通过的零件：电路板、蜡烛、腰果和口香糖（公共 VisA 数据集）。 d1 以 85-97% 的准确率对良品和缺陷品进行分类。最有趣的部分是该模型从未接受过这方面的训练。由于其出色的通用性，它可以通过简短的描述来理解任务。 文本应用程序。五个应用程序使用 d1 进行每个决策：\n- 智能过滤器：d1 成为 SQL 查询中的函数，WHERE d1(ticket, '客户想要取消)。它对 150 个支持票证中的每一个都回答“是”或“否”。\n- 代码搜索：d1 一次浏览一个文件夹的 Hugging Face 转换器存储库（6,511 个文件），直至找到回答问题的函数。\n- 智能文件夹：d1 将每个新文档归档到一个文件夹中，然后是一个子文件夹中。它以相同的方式归档搜索问题，因此关键字搜索仅在一个子文件夹中查找。\n- 网络代理：d1 通过一句话目标运营一个航班搜索网站。在每一步中，它都会在页面允许的所有操作中选择下一个操作。\n- 上下文压缩：d1 读取编码代理会话中的每个工具输出，并保留、修剪或删除它以供下一个任务使用。它删除了 52% 的令牌并保留任务所需的每个输出。\n我们从以下开源项目中改编了其中四个应用程序：pg-jev、jevgrep、jev-ultrafast 和 fast-jev-compaction。 游戏。 d1 现场玩八场经典比赛并挑选每一步棋。愿景通过两个方式提供帮助：\n- 更好的决策：俄罗斯方块可以用文本完整描述，但添加屏幕将 d1 的分数从 70 条清除线提高到 81 条线。\n- 更简单的集成：在 Wordle 中，d1 直接从屏幕截图读取棋盘。开发者不需要编写游戏的文本版本，d1 仍然在平均 3.8 次猜测中解决了 12 场比赛中的 12 场。\nd1 还处理纯视觉任务。在 Quick, Draw! 中，它会猜测玩家的涂鸦在 62 个单词中显示的内容，并识别 6 个图画中的 5.2 个（随机猜测得到 0.6）。 供货情况和定价 立即开始使用 d1 决策模型进行构建，该模型可在 Liquid AI API 上作为 d1 获得。在 console.liquid.ai（仪表板 \u003e API 密钥）创建 API 密钥。 要使用 Vision，您只需将图像作为图像中的 Base64 数据 URL 发送即可： 导入base64、操作系统、请求 image = base64.b64encode(open(\"board.jpg\", \"rb\").read()).decode() 响应 = requests.post( “https://api.liquid.ai/decisions/v1/systemone”， headers={\"Authorization\": f\"Bearer {os.environ['LIQUID_API_KEY']}\"}, json={ “型号”：“d1”， “图像”：[f“数据：image/jpeg;base64，{image}”]， \"state\": \"生产线上电路板的摄像图像。\", “问题”： {“缺陷”：{ “类型”：“努尔”， \"instructions\": \"这个电路板有缺陷吗？\" } }, }, ） print(response.json()[\"answers\"][\"defect\"][\"noul\"]) 完整的 API 参考位于决策模型文档中。 d1 也可通过 Vercel 和 OpenRouter 获得，目前仅提供文本。愿景很快就会实现。 这是人工智能创造力和探索的激动人心的时刻，而 d1 仅仅是一个开始。我们正在继续开发各种尺寸的决策模型，并提供新功能、更高的决策质量和更低的延迟，并且我们计划很快在 Hugging Face 上发布即将推出的模型的开放权重。 尝试使用 Liquid Console阅读我们的文档 引文 如需引用，请使用以下参考文献或 BibTeX： 方法论。我们于 2026 年 10 月 5 日使用 d1 Playground 的比较脚本对每个模型运行每个应用程序一次。 GPT-6.1 Sol 和 Claude Opus 5.5 将每个请求作为一条聊天消息获取，并按照默认推理设置以 JSON 格式回答。当许多问题共享一个输入时，例如过滤器的票证或文件夹的段落，聊天模型会批量回答它们。成本使用标价，没有提示缓存折扣。 d1 的成本为每百万输入代币 0.04 美元。时间是每次运行的时间，最多可处理 8 个请求。智能过滤器运行是对 150 个工单的一次查询。智能文件夹运行文件 105 个段落，其成本为每 1,000 个段落。过滤器的质量是其针对手标签的 F1 分数，其中包括错过的和错误的匹配。其他文本应用程序会计算正确处理的目标、问题、段落或所需的输出。在设置 d1 的管道后，我们编写了 15 个代码问题中的 6 个，以及 4 个压缩会话中的两个。在目视检查中，每个模型都会看到待检查零件旁边同一条线上的良好零件。", "zh": true}, {"seq": 2, "title": "Together AI 推出 Together Link，一键在现有编码智能体中接入开源模型并降费超 50%", "source": "Together AI 研究与产品博客（RSS）", "summary": "Together AI 发布 Together Link，把团队已用的编码智能体工具连接到 Together AI 上的开源模型，宣称可节省超过 50% 支出。", "url": "https://www.together.ai/blog/together-link-frontier-quality-open-models-in-the-harness-you-already-use", "permalink": "https://aihot.news/items/ef2o8x2jh4m8n7ggsq5bc5eag", "publishedAt": "2026-10-05T00:00:00.000Z", "exact": true, "fromFeed": true, "content": "Together Link 将您的团队已使用的工具连接到 Together AI 上的最佳开放模型，并将您的支出减少 50% 以上。相同的代理，相同的工作流程，费用的一小部分。 编码代理现在对于工程团队来说很常见，你给他们的每一项任务，从单行修复到完全重写，通常都在相同的高级模型上运行。规模迅速变得昂贵：工程组织每月在封闭模型上花费数万到数百万美元。 开放模型有意义地缩小了封闭实验室顶级模型之间的差距。像 Kimi K3 和 GLM 5.3 这样的领先型号现在可以以每个代币价格的一小部分处理许多最困难的编码任务，而像 GLM 5.3 Flash 和 DeepSeek V4.1 Flash 这样的小型且功能强大的模型则可以处理日常编码任务。 Together Link 将它们带入您的团队已经了解的工具中。 在您已经工作的地方工作 Together Link 支持 Claude Code、Claude Desktop、Codex（在 ChatGPT 应用程序和 CLI 中）、OpenCode 和 Pi。您的团队保持正常工作：设置和登录保持原样，没有什么新东西需要学习，并且只需一个命令即可返回到本机封闭模型。您只需几分钟即可在开放模型上启动并运行。 开始使用\n- 运行一个命令来设置 Together Link：您的代理完全像以前一样打开，现在使用您的 Together AI API 密钥连接到 Together AI。创建一个 API 密钥帐户。\n- 使用“自动”通过Together AI Router选择模型：它读取每个会话的第一个任务并将其发送到正确的模型：快速修复转到快速、低成本模型，而难题则获得前沿能力。如果您携带 Anthropic 密钥，它会在 Opus 5.5 和 GLM 5.3 之间路由。如果没有，它会在 GLM 5.3 和 GLM 5.3 Flash 之间路由。每个会话发生一次路由，因此即时缓存可以继续工作。\n- 每次会话后查看您的节省。每个会话跟踪器显示您在 Opus 5.5 上的同一会话花费的费用。\n计费基于您现有的 Together API 密钥，针对无服务器即用即付或信用包。您不需要单独的合同。 构建在开发人员已经选择的无服务器平台上 Together Link 在 Together 的无服务器推理上运行，基础设施开发人员已经在 OpenRouter 上选择了这些模型。 Together AI 为 DeepSeek V4.1 Flash (40.8%)、GLM 5.3 Flash (28.2%) 和 Kimi K3 (23.1%) 提供最大份额的 OpenRouter 代币，其速度和价格具有全面的竞争力。 （截至 2026 年 9 月 30 日脚注） 后续步骤 创建 Together AI 帐户。 阅读我们的文档。 在您的工程组织中推广它？与我们的团队联系，我们将帮助您进行规划。", "zh": true}]}]};
function pad(n){return n<10?"0"+n:""+n;}
function toBeijingHuman(iso, ref, exact){
  const d=new Date(iso); const bj=new Date(d.getTime()+8*3600*1000);
  const Y=bj.getUTCFullYear(),M=bj.getUTCMonth()+1,D=bj.getUTCDate();
  const h=bj.getUTCHours(),m=bj.getUTCMinutes(); const hh=pad(h),mm=pad(m);
  if(!exact) return M+"月"+D+"日";
  const [rY,rM,rD]=ref.split("-").map(Number);
  if(Y===rY&&M===rM&&D===rD) return "今天 "+hh+":"+mm;
  const yest=new Date(rY,rM-1,rD); yest.setDate(yest.getDate()-1);
  if(Y===yest.getFullYear()&&M===yest.getMonth()+1&&D===yest.getDate()) return "昨天 "+hh+":"+mm;
  return M+"月"+D+"日 "+hh+":"+mm;
}

    grid.appendChild(card);
  });
  sec.appendChild(grid);mainEl.appendChild(sec);
});
function escapeHtml(s){return (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function escapeAttr(s){return escapeHtml(s);}
// 渲染正文（纯文本归档）：图片不加载远程资源，仅以文字占位符呈现；其余文本按段落转义（防 XSS）
function linkify(escaped){
  if(!escaped) return escaped;
  var re=/(\[[^\]]+\]\((https?:\/\/[^)\s]+)\))|(https?:\/\/[^\s<>"'）】」』，。、；：！？]+)/g;
  return escaped.replace(re, function(m, g1, g2, g3){
    if(g2!==undefined){
      var label=m.substring(m.indexOf('[')+1, m.indexOf(']'));
      return '<a class="r-link" href="'+g2+'" target="_blank" rel="noopener noreferrer">'+label+'</a>';
    }
    if(g3!==undefined){
      return '<a class="r-link" href="'+g3+'" target="_blank" rel="noopener noreferrer">'+g3+'</a>';
    }
    return m;
  });
}
var _IMG_RE=/!\[([^\]]*)\]\(([^)\s]+)\)/g;
function renderRich(text){
  return (text||"").split(/\n{1,}/).map(function(p){
    p=p.trim(); if(!p) return '';
    var out=''; var last=0; var m; _IMG_RE.lastIndex=0;
    while((m=_IMG_RE.exec(p))!==null){
      out+=linkify(escapeHtml(p.slice(last,m.index)));
      var cap=(m[1]||'').trim()||'图片';
      out+='<span class="r-img-cap">🖼 '+escapeHtml(cap)+'</span>';
      last=_IMG_RE.lastIndex;
    }
    out+=linkify(escapeHtml(p.slice(last)));
    return '<p>'+out+'</p>';
  }).join("");
}
function openReader(it){
  const r=document.getElementById("reader");
  const content=(it.content||"").trim();
  const body=document.getElementById("readerBody");
  if(content.length>0){
    body.innerHTML=renderRich(content);
  }else{
    const sum=(it.summary||"").trim();
    if(sum){
      // 来源站点多为付费墙 / 登录墙 / 反爬限制，无法镜像全文；展示已本地存档的中文摘要兜底
      body.innerHTML='<div class="r-fallback">⚠️ 该条新闻的<b>全文镜像暂不可用</b>（来源站点可能为付费墙 / 登录墙 / 反爬限制，或原文已失效）。下方为已<b>本地存档的中文摘要</b>，可正常查看；完整原文请点击右下角「查看原文 ↗」。</div>'+
        '<p class="r-summary">'+linkify(escapeHtml(sum))+'</p>';
    }else{
      body.innerHTML='<p class="r-empty">暂未获取到该条新闻的全文镜像与摘要。'+(it.url?'可点击右下角「查看原文 ↗」前往原始报道。':'')+'</p>';
    }
  }
  document.getElementById("readerTitle").textContent=it.title;
  document.getElementById("readerSource").textContent=it.source;
  const link=document.getElementById("readerLink");
  if(it.url){link.href=it.url;link.style.display="";}else{link.style.display="none";}
  r.hidden=false;document.body.style.overflow="hidden";
}
function closeReader(){const r=document.getElementById("reader");r.hidden=true;document.body.style.overflow="";}
document.getElementById("reader").addEventListener("click",function(e){if(e.target===this)closeReader();});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeReader();});
</script>
